# 毎日1本、キューの台本からSCP漫画を生成してコミットする（詳細はREADME.md）
name: Generate SCP Comic

on:
  schedule:
    - cron: '0 21 * * *'   # 毎日 6:00 JST
  workflow_dispatch:
    inputs:
      comic_id:
        description: '特定の台本ID (例: scp-999)。空ならキュー先頭から'
        required: false
        default: ''
      count:
        description: 'キューから処理する本数'
        required: false
        default: '1'

concurrency:
  group: generate-comic
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache fonts
        uses: actions/cache@v4
        with:
          path: fonts
          key: fonts-${{ hashFiles('config/languages.yaml') }}

      - name: Download fonts
        run: python scripts/download_fonts.py

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          COMIC_ID: ${{ github.event.inputs.comic_id }}
          COUNT: ${{ github.event.inputs.count }}
        run: |
          if [ -n "$COMIC_ID" ]; then
            python scripts/run_pipeline.py --id "$COMIC_ID"
          else
            python scripts/run_pipeline.py --from-queue --count "${COUNT:-1}"
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output comics index.json state
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Generate comic ($(date -u +%Y-%m-%d))"
            git push
          fi
