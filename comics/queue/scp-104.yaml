local_characters:
  flea-market-seller:
    name: "Flea Market Seller"
    description: >
      A scruffy middle-aged man in a faded plaid shirt (color RGB
      120,90,60) and a worn baseball cap, an anxious, relieved grin on
      his face, clutching an old bowling bag.

characters: [attending-researcher-f, attending-researcher-m, flea-market-seller]

panels:
  - scene: >
      Close-up, on a glass sphere resting on a velvet cushion in a
      display case, intricate thin black-and-white line patterns
      visible swirling beneath the glass surface. attending-researcher-f
      leans close studying the design, an entranced, puzzled expression
      on her face.
    characters: [attending-researcher-f]
    caption:
      ja: "SCP-104は周囲35.5cmの球体である。外側はガラス製で非常に滑らかである。その層の下には、極めて緻密な黒と白の細線からなる意匠が施されている。その意匠自体は想像を絶するほど複雑であり、一種のロールシャッハ・テストのように機能するらしく、見る者ごとに異なる解釈をするようである。"
      en: "SCP-104 is a sphere, 35.5 cm around. The outside is glass and very smooth. Under this layer is an extremely intricate design of very thin black and white lines. The design itself is unimaginably complex and seems to form something of a Rorschach test, as all viewers seem to have a different interpretation."
      cs: "SCP-104 je koule s obvodem 35,5 cm. Vnější vrstva je skleněná a velmi hladká. Pod touto vrstvou se nachází nesmírně propracovaný vzor tvořený velmi tenkými černými a bílými liniemi. Samotný vzor je nepředstavitelně složitý a zdá se, že funguje jako jakýsi Rorschachův test, protože se zdá, že každý divák jej vykládá jinak."
      de: "SCP-104 ist eine Kugel mit einem Umfang von 35,5 cm. Die Außenseite besteht aus Glas und ist sehr glatt. Unter dieser Schicht befindet sich ein äußerst kompliziertes Muster aus sehr feinen schwarzen und weißen Linien. Das Muster selbst ist unvorstellbar komplex und scheint eine Art Rorschach-Test darzustellen, da jeder Betrachter eine andere Interpretation zu haben scheint."
      es: "SCP-104 es una esfera de 35,5 cm de circunferencia. El exterior es de vidrio y muy liso. Bajo esta capa hay un diseño extremadamente intrincado de líneas muy finas en blanco y negro. El diseño en sí es inimaginablemente complejo y parece formar una especie de test de Rorschach, ya que todos los observadores parecen tener una interpretación diferente."
      fr: "Le SCP-104 est une sphère de 35,5 cm de circonférence. L'extérieur est en verre et très lisse. Sous cette couche se trouve un motif extrêmement complexe de fines lignes noires et blanches. Le motif lui-même est incroyablement complexe et semble former une sorte de test de Rorschach, chaque observateur semblant en avoir une interprétation différente."
      it: "SCP-104 è una sfera di 35,5 cm di circonferenza. L'esterno è di vetro e molto liscio. Sotto questo strato si trova un disegno estremamente intricato di sottilissime linee bianche e nere. Il disegno stesso è incredibilmente complesso e sembra formare una sorta di test di Rorschach, poiché ogni osservatore sembra averne un'interpretazione diversa."
      ko: "SCP-104는 둘레 35.5cm의 구체이다. 외부는 유리로 되어 있으며 매우 매끄럽다. 이 층 아래에는 매우 가는 흑백 선으로 이루어진 극도로 정교한 문양이 있다. 그 문양 자체는 상상할 수 없을 만큼 복잡하며, 일종의 로르샤흐 테스트처럼 작용하는 듯, 모든 관찰자가 저마다 다른 해석을 내놓는 것으로 보인다."
      pl: "SCP-104 to kula o obwodzie 35,5 cm. Zewnętrzna powłoka jest szklana i bardzo gładka. Pod tą warstwą znajduje się niezwykle misterny wzór z bardzo cienkich czarnych i białych linii. Sam wzór jest niewyobrażalnie złożony i wydaje się tworzyć coś w rodzaju testu Rorschacha, ponieważ każdy obserwator wydaje się mieć inną interpretację."
      pt: "O SCP-104 é uma esfera com 35,5 cm de circunferência. O exterior é de vidro e muito liso. Sob essa camada há um desenho extremamente intrincado de linhas pretas e brancas muito finas. O desenho em si é inimaginavelmente complexo e parece formar uma espécie de teste de Rorschach, já que todos os observadores parecem ter uma interpretação diferente."
      th: "SCP-104 คือทรงกลมที่มีเส้นรอบวง 35.5 ซม. ด้านนอกทำจากแก้วและเรียบมาก ใต้ชั้นนี้มีลวดลายที่ประณีตอย่างยิ่งซึ่งประกอบด้วยเส้นสีดำและขาวที่บางมาก ตัวลวดลายเองมีความซับซ้อนอย่างเหลือเชื่อและดูเหมือนจะเป็นการทดสอบรอร์ชาคชนิดหนึ่ง เนื่องจากผู้พบเห็นแต่ละคนดูเหมือนจะตีความแตกต่างกัน"
      uk: "SCP-104 — це сфера з обхватом 35,5 см. Зовнішня поверхня скляна і дуже гладка. Під цим шаром знаходиться надзвичайно складний малюнок з дуже тонких чорних і білих ліній. Сам малюнок неймовірно складний і, здається, утворює щось на кшталт тесту Роршаха, оскільки кожен спостерігач, схоже, має власне тлумачення."
      vi: "SCP-104 là một quả cầu có chu vi 35,5 cm. Bề ngoài làm bằng thủy tinh và rất nhẵn. Bên dưới lớp này là một hoa văn cực kỳ tinh xảo gồm những đường kẻ đen trắng rất mảnh. Bản thân hoa văn này phức tạp đến khó tưởng tượng và dường như tạo thành một dạng bài kiểm tra Rorschach, vì mỗi người xem dường như có một cách diễn giải khác nhau."
      zh: "SCP-104是一个周长35.5厘米的球体。外层是非常光滑的玻璃。这层玻璃下方是一种极其精细的黑白线条图案。这个图案本身复杂得难以想象，似乎构成了一种罗夏墨迹测验，因为每位观察者似乎都会得出不同的解读。"
      zh_Hant: "SCP-104是一個周長35.5公分的球體。外層是非常光滑的玻璃。這層玻璃下方是一種極其精細的黑白線條圖案。這個圖案本身複雜得難以想像，似乎構成了一種羅夏墨跡測驗，因為每位觀察者似乎都會得出不同的解讀。"

  - scene: >
      Wide shot, full body, a different framing from the close-up
      before, in a long facility hallway. attending-researcher-m walks
      briskly away, glancing over his shoulder in alarm as the sphere
      sits motionlessly on the floor exactly two meters behind him,
      having just instantaneously appeared there.
    characters: [attending-researcher-m]
    caption:
      ja: "人間が『未刻印』状態のSCP-104に触れると、それはその人物に『刻印』される。刻印された人物がSCP-104から9m以上離れた状態が5分を超えると、SCP-104はその人物から2m以内の場所に出現する。刻印された人物がSCP-104から9m以内に留まっている間、1時間ごとにSCP-104はその人物に約30cmずつ近づき、やがて接触するまで続く。"
      en: "Whenever a human touches SCP-104 in its 'Unimprinted' state, it will 'Imprint' on the subject. If the imprinted subject moves more than 9 m from SCP-104 for more than five minutes, SCP-104 will appear within 2 m of the imprinted subject. Every hour that the subject remains within 9 m of SCP-104, it will move one foot closer to the subject until it is touching the subject."
      cs: "Kdykoli se člověk dotkne SCP-104 v jeho „neotištěném“ stavu, „otiskne se“ na daném subjektu. Pokud se otisknutý subjekt vzdálí od SCP-104 na více než 9 m po dobu delší než pět minut, SCP-104 se objeví do 2 m od otisknutého subjektu. Každou hodinu, kdy subjekt zůstává do 9 m od SCP-104, se přiblíží o třicet centimetrů blíže k subjektu, dokud se ho nedotkne."
      de: "Wann immer ein Mensch SCP-104 in seinem „nicht geprägten“ Zustand berührt, wird es sich auf diese Person „prägen“. Entfernt sich die geprägte Person länger als fünf Minuten mehr als 9 m von SCP-104, erscheint SCP-104 innerhalb von 2 m der geprägten Person. Für jede Stunde, die die Person innerhalb von 9 m von SCP-104 verbleibt, rückt es ihr um dreißig Zentimeter näher, bis es sie berührt."
      es: "Cada vez que un humano toca al SCP-104 en su estado 'no impregnado', este se 'impregnará' en el sujeto. Si el sujeto impregnado se aleja más de 9 m del SCP-104 durante más de cinco minutos, el SCP-104 aparecerá a menos de 2 m del sujeto impregnado. Por cada hora que el sujeto permanezca dentro de los 9 m del SCP-104, este se acercará treinta centímetros más al sujeto hasta tocarlo."
      fr: "Chaque fois qu'un humain touche le SCP-104 dans son état « non imprégné », il « s'imprègne » du sujet. Si le sujet imprégné s'éloigne de plus de 9 m du SCP-104 pendant plus de cinq minutes, le SCP-104 apparaîtra à moins de 2 m du sujet imprégné. Chaque heure durant laquelle le sujet reste dans un rayon de 9 m du SCP-104, celui-ci se rapproche de trente centimètres du sujet, jusqu'à le toucher."
      it: "Ogni volta che un essere umano tocca SCP-104 nel suo stato 'non impresso', esso si 'imprimerà' sul soggetto. Se il soggetto impresso si allontana più di 9 m da SCP-104 per più di cinque minuti, SCP-104 apparirà entro 2 m dal soggetto impresso. Per ogni ora in cui il soggetto rimane entro 9 m da SCP-104, esso si avvicinerà di trenta centimetri al soggetto, fino a toccarlo."
      ko: "인간이 '각인되지 않은' 상태의 SCP-104를 만지면, 그것은 그 사람에게 '각인'된다. 각인된 사람이 SCP-104로부터 9m 이상 떨어진 채로 5분을 넘기면, SCP-104는 그 사람으로부터 2m 이내의 위치에 나타난다. 각인된 사람이 SCP-104로부터 9m 이내에 머무는 매 시간마다, 그것은 그 사람에게 30센티미터씩 다가가며, 마침내 닿을 때까지 계속된다."
      pl: "Za każdym razem, gdy człowiek dotknie SCP-104 w jego stanie „nieutrwalonym”, „utrwali się” na tej osobie. Jeśli utrwalona osoba oddali się od SCP-104 na ponad 9 m na dłużej niż pięć minut, SCP-104 pojawi się w promieniu 2 m od tej osoby. Za każdą godzinę, w której osoba pozostaje w promieniu 9 m od SCP-104, przybliża się ono o trzydzieści centymetrów do osoby, aż jej dotknie."
      pt: "Sempre que um humano toca o SCP-104 em seu estado 'não impresso', ele se 'imprimirá' no sujeito. Se o sujeito impresso se afastar mais de 9 m do SCP-104 por mais de cinco minutos, o SCP-104 aparecerá dentro de 2 m do sujeito impresso. A cada hora que o sujeito permanecer dentro de 9 m do SCP-104, ele se aproximará trinta centímetros do sujeito, até tocá-lo."
      th: "เมื่อใดก็ตามที่มนุษย์สัมผัส SCP-104 ในสถานะ 'ยังไม่ประทับ' มันจะ 'ประทับ' ลงบนบุคคลนั้น หากบุคคลที่ถูกประทับเคลื่อนที่ห่างจาก SCP-104 มากกว่า 9 เมตรเป็นเวลานานกว่าห้านาที SCP-104 จะปรากฏขึ้นภายในระยะ 2 เมตรจากบุคคลนั้น ทุกๆ ชั่วโมงที่บุคคลนั้นยังอยู่ภายในระยะ 9 เมตรจาก SCP-104 มันจะเคลื่อนเข้าใกล้บุคคลนั้นทีละสามสิบเซนติเมตร จนกระทั่งสัมผัสกับบุคคลนั้น"
      uk: "Щоразу, коли людина торкається SCP-104 у його «невідбитому» стані, він «відбивається» на суб'єкті. Якщо відбитий суб'єкт відходить більш ніж на 9 м від SCP-104 більше ніж на п'ять хвилин, SCP-104 з'являється в межах 2 м від відбитого суб'єкта. Кожну годину, коли суб'єкт залишається в межах 9 м від SCP-104, він наближається до суб'єкта на тридцять сантиметрів, поки не торкнеться його."
      vi: "Bất cứ khi nào một người chạm vào SCP-104 ở trạng thái 'chưa in dấu', nó sẽ 'in dấu' lên đối tượng đó. Nếu đối tượng bị in dấu di chuyển ra xa hơn 9 m khỏi SCP-104 trong hơn năm phút, SCP-104 sẽ xuất hiện trong phạm vi 2 m của đối tượng bị in dấu. Mỗi giờ mà đối tượng ở trong phạm vi 9 m của SCP-104, nó sẽ di chuyển gần hơn ba mươi centimet về phía đối tượng cho đến khi chạm vào đối tượng."
      zh: "每当有人触碰处于「未印记」状态的SCP-104时，它便会对该对象进行「印记」。若被印记的对象离开SCP-104超过9米并持续超过五分钟，SCP-104便会瞬间出现在该对象2米范围内。此后，被印记者每在SCP-104的9米范围内停留一小时，SCP-104便会向其靠近约三十厘米，直至与其接触为止。"
      zh_Hant: "每當有人觸碰處於「未印記」狀態的SCP-104時，它便會對該對象進行「印記」。若被印記的對象離開SCP-104超過9公尺並持續超過五分鐘，SCP-104便會瞬間出現在該對象2公尺範圍內。此後，被印記者每在SCP-104的9公尺範圍內停留一小時，SCP-104便會向其靠近約三十公分，直至與其接觸為止。"

  - scene: >
      Medium shot, waist-up, a different framing from the wide shot
      before, beside a smoking incinerator chute with ash settling. The
      sphere sits right beside it on the floor, perfectly whole and
      undamaged, gleaming as if nothing happened.
      attending-researcher-f stares at it in disbelief, singed gloves
      in hand.
    characters: [attending-researcher-f]
    caption:
      ja: "SCP-104はまた、破壊不能であるように見える。粉砕・焼却された後でも、刻印された人物が最小範囲外に5分を超えて留まれば、SCP-104は無傷のまま再び出現する。SCP-104はほとんどの被験者に偏執症と怒りを引き起こす。"
      en: "SCP-104 also appears to be indestructible. Even after being crushed and incinerated, SCP-104 will reappear whole and undamaged if its imprinted subject is outside of its minimum range for more than five minutes. SCP-104 causes paranoia and anger in most subjects."
      cs: "SCP-104 se také zdá být nezničitelné. I po rozdrcení a spálení se SCP-104 znovu objeví celé a nepoškozené, pokud je jeho otisknutý subjekt mimo minimální dosah po dobu delší než pět minut. SCP-104 vyvolává u většiny subjektů paranoiu a hněv."
      de: "SCP-104 scheint außerdem unzerstörbar zu sein. Selbst nach dem Zerdrücken und Verbrennen erscheint SCP-104 unversehrt und unbeschädigt erneut, wenn sich die geprägte Person länger als fünf Minuten außerhalb der Mindestreichweite befindet. SCP-104 verursacht bei den meisten Testpersonen Paranoia und Wut."
      es: "El SCP-104 también parece ser indestructible. Incluso después de ser aplastado e incinerado, el SCP-104 reaparecerá entero e intacto si su sujeto impregnado está fuera de su rango mínimo durante más de cinco minutos. El SCP-104 provoca paranoia e ira en la mayoría de los sujetos."
      fr: "Le SCP-104 semble également indestructible. Même après avoir été écrasé et incinéré, le SCP-104 réapparaîtra intact et non endommagé si son sujet imprégné se trouve hors de sa portée minimale pendant plus de cinq minutes. Le SCP-104 provoque paranoïa et colère chez la plupart des sujets."
      it: "SCP-104 sembra anche essere indistruttibile. Anche dopo essere stato schiacciato e incenerito, SCP-104 riapparirà intatto e integro se il soggetto impresso si trova al di fuori del suo raggio minimo per più di cinque minuti. SCP-104 causa paranoia e rabbia nella maggior parte dei soggetti."
      ko: "SCP-104는 또한 파괴 불가능한 것으로 보인다. 짓눌리거나 소각된 후에도, 각인된 사람이 최소 범위 밖에 5분 넘게 있으면 SCP-104는 온전한 모습으로 다시 나타난다. SCP-104는 대부분의 피험자에게 편집증과 분노를 일으킨다."
      pl: "SCP-104 wydaje się być również niezniszczalne. Nawet po zmiażdżeniu i spaleniu, SCP-104 pojawi się ponownie w całości i bez uszkodzeń, jeśli utrwalona osoba znajdzie się poza jego minimalnym zasięgiem na dłużej niż pięć minut. SCP-104 wywołuje paranoję i gniew u większości badanych."
      pt: "O SCP-104 também parece ser indestrutível. Mesmo depois de ser esmagado e incinerado, o SCP-104 reaparecerá inteiro e intacto se o sujeito impresso estiver fora de seu alcance mínimo por mais de cinco minutos. O SCP-104 causa paranoia e raiva na maioria dos sujeitos."
      th: "SCP-104 ยังดูเหมือนจะไม่สามารถทำลายได้ แม้จะถูกบดขยี้และเผาไปแล้ว SCP-104 จะปรากฏขึ้นใหม่อย่างสมบูรณ์และไม่เสียหาย หากบุคคลที่ถูกประทับอยู่นอกระยะขั้นต่ำนานกว่าห้านาที SCP-104 ทำให้ผู้ทดลองส่วนใหญ่เกิดอาการหวาดระแวงและโกรธเกรี้ยว"
      uk: "SCP-104 також, здається, є незнищенним. Навіть після подрібнення та спалення, SCP-104 знову з'являється цілим і неушкодженим, якщо відбитий суб'єкт перебуває поза межами мінімального радіуса понад п'ять хвилин. SCP-104 викликає параною та гнів у більшості суб'єктів."
      vi: "SCP-104 cũng dường như bất khả hủy diệt. Ngay cả sau khi bị nghiền nát và thiêu hủy, SCP-104 sẽ xuất hiện trở lại nguyên vẹn và không hư hại nếu đối tượng bị in dấu ở ngoài phạm vi tối thiểu trong hơn năm phút. SCP-104 gây ra chứng hoang tưởng và giận dữ ở hầu hết các đối tượng."
      zh: "SCP-104似乎也是不可摧毁的。即便被压碎或焚烧，只要被印记者离开最小范围超过五分钟，SCP-104都会完好无损地重新出现。SCP-104会使大多数受试者产生偏执与愤怒的情绪。"
      zh_Hant: "SCP-104似乎也是不可摧毀的。即便被壓碎或焚燒，只要被印記者離開最小範圍超過五分鐘，SCP-104都會完好無損地重新出現。SCP-104會使大多數受試者產生偏執與憤怒的情緒。"

  - scene: >
      Wide shot, a different framing from the medium shot before, at a
      lively flea market stall. On the left, attending-researcher-m
      holds out a single coin. On the right, flea-market-seller hands
      over an old bowling bag with the sphere inside, a relieved grin
      on his face, already turning to hurry away.
    characters: [attending-researcher-m, flea-market-seller]
    caption:
      ja: "SCP-104は、ボウリングバッグに入れて持ち歩いていた男から、蚤の市で回収された。男は自分の身元を明かすことなく、25セント硬貨1枚で███████捜査官に売り渡すと、何度も感謝の言葉を述べながら走り去った。"
      en: "SCP-104 was recovered in a flea market from a man carrying it in a bowling bag. The man never identified himself and sold it to Agent ███████ for a quarter, thanking him profusely before running off."
      cs: "SCP-104 bylo získáno na bleším trhu od muže, který jej nesl v taška na bowlingové koule. Muž se nikdy nepředstavil a prodal jej agentovi ███████ za čtvrťák, mnohokrát mu poděkoval a poté utekl."
      de: "SCP-104 wurde auf einem Flohmarkt von einem Mann geborgen, der es in einer Bowlingtasche mit sich trug. Der Mann identifizierte sich nie und verkaufte es Agent ███████ für einen Vierteldollar, wobei er sich überschwänglich bedankte, bevor er davonlief."
      es: "El SCP-104 fue recuperado en un mercadillo de un hombre que lo llevaba en una bolsa de bolos. El hombre nunca se identificó y se lo vendió al Agente ███████ por veinticinco centavos, agradeciéndole profusamente antes de salir corriendo."
      fr: "Le SCP-104 a été récupéré dans un marché aux puces auprès d'un homme qui le transportait dans un sac de bowling. L'homme ne s'est jamais identifié et l'a vendu à l'Agent ███████ pour vingt-cinq cents, le remerciant chaleureusement avant de s'enfuir."
      it: "SCP-104 è stato recuperato in un mercatino delle pulci da un uomo che lo portava in una sacca da bowling. L'uomo non si è mai identificato e lo ha venduto all'Agente ███████ per venticinque centesimi, ringraziandolo profusamente prima di scappare via."
      ko: "SCP-104는 볼링백에 넣어 들고 다니던 한 남자로부터 벼룩시장에서 회수되었다. 그 남자는 자신의 신원을 전혀 밝히지 않고 ███████ 요원에게 25센트 동전 한 닢에 그것을 팔고는, 몇 번이고 감사 인사를 하며 급히 뛰어가 버렸다."
      pl: "SCP-104 zostało odzyskane na pchlim targu od mężczyzny, który nosił je w torbie do kręgli. Mężczyzna nigdy się nie przedstawił i sprzedał je Agentowi ███████ za ćwierć dolara, dziękując mu wylewnie, po czym uciekł."
      pt: "O SCP-104 foi recuperado em um mercado de pulgas de um homem que o carregava em uma bolsa de boliche. O homem nunca se identificou e o vendeu ao Agente ███████ por vinte e cinco centavos, agradecendo-lhe profusamente antes de sair correndo."
      th: "SCP-104 ถูกกู้คืนมาจากตลาดนัดของเก่า จากชายคนหนึ่งที่ถือมันอยู่ในกระเป๋าโบว์ลิ่ง ชายคนนั้นไม่เคยเปิดเผยตัวตนและขายมันให้กับเจ้าหน้าที่ ███████ ในราคาเพียงยี่สิบห้าเซนต์ พร้อมกล่าวขอบคุณอย่างท่วมท้นก่อนจะวิ่งหนีไป"
      uk: "SCP-104 було знайдено на блошиному ринку у чоловіка, який ніс його в сумці для боулінгу. Чоловік так і не назвав себе і продав його агенту ███████ за монету в чверть долара, щиро дякуючи, перш ніж кинутися тікати."
      vi: "SCP-104 được thu hồi tại một khu chợ trời từ một người đàn ông đang mang nó trong túi bowling. Người đàn ông không bao giờ tiết lộ danh tính và đã bán nó cho Đặc vụ ███████ với giá 25 xu, cảm ơn rối rít trước khi bỏ chạy."
      zh: "SCP-104是在跳蚤市场从一名用保龄球包携带它的男子手中回收的。该男子始终未透露身份，以25美分的价格将其卖给了████████特工，并连连道谢后便匆匆跑开。"
      zh_Hant: "SCP-104是在跳蚤市場從一名用保齡球袋攜帶它的男子手中回收的。該男子始終未透露身份，以25美分的價格將其賣給了████████特工，並連連道謝後便匆匆跑開。"
