# SCP-043 4コマ台本
# captionはDescription本文からの引用のみ（Special Containment Proceduresは
# 収容不要のため題材にできる情報が薄く、簡潔な記述のみ）。キャラにセリフは
# 言わせない。JP公式訳が直接取得できなかったため、検証済みの英語本文からの
# 翻訳（ja含む）。

