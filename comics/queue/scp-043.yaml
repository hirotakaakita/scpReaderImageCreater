characters: [attending-researcher-m, attending-researcher-f]

panels:
  - scene: >
      Close-up, filling most of the frame, on a vinyl record held up to
      the light by attending-researcher-m, its surface eerily smooth
      and glossy with no visible grooves at all, a turntable waiting on
      a table nearby.
    characters: [attending-researcher-m]
    caption:
      ja: "SCP-043はビートルズの『ホワイト・アルバム』のレコード盤のように見える。しかし、よく調べてみると、そのレコードには溝が一切ない。それにもかかわらず、針をどの位置に置いても、レコードは最初から最後まで再生される。"
      en: "SCP-043 appears to be a vinyl copy of 'The White Album' by the Beatles; however, upon closer inspection, the record has no grooves. In spite of this, the record will play from start to finish regardless of the starting position of the needle."
      cs: "SCP-043 vypadá jako vinylová deska 'Bílého alba' od Beatles; při bližším zkoumání však deska nemá žádné drážky. Přesto se deska přehraje od začátku do konce bez ohledu na výchozí polohu jehly."
      de: "SCP-043 erscheint als eine Vinyl-Kopie des 'White Album' der Beatles; bei näherer Betrachtung besitzt die Platte jedoch keine Rillen. Trotzdem spielt die Platte von Anfang bis Ende, unabhängig von der Startposition der Nadel."
      es: "SCP-043 parece ser una copia en vinilo del 'Álbum Blanco' de los Beatles; sin embargo, al examinarlo más de cerca, el disco no tiene surcos. A pesar de ello, el disco se reproducirá de principio a fin sin importar la posición inicial de la aguja."
      fr: "Le SCP-043 semble être une copie vinyle du « White Album » des Beatles ; cependant, en y regardant de plus près, le disque n'a pas de sillons. Malgré cela, le disque se joue du début à la fin, quelle que soit la position de départ de l'aiguille."
      it: "SCP-043 sembra essere una copia in vinile del 'White Album' dei Beatles; tuttavia, a un esame più attento, il disco non presenta solchi. Nonostante ciò, il disco suonerà dall'inizio alla fine indipendentemente dalla posizione di partenza della puntina."
      ko: "SCP-043은 비틀즈의 '화이트 앨범' 바이닐 레코드처럼 보인다. 그러나 자세히 살펴보면, 이 레코드에는 홈이 전혀 없다. 그럼에도 불구하고, 바늘의 시작 위치와 상관없이 레코드는 처음부터 끝까지 재생된다."
      pl: "SCP-043 wygląda jak winylowa kopia 'Białego Albumu' zespołu The Beatles; jednak przy bliższym oglądzie okazuje się, że płyta nie ma rowków. Mimo to płyta odtwarza się od początku do końca, niezależnie od pozycji startowej igły."
      pt: "O SCP-043 parece ser uma cópia em vinil do 'Álbum Branco' dos Beatles; no entanto, ao examinar mais de perto, o disco não possui sulcos. Apesar disso, o disco toca do início ao fim, independentemente da posição inicial da agulha."
      th: "SCP-043 มีลักษณะเหมือนแผ่นเสียงไวนิลของอัลบั้ม 'The White Album' ของวง The Beatles อย่างไรก็ตาม เมื่อตรวจสอบอย่างใกล้ชิด แผ่นเสียงนี้ไม่มีร่องเลย แม้จะเป็นเช่นนั้น แผ่นเสียงจะเล่นตั้งแต่ต้นจนจบไม่ว่าตำแหน่งเริ่มต้นของเข็มจะอยู่ที่ใด"
      uk: "SCP-043 виглядає як вінілова копія 'Білого альбому' The Beatles; однак при уважнішому огляді на платівці немає доріжок. Попри це, платівка програється від початку до кінця незалежно від початкового положення голки."
      vi: "SCP-043 trông giống như một bản sao đĩa nhựa của 'The White Album' của ban nhạc Beatles; tuy nhiên, khi xem xét kỹ hơn, đĩa nhạc này không có rãnh nào cả. Dù vậy, đĩa nhạc vẫn phát từ đầu đến cuối bất kể vị trí ban đầu của kim."
      zh: "SCP-043外观是披头士乐队《白色专辑》的黑胶唱片，然而仔细检查后发现，这张唱片上没有任何唱纹。尽管如此，无论唱针从哪个位置开始，唱片都会从头播放到尾。"
      zh_Hant: "SCP-043外觀是披頭四樂團《白色專輯》的黑膠唱片，然而仔細檢查後發現，這張唱片上沒有任何唱紋。儘管如此，無論唱針從哪個位置開始，唱片都會從頭播放到尾。"

  - scene: >
      Medium shot, waist-up, eye level, a different framing from the
      close-up before, a small listening room with a turntable.
      attending-researcher-f leans in close to the record player,
      headphones around her neck, eyes wide, one hand raised for quiet,
      as the platter has gone still.
    characters: [attending-researcher-f]
    caption:
      ja: "29曲目に達すると、「レボリューション9」が再生される代わりに、レコードは回転を止め、かすかな息づかいが聞こえてくる。"
      en: "When the twenty-ninth track is reached, instead of playing 'Revolution 9,' the disc stops spinning and faint breathing can be heard."
      cs: "Když se dostane k dvacáté deváté skladbě, místo přehrání 'Revolution 9' se deska přestane otáčet a je slyšet slabé dýchání."
      de: "Wenn der neunundzwanzigste Titel erreicht wird, hört die Platte, anstatt 'Revolution 9' abzuspielen, auf sich zu drehen, und ein leises Atmen ist zu hören."
      es: "Al llegar a la vigésima novena pista, en lugar de reproducirse 'Revolution 9', el disco deja de girar y se puede escuchar una respiración tenue."
      fr: "Lorsque la vingt-neuvième piste est atteinte, au lieu de jouer « Revolution 9 », le disque cesse de tourner et une respiration ténue se fait entendre."
      it: "Quando si raggiunge la ventinovesima traccia, invece di riprodurre 'Revolution 9', il disco smette di girare e si può udire un respiro flebile."
      ko: "29번째 트랙에 도달하면, '레볼루션 9'가 재생되는 대신 디스크가 회전을 멈추고 희미한 숨소리가 들린다."
      pl: "Gdy dociera do dwudziestego dziewiątego utworu, zamiast odtworzyć 'Revolution 9', płyta przestaje się obracać i słychać delikatny oddech."
      pt: "Ao chegar à vigésima nona faixa, em vez de tocar 'Revolution 9', o disco para de girar e é possível ouvir uma respiração fraca."
      th: "เมื่อถึงเพลงที่ยี่สิบเก้า แทนที่จะเล่นเพลง 'Revolution 9' แผ่นเสียงจะหยุดหมุนและได้ยินเสียงหายใจแผ่วเบา"
      uk: "Коли доходить до двадцять дев'ятої доріжки, замість програвання 'Revolution 9' диск припиняє обертатися, і чути ледь чутне дихання."
      vi: "Khi đến bài hát thứ hai mươi chín, thay vì phát bài 'Revolution 9', đĩa nhạc dừng quay và có thể nghe thấy tiếng thở nhẹ."
      zh: "当播放到第二十九首曲目时，唱片不会播放《革命9号》，而是停止转动，并能听到微弱的呼吸声。"
      zh_Hant: "當播放到第二十九首曲目時，唱片不會播放《革命9號》，而是停止轉動，並能聽到微弱的呼吸聲。"

  - scene: >
      Wide shot, full body, eye level, pulled back to show the whole
      listening room, a very different framing from the close listening
      moment before. attending-researcher-m sits with a notepad,
      mid-conversation, gesturing at the turntable as if asking a
      question, while attending-researcher-f listens beside him, both
      facing the record player as though it were a person seated across
      from them.
    characters: [attending-researcher-m, attending-researcher-f]
    caption:
      ja: "時折、その息づかいの主である存在は男性の声で話し出し、音楽業界について百科事典的な深い知識を示す。しかし、ビートルズや自身の個人的な事柄についての質問には答えることを拒む。"
      en: "Occasionally the entity responsible for the breathing will speak in a male voice, showing a profound encyclopedic knowledge of the music industry. However, it refuses to answer questions regarding The Beatles or its own personal details."
      cs: "Entita zodpovědná za dýchání příležitostně promluví mužským hlasem a projeví hlubokou encyklopedickou znalost hudebního průmyslu. Odmítá však odpovídat na otázky týkající se Beatles nebo svých osobních údajů."
      de: "Gelegentlich spricht die für das Atmen verantwortliche Entität mit männlicher Stimme und zeigt dabei tiefgreifendes enzyklopädisches Wissen über die Musikindustrie. Sie weigert sich jedoch, Fragen zu den Beatles oder ihren eigenen persönlichen Details zu beantworten."
      es: "Ocasionalmente, la entidad responsable de la respiración habla con voz masculina, mostrando un profundo conocimiento enciclopédico de la industria musical. Sin embargo, se niega a responder preguntas sobre los Beatles o sus propios datos personales."
      fr: "Occasionnellement, l'entité responsable de la respiration s'exprime d'une voix masculine, révélant une connaissance encyclopédique approfondie de l'industrie musicale. Cependant, elle refuse de répondre aux questions concernant les Beatles ou ses propres informations personnelles."
      it: "Occasionalmente l'entità responsabile del respiro parla con voce maschile, mostrando una profonda conoscenza enciclopedica dell'industria musicale. Tuttavia, si rifiuta di rispondere a domande riguardanti i Beatles o i propri dati personali."
      ko: "때때로 그 숨소리의 주체인 존재는 남성의 목소리로 말하며, 음악 산업에 대한 깊은 백과사전적 지식을 보여준다. 그러나 비틀즈나 자신의 개인 정보에 관한 질문에는 답하기를 거부한다."
      pl: "Od czasu do czasu istota odpowiedzialna za oddech przemawia męskim głosem, wykazując głęboką encyklopedyczną wiedzę o przemyśle muzycznym. Odmawia jednak odpowiedzi na pytania dotyczące The Beatles lub swoich danych osobowych."
      pt: "Ocasionalmente, a entidade responsável pela respiração fala com voz masculina, demonstrando um profundo conhecimento enciclopédico sobre a indústria musical. No entanto, ela se recusa a responder perguntas sobre os Beatles ou seus próprios dados pessoais."
      th: "บางครั้งสิ่งมีชีวิตที่เป็นต้นเสียงหายใจจะพูดด้วยเสียงผู้ชาย แสดงความรู้เชิงสารานุกรมอันลึกซึ้งเกี่ยวกับอุตสาหกรรมดนตรี แต่มันปฏิเสธที่จะตอบคำถามเกี่ยวกับวง The Beatles หรือรายละเอียดส่วนตัวของมันเอง"
      uk: "Часом сутність, відповідальна за дихання, заговорює чоловічим голосом, виявляючи глибокі енциклопедичні знання про музичну індустрію. Однак вона відмовляється відповідати на запитання щодо The Beatles чи власних особистих даних."
      vi: "Đôi khi thực thể chịu trách nhiệm cho tiếng thở sẽ nói bằng giọng nam, thể hiện kiến thức bách khoa sâu rộng về ngành công nghiệp âm nhạc. Tuy nhiên, nó từ chối trả lời các câu hỏi liên quan đến The Beatles hoặc thông tin cá nhân của chính nó."
      zh: "偶尔，那个发出呼吸声的实体会用男性的声音说话，展现出对音乐产业渊博的百科全书式知识。然而，它拒绝回答任何有关披头士乐队或其自身个人信息的问题。"
      zh_Hant: "偶爾，那個發出呼吸聲的實體會用男性的聲音說話，展現出對音樂產業淵博的百科全書式知識。然而，牠拒絕回答任何有關披頭四樂團或其自身個人資訊的問題。"

  - scene: >
      Medium close-up, a very different framing from the wide shot
      before, on attending-researcher-f's hands opening the record's
      cardboard jacket, a small yellowed note tucked inside just visible
      at the edge, her expression curious and puzzled.
    characters: [attending-researcher-f]
    caption:
      ja: "ジャケットの中から、小さな手書きのメモが発見された。そこにはこう書かれていた。「限定版：1／1。ありがとう、ジョンより」"
      en: "Inside the jacket, a small handwritten note was found, reading: 'Limited Edition: 1/1. Thanks, John!'"
      cs: "Uvnitř obalu byla nalezena malá ručně psaná poznámka, na které stálo: 'Limitovaná edice: 1/1. Díky, John!'"
      de: "Im Cover wurde eine kleine handgeschriebene Notiz gefunden, auf der stand: 'Limitierte Auflage: 1/1. Danke, John!'"
      es: "Dentro de la carátula se encontró una pequeña nota manuscrita que decía: «Edición limitada: 1/1. ¡Gracias, John!»"
      fr: "À l'intérieur de la pochette, un petit mot manuscrit a été trouvé, indiquant : « Édition limitée : 1/1. Merci, John ! »"
      it: "All'interno della copertina è stato trovato un piccolo biglietto scritto a mano, che recitava: 'Edizione limitata: 1/1. Grazie, John!'"
      ko: "재킷 안에서 작은 손글씨 메모가 발견되었는데, 다음과 같이 적혀 있었다: '한정판: 1/1. 고마워, 존으로부터!'"
      pl: "Wewnątrz okładki znaleziono małą odręczną notatkę, na której napisano: 'Edycja limitowana: 1/1. Dzięki, John!'"
      pt: "Dentro da capa, foi encontrado um pequeno bilhete manuscrito que dizia: 'Edição limitada: 1/1. Obrigado, John!'"
      th: "ภายในปกแผ่นเสียงพบข้อความที่เขียนด้วยลายมือเล็กๆ ว่า 'รุ่นลิมิเต็ด: 1/1 ขอบคุณนะ จอห์น!'"
      uk: "Усередині обкладинки знайшли маленьку рукописну записку з написом: 'Обмежене видання: 1/1. Дякую, Джон!'"
      vi: "Bên trong bìa đĩa, người ta tìm thấy một mảnh giấy nhỏ viết tay với nội dung: 'Phiên bản giới hạn: 1/1. Cảm ơn, John!'"
      zh: "唱片封套内发现了一张小小的手写便条，上面写着：「限量版：1/1。谢谢你，约翰！」"
      zh_Hant: "唱片封套內發現了一張小小的手寫便條，上面寫著：「限量版：1/1。謝謝你，約翰！」"
