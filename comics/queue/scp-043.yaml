panels:
  - scene: >
      Wide establishing shot, eye level, of a small plain testing room:
      bare walls, a single table holding an old-fashioned record
      turntable, an amplifier and a speaker. Attending Researcher (Male)
      stands beside the table, carefully sliding a plain white vinyl
      record out of a plain white sleeve. A clipboard rests on the
      table. No text or lettering anywhere.
    characters: [attending-researcher-m]
    notes: >
      根拠: SC procedures「SCP-043 requires no special containment,
      although it is recommended that SCP-043 not be used for purposes
      other than testing. A turntable must be kept in the same location
      where tests occur.」
      変えてはいけない事実: 特別な収容は不要、試験以外の用途に使わない方針、
      試験場所に常設のターンテーブル。
      変更可能: 部屋の構図、研究者の動作。
    caption:
      ja: "SCP-043に特別な収容は必要ないが、SCP-043を試験以外の目的に使用しないことが推奨される。試験が行われる場所には、ターンテーブルを1台常備しておかなければならない。"
      en: "SCP-043 requires no special containment, although it is recommended that SCP-043 not be used for purposes other than testing. A turntable must be kept in the same location where tests occur."
      cs: "SCP-043 nevyžaduje žádné zvláštní zadržení, doporučuje se však, aby SCP-043 nebyl používán k jiným účelům než k testování. Na místě, kde testy probíhají, musí být trvale k dispozici gramofon."
      de: "SCP-043 erfordert keine besondere Eindämmung, es wird jedoch empfohlen, SCP-043 nicht für andere Zwecke als Tests zu verwenden. Am Ort, an dem die Tests stattfinden, muss stets ein Plattenspieler bereitstehen."
      es: "SCP-043 no requiere contención especial, aunque se recomienda no utilizar SCP-043 para fines distintos de las pruebas. En el lugar donde se realizan las pruebas debe mantenerse siempre un tocadiscos."
      fr: "SCP-043 ne nécessite aucun confinement particulier, mais il est recommandé de ne pas utiliser SCP-043 à d'autres fins que les tests. Un tourne-disque doit être conservé en permanence à l'endroit où se déroulent les tests."
      it: "SCP-043 non richiede alcun contenimento speciale, tuttavia si raccomanda di non utilizzare SCP-043 per scopi diversi dai test. Nel luogo in cui si svolgono i test deve essere sempre presente un giradischi."
      ko: "SCP-043에 특별한 격리는 필요하지 않으나, SCP-043을 시험 이외의 목적으로 사용하지 않을 것이 권장된다. 시험이 이루어지는 장소에는 턴테이블 한 대를 상시 비치해 두어야 한다."
      pl: "SCP-043 nie wymaga specjalnego przechowywania, zaleca się jednak, aby SCP-043 nie był używany do celów innych niż testowanie. W miejscu, w którym przeprowadza się testy, musi być stale dostępny gramofon."
      pt: "SCP-043 não requer contenção especial, embora se recomende que SCP-043 não seja usado para fins que não sejam de teste. No local onde os testes ocorrem deve ser mantido sempre um toca-discos."
      th: "SCP-043 ไม่จำเป็นต้องมีการกักกันพิเศษ แม้จะแนะนำว่าไม่ควรใช้ SCP-043 เพื่อจุดประสงค์อื่นนอกจากการทดสอบ ต้องมีเครื่องเล่นแผ่นเสียงประจำอยู่ ณ สถานที่ที่ทำการทดสอบ"
      uk: "SCP-043 не потребує особливого утримання, проте рекомендується не використовувати SCP-043 для будь-яких цілей, окрім випробувань. У місці, де проводяться випробування, має постійно зберігатися програвач платівок."
      vi: "SCP-043 không cần biện pháp ngăn giữ đặc biệt, tuy nhiên khuyến nghị không sử dụng SCP-043 cho bất kỳ mục đích nào khác ngoài thử nghiệm. Tại nơi tiến hành thử nghiệm phải luôn có sẵn một máy quay đĩa."
      zh: "SCP-043不需要特殊收容，但建议不要将SCP-043用于测试以外的用途。在进行测试的地点必须常备一台唱片机。"
      zh_Hant: "SCP-043不需要特殊收容，但建議不要將SCP-043用於測試以外的用途。在進行測試的地點必須常備一台唱片機。"

  - scene: >
      Extreme close-up, top-down, of the record spinning on the
      turntable. Its playing surface is a perfectly smooth, featureless
      glossy black disc with no grooves at all, reflecting the ceiling
      light as a clean unbroken arc. The tonearm and needle rest down
      near the middle of the disc rather than the edge. No people, no
      text.
    characters: []
    notes: >
      根拠: Description「This object appears to be a Beatles vinyl record
      titled 'The White Album', but ... it lacks the typical groove
      patterns found on records. Despite this anomaly, the record plays
      completely from beginning to end regardless of needle placement.」
      変えてはいけない事実: 溝が無いレコード、針の位置に関係なく最初から
      最後まで再生される。
      変更可能: アングル、光の反射の見せ方。
    caption:
      ja: "この物体は『ホワイト・アルバム』と題されたビートルズのレコード盤に見えるが、調査の結果、レコードに通常みられる溝の模様が存在しないことが判明した。この異常にもかかわらず、レコードは針を置いた位置に関係なく、最初から最後まで完全に再生される。"
      en: "This object appears to be a Beatles vinyl record titled 'The White Album', but investigation reveals it lacks the typical groove patterns found on records. Despite this anomaly, the record plays completely from beginning to end regardless of needle placement."
      cs: "Tento předmět vypadá jako gramofonová deska Beatles s názvem 'The White Album', ale zkoumání odhalilo, že postrádá typické drážky, jaké se na deskách nacházejí. Navzdory této anomálii se deska přehraje celá od začátku do konce bez ohledu na to, kam se položí jehla."
      de: "Dieses Objekt sieht aus wie eine Vinyl-Schallplatte der Beatles mit dem Titel 'The White Album', doch Untersuchungen zeigen, dass ihr die für Schallplatten typischen Rillenmuster fehlen. Trotz dieser Anomalie wird die Platte vollständig von Anfang bis Ende abgespielt, unabhängig davon, wo die Nadel aufgesetzt wird."
      es: "Este objeto parece ser un disco de vinilo de los Beatles titulado 'The White Album', pero la investigación revela que carece de los surcos típicos de los discos. A pesar de esta anomalía, el disco se reproduce por completo de principio a fin, sin importar dónde se coloque la aguja."
      fr: "Cet objet semble être un disque vinyle des Beatles intitulé 'The White Album', mais l'examen révèle qu'il ne présente pas les sillons habituels d'un disque. Malgré cette anomalie, le disque se lit entièrement du début à la fin, quel que soit l'endroit où l'on pose l'aiguille."
      it: "Questo oggetto sembra essere un disco in vinile dei Beatles intitolato 'The White Album', ma l'esame rivela che è privo dei tipici solchi presenti sui dischi. Nonostante questa anomalia, il disco viene riprodotto completamente dall'inizio alla fine, indipendentemente da dove si appoggia la puntina."
      ko: "이 물체는 '화이트 앨범'이라는 제목의 비틀즈 음반으로 보이나, 조사 결과 음반에서 흔히 볼 수 있는 홈 무늬가 존재하지 않는 것으로 드러났다. 이 이상성에도 불구하고 음반은 바늘을 올려놓는 위치와 상관없이 처음부터 끝까지 완전하게 재생된다."
      pl: "Obiekt ten wygląda na płytę winylową zespołu The Beatles zatytułowaną 'The White Album', lecz badanie ujawnia, że brakuje jej typowych rowków spotykanych na płytach. Mimo tej anomalii płyta odtwarza się w całości od początku do końca, niezależnie od tego, gdzie postawi się igłę."
      pt: "Este objeto parece ser um disco de vinil dos Beatles intitulado 'The White Album', mas a investigação revela que ele não possui os sulcos típicos encontrados em discos. Apesar dessa anomalia, o disco toca por completo do início ao fim, independentemente de onde a agulha seja colocada."
      th: "วัตถุนี้ดูเหมือนแผ่นเสียงของวงเดอะบีเทิลส์ชื่อ 'The White Album' แต่การตรวจสอบพบว่ามันไม่มีร่องเสียงตามแบบที่พบในแผ่นเสียงทั่วไป แม้จะมีความผิดปกตินี้ แผ่นเสียงก็เล่นจนจบตั้งแต่ต้นจนจบอย่างสมบูรณ์ ไม่ว่าจะวางเข็มไว้ตรงไหนก็ตาม"
      uk: "Цей предмет має вигляд вінілової платівки The Beatles під назвою 'The White Album', проте дослідження виявляє, що на ній відсутні типові для платівок доріжки. Попри цю аномалію, платівка відтворюється повністю від початку до кінця незалежно від того, куди опущено голку."
      vi: "Vật thể này trông giống một đĩa than của ban nhạc The Beatles mang tên 'The White Album', nhưng khi kiểm tra cho thấy nó không có các rãnh thường thấy trên đĩa than. Bất chấp sự bất thường này, đĩa vẫn phát trọn vẹn từ đầu đến cuối bất kể đặt kim ở đâu."
      zh: "该物体看似一张名为《白色专辑》的披头士乐队黑胶唱片，但调查发现它没有唱片上常见的纹槽。尽管存在这一异常，无论唱针放在何处，该唱片都会从头到尾完整播放。"
      zh_Hant: "該物體看似一張名為《白色專輯》的披頭四樂團黑膠唱片，但調查發現它沒有唱片上常見的紋槽。儘管存在這一異常，無論唱針放在何處，該唱片都會從頭到尾完整播放。"

  - scene: >
      Close-up on Attending Researcher (Male) leaning in toward the
      speaker with wide, startled eyes and slightly raised eyebrows, one
      hand cupped near his ear. Beside him the record on the turntable
      has clearly stopped turning, the tonearm resting still on its
      motionless surface. A faint fogging of breath-like mist drifts
      near the speaker grille. No text.
    characters: [attending-researcher-m]
    notes: >
      根拠: Description「When playback reaches track twenty-nine (which
      should contain 'Revolution 9'), the spinning stops and faint
      breathing becomes audible. An entity occasionally communicates in
      a male voice.」
      変えてはいけない事実: 29曲目で回転が止まる、かすかな呼吸音、男性の声。
      変更可能: 研究者の反応、呼吸の視覚的表現。
    caption:
      ja: "再生が29トラック目（本来「レボリューション9」が収められているはずの位置）に達すると、回転が停止し、かすかな呼吸音が聞こえるようになる。ある存在が、時折、男性の声で意思を伝える。"
      en: "When playback reaches track twenty-nine, which should contain 'Revolution 9', the spinning stops and faint breathing becomes audible. An entity occasionally communicates in a male voice."
      cs: "Když přehrávání dosáhne dvacáté deváté stopy, na níž by měla být 'Revolution 9', otáčení se zastaví a je slyšet slabé dýchání. Jistá entita čas od času komunikuje mužským hlasem."
      de: "Wenn die Wiedergabe den neunundzwanzigsten Titel erreicht, auf dem sich eigentlich 'Revolution 9' befinden sollte, hört die Drehung auf und ein leises Atmen wird hörbar. Eine Entität kommuniziert gelegentlich mit männlicher Stimme."
      es: "Cuando la reproducción llega a la pista veintinueve, que debería contener 'Revolution 9', el giro se detiene y se hace audible una débil respiración. Una entidad se comunica ocasionalmente con voz masculina."
      fr: "Lorsque la lecture atteint la vingt-neuvième piste, censée contenir 'Revolution 9', la rotation s'arrête et une faible respiration devient audible. Une entité communique parfois d'une voix masculine."
      it: "Quando la riproduzione raggiunge la ventinovesima traccia, che dovrebbe contenere 'Revolution 9', la rotazione si ferma e diventa udibile un debole respiro. Un'entità comunica occasionalmente con voce maschile."
      ko: "재생이 스물아홉 번째 트랙, 즉 본래 'Revolution 9'이 수록되어 있어야 할 위치에 이르면 회전이 멈추고 희미한 숨소리가 들리게 된다. 어떤 존재가 이따금 남성의 목소리로 의사를 전달한다."
      pl: "Gdy odtwarzanie dochodzi do dwudziestej dziewiątej ścieżki, na której powinno znajdować się 'Revolution 9', obracanie się zatrzymuje i słychać ciche oddychanie. Pewna istota od czasu do czasu komunikuje się męskim głosem."
      pt: "Quando a reprodução chega à faixa vinte e nove, que deveria conter 'Revolution 9', a rotação para e uma respiração fraca torna-se audível. Uma entidade ocasionalmente se comunica com voz masculina."
      th: "เมื่อการเล่นมาถึงแทร็กที่ยี่สิบเก้า ซึ่งควรจะเป็นเพลง 'Revolution 9' การหมุนจะหยุดลงและได้ยินเสียงหายใจแผ่ว ๆ มีสิ่งหนึ่งสื่อสารออกมาเป็นครั้งคราวด้วยเสียงผู้ชาย"
      uk: "Коли відтворення досягає двадцять дев'ятої доріжки, на якій мала б бути 'Revolution 9', обертання зупиняється і стає чутним слабке дихання. Певна сутність час від часу спілкується чоловічим голосом."
      vi: "Khi phát đến bản nhạc thứ hai mươi chín, nơi lẽ ra phải là 'Revolution 9', đĩa ngừng quay và có thể nghe thấy tiếng thở khe khẽ. Một thực thể thỉnh thoảng giao tiếp bằng giọng nam."
      zh: "当播放到第二十九轨，也就是本应收录《Revolution 9》的位置时，转动停止，可听到微弱的呼吸声。某个实体偶尔会以男性嗓音进行交流。"
      zh_Hant: "當播放到第二十九軌，也就是本應收錄《Revolution 9》的位置時，轉動停止，可聽到微弱的呼吸聲。某個實體偶爾會以男性嗓音進行交流。"

  - scene: >
      Medium two-shot, waist-up. On the left side of the frame,
      Attending Researcher (Female) sits leaning eagerly toward the
      turntable with a notepad and pen ready, an expectant look on her
      face. On the right side of the frame sits the silent record and
      speaker. Her expression has just tipped into mild disappointment,
      pen hovering without writing. No text.
    characters: [attending-researcher-f]
    notes: >
      根拠: Description「demonstrates extensive knowledge about music
      history and theory, and answers inquiries — though it declines to
      address questions about the band or its own background.」オチ。
      変えてはいけない事実: 音楽史・音楽理論に精通し質問に答える一方、
      バンドや自身の素性に関する質問には答えない。
      変更可能: 研究者の反応の演出、構図。
    caption:
      ja: "その存在は音楽史と音楽理論に関する広範な知識を示し、問いかけに答える。ただし、バンドについての質問や、自身の素性に関する質問には答えようとしない。"
      en: "The entity demonstrates extensive knowledge about music history and theory and answers inquiries, though it declines to address questions about the band or its own background."
      cs: "Entita prokazuje rozsáhlé znalosti o hudební historii a teorii a odpovídá na dotazy, odmítá se však zabývat otázkami o kapele nebo o svém vlastním původu."
      de: "Die Entität zeigt umfangreiches Wissen über Musikgeschichte und -theorie und beantwortet Fragen, weigert sich jedoch, auf Fragen über die Band oder ihre eigene Herkunft einzugehen."
      es: "La entidad demuestra amplios conocimientos sobre historia y teoría de la música y responde a las preguntas, aunque se niega a abordar cuestiones sobre la banda o sobre su propio origen."
      fr: "L'entité fait preuve de vastes connaissances sur l'histoire et la théorie de la musique et répond aux questions, mais elle refuse d'aborder les questions concernant le groupe ou sa propre origine."
      it: "L'entità dimostra un'ampia conoscenza della storia e della teoria della musica e risponde alle domande, ma si rifiuta di affrontare quesiti sulla band o sulle proprie origini."
      ko: "그 존재는 음악사와 음악 이론에 관한 폭넓은 지식을 보이며 질문에 답한다. 다만 밴드에 관한 질문이나 자신의 내력에 관한 질문에는 답하려 하지 않는다."
      pl: "Istota wykazuje rozległą wiedzę o historii i teorii muzyki oraz odpowiada na pytania, odmawia jednak poruszania kwestii dotyczących zespołu lub własnego pochodzenia."
      pt: "A entidade demonstra amplo conhecimento sobre a história e a teoria da música e responde às perguntas, embora se recuse a abordar questões sobre a banda ou sobre a própria origem."
      th: "สิ่งนั้นแสดงความรู้อันกว้างขวางเกี่ยวกับประวัติศาสตร์และทฤษฎีดนตรี และตอบคำถามต่าง ๆ แต่ปฏิเสธที่จะพูดถึงคำถามเกี่ยวกับวงดนตรีหรือภูมิหลังของตนเอง"
      uk: "Сутність демонструє широкі знання з історії та теорії музики й відповідає на запитання, проте відмовляється обговорювати питання про гурт або про власне походження."
      vi: "Thực thể thể hiện kiến thức sâu rộng về lịch sử và lý thuyết âm nhạc và trả lời các câu hỏi, tuy nhiên nó từ chối đề cập đến những câu hỏi về ban nhạc hoặc về xuất thân của chính nó."
      zh: "该实体展现出对音乐史和音乐理论的广博知识，并回答提问，但拒绝谈及有关这支乐队或其自身来历的问题。"
      zh_Hant: "該實體展現出對音樂史和音樂理論的廣博知識，並回答提問，但拒絕談及有關這支樂團或其自身來歷的問題。"
