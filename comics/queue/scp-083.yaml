panels:
  - scene: >
      Wide shot, full body, showing the whole street. A shabby
      two-story row house stands with peeling paint and a corroded
      front door lock, boarded windows on the upper floor.
      attending-researcher-m observes from across the street, clipboard
      in hand.
    characters: [attending-researcher-m]
    caption:
      ja: "SCP-083は、無人の2階建てタウンハウスで、全体的に老朽化した状態にあるように見える。財団が取得するまで、この物件は地元の麻薬密売人の「事務所」として使われていたと噂されており、彼らは正面と裏の扉の鍵機構が腐食して固着していたため、正面の窓から出入りしていた。"
      en: "SCP-083 appears to be an uninhabited, two-story row house in a general state of disrepair. Until acquisition by the Foundation, the property was the reputed 'office' for local narcotics dealers who gained entry through a front window, since the locking mechanisms on both doors were corroded and frozen shut."
      cs: "SCP-083 vypadá jako neobydlený dvoupatrový řadový dům v celkově zchátralém stavu. Až do svého získání Nadací byla nemovitost údajně „kanceláří“ místních drogových dealerů, kteří se dostávali dovnitř předním oknem, protože zamykací mechanismy obou dveří byly zkorodované a zaseknuté."
      de: "SCP-083 erscheint als unbewohntes, zweistöckiges Reihenhaus in einem allgemein baufälligen Zustand. Bis zum Erwerb durch die Stiftung galt die Immobilie als „Büro“ örtlicher Drogenhändler, die sich durch ein Vorderfenster Zutritt verschafften, da die Schließmechanismen beider Türen korrodiert und festgefroren waren."
      es: "SCP-083 parece ser una casa adosada de dos plantas, deshabitada y en general mal estado. Hasta su adquisición por la Fundación, la propiedad era, según se rumoreaba, la 'oficina' de traficantes de drogas locales, que accedían por una ventana delantera, ya que los mecanismos de cierre de ambas puertas estaban corroídos y atascados."
      fr: "Le SCP-083 semble être une maison mitoyenne inhabitée de deux étages, dans un état général de délabrement. Jusqu'à son acquisition par la Fondation, la propriété était réputée servir de « bureau » à des trafiquants de drogue locaux, qui y pénétraient par une fenêtre avant, les mécanismes de verrouillage des deux portes étant corrodés et bloqués."
      it: "SCP-083 sembra essere una casa a schiera disabitata di due piani, in generale stato di degrado. Fino alla sua acquisizione da parte della Fondazione, la proprietà era il presunto 'ufficio' di spacciatori locali, che vi accedevano attraverso una finestra anteriore, poiché i meccanismi di chiusura di entrambe le porte erano corrosi e bloccati."
      ko: "SCP-083는 무인 상태의 2층 연립주택으로, 전반적으로 노후한 상태로 보인다. 재단이 인수하기 전까지 이 부동산은 지역 마약상들의 '사무실'로 소문나 있었으며, 그들은 앞뒤 문의 잠금장치가 부식되어 고착된 탓에 앞쪽 창문을 통해 드나들었다."
      pl: "SCP-083 wygląda jak niezamieszkały, dwupiętrowy dom szeregowy w ogólnym stanie ruiny. Do czasu przejęcia przez Fundację nieruchomość była rzekomo „biurem” lokalnych handlarzy narkotyków, którzy dostawali się do środka przez frontowe okno, ponieważ mechanizmy zamków w obu drzwiach były skorodowane i zablokowane."
      pt: "O SCP-083 parece ser uma casa geminada desabitada de dois andares, em geral estado de deterioração. Até sua aquisição pela Fundação, a propriedade era o suposto 'escritório' de traficantes de drogas locais, que entravam por uma janela da frente, já que os mecanismos de trava de ambas as portas estavam corroídos e emperrados."
      th: "SCP-083 มีลักษณะเป็นบ้านแถวสองชั้นที่ไม่มีคนอาศัยอยู่ อยู่ในสภาพทรุดโทรมโดยทั่วไป ก่อนที่มูลนิธิจะเข้าครอบครอง สถานที่แห่งนี้ถูกลือกันว่าเป็น 'สำนักงาน' ของพ่อค้ายาเสพติดในท้องถิ่น ซึ่งเข้าออกผ่านหน้าต่างด้านหน้า เนื่องจากกลไกล็อกของประตูทั้งสองบานผุกร่อนและติดขัด"
      uk: "SCP-083 виглядає як нежилий двоповерховий рядний будинок у загалом занедбаному стані. До придбання Фондом власність, за чутками, слугувала «офісом» місцевих наркоторговців, які проникали всередину через переднє вікно, оскільки замкові механізми обох дверей проіржавіли й заклинили."
      vi: "SCP-083 trông giống một căn nhà phố hai tầng bỏ hoang, trong tình trạng xuống cấp nói chung. Cho đến khi được Quỹ tiếp nhận, bất động sản này được đồn là 'văn phòng' của các tay buôn ma túy địa phương, những kẻ đột nhập qua cửa sổ phía trước vì cơ chế khóa của cả hai cửa đều bị ăn mòn và kẹt cứng."
      zh: "SCP-083外观是一栋无人居住的两层联排住宅，整体处于破败状态。在被基金会取得之前，该处房产据传是当地毒贩的「办公室」，他们从正面窗户出入，因为前后门的锁具机构均已锈蚀卡死。"
      zh_Hant: "SCP-083外觀是一棟無人居住的兩層聯排住宅，整體處於破敗狀態。在被基金會取得之前，該處房產據傳是當地毒販的「辦公室」，他們從正面窗戶出入，因為前後門的鎖具機構均已鏽蝕卡死。"

  - scene: >
      Medium shot, a different framing from the wide shot before,
      split by the house's front wall. On the left, through the front
      door, attending-researcher-m steps into a warmly lit, fully
      furnished early-1900s parlor. On the right, through a broken
      window, attending-researcher-f climbs into a dark, dilapidated
      room with peeling wallpaper.
    characters: [attending-researcher-m, attending-researcher-f]
    caption:
      ja: "SCP-083の扉から入った者たち（グループA）は、20世紀初頭風の、家具の揃った手入れの行き届いた家の中にいることに気づいた。窓から入った職員（グループB）は、内部を「暗く荒廃している」と表現した。グループAの職員はまた、グループBのメンバーを見ることも、声を聞くことも、見つけることもできなかったと報告している。"
      en: "Those who entered through the door of SCP-083 (Group A) found themselves inside a fully-furnished and well-maintained home from the early 20th Century. Personnel who entered through the windows (Group B) described the interior as 'dark and dilapidated'. Personnel in Group A also reported that they couldn't see, hear, or find any members of Group B."
      cs: "Ti, kdo vstoupili dveřmi SCP-083 (skupina A), se ocitli uvnitř plně zařízeného a dobře udržovaného domu z počátku 20. století. Personál, který vstoupil okny (skupina B), popsal interiér jako „temný a zchátralý“. Personál skupiny A také uvedl, že nemohl žádné členy skupiny B vidět, slyšet ani najít."
      de: "Diejenigen, die durch die Tür von SCP-083 eintraten (Gruppe A), befanden sich in einem voll möblierten und gepflegten Haus aus dem frühen 20. Jahrhundert. Personal, das durch die Fenster eintrat (Gruppe B), beschrieb das Innere als „dunkel und baufällig“. Das Personal der Gruppe A berichtete außerdem, dass sie keine Mitglieder der Gruppe B sehen, hören oder finden konnten."
      es: "Aquellos que entraron por la puerta del SCP-083 (Grupo A) se encontraron dentro de una casa completamente amueblada y bien conservada de principios del siglo XX. El personal que entró por las ventanas (Grupo B) describió el interior como 'oscuro y ruinoso'. El personal del Grupo A también informó que no podía ver, oír ni encontrar a ningún miembro del Grupo B."
      fr: "Ceux qui sont entrés par la porte du SCP-083 (Groupe A) se sont retrouvés dans une maison entièrement meublée et bien entretenue du début du XXe siècle. Le personnel entré par les fenêtres (Groupe B) a décrit l'intérieur comme « sombre et délabré ». Le personnel du Groupe A a également rapporté ne pouvoir ni voir, ni entendre, ni trouver aucun membre du Groupe B."
      it: "Coloro che sono entrati dalla porta di SCP-083 (Gruppo A) si sono ritrovati all'interno di una casa completamente arredata e ben tenuta dei primi del Novecento. Il personale entrato dalle finestre (Gruppo B) ha descritto l'interno come 'buio e fatiscente'. Il personale del Gruppo A ha inoltre riferito di non poter vedere, sentire o trovare alcun membro del Gruppo B."
      ko: "SCP-083의 문을 통해 들어간 이들(A조)은 20세기 초의 완전히 가구가 갖춰진, 잘 관리된 집 안에 있다는 것을 발견했다. 창문을 통해 들어간 요원들(B조)은 내부를 '어둡고 황폐하다'고 묘사했다. A조 요원들은 또한 B조 구성원을 전혀 보거나, 듣거나, 찾을 수 없었다고 보고했다."
      pl: "Ci, którzy weszli przez drzwi SCP-083 (Grupa A), znaleźli się w w pełni umeblowanym i dobrze utrzymanym domu z początku XX wieku. Personel, który wszedł przez okna (Grupa B), opisał wnętrze jako „ciemne i zrujnowane”. Personel Grupy A zgłosił również, że nie mógł zobaczyć, usłyszeć ani odnaleźć żadnego członka Grupy B."
      pt: "Aqueles que entraram pela porta do SCP-083 (Grupo A) se encontraram dentro de uma casa totalmente mobiliada e bem conservada do início do século XX. O pessoal que entrou pelas janelas (Grupo B) descreveu o interior como 'escuro e deteriorado'. O pessoal do Grupo A também relatou que não conseguia ver, ouvir ou encontrar nenhum membro do Grupo B."
      th: "ผู้ที่เข้าไปทางประตูของ SCP-083 (กลุ่ม A) พบว่าตนเองอยู่ในบ้านที่ตกแต่งครบครันและได้รับการดูแลอย่างดีจากช่วงต้นศตวรรษที่ 20 เจ้าหน้าที่ที่เข้าไปทางหน้าต่าง (กลุ่ม B) บรรยายภายในว่า 'มืดและทรุดโทรม' เจ้าหน้าที่กลุ่ม A ยังรายงานว่าพวกเขาไม่สามารถมองเห็น ได้ยิน หรือพบสมาชิกกลุ่ม B เลย"
      uk: "Ті, хто заходив через двері SCP-083 (Група A), опинялися всередині повністю умебльованого й доглянутого будинку початку 20 століття. Персонал, що заходив через вікна (Група B), описував інтер'єр як «темний і занедбаний». Персонал Групи A також повідомляв, що не міг бачити, чути чи знайти жодного члена Групи B."
      vi: "Những người bước vào qua cửa của SCP-083 (Nhóm A) thấy mình ở trong một ngôi nhà được trang bị đầy đủ nội thất và bảo trì tốt từ đầu thế kỷ 20. Nhân viên bước vào qua cửa sổ (Nhóm B) mô tả nội thất là 'tối tăm và đổ nát'. Nhân viên Nhóm A cũng báo cáo rằng họ không thể nhìn thấy, nghe thấy hay tìm được bất kỳ thành viên nào của Nhóm B."
      zh: "从SCP-083的门进入的人（A组）发现自己身处一栋家具齐全、保养良好的20世纪初风格住宅之中。从窗户进入的人员（B组）则将室内描述为「昏暗且破败」。A组人员还报告称，他们完全看不到、听不到，也找不到任何B组成员。"
      zh_Hant: "從SCP-083的門進入的人（A組）發現自己身處一棟傢俱齊全、保養良好的20世紀初風格住宅之中。從窗戶進入的人員（B組）則將室內描述為「昏暗且破敗」。A組人員還報告稱，他們完全看不到、聽不到，也找不到任何B組成員。"

  - scene: >
      Wide shot, low angle, exterior at night, a different framing from
      the medium shot before, showing the house's front facade.
      attending-researcher-f is visible climbing through the broken
      window (Group B), while the street around otherwise appears
      empty, implying Group A members are unseen from outside.
    characters: [attending-researcher-f]
    caption:
      ja: "屋内にいた両グループは、まったく異なる居住環境を描写しただけでなく、それぞれの説明は同じ間取りにすら対応していなかった。しかし屋外にいた職員は、グループBのメンバーしか目撃していないと報告している。"
      en: "Both groups inside the property described very different living conditions, and their descriptions didn't even correspond to the same floor plan. Personnel outside the house, however, reported only seeing members of Group B."
      cs: "Obě skupiny uvnitř nemovitosti popsaly velmi odlišné životní podmínky a jejich popisy dokonce neodpovídaly ani stejnému půdorysu. Personál mimo dům však uvedl, že viděl pouze členy skupiny B."
      de: "Beide Gruppen innerhalb des Anwesens beschrieben sehr unterschiedliche Wohnverhältnisse, und ihre Beschreibungen entsprachen nicht einmal demselben Grundriss. Das Personal außerhalb des Hauses berichtete jedoch, nur Mitglieder der Gruppe B gesehen zu haben."
      es: "Ambos grupos dentro de la propiedad describieron condiciones de vida muy diferentes, y sus descripciones ni siquiera correspondían al mismo plano. Sin embargo, el personal fuera de la casa informó que solo vio a miembros del Grupo B."
      fr: "Les deux groupes présents dans la propriété ont décrit des conditions de vie très différentes, et leurs descriptions ne correspondaient même pas au même plan d'étage. Le personnel à l'extérieur de la maison, cependant, a rapporté n'avoir vu que des membres du Groupe B."
      it: "Entrambi i gruppi all'interno della proprietà hanno descritto condizioni abitative molto diverse, e le loro descrizioni non corrispondevano nemmeno alla stessa planimetria. Il personale fuori dalla casa, tuttavia, ha riferito di aver visto solo membri del Gruppo B."
      ko: "부지 안에 있던 두 조는 매우 다른 거주 환경을 묘사했을 뿐 아니라, 그들의 설명은 같은 평면도에도 대응하지 않았다. 그러나 집 밖에 있던 요원들은 B조 구성원만 보였다고 보고했다."
      pl: "Obie grupy wewnątrz posiadłości opisywały bardzo różne warunki mieszkalne, a ich opisy nie odpowiadały nawet temu samemu planowi budynku. Personel na zewnątrz domu zgłosił jednak, że widział wyłącznie członków Grupy B."
      pt: "Ambos os grupos dentro da propriedade descreveram condições de vida muito diferentes, e suas descrições nem sequer correspondiam à mesma planta baixa. O pessoal do lado de fora da casa, no entanto, relatou ver apenas membros do Grupo B."
      th: "ทั้งสองกลุ่มภายในบ้านหลังนี้บรรยายสภาพความเป็นอยู่ที่แตกต่างกันอย่างมาก และคำบรรยายของพวกเขาไม่ตรงกับผังพื้นเดียวกันด้วยซ้ำ อย่างไรก็ตาม เจ้าหน้าที่นอกบ้านรายงานว่าเห็นเพียงสมาชิกกลุ่ม B เท่านั้น"
      uk: "Обидві групи всередині будинку описували дуже різні умови проживання, і їхні описи навіть не відповідали одному й тому ж плануванню. Проте персонал зовні будинку повідомляв, що бачив лише членів Групи B."
      vi: "Cả hai nhóm bên trong ngôi nhà mô tả các điều kiện sinh hoạt rất khác nhau, và mô tả của họ thậm chí không tương ứng với cùng một sơ đồ mặt bằng. Tuy nhiên, nhân viên bên ngoài ngôi nhà báo cáo rằng họ chỉ nhìn thấy các thành viên của Nhóm B."
      zh: "在房屋内部的两组人员描述了截然不同的居住状况，他们的描述甚至对应不上同一份平面图。然而，屋外的人员报告称只能看到B组成员。"
      zh_Hant: "在房屋內部的兩組人員描述了截然不同的居住狀況，他們的描述甚至對應不上同一份平面圖。然而，屋外的人員報告稱只能看到B組成員。"

  - scene: >
      Medium shot, waist-up, a different framing from the wide shot
      before, inside the ever-changing furnished interior.
      attending-researcher-m stands bewildered in a hallway, comparing
      a hand-drawn floor plan sketch to the mismatched room around him,
      gesturing in confusion at doorways that clearly don't match the
      sketch.
    characters: [attending-researcher-m]
    caption:
      ja: "SCP-083の間取りはどうやら変化するらしく、異なるレイアウト、異なる数・種類の部屋が現れる。屋内に人間の存在がある限り、間取りは安定を保っているようである。"
      en: "The floor plan of SCP-083 apparently changes, with a different layout and different numbers and kinds of rooms manifesting. So long as a human presence exists inside, the floor plan seems to remain stable."
      cs: "Zdá se, že se půdorys SCP-083 mění, přičemž se objevuje odlišné uspořádání a různý počet a druh místností. Dokud je uvnitř přítomna lidská osoba, půdorys zůstává zjevně stabilní."
      de: "Der Grundriss von SCP-083 scheint sich zu verändern, wobei ein anderes Layout und unterschiedliche Anzahlen und Arten von Räumen erscheinen. Solange sich eine menschliche Präsenz im Inneren befindet, scheint der Grundriss stabil zu bleiben."
      es: "El plano de SCP-083 aparentemente cambia, manifestándose una disposición diferente y distintos números y tipos de habitaciones. Mientras exista presencia humana en el interior, el plano parece permanecer estable."
      fr: "Le plan du SCP-083 semble changer, avec une disposition différente et un nombre et des types de pièces différents qui apparaissent. Tant qu'une présence humaine existe à l'intérieur, le plan semble rester stable."
      it: "La planimetria di SCP-083 apparentemente cambia, con una disposizione diversa e un numero e tipo di stanze diversi che si manifestano. Finché all'interno è presente una presenza umana, la planimetria sembra rimanere stabile."
      ko: "SCP-083의 평면도는 분명히 변화하며, 서로 다른 배치와 다른 수 및 종류의 방들이 나타난다. 내부에 사람이 있는 한, 평면도는 안정적으로 유지되는 것으로 보인다."
      pl: "Plan budynku SCP-083 najwyraźniej się zmienia, ujawniając inny układ oraz różną liczbę i rodzaje pomieszczeń. Dopóki wewnątrz obecny jest człowiek, plan wydaje się pozostawać stabilny."
      pt: "A planta do SCP-083 aparentemente muda, manifestando um layout diferente e números e tipos de cômodos diferentes. Enquanto houver presença humana no interior, a planta parece permanecer estável."
      th: "ผังพื้นของ SCP-083 ดูเหมือนจะเปลี่ยนแปลงไป โดยมีการจัดวางที่แตกต่างกันและจำนวนรวมถึงประเภทของห้องที่แตกต่างกันปรากฏขึ้น ตราบใดที่ยังมีมนุษย์อยู่ภายใน ผังพื้นดูเหมือนจะคงที่"
      uk: "Планування SCP-083, вочевидь, змінюється — з'являються різні компонування та різна кількість і типи кімнат. Поки всередині перебуває людина, планування, здається, залишається стабільним."
      vi: "Sơ đồ mặt bằng của SCP-083 dường như thay đổi, với bố cục khác nhau cùng số lượng và loại phòng khác nhau xuất hiện. Miễn là còn sự hiện diện của con người bên trong, sơ đồ mặt bằng dường như vẫn ổn định."
      zh: "SCP-083的平面布局似乎会发生变化，呈现出不同的格局以及数量和种类各异的房间。只要屋内有人在场，平面布局似乎就会保持稳定。"
      zh_Hant: "SCP-083的平面佈局似乎會發生變化，呈現出不同的格局以及數量和種類各異的房間。只要屋內有人在場，平面佈局似乎就會保持穩定。"

addendum:
  ja: "補遺：応接間の3つの扉のうち1つは必ずクローゼットに通じる――そこには60％以上の確率でティール色と白のフーヴァー掃除機が入っている。理由は不明。"
  en: "Addendum: One of the front parlor's three doors always opens onto a closet — and over 60% of the time, it contains a teal-and-white Hoover vacuum cleaner, for reasons still unexplained."
  cs: "Dodatek: Jedny ze tří dveří v předním salonu vždy vedou do skříně – a ve více než 60 % případů v ní je tyrkysově-bílý vysavač Hoover, z nevysvětlených důvodů."
  de: "Anhang: Eine der drei Türen im vorderen Salon führt stets zu einem Schrank – und in über 60 % der Fälle enthält er einen türkis-weißen Hoover-Staubsauger, aus ungeklärten Gründen."
  es: "Adenda: Una de las tres puertas del salón siempre da a un armario, que más del 60% de las veces contiene una aspiradora Hoover turquesa y blanca, por razones inexplicadas."
  fr: "Addendum : L'une des trois portes du salon donne toujours sur un placard, qui contient plus de 60 % du temps un aspirateur Hoover turquoise et blanc, pour des raisons inexpliquées."
  it: "Addendum: Una delle tre porte del salotto conduce sempre a un ripostiglio, che oltre il 60% delle volte contiene un aspirapolvere Hoover turchese e bianco, per ragioni inspiegate."
  ko: "부록: 응접실의 세 문 중 하나는 항상 벽장으로 이어진다 — 60% 이상의 확률로 그 안에는 청록색과 흰색의 후버 진공청소기가 있다. 이유는 불명이다."
  pl: "Aneks: Jedne z trzech drzwi w salonie zawsze prowadzą do szafy, w której ponad 60% przypadków znajduje się turkusowo-biały odkurzacz Hoover, z niewyjaśnionych powodów."
  pt: "Adendo: Uma das três portas da sala sempre leva a um closet, que em mais de 60% das vezes contém um aspirador Hoover turquesa e branco, por razões inexplicadas."
  th: "ภาคผนวก: หนึ่งในสามประตูของห้องรับแขกเปิดออกไปสู่ตู้เสื้อผ้าเสมอ — และกว่า 60% ของครั้ง ตู้นั้นมีเครื่องดูดฝุ่น Hoover สีเขียวอมฟ้าและขาว โดยไม่ทราบสาเหตุ"
  uk: "Додаток: Одні з трьох дверей вітальні завжди ведуть до комори — і понад 60% випадків там стоїть бірюзово-білий пилосос Hoover, з нез'ясованих причин."
  vi: "Phụ lục: Một trong ba cánh cửa phòng khách luôn dẫn tới một tủ chứa đồ — và hơn 60% số lần, tủ đó chứa một máy hút bụi Hoover màu xanh ngọc và trắng, vì lý do chưa rõ."
  zh: "补遗：客厅三扇门中有一扇始终通往储物柜——超过60%的情况下，柜内都放着一台青绿与白色相间的胡佛吸尘器，原因不明。"
  zh_Hant: "補遺：客廳三扇門中有一扇始終通往儲物櫃——超過60%的情況下，櫃內都放著一台青綠與白色相間的胡佛吸塵器，原因不明。"
