  - scene: >
      Nameless native entities block the path as shadowed fairy-like figures; the explorer gestures cautiously without speaking or writing any names. No text.
    characters: [scp-4000-forest]
    source: {section: Description, quote: "Native entities often obstruct the trail which subjects tread, making it necessary for subjects to interact with them to progress.", url: "https://scp-wiki.wikidot.com/scp-4000", fetched_at: "2026-09-21T00:00:00Z"}
    caption:
      ja: "現地の実体は進路をふさぐことが多く、進むためにはそれらとやり取りしなければならない場合があります。"
