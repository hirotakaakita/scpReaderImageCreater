      A single dirt path through the strange forest, seen from behind an explorer who must keep moving forward; side paths fade into impossible geometry.
    characters: [scp-4000-forest]
    source: {section: Description, quote: "The only way to reliably traverse the unusual terrain is by use of a single dirt path... The sole safe road may only be traversed in a single direction", url: "https://scp-wiki.wikidot.com/scp-4000", fetched_at: "2026-09-21T00:00:00Z"}
    caption:
