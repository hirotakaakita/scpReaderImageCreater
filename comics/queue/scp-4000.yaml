    name: "SCP-4000 forest"
    appearance: >
      An extradimensional forested area with a dilapidated brick well, one dirt path,
      dense strange woodland and nameless native entities implied by silhouettes.
    default_look: >
      Dreamlike but dangerous woodland where names and descriptions have physical consequences.
panels:
  - scene: >
      A strange forest outside normal space with a dilapidated brick well fixed into the forest floor, low mist and no readable signs or labels.
    characters: [scp-4000-forest]
    source: {section: Description, quote: "The SCP in question is an extradimensional forested area with numerous anomalous qualities, including a hazardous nomenclative phenomenon.", url: "https://scp-wiki.wikidot.com/scp-4000", fetched_at: "2026-09-21T00:00:00Z"}
    caption:
      ja: "SCP-4000は、多数の異常性と危険な命名現象を持つ、通常空間外の森林領域です。"
      en: "SCP-4000 is an extradimensional forested area with many anomalous qualities, including a hazardous nomenclative phenomenon."
