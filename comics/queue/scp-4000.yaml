  - scene: >
      Surreal breach montage: a person with a severe headache, impossible plants sprouting indoors, and a doorway opening into the nameless forest; no readable words anywhere.
    characters: [scp-4000-forest]
    source: {section: Description, quote: "Documented nomenclative phenomena have included episodic cluster headaches... hallucinations... psychogenic amnesia... sudden involuntary transport... manifestation of various flora within indoor spaces", url: "https://scp-wiki.wikidot.com/scp-4000", fetched_at: "2026-09-21T00:00:00Z"}
    caption:
      ja: "一貫した名称を用いると、群発頭痛、幻覚、記憶喪失、屋内での植物発生、森林への突然の転移などが記録されています。"
      en: "Consistent naming has caused cluster headaches, hallucinations, amnesia, indoor plant manifestations, and sudden transport to the nameless forest."
