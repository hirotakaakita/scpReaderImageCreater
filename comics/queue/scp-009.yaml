panels:
  - scene: >
      Wide shot, full body, eye level, showing the whole containment
      chamber. Behind a thick frost-covered observation window, a
      heat-resistant metal tank holds a slush of brilliant red liquid
      and jagged red ice, faint red vapor curling above it. On the left
      side of the frame, attending-researcher-f stands at the window in
      a heavy coat, clipboard in hand, breath visible in the cold.
    characters: [attending-researcher-f]
    caption:
      ja: "SCP-009は蒸留水（H2O）に酷似した物質であり、量は約██リットル、ただし鮮やかな赤い色を呈している点が異なる。通常の水とは対照的に、SCP-009は摂氏マイナス100度から0度の間で液体状態をとり、それより高い温度では固体状態になる。"
      en: "SCP-009 is approximately ██ liters of a substance which superficially resembles distilled water, except with a distinct bright red hue. In contrast to mundane water, SCP-009 assumes a liquid phase between -100°C and 0°C, and a solid state above those temperatures."
      cs: "SCP-009 je přibližně ██ litrů látky, která povrchně připomíná destilovanou vodu, avšak s výraznou jasně červenou barvou. Na rozdíl od běžné vody přechází SCP-009 do kapalné fáze mezi -100 °C a 0 °C a nad touto hranicí do pevného stavu."
      de: "SCP-009 besteht aus etwa ██ Litern einer Substanz, die oberflächlich destilliertem Wasser ähnelt, jedoch eine ausgeprägte leuchtend rote Färbung aufweist. Im Gegensatz zu gewöhnlichem Wasser nimmt SCP-009 zwischen -100 °C und 0 °C einen flüssigen Zustand an und wird oberhalb dieser Temperaturen fest."
      es: "SCP-009 consiste en aproximadamente ██ litros de una sustancia que superficialmente se asemeja al agua destilada, salvo por un distintivo tono rojo brillante. A diferencia del agua común, SCP-009 adopta una fase líquida entre -100 °C y 0 °C, y un estado sólido por encima de esas temperaturas."
      fr: "Le SCP-009 se compose d'environ ██ litres d'une substance qui ressemble superficiellement à de l'eau distillée, à l'exception d'une teinte rouge vif distinctive. Contrairement à l'eau ordinaire, le SCP-009 adopte une phase liquide entre -100 °C et 0 °C, et un état solide au-dessus de ces températures."
      it: "SCP-009 è composto da circa ██ litri di una sostanza che assomiglia superficialmente ad acqua distillata, salvo per una distinta tonalità rosso vivo. A differenza dell'acqua comune, SCP-009 assume una fase liquida tra -100 °C e 0 °C, e uno stato solido al di sopra di queste temperature."
      ko: "SCP-009는 증류수와 겉보기에 유사하지만 뚜렷한 선홍색을 띠는 물질 약 ██리터로 구성된다. 일반적인 물과 달리 SCP-009는 영하 100도에서 0도 사이에서 액체 상태를 취하며, 그 이상의 온도에서는 고체 상태가 된다."
      pl: "SCP-009 to około ██ litrów substancji przypominającej z pozoru wodę destylowaną, z tą różnicą, że ma wyraźny jaskrawoczerwony odcień. W przeciwieństwie do zwykłej wody, SCP-009 przyjmuje postać ciekłą w zakresie od -100°C do 0°C, a powyżej tych temperatur staje się ciałem stałym."
      pt: "O SCP-009 consiste em aproximadamente ██ litros de uma substância que se assemelha superficialmente à água destilada, exceto por uma tonalidade vermelha vibrante distinta. Ao contrário da água comum, o SCP-009 assume estado líquido entre -100°C e 0°C, e estado sólido acima dessas temperaturas."
      th: "SCP-009 ประกอบด้วยสารประมาณ ██ ลิตรที่มีลักษณะภายนอกคล้ายน้ำกลั่น ยกเว้นสีแดงสดที่เด่นชัด ตรงข้ามกับน้ำทั่วไป SCP-009 จะอยู่ในสถานะของเหลวที่อุณหภูมิระหว่าง -100°C ถึง 0°C และเป็นของแข็งที่อุณหภูมิสูงกว่านั้น"
      uk: "SCP-009 складається приблизно з ██ літрів речовини, яка зовні нагадує дистильовану воду, за винятком виразного яскраво-червоного відтінку. На відміну від звичайної води, SCP-009 набуває рідкого стану в діапазоні від -100°C до 0°C, а вище цих температур переходить у твердий стан."
      vi: "SCP-009 bao gồm khoảng ██ lít một chất trông giống nước cất, ngoại trừ có màu đỏ tươi rõ rệt. Trái ngược với nước thông thường, SCP-009 tồn tại ở thể lỏng trong khoảng nhiệt độ từ -100°C đến 0°C, và ở thể rắn khi cao hơn mức nhiệt độ đó."
      zh: "SCP-009由约██升的物质组成，其外观类似蒸馏水，唯有一种明显的鲜红色调不同。与普通水相反，SCP-009在零下100°C至0°C之间呈液态，高于该温度区间则呈固态。"
      zh_Hant: "SCP-009由約██公升的物質組成，其外觀類似蒸餾水，唯有一種明顯的鮮紅色調不同。與普通水相反，SCP-009在零下100°C至0°C之間呈液態，高於該溫度區間則呈固態。"

  - scene: >
      Medium shot, waist-up, low angle, a different framing from the
      establishing shot. On the left side of the frame,
      attending-researcher-m stands fully suited in a bulky white
      vacuum-rated environmental suit with a sealed helmet, adjusting a
      valve on the tank. On the right side of the frame,
      attending-researcher-f, also fully suited, monitors a bank of
      temperature gauges mounted on the wall.
    characters: [attending-researcher-m, attending-researcher-f]
    caption:
      ja: "収容区域は試験中、完全な真空状態に保たなければならず、SCP-009と接触する職員は完全な環境防護装備を着用する。試験終了後、全ての機材および職員は脱水処理を受け、12時間以上の隔離期間を経なければならない。"
      en: "Containment area is to be kept in total vacuum during testing, and personnel interacting with SCP-009 must wear full environmental protection gear. Following testing, all equipment and personnel must undergo dehydration procedures and be quarantined for no less than 12 hours."
      cs: "Prostor obsahující objekt musí být během testování udržován v úplném vakuu a personál pracující se SCP-009 musí nosit kompletní ochranné obleky proti prostředí. Po testování musí veškeré vybavení a personál projít dehydratačními postupy a být v karanténě po dobu nejméně 12 hodin."
      de: "Der Containment-Bereich ist während der Tests in vollständigem Vakuum zu halten, und Personal, das mit SCP-009 interagiert, muss vollständige Umweltschutzausrüstung tragen. Nach den Tests müssen sämtliche Ausrüstung und das Personal Dehydratationsverfahren durchlaufen und für mindestens 12 Stunden unter Quarantäne gestellt werden."
      es: "El área de contención debe mantenerse en vacío total durante las pruebas, y el personal que interactúe con SCP-009 debe usar equipo de protección ambiental completo. Después de las pruebas, todo el equipo y el personal deben someterse a procedimientos de deshidratación y permanecer en cuarentena durante no menos de 12 horas."
      fr: "La zone de confinement doit être maintenue sous vide total pendant les tests, et le personnel interagissant avec le SCP-009 doit porter un équipement de protection environnementale complet. Après les tests, tout l'équipement et le personnel doivent subir des procédures de déshydratation et être mis en quarantaine pendant au moins 12 heures."
      it: "L'area di contenimento deve essere mantenuta sotto vuoto totale durante i test, e il personale che interagisce con SCP-009 deve indossare un equipaggiamento di protezione ambientale completo. Dopo i test, tutta l'attrezzatura e il personale devono sottoporsi a procedure di disidratazione ed essere messi in quarantena per non meno di 12 ore."
      ko: "수용 구역은 실험 중 완전한 진공 상태로 유지되어야 하며, SCP-009와 상호작용하는 직원은 완전한 환경 보호 장비를 착용해야 한다. 실험 종료 후 모든 장비와 직원은 탈수 절차를 거쳐야 하며 최소 12시간 동안 격리되어야 한다."
      pl: "Obszar kontenerowy musi być utrzymywany w całkowitej próżni podczas testów, a personel mający kontakt z SCP-009 musi nosić pełny strój ochrony środowiskowej. Po testach cały sprzęt i personel muszą przejść procedury odwodnienia i zostać poddani kwarantannie przez co najmniej 12 godzin."
      pt: "A área de contenção deve ser mantida em vácuo total durante os testes, e o pessoal que interage com o SCP-009 deve usar equipamento de proteção ambiental completo. Após os testes, todo o equipamento e pessoal devem passar por procedimentos de desidratação e ficar em quarentena por no mínimo 12 horas."
      th: "พื้นที่กักกันต้องรักษาสภาพสุญญากาศสมบูรณ์ระหว่างการทดสอบ และเจ้าหน้าที่ที่มีปฏิสัมพันธ์กับ SCP-009 ต้องสวมชุดป้องกันสภาพแวดล้อมแบบเต็มรูปแบบ หลังการทดสอบ อุปกรณ์และเจ้าหน้าที่ทั้งหมดต้องผ่านกระบวนการขจัดความชื้นและถูกกักตัวไม่น้อยกว่า 12 ชั่วโมง"
      uk: "Зону утримання слід підтримувати в стані повного вакууму під час тестування, а персонал, що взаємодіє з SCP-009, повинен носити повний комплект захисного спорядження. Після тестування все обладнання та персонал повинні пройти процедури зневоднення та перебувати на карантині щонайменше 12 годин."
      vi: "Khu vực chứa phải được duy trì chân không hoàn toàn trong quá trình thử nghiệm, và nhân viên tương tác với SCP-009 phải mặc thiết bị bảo hộ môi trường đầy đủ. Sau khi thử nghiệm, toàn bộ thiết bị và nhân viên phải trải qua quy trình khử nước và được cách ly trong ít nhất 12 giờ."
      zh: "在测试期间，收容区域必须保持完全真空状态，与SCP-009接触的人员必须穿戴全套环境防护装备。测试结束后，所有设备和人员必须接受脱水处理，并隔离不少于12小时。"
      zh_Hant: "在測試期間，收容區域必須保持完全真空狀態，與SCP-009接觸的人員必須穿戴全套環境防護裝備。測試結束後，所有設備和人員必須接受脫水處理，並隔離不少於12小時。"

  - scene: >
      Close-up, filling most of the frame, on a forgotten paper cup of
      tea sitting on a cart just outside the sealed line, its surface
      already crusting over with the same brilliant red frost, faint red
      mist curling from its rim. At the very edge of the frame,
      attending-researcher-m's gloved hand freezes mid-reach toward it,
      not quite touching.
    characters: [attending-researcher-m]
    caption:
      ja: "SCP-009の最も危険な性質は、通常のH2Oを汚染する能力である。あらゆる水溶液と接触すると、SCP-009はその異常な性質を他の物体へと伝播させる。試験の結果、氷、水蒸気、紅茶、果汁、海水を同化できることが確認されている。"
      en: "The most hazardous property of SCP-009 is its ability to contaminate normal H2O. When in contact with any aqueous solution, SCP-009 will transfer its anomalous properties to other objects. Testing has shown it capable of assimilating ice, steam, tea, fruit juice, and seawater."
      cs: "Nejnebezpečnější vlastností SCP-009 je jeho schopnost kontaminovat běžnou H2O. Při kontaktu s jakýmkoli vodným roztokem SCP-009 přenese své anomální vlastnosti na jiné objekty. Testy prokázaly, že dokáže asimilovat led, páru, čaj, ovocnou šťávu a mořskou vodu."
      de: "Die gefährlichste Eigenschaft von SCP-009 ist seine Fähigkeit, gewöhnliches H2O zu kontaminieren. Bei Kontakt mit jeder wässrigen Lösung überträgt SCP-009 seine anomalen Eigenschaften auf andere Objekte. Tests haben gezeigt, dass es Eis, Dampf, Tee, Fruchtsaft und Meerwasser assimilieren kann."
      es: "La propiedad más peligrosa de SCP-009 es su capacidad de contaminar el H2O normal. Al entrar en contacto con cualquier solución acuosa, SCP-009 transfiere sus propiedades anómalas a otros objetos. Las pruebas han demostrado que es capaz de asimilar hielo, vapor, té, jugo de frutas y agua de mar."
      fr: "La propriété la plus dangereuse du SCP-009 est sa capacité à contaminer l'H2O ordinaire. Au contact de toute solution aqueuse, le SCP-009 transfère ses propriétés anormales à d'autres objets. Les tests ont montré qu'il est capable d'assimiler la glace, la vapeur, le thé, le jus de fruits et l'eau de mer."
      it: "La proprietà più pericolosa di SCP-009 è la sua capacità di contaminare la normale H2O. A contatto con qualsiasi soluzione acquosa, SCP-009 trasferisce le sue proprietà anomale ad altri oggetti. I test hanno dimostrato che è in grado di assimilare ghiaccio, vapore, tè, succo di frutta e acqua di mare."
      ko: "SCP-009의 가장 위험한 특성은 일반적인 H2O를 오염시키는 능력이다. 어떤 수용액과 접촉하든 SCP-009는 그 이상 속성을 다른 물체로 전이시킨다. 실험 결과 얼음, 수증기, 홍차, 과일 주스, 바닷물을 동화시킬 수 있는 것으로 나타났다."
      pl: "Najbardziej niebezpieczną właściwością SCP-009 jest jego zdolność do skażania zwykłej H2O. W kontakcie z dowolnym roztworem wodnym SCP-009 przenosi swoje anomalne właściwości na inne obiekty. Testy wykazały, że jest w stanie asymilować lód, parę, herbatę, sok owocowy i wodę morską."
      pt: "A propriedade mais perigosa do SCP-009 é sua capacidade de contaminar o H2O normal. Ao entrar em contato com qualquer solução aquosa, o SCP-009 transfere suas propriedades anômalas para outros objetos. Testes mostraram que é capaz de assimilar gelo, vapor, chá, suco de frutas e água do mar."
      th: "คุณสมบัติที่อันตรายที่สุดของ SCP-009 คือความสามารถในการปนเปื้อน H2O ปกติ เมื่อสัมผัสกับสารละลายที่มีน้ำเป็นส่วนประกอบใดๆ SCP-009 จะถ่ายทอดคุณสมบัติผิดปกติไปยังวัตถุอื่น การทดสอบแสดงให้เห็นว่ามันสามารถกลืนกลายน้ำแข็ง ไอน้ำ ชา น้ำผลไม้ และน้ำทะเลได้"
      uk: "Найнебезпечнішою властивістю SCP-009 є його здатність забруднювати звичайну H2O. При контакті з будь-яким водним розчином SCP-009 передає свої аномальні властивості іншим об'єктам. Випробування показали, що він здатен асимілювати лід, пару, чай, фруктовий сік і морську воду."
      vi: "Đặc tính nguy hiểm nhất của SCP-009 là khả năng làm nhiễm bẩn H2O thông thường. Khi tiếp xúc với bất kỳ dung dịch chứa nước nào, SCP-009 sẽ truyền các đặc tính dị thường của nó sang vật thể khác. Thử nghiệm cho thấy nó có khả năng đồng hóa nước đá, hơi nước, trà, nước ép trái cây và nước biển."
      zh: "SCP-009最危险的特性是其污染普通H2O的能力。一旦与任何含水溶液接触，SCP-009便会将其异常特性转移到其他物体上。测试表明它能够同化冰、水蒸气、茶、果汁和海水。"
      zh_Hant: "SCP-009最危險的特性是其污染普通H2O的能力。一旦與任何含水溶液接觸，SCP-009便會將其異常特性轉移到其他物體上。測試表明牠能夠同化冰、水蒸氣、茶、果汁和海水。"

  - scene: >
      Wide shot, full body, eye level, pulled back to show the whole
      corridor leading to the containment area, a very different framing
      from the tight close-up before. On the left side of the frame,
      attending-researcher-f stands squarely in the doorway with one arm
      barring the way, palm raised sternly. On the right side of the
      frame, attending-researcher-m stands frozen mid-step just outside,
      a steaming coffee cup halfway raised to his mouth, eyes wide with
      guilty realization.
    characters: [attending-researcher-f, attending-researcher-m]
    caption:
      ja: "対象の収容区域から30メートル以内には、いかなる水溶液の持ち込みも許可されない。"
      en: "No water-based solutions shall be allowed within 30 meters of the object's containment area."
      cs: "V okruhu 30 metrů od kontejnmentové oblasti objektu nesmí být povoleny žádné roztoky na bázi vody."
      de: "Innerhalb von 30 Metern um den Containment-Bereich des Objekts sind keine wasserbasierten Lösungen zugelassen."
      es: "No se permitirá ninguna solución a base de agua dentro de un radio de 30 metros del área de contención del objeto."
      fr: "Aucune solution à base d'eau ne doit être autorisée dans un rayon de 30 mètres autour de la zone de confinement de l'objet."
      it: "Nessuna soluzione a base d'acqua è ammessa entro 30 metri dall'area di contenimento dell'oggetto."
      ko: "대상의 수용 구역에서 30미터 이내에는 어떠한 수용액도 허용되지 않는다."
      pl: "W promieniu 30 metrów od obszaru kontenerowego obiektu nie mogą znajdować się żadne roztwory na bazie wody."
      pt: "Nenhuma solução à base de água será permitida dentro de 30 metros da área de contenção do objeto."
      th: "ห้ามนำสารละลายที่มีน้ำเป็นส่วนประกอบใดๆ เข้ามาภายในระยะ 30 เมตรจากพื้นที่กักกันของวัตถุ"
      uk: "У межах 30 метрів від зони утримання об'єкта заборонено перебування будь-яких водних розчинів."
      vi: "Không được phép mang bất kỳ dung dịch gốc nước nào vào trong phạm vi 30 mét quanh khu vực chứa vật thể."
      zh: "在该物体收容区域30米范围内，不得携带任何含水溶液。"
      zh_Hant: "在該物體收容區域30公尺範圍內，不得攜帶任何含水溶液。"

addendum:
  ja: "O5司令部からのメモ：この物体は当面ユークリッドクラスのままとする。電源さえ落とさず、誰も収容区域に近づかなければ、問題はないはずだ。"
  en: "Memo from O5 Command: We've decided to keep this thing Euclid for now. As long as you keep the power on and nobody goes near its containment area, there shouldn't be a problem."
  cs: "Zpráva od velení O5: Prozatím jsme se rozhodli ponechat tuto věc jako Euclid. Dokud udržíte napájení a nikdo se nepřiblíží k jeho kontejnmentové oblasti, nemělo by dojít k žádnému problému."
  de: "Memo vom O5-Kommando: Wir haben beschlossen, dieses Ding vorerst als Euclid einzustufen. Solange ihr den Strom eingeschaltet lasst und niemand sich dem Containment-Bereich nähert, sollte es kein Problem geben."
  es: "Memorándum del Comando O5: Hemos decidido mantener esto como Euclid por ahora. Mientras mantengan la energía encendida y nadie se acerque a su área de contención, no debería haber ningún problema."
  fr: "Mémo du Commandement O5 : Nous avons décidé de garder cette chose en classe Euclide pour l'instant. Tant que vous gardez l'alimentation allumée et que personne ne s'approche de sa zone de confinement, il ne devrait pas y avoir de problème."
  it: "Memo dal Comando O5: Abbiamo deciso di mantenere questa cosa come Euclid per ora. Finché tenete l'alimentazione accesa e nessuno si avvicina alla sua area di contenimento, non dovrebbero esserci problemi."
  ko: "O5 사령부 메모: 이것은 당분간 유클리드 등급으로 유지하기로 했다. 전원을 계속 켜두고 아무도 수용 구역에 접근하지 않는 한 문제는 없을 것이다."
  pl: "Notatka od Dowództwa O5: Zdecydowaliśmy się na razie zachować klasę Euclid dla tej rzeczy. Dopóki zasilanie będzie włączone i nikt nie zbliży się do obszaru kontenerowego, nie powinno być problemu."
  pt: "Memorando do Comando O5: Decidimos manter isso como Euclid por enquanto. Contanto que mantenham a energia ligada e ninguém se aproxime da área de contenção, não deve haver problema."
  th: "บันทึกจากกองบัญชาการ O5: เราตัดสินใจให้วัตถุนี้ยังคงเป็นระดับ Euclid ไปก่อน ตราบใดที่ยังเปิดไฟฟ้าไว้และไม่มีใครเข้าใกล้พื้นที่กักกัน ก็ไม่น่าจะมีปัญหา"
  uk: "Записка від командування O5: Ми вирішили поки що залишити це як Евклід. Поки живлення увімкнене і ніхто не наближається до зони утримання, проблем виникнути не повинно."
  vi: "Bản ghi nhớ từ Bộ Chỉ Huy O5: Chúng tôi quyết định giữ nguyên phân loại Euclid cho thứ này trong lúc này. Miễn là các bạn giữ nguồn điện luôn bật và không ai đến gần khu vực chứa, sẽ không có vấn đề gì."
  zh: "O5指挥部备忘录：我们决定暂时将这东西保持为欧几里得级。只要保持电源开启，且没有人靠近其收容区域，应该不会有问题。"
  zh_Hant: "O5指揮部備忘錄：我們決定暫時將這東西保持為歐幾里得級。只要保持電源開啟，且沒有人靠近其收容區域，應該不會有問題。"
