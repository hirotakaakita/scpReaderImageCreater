# SCP-009 4コマ台本
# captionはSpecial Containment Procedures / Description本文からの引用。
# D-Class実験の変換プロセス（Stage 1-4、出血等の描写を含む）とAddendum内の
# 発見時の遺体描写はグロ回避のため本編に含めていない。O5司令部のメモのみ
# addendumの一言として使用。キャラにセリフは言わせない。JP公式訳が直接取得
