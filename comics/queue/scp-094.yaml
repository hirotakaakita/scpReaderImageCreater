panels:
  - scene: >
      Wide shot, full body, showing the whole reinforced containment
      room. A perfectly black sphere hangs suspended in mid-air at the
      center of a plexiglass cube, no visible support, tether lines
      anchored around the room's walls. attending-researcher-m stands
      near the doorway, secured to a tether, staring up at it.
    characters: [attending-researcher-m]
    caption:
      ja: "SCP-094は、直径163cmの完全な黒球であり、目に見える支持手段なしに地上約3mの高さに浮遊しているように見える。SCP-094は「ミニチュア事象の地平面」に分類されており、光を含め、その中に入ったあらゆる物質は取り戻すことができない。"
      en: "SCP-094 appears to be a perfectly black sphere, 163 cm in diameter, suspended approximately 3 m off the ground with no apparent means of support. SCP-094 has been classified as a miniature event horizon: any matter that moves into it, including light, is irretrievably gone."
      cs: "SCP-094 vypadá jako dokonale černá koule o průměru 163 cm, vznášející se přibližně 3 m nad zemí bez zjevného způsobu podpory. SCP-094 bylo klasifikováno jako miniaturní horizont událostí: veškerá hmota, která se do něj pohne, včetně světla, je nenávratně pryč."
      de: "SCP-094 erscheint als vollkommen schwarze Kugel mit einem Durchmesser von 163 cm, die etwa 3 m über dem Boden ohne erkennbare Stützvorrichtung schwebt. SCP-094 wurde als miniaturhafter Ereignishorizont klassifiziert: Jede Materie, die sich hineinbewegt, einschließlich Licht, ist unwiederbringlich verloren."
      es: "SCP-094 parece ser una esfera perfectamente negra de 163 cm de diámetro, suspendida a unos 3 m del suelo sin medio de sujeción aparente. El SCP-094 ha sido clasificado como un horizonte de sucesos en miniatura: toda materia que se mueve hacia su interior, incluida la luz, desaparece de forma irrecuperable."
      fr: "Le SCP-094 semble être une sphère parfaitement noire de 163 cm de diamètre, suspendue à environ 3 m du sol sans moyen de soutien apparent. Le SCP-094 a été classé comme un horizon des événements miniature : toute matière qui y pénètre, y compris la lumière, disparaît irrémédiablement."
      it: "SCP-094 sembra essere una sfera perfettamente nera del diametro di 163 cm, sospesa a circa 3 m da terra senza alcun mezzo di sostegno apparente. SCP-094 è stato classificato come un orizzonte degli eventi in miniatura: qualsiasi materia che vi entri, luce compresa, è irrimediabilmente persa."
      ko: "SCP-094는 지름 163cm의 완전한 검은 구체로, 눈에 보이는 지지 수단 없이 지상 약 3m 높이에 떠 있는 것으로 보인다. SCP-094는 '축소판 사건의 지평선'으로 분류되어 있으며, 빛을 포함해 그 안으로 이동하는 모든 물질은 되돌릴 수 없이 사라진다."
      pl: "SCP-094 wygląda jak idealnie czarna kula o średnicy 163 cm, unosząca się około 3 m nad ziemią bez widocznego sposobu podparcia. SCP-094 zostało sklasyfikowane jako miniaturowy horyzont zdarzeń: cała materia, która się w nim znajdzie, w tym światło, znika bezpowrotnie."
      pt: "O SCP-094 parece ser uma esfera perfeitamente negra, de 163 cm de diâmetro, suspensa a cerca de 3 m do chão sem meio de sustentação aparente. O SCP-094 foi classificado como um horizonte de eventos em miniatura: toda matéria que entra nele, incluindo luz, desaparece irrecuperavelmente."
      th: "SCP-094 มีลักษณะเป็นทรงกลมสีดำสนิท เส้นผ่านศูนย์กลาง 163 ซม. ลอยอยู่สูงจากพื้นประมาณ 3 เมตรโดยไม่มีสิ่งใดค้ำจุนให้เห็น SCP-094 ถูกจัดว่าเป็น 'ขอบฟ้าเหตุการณ์ขนาดจิ๋ว' สสารใดๆ ที่เคลื่อนเข้าไปในนั้น รวมถึงแสง จะสูญหายไปอย่างไม่สามารถนำกลับคืนมาได้"
      uk: "SCP-094 виглядає як абсолютно чорна сфера діаметром 163 см, підвішена приблизно на 3 м над землею без видимих засобів підтримки. SCP-094 класифікується як мініатюрний горизонт подій: будь-яка матерія, що потрапляє всередину, включно зі світлом, безповоротно зникає."
      vi: "SCP-094 trông giống một quả cầu đen tuyền, đường kính 163 cm, lơ lửng cách mặt đất khoảng 3 m mà không có bất kỳ phương tiện nâng đỡ nào rõ ràng. SCP-094 được phân loại là chân trời sự kiện thu nhỏ: bất kỳ vật chất nào di chuyển vào trong nó, kể cả ánh sáng, đều biến mất không thể lấy lại được."
      zh: "SCP-094外观是一个纯黑色的球体，直径163厘米，悬浮在离地约3米的空中，没有任何可见的支撑物。SCP-094被归类为「微型事件视界」：任何进入其内部的物质，包括光，都将无法挽回地消失。"
      zh_Hant: "SCP-094外觀是一個純黑色的球體，直徑163公分，懸浮在離地約3公尺的空中，沒有任何可見的支撐物。SCP-094被歸類為「微型事件視界」：任何進入其內部的物質，包括光，都將無法挽回地消失。"

  - scene: >
      Medium shot, waist-up, a different framing from the wide shot
      before. attending-researcher-f stands close to the plexiglass
      wall of the cube with headphones pressed to it, eyes closed,
      listening intently, a faint dreamy expression as if drawn toward
      the sound.
    characters: [attending-researcher-f]
    caption:
      ja: "SCP-094は、自然の環境音や静電気のようなブザー音、時には人間の話し声など、さまざまな音を時折発することが知られている。SCP-094とのコミュニケーションを試みた例は、これまでのところすべて成功していない。SCP-094が発する音に惹かれるように見える人物も一部存在する。"
      en: "SCP-094 has been known to occasionally emit a number of different sounds, including ambient sounds of nature, static buzzing, and sometimes human speech. No attempts to communicate with SCP-094 have yet succeeded. A small percentage of persons appear to be drawn to SCP-094 because of the sounds it emanates."
      cs: "Je známo, že SCP-094 příležitostně vydává řadu různých zvuků, včetně přírodních zvuků prostředí, statického bzučení a někdy i lidské řeči. Dosud se nepodařilo se SCP-094 úspěšně komunikovat. Zdá se, že malé procento lidí je k SCP-094 přitahováno kvůli zvukům, které vydává."
      de: "Es ist bekannt, dass SCP-094 gelegentlich eine Reihe unterschiedlicher Geräusche von sich gibt, darunter Umgebungsgeräusche der Natur, statisches Summen und manchmal menschliche Sprache. Versuche, mit SCP-094 zu kommunizieren, waren bisher erfolglos. Ein kleiner Prozentsatz der Menschen scheint von den Geräuschen, die SCP-094 aussendet, angezogen zu werden."
      es: "Se sabe que el SCP-094 emite ocasionalmente diversos sonidos, incluyendo sonidos ambientales de la naturaleza, zumbidos estáticos y, a veces, habla humana. Ningún intento de comunicarse con el SCP-094 ha tenido éxito hasta ahora. Un pequeño porcentaje de personas parece sentirse atraído por el SCP-094 debido a los sonidos que emite."
      fr: "Le SCP-094 est connu pour émettre occasionnellement divers sons, notamment des bruits ambiants de la nature, des grésillements statiques et parfois de la parole humaine. Aucune tentative de communication avec le SCP-094 n'a encore réussi. Un faible pourcentage de personnes semble être attiré par le SCP-094 en raison des sons qu'il émet."
      it: "È noto che SCP-094 emette occasionalmente una serie di suoni diversi, tra cui suoni ambientali della natura, ronzii statici e talvolta parlato umano. Nessun tentativo di comunicare con SCP-094 ha ancora avuto successo. Una piccola percentuale di persone sembra essere attratta da SCP-094 a causa dei suoni che emana."
      ko: "SCP-094는 이따금 자연의 주변음, 정전기 잡음, 때로는 사람의 말소리를 포함한 다양한 소리를 방출하는 것으로 알려져 있다. SCP-094와 소통을 시도한 사례는 아직까지 성공한 적이 없다. 소수의 사람들은 SCP-094가 방출하는 소리에 이끌리는 것으로 보인다."
      pl: "Wiadomo, że SCP-094 sporadycznie emituje wiele różnych dźwięków, w tym otoczeniowe odgłosy natury, statyczne brzęczenie, a czasem ludzką mowę. Żadna próba komunikacji z SCP-094 nie zakończyła się dotąd sukcesem. Wydaje się, że niewielki odsetek ludzi jest przyciągany do SCP-094 przez wydawane przez nie dźwięki."
      pt: "Sabe-se que o SCP-094 emite ocasionalmente vários sons diferentes, incluindo sons ambientes da natureza, zumbido estático e, às vezes, fala humana. Nenhuma tentativa de se comunicar com o SCP-094 teve sucesso até agora. Uma pequena porcentagem de pessoas parece ser atraída pelo SCP-094 devido aos sons que ele emana."
      th: "เป็นที่ทราบกันว่า SCP-094 บางครั้งจะปล่อยเสียงต่างๆ ออกมา รวมถึงเสียงธรรมชาติแวดล้อม เสียงหึ่งแบบสัญญาณรบกวน และบางครั้งก็เป็นเสียงพูดของมนุษย์ ความพยายามในการสื่อสารกับ SCP-094 ยังไม่ประสบความสำเร็จเลยจนถึงขณะนี้ มีคนจำนวนน้อยที่ดูเหมือนจะถูกดึงดูดเข้าหา SCP-094 เนื่องจากเสียงที่มันปล่อยออกมา"
      uk: "Відомо, що SCP-094 час від часу видає низку різних звуків, зокрема природні звуки навколишнього середовища, статичне гудіння, а іноді й людську мову. Жодна спроба зв'язатися з SCP-094 досі не увінчалася успіхом. Невеликий відсоток людей, здається, тягне до SCP-094 через звуки, які він видає."
      vi: "SCP-094 được biết là thỉnh thoảng phát ra một số âm thanh khác nhau, bao gồm âm thanh môi trường tự nhiên, tiếng vo ve tĩnh điện, và đôi khi là giọng nói con người. Chưa có nỗ lực giao tiếp nào với SCP-094 thành công. Một tỷ lệ nhỏ người dường như bị thu hút bởi SCP-094 do những âm thanh mà nó phát ra."
      zh: "已知SCP-094偶尔会发出多种不同的声音，包括自然环境声、静电嗡鸣声，有时甚至是人类的说话声。迄今为止，所有试图与SCP-094沟通的尝试均未成功。有一小部分人似乎会因SCP-094所发出的声音而受到吸引。"
      zh_Hant: "已知SCP-094偶爾會發出多種不同的聲音，包括自然環境聲、靜電嗡鳴聲，有時甚至是人類的說話聲。迄今為止，所有試圖與SCP-094溝通的嘗試均未成功。有一小部分人似乎會因SCP-094所發出的聲音而受到吸引。"

  - scene: >
      Wide shot, side-by-side comparison, a different framing from the
      medium shot before. attending-researcher-m holds up two
      photographs to compare: an old sepia-toned photo on the left
      showing a small dark sphere, and a modern full-color photo on the
      right showing a much larger version of the same sphere.
    characters: [attending-researcher-m]
    caption:
      ja: "SCP-094は1920年代、アルゼンチン南部で発見された当時、直径は約20〜25cmと推定されていた。過去の記録の分析によると、SCP-094の直径はおよそ31年ごとに倍になっている。"
      en: "SCP-094 was discovered in the 1920s in southern Argentina, at the time estimated to be 20 to 25 cm in diameter. Analysis of historical records indicates that the diameter of SCP-094 doubles in size approximately every 31 years."
      cs: "SCP-094 bylo objeveno ve 20. letech 20. století v jižní Argentině, kdy byl jeho průměr odhadován na 20 až 25 cm. Analýza historických záznamů naznačuje, že se průměr SCP-094 přibližně každých 31 let zdvojnásobuje."
      de: "SCP-094 wurde in den 1920er Jahren im Süden Argentiniens entdeckt, wobei sein Durchmesser damals auf 20 bis 25 cm geschätzt wurde. Die Analyse historischer Aufzeichnungen deutet darauf hin, dass sich der Durchmesser von SCP-094 etwa alle 31 Jahre verdoppelt."
      es: "El SCP-094 fue descubierto en la década de 1920 en el sur de Argentina, en cuyo momento se estimaba que tenía un diámetro de 20 a 25 cm. El análisis de registros históricos indica que el diámetro del SCP-094 se duplica aproximadamente cada 31 años."
      fr: "Le SCP-094 a été découvert dans les années 1920 dans le sud de l'Argentine, alors qu'il était estimé mesurer entre 20 et 25 cm de diamètre. L'analyse des registres historiques indique que le diamètre du SCP-094 double environ tous les 31 ans."
      it: "SCP-094 fu scoperto negli anni '20 nel sud dell'Argentina, quando si stimava avesse un diametro di 20-25 cm. L'analisi dei documenti storici indica che il diametro di SCP-094 raddoppia approssimativamente ogni 31 anni."
      ko: "SCP-094는 1920년대 아르헨티나 남부에서 발견되었으며, 당시 지름은 약 20~25cm로 추정되었다. 역사적 기록 분석에 따르면 SCP-094의 지름은 약 31년마다 두 배로 커지는 것으로 나타났다."
      pl: "SCP-094 zostało odkryte w latach 20. XX wieku w południowej Argentynie, gdzie szacowano wówczas jego średnicę na 20 do 25 cm. Analiza zapisów historycznych wskazuje, że średnica SCP-094 podwaja się w przybliżeniu co 31 lat."
      pt: "O SCP-094 foi descoberto na década de 1920 no sul da Argentina, quando se estimava que tinha entre 20 e 25 cm de diâmetro. A análise de registros históricos indica que o diâmetro do SCP-094 dobra a cada 31 anos, aproximadamente."
      th: "SCP-094 ถูกค้นพบในช่วงทศวรรษ 1920 ทางตอนใต้ของอาร์เจนตินา ในขณะนั้นประเมินว่ามีเส้นผ่านศูนย์กลางประมาณ 20 ถึง 25 ซม. การวิเคราะห์บันทึกทางประวัติศาสตร์ชี้ให้เห็นว่าเส้นผ่านศูนย์กลางของ SCP-094 เพิ่มขึ้นเป็นสองเท่าโดยประมาณทุก 31 ปี"
      uk: "SCP-094 було виявлено у 1920-х роках на півдні Аргентини, коли його діаметр оцінювався у 20-25 см. Аналіз історичних записів свідчить, що діаметр SCP-094 подвоюється приблизно кожні 31 рік."
      vi: "SCP-094 được phát hiện vào những năm 1920 ở miền nam Argentina, khi đó được ước tính có đường kính từ 20 đến 25 cm. Phân tích các ghi chép lịch sử cho thấy đường kính của SCP-094 tăng gấp đôi khoảng mỗi 31 năm."
      zh: "SCP-094于1920年代在阿根廷南部被发现，当时估计其直径约为20至25厘米。历史记录分析显示，SCP-094的直径大约每31年就会翻一倍。"
      zh_Hant: "SCP-094於1920年代在阿根廷南部被發現，當時估計其直徑約為20至25公分。歷史記錄分析顯示，SCP-094的直徑大約每31年就會翻一倍。"

  - scene: >
      Wide shot, low angle, dramatic, a different framing from the wide
      shot before. attending-researcher-m and attending-researcher-f
      both stand secured to tethers anchored in the floor and walls,
      one holding a tranquilizer rifle, both facing the black sphere
      warily.
    characters: [attending-researcher-m, attending-researcher-f]
    caption:
      ja: "すべての職員は、室内の床に足を踏み入れる前に、壁に固定されたテザーで自らを確保しなければならない。警備要員は通常の装備に加え、麻酔銃を携行すること。"
      en: "All personnel must secure themselves to tethers anchored to the walls before stepping onto the floor of the room. Security personnel are to be armed with tranquilizer guns in addition to standard armaments."
      cs: "Veškerý personál se musí před vstupem na podlahu místnosti zajistit lany ukotvenými ke stěnám. Bezpečnostní personál musí být kromě standardní výzbroje vybaven uspávacími zbraněmi."
      de: "Das gesamte Personal muss sich mit an den Wänden verankerten Leinen sichern, bevor es den Boden des Raumes betritt. Sicherheitspersonal ist zusätzlich zur Standardausrüstung mit Betäubungswaffen auszustatten."
      es: "Todo el personal debe asegurarse con cables anclados a las paredes antes de pisar el suelo de la sala. El personal de seguridad debe estar armado con pistolas tranquilizantes además del armamento estándar."
      fr: "Tout le personnel doit s'attacher à des longes ancrées aux murs avant de poser le pied sur le sol de la salle. Le personnel de sécurité doit être équipé de fusils tranquillisants en plus de l'armement standard."
      it: "Tutto il personale deve assicurarsi con cavi ancorati alle pareti prima di mettere piede sul pavimento della stanza. Il personale di sicurezza deve essere armato con pistole tranquillanti oltre all'armamento standard."
      ko: "모든 인원은 방 바닥에 발을 딛기 전 벽에 고정된 안전줄로 자신을 결속해야 한다. 보안 요원은 표준 무장 외에 마취총을 휴대해야 한다."
      pl: "Cały personel musi zabezpieczyć się linami zakotwiczonymi w ścianach przed wejściem na podłogę pomieszczenia. Personel ochrony ma być uzbrojony w broń usypiającą oprócz standardowego uzbrojenia."
      pt: "Todo o pessoal deve se prender a cabos ancorados nas paredes antes de pisar no chão da sala. O pessoal de segurança deve estar armado com armas tranquilizantes além do armamento padrão."
      th: "เจ้าหน้าที่ทุกคนต้องผูกตัวเองกับสายรัดที่ยึดกับผนังก่อนที่จะก้าวลงบนพื้นห้อง เจ้าหน้าที่รักษาความปลอดภัยต้องพกปืนยาสลบเพิ่มเติมนอกเหนือจากอาวุธมาตรฐาน"
      uk: "Весь персонал повинен закріпитися страхувальними тросами, прикріпленими до стін, перш ніж ступити на підлогу кімнати. Персонал охорони має бути озброєний транквілізаторними рушницями на додаток до стандартного озброєння."
      vi: "Tất cả nhân viên phải tự buộc mình vào dây an toàn được neo vào tường trước khi bước lên sàn phòng. Nhân viên an ninh phải được trang bị súng gây mê bên cạnh vũ khí tiêu chuẩn."
      zh: "所有人员在踏上房间地面之前，必须先将自己固定在锚定于墙壁的安全绳上。安保人员除标准武装外，还须配备麻醉枪。"
      zh_Hant: "所有人員在踏上房間地面之前，必須先將自己固定在錨定於牆壁的安全繩上。安保人員除標準武裝外，還須配備麻醉槍。"

addendum:
  ja: "所感：月あたり数ミリの増加はたいしたことがないように思えるかもしれないが、SCP-094はこの指数関数的成長を続ければ、250年も経たぬうちに直径1kmに達する——これ以上加速しないと仮定しての話だ。——リュウェリン＝ガルシア博士"
  en: "Note: A few millimeters a month may not seem like much, but if SCP-094 continues its exponential growth, in less than two hundred fifty years it will be a kilometer wide — and that assumes it does not grow even faster. — Dr. Llewelyn-Garcia"
  cs: "Poznámka: Několik milimetrů měsíčně se možná nezdá jako mnoho, ale pokud bude SCP-094 pokračovat ve svém exponenciálním růstu, za méně než dvě stě padesát let bude mít průměr jeden kilometr – a to za předpokladu, že neporoste ještě rychleji. — Dr. Llewelyn-Garcia"
  de: "Anmerkung: Ein paar Millimeter pro Monat mögen nicht viel erscheinen, aber wenn SCP-094 sein exponentielles Wachstum fortsetzt, wird es in weniger als zweihundertfünfzig Jahren einen Kilometer breit sein — und das setzt voraus, dass es nicht noch schneller wächst. — Dr. Llewelyn-Garcia"
  es: "Nota: Unos pocos milímetros al mes pueden no parecer mucho, pero si el SCP-094 continúa con su crecimiento exponencial, en menos de doscientos cincuenta años tendrá un kilómetro de ancho, y eso suponiendo que no crezca aún más rápido. — Dra. Llewelyn-Garcia"
  fr: "Note : Quelques millimètres par mois peuvent sembler peu, mais si le SCP-094 poursuit sa croissance exponentielle, en moins de deux cent cinquante ans, il fera un kilomètre de large — et cela en supposant qu'il ne croisse pas encore plus vite. — Dr Llewelyn-Garcia"
  it: "Nota: Pochi millimetri al mese possono non sembrare molto, ma se SCP-094 continua la sua crescita esponenziale, in meno di duecentocinquanta anni avrà un chilometro di larghezza — e questo presumendo che non cresca ancora più velocemente. — Dott.ssa Llewelyn-Garcia"
  ko: "비고: 한 달에 몇 밀리미터라는 수치는 별것 아닌 듯 보일 수 있지만, SCP-094가 이 지수적 성장을 계속한다면 250년도 채 지나지 않아 지름 1킬로미터에 이를 것이다 — 그것도 더 빨리 자라지 않는다는 가정하에서다. — 르웰린-가르시아 박사"
  pl: "Uwaga: Kilka milimetrów miesięcznie może nie wydawać się dużo, ale jeśli SCP-094 będzie kontynuować swój wykładniczy wzrost, w mniej niż dwieście pięćdziesiąt lat będzie miało kilometr szerokości — a to przy założeniu, że nie będzie rosło jeszcze szybciej. — dr Llewelyn-Garcia"
  pt: "Nota: Alguns milímetros por mês podem não parecer muito, mas se o SCP-094 continuar seu crescimento exponencial, em menos de duzentos e cinquenta anos terá um quilômetro de largura — e isso supondo que não cresça ainda mais rápido. — Dra. Llewelyn-Garcia"
  th: "หมายเหตุ: ไม่กี่มิลลิเมตรต่อเดือนอาจดูเหมือนไม่มาก แต่หาก SCP-094 ยังคงเติบโตแบบทวีคูณต่อไป ในเวลาไม่ถึงสองร้อยห้าสิบปีมันจะมีความกว้างถึงหนึ่งกิโลเมตร — และนั่นคือการสมมติว่ามันจะไม่เติบโตเร็วขึ้นไปกว่านี้ — ดร. ลูเวลลิน-การ์เซีย"
  uk: "Примітка: Кілька міліметрів на місяць можуть здатися незначними, але якщо SCP-094 продовжить своє експоненційне зростання, менш ніж за двісті п'ятдесят років він досягне ширини в один кілометр — і це за умови, що він не почне рости ще швидше. — д-р Ллевелін-Гарсія"
  vi: "Ghi chú: Vài milimét mỗi tháng có thể không có vẻ nhiều, nhưng nếu SCP-094 tiếp tục tăng trưởng theo cấp số nhân, trong chưa đầy hai trăm năm mươi năm nó sẽ rộng một km — và đó là giả định nó không tăng trưởng còn nhanh hơn nữa. — Tiến sĩ Llewelyn-Garcia"
  zh: "备注：每月增长几毫米看似微不足道，但若SCP-094继续以指数速度增长，不到二百五十年后它的直径就将达到一公里——而这还是假设它不会增长得更快。——卢埃林-加西亚博士"
  zh_Hant: "備註：每月增長幾毫米看似微不足道，但若SCP-094繼續以指數速度增長，不到二百五十年後它的直徑就將達到一公里——而這還是假設它不會增長得更快。——盧埃林-加西亞博士"
