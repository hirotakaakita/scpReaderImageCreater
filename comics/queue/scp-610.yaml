# SCP-610「にくにくしいもの」4コマ台本
# captionはSpecial Containment Procedures / Descriptionの実際の文章からの引用。
# キャラにセリフは言わせない。感染後の肉体変異（複数の手足が生えるなど）の
# 直接描写は避け、収容手順の異様さ・職員の淡々とした対応という軽い角度に留める。
# SCP-610自体は環境の一部として遠景・シルエットで示すのみで、独立キャラとしては
# 描かない（グロ回避のため）。

id: scp-610

title:
  en: "SCP-610: The Flesh that Hates"
  ja: "SCP-610：にくにくしいもの"
  cs: "SCP-610: Maso, které nenávidí"
  de: "SCP-610: Das Fleisch, das hasst"
  es: "SCP-610: La Carne que Odia"
  fr: "SCP-610 : La Chair qui Hait"
  it: "SCP-610: La Carne che Odia"
  ko: "SCP-610: 증오하는 살점"
  pl: "SCP-610: Ciało, Które Nienawidzi"
  pt: "SCP-610: A Carne que Odeia"
  th: "SCP-610: เนื้อที่เกลียดชัง"
  uk: "SCP-610: Плоть, що ненавидить"
  vi: "SCP-610: Thịt Căm Ghét"
  zh: "SCP-610：憎恨之肉"
  zh_Hant: "SCP-610：憎恨之肉"

attribution:
  article: "SCP-610"
  author: "NekoChris"
  source_url: "http://scp-wiki.wikidot.com/scp-610"
  license: "CC BY-SA 3.0"

object_class: Keter

panels:
  - scene: >
      Wide shot, full body, eye level, showing a security perimeter
      fence stretching off toward the horizon across an overgrown
      Russian countryside landscape. In the foreground, dwarfed by the
      sheer scale of the fence line, attending-researcher-m stands at a
      small checkpoint booth, clipboard in hand, looking out at the
      vast distance the barrier has to cover.
    characters: [attending-researcher-m]
    caption:
      ja: "SCP-610の「感染」領域はあまりに広大であるため、収容は不可能である。ロシア政府より、人々を立ち入らせないための境界線設置の許可が得られている。"
      en: "Due to the vast area of 'infection' SCP-610 covers, containment is impossible. Permission has been granted by the Russian government to establish a perimeter to keep people out."
      cs: "Vzhledem k rozsáhlé oblasti 'nákazy', kterou SCP-610 pokrývá, je zadržení nemožné. Ruská vláda udělila povolení zřídit perimetr, který má lidem zabránit ve vstupu."
      de: "Aufgrund des riesigen 'Infektions'-Gebiets, das SCP-610 bedeckt, ist eine Eindämmung unmöglich. Die russische Regierung hat die Genehmigung erteilt, einen Sperrbereich einzurichten, um Menschen fernzuhalten."
      es: "Debido a la vasta área de 'infección' que cubre SCP-610, la contención es imposible. El gobierno ruso ha concedido permiso para establecer un perímetro que mantenga a la gente fuera."
      fr: "En raison de la vaste zone d'« infection » couverte par le SCP-610, le confinement est impossible. Le gouvernement russe a accordé l'autorisation d'établir un périmètre pour empêcher les gens d'y entrer."
      it: "A causa della vasta area di 'infezione' coperta da SCP-610, il contenimento è impossibile. Il governo russo ha concesso il permesso di stabilire un perimetro per tenere fuori le persone."
      ko: "SCP-610의 '감염' 지역이 너무 광범위하여 수용은 불가능하다. 러시아 정부로부터 사람들의 출입을 막기 위한 경계선 설치 허가를 받았다."
      pl: "Ze względu na ogromny obszar 'infekcji' obejmowany przez SCP-610, powstrzymanie jest niemożliwe. Rząd rosyjski udzielił zgody na ustanowienie perymetru mającego nie wpuszczać ludzi."
      pt: "Devido à vasta área de 'infecção' coberta pelo SCP-610, a contenção é impossível. O governo russo concedeu permissão para estabelecer um perímetro que mantenha as pessoas afastadas."
      th: "เนื่องจากพื้นที่ 'การติดเชื้อ' ของ SCP-610 กว้างใหญ่มาก การกักกันจึงเป็นไปไม่ได้ รัฐบาลรัสเซียได้อนุญาตให้จัดตั้งแนวเขตเพื่อกันผู้คนออกไป"
      uk: "Через величезну площу 'зараження', яку охоплює SCP-610, стримування неможливе. Уряд Росії надав дозвіл на встановлення периметра, щоб не пускати людей."
      vi: "Do khu vực 'lây nhiễm' của SCP-610 quá rộng lớn, việc thu giữ là bất khả thi. Chính phủ Nga đã cấp phép thiết lập một vành đai để ngăn người dân vào."
      zh: "由于SCP-610「感染」覆盖的区域极为广阔，收容已不可能。俄罗斯政府已批准设立警戒线，以阻止人员进入。"
      zh_Hant: "由於SCP-610「感染」覆蓋的區域極為廣闊，收容已不可能。俄羅斯政府已批准設立警戒線，以阻止人員進入。"

  - scene: >
      Medium shot, waist-up, eye level, a plain clinical setting very
      different from the vast outdoor perimeter. On the left side of the
      frame, a D-Class subject scratches at his forearm with a mildly
      annoyed expression. On the right side of the frame,
      attending-researcher-f jots notes on a clipboard, calm and routine,
      as though examining an ordinary rash.
    characters: [d-class, attending-researcher-f]
    caption:
      ja: "SCP-610は当初、発疹・かゆみ・皮膚感覚の過敏化といった症状を伴う、伝染性の皮膚疾患のように見える。"
      en: "SCP-610 appears to be a contagious skin disease at first, with symptoms including rash, itching, and increased skin sensitivity."
      cs: "SCP-610 se zpočátku jeví jako nakažlivé kožní onemocnění s příznaky, mezi něž patří vyrážka, svědění a zvýšená citlivost kůže."
      de: "SCP-610 erscheint zunächst wie eine ansteckende Hautkrankheit mit Symptomen wie Hautausschlag, Juckreiz und erhöhter Hautempfindlichkeit."
      es: "SCP-610 parece ser, al principio, una enfermedad cutánea contagiosa, con síntomas que incluyen sarpullido, picazón y mayor sensibilidad de la piel."
      fr: "Le SCP-610 semble d'abord être une maladie de peau contagieuse, avec des symptômes tels qu'éruption cutanée, démangeaisons et sensibilité accrue de la peau."
      it: "SCP-610 sembra inizialmente essere una malattia della pelle contagiosa, con sintomi che includono eruzioni cutanee, prurito e maggiore sensibilità della pelle."
      ko: "SCP-610는 처음에는 발진, 가려움, 피부 민감도 증가와 같은 증상을 동반한 전염성 피부질환처럼 보인다."
      pl: "SCP-610 z początku wygląda na zaraźliwą chorobę skóry, z objawami takimi jak wysypka, swędzenie i zwiększona wrażliwość skóry."
      pt: "O SCP-610 parece ser, a princípio, uma doença de pele contagiosa, com sintomas que incluem erupção cutânea, coceira e maior sensibilidade da pele."
      th: "ในตอนแรก SCP-610 ดูเหมือนโรคผิวหนังติดต่อ โดยมีอาการต่างๆ เช่น ผื่น อาการคัน และผิวหนังไวต่อการสัมผัสมากขึ้น"
      uk: "Спочатку SCP-610 виглядає як заразна шкірна хвороба із симптомами у вигляді висипу, свербіння та підвищеної чутливості шкіри."
      vi: "Ban đầu, SCP-610 có vẻ là một bệnh da liễu dễ lây, với các triệu chứng bao gồm phát ban, ngứa, và tăng độ nhạy cảm của da."
      zh: "SCP-610最初看似一种具有传染性的皮肤病，症状包括皮疹、瘙痒及皮肤敏感度增加。"
      zh_Hant: "SCP-610最初看似一種具有傳染性的皮膚病，症狀包括皮疹、搔癢及皮膚敏感度增加。"

  - scene: >
      Medium shot, dynamic diagonal composition, low angle, a tenser
      framing than the calm clinic scene. Attending-researcher-m stands
      at the perimeter fence line, radio raised to his mouth with one
      hand, his other hand pointing out toward a vague, indistinct
      humanoid shape barely visible through mist and distant trees
      beyond the fence, expression alert but procedural rather than
      panicked.
    characters: [attending-researcher-m]
    caption:
      ja: "SCP-610に一致する特徴を示す生物がこの境界線付近で目撃された場合、確立された手順により、動けなくなるまで遠距離から小火器で交戦し、その後焼夷兵器で処分することが求められる。"
      en: "Should any organism displaying traits consistent with SCP-610 be sighted near this perimeter, established protocol requires it be engaged at range with small arms until immobile, then dispatched using incendiary weapons."
      cs: "Pokud je poblíž tohoto perimetru spatřen organismus vykazující znaky odpovídající SCP-610, zavedený protokol vyžaduje jeho zapojení na dálku pomocí ručních zbraní, dokud se nestane nehybným, poté jeho zneškodnění zápalnými zbraněmi."
      de: "Sollte in der Nähe dieses Perimeters ein Organismus mit Merkmalen gesichtet werden, die mit SCP-610 übereinstimmen, verlangt das etablierte Protokoll, es auf Distanz mit Handfeuerwaffen zu bekämpfen, bis es bewegungsunfähig ist, und es anschließend mit Brandwaffen zu vernichten."
      es: "Si se avista cerca de este perímetro cualquier organismo que muestre rasgos compatibles con SCP-610, el protocolo establecido exige enfrentarlo a distancia con armas ligeras hasta inmovilizarlo, y después eliminarlo con armas incendiarias."
      fr: "Si un organisme présentant des caractéristiques compatibles avec le SCP-610 est aperçu près de ce périmètre, le protocole établi exige qu'il soit engagé à distance avec des armes légères jusqu'à immobilisation, puis achevé à l'aide d'armes incendiaires."
      it: "Se nei pressi di questo perimetro viene avvistato un organismo con caratteristiche compatibili con SCP-610, il protocollo stabilito richiede di ingaggiarlo a distanza con armi leggere fino a immobilizzarlo, per poi eliminarlo con armi incendiarie."
      ko: "이 경계선 부근에서 SCP-610과 일치하는 특징을 보이는 생물이 목격될 경우, 확립된 프로토콜에 따라 움직이지 못할 때까지 소화기로 원거리에서 교전한 뒤 소이 무기로 처리해야 한다."
      pl: "Jeśli w pobliżu tego perymetru zostanie zauważony organizm wykazujący cechy zgodne z SCP-610, ustalony protokół wymaga zaangażowania go z dystansu bronią strzelecką aż do unieruchomienia, a następnie zniszczenia bronią zapalającą."
      pt: "Caso seja avistado nas proximidades deste perímetro qualquer organismo apresentando características compatíveis com o SCP-610, o protocolo estabelecido exige que ele seja engajado à distância com armas leves até ficar imóvel, sendo então eliminado com armas incendiárias."
      th: "หากพบสิ่งมีชีวิตที่มีลักษณะสอดคล้องกับ SCP-610 ใกล้แนวเขตนี้ ระเบียบปฏิบัติที่กำหนดไว้กำหนดให้เข้าปะทะจากระยะไกลด้วยอาวุธขนาดเล็กจนกว่ามันจะเคลื่อนไหวไม่ได้ จากนั้นจึงกำจัดด้วยอาวุธเพลิง"
      uk: "Якщо поблизу цього периметра буде помічено організм з ознаками, характерними для SCP-610, встановлений протокол вимагає вступити з ним у бій на відстані зі стрілецької зброї, доки він не знерухомиться, а потім знищити його запальною зброєю."
      vi: "Nếu phát hiện bất kỳ sinh vật nào mang đặc điểm phù hợp với SCP-610 gần vành đai này, quy trình đã thiết lập yêu cầu giao chiến từ xa bằng vũ khí nhỏ cho đến khi nó bất động, sau đó tiêu diệt bằng vũ khí gây cháy."
      zh: "若在此警戒线附近目击到任何显示出与SCP-610一致特征的生物，既定程序要求以轻武器在远距离交火直至其失去行动能力，随后使用燃烧武器将其处理掉。"
      zh_Hant: "若在此警戒線附近目擊到任何顯示出與SCP-610一致特徵的生物，既定程序要求以輕武器在遠距離交火直至其失去行動能力，隨後使用燃燒武器將其處理掉。"

  - scene: >
      Wide shot, full body, eye level, pulled back to show a calmer,
      overgrown clearing beyond the fence, a resolution framing distinct
      from the tense perimeter shot. In the middle distance, a strange,
      motionless, overgrown mass sits fused into the base of a
      crumbling structure, half-swallowed by warped vegetation, kept
      deliberately abstract and indistinct rather than detailed. In the
      foreground, attending-researcher-f stands well back near a small
      marker flag stuck in the ground, checking an item off a clipboard
      with a flat, routine expression.
    characters: [attending-researcher-f]
    caption:
      ja: "感染した個体はやがて動きを止め、自らが適当と判断した場所に留まり、そこに根を下ろす。"
      en: "An infected individual will cease moving and place itself in a location it deems suitable, where it roots itself."
      cs: "Nakažený jedinec nakonec přestane se pohybovat a umístí se na místo, které považuje za vhodné, kde se zakoření."
      de: "Ein infiziertes Individuum stellt schließlich jede Bewegung ein und begibt sich an einen Ort, den es für geeignet hält, wo es sich verwurzelt."
      es: "Un individuo infectado dejará de moverse y se colocará en un lugar que considere adecuado, donde echará raíces."
      fr: "Un individu infecté cessera de bouger et se placera à un endroit qu'il juge approprié, où il s'enracinera."
      it: "Un individuo infetto smetterà di muoversi e si collocherà in un luogo che ritiene adatto, dove metterà radici."
      ko: "감염된 개체는 결국 움직임을 멈추고, 스스로 적합하다고 판단한 장소에 자리를 잡아 그곳에 뿌리를 내린다."
      pl: "Zainfekowana jednostka w końcu przestaje się poruszać i osadza się w miejscu, które uzna za odpowiednie, gdzie się zakorzenia."
      pt: "Um indivíduo infectado deixará de se mover e se colocará em um local que considere adequado, onde criará raízes."
      th: "ผู้ติดเชื้อจะหยุดเคลื่อนไหวและวางตัวเองในตำแหน่งที่มันเห็นว่าเหมาะสม แล้วหยั่งรากลงที่นั่น"
      uk: "Заражена особина зрештою припиняє рух і розташовується в місці, яке вважає прийнятним, де вкорінюється."
      vi: "Một cá thể bị nhiễm cuối cùng sẽ ngừng di chuyển và tự đặt mình vào một vị trí mà nó cho là phù hợp, nơi nó bén rễ."
      zh: "受感染的个体最终会停止移动，并在自己认为合适的地点安顿下来，就此扎根。"
      zh_Hant: "受感染的個體最終會停止移動，並在自己認為合適的地點安頓下來，就此紮根。"
