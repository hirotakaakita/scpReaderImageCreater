object_class: Keter

local_characters:
  scp-017:
    name: SCP-017
    description: >
      A small humanoid figure about 80cm tall, child-sized proportions,
      entirely composed of a shifting, smoke-like dark shroud (very dark
      charcoal-black, color RGB 15,15,18) with no discernible face,
      limbs, or other identifying features — just a vaguely humanoid
      silhouette of drifting shadow-smoke.

characters: [scp-017, attending-researcher-m, attending-researcher-f]

panels:
  - scene: >
      Wide shot, full body, eye level, showing the whole containment
      room. SCP-017 stands motionless at the center of a suspended
      acrylic cage, countless spotlights arranged on every wall,
      ceiling, and floor all trained on it, bathing it in light from
      every direction so it casts no shadow of its own.
    characters: [scp-017]
    caption:
      ja: "SCP-017は身長約80センチメートルの人型の存在で、小さな子供と解剖学的に類似しているが、判別可能な特徴は一切ない。SCP-017は影のような、煙に似たヴェールで構成されているようである。"
      en: "SCP-017 is a humanoid figure approximately 80 centimeters in height, anatomically similar to a small child, but with no discernible identifying features. SCP-017 seems composed of a shadowy, smoke-like shroud."
      cs: "SCP-017 je humanoidní postava vysoká přibližně 80 centimetrů, anatomicky podobná malému dítěti, ale bez jakýchkoli rozpoznatelných identifikačních znaků. SCP-017 se zdá být tvořeno stínovým, kouři podobným závojem."
      de: "SCP-017 ist eine humanoide Gestalt von etwa 80 Zentimetern Höhe, anatomisch einem kleinen Kind ähnlich, jedoch ohne erkennbare identifizierende Merkmale. SCP-017 scheint aus einer schattenhaften, rauchähnlichen Hülle zu bestehen."
      es: "SCP-017 es una figura humanoide de aproximadamente 80 centímetros de altura, anatómicamente similar a un niño pequeño, pero sin rasgos identificables discernibles. SCP-017 parece estar compuesto de un manto sombrío, similar al humo."
      fr: "Le SCP-017 est une silhouette humanoïde d'environ 80 centimètres de hauteur, anatomiquement semblable à un jeune enfant, mais sans trait distinctif identifiable. Le SCP-017 semble composé d'un linceul ombreux, semblable à de la fumée."
      it: "SCP-017 è una figura umanoide alta circa 80 centimetri, anatomicamente simile a un bambino piccolo, ma priva di tratti identificativi riconoscibili. SCP-017 sembra composto da un sudario ombroso, simile al fumo."
      ko: "SCP-017은 키가 약 80센티미터인 인간형 형체로, 해부학적으로 어린아이와 유사하지만 식별 가능한 특징은 전혀 없다. SCP-017은 그림자와 같은, 연기를 닮은 수의로 이루어진 것으로 보인다."
      pl: "SCP-017 to humanoidalna postać o wysokości około 80 centymetrów, anatomicznie przypominająca małe dziecko, lecz pozbawiona jakichkolwiek rozpoznawalnych cech identyfikacyjnych. SCP-017 wydaje się złożone z cienistego, dymopodobnego całunu."
      pt: "O SCP-017 é uma figura humanoide com cerca de 80 centímetros de altura, anatomicamente semelhante a uma criança pequena, mas sem características identificáveis. O SCP-017 parece ser composto por um manto sombrio, semelhante a fumaça."
      th: "SCP-017 คือรูปร่างคล้ายมนุษย์สูงประมาณ 80 เซนติเมตร มีลักษณะทางกายวิภาคคล้ายเด็กเล็ก แต่ไม่มีลักษณะเฉพาะที่ระบุตัวตนได้ SCP-017 ดูเหมือนประกอบขึ้นจากผ้าคลุมคล้ายเงาและควัน"
      uk: "SCP-017 — це гуманоїдна постать заввишки приблизно 80 сантиметрів, анатомічно подібна до маленької дитини, але без жодних розпізнаваних ідентифікаційних рис. SCP-017, схоже, складається з тіньового, димоподібного савана."
      vi: "SCP-017 là một hình dạng giống người cao khoảng 80 cm, có cấu trúc giải phẫu tương tự một đứa trẻ nhỏ, nhưng không có đặc điểm nhận dạng rõ ràng nào. SCP-017 dường như được cấu thành từ một tấm vải liệm giống bóng tối, giống như khói."
      zh: "SCP-017是一个身高约80厘米的类人形体，解剖结构类似于一名幼儿，但没有任何可辨识的特征。SCP-017似乎由一层影子般、类似烟雾的裹尸布构成。"
      zh_Hant: "SCP-017是一個身高約80公分的類人形體，解剖結構類似於一名幼兒，但沒有任何可辨識的特徵。SCP-017似乎由一層影子般、類似煙霧的裹屍布構成。"

  - scene: >
      Medium shot, waist-up, eye level, a different framing from the
      wide establishing shot. attending-researcher-m sits in a small
      control room behind reinforced glass, monitoring a wall of screens
      and gauges showing the spotlight grid and generator status, one
      hand hovering near an alarm switch.
    characters: [attending-researcher-m]
    caption:
      ja: "SCP-017はアクリルガラス製の檻に収容されており、部屋の中央に吊り下げられている。部屋にはあらゆる角度から檻を直接照らす高輝度アークランプのスポットライトが設置されており、SCP-017が常にあらゆる方向から光を浴びるようにしている。"
      en: "SCP-017 is contained in an acrylic glass cage, centrally suspended in a room fitted with high-intensity arc lamp spotlights pointed directly at the cage from every angle, to ensure SCP-017 is constantly exposed to light from every direction."
      cs: "SCP-017 je uchováváno v kleci z akrylového skla, zavěšené uprostřed místnosti vybavené vysoce intenzivními obloukovými reflektory namířenými přímo na klec ze všech úhlů, aby bylo zajištěno, že SCP-017 je neustále vystaveno světlu ze všech směrů."
      de: "SCP-017 wird in einem Käfig aus Acrylglas untergebracht, der zentral in einem Raum aufgehängt ist, der mit hochintensiven Bogenlampen-Scheinwerfern ausgestattet ist, die aus jedem Winkel direkt auf den Käfig gerichtet sind, um sicherzustellen, dass SCP-017 ständig aus jeder Richtung Licht ausgesetzt ist."
      es: "SCP-017 se mantiene en una jaula de vidrio acrílico, suspendida centralmente en una habitación equipada con reflectores de arco de alta intensidad apuntados directamente a la jaula desde todos los ángulos, para garantizar que SCP-017 esté constantemente expuesto a la luz desde todas las direcciones."
      fr: "Le SCP-017 est maintenu dans une cage en verre acrylique, suspendue au centre d'une pièce équipée de projecteurs à arc de haute intensité pointés directement sur la cage sous tous les angles, afin de garantir que le SCP-017 soit constamment exposé à la lumière dans toutes les directions."
      it: "SCP-017 è contenuto in una gabbia di vetro acrilico, sospesa al centro di una stanza dotata di riflettori ad arco ad alta intensità puntati direttamente sulla gabbia da ogni angolazione, per garantire che SCP-017 sia costantemente esposto alla luce da ogni direzione."
      ko: "SCP-017은 아크릴 유리 우리에 수용되어 있으며, 방 중앙에 매달려 있다. 방에는 모든 각도에서 우리를 직접 비추는 고강도 아크등 스포트라이트가 설치되어 있어, SCP-017이 항상 모든 방향에서 빛에 노출되도록 한다."
      pl: "SCP-017 jest przechowywane w klatce z pleksiglasu, zawieszonej centralnie w pomieszczeniu wyposażonym w wysokiej mocy reflektory łukowe skierowane bezpośrednio na klatkę z każdego kąta, aby zapewnić, że SCP-017 jest stale wystawione na światło ze wszystkich kierunków."
      pt: "O SCP-017 é mantido em uma gaiola de vidro acrílico, suspensa centralmente em uma sala equipada com holofotes de arco de alta intensidade apontados diretamente para a gaiola de todos os ângulos, para garantir que o SCP-017 esteja constantemente exposto à luz vinda de todas as direções."
      th: "SCP-017 ถูกกักกันในกรงกระจกอะคริลิก แขวนไว้ตรงกลางห้องที่ติดตั้งไฟสปอตไลท์อาร์คความเข้มสูงชี้ตรงมาที่กรงจากทุกมุม เพื่อให้แน่ใจว่า SCP-017 ได้รับแสงจากทุกทิศทางตลอดเวลา"
      uk: "SCP-017 утримується в клітці з акрилового скла, підвішеній у центрі кімнати, обладнаної потужними дуговими прожекторами, спрямованими прямо на клітку з усіх кутів, щоб гарантувати постійне освітлення SCP-017 з усіх напрямків."
      vi: "SCP-017 được chứa trong một chiếc lồng bằng kính acrylic, treo ở giữa một căn phòng được trang bị đèn pha hồ quang cường độ cao chiếu trực tiếp vào lồng từ mọi góc độ, để đảm bảo SCP-017 luôn tiếp xúc với ánh sáng từ mọi hướng."
      zh: "SCP-017被收容于一个悬挂在房间正中央的亚克力玻璃笼中，房间内装有从各个角度直射笼子的高强度弧光灯，以确保SCP-017始终受到来自四面八方的光照。"
      zh_Hant: "SCP-017被收容於一個懸掛在房間正中央的壓克力玻璃籠中，房間內裝有從各個角度直射籠子的高強度弧光燈，以確保SCP-017始終受到來自四面八方的光照。"

  - scene: >
      Low angle, dynamic diagonal composition, a very different framing
      from the medium shot before. attending-researcher-f, fully covered
      in a full-body reflective suit, is contorted awkwardly on a
      ladder, replacing a burnt-out spotlight overhead with exaggerated
      caution, careful to keep her own silhouette from ever crossing in
      front of any still-lit spotlight.
    characters: [attending-researcher-f]
    caption:
      ja: "職員の入室が許可される唯一の状況は、ランプの交換作業のみである。部屋に入る職員は指定の全身反射スーツを着用しなければならず、稼働中のスポットライトの前に立たないよう注意しなければならない。"
      en: "The only circumstance under which personnel are allowed entrance is to replace lamps. Personnel entering the room are required to wear designated full-body reflective suits, and must be cautioned not to step in front of functional spotlights."
      cs: "Jedinou okolností, za níž je personálu povolen vstup, je výměna žárovek. Personál vstupující do místnosti musí nosit určené celotělové reflexní obleky a musí být upozorněn, aby se nepostavil před funkční reflektor."
      de: "Der einzige Umstand, unter dem Personal der Zutritt gestattet ist, ist der Austausch von Lampen. Personal, das den Raum betritt, muss die vorgeschriebenen reflektierenden Ganzkörperanzüge tragen und wird angewiesen, nicht vor funktionierende Scheinwerfer zu treten."
      es: "La única circunstancia bajo la cual se permite la entrada del personal es para reemplazar lámparas. El personal que ingrese a la sala debe usar los trajes reflectantes de cuerpo completo designados, y debe tener cuidado de no ponerse delante de los reflectores en funcionamiento."
      fr: "La seule circonstance dans laquelle le personnel est autorisé à entrer est le remplacement des lampes. Le personnel entrant dans la pièce doit porter les combinaisons réfléchissantes intégrales désignées, et doit être averti de ne pas se placer devant les projecteurs en fonctionnement."
      it: "L'unica circostanza in cui il personale è autorizzato a entrare è la sostituzione delle lampade. Il personale che entra nella stanza deve indossare le tute riflettenti integrali designate, e deve essere avvertito di non mettersi davanti ai riflettori funzionanti."
      ko: "직원의 입실이 허용되는 유일한 상황은 램프 교체를 위해서이다. 방에 들어가는 직원은 지정된 전신 반사 슈트를 착용해야 하며, 작동 중인 스포트라이트 앞에 서지 않도록 주의해야 한다."
      pl: "Jedyną okolicznością, w której personel może wejść do pomieszczenia, jest wymiana lamp. Personel wchodzący do pomieszczenia musi nosić wyznaczone całościowe kombinezony odblaskowe i musi zostać ostrzeżony, by nie stawać przed działającymi reflektorami."
      pt: "A única circunstância em que o pessoal tem permissão para entrar é para substituir as lâmpadas. O pessoal que entra na sala deve usar os trajes reflexivos de corpo inteiro designados, e deve ser advertido a não pisar na frente de holofotes em funcionamento."
      th: "สถานการณ์เดียวที่อนุญาตให้เจ้าหน้าที่เข้าไปได้คือเพื่อเปลี่ยนหลอดไฟ เจ้าหน้าที่ที่เข้าไปในห้องต้องสวมชุดสะท้อนแสงแบบเต็มตัวที่กำหนดไว้ และต้องระมัดระวังไม่ยืนขวางหน้าสปอตไลท์ที่ยังทำงานอยู่"
      uk: "Єдина обставина, за якої персоналу дозволено входити, — це заміна ламп. Персонал, що входить до кімнати, зобов'язаний носити спеціальні відбивні костюми на все тіло і має бути попереджений не ставати перед працюючими прожекторами."
      vi: "Trường hợp duy nhất nhân viên được phép vào là để thay đèn. Nhân viên vào phòng phải mặc bộ đồ phản quang toàn thân được chỉ định, và phải được cảnh báo không được đứng trước các đèn pha đang hoạt động."
      zh: "唯一允许人员进入的情况是更换灯泡。进入房间的人员必须穿着指定的全身反光服，并须格外注意不要挡在正常运作的聚光灯前。"
      zh_Hant: "唯一允許人員進入的情況是更換燈泡。進入房間的人員必須穿著指定的全身反光服，並須格外注意不要擋在正常運作的聚光燈前。"

  - scene: >
      Low angle, dynamic diagonal composition, filling most of the
      frame, a very different framing from the careful contorted pose
      before. A spare lamp has just slipped from attending-researcher-f's
      gloved hand mid-swap on the ladder, tumbling through the air and
      casting a brief shadow across the floor. SCP-017 has already
      lunged from the shadows beneath its cage, shroud fully extended to
      swallow the falling lamp an instant before it lands, leaving no
      trace. On the ladder above, attending-researcher-f recoils, her
      other hand slamming her reflective visor down.
    characters: [scp-017, attending-researcher-f]
    caption:
      ja: "SCP-017は、自身に影が落ちるとただちに、そして素早く反応する。SCP-017はその影を落とした物体に飛びかかり、ヴェールで完全に包み込む——後には物体の痕跡が一切残らない。"
      en: "SCP-017's reaction to shadows cast upon it is immediate and swift. SCP-017 leaps at the object casting the shadow and completely encloses it in its shroud, leaving no trace of the object behind."
      cs: "Reakce SCP-017 na stín vržený na něj je okamžitá a rychlá. SCP-017 skočí po předmětu vrhajícím stín a zcela jej obalí svým závojem, přičemž po předmětu nezůstane žádná stopa."
      de: "Die Reaktion von SCP-017 auf einen darauf fallenden Schatten erfolgt sofort und blitzschnell. SCP-017 springt auf das Objekt, das den Schatten wirft, und hüllt es vollständig in seine Hülle ein, wobei keine Spur des Objekts zurückbleibt."
      es: "La reacción de SCP-017 a las sombras proyectadas sobre él es inmediata y veloz. SCP-017 salta sobre el objeto que proyecta la sombra y lo envuelve por completo en su manto, sin dejar rastro alguno del objeto."
      fr: "La réaction du SCP-017 aux ombres projetées sur lui est immédiate et rapide. Le SCP-017 bondit sur l'objet projetant l'ombre et l'enveloppe entièrement dans son linceul, ne laissant aucune trace de l'objet."
      it: "La reazione di SCP-017 alle ombre proiettate su di esso è immediata e rapida. SCP-017 balza sull'oggetto che proietta l'ombra e lo avvolge completamente nel suo sudario, senza lasciare alcuna traccia dell'oggetto."
      ko: "SCP-017은 자신에게 그림자가 드리워지면 즉각적이고 신속하게 반응한다. SCP-017은 그림자를 드리운 물체에 달려들어 수의로 완전히 감싸며, 그 물체는 흔적도 없이 사라진다."
      pl: "Reakcja SCP-017 na rzucony na nie cień jest natychmiastowa i błyskawiczna. SCP-017 rzuca się na obiekt rzucający cień i całkowicie owija go swoim całunem, nie pozostawiając po nim żadnego śladu."
      pt: "A reação do SCP-017 às sombras projetadas sobre ele é imediata e rápida. O SCP-017 salta sobre o objeto que projeta a sombra e o envolve completamente em seu manto, sem deixar vestígio algum do objeto."
      th: "ปฏิกิริยาของ SCP-017 ต่อเงาที่ตกกระทบตัวมันนั้นรวดเร็วและฉับพลัน SCP-017 จะกระโจนเข้าใส่วัตถุที่ทอดเงาและห่อหุ้มมันไว้ทั้งหมดด้วยผ้าคลุม โดยไม่ทิ้งร่องรอยของวัตถุนั้นไว้เลย"
      uk: "Реакція SCP-017 на тінь, що падає на нього, є миттєвою та стрімкою. SCP-017 стрибає на об'єкт, що відкидає тінь, і повністю огортає його своїм саваном, не залишаючи жодного сліду об'єкта."
      vi: "Phản ứng của SCP-017 đối với bóng đổ lên nó là tức thời và nhanh chóng. SCP-017 nhảy bổ vào vật thể tạo ra bóng đó và bao trùm hoàn toàn nó trong tấm vải liệm của mình, không để lại dấu vết nào của vật thể."
      zh: "SCP-017对投射在自己身上的阴影反应迅速而剧烈。SCP-017会扑向投下阴影的物体，并用裹尸布将其完全包裹——事后不留下该物体的任何痕迹。"
      zh_Hant: "SCP-017對投射在自己身上的陰影反應迅速而劇烈。SCP-017會撲向投下陰影的物體，並用裹屍布將其完全包裹——事後不留下該物體的任何痕跡。"
