# SCP-017 4コマ台本
# captionはSpecial Containment Procedures / Description本文からの引用。
# document #017-1（詳細不明の追加資料）は未確認のため本編に含めていない。
# オチは人体ではなく落下した交換用ランプが影を落として飲み込まれる形にし、
# グロ・人体への直接的な危害描写を回避した。キャラにセリフは言わせない。
# JP公式訳が直接取得できなかったため、検証済みの英語本文からの翻訳（ja含む）。

id: scp-017

