# SCP-022 4コマ台本
# captionはSpecial Containment Procedures / Description本文からの引用。
# 身体切断や組織破壊による処分方法の詳細（グロ描写）はAddendum寄りの
# 実験的知見として本編から外し、遺体安置所の設定・出現・焼却対応・
# 意思疎通能力という淡々とした側面のみを題材にした。キャラにセリフは
# 言わせない（パネル4は「対話能力」の描写のみで具体的なセリフ内容は書かない）。
# JP公式訳が直接取得できなかったため、検証済みの英語本文からの翻訳（ja含む）。

id: scp-022

title:
  en: "SCP-022"
  ja: "SCP-022"
  cs: "SCP-022"
  de: "SCP-022"
  es: "SCP-022"
  fr: "SCP-022"
  it: "SCP-022"
  ko: "SCP-022"
  pl: "SCP-022"
  pt: "SCP-022"
  th: "SCP-022"
  uk: "SCP-022"
  vi: "SCP-022"
  zh: "SCP-022"
  zh_Hant: "SCP-022"

attribution:
  article: "SCP-022"
  source_url: "http://scp-wiki.wikidot.com/scp-022"
  license: "CC BY-SA 3.0"

object_class: Euclid

local_characters:
  scp-022-1:
    name: SCP-022-1
    description: >
      A humanoid figure draped almost entirely in a white hospital
      sheet from head to toe, one pale, waxen hand and part of an
      expressionless face visible. Skin an ashen gray-white (color RGB
      200,195,185), no visible wounds or blood, movements stiff and
      jerky.

characters: [attending-researcher-f, attending-researcher-m, scp-022-1]

panels:
  - scene: >
      Wide shot, full body, eye level, showing rows of steel morgue
      drawers lining the walls of a cold basement room. One drawer
      slides open on its own, a white sheet-covered shape lying
      motionless within. attending-researcher-f stands near the
      doorway, watching a security monitor mounted on the wall.
    characters: [attending-researcher-f]
    caption:
      ja: "SCP-022はイギリスのある病院の地下にある遺体安置所である。遺体安置所内では、時折ランダムな引き出しが開き、覆いのかかったシーツの下に遺体が現れる。"
      en: "SCP-022 is a morgue in the basement of a hospital in Great Britain. Periodically, a random drawer within the morgue will open to reveal a cadaver under a covered sheet."
      cs: "SCP-022 je márnice v suterénu nemocnice ve Velké Británii. Občas se v márnici náhodně otevře jedna ze zásuvek a odhalí mrtvolu pod přikrytou plachtou."
      de: "SCP-022 ist ein Leichenschauhaus im Keller eines Krankenhauses in Großbritannien. Von Zeit zu Zeit öffnet sich willkürlich eine Schublade im Leichenschauhaus und gibt eine unter einem Tuch bedeckte Leiche frei."
      es: "SCP-022 es una morgue en el sótano de un hospital en Gran Bretaña. Periódicamente, un cajón aleatorio de la morgue se abre para revelar un cadáver bajo una sábana cubierta."
      fr: "Le SCP-022 est une morgue au sous-sol d'un hôpital en Grande-Bretagne. Périodiquement, un tiroir aléatoire de la morgue s'ouvre pour révéler un cadavre sous un drap."
      it: "SCP-022 è un obitorio nel seminterrato di un ospedale in Gran Bretagna. Periodicamente, un cassetto casuale dell'obitorio si apre per rivelare un cadavere coperto da un lenzuolo."
      ko: "SCP-022는 영국 어느 병원 지하에 있는 시체 안치소이다. 시체 안치소 내에서는 이따금 무작위의 서랍이 열려, 덮개가 씌워진 시신을 드러낸다."
      pl: "SCP-022 to kostnica w piwnicy szpitala w Wielkiej Brytanii. Od czasu do czasu losowa szuflada w kostnicy otwiera się, ukazując zwłoki pod przykrytym prześcieradłem."
      pt: "O SCP-022 é um necrotério no porão de um hospital na Grã-Bretanha. Periodicamente, uma gaveta aleatória do necrotério se abre para revelar um cadáver sob um lençol coberto."
      th: "SCP-022 คือห้องเก็บศพในชั้นใต้ดินของโรงพยาบาลแห่งหนึ่งในบริเตนใหญ่ เป็นระยะๆ ลิ้นชักแบบสุ่มในห้องเก็บศพจะเปิดออกเผยให้เห็นศพที่ถูกคลุมด้วยผ้าปูที่นอน"
      uk: "SCP-022 — це морг у підвалі лікарні у Великій Британії. Періодично одна з довільних шухляд у морзі відчиняється, показуючи труп під накритим простирадлом."
      vi: "SCP-022 là nhà xác ở tầng hầm của một bệnh viện tại Anh. Định kỳ, một ngăn kéo ngẫu nhiên trong nhà xác sẽ mở ra để lộ một thi thể được phủ bằng tấm khăn trải."
      zh: "SCP-022是位于英国一家医院地下室的太平间。太平间内会不定期地随机打开某个抽屉，露出盖着布单的尸体。"
      zh_Hant: "SCP-022是位於英國一家醫院地下室的太平間。太平間內會不定期地隨機打開某個抽屜，露出蓋著布單的屍體。"

  - scene: >
      Medium shot, waist-up, low angle, a different framing from the
      wide establishing shot. scp-022-1 sits upright on the slab, sheet
      still draped over its head and shoulders, one pale hand gripping
      the drawer's edge as it begins to rise, movement stiff and jerky.
    characters: [scp-022-1]
    caption:
      ja: "およそ6分後、遺体は動き出し、遺体安置所から出ようと試みる。この時点で、その遺体はSCP-022-1という名称を与えられる。"
      en: "After approximately six minutes, the cadaver will animate and attempt to leave the morgue. At this point, the cadaver is given the designation SCP-022-1."
      cs: "Přibližně po šesti minutách se mrtvola oživí a pokusí se opustit márnici. V tomto okamžiku je mrtvole přiděleno označení SCP-022-1."
      de: "Nach etwa sechs Minuten belebt sich die Leiche und versucht, das Leichenschauhaus zu verlassen. Zu diesem Zeitpunkt erhält die Leiche die Bezeichnung SCP-022-1."
      es: "Después de aproximadamente seis minutos, el cadáver se anima e intenta abandonar la morgue. En este punto, al cadáver se le asigna la designación SCP-022-1."
      fr: "Après environ six minutes, le cadavre s'anime et tente de quitter la morgue. À ce stade, le cadavre reçoit la désignation SCP-022-1."
      it: "Dopo circa sei minuti, il cadavere si anima e tenta di lasciare l'obitorio. A questo punto, al cadavere viene assegnata la designazione SCP-022-1."
      ko: "약 6분 후, 시신은 움직이기 시작하며 시체 안치소를 떠나려 시도한다. 이 시점에서 그 시신은 SCP-022-1이라는 명칭을 부여받는다."
      pl: "Po około sześciu minutach zwłoki ożywają i próbują opuścić kostnicę. W tym momencie zwłokom nadawane jest oznaczenie SCP-022-1."
      pt: "Após aproximadamente seis minutos, o cadáver se anima e tenta deixar o necrotério. Nesse momento, o cadáver recebe a designação SCP-022-1."
      th: "หลังจากประมาณหกนาที ศพจะเคลื่อนไหวและพยายามออกจากห้องเก็บศพ ณ จุดนี้ ศพจะได้รับการกำหนดชื่อว่า SCP-022-1"
      uk: "Приблизно через шість хвилин труп оживає і намагається покинути морг. У цей момент трупу присвоюють позначення SCP-022-1."
      vi: "Sau khoảng sáu phút, thi thể sẽ hoạt hóa và cố gắng rời khỏi nhà xác. Vào thời điểm này, thi thể được đặt tên là SCP-022-1."
      zh: "约六分钟后，尸体会活动起来并试图离开太平间。此时，该尸体被赋予SCP-022-1的编号。"
      zh_Hant: "約六分鐘後，屍體會活動起來並試圖離開太平間。此時，該屍體被賦予SCP-022-1的編號。"

  - scene: >
      Wide shot, full body, eye level, pulled back to show the whole
      vault door and room, a very different framing from the tight
      medium shot before. On the left side of the frame, scp-022-1 has
      just stepped past the drawer line, one hand outstretched toward
      the door. On the right side of the frame, attending-researcher-m
      stands behind a reinforced glass panel, hand slamming an
      incinerator activation switch, orange light flooding the room.
    characters: [scp-022-1, attending-researcher-m]
    caption:
      ja: "SCP-022-1の個体が出現した場合、自動システムはそれがSCP-022を出た瞬間に焼却処分すべきである。金庫扉は、このような出現時を除き、常時施錠された状態を維持すること。"
      en: "In the event that an instance of SCP-022-1 appears, automated systems should incinerate it the moment it leaves SCP-022. The vault door is to remain locked at all times, except for such appearances."
      cs: "V případě, že se objeví exemplář SCP-022-1, automatizované systémy by jej měly spálit ve chvíli, kdy opustí SCP-022. Trezorové dveře musí zůstat neustále uzamčené, s výjimkou takových výskytů."
      de: "Erscheint ein Exemplar von SCP-022-1, sollen automatisierte Systeme es in dem Moment einäschern, in dem es SCP-022 verlässt. Die Tresortür ist jederzeit verschlossen zu halten, außer bei solchen Vorkommnissen."
      es: "En caso de que aparezca un espécimen de SCP-022-1, los sistemas automatizados deben incinerarlo en el momento en que abandone SCP-022. La puerta blindada debe permanecer cerrada en todo momento, excepto durante dichas apariciones."
      fr: "Dans le cas où un spécimen de SCP-022-1 apparaît, les systèmes automatisés doivent l'incinérer dès qu'il quitte le SCP-022. La porte blindée doit rester verrouillée en permanence, sauf lors de telles apparitions."
      it: "Nel caso in cui appaia un esemplare di SCP-022-1, i sistemi automatizzati dovrebbero incenerirlo nel momento in cui lascia SCP-022. La porta blindata deve rimanere sempre chiusa a chiave, tranne durante tali apparizioni."
      ko: "SCP-022-1 개체가 출현할 경우, 자동 시스템은 그것이 SCP-022를 벗어나는 순간 소각해야 한다. 금고문은 이러한 출현 시를 제외하고 항상 잠긴 상태를 유지해야 한다."
      pl: "W przypadku pojawienia się egzemplarza SCP-022-1, zautomatyzowane systemy powinny go spalić w momencie opuszczenia SCP-022. Drzwi skarbcowe mają pozostawać zamknięte przez cały czas, z wyjątkiem takich pojawień się."
      pt: "Caso um espécime de SCP-022-1 apareça, os sistemas automatizados devem incinerá-lo no momento em que ele deixar o SCP-022. A porta do cofre deve permanecer trancada o tempo todo, exceto durante tais aparições."
      th: "ในกรณีที่ตัวอย่างของ SCP-022-1 ปรากฏขึ้น ระบบอัตโนมัติควรเผาทำลายมันในทันทีที่มันออกจาก SCP-022 ประตูห้องนิรภัยต้องล็อกอยู่ตลอดเวลา ยกเว้นในช่วงที่มีการปรากฏตัวเช่นนี้"
      uk: "У разі появи екземпляра SCP-022-1 автоматизовані системи повинні спалити його в момент, коли він залишить SCP-022. Двері сховища мають залишатися замкненими постійно, за винятком таких випадків появи."
      vi: "Trong trường hợp một cá thể SCP-022-1 xuất hiện, hệ thống tự động phải thiêu hủy nó ngay khi nó rời khỏi SCP-022. Cửa hầm phải luôn được khóa, trừ khi có sự xuất hiện như vậy."
      zh: "若出现SCP-022-1个体，自动系统应在其离开SCP-022的瞬间将其焚毁。金库门须始终保持锁闭，仅在此类出现时除外。"
      zh_Hant: "若出現SCP-022-1個體，自動系統應在其離開SCP-022的瞬間將其焚毀。金庫門須始終保持鎖閉，僅在此類出現時除外。"

  - scene: >
      Medium shot, waist-up, eye level, a calm interview room, a very
      different framing from the fiery previous panel. On the left side
      of the frame, attending-researcher-f sits with a clipboard, pen
      poised, polite expression. On the right side of the frame,
      scp-022-1 sits across the table, sheet now folded neatly over its
      shoulders like a blanket, mouth open mid-sentence as if answering
      a routine question.
    characters: [attending-researcher-f, scp-022-1]
    caption:
      ja: "SCP-022-1の個体が機能する口・舌・気管を有している限り、研究員と完全に意思疎通を行うことができる。"
      en: "So long as an instance of SCP-022-1 possesses a functioning mouth, tongue, and trachea, it is able to communicate fully with researchers."
      cs: "Dokud exemplář SCP-022-1 disponuje funkčními ústy, jazykem a průdušnicí, je schopen plně komunikovat s výzkumníky."
      de: "Solange ein Exemplar von SCP-022-1 über einen funktionsfähigen Mund, eine Zunge und eine Luftröhre verfügt, kann es vollständig mit Forschern kommunizieren."
      es: "Mientras un espécimen de SCP-022-1 posea una boca, lengua y tráquea funcionales, es capaz de comunicarse plenamente con los investigadores."
      fr: "Tant qu'un spécimen de SCP-022-1 possède une bouche, une langue et une trachée fonctionnelles, il est capable de communiquer pleinement avec les chercheurs."
      it: "Finché un esemplare di SCP-022-1 possiede una bocca, una lingua e una trachea funzionanti, è in grado di comunicare pienamente con i ricercatori."
      ko: "SCP-022-1 개체가 기능하는 입, 혀, 기관을 가지고 있는 한, 연구원들과 완전히 의사소통할 수 있다."
      pl: "Dopóki egzemplarz SCP-022-1 posiada sprawne usta, język i tchawicę, jest w stanie w pełni komunikować się z badaczami."
      pt: "Enquanto um espécime de SCP-022-1 possuir boca, língua e traqueia funcionais, ele é capaz de se comunicar plenamente com os pesquisadores."
      th: "ตราบใดที่ตัวอย่างของ SCP-022-1 ยังมีปาก ลิ้น และหลอดลมที่ทำงานได้ มันสามารถสื่อสารกับนักวิจัยได้อย่างสมบูรณ์"
      uk: "Доки екземпляр SCP-022-1 має функціональний рот, язик і трахею, він здатний повноцінно спілкуватися з дослідниками."
      vi: "Miễn là một cá thể SCP-022-1 sở hữu miệng, lưỡi và khí quản còn hoạt động, nó có thể giao tiếp đầy đủ với các nhà nghiên cứu."
      zh: "只要SCP-022-1个体拥有功能正常的嘴、舌头和气管，它就能与研究人员进行完整的交流。"
      zh_Hant: "只要SCP-022-1個體擁有功能正常的嘴、舌頭和氣管，牠就能與研究人員進行完整的交流。"
