# SCP-005 4コマ台本
# captionは記事本文（Special Containment Procedures / Description）からの引用。
# キャラにセリフは言わせない。

id: scp-005

title:
  ja: "SCP-005"
  en: "SCP-005"
  cs: "SCP-005"
  de: "SCP-005"
  es: "SCP-005"
  fr: "SCP-005"
  it: "SCP-005"
  ko: "SCP-005"
  pl: "SCP-005"
  pt: "SCP-005"
  th: "SCP-005"
  uk: "SCP-005"
  vi: "SCP-005"
  zh: "SCP-005"
  zh_Hant: "SCP-005"

attribution:
  article: "SCP-005"
  source_url: "http://scp-wiki.wikidot.com/scp-005"
  license: "CC BY-SA 3.0"

object_class: Safe

local_characters:
  scp-005:
    name: SCP-005
    appearance: >
      SCP-005, an ornate brass skeleton key (color RGB 180,150,60) with
      an elaborately scrolled bow and a long slender shaft, styled like a
      typical mass-produced key from the 1920s, with subtle wear but no
      visible rust.
    default_look: >
      Resting on a small dark velvet cushion inside a locked glass
      display case.
  civilian:
    name: Civilian
    appearance: >
      An ordinary unnamed civilian man in plain modern street clothes,
      with short brown hair (color RGB 90,60,40), unremarkable average
      build, no distinguishing features.
    default_look: >
      A plain jacket over a t-shirt and jeans, calm and unassuming
      expression.

characters: [scp-005, attending-researcher-m]

panels:
  - scene: >
      Wide shot, eye level, showing a small plain containment room. In
      the center, SCP-005 rests on its velvet cushion inside a locked
      glass display case, its ornate brass surface catching the light.
      On the right, Attending Researcher (Male) stands nearby, glancing
      at it while writing on a clipboard.
    characters: [scp-005, attending-researcher-m]
    caption:
      ja: "SCP-005は外見上、装飾の施された鍵に似ており、1920年代に典型的な量産された鍵の特徴を示している。"
      en: "In appearance, SCP-005 resembles an ornate key, displaying the characteristics of a typical mass produced key used in the 1920s."
      cs: "Vzhledem SCP-005 připomíná zdobený klíč, vykazující charakteristiky typického hromadně vyráběného klíče používaného ve 20. letech 20. století."
      de: "Optisch ähnelt SCP-005 einem verzierten Schlüssel mit den typischen Merkmalen eines in den 1920er Jahren massenproduzierten Schlüssels."
      es: "En apariencia, SCP-005 se asemeja a una llave ornamentada, con las características de una llave típica producida en masa en la década de 1920."
      fr: "En apparence, SCP-005 ressemble à une clé ornementée, présentant les caractéristiques d'une clé typique produite en série dans les années 1920."
      it: "Nell'aspetto, SCP-005 assomiglia a una chiave ornata, con le caratteristiche di una tipica chiave prodotta in serie negli anni '20."
      ko: "외관상 SCP-005는 화려하게 장식된 열쇠와 유사하며, 1920년대에 대량 생산되던 전형적인 열쇠의 특징을 보인다."
      pl: "Z wyglądu SCP-005 przypomina ozdobny klucz, wykazujący cechy typowego klucza produkowanego masowo w latach dwudziestych XX wieku."
      pt: "Em aparência, SCP-005 se assemelha a uma chave ornamentada, exibindo as características de uma chave típica produzida em massa na década de 1920."
      th: "ในด้านรูปลักษณ์ SCP-005 มีลักษณะคล้ายกุญแจที่มีการตกแต่งอย่างวิจิตร แสดงถึงลักษณะของกุญแจที่ผลิตเป็นจำนวนมากทั่วไปในยุคทศวรรษ 1920"
      uk: "Зовні SCP-005 нагадує оздоблений ключ із характеристиками типового серійного ключа 1920-х років."
      vi: "Về hình dáng, SCP-005 giống một chiếc chìa khóa được trang trí công phu, mang đặc điểm của loại chìa khóa sản xuất hàng loạt điển hình vào những năm 1920."
      zh: "从外观上看，SCP-005类似一把装饰华丽的钥匙，具有20世纪20年代典型量产钥匙的特征。"
      zh_Hant: "從外觀上看，SCP-005類似一把裝飾華麗的鑰匙，具有20世紀20年代典型量產鑰匙的特徵。"

  - scene: >
      Medium shot, waist-up, showing a heavy vault-style steel door
      standing wide open, red warning lights flashing in the corridor
      beyond. In the foreground, an ordinary-looking Civilian calmly
      withdraws SCP-005 from the door's lock, glancing back over his
      shoulder without any urgency.
    characters: [civilian, scp-005]
    caption:
      ja: "この鍵は、一般市民が高セキュリティ施設に侵入するために使用したことで発見された。"
      en: "The key was discovered when a civilian used it to infiltrate a high security facility."
      cs: "Klíč byl objeven poté, co jej civilista použil k proniknutí do vysoce zabezpečeného zařízení."
      de: "Der Schlüssel wurde entdeckt, als ein Zivilist damit in eine hochgesicherte Einrichtung eindrang."
      es: "La llave fue descubierta cuando un civil la utilizó para infiltrarse en una instalación de alta seguridad."
      fr: "La clé a été découverte lorsqu'un civil l'a utilisée pour s'infiltrer dans une installation à haute sécurité."
      it: "La chiave è stata scoperta quando un civile l'ha utilizzata per infiltrarsi in una struttura ad alta sicurezza."
      ko: "이 열쇠는 한 민간인이 고보안 시설에 침입하는 데 사용하면서 발견되었다."
      pl: "Klucz odkryto, gdy cywil użył go, aby wtargnąć do obiektu o wysokim poziomie zabezpieczeń."
      pt: "A chave foi descoberta quando um civil a usou para se infiltrar em uma instalação de alta segurança."
      th: "กุญแจดอกนี้ถูกค้นพบเมื่อพลเรือนคนหนึ่งใช้มันแอบเข้าไปในสถานที่ที่มีการรักษาความปลอดภัยสูง"
      uk: "Ключ виявили, коли цивільна особа скористалася ним, щоб проникнути на об'єкт із високим рівнем безпеки."
      vi: "Chiếc chìa khóa được phát hiện khi một thường dân sử dụng nó để xâm nhập vào một cơ sở an ninh cao."
      zh: "这把钥匙是在一名平民用它潜入一处高安保设施时被发现的。"
      zh_Hant: "這把鑰匙是在一名平民用它潛入一處高安保設施時被發現的。"

  - scene: >
      Close-up shot, centered on Attending Researcher (Female)'s hand
      turning SCP-005 first inside a heavy mechanical padlock, then
      touching it to a wall-mounted digital keypad lock unit beside it.
      The padlock springs open and the digital unit's small indicator
      light flips from red to green at the same moment, with no keypad
      buttons pressed.
    characters: [attending-researcher-f, scp-005]
    caption:
      ja: "SCP-005は、機械式・電子式を問わずあらゆる種類の錠を、比較的容易に開けるという独自の能力を持つようである。"
      en: "SCP-005 seems to have the unique ability to open any and all forms of lock, be they mechanical or digital, with relative ease."
      cs: "Zdá se, že SCP-005 disponuje unikátní schopností otevřít jakýkoli druh zámku, ať už mechanický, nebo digitální, a to s relativní snadností."
      de: "SCP-005 scheint über die einzigartige Fähigkeit zu verfügen, jede Art von Schloss zu öffnen, ob mechanisch oder digital, und das mit relativer Leichtigkeit."
      es: "SCP-005 parece poseer la capacidad única de abrir cualquier tipo de cerradura, ya sea mecánica o digital, con relativa facilidad."
      fr: "SCP-005 semble posséder la capacité unique d'ouvrir toute forme de serrure, mécanique ou numérique, avec une relative facilité."
      it: "SCP-005 sembra possedere la capacità unica di aprire qualsiasi tipo di serratura, meccanica o digitale, con relativa facilità."
      ko: "SCP-005는 기계식이든 전자식이든 모든 종류의 자물쇠를 비교적 쉽게 여는 독특한 능력을 가진 것으로 보인다."
      pl: "SCP-005 wydaje się posiadać unikalną zdolność otwierania dowolnego rodzaju zamka, mechanicznego czy cyfrowego, ze stosunkową łatwością."
      pt: "SCP-005 parece possuir a capacidade única de abrir qualquer tipo de fechadura, seja mecânica ou digital, com relativa facilidade."
      th: "SCP-005 ดูเหมือนจะมีความสามารถพิเศษในการเปิดกุญแจทุกชนิด ไม่ว่าจะเป็นกลไกหรือดิจิทัล ได้อย่างค่อนข้างง่ายดาย"
      uk: "SCP-005, вочевидь, має унікальну здатність відкривати будь-які замки, механічні чи цифрові, з відносною легкістю."
      vi: "SCP-005 dường như sở hữu khả năng đặc biệt là mở được mọi loại ổ khóa, dù là cơ học hay kỹ thuật số, một cách khá dễ dàng."
      zh: "SCP-005似乎拥有一种独特的能力，能够相对轻松地打开任何形式的锁，无论是机械锁还是电子锁。"
      zh_Hant: "SCP-005似乎擁有一種獨特的能力，能夠相對輕鬆地打開任何形式的鎖，無論是機械鎖還是電子鎖。"

  - scene: >
      Wide shot, full body, eye level, showing the containment room
      again. On the left, Attending Researcher (Male) locks SCP-005 back
      into its glass display case, holding a clipboard that requires a
      signature, and reaches for a wall-mounted phone with a
      long-suffering expression. On the right, the small key sits
      gleaming behind the glass, utterly unremarkable in size.
    characters: [attending-researcher-m, scp-005]
    caption:
      ja: "この物品を収容区域から持ち出す際は、レベル4職員少なくとも1名の承認を要する。"
      en: "Approval of at least one (1) Level 4 personnel is required for the removal of the object from its containment area."
      cs: "K odstranění objektu z jeho oblasti zadržení je vyžadován souhlas alespoň jednoho (1) pracovníka úrovně 4."
      de: "Für die Entfernung des Objekts aus seinem Aufbewahrungsbereich ist die Genehmigung mindestens eines (1) Mitarbeiters der Stufe 4 erforderlich."
      es: "Se requiere la aprobación de al menos un (1) miembro del personal de Nivel 4 para la retirada del objeto de su área de contención."
      fr: "L'approbation d'au moins un (1) membre du personnel de Niveau 4 est requise pour le retrait de l'objet de sa zone de confinement."
      it: "È richiesta l'approvazione di almeno un (1) membro del personale di Livello 4 per la rimozione dell'oggetto dalla sua area di contenimento."
      ko: "이 물체를 격리 구역에서 반출하려면 최소 1명의 4등급 직원의 승인이 필요하다."
      pl: "Do usunięcia obiektu z jego obszaru przechowywania wymagana jest zgoda co najmniej jednego (1) pracownika poziomu 4."
      pt: "É necessária a aprovação de pelo menos um (1) membro do pessoal de Nível 4 para a remoção do objeto de sua área de contenção."
      th: "การนำวัตถุออกจากพื้นที่กักกันต้องได้รับการอนุมัติจากเจ้าหน้าที่ระดับ 4 อย่างน้อยหนึ่ง (1) คน"
      uk: "Для вилучення об'єкта із зони утримання потрібне схвалення щонайменше одного (1) співробітника рівня 4."
      vi: "Cần có sự phê duyệt của ít nhất một (1) nhân viên cấp độ 4 để di chuyển vật thể ra khỏi khu vực chứa."
      zh: "将该物品移出收容区域，需要至少一（1）名4级人员的批准。"
      zh_Hant: "將該物品移出收容區域，需要至少一（1）名4級人員的批准。"
