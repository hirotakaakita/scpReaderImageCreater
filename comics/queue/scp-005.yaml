object_class: Safe

local_characters:
  civilian-intruder:
    name: Civilian Intruder
    description: >
      A civilian man in his 30s, unremarkable build, wearing plain dark
      street clothes (charcoal gray jacket, color RGB 50,50,55) and a
      dark knit cap, short unkempt brown hair (color RGB 90,65,45), tense
      furtive expression.

characters: [attending-researcher-f, attending-researcher-m]

panels:
  - scene: >
      Wide shot, full body, eye level, nighttime exterior of a
      high-security facility entrance. Civilian-intruder crouches at a
      heavy steel vault door, an ornate old-fashioned key mid-turn in an
      obviously modern electronic keypad lock, an out-of-frame
      flashlight beam just catching him from the left, casting a long
      shadow across the wall.
    characters: [civilian-intruder]
    caption:
      ja: "SCP-005は装飾的な鍵の姿をしており、1920年代に一般的に大量生産されていた鍵の特徴を示している。この鍵は、ある民間人が高セキュリティ施設に侵入するために使用したことで発見された。"
      en: "SCP-005 resembles an ornate key, displaying the characteristics of a typical mass-produced key used in the 1920s. The key was discovered when a civilian used it to infiltrate a high-security facility."
      cs: "SCP-005 připomíná ozdobný klíč s charakteristikami typického hromadně vyráběného klíče používaného ve 20. letech 20. století. Klíč byl objeven, když ho civilista použil k proniknutí do vysoce zabezpečeného zařízení."
      de: "SCP-005 ähnelt einem verzierten Schlüssel mit den Merkmalen eines typischen Massenschlüssels aus den 1920er Jahren. Der Schlüssel wurde entdeckt, als ein Zivilist damit in eine hochgesicherte Einrichtung eindrang."
      es: "SCP-005 se asemeja a una llave ornamentada, con las características típicas de una llave producida en masa en la década de 1920. La llave fue descubierta cuando un civil la usó para infiltrarse en una instalación de alta seguridad."
      fr: "Le SCP-005 ressemble à une clé ornementée, présentant les caractéristiques d'une clé typique produite en série dans les années 1920. La clé a été découverte lorsqu'un civil l'a utilisée pour s'infiltrer dans une installation à haute sécurité."
      it: "SCP-005 assomiglia a una chiave ornata, con le caratteristiche tipiche di una chiave prodotta in serie negli anni '20. La chiave fu scoperta quando un civile la usò per infiltrarsi in una struttura ad alta sicurezza."
      ko: "SCP-005는 1920년대에 대량 생산되던 전형적인 열쇠의 특징을 지닌 장식적인 열쇠처럼 보인다. 이 열쇠는 한 민간인이 고보안 시설에 침입하는 데 사용하면서 발견되었다."
      pl: "SCP-005 przypomina ozdobny klucz, wykazujący cechy typowego klucza masowo produkowanego w latach 20. XX wieku. Klucz odkryto, gdy cywil użył go do włamania się do obiektu o wysokim poziomie zabezpieczeń."
      pt: "O SCP-005 se assemelha a uma chave ornamentada, exibindo as características de uma chave típica produzida em massa na década de 1920. A chave foi descoberta quando um civil a usou para invadir uma instalação de alta segurança."
      th: "SCP-005 มีลักษณะคล้ายกุญแจประดับตกแต่ง ซึ่งมีลักษณะเฉพาะของกุญแจที่ผลิตจำนวนมากในทศวรรษ 1920 กุญแจนี้ถูกค้นพบเมื่อพลเรือนคนหนึ่งใช้มันเพื่อลักลอบเข้าไปในสถานที่ที่มีความปลอดภัยสูง"
      uk: "SCP-005 нагадує оздоблений ключ із характеристиками типового масово виробленого ключа 1920-х років. Ключ виявили, коли цивільна особа скористалася ним, щоб проникнути до об'єкта з високим рівнем безпеки."
      vi: "SCP-005 trông giống một chiếc chìa khóa trang trí công phu, mang các đặc điểm của loại chìa khóa sản xuất hàng loạt điển hình vào những năm 1920. Chiếc chìa khóa được phát hiện khi một dân thường sử dụng nó để đột nhập vào một cơ sở an ninh cao."
      zh: "SCP-005外形酷似一把装饰华丽的钥匙，具有二十世纪二十年代典型量产钥匙的特征。这把钥匙是在一名平民用它闯入一处高安保设施时被发现的。"
      zh_Hant: "SCP-005外形酷似一把裝飾華麗的鑰匙，具有二十世紀二十年代典型量產鑰匙的特徵。這把鑰匙是在一名平民用它闖入一處高安保設施時被發現的。"

  - scene: >
      Close-up, low angle, filling most of the frame with a sleek modern
      vault door and its digital keypad, the ornate old key inserted
      directly into a slot beside the keypad, the control panel's
      indicator light flashing over to green despite the obviously
      mismatched mechanical key. On the right edge of the frame,
      attending-researcher-f watches with a stopwatch in hand, eyebrows
      raised in disbelief.
    characters: [attending-researcher-f]
    caption:
      ja: "SCP-005は、機械式であれデジタル式であれ、あらゆる種類の錠を比較的容易に開ける独自の能力を有しているようである。この能力の起源は未だ解明されていない。"
      en: "SCP-005 seems to have the unique ability to open any and all forms of lock, be they mechanical or digital, with relative ease. The origin of this ability has yet to be determined."
      cs: "Zdá se, že SCP-005 disponuje jedinečnou schopností s relativní snadností otevřít jakýkoli typ zámku, ať už mechanický, nebo digitální. Původ této schopnosti dosud nebyl určen."
      de: "SCP-005 scheint über die einzigartige Fähigkeit zu verfügen, jede Art von Schloss, ob mechanisch oder digital, mit relativer Leichtigkeit zu öffnen. Der Ursprung dieser Fähigkeit ist noch nicht geklärt."
      es: "SCP-005 parece tener la capacidad única de abrir cualquier tipo de cerradura, ya sea mecánica o digital, con relativa facilidad. El origen de esta capacidad aún no se ha determinado."
      fr: "Le SCP-005 semble posséder la capacité unique d'ouvrir avec une relative facilité tout type de serrure, qu'elle soit mécanique ou numérique. L'origine de cette capacité reste à déterminer."
      it: "SCP-005 sembra possedere la capacità unica di aprire con relativa facilità qualsiasi tipo di serratura, sia essa meccanica o digitale. L'origine di questa capacità deve ancora essere determinata."
      ko: "SCP-005는 기계식이든 디지털식이든 모든 종류의 자물쇠를 비교적 쉽게 여는 독특한 능력을 지닌 것으로 보인다. 이 능력의 기원은 아직 밝혀지지 않았다."
      pl: "SCP-005 wydaje się posiadać wyjątkową zdolność do stosunkowo łatwego otwierania dowolnego rodzaju zamka, mechanicznego czy cyfrowego. Pochodzenie tej zdolności nie zostało jeszcze ustalone."
      pt: "O SCP-005 parece ter a habilidade única de abrir qualquer tipo de fechadura, seja mecânica ou digital, com relativa facilidade. A origem dessa habilidade ainda não foi determinada."
      th: "SCP-005 ดูเหมือนจะมีความสามารถพิเศษในการเปิดกุญแจทุกรูปแบบได้อย่างง่ายดาย ไม่ว่าจะเป็นแบบกลไกหรือดิจิทัล ที่มาของความสามารถนี้ยังไม่สามารถระบุได้"
      uk: "Схоже, SCP-005 має унікальну здатність відносно легко відкривати будь-який тип замка, механічний чи цифровий. Походження цієї здатності досі не встановлено."
      vi: "SCP-005 dường như có khả năng đặc biệt là mở được mọi loại ổ khóa, dù là cơ học hay kỹ thuật số, một cách tương đối dễ dàng. Nguồn gốc của khả năng này vẫn chưa được xác định."
      zh: "SCP-005似乎拥有一种独特的能力，能够相对轻松地打开任何形式的锁具，无论是机械锁还是电子锁。这种能力的来源尚未查明。"
      zh_Hant: "SCP-005似乎擁有一種獨特的能力，能夠相對輕鬆地打開任何形式的鎖具，無論是機械鎖還是電子鎖。這種能力的來源尚未查明。"

  - scene: >
      Medium shot, waist-up, eye level, a Foundation break room. On the
      right side of the frame, attending-researcher-m stands at a
      vending machine with the ornate key jammed into the machine's coin
      return slot, a bag of chips clattering loose into the tray below,
      his expression caught between guilt and satisfaction as he glances
      toward the doorway on the left.
    characters: [attending-researcher-m]
    caption:
      ja: "SCP-005を自動販売機の修理、ロッカーの開錠、あるいは職員個人の自宅の合鍵として使用することを禁じる。"
      en: "SCP-005 may not be used for vending machine repairs, opening lockers, or for any personnel's spare home key."
      cs: "SCP-005 nesmí být použito k opravám prodejních automatů, otevírání skříněk ani jako náhradní domácí klíč pro žádného člena personálu."
      de: "SCP-005 darf nicht für Reparaturen an Verkaufsautomaten, das Öffnen von Spinden oder als privater Ersatzhausschlüssel für Personal verwendet werden."
      es: "SCP-005 no debe utilizarse para reparar máquinas expendedoras, abrir taquillas, ni como llave de repuesto del hogar de ningún miembro del personal."
      fr: "Le SCP-005 ne doit pas être utilisé pour réparer des distributeurs automatiques, ouvrir des casiers, ou servir de double de clé personnelle pour le domicile d'un membre du personnel."
      it: "SCP-005 non può essere utilizzato per riparare distributori automatici, aprire armadietti, o come chiave di riserva per l'abitazione di alcun membro del personale."
      ko: "SCP-005는 자판기 수리, 사물함 개방, 또는 어떤 직원의 개인 자택 여벌 열쇠로 사용되어서는 안 된다."
      pl: "SCP-005 nie może być używane do napraw automatów sprzedających, otwierania szafek ani jako zapasowy klucz domowy dla jakiegokolwiek pracownika."
      pt: "O SCP-005 não pode ser usado para consertos de máquinas de venda automática, abrir armários, ou como chave reserva da casa de qualquer funcionário."
      th: "ห้ามใช้ SCP-005 เพื่อซ่อมเครื่องจำหน่ายสินค้าอัตโนมัติ เปิดล็อกเกอร์ หรือเป็นกุญแจสำรองบ้านของเจ้าหน้าที่คนใด"
      uk: "SCP-005 не можна використовувати для ремонту торгових автоматів, відкривання шафок або як запасний домашній ключ будь-якого співробітника."
      vi: "Không được sử dụng SCP-005 để sửa máy bán hàng tự động, mở tủ locker, hoặc làm chìa khóa dự phòng cho nhà riêng của bất kỳ nhân viên nào."
      zh: "SCP-005不得用于维修自动售货机、打开储物柜，或作为任何职员自家住宅的备用钥匙。"
      zh_Hant: "SCP-005不得用於維修自動販賣機、打開置物櫃，或作為任何職員自家住宅的備用鑰匙。"

  - scene: >
      Wide shot, full body, eye level, pulled back to show the whole
      break room, a very different framing from the tight medium shot
      before. On the left side of the frame, attending-researcher-f
      stands with one hand held out sternly, palm up. On the right side
      of the frame, attending-researcher-m sheepishly places the key
      into her palm, shoulders slumped, the vending machine visible
      behind him.
    characters: [attending-researcher-f, attending-researcher-m]
    caption:
      ja: "この物品を施設外へ持ち出した場合、即時処分の対象となる。"
      en: "Removal of the object from the compound will result in immediate termination."
      cs: "Odnesení objektu z areálu bude mít za následek okamžité vyřazení ze služby."
      de: "Die Entfernung des Objekts vom Gelände führt zur sofortigen Terminierung."
      es: "La extracción del objeto del recinto resultará en la terminación inmediata."
      fr: "Le retrait de l'objet de l'enceinte entraînera la neutralisation immédiate du responsable."
      it: "La rimozione dell'oggetto dal complesso comporterà la terminazione immediata."
      ko: "이 물체를 시설 밖으로 반출할 경우 즉시 처분된다."
      pl: "Wyniesienie obiektu poza teren placówki skutkuje natychmiastowym usunięciem ze służby."
      pt: "A remoção do objeto do complexo resultará em terminação imediata."
      th: "การนำวัตถุออกจากบริเวณสถานที่จะส่งผลให้ถูกกำจัดทันที"
      uk: "Винесення об'єкта за межі комплексу призведе до негайної ліквідації."
      vi: "Việc mang vật thể ra khỏi khuôn viên sẽ dẫn đến việc xử lý ngay lập tức."
      zh: "将该物体带离场区将导致立即处决。"
      zh_Hant: "將該物體帶離場區將導致立即處決。"

addendum:
  ja: "補遺：錠であると認識できないほど偽装された場合、約50%の試行でSCP-005は開錠に失敗した——対象は暫定的に「知性を持つ」に分類されている。"
  en: "Addendum: In roughly 50% of trials where a lock was disguised beyond recognition, SCP-005 failed to open it — the object is now tentatively classified as sentient."
  cs: "Dodatek: Přibližně v 50 % pokusů, kdy byl zámek zamaskován k nepoznání, se SCP-005 nepodařilo jej otevřít – objekt je nyní předběžně klasifikován jako vnímající."
  de: "Anhang: In etwa 50 % der Versuche, bei denen ein Schloss bis zur Unkenntlichkeit getarnt war, gelang es SCP-005 nicht, es zu öffnen – das Objekt wird nun vorläufig als empfindungsfähig eingestuft."
  es: "Adenda: En aproximadamente el 50% de las pruebas en las que una cerradura estaba disfrazada hasta ser irreconocible, SCP-005 no logró abrirla; el objeto ahora se clasifica tentativamente como consciente."
  fr: "Addendum : Dans environ 50 % des essais où une serrure était déguisée au point d'être méconnaissable, le SCP-005 n'a pas réussi à l'ouvrir — l'objet est désormais provisoirement classé comme sensible."
  it: "Addendum: In circa il 50% dei casi in cui una serratura era camuffata fino a diventare irriconoscibile, SCP-005 non è riuscito ad aprirla — l'oggetto è ora provvisoriamente classificato come senziente."
  ko: "부록: 자물쇠가 알아볼 수 없을 정도로 위장된 시험에서 약 50%의 확률로 SCP-005는 개방에 실패했다 — 대상은 잠정적으로 '지각 있음'으로 분류되었다."
  pl: "Aneks: W około 50% prób, w których zamek został zamaskowany do nierozpoznania, SCP-005 nie zdołało go otworzyć — obiekt jest obecnie tymczasowo klasyfikowany jako świadomy."
  pt: "Adendo: Em cerca de 50% dos testes em que uma fechadura foi disfarçada a ponto de ficar irreconhecível, o SCP-005 não conseguiu abri-la — o objeto agora é classificado provisoriamente como senciente."
  th: "ภาคผนวก: ในประมาณ 50% ของการทดลองที่กุญแจถูกพรางจนจำไม่ได้ SCP-005 ไม่สามารถเปิดได้ — ขณะนี้วัตถุถูกจัดประเภทชั่วคราวว่ามีความรู้สึกนึกคิด"
  uk: "Додаток: Приблизно у 50% випробувань, коли замок був замаскований до невпізнання, SCP-005 не вдалося його відкрити — об'єкт тепер попередньо класифікується як розумний."
  vi: "Phụ lục: Trong khoảng 50% các thử nghiệm mà ổ khóa được ngụy trang đến mức không thể nhận ra, SCP-005 đã không thể mở được — vật thể hiện được phân loại tạm thời là có tri giác."
  zh: "补遗：在约50%的试验中，当锁具被伪装到无法辨认的程度时，SCP-005未能将其打开——该物体现被暂定归类为具有感知能力。"
  zh_Hant: "補遺：在約50%的試驗中，當鎖具被偽裝到無法辨認的程度時，SCP-005未能將其打開——該物體現被暫定歸類為具有感知能力。"
