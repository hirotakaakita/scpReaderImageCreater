# SCP-005 4コマ台本
# captionはSpecial Containment Procedures / Description / Additional Notesの
# 実際の文章からの引用。Appendix A（実験データ）は本編に混ぜず、addendumの
# 一言に留めた。キャラにセリフは言わせない。JP公式訳が直接取得できなかった
# ため、検証済みの英語本文からの翻訳（ja含む）。

id: scp-005

