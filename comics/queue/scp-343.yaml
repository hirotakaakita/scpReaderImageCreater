# SCP-343「神様」4コマ台本
# キャラにセリフは言わせない。captionは記事本文からの引用。

id: scp-343

title:
  en: "SCP-343: God"
  ja: "SCP-343：神様"
  cs: "SCP-343: Bůh"
  de: "SCP-343: Gott"
  es: "SCP-343: Dios"
  fr: "SCP-343 : Dieu"
  it: "SCP-343: Dio"
  ko: "SCP-343: 신"
  pl: "SCP-343: Bóg"
  pt: "SCP-343: Deus"
  th: "SCP-343: พระเจ้า"
  uk: "SCP-343: Бог"
  vi: "SCP-343: Thượng Đế"
  zh: "SCP-343：神"
  zh_Hant: "SCP-343：神"

attribution:
  article: "SCP-343"
  source_url: "http://scp-wiki.wikidot.com/scp-343"
  license: "CC BY-SA 3.0"

object_class: Safe

characters: [researcher-hana]

panels:
  - scene: >
      Wide shot, full body, showing the whole modest break room from the
      doorway. Dr. Hana enters carrying an empty mug and stops mid-step,
      noticing a kindly elderly man with a gentle, faintly glowing
      presence sitting calmly at the table across the room, sipping tea
      with perfect serenity, features soft and hard to quite focus on.
    characters: [researcher-hana]
    caption:
      ja: "SCP-343は男性の姿をした、人種の判然としない人型実体であり、外見上あらゆる能力を持つように見える。"
      en: "SCP-343 is a male, seemingly race-less, humanoid in appearance with apparent omnipotence."
      cs: "SCP-343 je muž, zdánlivě bez rasového určení, lidského vzhledu, se zjevnou všemohoucností."
      de: "SCP-343 ist männlich, scheinbar ohne erkennbare Ethnizität, humanoid im Erscheinungsbild und offenbar allmächtig."
      es: "SCP-343 es de apariencia masculina, aparentemente sin raza definida, de aspecto humanoide y con aparente omnipotencia."
      fr: "SCP-343 est un homme, apparemment sans race définie, d'apparence humanoïde et doté d'une apparente omnipotence."
      it: "SCP-343 è di sesso maschile, apparentemente senza razza definita, dall'aspetto umanoide e dotato di apparente onnipotenza."
      ko: "SCP-343는 남성형이며 인종을 특정할 수 없는 인간형 외모를 지녔고, 겉보기에 전능한 능력을 가진 것으로 보인다."
      pl: "SCP-343 ma męski, pozornie pozbawiony rasy, humanoidalny wygląd i wykazuje pozorną wszechmoc."
      pt: "SCP-343 é do sexo masculino, aparentemente sem raça definida, de aparência humanoide e com aparente onipotência."
      th: "SCP-343 มีลักษณะเป็นเพศชาย ดูเหมือนไม่มีเชื้อชาติที่ชัดเจน มีรูปร่างคล้ายมนุษย์ และดูเหมือนจะทรงอำนาจสูงสุด"
      uk: "SCP-343 має чоловічу подобу, вочевидь без вираженої раси, гуманоїдну зовнішність і, схоже, всемогутність."
      vi: "SCP-343 mang hình dáng nam giới, dường như không thuộc chủng tộc nào rõ ràng, có ngoại hình giống người và dường như toàn năng."
      zh: "SCP-343呈男性外貌，种族特征不明，形态似人类，表面上似乎拥有全能之力。"
      zh_Hant: "SCP-343呈男性外貌，種族特徵不明，形態似人類，表面上似乎擁有全能之力。"

  - scene: >
      Close-up shot centered on the elderly man's face, filling most of
      the frame: he smiles warmly and nods once, setting down his teacup
      just visible below, radiating calm confidence without any drama.
      Dr. Hana's face, half-convinced and half-amused, is a small sliver
      at the frame's edge.
    characters: [researcher-hana]
    caption:
      ja: "初めての面談で、SCP-343は自らを宇宙の創造主であると率直に主張した。"
      en: "In his first interview, SCP-343 claimed outright to be the creator of the universe."
      cs: "Při prvním rozhovoru SCP-343 rovnou tvrdil, že je stvořitelem vesmíru."
      de: "Im ersten Gespräch behauptete SCP-343 unumwunden, der Schöpfer des Universums zu sein."
      es: "En su primera entrevista, SCP-343 afirmó rotundamente ser el creador del universo."
      fr: "Lors de son premier entretien, SCP-343 a affirmé sans détour être le créateur de l'univers."
      it: "Nel suo primo colloquio, SCP-343 ha affermato apertamente di essere il creatore dell'universo."
      ko: "첫 면담에서 SCP-343는 자신이 우주의 창조주라고 단도직입적으로 주장했다."
      pl: "Podczas pierwszego wywiadu SCP-343 wprost twierdził, że jest stwórcą wszechświata."
      pt: "Em sua primeira entrevista, SCP-343 afirmou categoricamente ser o criador do universo."
      th: "ในการสัมภาษณ์ครั้งแรก SCP-343 อ้างอย่างตรงไปตรงมาว่าตนคือผู้สร้างจักรวาล"
      uk: "На першому інтерв'ю SCP-343 прямо заявив, що є творцем всесвіту."
      vi: "Trong cuộc phỏng vấn đầu tiên, SCP-343 đã thẳng thắn tuyên bố mình là đấng sáng tạo vũ trụ."
      zh: "在首次访谈中，SCP-343直接宣称自己是宇宙的创造者。"
      zh_Hant: "在首次訪談中，SCP-343直接宣稱自己是宇宙的創造者。"

  - scene: >
      Medium shot, dynamic composition. The old man's arm reaches directly
      into the solid wall of the break room as if it were not there,
      then withdraws holding a hamburger, offering it out casually with a
      small smile. Dr. Hana stares at the wall and the hamburger, utterly
      stunned.
    characters: [researcher-hana]
    caption:
      ja: "証明を求められると、彼は笑い、壁をすり抜けて姿を消し、数秒後にハンバーガーを手にして戻ってきた。"
      en: "When asked to prove this, he laughed, walked through the wall of the chamber, and returned seconds later with a hamburger in his hand."
      cs: "Když byl požádán o důkaz, zasmál se, prošel stěnou komory a o pár vteřin později se vrátil s hamburgerem v ruce."
      de: "Als er um einen Beweis gebeten wurde, lachte er, ging durch die Wand der Kammer und kehrte Sekunden später mit einem Hamburger in der Hand zurück."
      es: "Cuando se le pidió que lo demostrara, se rio, atravesó la pared de la cámara y regresó segundos después con una hamburguesa en la mano."
      fr: "Lorsqu'on lui a demandé de le prouver, il a ri, traversé le mur de la chambre et est revenu quelques secondes plus tard avec un hamburger à la main."
      it: "Quando gli fu chiesto di dimostrarlo, rise, attraversò il muro della camera e tornò pochi secondi dopo con un hamburger in mano."
      ko: "이를 증명해 달라고 요청받자 그는 웃으며 방의 벽을 통과했고, 몇 초 후 손에 햄버거를 들고 돌아왔다."
      pl: "Gdy poproszono go o dowód, roześmiał się, przeszedł przez ścianę komory i po kilku sekundach wrócił z hamburgerem w dłoni."
      pt: "Quando pediram que provasse isso, ele riu, atravessou a parede da câmara e voltou segundos depois com um hambúrguer na mão."
      th: "เมื่อถูกขอให้พิสูจน์ เขาหัวเราะ เดินทะลุกำแพงห้องออกไป แล้วกลับมาอีกไม่กี่วินาทีต่อมาพร้อมแฮมเบอร์เกอร์ในมือ"
      uk: "Коли його попросили довести це, він засміявся, пройшов крізь стіну камери й за кілька секунд повернувся з гамбургером у руці."
      vi: "Khi được yêu cầu chứng minh, ông ta cười, xuyên qua bức tường của căn phòng, rồi vài giây sau quay lại với một chiếc bánh hamburger trên tay."
      zh: "当被要求证明这一点时，他笑了笑，径直穿过房间的墙壁，几秒后手拿一个汉堡包回来了。"
      zh_Hant: "當被要求證明這一點時，他笑了笑，逕直穿過房間的牆壁，幾秒後手拿一個漢堡回來了。"

  - scene: >
      Wide shot, full body, pulled back to show the whole break room
      table from a slight side angle. Dr. Hana sits across from the old
      man, sipping her own coffee contentedly, while he continues calmly
      sipping his tea across from her, both perfectly relaxed.
    characters: [researcher-hana]
    caption:
      ja: "SCP-343の収容手順は、日々の対話の機会を設けることのみである。彼の部屋は本人の意思で拡張し、物理的に拘束することはできない。"
      en: "Containment procedures for SCP-343 consist solely of providing daily interaction, as his chamber expands at will and cannot be physically constrained."
      cs: "Zadržovací postupy pro SCP-343 spočívají pouze v zajištění denní interakce, neboť se jeho komora rozšiřuje podle jeho vůle a nelze ji fyzicky omezit."
      de: "Die Sicherungsmaßnahmen für SCP-343 bestehen lediglich darin, tägliche Interaktion zu ermöglichen, da sich seine Kammer nach seinem Willen ausdehnt und physisch nicht eingegrenzt werden kann."
      es: "Los procedimientos de contención de SCP-343 consisten únicamente en proporcionar interacción diaria, ya que su cámara se expande a voluntad y no puede ser restringida físicamente."
      fr: "Les procédures de confinement de SCP-343 consistent uniquement à assurer une interaction quotidienne, car sa chambre s'étend à volonté et ne peut être contrainte physiquement."
      it: "Le procedure di contenimento per SCP-343 consistono unicamente nel fornire interazione quotidiana, poiché la sua camera si espande a piacimento e non può essere fisicamente vincolata."
      ko: "SCP-343의 수용 절차는 매일의 상호작용을 제공하는 것뿐이다. 그의 방은 본인의 의지에 따라 확장되며 물리적으로 구속할 수 없다."
      pl: "Procedury przetrzymywania SCP-343 polegają wyłącznie na zapewnianiu codziennej interakcji, ponieważ jego komora rozszerza się zgodnie z jego wolą i nie można jej fizycznie ograniczyć."
      pt: "Os procedimentos de contenção de SCP-343 consistem apenas em fornecer interação diária, já que sua câmara se expande à vontade e não pode ser fisicamente restringida."
      th: "มาตรการกักกัน SCP-343 มีเพียงการจัดให้มีปฏิสัมพันธ์รายวันเท่านั้น เนื่องจากห้องของเขาขยายได้ตามใจเขาและไม่สามารถควบคุมทางกายภาพได้"
      uk: "Заходи утримання SCP-343 полягають лише в забезпеченні щоденної взаємодії, оскільки його камера розширюється за його волею і не може бути фізично обмежена."
      vi: "Các biện pháp giam giữ đối với SCP-343 chỉ đơn giản là duy trì sự tương tác hàng ngày, vì căn phòng của ông ta mở rộng theo ý muốn và không thể bị giới hạn về mặt vật lý."
      zh: "对SCP-343的收容措施仅限于每日进行互动，因为他的房间会随其意愿扩张，无法以物理方式加以限制。"
      zh_Hant: "對SCP-343的收容措施僅限於每日進行互動，因為他的房間會隨其意願擴張，無法以物理方式加以限制。"

addendum:
  ja: "補遺343-1：本オブジェクトとの定期的な面会は、多くの職員にとって日課となっている。"
  en: "Addendum 343-1: Regular visits with the object have become a daily routine for many staff members."
  cs: "Dodatek 343-1: Pravidelné návštěvy u objektu se pro mnoho členů personálu staly každodenní rutinou."
  de: "Anhang 343-1: Regelmäßige Besuche bei dem Objekt sind für viele Mitarbeiter zur täglichen Routine geworden."
  es: "Adenda 343-1: Las visitas regulares al objeto se han convertido en una rutina diaria para muchos miembros del personal."
  fr: "Addendum 343-1 : Les visites régulières auprès de l'objet sont devenues une routine quotidienne pour de nombreux membres du personnel."
  it: "Addendum 343-1: Le visite regolari all'oggetto sono diventate una routine quotidiana per molti membri del personale."
  ko: "부록 343-1: 본 오브젝트와의 정기적인 면담은 많은 직원들에게 일상적인 일과가 되었다."
  pl: "Aneks 343-1: Regularne wizyty u obiektu stały się codzienną rutyną dla wielu członków personelu."
  pt: "Adendo 343-1: Visitas regulares ao objeto se tornaram uma rotina diária para muitos membros da equipe."
  th: "ภาคผนวก 343-1: การเยี่ยมเยียนวัตถุนี้เป็นประจำได้กลายเป็นกิจวัตรประจำวันของเจ้าหน้าที่หลายคน"
  uk: "Додаток 343-1: Регулярні відвідування об'єкта стали для багатьох працівників щоденною рутиною."
  vi: "Phụ lục 343-1: Việc thăm hỏi vật thể này thường xuyên đã trở thành thói quen hàng ngày của nhiều nhân viên."
  zh: "补遗343-1：定期探访该对象已成为许多工作人员的日常习惯。"
  zh_Hant: "補遺343-1：定期探訪該對象已成為許多工作人員的日常習慣。"
