panels:
  - scene: >
      Close-up, on a small wire stick figure about 9.8cm tall resting
      motionless inside an open teflon-and-rubber lined box.
      attending-researcher-m holds a pair of tweezers nearby, not yet
      touching it, studying it closely.
    characters: [attending-researcher-m]
    caption:
      ja: "SCP-068は、身長9.8cmの針金人形で、未知の金属でできている。この人形は、一本の針金が中心へと折り返しながら構成されたものである。"
      en: "SCP-068 is a wire stick figure, 9.8 cm tall, made of an unknown metal. The figure is composed of a single wire looping back to the center."
      cs: "SCP-068 je drátěná panenka vysoká 9,8 cm, vyrobená z neznámého kovu. Postavička je tvořena jediným drátem, který se stáčí zpět ke středu."
      de: "SCP-068 ist eine 9,8 cm große Drahtfigur aus einem unbekannten Metall. Die Figur besteht aus einem einzigen Draht, der zum Mittelpunkt zurückschleift."
      es: "SCP-068 es una figura de alambre en forma de palito, de 9,8 cm de altura, hecha de un metal desconocido. La figura está compuesta por un único alambre que vuelve en bucle hacia el centro."
      fr: "Le SCP-068 est un bonhomme allumette en fil métallique, haut de 9,8 cm, fait d'un métal inconnu. La figure est composée d'un seul fil qui reboucle vers le centre."
      it: "SCP-068 è una figura stilizzata di filo metallico, alta 9,8 cm, fatta di un metallo sconosciuto. La figura è composta da un unico filo che si riavvolge verso il centro."
      ko: "SCP-068는 높이 9.8cm의 철사 졸라맨 형상으로, 미지의 금속으로 만들어져 있다. 이 형상은 하나의 철사가 중심으로 되돌아 감기며 구성되어 있다."
      pl: "SCP-068 to druciana figurka patyczaka o wysokości 9,8 cm, wykonana z nieznanego metalu. Figurka jest utworzona z pojedynczego drutu, który zapętla się z powrotem do środka."
      pt: "O SCP-068 é uma figura de arame em forma de boneco palito, com 9,8 cm de altura, feita de um metal desconhecido. A figura é composta por um único fio que se enrola de volta ao centro."
      th: "SCP-068 คือรูปคนแท่งลวดสูง 9.8 ซม. ทำจากโลหะที่ไม่ทราบชนิด รูปทรงนี้ประกอบขึ้นจากลวดเส้นเดียวที่วนกลับมายังจุดศูนย์กลาง"
      uk: "SCP-068 — це дротяна фігурка-чоловічок заввишки 9,8 см, виготовлена з невідомого металу. Фігурка складається з єдиного дроту, що петлею повертається до центру."
      vi: "SCP-068 là một hình người que làm bằng dây kim loại, cao 9,8 cm, được làm từ một loại kim loại không xác định. Hình dạng này được cấu tạo từ một sợi dây duy nhất uốn vòng trở lại trung tâm."
      zh: "SCP-068是一个高9.8厘米的金属丝火柴人，由一种未知金属制成。该形体由一根金属丝绕回中心构成。"
      zh_Hant: "SCP-068是一個高9.8公分的金屬絲火柴人，由一種未知金屬製成。該形體由一根金屬絲繞回中心構成。"

  - scene: >
      Medium shot, waist-up, a different framing from the close-up
      before, on a lab table. The now-animate wire figure stands on a
      sheet of scrap metal, kneading it with its wire hands and pulling
      off a thin strip, a second half-formed figure emerging beside it.
      attending-researcher-f watches through safety goggles, notepad in
      hand.
    characters: [attending-researcher-f]
    caption:
      ja: "SCP-068に電流を流すと、それは活性化し、自らの意思で動き回るようになる。金属を発見すると、SCP-068はそれをこね始め、細い金属片を引き剥がして、自分自身と同じような別の人形を作り上げる。"
      en: "When an electric current is introduced to SCP-068, it becomes animate, moving about on its own. Once metal has been found, SCP-068 will begin to knead it and pull a thin strip of metal off, then construct another figure similar to itself."
      cs: "Když je do SCP-068 zaveden elektrický proud, ožije a začne se samo pohybovat. Jakmile najde kov, SCP-068 jej začne hníst a odtrhne tenký kovový pásek, z něhož poté vytvoří další figurku sobě podobnou."
      de: "Wird SCP-068 elektrischer Strom zugeführt, erwacht es zum Leben und bewegt sich eigenständig. Sobald Metall gefunden wird, beginnt SCP-068, es zu kneten und einen dünnen Metallstreifen abzuziehen, um daraus eine weitere ihm ähnliche Figur zu formen."
      es: "Cuando se introduce una corriente eléctrica en el SCP-068, este se anima y comienza a moverse por sí mismo. Una vez que encuentra metal, el SCP-068 empieza a amasarlo y a arrancar una fina tira de metal, con la que construye otra figura similar a sí mismo."
      fr: "Lorsqu'un courant électrique est introduit dans le SCP-068, celui-ci s'anime et se déplace de lui-même. Une fois qu'il a trouvé du métal, le SCP-068 commence à le pétrir et à en arracher une fine bande, avec laquelle il construit une autre figure semblable à lui-même."
      it: "Quando una corrente elettrica viene introdotta in SCP-068, esso si anima e inizia a muoversi da solo. Una volta trovato del metallo, SCP-068 inizia a impastarlo e a strapparne una sottile striscia, con cui costruisce un'altra figura simile a sé stesso."
      ko: "SCP-068에 전류가 흐르면 그것은 활성화되어 스스로 움직이기 시작한다. 금속을 발견하면 SCP-068은 그것을 주무르며 얇은 금속 조각을 뜯어내어, 자신과 비슷한 또 다른 형상을 만들어낸다."
      pl: "Gdy do SCP-068 wprowadzony zostanie prąd elektryczny, ożywa i zaczyna poruszać się samodzielnie. Po znalezieniu metalu SCP-068 zaczyna go ugniatać i odrywać cienki pasek metalu, z którego buduje kolejną figurkę podobną do siebie."
      pt: "Quando uma corrente elétrica é introduzida no SCP-068, ele se anima e passa a se mover por conta própria. Assim que encontra metal, o SCP-068 começa a amassá-lo e a arrancar uma fina tira metálica, com a qual constrói outra figura semelhante a si mesmo."
      th: "เมื่อมีกระแสไฟฟ้าไหลผ่าน SCP-068 มันจะมีชีวิตขึ้นมาและเคลื่อนไหวได้ด้วยตัวเอง เมื่อพบโลหะ SCP-068 จะเริ่มนวดโลหะนั้นและดึงแถบโลหะบางๆ ออกมา แล้วสร้างรูปทรงอีกชิ้นที่คล้ายกับตัวมันเองขึ้นมา"
      uk: "Коли до SCP-068 подається електричний струм, воно оживає й починає рухатися самостійно. Знайшовши метал, SCP-068 починає його місити та відриває тонку металеву смужку, з якої будує ще одну фігурку, схожу на себе."
      vi: "Khi có dòng điện được đưa vào SCP-068, nó trở nên sống động và tự di chuyển. Sau khi tìm thấy kim loại, SCP-068 sẽ bắt đầu nhào nặn nó và kéo ra một dải kim loại mỏng, sau đó tạo ra một hình người khác giống như chính nó."
      zh: "当有电流通入SCP-068时，它便会活化并自行移动。一旦发现金属，SCP-068便开始揉捏并从中拉出一条细长金属条，进而构筑出与自己相似的另一个形体。"
      zh_Hant: "當有電流通入SCP-068時，它便會活化並自行移動。一旦發現金屬，SCP-068便開始揉捏並從中拉出一條細長金屬條，進而構築出與自己相似的另一個形體。"

  - scene: >
      Wide shot, full body, pulled back to show the whole lab, a
      different framing from the medium shot before. Dozens of small
      wire figures converge and stack together into one large humanoid
      wire figure nearly two meters tall in the center of the room.
      attending-researcher-m and attending-researcher-f stand back near
      the wall, watching in awe.
    characters: [attending-researcher-m, attending-researcher-f]
    caption:
      ja: "これらのいずれかの条件が満たされると、すべての人形は一箇所に集結し、可能な限り大きな一つの人形を形作り始める。最大102体の「小人形」が使われた場合、出来上がる人形は身長2メートルに達する。"
      en: "When either of these events occur, all figures will converge at one location and begin forming themselves into as big a figure as possible. With a maximum of 102 'mini-figures', the resulting figure reaches two meters in height."
      cs: "Jakmile nastane jedna z těchto podmínek, všechny figurky se sejdou na jednom místě a začnou se skládat do co největší možné postavy. Při maximálním počtu 102 „miniaturních figurek“ dosahuje výsledná postava výšky dvou metrů."
      de: "Sobald eines dieser Ereignisse eintritt, werden sich alle Figuren an einem Ort versammeln und beginnen, sich zu einer möglichst großen Figur zu formen. Bei maximal 102 'Miniaturfiguren' erreicht die resultierende Figur eine Höhe von zwei Metern."
      es: "Cuando ocurre cualquiera de estos eventos, todas las figuras convergerán en un mismo lugar y comenzarán a formarse en la figura más grande posible. Con un máximo de 102 'minifiguras', la figura resultante alcanza los dos metros de altura."
      fr: "Lorsque l'un ou l'autre de ces événements se produit, toutes les figures convergent vers un même endroit et commencent à se former en la plus grande figure possible. Avec un maximum de 102 « mini-figurines », la figure résultante atteint deux mètres de hauteur."
      it: "Quando si verifica uno di questi eventi, tutte le figure convergono in un unico luogo e iniziano a formarsi nella figura più grande possibile. Con un massimo di 102 'mini-figure', la figura risultante raggiunge i due metri di altezza."
      ko: "이 두 조건 중 하나가 충족되면 모든 형상은 한 지점으로 모여들어 가능한 한 커다란 하나의 형상을 이루기 시작한다. 최대 102개의 '미니 형상'이 사용될 경우, 완성된 형상은 높이 2미터에 이른다."
      pl: "Gdy zajdzie którekolwiek z tych zdarzeń, wszystkie figurki zbiegają się w jednym miejscu i zaczynają formować się w jak największą możliwą postać. Przy maksymalnej liczbie 102 „mini-figurek” powstała postać osiąga wysokość dwóch metrów."
      pt: "Quando qualquer um desses eventos ocorre, todas as figuras convergem para um único local e começam a se formar na maior figura possível. Com um máximo de 102 'minifiguras', a figura resultante atinge dois metros de altura."
      th: "เมื่อเงื่อนไขข้อใดข้อหนึ่งเกิดขึ้น รูปทรงทั้งหมดจะมารวมกันที่จุดเดียวและเริ่มก่อร่างเป็นรูปทรงที่ใหญ่ที่สุดเท่าที่จะเป็นไปได้ ด้วยจำนวน 'รูปทรงจิ๋ว' สูงสุด 102 ชิ้น รูปทรงที่ได้จะสูงถึงสองเมตร"
      uk: "Коли трапляється будь-яка з цих подій, усі фігурки збираються в одному місці й починають формуватися в якомога більшу фігуру. За максимальної кількості 102 «міні-фігурок» отримана фігура сягає двох метрів заввишки."
      vi: "Khi một trong hai điều kiện này xảy ra, tất cả các hình người sẽ hội tụ về một địa điểm và bắt đầu kết hợp thành một hình người lớn nhất có thể. Với tối đa 102 'hình người nhỏ', hình người kết quả đạt chiều cao hai mét."
      zh: "当上述任一条件出现时，所有形体都会汇聚到同一地点，开始组合成尽可能大的一个形体。若使用多达102个「迷你形体」，最终形成的形体可达两米高。"
      zh_Hant: "當上述任一條件出現時，所有形體都會匯聚到同一地點，開始組合成盡可能大的一個形體。若使用多達102個「迷你形體」，最終形成的形體可達兩公尺高。"

  - scene: >
      Low angle looking up at the tall wire figure standing motionless
      again in the center of the room, a different framing from the
      wide shot before. attending-researcher-m and attending-researcher-f
      approach cautiously carrying a large melting torch, preparing to
      begin retrieving the original figure from within it.
    characters: [attending-researcher-m, attending-researcher-f]
    caption:
      ja: "第二段階に達し、それ以上人形を作るための金属が入手できなくなると、SCP-068は活動開始から4分32秒後に休眠状態へと戻る。元の人形を回収するには、周囲を取り囲む素材を溶かして取り除かなければならない。"
      en: "Once it has reached the second stage and there are no metals available from which to construct figures, SCP-068 returns to its dormant state after 4 minutes and 32 seconds of activity. Material surrounding the original figure must be melted away in order to retrieve it."
      cs: "Jakmile dosáhne druhé fáze a nejsou k dispozici žádné další kovy, ze kterých by se daly vytvořit figurky, SCP-068 se po 4 minutách a 32 sekundách aktivity vrátí do klidového stavu. Materiál obklopující původní figurku je nutné odtavit, aby bylo možné ji získat zpět."
      de: "Sobald die zweite Phase erreicht ist und keine Metalle mehr zur Verfügung stehen, um weitere Figuren zu bauen, kehrt SCP-068 nach 4 Minuten und 32 Sekunden Aktivität in seinen Ruhezustand zurück. Das Material rund um die ursprüngliche Figur muss weggeschmolzen werden, um sie zu bergen."
      es: "Una vez que alcanza la segunda etapa y no hay más metales disponibles para construir figuras, el SCP-068 vuelve a su estado latente tras 4 minutos y 32 segundos de actividad. El material que rodea a la figura original debe fundirse para poder recuperarla."
      fr: "Une fois qu'il a atteint la deuxième étape et qu'il n'y a plus de métal disponible pour construire des figures, le SCP-068 retourne à son état dormant après 4 minutes et 32 secondes d'activité. Le matériau entourant la figure d'origine doit être fondu pour pouvoir la récupérer."
      it: "Una volta raggiunta la seconda fase e in assenza di metalli disponibili per costruire altre figure, SCP-068 torna al suo stato dormiente dopo 4 minuti e 32 secondi di attività. Il materiale che circonda la figura originale deve essere fuso per poterla recuperare."
      ko: "두 번째 단계에 도달하고 더 이상 형상을 만들 금속이 없으면, SCP-068은 4분 32초의 활동 끝에 휴면 상태로 돌아간다. 원래의 형상을 회수하려면 그것을 둘러싼 재료를 녹여 제거해야 한다."
      pl: "Gdy osiągnie drugi etap i nie ma już metalu, z którego można by budować figurki, SCP-068 po 4 minutach i 32 sekundach aktywności powraca do stanu uśpienia. Aby odzyskać oryginalną figurkę, należy stopić otaczający ją materiał."
      pt: "Assim que atinge o segundo estágio e não há mais metais disponíveis para construir figuras, o SCP-068 retorna ao seu estado dormente após 4 minutos e 32 segundos de atividade. O material ao redor da figura original deve ser derretido para recuperá-la."
      th: "เมื่อไปถึงระยะที่สองและไม่มีโลหะเหลือให้สร้างรูปทรงเพิ่มเติมแล้ว SCP-068 จะกลับสู่สถานะสงบนิ่งหลังจากทำงานเป็นเวลา 4 นาที 32 วินาที วัสดุที่ล้อมรอบรูปทรงดั้งเดิมต้องถูกหลอมออกเพื่อนำมันกลับคืนมา"
      uk: "Досягнувши другої стадії й вичерпавши всі доступні метали для побудови фігурок, SCP-068 повертається у стан спокою після 4 хвилин 32 секунд активності. Матеріал, що оточує оригінальну фігурку, необхідно розплавити, щоб її дістати."
      vi: "Sau khi đạt đến giai đoạn thứ hai và không còn kim loại nào để tạo thêm hình người, SCP-068 sẽ trở lại trạng thái ngủ yên sau 4 phút 32 giây hoạt động. Vật liệu bao quanh hình người gốc phải được nung chảy để lấy nó ra."
      zh: "一旦进入第二阶段且没有更多金属可供构筑形体，SCP-068会在活动4分32秒后回归休眠状态。必须将包裹原始形体的材料熔化，才能将其取回。"
      zh_Hant: "一旦進入第二階段且沒有更多金屬可供構築形體，SCP-068會在活動4分32秒後回歸休眠狀態。必須將包裹原始形體的材料熔化，才能將其取回。"

addendum:
  ja: "補遺：危険な金属系SCPの処分にSCP-068を使う案は却下された。結局のところ、無敵の針金人形が大量に走り回るだけになるためである。「正直、誰がこんな案を思いついたんだ」——█████博士"
  en: "Addendum: A proposal to use SCP-068 for disposing of dangerous metal-based SCPs was denied, since the result would simply be a bunch of invulnerable wire figures running about. 'Honestly, who even thought this up?' — Dr. █████"
  cs: "Dodatek: Návrh použít SCP-068 k likvidaci nebezpečných kovových SCP byl zamítnut, protože výsledkem by prostě byla banda nezničitelných drátěných figurek pobíhajících kolem. „Upřímně, kdo tohle vůbec vymyslel?“ — Dr. █████"
  de: "Anhang: Ein Vorschlag, SCP-068 zur Entsorgung gefährlicher metallbasierter SCPs einzusetzen, wurde abgelehnt, da das Ergebnis lediglich ein Haufen unzerstörbarer, herumlaufender Drahtfiguren wäre. „Ehrlich, wer hat sich das überhaupt ausgedacht?“ — Dr. █████"
  es: "Adenda: Se rechazó una propuesta para usar el SCP-068 en la eliminación de SCP peligrosos a base de metal, ya que el resultado sería simplemente un montón de figuras de alambre invulnerables correteando por ahí. «Sinceramente, ¿a quién se le ocurrió esto?» — Dr. █████"
  fr: "Addendum : Une proposition d'utiliser le SCP-068 pour se débarrasser de SCP dangereux à base de métal a été rejetée, le résultat n'étant qu'un tas de figurines en fil de fer invulnérables courant partout. « Franchement, qui a bien pu penser à ça ? » — Dr █████"
  it: "Addendum: Una proposta di usare SCP-068 per smaltire pericolosi SCP a base metallica è stata respinta, poiché il risultato sarebbe semplicemente un branco di figure di filo invulnerabili che scorrazzano in giro. «Sinceramente, a chi è venuta in mente questa idea?» — Dr. █████"
  ko: "부록: 위험한 금속 기반 SCP를 처리하는 데 SCP-068을 사용하자는 제안은 기각되었다. 그렇게 해봤자 무적의 철사 인형 떼가 돌아다니게 될 뿐이기 때문이다. \"솔직히, 대체 누가 이런 생각을 한 거지?\" — █████ 박사"
  pl: "Aneks: Propozycję wykorzystania SCP-068 do utylizacji niebezpiecznych SCP na bazie metalu odrzucono, ponieważ rezultatem byłaby po prostu banda niezniszczalnych drucianych figurek biegających dookoła. „Szczerze mówiąc, kto to w ogóle wymyślił?” — dr █████"
  pt: "Adendo: Uma proposta para usar o SCP-068 no descarte de SCPs perigosos à base de metal foi negada, já que o resultado seria simplesmente um bando de figuras de arame invulneráveis correndo por aí. \"Sinceramente, quem foi que pensou nisso?\" — Dr. █████"
  th: "ภาคผนวก: ข้อเสนอให้ใช้ SCP-068 กำจัด SCP อันตรายที่มีฐานเป็นโลหะถูกปฏิเสธ เนื่องจากผลลัพธ์ที่ได้จะเป็นเพียงฝูงรูปทรงลวดที่ไม่มีวันถูกทำลายวิ่งพล่านไปทั่ว \"พูดตรงๆ นะ ใครกันที่คิดเรื่องนี้ขึ้นมา\" — ดร. █████"
  uk: "Додаток: Пропозицію використати SCP-068 для утилізації небезпечних металевих SCP відхилили, оскільки результатом стала б просто купа невразливих дротяних фігурок, що бігають довкола. «Чесно кажучи, кому взагалі спало це на думку?» — д-р █████"
  vi: "Phụ lục: Một đề xuất sử dụng SCP-068 để tiêu hủy các SCP nguy hiểm gốc kim loại đã bị từ chối, vì kết quả chỉ đơn giản là một đám hình người dây kim loại bất khả xâm phạm chạy lăng xăng khắp nơi. \"Thành thật mà nói, ai lại nghĩ ra chuyện này vậy?\" — Tiến sĩ █████"
  zh: "补遗：有人提议用SCP-068来处置危险的金属类SCP，但该提案被否决了，因为结果无非是多出一群刀枪不入、四处乱跑的金属丝人偶。「说真的，这是谁想出来的主意？」——█████博士"
  zh_Hant: "補遺：有人提議用SCP-068來處置危險的金屬類SCP，但該提案被否決了，因為結果無非是多出一群刀槍不入、四處亂跑的金屬絲人偶。「說真的，這是誰想出來的主意？」——█████博士"
