id: scp-003

title:
  ja: "SCP-003"
  en: "SCP-003"
  cs: "SCP-003"
  de: "SCP-003"
  es: "SCP-003"
  fr: "SCP-003"
  it: "SCP-003"
  ko: "SCP-003"
  pl: "SCP-003"
  pt: "SCP-003"
  th: "SCP-003"
  uk: "SCP-003"
  vi: "SCP-003"
