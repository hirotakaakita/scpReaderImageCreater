object_class: Safe

local_characters:
  robert-chetford:
    name: SCP-014
    description: >
      Robert Chetford, a Caucasian man appearing to be about 30 years
      old, black hair (color RGB 30,25,20), brown eyes, a somewhat round
      face, calm and utterly placid expression. Wears plain
      early-20th-century-style clothing (a simple collared shirt and
      waistcoat, muted gray-brown, color RGB 100,90,75), sitting
      perfectly motionless.

characters: [robert-chetford, attending-researcher-f, attending-researcher-m]

panels:
  - scene: >
      Wide shot, full body, eye level, showing a chair with arms
      positioned beside a large window, warm daylight streaming in.
      Robert-Chetford sits motionless in the chair, hands resting on the
      armrests, staring calmly out the window, utterly still.
    characters: [robert-chetford]
    caption:
      ja: "SCP-014は白人男性で、見た目の年齢はおよそ30歳、黒髪、茶色の瞳、やや丸みを帯びた顔立ちをしている。記録によれば名前はロバート・チェットフォード、1915年に収容され、自分は永遠に生きるよう呪われ、少しずつコンクリートに変わりつつあると主張していた。"
      en: "SCP-014 is a Caucasian male, appearing to be approximately 30 years of age, with black hair, brown eyes, and a somewhat round face. Records indicate his name to be Robert Chetford, confined in 1915, claiming that he had been cursed to live forever, and was slowly turning into concrete."
      cs: "SCP-014 je běloch, zdánlivě ve věku kolem 30 let, s černými vlasy, hnědýma očima a poněkud kulatým obličejem. Podle záznamů se jmenuje Robert Chetford, byl umístěn do ústavu v roce 1915 a tvrdil, že byl prokleto žít věčně a postupně se proměňuje v beton."
      de: "SCP-014 ist ein weißer Mann, der etwa 30 Jahre alt erscheint, mit schwarzem Haar, braunen Augen und einem etwas rundlichen Gesicht. Aufzeichnungen zufolge lautet sein Name Robert Chetford, er wurde 1915 eingewiesen und behauptete, er sei dazu verflucht, ewig zu leben, und verwandle sich dabei allmählich in Beton."
      es: "SCP-014 es un hombre caucásico, de aproximadamente 30 años de aspecto, con cabello negro, ojos marrones y un rostro algo redondeado. Los registros indican que su nombre es Robert Chetford, internado en 1915, quien afirmaba haber sido maldecido a vivir eternamente, convirtiéndose lentamente en hormigón."
      fr: "Le SCP-014 est un homme caucasien, paraissant âgé d'environ 30 ans, aux cheveux noirs, aux yeux marron et au visage quelque peu rond. Les dossiers indiquent que son nom est Robert Chetford, interné en 1915, prétendant avoir été maudit pour vivre éternellement, se transformant lentement en béton."
      it: "SCP-014 è un uomo caucasico, apparentemente di circa 30 anni, con capelli neri, occhi marroni e un viso piuttosto rotondo. I documenti indicano che il suo nome è Robert Chetford, internato nel 1915, il quale sosteneva di essere stato maledetto a vivere per sempre, trasformandosi lentamente in cemento."
      ko: "SCP-014는 백인 남성으로, 겉보기에는 약 30세 정도이며, 검은 머리, 갈색 눈, 다소 둥근 얼굴을 가지고 있다. 기록에 따르면 이름은 로버트 체트포드로, 1915년에 수용되었으며, 자신이 영원히 살도록 저주받아 서서히 콘크리트로 변하고 있다고 주장했다."
      pl: "SCP-014 to biały mężczyzna, wyglądający na około 30 lat, z czarnymi włosami, brązowymi oczami i nieco okrągłą twarzą. Zapisy wskazują, że nazywa się Robert Chetford, umieszczony w zakładzie w 1915 roku, twierdzący, że został przeklęty, by żyć wiecznie, powoli zamieniając się w beton."
      pt: "O SCP-014 é um homem caucasiano, aparentando cerca de 30 anos, com cabelo preto, olhos castanhos e rosto um tanto arredondado. Os registros indicam que seu nome é Robert Chetford, internado em 1915, alegando ter sido amaldiçoado a viver para sempre, transformando-se lentamente em concreto."
      th: "SCP-014 คือชายผิวขาว ดูมีอายุประมาณ 30 ปี ผมสีดำ ตาสีน้ำตาล ใบหน้าค่อนข้างกลม บันทึกระบุว่าชื่อของเขาคือโรเบิร์ต เชตฟอร์ด ถูกกักขังในปี 1915 โดยอ้างว่าเขาถูกสาปให้มีชีวิตอยู่ตลอดไปและกำลังค่อยๆ กลายเป็นคอนกรีต"
      uk: "SCP-014 — білий чоловік, на вигляд близько 30 років, з чорним волоссям, карими очима та дещо округлим обличчям. Записи вказують, що його звуть Роберт Четфорд, поміщений до закладу в 1915 році, стверджуючи, що на нього наклали прокляття жити вічно, поступово перетворюючись на бетон."
      vi: "SCP-014 là một người đàn ông da trắng, trông khoảng 30 tuổi, tóc đen, mắt nâu, khuôn mặt hơi tròn. Hồ sơ ghi tên anh ta là Robert Chetford, bị giam giữ năm 1915, tự nhận rằng mình bị nguyền rủa phải sống mãi mãi, và đang dần biến thành bê tông."
      zh: "SCP-014是一名白人男性，外表年龄约30岁，黑发，棕色眼睛，脸型略圆。记录显示其姓名为罗伯特·切特福德，于1915年被收容，他自称受到诅咒将永生不死，并正逐渐变成混凝土。"
      zh_Hant: "SCP-014是一名白人男性，外表年齡約30歲，黑髮，棕色眼睛，臉型略圓。記錄顯示其姓名為羅伯特·切特福德，於1915年被收容，他自稱受到詛咒將永生不死，並正逐漸變成混凝土。"

  - scene: >
      Medium shot, waist-up, eye level, a different framing from the
      wide establishing shot. On the left side of the frame,
      attending-researcher-f adjusts an old-style record player on a
      side table beside him. On the right side of the frame,
      robert-chetford sits with eyes closed, a faint peaceful smile,
      listening.
    characters: [attending-researcher-f, robert-chetford]
    caption:
      ja: "SCP-014は肘掛け付きの椅子に座らせ、できれば窓に面した位置に置くこと。音楽は定期的に、できれば常時供給する。この音楽には1937年以降に作られた楽曲を含めてはならない。"
      en: "SCP-014 is to be kept in a chair with arms, preferably facing a window. Music should be supplied on a regular basis, preferably constantly. This music should not include pieces originating after 1937."
      cs: "SCP-014 musí být umístěno v křesle s opěrkami, nejlépe otočeném k oknu. Pravidelně, nejlépe nepřetržitě, by měla být poskytována hudba. Tato hudba by neměla obsahovat skladby vzniklé po roce 1937."
      de: "SCP-014 ist in einem Sessel mit Armlehnen unterzubringen, vorzugsweise mit Blick auf ein Fenster. Musik sollte regelmäßig, vorzugsweise ständig, bereitgestellt werden. Diese Musik sollte keine nach 1937 entstandenen Stücke enthalten."
      es: "SCP-014 debe mantenerse en una silla con brazos, preferiblemente frente a una ventana. Se debe proporcionar música de manera regular, preferiblemente de forma constante. Esta música no debe incluir piezas posteriores a 1937."
      fr: "Le SCP-014 doit être installé dans un fauteuil à accoudoirs, de préférence face à une fenêtre. De la musique doit lui être fournie régulièrement, de préférence en continu. Cette musique ne doit pas inclure de morceaux postérieurs à 1937."
      it: "SCP-014 deve essere tenuto in una poltrona con braccioli, preferibilmente rivolta verso una finestra. La musica dovrebbe essere fornita regolarmente, preferibilmente in modo costante. Questa musica non dovrebbe includere brani successivi al 1937."
      ko: "SCP-014는 팔걸이가 있는 의자에 앉혀야 하며, 가급적 창문을 향하도록 배치한다. 음악은 정기적으로, 가급적 지속적으로 제공되어야 한다. 이 음악에는 1937년 이후에 제작된 곡을 포함해서는 안 된다."
      pl: "SCP-014 należy trzymać na krześle z podłokietnikami, najlepiej zwróconym w stronę okna. Muzyka powinna być dostarczana regularnie, najlepiej stale. Muzyka ta nie powinna zawierać utworów powstałych po 1937 roku."
      pt: "O SCP-014 deve ser mantido em uma cadeira com braços, preferencialmente voltada para uma janela. Música deve ser fornecida regularmente, de preferência constantemente. Essa música não deve incluir peças originadas após 1937."
      th: "SCP-014 ต้องนั่งบนเก้าอี้มีที่วางแขน โดยควรหันหน้าเข้าหาหน้าต่าง ต้องจัดหาดนตรีให้อย่างสม่ำเสมอ ควรจะต่อเนื่องตลอดเวลา ดนตรีนี้ต้องไม่รวมบทเพลงที่แต่งขึ้นหลังปี 1937"
      uk: "SCP-014 слід тримати в кріслі з підлокітниками, бажано обличчям до вікна. Музику слід надавати регулярно, бажано постійно. Ця музика не повинна включати твори, створені після 1937 року."
      vi: "SCP-014 phải được đặt trên một chiếc ghế có tay vịn, tốt nhất là hướng ra cửa sổ. Âm nhạc nên được cung cấp thường xuyên, tốt nhất là liên tục. Loại nhạc này không được bao gồm các bản nhạc sáng tác sau năm 1937."
      zh: "SCP-014应安置在带扶手的椅子上，最好面朝窗户。应定期提供音乐，最好是持续播放。所提供的音乐不应包含1937年以后创作的曲目。"
      zh_Hant: "SCP-014應安置在帶扶手的椅子上，最好面朝窗戶。應定期提供音樂，最好是持續播放。所提供的音樂不應包含1937年以後創作的曲目。"

  - scene: >
      Close-up, filling most of the frame, on robert-chetford's hands
      resting on the chair's armrests, skin unnaturally smooth and
      unblemished, not a single mark or callus visible despite decades
      of stillness.
    characters: [robert-chetford]
    caption:
      ja: "彼は年を取っているようには見えず、代謝を持っている兆候も一切ない。食事も水分摂取も発汗も行わず、その他いかなる生命活動の兆候も示さない。数十年にわたって姿勢を変えていないにもかかわらず、床ずれの兆候は一度も見られていない。"
      en: "He does not appear to age, and shows no signs of possessing a metabolism. He does not eat, drink, perspire, or in any other way demonstrate life functions. He has never shown any evidence of pressure ulcers despite his position not having varied for several decades."
      cs: "Nezdá se, že by stárnul, a nevykazuje žádné známky metabolismu. Nejí, nepije, nepotí se ani jinak neprojevuje životní funkce. Nikdy nevykazoval žádné známky proleženin, přestože svou polohu neměnil po několik desetiletí."
      de: "Er scheint nicht zu altern und zeigt keine Anzeichen eines Stoffwechsels. Er isst nicht, trinkt nicht, schwitzt nicht und zeigt auf keine andere Weise Lebensfunktionen. Er hat trotz jahrzehntelang unveränderter Position nie Anzeichen von Druckgeschwüren gezeigt."
      es: "No parece envejecer, y no muestra signos de tener metabolismo. No come, bebe, transpira ni demuestra ninguna otra función vital. Nunca ha mostrado evidencia de úlceras por presión, a pesar de que su posición no ha variado durante varias décadas."
      fr: "Il ne semble pas vieillir et ne présente aucun signe de métabolisme. Il ne mange, ne boit, ne transpire, ni ne manifeste aucune autre fonction vitale. Il n'a jamais présenté de signe d'escarres malgré une position inchangée depuis plusieurs décennies."
      it: "Non sembra invecchiare e non mostra segni di possedere un metabolismo. Non mangia, non beve, non suda, né dimostra in alcun altro modo funzioni vitali. Non ha mai mostrato alcuna prova di piaghe da decubito nonostante la sua posizione non sia cambiata per diversi decenni."
      ko: "그는 나이를 먹지 않는 것으로 보이며, 신진대사가 있다는 징후도 전혀 없다. 먹지도, 마시지도, 땀을 흘리지도 않으며, 그 밖의 어떤 생명 활동의 징후도 보이지 않는다. 수십 년간 자세가 변하지 않았음에도 욕창의 흔적이 전혀 나타난 적이 없다."
      pl: "Nie wydaje się starzeć i nie wykazuje żadnych oznak posiadania metabolizmu. Nie je, nie pije, nie poci się ani w żaden inny sposób nie wykazuje funkcji życiowych. Nigdy nie wykazywał żadnych oznak odleżyn, mimo że jego pozycja nie zmieniła się od kilku dekad."
      pt: "Ele não parece envelhecer e não apresenta sinais de possuir metabolismo. Ele não come, bebe, transpira ou demonstra de qualquer outra forma funções vitais. Ele nunca apresentou qualquer evidência de úlceras de pressão apesar de sua posição não ter variado por várias décadas."
      th: "เขาดูเหมือนจะไม่มีอายุมากขึ้น และไม่แสดงสัญญาณของการมีระบบเผาผลาญ เขาไม่กิน ไม่ดื่ม ไม่มีเหงื่อ หรือแสดงหน้าที่ของสิ่งมีชีวิตในลักษณะอื่นใด เขาไม่เคยแสดงหลักฐานของแผลกดทับเลยแม้ว่าท่าทางของเขาจะไม่เปลี่ยนแปลงมาหลายทศวรรษ"
      uk: "Він, схоже, не старіє і не виявляє жодних ознак наявності метаболізму. Він не їсть, не п'є, не пітніє і жодним іншим чином не демонструє життєвих функцій. Він ніколи не виявляв жодних ознак пролежнів, попри те що його положення не змінювалося протягом кількох десятиліть."
      vi: "Anh ta dường như không già đi, và không cho thấy dấu hiệu có quá trình trao đổi chất. Anh ta không ăn, không uống, không đổ mồ hôi, hay biểu hiện bất kỳ chức năng sống nào khác. Anh ta chưa bao giờ có dấu hiệu loét do tì đè dù tư thế không hề thay đổi suốt nhiều thập kỷ."
      zh: "他似乎不会衰老，也没有任何新陈代谢的迹象。他不进食、不饮水、不出汗，也不表现出任何其他生命活动迹象。尽管数十年来姿势从未改变，他从未出现过任何压疮的迹象。"
      zh_Hant: "他似乎不會衰老，也沒有任何新陳代謝的跡象。他不進食、不飲水、不出汗，也不表現出任何其他生命活動跡象。儘管數十年來姿勢從未改變，他從未出現過任何褥瘡的跡象。"

  - scene: >
      Wide shot, full body, eye level, pulled back to show the whole
      room, a very different framing from the tight close-up before.
      On the left side of the frame, attending-researcher-m sits on a
      stool nearby, gesturing animatedly as he chats, a folded newspaper
      in his other hand. On the right side of the frame, robert-chetford
      gazes calmly out the window, polite but utterly uninterested,
      not even glancing over.
    characters: [attending-researcher-m, robert-chetford]
    caption:
      ja: "彼は普通に会話することができるが、収容されて以降の出来事についての知識や関心はほとんど示さない。"
      en: "He can converse normally, but shows little knowledge of or interest in events since his confinement."
      cs: "Dokáže normálně konverzovat, ale projevuje jen malé znalosti nebo zájem o události od svého umístění."
      de: "Er kann sich normal unterhalten, zeigt aber wenig Wissen über oder Interesse an Ereignissen seit seiner Einweisung."
      es: "Puede conversar con normalidad, pero muestra poco conocimiento o interés por los acontecimientos ocurridos desde su internamiento."
      fr: "Il peut converser normalement, mais montre peu de connaissance ou d'intérêt pour les événements survenus depuis son internement."
      it: "Può conversare normalmente, ma mostra scarsa conoscenza o interesse per gli eventi accaduti dal momento del suo internamento."
      ko: "그는 정상적으로 대화할 수 있지만, 수용된 이후의 사건에 대해서는 지식이나 관심을 거의 보이지 않는다."
      pl: "Potrafi normalnie prowadzić rozmowę, ale wykazuje niewielką wiedzę o wydarzeniach od czasu umieszczenia go w zakładzie ani zainteresowania nimi."
      pt: "Ele consegue conversar normalmente, mas demonstra pouco conhecimento ou interesse pelos acontecimentos desde seu internamento."
      th: "เขาสามารถสนทนาได้ตามปกติ แต่แสดงความรู้หรือความสนใจต่อเหตุการณ์ต่างๆ นับตั้งแต่ถูกกักขังน้อยมาก"
      uk: "Він може вести розмову нормально, але виявляє мало знань чи інтересу до подій, що відбулися після його поміщення до закладу."
      vi: "Anh ta có thể trò chuyện bình thường, nhưng tỏ ra ít hiểu biết hoặc quan tâm đến các sự kiện kể từ khi bị giam giữ."
      zh: "他能够正常交谈，但对被收容以来发生的事件知之甚少，也几乎不感兴趣。"
      zh_Hant: "他能夠正常交談，但對被收容以來發生的事件知之甚少，也幾乎不感興趣。"
