  uk: "Додаток 066-J: Запити знову створити те кошеня подали окремо сімнадцять співробітників, і вони очікують на розгляд."
  vi: "Phụ lục 066-J: Mười bảy nhân viên đã nộp đơn riêng lẻ xin tạo lại chú mèo con, và đang chờ xét duyệt."
