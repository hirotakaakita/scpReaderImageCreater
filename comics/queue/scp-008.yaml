# SCP-008 4コマ台本
# captionは記事本文（Special Containment Procedures / Description）からの引用。
# キャラにセリフは言わせない。グロ描写は避け、収容手順の淡々とした運用に寄せる。

id: scp-008

title:
  ja: "SCP-008：ゾンビ病"
  en: "SCP-008: The Zombie Plague"
  cs: "SCP-008: Zombie mor"
  de: "SCP-008: Die Zombie-Seuche"
  es: "SCP-008: La plaga zombi"
  fr: "SCP-008 : La peste zombie"
  it: "SCP-008: La peste zombie"
  ko: "SCP-008: 좀비 역병"
  pl: "SCP-008: Zombiowa zaraza"
  pt: "SCP-008: A praga zumbi"
  th: "SCP-008: กาฬโรคซอมบี้"
  uk: "SCP-008: Зомбі-чума"
  vi: "SCP-008: Bệnh dịch Zombie"
  zh: "SCP-008：僵尸瘟疫"
  zh_Hant: "SCP-008：殭屍瘟疫"

attribution:
  article: "SCP-008"
  source_url: "http://scp-wiki.wikidot.com/scp-008"
  license: "CC BY-SA 3.0"

object_class: Euclid

characters: [attending-researcher-m, attending-researcher-f, d-class]

panels:
  - scene: >
      Wide establishing shot, full body, eye level, showing a sealed
      biocontainment laboratory. In the center stands a sealed steel
      glovebox on a bench; inside it, a single small sealed steel vial
      stands upright. On the left side of the frame, Attending Researcher
      (Male) and on the right side, Attending Researcher (Female) stand
      well back from the bench, each in a complete full-body
      positive-pressure hazmat suit, including a fully sealed hood with a
      clear face visor and its own coiled air line, thick gloves, no bare
      skin visible, observing the glovebox.
    characters: [attending-researcher-m, attending-researcher-f]
    caption:
      ja: "SCP-008の検体は、クラスV極度生物学的危険物に指定されており、関連する全てのプロトコルが適用される。"
      en: "SCP-008 samples have been deemed Class V extreme biological hazards, and all related protocols apply."
      cs: "Vzorky SCP-008 byly klasifikovány jako extrémní biologické nebezpečí třídy V a vztahují se na ně veškeré související protokoly."
      de: "SCP-008-Proben werden als extreme biologische Gefahrenstoffe der Klasse V eingestuft, und alle damit verbundenen Protokolle finden Anwendung."
      es: "Las muestras de SCP-008 han sido clasificadas como riesgos biológicos extremos de Clase V, y se aplican todos los protocolos relacionados."
      fr: "Les échantillons de SCP-008 sont classés comme dangers biologiques extrêmes de Classe V, et tous les protocoles associés s'appliquent."
      it: "I campioni di SCP-008 sono stati classificati come rischi biologici estremi di Classe V, e si applicano tutti i protocolli correlati."
      ko: "SCP-008 표본은 5등급 극도 생물학적 위험물로 지정되어 있으며, 관련된 모든 규약이 적용된다."
      pl: "Próbki SCP-008 zostały uznane za skrajne zagrożenia biologiczne Klasy V i obowiązują wobec nich wszystkie powiązane protokoły."
      pt: "As amostras de SCP-008 foram consideradas riscos biológicos extremos de Classe V, e todos os protocolos relacionados se aplicam."
      th: "ตัวอย่างของ SCP-008 ถูกจัดให้เป็นวัตถุอันตรายทางชีวภาพขั้นรุนแรงระดับ 5 และให้ใช้พิธีปฏิบัติที่เกี่ยวข้องทั้งหมด"
      uk: "Зразки SCP-008 визнано надзвичайними біологічними небезпеками Класу V, і на них поширюються всі відповідні протоколи."
      vi: "Các mẫu SCP-008 được xếp loại là mối nguy sinh học cực độ Cấp V, và tất cả các quy trình liên quan đều được áp dụng."
      zh: "SCP-008样本已被判定为V级极端生物危害，所有相关规程均适用。"
      zh_Hant: "SCP-008樣本已被判定為V級極端生物危害，所有相關規程均適用。"

  - scene: >
      Extreme close-up. The thick sealed gloves of the glovebox, worn from
      inside by Attending Researcher (Female), carefully cradle the small
      sealed steel vial, which is frosted with condensation and marked
      only with a plain biohazard trefoil symbol. Her visored hood is
      dimly visible reflected in the glovebox glass behind.
    characters: [attending-researcher-f]
    caption:
      ja: "SCP-008は複雑なプリオンである。SCP-008プリオンの特徴には次のものが含まれる：感染力100%、致死率100%、露出した粘膜およびあらゆる体液を介した伝播、空気感染および水系感染はしない。"
      en: "SCP-008 is a complex prion. Traits of the SCP-008 prion include: 100% infectiousness; 100% lethality; transmission through exposed mucous membranes and all bodily fluids; not airborne or waterborne."
      cs: "SCP-008 je komplexní prion. Mezi vlastnosti prionu SCP-008 patří: 100% nakažlivost; 100% smrtnost; přenos přes obnažené sliznice a všechny tělní tekutiny; nešíří se vzduchem ani vodou."
      de: "SCP-008 ist ein komplexes Prion. Zu den Merkmalen des SCP-008-Prions gehören: 100 % Infektiosität; 100 % Letalität; Übertragung über freiliegende Schleimhäute und alle Körperflüssigkeiten; nicht über die Luft oder das Wasser übertragbar."
      es: "SCP-008 es un prión complejo. Entre las características del prión SCP-008 se incluyen: 100 % de infecciosidad; 100 % de letalidad; transmisión a través de mucosas expuestas y de todos los fluidos corporales; no se transmite por el aire ni por el agua."
      fr: "SCP-008 est un prion complexe. Les caractéristiques du prion SCP-008 comprennent : 100 % d'infectiosité ; 100 % de létalité ; transmission par les muqueuses exposées et tous les fluides corporels ; ni aéroporté ni transmis par l'eau."
      it: "SCP-008 è un prione complesso. Tra le caratteristiche del prione SCP-008 vi sono: 100% di infettività; 100% di letalità; trasmissione attraverso le mucose esposte e tutti i fluidi corporei; non si trasmette per via aerea né idrica."
      ko: "SCP-008은 복잡한 프리온이다. SCP-008 프리온의 특성에는 다음이 포함된다: 감염력 100%, 치사율 100%, 노출된 점막 및 모든 체액을 통한 전염, 공기 전염 및 수인성 전염은 되지 않음."
      pl: "SCP-008 to złożony prion. Do cech prionu SCP-008 należą: 100% zakaźności; 100% śmiertelności; przenoszenie przez odsłonięte błony śluzowe i wszystkie płyny ustrojowe; nie przenosi się drogą powietrzną ani wodną."
      pt: "SCP-008 é um príon complexo. Entre as características do príon SCP-008 estão: 100% de infecciosidade; 100% de letalidade; transmissão por mucosas expostas e todos os fluidos corporais; não é transmitido pelo ar nem pela água."
      th: "SCP-008 เป็นพรีออนที่ซับซ้อน คุณสมบัติของพรีออน SCP-008 ได้แก่ ความสามารถในการติดเชื้อ 100%; อัตราการเสียชีวิต 100%; แพร่กระจายผ่านเยื่อเมือกที่สัมผัสและของเหลวในร่างกายทุกชนิด; ไม่แพร่ทางอากาศหรือทางน้ำ"
      uk: "SCP-008 — це складний пріон. До ознак пріона SCP-008 належать: 100% інфекційність; 100% летальність; передавання через відкриті слизові оболонки та всі тілесні рідини; не передається повітряним або водним шляхом."
      vi: "SCP-008 là một prion phức tạp. Các đặc điểm của prion SCP-008 bao gồm: khả năng lây nhiễm 100%; tỷ lệ tử vong 100%; lây truyền qua niêm mạc hở và mọi dịch cơ thể; không lây qua không khí hoặc nước."
      zh: "SCP-008是一种复杂的朊病毒。SCP-008朊病毒的特性包括：感染率100%；致死率100%；通过暴露的黏膜及一切体液传播；不经空气或水传播。"
      zh_Hant: "SCP-008是一種複雜的朊病毒。SCP-008朊病毒的特性包括：感染率100%；致死率100%；透過暴露的黏膜及一切體液傳播；不經空氣或水傳播。"

  - scene: >
      Medium shot, waist-up. Behind a thick observation window at the back
      of the frame, D-Class Personnel sits wrapped in a grey blanket,
      flushed and tired, dabbing his forehead with a cloth. In the
      foreground on the right, Attending Researcher (Female) stands
      checking a large wall clock and writing the time on a clipboard.
    characters: [d-class, attending-researcher-f]
    caption:
      ja: "SCP-008への感染症状は、曝露から3時間以内に現れ、高熱を伴うインフルエンザ様症状、および後期における重度の認知障害を含む。"
      en: "Symptoms of infection with SCP-008 manifest no more than three hours after exposure, and include flu-like symptoms with high fever, plus severe dementia in later stages."
      cs: "Příznaky nákazy SCP-008 se projeví nejpozději tři hodiny po expozici a zahrnují chřipkové příznaky s vysokou horečkou a v pozdějších fázích těžkou demenci."
      de: "Symptome einer Infektion mit SCP-008 treten spätestens drei Stunden nach der Exposition auf und umfassen grippeähnliche Symptome mit hohem Fieber sowie in späteren Stadien schwere Demenz."
      es: "Los síntomas de la infección por SCP-008 se manifiestan como máximo tres horas después de la exposición e incluyen síntomas gripales con fiebre alta, además de demencia grave en las fases posteriores."
      fr: "Les symptômes de l'infection par SCP-008 apparaissent au plus tard trois heures après l'exposition et comprennent des symptômes grippaux avec forte fièvre, ainsi qu'une démence sévère dans les phases ultérieures."
      it: "I sintomi dell'infezione da SCP-008 si manifestano entro tre ore dall'esposizione e comprendono sintomi simil-influenzali con febbre alta, oltre a grave demenza nelle fasi successive."
      ko: "SCP-008 감염 증상은 노출 후 3시간 이내에 나타나며, 고열을 동반한 독감 유사 증상과 후기 단계의 중증 치매를 포함한다."
      pl: "Objawy zakażenia SCP-008 pojawiają się nie później niż trzy godziny po ekspozycji i obejmują objawy grypopodobne z wysoką gorączką oraz ciężkie otępienie w późniejszych stadiach."
      pt: "Os sintomas da infecção por SCP-008 manifestam-se no máximo três horas após a exposição e incluem sintomas semelhantes aos da gripe com febre alta, além de demência grave nas fases posteriores."
      th: "อาการของการติดเชื้อ SCP-008 จะปรากฏภายในไม่เกินสามชั่วโมงหลังการสัมผัส และรวมถึงอาการคล้ายไข้หวัดใหญ่ที่มีไข้สูง รวมทั้งภาวะสมองเสื่อมอย่างรุนแรงในระยะหลัง"
      uk: "Симптоми зараження SCP-008 з'являються не пізніше ніж через три години після контакту й охоплюють грипоподібні симптоми з високою температурою, а також тяжку деменцію на пізніших стадіях."
      vi: "Các triệu chứng nhiễm SCP-008 xuất hiện không quá ba giờ sau khi phơi nhiễm, bao gồm các triệu chứng giống cúm kèm sốt cao, cùng với chứng sa sút trí tuệ nghiêm trọng ở giai đoạn sau."
      zh: "感染SCP-008的症状在暴露后至多三小时内显现，包括伴有高热的流感样症状，以及后期的重度痴呆。"
      zh_Hant: "感染SCP-008的症狀在暴露後至多三小時內顯現，包括伴有高熱的流感樣症狀，以及後期的重度痴呆。"

  - scene: >
      Wide shot, low angle, a long facility corridor with an overhead
      route sign showing only a blank arrow. On the left side of the
      frame, Attending Researcher (Male) stands on a small stepladder
      lifting a framed evacuation-route floor plan (lines and arrows only,
      no letters) down off the wall. On the right side of the frame,
      Attending Researcher (Female) stands holding a long wall calendar,
      most of its days already crossed off, looking at it flatly.
    characters: [attending-researcher-m, attending-researcher-f]
    caption:
      ja: "施設を離れる工作員の検疫期間は4か月である。全てのG2サイトは、避難手順を用意しないことを方針とすべきである。"
      en: "The quarantine period for operatives leaving the facility is four months. It should be the policy of all G2 sites to not prepare an evacuation procedure."
      cs: "Karanténní doba pro operativce opouštějící zařízení je čtyři měsíce. Zásadou všech pracovišť G2 by mělo být nepřipravovat evakuační postup."
      de: "Die Quarantänezeit für Einsatzkräfte, die die Einrichtung verlassen, beträgt vier Monate. Es sollte die Richtlinie aller G2-Standorte sein, kein Evakuierungsverfahren vorzubereiten."
      es: "El período de cuarentena para los operativos que abandonan la instalación es de cuatro meses. La política de todos los emplazamientos G2 debe ser no preparar ningún procedimiento de evacuación."
      fr: "La période de quarantaine pour les opérateurs quittant l'installation est de quatre mois. La politique de tous les sites G2 doit être de ne pas préparer de procédure d'évacuation."
      it: "Il periodo di quarantena per gli operativi che lasciano la struttura è di quattro mesi. La politica di tutti i siti G2 dovrebbe essere quella di non predisporre alcuna procedura di evacuazione."
      ko: "시설을 떠나는 요원의 검역 기간은 4개월이다. 모든 G2 사이트는 대피 절차를 마련하지 않는 것을 방침으로 삼아야 한다."
      pl: "Okres kwarantanny dla operatorów opuszczających placówkę wynosi cztery miesiące. Polityką wszystkich placówek G2 powinno być nieprzygotowywanie procedury ewakuacyjnej."
      pt: "O período de quarentena para os operativos que deixam a instalação é de quatro meses. A política de todos os sítios G2 deve ser a de não preparar nenhum procedimento de evacuação."
      th: "ระยะเวลากักกันสำหรับเจ้าหน้าที่ปฏิบัติการที่ออกจากสถานที่คือสี่เดือน ทุกสถานที่ G2 ควรถือเป็นนโยบายที่จะไม่จัดเตรียมขั้นตอนการอพยพ"
      uk: "Термін карантину для оперативників, які залишають об'єкт, становить чотири місяці. Політикою всіх майданчиків G2 має бути відмова від підготовки процедури евакуації."
      vi: "Thời gian cách ly đối với nhân viên tác chiến rời khỏi cơ sở là bốn tháng. Chính sách của mọi cơ sở G2 là không chuẩn bị quy trình sơ tán."
      zh: "离开设施的行动人员的隔离期为四个月。所有G2站点均应以不制定疏散程序为方针。"
      zh_Hant: "離開設施的行動人員的隔離期為四個月。所有G2站點均應以不制定疏散程序為方針。"
