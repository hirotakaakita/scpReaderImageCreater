# SCP-028 4コマ台本
# captionはSpecial Containment Procedures / Description本文からの引用。
# 文書EL-028-1125・SCP-1995関連の伏字部分は本編には使わない。
# キャラにセリフは言わせない。
#
# 4コマ構成: 1=ミシガン州の廃資材置き場、物理的実体はないが一辺2.1mの
# 立方体に効果(起)、2=中に入ると3〜6秒で無作為な主題の完全な知識を得る(承)、
# 3=出入りで繰り返せるが2回以降は強い偏頭痛とめまい(転)、
# 4=地元の鉱夫が常温核融合炉の設計を特許庁に提出したのが発端(結)。

