# SCP-028 4コマ台本
# captionはSpecial Containment Procedures / Description本文からの引用。
# Document EL-028-1125（被験者の死亡・エージェントによる銃撃事件等の
# グロ・暴力描写）は本編に含めず、Document EL-028-1114のリストからは
# 無害で滑稽な項目のみを引用した。キャラにセリフは言わせない。JP公式訳が
# 直接取得できなかったため、検証済みの英語本文からの翻訳（ja含む）。

