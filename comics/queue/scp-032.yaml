# SCP-032 4コマ台本
# captionはSpecial Containment Procedures / Description本文からの引用。
# Document-032-RCL等の伏字部分は本編には使わない。キャラにセリフは言わせない。
#
# 4コマ構成: 1=自動収容ユニット535/15、直接接触は研究目的のみ・面談は遠隔(起)、
# 2=着色シリコンの外殻に液状精製油の中身、30歳近い女性の外見(承)、
# 3=人類と無関係な近傍の生物のエネルギー利用能力を必ず不可逆に損なう(転)、
# 4=スロバキアのサイト玄関先に座っており「保管されるため」と主張(結)。

