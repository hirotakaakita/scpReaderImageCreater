characters: [attending-researcher-m, attending-researcher-f]

panels:
  - scene: >
      Wide shot, full body, eye level, showing a massive rail-mounted
      howitzer cannon stretching almost the length of the frame, its
      barrel absurdly oversized, dwarfing everything nearby, sitting on
      heavy-duty rail tracks in an industrial yard. attending-researcher-m
      stands at its base, tiny by comparison, clipboard in hand.
    characters: [attending-researcher-m]
    caption:
      ja: "SCP-044は、第二次世界大戦末期に密かに製造された榴弾砲である。その大きさ（251,000kg）だけでなく、砲口に収まる物体や物体の山であれば何であれ弾薬として装填できる点でも独特である。"
      en: "SCP-044 is a howitzer, secretly manufactured in the late stages of the Second World War. It is unique not only for its size (251,000 kg) but also because any object or pile of objects that fits may be loaded into its muzzle to be used as ammunition."
      cs: "SCP-044 je houfnice, tajně vyrobená v pozdějších fázích druhé světové války. Je jedinečná nejen svou velikostí (251 000 kg), ale také tím, že do jejího ústí lze jako munici naložit jakýkoli předmět nebo hromadu předmětů, které se do něj vejdou."
      de: "SCP-044 ist eine Haubitze, die heimlich in den späten Phasen des Zweiten Weltkriegs hergestellt wurde. Sie ist nicht nur wegen ihrer Größe (251.000 kg) einzigartig, sondern auch, weil jedes Objekt oder jeder Objekthaufen, der hineinpasst, in ihre Mündung geladen und als Munition verwendet werden kann."
      es: "SCP-044 es un obús fabricado en secreto durante las últimas etapas de la Segunda Guerra Mundial. Es único no solo por su tamaño (251,000 kg), sino también porque cualquier objeto o montón de objetos que quepa puede cargarse en su boca de fuego para usarse como munición."
      fr: "Le SCP-044 est un obusier fabriqué secrètement dans les dernières phases de la Seconde Guerre mondiale. Il est unique non seulement par sa taille (251 000 kg), mais aussi parce que tout objet ou amas d'objets qui y tient peut être chargé dans sa gueule pour servir de munition."
      it: "SCP-044 è un obice, fabbricato segretamente nelle fasi finali della Seconda Guerra Mondiale. È unico non solo per le sue dimensioni (251.000 kg) ma anche perché qualsiasi oggetto o cumulo di oggetti che vi entri può essere caricato nella sua bocca da fuoco e usato come munizione."
      ko: "SCP-044는 제2차 세계대전 말기에 비밀리에 제작된 곡사포이다. 그 크기(251,000kg)뿐만 아니라, 포구에 들어갈 수 있는 물체나 물체 더미라면 무엇이든 탄약으로 장전할 수 있다는 점에서도 독특하다."
      pl: "SCP-044 to haubica, potajemnie wyprodukowana w późnych etapach II wojny światowej. Jest wyjątkowa nie tylko ze względu na swój rozmiar (251 000 kg), ale też dlatego, że do jej lufy można załadować jako amunicję dowolny przedmiot lub stos przedmiotów, który się w niej zmieści."
      pt: "O SCP-044 é um obus, fabricado secretamente nos estágios finais da Segunda Guerra Mundial. É único não apenas por seu tamanho (251.000 kg), mas também porque qualquer objeto ou pilha de objetos que caiba pode ser carregado em sua boca para ser usado como munição."
      th: "SCP-044 คือปืนใหญ่ฮาวอิตเซอร์ที่ผลิตขึ้นอย่างลับๆ ในช่วงปลายสงครามโลกครั้งที่สอง มันมีเอกลักษณ์ไม่เพียงแต่ในด้านขนาด (251,000 กก.) แต่ยังรวมถึงการที่วัตถุหรือกองวัตถุใดๆ ที่พอดีกับปากกระบอกสามารถบรรจุเป็นกระสุนได้"
      uk: "SCP-044 — це гаубиця, таємно виготовлена на пізніх етапах Другої світової війни. Вона унікальна не лише завдяки своєму розміру (251 000 кг), а й тому, що будь-який предмет чи купа предметів, які поміщаються, можуть бути завантажені в її дуло і використані як боєприпаси."
      vi: "SCP-044 là một khẩu lựu pháo, được sản xuất bí mật vào giai đoạn cuối của Thế Chiến II. Nó độc đáo không chỉ vì kích thước (251.000 kg) mà còn vì bất kỳ vật thể hoặc đống vật thể nào vừa với nòng súng đều có thể được nạp vào để làm đạn dược."
      zh: "SCP-044是一门榴弹炮，在第二次世界大战末期秘密制造。它的独特之处不仅在于其体积（251,000公斤），还在于任何能塞进炮口的物体或物体堆都可以被装填作为弹药。"
      zh_Hant: "SCP-044是一門榴彈砲，在第二次世界大戰末期秘密製造。它的獨特之處不僅在於其體積（251,000公斤），還在於任何能塞進砲口的物體或物體堆都可以被裝填作為彈藥。"

  - scene: >
      Wide shot, full body, eye level, pulled back further to show two
      freight locomotives coupled to the cannon's rail carriage, a
      different framing from the base-level shot before, straining as
      they slowly tow the massive weapon down the tracks, steam and
      exhaust billowing. attending-researcher-f stands well off to the
      side watching it rumble past.
    characters: [attending-researcher-f]
    caption:
      ja: "その大きさゆえに、SCP-044は常に鉄道台車に搭載された状態を維持する必要があり、移動には貨物機関車2両を要する。"
      en: "Because of its size, SCP-044 must remain rail-mounted and requires two freight locomotives to move."
      cs: "Kvůli své velikosti musí SCP-044 zůstat namontováno na kolejích a k jeho přesunu jsou zapotřebí dvě nákladní lokomotivy."
      de: "Aufgrund seiner Größe muss SCP-044 auf Schienen montiert bleiben und benötigt zwei Güterzuglokomotiven, um es zu bewegen."
      es: "Debido a su tamaño, SCP-044 debe permanecer montado sobre raíles y requiere dos locomotoras de carga para moverse."
      fr: "En raison de sa taille, le SCP-044 doit rester monté sur rails et nécessite deux locomotives de fret pour être déplacé."
      it: "A causa delle sue dimensioni, SCP-044 deve rimanere montato su rotaie e richiede due locomotive merci per essere spostato."
      ko: "그 크기 때문에 SCP-044는 항상 철도에 장착된 상태를 유지해야 하며, 이동에는 화물 기관차 2대가 필요하다."
      pl: "Z powodu swoich rozmiarów SCP-044 musi pozostawać zamontowane na torach kolejowych i wymaga dwóch lokomotyw towarowych do przemieszczenia."
      pt: "Devido ao seu tamanho, o SCP-044 deve permanecer montado sobre trilhos e requer duas locomotivas de carga para ser movido."
      th: "เนื่องจากขนาดของมัน SCP-044 ต้องคงอยู่บนรางรถไฟตลอดเวลา และต้องใช้หัวรถจักรบรรทุกสินค้าสองหัวในการเคลื่อนย้าย"
      uk: "Через свій розмір SCP-044 має залишатися встановленим на рейках і потребує двох вантажних локомотивів для переміщення."
      vi: "Do kích thước của nó, SCP-044 phải luôn được gắn trên đường ray và cần hai đầu máy xe lửa hàng hóa để di chuyển."
      zh: "由于体积庞大，SCP-044必须始终安装在铁轨上，移动时需要两台货运机车牵引。"
      zh_Hant: "由於體積龐大，SCP-044必須始終安裝在鐵軌上，移動時需要兩台貨運機車牽引。"

  - scene: >
      Close-up, filling most of the frame, a different framing from the
      wide shots before, on the cannon's massive open muzzle now fitted
      with a wide protective covering, a couple of small birds perched
      curiously nearby pecking at it. attending-researcher-m checks the
      covering's fastenings with a wrench.
    characters: [attending-researcher-m]
    caption:
      ja: "SCP-044の大きく開いた砲身を鳥や小動物が探ろうとするのを防ぐため、砲口カバーは常時装着しておくこと。"
      en: "Muzzle coverings are to be fitted at all times to keep birds and small animals from investigating the large open barrel of SCP-044."
      cs: "Krytky ústí musí být nasazeny neustále, aby se zabránilo ptákům a malým zvířatům prozkoumávat velkou otevřenou hlaveň SCP-044."
      de: "Mündungsabdeckungen sind jederzeit anzubringen, um zu verhindern, dass Vögel und kleine Tiere den großen offenen Lauf von SCP-044 untersuchen."
      es: "Las cubiertas de la boca de fuego deben estar colocadas en todo momento para evitar que aves y pequeños animales investiguen el gran cañón abierto de SCP-044."
      fr: "Des protections de gueule doivent être installées en permanence pour empêcher les oiseaux et les petits animaux d'explorer le grand canon ouvert du SCP-044."
      it: "Le coperture della bocca da fuoco devono essere applicate in ogni momento per impedire a uccelli e piccoli animali di ispezionare la grande canna aperta di SCP-044."
      ko: "새와 소형 동물이 SCP-044의 크게 열린 포신을 탐색하지 못하도록 포구 덮개를 항상 장착해야 한다."
      pl: "Osłony lufy muszą być zawsze zamontowane, aby zapobiec badaniu dużej otwartej lufy SCP-044 przez ptaki i małe zwierzęta."
      pt: "As coberturas da boca devem ser instaladas o tempo todo para impedir que pássaros e pequenos animais investiguem o grande cano aberto do SCP-044."
      th: "ต้องติดตั้งฝาปิดปากกระบอกตลอดเวลาเพื่อป้องกันไม่ให้นกและสัตว์ตัวเล็กเข้าไปสำรวจลำกล้องขนาดใหญ่ที่เปิดอยู่ของ SCP-044"
      uk: "Кришки дула повинні бути встановлені постійно, щоб птахи та дрібні тварини не досліджували великий відкритий ствол SCP-044."
      vi: "Nắp bịt miệng nòng phải luôn được lắp đặt để ngăn chim và động vật nhỏ khám phá nòng súng lớn đang mở của SCP-044."
      zh: "须始终为炮口安装遮盖物，以防止鸟类和小型动物探入SCP-044敞开的大炮膛。"
      zh_Hant: "須始終為砲口安裝遮蓋物，以防止鳥類和小型動物探入SCP-044敞開的大砲膛。"

  - scene: >
      Wide shot, full body, eye level, pulled back to show the whole
      firing range, a very different framing from the tight close-up
      before. On the left side of the frame, attending-researcher-f and
      attending-researcher-m stand behind a blast shield, ready. On the
      right side of the frame, an ordinary pickup truck is being lowered
      whole into the cannon's massive muzzle by a crane, comically small
      next to the barrel.
    characters: [attending-researcher-f, attending-researcher-m]
    caption:
      ja: "これまでに記録された最大の出力は、「管理官」の個人所有のディーゼルピックアップトラックをまるごとSCP-044の砲口に装填して発射した際に達成された。"
      en: "The greatest known yield was achieved when 'The Administrator's' personal diesel pickup truck was loaded in its entirety into the muzzle of SCP-044 and fired."
      cs: "Nejvyšší dosud zaznamenaný výnos byl dosažen, když byl do ústí SCP-044 naložen a odpálen celý osobní naftový pickup 'Administrátora'."
      de: "Die größte bekannte Sprengkraft wurde erzielt, als der persönliche Diesel-Pickup-Truck des 'Administrators' vollständig in die Mündung von SCP-044 geladen und abgefeuert wurde."
      es: "El mayor rendimiento conocido se logró cuando la camioneta diésel personal del 'Administrador' fue cargada por completo en la boca de fuego de SCP-044 y disparada."
      fr: "Le plus grand rendement connu a été obtenu lorsque la camionnette diesel personnelle de « l'Administrateur » a été chargée en entier dans la gueule du SCP-044 et tirée."
      it: "Il maggior rendimento conosciuto è stato raggiunto quando il pickup diesel personale dell''Amministratore' è stato caricato per intero nella bocca da fuoco di SCP-044 e sparato."
      ko: "지금까지 기록된 가장 큰 위력은 '관리자'의 개인 디젤 픽업트럭을 통째로 SCP-044의 포구에 장전하여 발사했을 때 달성되었다."
      pl: "Największy znany wynik osiągnięto, gdy osobista ciężarówka diesel 'Administratora' została w całości załadowana do lufy SCP-044 i wystrzelona."
      pt: "O maior rendimento conhecido foi alcançado quando a caminhonete a diesel pessoal do 'Administrador' foi carregada por completo na boca do SCP-044 e disparada."
      th: "ผลลัพธ์ที่ยิ่งใหญ่ที่สุดเท่าที่เคยบันทึกไว้เกิดขึ้นเมื่อรถกระบะดีเซลส่วนตัวของ 'ผู้บริหาร' ถูกบรรจุทั้งคันเข้าไปในปากกระบอกของ SCP-044 แล้วยิงออกไป"
      uk: "Найбільший відомий вихід енергії був досягнутий, коли особистий дизельний пікап 'Адміністратора' повністю завантажили в дуло SCP-044 і вистрілили."
      vi: "Sản lượng lớn nhất từng được ghi nhận đạt được khi chiếc xe bán tải diesel cá nhân của 'Người Quản Trị' được nạp toàn bộ vào nòng SCP-044 và bắn ra."
      zh: "已知最大的爆炸当量是在将「管理员」的个人柴油皮卡整车装入SCP-044炮口并发射时达成的。"
      zh_Hant: "已知最大的爆炸當量是在將「管理員」的個人柴油皮卡整車裝入SCP-044砲口並發射時達成的。"

addendum:
  ja: "補遺：「『重大な事案』の定義を本当に述べる必要があるのかね？収容手順が守られている限り、044はどの大型砲とも変わらない危険性しか持たないようだ。いや、あの熊の一件はカウントしない」——O5-██"
  en: "Addendum: 'Must I really define \"significant incidents\"? If containment procedures are followed, 44 appears no more dangerous than any other big gun. No, the Bear Incident does not count.' — O5-██"
  cs: "Dodatek: „Musím opravdu definovat ‚významné incidenty‘? Pokud jsou dodržovány kontejnmentové postupy, 44 se nezdá být nebezpečnější než jakékoli jiné velké dělo. Ne, incident s medvědem se nepočítá.“ — O5-██"
  de: "Anhang: „Muss ich wirklich ‚bedeutende Vorfälle‘ definieren? Wenn die Containment-Verfahren befolgt werden, scheint 44 nicht gefährlicher zu sein als jede andere große Kanone. Nein, der Bären-Zwischenfall zählt nicht.“ — O5-██"
  es: "Adenda: «¿De verdad tengo que definir 'incidentes significativos'? Si se siguen los procedimientos de contención, el 44 no parece más peligroso que cualquier otro cañón grande. No, el Incidente del Oso no cuenta». — O5-██"
  fr: "Addendum : « Dois-je vraiment définir les « incidents significatifs » ? Si les procédures de confinement sont suivies, le 44 ne semble pas plus dangereux qu'un autre gros canon. Non, l'Incident de l'Ours ne compte pas. » — O5-██"
  it: "Addendum: 'Devo davvero definire gli \"incidenti significativi\"? Se si seguono le procedure di contenimento, il 44 non sembra più pericoloso di qualsiasi altro grosso cannone. No, l'Incidente dell'Orso non conta.' — O5-██"
  ko: "부록: \"'중대한 사건'을 정말 정의해야 하나? 수용 절차를 따른다면 044는 다른 대형 화포보다 더 위험해 보이지 않는다. 아니, 곰 사건은 포함하지 않는다.\" — O5-██"
  pl: "Aneks: „Czy naprawdę muszę definiować 'poważne incydenty'? Jeśli przestrzegane są procedury kontenerowe, 44 wydaje się nie bardziej niebezpieczne niż jakiekolwiek inne duże działo. Nie, Incydent z Niedźwiedziem się nie liczy”. — O5-██"
  pt: "Adendo: 'Preciso mesmo definir \"incidentes significativos\"? Se os procedimentos de contenção forem seguidos, o 44 não parece mais perigoso que qualquer outro canhão grande. Não, o Incidente do Urso não conta.' — O5-██"
  th: "ภาคผนวก: \"ผมต้องนิยามคำว่า 'เหตุการณ์สำคัญ' จริงๆ หรือ? หากปฏิบัติตามขั้นตอนการกักกัน 44 ดูเหมือนจะไม่อันตรายไปกว่าปืนใหญ่กระบอกอื่นๆ ไม่นะ เหตุการณ์หมีไม่นับรวม\" — O5-██"
  uk: "Додаток: «Невже мені справді потрібно визначати 'значні інциденти'? Якщо дотримуватися процедур утримання, 44 виглядає не небезпечнішим за будь-яку іншу велику гармату. Ні, Інцидент з ведмедем не рахується». — O5-██"
  vi: "Phụ lục: \"Tôi có thực sự phải định nghĩa 'sự cố đáng kể' không? Nếu tuân thủ quy trình chứa giữ, khẩu 44 có vẻ không nguy hiểm hơn bất kỳ khẩu pháo lớn nào khác. Không, Sự Cố Con Gấu không được tính.\" — O5-██"
  zh: "补遗：「我真的有必要定义『重大事件』吗？只要遵守收容规程，044似乎并不比其他任何大型火炮更危险。不，那次熊事件不算。」——O5-██"
  zh_Hant: "補遺：「我真的有必要定義『重大事件』嗎？只要遵守收容規程，044似乎並不比其他任何大型火砲更危險。不，那次熊事件不算。」——O5-██"
