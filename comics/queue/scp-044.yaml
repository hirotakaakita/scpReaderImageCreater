# SCP-044 4コマ台本
# captionはSpecial Containment Procedures / Description本文からの引用。
# 「砲身内探索中の機材・職員の喪失」への言及はグロ回避のため本編に含めない。
# O5のメモ（クマ事件のジョーク）のみaddendumの一言として使用。キャラにセリフ
# は言わせない。JP公式訳が直接取得できなかったため、検証済みの英語本文からの
# 翻訳（ja含む）。

