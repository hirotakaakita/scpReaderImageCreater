  - scene: >
      Rows of sealed human replication pods in an enormous chamber, with technicians monitoring blank panels and no readable text.
    characters: [scp-2000, attending-researcher-m]
    source:
      section: Description
      quote: "SCP-2000 includes 500,000 Bright/Zartion Hominid Replicators. At peak capacity, SCP-2000 is capable of producing 100,000 viable, non-anomalous humans per day"
      url: "https://scp-wiki.wikidot.com/scp-2000"
      fetched_at: "2026-09-21T00:00:00Z"
    caption:
      ja: "中核設備には50万基の人類複製装置があり、最大稼働時には1日10万人の非異常人類を生成できます。"
      en: "Its core system contains 500,000 human replicators, capable at peak output of producing 100,000 viable non-anomalous humans per day."
