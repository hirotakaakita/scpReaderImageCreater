  - scene: >
      Final explanatory scene: memory archives, genome storage, and newly awakened personnel silhouettes in a controlled chamber suggest civilization being restarted from stored data. No text.
    characters: [scp-2000]
    source:
      section: Description
      quote: "this system is capable of recreating any lost human genome or generating as many new and unique genomes as necessary to repopulate human civilization... SCP-2000 may be activated and Procedure Lazarus-01 can be initiated by as few as one surviving human."
      url: "https://scp-wiki.wikidot.com/scp-2000"
      fetched_at: "2026-09-21T00:00:00Z"
    caption:
      ja: "保存されたゲノムと記憶記録により、SCP-2000はわずか一人の生存者からでも人類文明の再起動を開始できます。"
      en: "With stored genomes and memory records, SCP-2000 can begin restoring human civilization even from as few as one survivor."
