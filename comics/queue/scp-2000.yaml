      A vast subterranean Foundation installation with industrial tunnels, reactor halls,
      hydroponic wings, human replication chambers, and deep underground infrastructure.
    default_look: >
      Silent, immense, functional, built to restart civilization after catastrophe.
panels:
  - scene: >
      Cutaway view beneath Yellowstone: a disguised surface entrance leads down into a huge hidden Foundation installation deep underground. No readable text.
    characters: [scp-2000]
    source:
      section: Description
      quote: "SCP-2000 is a subterranean Foundation installation originally constructed sometime in the last ███ years for the purpose of reconstructing civilization in the event that a K-Class end-of-the-world scenario could not be averted"
      url: "https://scp-wiki.wikidot.com/scp-2000"
      fetched_at: "2026-09-21T00:00:00Z"
    caption: &c1
      ja: "SCP-2000は、Kクラス世界終末シナリオで人類文明を再建するために造られた地下財団施設です。"
