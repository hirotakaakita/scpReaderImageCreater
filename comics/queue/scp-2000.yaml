  - scene: >
      Deep facility interior: reactor equipment, water treatment, air recycling, hydroponic growing towers and dense support infrastructure inside a sealed underground base. No text.
    characters: [scp-2000]
    source:
      section: Description
      quote: "Primary power for the facility is a Liquid Fluoride Thorium Reactor rated for 1 GW total output... SCP-2000 also contains water treatment facilities, air purification and recycling systems, hydroponic production wings, and housing necessary to permanently sustain up to 10,000 personnel."
      url: "https://scp-wiki.wikidot.com/scp-2000"
      fetched_at: "2026-09-21T00:00:00Z"
    caption:
      ja: "施設には1ギガワット級の原子炉、水処理、空気再生、農業区画、最大1万人を維持する住居が備わっています。"
      en: "The facility includes reactor power, water treatment, air recycling, hydroponics, and housing to sustain up to ten thousand personnel."
