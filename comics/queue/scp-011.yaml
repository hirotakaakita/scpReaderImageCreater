# SCP-011 4コマ台本
# captionはSpecial Containment Procedures / Description本文からの引用。
# Document #011-1のタイムライン（人語を話す、恋愛感情等）は本編に混ぜない。
# 鳥への発砲は命中させず威嚇のみに留め、グロ回避した。キャラにセリフは
# 言わせない。JP公式訳が直接取得できなかったため、検証済みの英語本文からの
# 翻訳（ja含む）。

