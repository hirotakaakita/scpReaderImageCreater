# SCP-529「ハーフキャットのジョジー」4コマ台本
# キャラにセリフは言わせない。captionは記事本文からの引用。

id: scp-529

title:
  en: "SCP-529: Josie the Half-Cat"
  ja: "SCP-529：ハーフキャットのジョジー"
  cs: "SCP-529: Polovina kočky Josie"
  de: "SCP-529: Josie, die Halbkatze"
  es: "SCP-529: Josie, la Media Gata"
  fr: "SCP-529 : Josie la Demi-Chatte"
  it: "SCP-529: Josie, la Mezza Gatta"
  ko: "SCP-529: 반쪽 고양이 조시"
  pl: "SCP-529: Josie, Pół-Kotka"
  pt: "SCP-529: Josie, a Meia-Gata"
  th: "SCP-529: โจซี่ แมวครึ่งตัว"
  uk: "SCP-529: Джосі, Кішка Наполовину"
  vi: "SCP-529: Josie Con Mèo Nửa Thân"
  zh: "SCP-529：半只猫乔西"
  zh_Hant: "SCP-529：半隻貓喬西"

attribution:
  article: "SCP-529"
  source_url: "http://scp-wiki.wikidot.com/scp-529"
  license: "CC BY-SA 3.0"

object_class: Safe

characters: [researcher-hana]

panels:
  - scene: >
      Wide shot, full body, eye level, showing the whole quiet facility
      hallway. Dr. Hana crouches down to pet a small grey tabby cat whose
      body ends abruptly in a flat black cross-section just behind the
      ribcage, as if neatly sliced away, yet the cat sits and balances
      completely normally.
    characters: [researcher-hana]
    caption:
      ja: "SCP-529は灰色の縞模様を持つ小型の家猫である。肋骨の後方にあたる部分が欠損しているように見える。"
      en: "SCP-529 is a small house cat with grey tabby markings. Parts of the animal to the rear of the ribcage appear to be missing."
      cs: "SCP-529 je malá domácí kočka se šedým mourovatým vzorem. Zdá se, že části zvířete za žebry chybí."
      de: "SCP-529 ist eine kleine Hauskatze mit grauer Tigerung. Teile des Tieres hinter dem Brustkorb scheinen zu fehlen."
      es: "SCP-529 es un pequeño gato doméstico con manchas atigradas grises. Partes del animal detrás de la caja torácica parecen faltar."
      fr: "SCP-529 est un petit chat domestique au pelage tigré gris. Des parties de l'animal situées à l'arrière de la cage thoracique semblent manquantes."
      it: "SCP-529 è un piccolo gatto domestico con macchie tigrate grigie. Parti dell'animale dietro la gabbia toracica sembrano mancanti."
      ko: "SCP-529는 회색 줄무늬를 가진 작은 집고양이이다. 갈비뼈 뒤쪽에 해당하는 신체 부위가 없는 것으로 보인다."
      pl: "SCP-529 to mały kot domowy w szare prążki. Części zwierzęcia znajdujące się za klatką piersiową wydają się nieobecne."
      pt: "SCP-529 é um pequeno gato doméstico com pelagem tigrada cinza. Partes do animal atrás da caixa torácica parecem estar ausentes."
      th: "SCP-529 คือแมวบ้านตัวเล็กลายเสือสีเทา ส่วนที่อยู่ด้านหลังซี่โครงของมันดูเหมือนจะหายไป"
      uk: "SCP-529 — маленький домашній кіт із сірим смугастим забарвленням. Частини тіла тварини позаду грудної клітки, схоже, відсутні."
      vi: "SCP-529 là một con mèo nhà nhỏ với đốm vằn xám. Các phần của con vật phía sau lồng ngực có vẻ như đã biến mất."
      zh: "SCP-529是一只带有灰色虎斑纹的小型家猫。它肋骨后方的部分身体似乎缺失了。"
      zh_Hant: "SCP-529是一隻帶有灰色虎斑紋的小型家貓。牠肋骨後方的部分身體似乎缺失了。"

  - scene: >
      Extreme close-up shot on the half-cat's face, filling almost the
      entire frame: ears perked and mouth open wide in an insistent meow,
      eyes fixed pointedly toward a cheese sandwich sticking out of a
      lunch bag blurred in the background. Dr. Hana's startled face is a
      small sliver at the very edge of the frame.
    characters: [researcher-hana]
    caption:
      ja: "本個体に健康上の問題は無く、後半身がまだ存在するかのように振る舞う。"
      en: "The animal has no health problems, and moves about as if its hindquarters were still in place."
      cs: "Zvíře nemá žádné zdravotní problémy a pohybuje se, jako by mělo zadní část těla stále na místě."
      de: "Das Tier hat keinerlei gesundheitliche Probleme und bewegt sich, als wäre sein Hinterteil noch vorhanden."
      es: "El animal no presenta problemas de salud y se desplaza como si su parte trasera aún estuviera en su lugar."
      fr: "L'animal ne présente aucun problème de santé et se déplace comme si son arrière-train était encore en place."
      it: "L'animale non presenta problemi di salute e si muove come se il suo posteriore fosse ancora al suo posto."
      ko: "본 동물은 건강상의 문제가 전혀 없으며, 마치 뒷몸이 그대로 있는 것처럼 움직인다."
      pl: "Zwierzę nie ma żadnych problemów zdrowotnych i porusza się tak, jakby jego tylna część ciała wciąż była na miejscu."
      pt: "O animal não apresenta problemas de saúde e se move como se sua traseira ainda estivesse em seu lugar."
      th: "สัตว์ตัวนี้ไม่มีปัญหาสุขภาพใดๆ และเคลื่อนไหวราวกับว่าส่วนหลังของมันยังคงอยู่"
      uk: "Тварина не має жодних проблем зі здоров'ям і рухається так, ніби її задня частина тіла все ще на місці."
      vi: "Con vật không có vấn đề sức khỏe nào và di chuyển như thể phần thân sau của nó vẫn còn nguyên vẹn."
      zh: "该动物没有任何健康问题，行动起来就像它的后半身仍然存在一样。"
      zh_Hant: "該動物沒有任何健康問題，行動起來就像牠的後半身仍然存在一樣。"

  - scene: >
      Medium shot, waist-up, high angle looking down over Dr. Hana's
      shoulder toward the cat below. She kneels with a slightly nervous
      expression, carefully holding out a small slice of cheese between
      two fingers toward the half-cat.
    characters: [researcher-hana]
    caption:
      ja: "『ジョジー』には定期的にチーズを与える必要があり、不足すると強い苦痛を示す。"
      en: "'Josie' must be provided with cheese regularly; she becomes distressed if not given sufficient cheese."
      cs: "„Josie“ musí být pravidelně krmena sýrem; pokud jí není podáno dostatečné množství sýra, projevuje rozrušení."
      de: "„Josie“ muss regelmäßig mit Käse versorgt werden; ohne ausreichend Käse zeigt sie Anzeichen von Unruhe."
      es: "A «Josie» se le debe suministrar queso regularmente; se angustia si no recibe suficiente queso."
      fr: "« Josie » doit recevoir du fromage régulièrement ; elle devient anxieuse si elle n'en reçoit pas assez."
      it: "A \"Josie\" va fornito regolarmente del formaggio; manifesta disagio se non ne riceve a sufficienza."
      ko: "'조시'에게는 정기적으로 치즈를 제공해야 하며, 충분히 주지 않으면 불안 증세를 보인다."
      pl: "„Josie” należy regularnie podawać ser; wykazuje niepokój, jeśli nie dostaje go wystarczająco dużo."
      pt: "\"Josie\" deve receber queijo regularmente; ela fica angustiada se não receber queijo suficiente."
      th: "'โจซี่' ต้องได้รับชีสเป็นประจำ มิฉะนั้นเธอจะแสดงอาการทุกข์ทรมานหากได้รับไม่เพียงพอ"
      uk: "«Джосі» потрібно регулярно давати сир; вона стає знервованою, якщо не отримує його достатньо."
      vi: "\"Josie\" phải được cung cấp phô mai thường xuyên; nó sẽ trở nên đau khổ nếu không được ăn đủ phô mai."
      zh: "必须定期为『乔西』提供芝士；如果给的芝士不够，它会表现出明显的不安。"
      zh_Hant: "必須定期為『喬西』提供起司；如果給的起司不夠，牠會表現出明顯的不安。"

  - scene: >
      Wide shot, full body, eye level, pulled back to show the whole
      hallway. Dr. Hana sits sprawled on the floor, leaning back on her
      hands with visible relief, while the half-cat happily nibbles the
      cheese in front of her, tail curled contentedly, purring loudly.
    characters: [researcher-hana]
    caption:
      ja: "『ジョジー』は非常に人懐こく、現段階では施設下層階を自由に移動することが許可されている。"
      en: "'Josie' is quite affectionate, and is free to move about the lower levels of the facility."
      cs: "„Josie“ je velmi přítulná a smí se volně pohybovat po nižších patrech zařízení."
      de: "„Josie“ ist sehr anhänglich und darf sich frei in den unteren Ebenen der Einrichtung bewegen."
      es: "«Josie» es muy cariñosa y tiene libertad para moverse por los niveles inferiores de las instalaciones."
      fr: "« Josie » est très affectueuse et peut se déplacer librement dans les niveaux inférieurs de l'installation."
      it: "\"Josie\" è molto affettuosa ed è libera di muoversi nei livelli inferiori della struttura."
      ko: "'조시'는 매우 다정하며, 현재 시설 하층부를 자유롭게 이동하는 것이 허용되어 있다."
      pl: "„Josie” jest bardzo przyjacielska i może swobodnie poruszać się po niższych poziomach placówki."
      pt: "\"Josie\" é bastante afetuosa e tem liberdade para circular pelos níveis inferiores das instalações."
      th: "'โจซี่' เป็นแมวที่ขี้อ้อนมาก และได้รับอนุญาตให้เดินเล่นอย่างอิสระในชั้นล่างของสถานที่"
      uk: "«Джосі» дуже прив'язлива і може вільно пересуватися нижніми поверхами об'єкта."
      vi: "\"Josie\" rất quấn quýt và được tự do di chuyển ở các tầng dưới của cơ sở."
      zh: "『乔西』非常亲人，目前被允许在设施下层自由活动。"
      zh_Hant: "『喬西』非常親人，目前被允許在設施下層自由活動。"

addendum:
  ja: "補遺529-1：本オブジェクトへのチーズの供給停止は明確に禁止されている。"
  en: "Addendum 529-1: Withholding cheese from this object is explicitly prohibited."
  cs: "Dodatek 529-1: Odepření sýra tomuto objektu je výslovně zakázáno."
  de: "Anhang 529-1: Dem Objekt Käse vorzuenthalten ist ausdrücklich untersagt."
  es: "Adenda 529-1: Negar queso a este objeto está expresamente prohibido."
  fr: "Addendum 529-1 : Priver cet objet de fromage est explicitement interdit."
  it: "Addendum 529-1: Negare il formaggio a questo oggetto è espressamente vietato."
  ko: "부록 529-1: 본 오브젝트에게 치즈 급여를 중단하는 행위는 명백히 금지된다."
  pl: "Aneks 529-1: Wstrzymywanie sera temu obiektowi jest wyraźnie zabronione."
  pt: "Adendo 529-1: Negar queijo a este objeto é expressamente proibido."
  th: "ภาคผนวก 529-1: ห้ามงดให้ชีสแก่วัตถุนี้โดยเด็ดขาด"
  uk: "Додаток 529-1: Позбавляти цей об'єкт сиру категорично заборонено."
  vi: "Phụ lục 529-1: Nghiêm cấm việc không cho vật thể này ăn phô mai."
  zh: "补遗529-1：明确禁止停止向该对象提供芝士。"
  zh_Hant: "補遺529-1：明確禁止停止向該對象提供起司。"
