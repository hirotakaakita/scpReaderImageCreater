panels:
  - scene: >
      Medium shot, waist-up, eye level, a bare detention cell. d-class
      stands shirtless, an elaborate serpentine dragon tattoo in
      oriental style coiling across his torso and shoulder, its posture
      caught mid-motion as if actively slithering across his skin,
      clearly not a static image.
    characters: [d-class]
    caption:
      ja: "SCP-021は、皮膚の約0.8平方メートルを覆う、東洋風の蛇のような龍の精巧な入れ墨の姿をしている。この入れ墨は宿主の皮膚の中で完全に生きて動いており、二次元に限られてはいるものの、概ね普通の動物のように振る舞う。"
      en: "SCP-021 takes the form of a large and elaborate tattoo of a serpentine dragon, covering approximately 0.8 square meters of skin. This tattoo is fully animate within the confines of its host's skin and behaves largely as a normal animal would, albeit in only two dimensions."
      cs: "SCP-021 má podobu velkého a propracovaného tetování hadovitého draka v orientálním stylu, pokrývajícího přibližně 0,8 metru čtverečního kůže. Toto tetování je v rámci kůže svého hostitele plně živé a chová se převážně jako normální zvíře, i když pouze ve dvou rozměrech."
      de: "SCP-021 hat die Form eines großen und aufwendigen Tattoos eines schlangenartigen Drachen im orientalischen Stil, das etwa 0,8 Quadratmeter Haut bedeckt. Dieses Tattoo ist innerhalb der Haut seines Wirts vollständig lebendig und verhält sich weitgehend wie ein normales Tier, wenngleich nur in zwei Dimensionen."
      es: "SCP-021 tiene la forma de un tatuaje grande y elaborado de un dragón serpentino de estilo oriental, que cubre aproximadamente 0,8 metros cuadrados de piel. Este tatuaje está completamente animado dentro de los confines de la piel de su huésped y se comporta en gran medida como lo haría un animal normal, aunque solo en dos dimensiones."
      fr: "Le SCP-021 prend la forme d'un tatouage grand et élaboré d'un dragon serpentin de style oriental, couvrant environ 0,8 mètre carré de peau. Ce tatouage est entièrement animé dans les limites de la peau de son hôte et se comporte largement comme le ferait un animal normal, bien que seulement en deux dimensions."
      it: "SCP-021 assume la forma di un tatuaggio grande ed elaborato di un drago serpentino in stile orientale, che copre circa 0,8 metri quadrati di pelle. Questo tatuaggio è completamente animato entro i confini della pelle del suo ospite e si comporta in gran parte come farebbe un animale normale, sebbene solo in due dimensioni."
      ko: "SCP-021은 피부 약 0.8평방미터를 뒤덮는, 동양풍의 뱀 같은 용 모양의 정교한 문신 형태를 취한다. 이 문신은 숙주의 피부 안에서 완전히 살아 움직이며, 2차원에 국한되어 있긴 하지만 대체로 일반 동물처럼 행동한다."
      pl: "SCP-021 przybiera postać dużego i wyszukanego tatuażu przedstawiającego wężowego smoka w orientalnym stylu, pokrywającego około 0,8 metra kwadratowego skóry. Tatuaż ten jest w pełni żywy w obrębie skóry swojego gospodarza i zachowuje się w dużej mierze jak zwykłe zwierzę, choć tylko w dwóch wymiarach."
      pt: "O SCP-021 assume a forma de uma tatuagem grande e elaborada de um dragão serpentino em estilo oriental, cobrindo aproximadamente 0,8 metro quadrado de pele. Esta tatuagem é totalmente animada dentro dos limites da pele de seu hospedeiro e se comporta em grande parte como um animal normal, embora apenas em duas dimensões."
      th: "SCP-021 มีรูปร่างเป็นรอยสักมังกรลักษณะคล้ายงูสไตล์ตะวันออกที่วิจิตรบรรจงและมีขนาดใหญ่ ครอบคลุมผิวหนังประมาณ 0.8 ตารางเมตร รอยสักนี้มีชีวิตเต็มที่ภายในขอบเขตผิวหนังของโฮสต์ และมีพฤติกรรมคล้ายสัตว์ทั่วไป แม้จะอยู่ในสองมิติเท่านั้น"
      uk: "SCP-021 має вигляд великого та вигадливого татуювання змієподібного дракона у східному стилі, що вкриває приблизно 0,8 квадратного метра шкіри. Це татуювання повністю живе в межах шкіри свого носія і поводиться здебільшого як звичайна тварина, хоча й лише у двох вимірах."
      vi: "SCP-021 có hình dạng một hình xăm lớn và tinh xảo của một con rồng dạng rắn theo phong cách phương Đông, bao phủ khoảng 0,8 mét vuông da. Hình xăm này hoàn toàn sống động trong phạm vi làn da của vật chủ và hành xử phần lớn như một loài động vật bình thường, dù chỉ trong hai chiều."
      zh: "SCP-021呈现为一幅精美繁复的东方风格蛇形飞龙纹身，覆盖约0.8平方米的皮肤。这个纹身在宿主皮肤范围内完全是活的，其行为大致与普通动物无异，只不过被限制在二维之内。"
      zh_Hant: "SCP-021呈現為一幅精美繁複的東方風格蛇形飛龍紋身，覆蓋約0.8平方公尺的皮膚。這個紋身在宿主皮膚範圍內完全是活的，其行為大致與普通動物無異，只不過被限制在二維之內。"

  - scene: >
      Close-up, low angle, filling most of the frame, a different
      framing from the medium shot before, on d-class's forearm.
      attending-researcher-f quickly sketches a small tattoo of a banana
      onto his skin with a tattoo gun, while the dragon tattoo's head is
      already stretching across his chest toward the fresh ink, jaws
      open.
    characters: [d-class, attending-researcher-f]
    caption:
      ja: "SCP-021は宿主の皮膚にある色素のみを餌としているようで、他の入れ墨を著しく好む傾向がある。宿主に果物や小動物の絵をすばやく彫ることで、SCP-021に「餌を与える」ことができる。"
      en: "SCP-021 appears to feed exclusively on pigments in the host's skin, showing a marked preference for other tattoos. One may 'feed' SCP-021 by quickly tattooing fruits or small animals on the host."
      cs: "Zdá se, že SCP-021 se živí výhradně pigmenty v kůži hostitele a vykazuje výraznou preferenci pro jiná tetování. SCP-021 lze 'nakrmit' rychlým vytetováním ovoce nebo malých zvířat na hostitele."
      de: "SCP-021 scheint sich ausschließlich von Pigmenten in der Haut des Wirts zu ernähren und zeigt eine ausgeprägte Vorliebe für andere Tattoos. Man kann SCP-021 'füttern', indem man dem Wirt schnell Früchte oder kleine Tiere eintätowiert."
      es: "SCP-021 parece alimentarse exclusivamente de pigmentos en la piel del huésped, mostrando una marcada preferencia por otros tatuajes. Se puede 'alimentar' a SCP-021 tatuando rápidamente frutas o animales pequeños en el huésped."
      fr: "Le SCP-021 semble se nourrir exclusivement des pigments présents dans la peau de l'hôte, montrant une nette préférence pour les autres tatouages. On peut « nourrir » le SCP-021 en tatouant rapidement des fruits ou de petits animaux sur l'hôte."
      it: "SCP-021 sembra nutrirsi esclusivamente di pigmenti nella pelle dell'ospite, mostrando una netta preferenza per altri tatuaggi. Si può 'nutrire' SCP-021 tatuando rapidamente frutti o piccoli animali sull'ospite."
      ko: "SCP-021은 숙주의 피부에 있는 색소만을 먹이로 삼는 것으로 보이며, 다른 문신을 뚜렷이 선호한다. 숙주에게 과일이나 작은 동물을 재빨리 문신함으로써 SCP-021에게 '먹이'를 줄 수 있다."
      pl: "SCP-021 zdaje się żywić wyłącznie pigmentami w skórze gospodarza, wykazując wyraźną preferencję dla innych tatuaży. SCP-021 można 'nakarmić', szybko wytatuowując na gospodarzu owoce lub małe zwierzęta."
      pt: "O SCP-021 parece se alimentar exclusivamente de pigmentos na pele do hospedeiro, mostrando uma clara preferência por outras tatuagens. Pode-se 'alimentar' o SCP-021 tatuando rapidamente frutas ou pequenos animais no hospedeiro."
      th: "SCP-021 ดูเหมือนจะกินเฉพาะเม็ดสีในผิวหนังของโฮสต์ โดยแสดงความชอบอย่างชัดเจนต่อรอยสักอื่นๆ สามารถ 'ป้อนอาหาร' SCP-021 ได้โดยการสักภาพผลไม้หรือสัตว์ตัวเล็กลงบนโฮสต์อย่างรวดเร็ว"
      uk: "SCP-021, схоже, живиться виключно пігментами у шкірі носія, виявляючи виражену перевагу до інших татуювань. SCP-021 можна 'нагодувати', швидко нататуювавши на носії фрукти чи дрібних тварин."
      vi: "SCP-021 dường như chỉ ăn sắc tố trong da của vật chủ, thể hiện sự ưa thích rõ rệt đối với các hình xăm khác. Có thể 'cho ăn' SCP-021 bằng cách nhanh chóng xăm hình trái cây hoặc động vật nhỏ lên vật chủ."
      zh: "SCP-021似乎只以宿主皮肤中的色素为食，明显偏好其他纹身。可以通过在宿主身上快速纹上水果或小动物图案来给SCP-021「喂食」。"
      zh_Hant: "SCP-021似乎只以宿主皮膚中的色素為食，明顯偏好其他刺青。可以透過在宿主身上快速刺上水果或小動物圖案來給SCP-021「餵食」。"

  - scene: >
      Medium shot, waist-up, low angle, a different framing from the
      close-up before. d-class flexes both arms with a wide confident
      grin, the dragon tattoo coiled proudly across his chest, while
      attending-researcher-m stands nearby taking notes, eyebrows raised
      at the sudden burst of bravado.
    characters: [d-class, attending-researcher-m]
    caption:
      ja: "SCP-021は宿主にいくつかの恩恵をもたらす——アドレナリンの放出を促進し、乳酸の蓄積を減少させ、ストレスの多い状況において筋力、自信、痛みへの耐性を高める。"
      en: "SCP-021 does confer some benefits to its host — accelerating the release of epinephrine and decreasing lactic acid buildup, providing boosts of strength, confidence, and pain tolerance in stressful situations."
      cs: "SCP-021 poskytuje svému hostiteli i určité výhody – urychluje uvolňování adrenalinu a snižuje hromadění kyseliny mléčné, čímž ve stresových situacích poskytuje nárůst síly, sebedůvěry a tolerance k bolesti."
      de: "SCP-021 verschafft seinem Wirt tatsächlich gewisse Vorteile – es beschleunigt die Freisetzung von Adrenalin und verringert die Milchsäureansammlung, wodurch in Stresssituationen Kraft, Selbstvertrauen und Schmerztoleranz gesteigert werden."
      es: "SCP-021 sí confiere algunos beneficios a su huésped: acelera la liberación de epinefrina y disminuye la acumulación de ácido láctico, proporcionando aumentos de fuerza, confianza y tolerancia al dolor en situaciones estresantes."
      fr: "Le SCP-021 confère certains avantages à son hôte — accélérant la libération d'épinéphrine et diminuant l'accumulation d'acide lactique, procurant des gains de force, de confiance et de tolérance à la douleur dans les situations stressantes."
      it: "SCP-021 conferisce effettivamente alcuni benefici al proprio ospite — accelerando il rilascio di epinefrina e riducendo l'accumulo di acido lattico, fornendo aumenti di forza, sicurezza e tolleranza al dolore nelle situazioni di stress."
      ko: "SCP-021은 숙주에게 실제로 몇 가지 이점을 부여한다 — 에피네프린 분비를 촉진하고 젖산 축적을 줄여, 스트레스 상황에서 힘과 자신감, 통증 내성을 높여준다."
      pl: "SCP-021 rzeczywiście przynosi swojemu gospodarzowi pewne korzyści — przyspiesza uwalnianie epinefryny i zmniejsza gromadzenie się kwasu mlekowego, zapewniając wzrost siły, pewności siebie i tolerancji na ból w sytuacjach stresowych."
      pt: "O SCP-021 de fato confere alguns benefícios ao seu hospedeiro — acelerando a liberação de epinefrina e diminuindo o acúmulo de ácido lático, proporcionando aumentos de força, confiança e tolerância à dor em situações estressantes."
      th: "SCP-021 มอบประโยชน์บางอย่างแก่โฮสต์ — เร่งการปล่อยอะดรีนาลีนและลดการสะสมของกรดแลคติก ทำให้มีความแข็งแรง ความมั่นใจ และความทนทานต่อความเจ็บปวดเพิ่มขึ้นในสถานการณ์ตึงเครียด"
      uk: "SCP-021 дійсно надає своєму носію певні переваги — прискорює виділення адреналіну та зменшує накопичення молочної кислоти, забезпечуючи приріст сили, впевненості та стійкості до болю в стресових ситуаціях."
      vi: "SCP-021 thực sự mang lại một số lợi ích cho vật chủ — đẩy nhanh việc giải phóng epinephrine và giảm sự tích tụ axit lactic, tăng cường sức mạnh, sự tự tin, và khả năng chịu đau trong các tình huống căng thẳng."
      zh: "SCP-021确实会为宿主带来一些益处——加速肾上腺素的释放并减少乳酸堆积，在紧张状况下提升力量、自信心和痛觉耐受力。"
      zh_Hant: "SCP-021確實會為宿主帶來一些益處——加速腎上腺素的釋放並減少乳酸堆積，在緊張狀況下提升力量、自信心和痛覺耐受力。"

  - scene: >
      Wide shot, full body, eye level, pulled back to show a bare
      concrete cell block corridor, a very different framing from the
      tight medium shot before. On the left side of the frame, d-class
      stands in his cell doorway, the dragon tattoo visible on his
      shoulder, arms crossed with a smug, relieved expression. On the
      right side of the frame, a line of several other D-class personnel
      are marched away down the corridor by an escort, glancing back at
      him enviously.
    characters: [d-class]
    caption:
      ja: "SCP-021の宿主となる資格を持つのはD級職員のみである。ある被験者が宿主として生存し続ける限り、その者はD級職員の通常の月次処分を免除される。"
      en: "Only Class D personnel are eligible for hosting SCP-021. As long as a given subject survives as a host, he is exempt from normal monthly terminations of Class D personnel."
      cs: "Hostitelem SCP-021 se smí stát pouze personál třídy D. Dokud daný subjekt jako hostitel přežívá, je osvobozen od běžné měsíční likvidace personálu třídy D."
      de: "Nur Personal der Klasse D kommt als Wirt für SCP-021 infrage. Solange ein Subjekt als Wirt überlebt, ist es von den normalen monatlichen Terminierungen des Klasse-D-Personals ausgenommen."
      es: "Solo el personal de Clase D es elegible para albergar SCP-021. Mientras un sujeto dado sobreviva como huésped, queda exento de las terminaciones mensuales normales del personal de Clase D."
      fr: "Seul le personnel de Classe D est éligible pour héberger le SCP-021. Tant qu'un sujet donné survit en tant qu'hôte, il est exempté des neutralisations mensuelles normales du personnel de Classe D."
      it: "Solo il personale di Classe D è idoneo a ospitare SCP-021. Finché un dato soggetto sopravvive come ospite, è esentato dalle normali terminazioni mensili del personale di Classe D."
      ko: "SCP-021의 숙주가 될 자격은 D등급 요원에게만 있다. 특정 대상이 숙주로서 생존하는 한, 그는 D등급 요원의 정기 월간 처분에서 면제된다."
      pl: "Jedynie personel klasy D kwalifikuje się do bycia gospodarzem SCP-021. Dopóki dany osobnik przeżywa jako gospodarz, jest zwolniony ze zwykłych comiesięcznych likwidacji personelu klasy D."
      pt: "Apenas o pessoal de Classe D é elegível para hospedar o SCP-021. Enquanto um determinado sujeito sobreviver como hospedeiro, ele fica isento das terminações mensais normais do pessoal de Classe D."
      th: "เฉพาะเจ้าหน้าที่ระดับ D เท่านั้นที่มีสิทธิ์เป็นโฮสต์ของ SCP-021 ตราบใดที่ผู้ถูกทดสอบยังมีชีวิตอยู่ในฐานะโฮสต์ เขาจะได้รับการยกเว้นจากการกำจัดเจ้าหน้าที่ระดับ D ตามปกติรายเดือน"
      uk: "Лише персонал класу D має право бути носієм SCP-021. Поки цей суб'єкт залишається живим носієм, він звільняється від звичайної щомісячної ліквідації персоналу класу D."
      vi: "Chỉ có nhân viên Cấp D mới đủ điều kiện làm vật chủ cho SCP-021. Miễn là đối tượng đó còn sống với tư cách vật chủ, người đó được miễn trừ khỏi việc xử lý định kỳ hàng tháng đối với nhân viên Cấp D."
      zh: "只有D级人员有资格作为SCP-021的宿主。只要该对象作为宿主存活，他就可豁免D级人员的常规每月处决。"
      zh_Hant: "只有D級人員有資格作為SCP-021的宿主。只要該對象作為宿主存活，他就可豁免D級人員的常規每月處決。"
