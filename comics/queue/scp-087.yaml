object_class: Euclid

local_characters:
  scp-087-1:
    name: SCP-087-1
    description: >
      SCP-087-1, an eerie humanoid face suspended in darkness, pale
      grayish skin tone (color RGB 175,170,160), utterly smooth and blank
      where the eyes, nostrils, and mouth would be — no visible pupils,
      nostrils, or mouth at all, just smooth featureless skin, faintly
      lit from below.

characters: [attending-researcher-m, d-class]

panels:
  - scene: >
      Wide shot, full body, eye level, showing a whole plain campus
      hallway. On the left side of the frame, the attending researcher
      unlocks a plain door labeled as a janitorial closet, an electronic
      keypad and lock mechanism visible beside the handle. On the right
      side of the frame, a D-class subject waits nearby, holding a
      handheld light source.
    characters: [attending-researcher-m, d-class]
    caption:
      ja: "SCP-087の入口となる扉は強化鋼鉄製で、電磁式の解錠機構を備えている。建物の意匠に合わせ、用務員の物置に見えるよう偽装されている。"
      en: "The doorway leading to SCP-087 is constructed of reinforced steel with an electro-release lock mechanism. It has been disguised to resemble a janitorial closet consistent with the design of the building."
      cs: "Vstupní dveře k SCP-087 jsou vyrobeny ze zpevněné oceli s elektrickým odjišťovacím zámkem. Byly zamaskovány tak, aby vypadaly jako úklidová komora odpovídající vzhledu budovy."
      de: "Die zu SCP-087 führende Tür besteht aus verstärktem Stahl mit einem elektrischen Entriegelungsmechanismus. Sie wurde so getarnt, dass sie wie eine dem Gebäudedesign entsprechende Putzkammer wirkt."
      es: "La puerta que lleva a SCP-087 está construida en acero reforzado con un mecanismo de cerradura de liberación electrónica. Ha sido disfrazada para parecer un armario de conserjería acorde con el diseño del edificio."
      fr: "La porte menant à SCP-087 est construite en acier renforcé avec un mécanisme de verrouillage à déclenchement électrique. Elle a été déguisée pour ressembler à un placard d'entretien conforme au style du bâtiment."
      it: "La porta che conduce a SCP-087 è costruita in acciaio rinforzato con un meccanismo di sblocco elettrico. È stata camuffata per assomigliare a un ripostiglio del personale delle pulizie, coerente con il design dell'edificio."
      ko: "SCP-087로 이어지는 출입구는 강화 강철로 만들어졌으며 전자식 해제 잠금 장치를 갖추고 있다. 건물의 디자인에 맞춰 청소용구 보관실처럼 위장되어 있다."
      pl: "Drzwi prowadzące do SCP-087 są wykonane ze wzmocnionej stali z elektrycznym mechanizmem zwalniania zamka. Zostały zamaskowane tak, by przypominać schowek dozorcy zgodny z wystrojem budynku."
      pt: "A porta que leva ao SCP-087 é construída em aço reforçado com um mecanismo de trava de liberação eletrônica. Foi disfarçada para se parecer com um armário de zeladoria condizente com o design do prédio."
      th: "ประตูทางเข้า SCP-087 สร้างจากเหล็กเสริมแรงพร้อมกลไกล็อกแบบปลดล็อกด้วยไฟฟ้า มันถูกพรางให้ดูเหมือนตู้เก็บอุปกรณ์ทำความสะอาดที่เข้ากับการออกแบบของอาคาร"
      uk: "Двері, що ведуть до SCP-087, виготовлені з посиленої сталі з електричним механізмом розблокування замка. Їх замасковано під комору прибиральника, що відповідає дизайну будівлі."
      vi: "Cánh cửa dẫn đến SCP-087 được làm bằng thép gia cố với cơ chế khóa nhả bằng điện. Nó được ngụy trang giống như một tủ đồ của lao công phù hợp với thiết kế của tòa nhà."
      zh: "通往SCP-087的门由加固钢材制成，配有电子释放锁定装置。它被伪装成与建筑设计相符的清洁工储物间。"
      zh_Hant: "通往SCP-087的門由加固鋼材製成，配有電子釋放鎖定裝置。它被偽裝成與建築設計相符的清潔工儲物間。"

  - scene: >
      Medium shot, side view, low angle looking down into darkness. The
      D-class subject descends the first few steps of an unlit staircase,
      one hand on the railing, holding up a lamp whose light seems to fade
      and thin only a short distance ahead, swallowed by the dark. The
      stairs curve out of sight below.
    characters: [d-class]
    caption:
      ja: "SCP-087は照明のない、踊り場を持つ階段である。階段は38度の角度で13段下ると、直径およそ3mの半円形の踊り場に達する。75ワットを超える光源は効果がないことが判明しており、SCP-087は過剰な光を吸収しているように見える。"
      en: "SCP-087 is an unlit platform staircase. Stairs descend on a 38 degree angle for 13 steps before reaching a semicircular platform. Lighting sources brighter than 75 watts have shown to be ineffective, as SCP-087 seems to absorb excess light."
      cs: "SCP-087 je neosvětlené schodiště s podestami. Schody klesají pod úhlem 38 stupňů po dobu 13 schodů, než dosáhnou půlkruhové podesty. Ukázalo se, že světelné zdroje jasnější než 75 wattů jsou neúčinné, jelikož SCP-087 zřejmě pohlcuje přebytečné světlo."
      de: "SCP-087 ist ein unbeleuchtetes Podesttreppenhaus. Die Treppe fällt in einem Winkel von 38 Grad über 13 Stufen ab, bevor sie ein halbrundes Podest erreicht. Lichtquellen mit mehr als 75 Watt haben sich als wirkungslos erwiesen, da SCP-087 überschüssiges Licht zu absorbieren scheint."
      es: "SCP-087 es una escalera de plataforma sin iluminación. Los escalones descienden en un ángulo de 38 grados durante 13 peldaños antes de alcanzar una plataforma semicircular. Las fuentes de luz superiores a 75 vatios han demostrado ser ineficaces, ya que SCP-087 parece absorber el exceso de luz."
      fr: "SCP-087 est un escalier à paliers non éclairé. Les marches descendent selon un angle de 38 degrés sur 13 marches avant d'atteindre un palier semi-circulaire. Les sources lumineuses dépassant 75 watts se sont révélées inefficaces, SCP-087 semblant absorber l'excès de lumière."
      it: "SCP-087 è una scala a pianerottoli non illuminata. I gradini scendono con un angolo di 38 gradi per 13 scalini prima di raggiungere un pianerottolo semicircolare. Le fonti di luce superiori a 75 watt si sono rivelate inefficaci, poiché SCP-087 sembra assorbire la luce in eccesso."
      ko: "SCP-087은 조명이 없는 층계참 계단이다. 계단은 38도 각도로 13단을 내려가면 반원형 층계참에 도달한다. 75와트보다 밝은 광원은 효과가 없는 것으로 나타났으며, SCP-087은 과도한 빛을 흡수하는 것으로 보인다."
      pl: "SCP-087 to nieoświetlone schody z podestami. Stopnie opadają pod kątem 38 stopni przez 13 schodków, zanim osiągną półkolisty podest. Źródła światła jaśniejsze niż 75 watów okazały się nieskuteczne, ponieważ SCP-087 zdaje się pochłaniać nadmiar światła."
      pt: "O SCP-087 é uma escada de patamar sem iluminação. Os degraus descem em um ângulo de 38 graus por 13 degraus antes de alcançar um patamar semicircular. Fontes de luz acima de 75 watts mostraram-se ineficazes, pois o SCP-087 parece absorver o excesso de luz."
      th: "SCP-087 คือบันไดชานพักที่ไม่มีแสงสว่าง บันไดลาดลงในมุม 38 องศาเป็นจำนวน 13 ขั้นก่อนถึงชานพักรูปครึ่งวงกลม แหล่งกำเนิดแสงที่สว่างกว่า 75 วัตต์พบว่าไม่ได้ผล เนื่องจาก SCP-087 ดูเหมือนจะดูดซับแสงส่วนเกิน"
      uk: "SCP-087 — це неосвітлений сходовий проліт із майданчиками. Сходи спускаються під кутом 38 градусів протягом 13 сходинок, перш ніж досягти напівкруглого майданчика. Джерела світла яскравіші за 75 ват виявилися неефективними, оскільки SCP-087, схоже, поглинає надлишкове світло."
      vi: "SCP-087 là một cầu thang có chiếu nghỉ không có ánh sáng. Các bậc thang đi xuống theo góc 38 độ trong 13 bậc trước khi đến một chiếu nghỉ hình bán nguyệt. Các nguồn sáng mạnh hơn 75 watt đã cho thấy không hiệu quả, vì SCP-087 dường như hấp thụ ánh sáng dư thừa."
      zh: "SCP-087是一段没有照明的平台楼梯。楼梯以38度角下降13级台阶后抵达一个半圆形平台。经证实，超过75瓦的光源均无效，因为SCP-087似乎会吸收多余的光线。"
      zh_Hant: "SCP-087是一段沒有照明的平台樓梯。樓梯以38度角下降13級台階後抵達一個半圓形平台。經證實，超過75瓦的光源均無效，因為SCP-087似乎會吸收多餘的光線。"

  - scene: >
      Close-up shot, tightly cropped on the D-class subject's face, lit
      only from below by the dim lamp, eyes wide with fear. Beside them in
      the frame, partly emerging from the darkness of the stairwell below,
      SCP-087-1 hovers — a smooth, featureless pale face with no eyes,
      nostrils, or mouth.
    characters: [d-class, scp-087-1]
    caption:
      ja: "対象からの報告と音声記録により、█歳から██歳程度と推定される子供のものと思われる苦しげな声が確認されている。各探索でSCP-087-1という、瞳孔・鼻孔・口が確認できない顔が出現している。"
      en: "Subjects report and audio recordings confirm distressed vocalizations from what is presumed to be a child. Each subject conducting an exploration has encountered SCP-087-1, which appears as a face with no visible pupils, nostrils, or mouth."
      cs: "Subjekty hlásí a zvukové záznamy potvrzují tísnivé vokalizace, o nichž se předpokládá, že pocházejí od dítěte. Každý subjekt provádějící průzkum se setkal s SCP-087-1, který se jeví jako tvář bez viditelných zorniček, nozder nebo úst."
      de: "Testpersonen berichten davon, und Audioaufnahmen bestätigen, verzweifelte Lautäußerungen, bei denen vermutet wird, dass sie von einem Kind stammen. Jede Testperson, die eine Erkundung durchführte, begegnete SCP-087-1, das als Gesicht ohne sichtbare Pupillen, Nasenlöcher oder Mund erscheint."
      es: "Los sujetos informan, y las grabaciones de audio confirman, vocalizaciones angustiadas que se presume provienen de un niño. Cada sujeto que ha realizado una exploración se ha encontrado con SCP-087-1, que aparece como un rostro sin pupilas, fosas nasales ni boca visibles."
      fr: "Les sujets rapportent, et les enregistrements audio confirment, des vocalisations de détresse que l'on présume provenir d'un enfant. Chaque sujet ayant mené une exploration a rencontré SCP-087-1, qui apparaît comme un visage sans pupilles, narines ni bouche visibles."
      it: "I soggetti riferiscono, e le registrazioni audio confermano, vocalizzazioni di angoscia che si presume provengano da un bambino. Ogni soggetto che ha condotto un'esplorazione ha incontrato SCP-087-1, che appare come un volto senza pupille, narici o bocca visibili."
      ko: "피험자들은 보고했고 음성 기록도 확인했듯, 아이의 것으로 추정되는 고통스러운 소리가 들린다. 탐사를 수행한 모든 피험자는 눈동자, 콧구멍, 입이 전혀 보이지 않는 얼굴인 SCP-087-1과 마주쳤다."
      pl: "Badani zgłaszają, a nagrania dźwiękowe potwierdzają, udręczone wokalizacje, które przypuszczalnie pochodzą od dziecka. Każdy badany prowadzący eksplorację napotkał SCP-087-1, które wygląda jak twarz bez widocznych źrenic, nozdrzy ani ust."
      pt: "Os sujeitos relatam, e gravações de áudio confirmam, vocalizações de angústia que se presume serem de uma criança. Cada sujeito que realizou uma exploração encontrou o SCP-087-1, que aparece como um rosto sem pupilas, narinas ou boca visíveis."
      th: "ผู้เข้าร่วมการทดลองรายงาน และการบันทึกเสียงยืนยัน เสียงร้องอันทุกข์ทรมานที่สันนิษฐานว่าเป็นของเด็ก ผู้เข้าร่วมการทดลองทุกคนที่สำรวจได้พบกับ SCP-087-1 ซึ่งปรากฏเป็นใบหน้าที่ไม่มีรูม่านตา รูจมูก หรือปากที่มองเห็นได้"
      uk: "Суб'єкти повідомляють, а аудіозаписи підтверджують, стривожені звуки, які, як припускають, належать дитині. Кожен суб'єкт, що проводив дослідження, стикався з SCP-087-1 — обличчям без видимих зіниць, ніздрів чи рота."
      vi: "Các đối tượng báo cáo, và các bản ghi âm xác nhận, những âm thanh đau khổ được cho là của một đứa trẻ. Mỗi đối tượng thực hiện chuyến khám phá đều gặp phải SCP-087-1, xuất hiện dưới dạng một khuôn mặt không có đồng tử, lỗ mũi hay miệng nào có thể nhìn thấy."
      zh: "受试者报告并经录音证实，能听到疑似儿童发出的痛苦声音。每位执行探索的受试者都曾遭遇SCP-087-1，其表现为一张看不见瞳孔、鼻孔或嘴巴的面孔。"
      zh_Hant: "受試者報告並經錄音證實，能聽到疑似兒童發出的痛苦聲音。每位執行探索的受試者都曾遭遇SCP-087-1，其表現為一張看不見瞳孔、鼻孔或嘴巴的面孔。"

  - scene: >
      Wide shot, full body, eye level, echoing the framing of the first
      panel outside the same janitorial-closet door. The attending
      researcher stands facing the now-padlocked door, a fresh steel
      padlock and a hazard placard fixed to it, closing a folder under one
      arm with a grim, resigned expression.
    characters: [attending-researcher-m]
    caption:
      ja: "最終探索の結果を受け、SCP-087への職員の立ち入りは一切禁止される。扉には工業用フォーム材6センチが内張りされている。"
      en: "Due to the results of the final exploration, no personnel are permitted access to SCP-087. The inside of the door is lined with 6 centimeters of industrial foam padding."
      cs: "Vzhledem k výsledkům závěrečného průzkumu není žádnému personálu povolen přístup k SCP-087. Vnitřní strana dveří je vyložena 6 centimetry průmyslového pěnového polstrování."
      de: "Aufgrund der Ergebnisse der letzten Erkundung ist keinem Personal der Zugang zu SCP-087 gestattet. Die Innenseite der Tür ist mit 6 Zentimetern industrieller Schaumstoffpolsterung ausgekleidet."
      es: "Debido a los resultados de la exploración final, no se permite el acceso de ningún personal a SCP-087. El interior de la puerta está revestido con 6 centímetros de acolchado de espuma industrial."
      fr: "En raison des résultats de l'exploration finale, aucun personnel n'est autorisé à accéder à SCP-087. L'intérieur de la porte est doublé de 6 centimètres de mousse industrielle."
      it: "A causa dei risultati dell'esplorazione finale, a nessun membro del personale è consentito l'accesso a SCP-087. L'interno della porta è rivestito con 6 centimetri di imbottitura in gommapiuma industriale."
      ko: "마지막 탐사 결과로 인해, 어떠한 직원도 SCP-087에 접근하는 것이 허용되지 않는다. 문 안쪽에는 6센티미터 두께의 산업용 폼 패딩이 덧대어져 있다."
      pl: "Ze względu na wyniki ostatniej eksploracji żaden personel nie ma dostępu do SCP-087. Wnętrze drzwi jest wyłożone 6-centymetrową przemysłową pianką wygłuszającą."
      pt: "Devido aos resultados da exploração final, nenhum funcionário tem permissão para acessar o SCP-087. O interior da porta é revestido com 6 centímetros de espuma industrial."
      th: "เนื่องจากผลของการสำรวจครั้งสุดท้าย เจ้าหน้าที่ทุกคนไม่ได้รับอนุญาตให้เข้าถึง SCP-087 ด้านในของประตูบุด้วยโฟมอุตสาหกรรมหนา 6 เซนติเมตร"
      uk: "У зв'язку з результатами останнього дослідження жодному персоналу не дозволено доступ до SCP-087. Внутрішня сторона дверей обшита промисловою поролоновою прокладкою товщиною 6 сантиметрів."
      vi: "Do kết quả của cuộc khám phá cuối cùng, không nhân viên nào được phép tiếp cận SCP-087. Mặt trong của cánh cửa được lót bằng lớp đệm mút công nghiệp dày 6 cm."
      zh: "由于最后一次探索的结果，任何人员均不得进入SCP-087。门的内侧衬有6厘米厚的工业泡沫垫。"
      zh_Hant: "由於最後一次探索的結果，任何人員均不得進入SCP-087。門的內側襯有6公分厚的工業泡沫墊。"
