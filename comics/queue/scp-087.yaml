title:
  en: "SCP-087: The Stairwell"
  ja: "SCP-087：吹き抜けた階段"
  cs: "SCP-087: Schodiště"
  de: "SCP-087: Das Treppenhaus"
  es: "SCP-087: La Escalera"
  fr: "SCP-087 : La Cage d'Escalier"
  it: "SCP-087: La Tromba delle Scale"
  ko: "SCP-087: 계단"
  pl: "SCP-087: Klatka Schodowa"
  pt: "SCP-087: A Escadaria"
  th: "SCP-087: บันได"
  uk: "SCP-087: Сходовий Проліт"
  vi: "SCP-087: Cầu Thang"
  zh: "SCP-087：楼梯间"
  zh_Hant: "SCP-087：樓梯間"

