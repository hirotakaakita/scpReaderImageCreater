# SCP-031 4コマ台本
# captionはSpecial Containment Procedures / Description本文からの引用。
# グロ回避のため、記事にある消化・脳の摘出等の描写は本編で扱わず、
# 収容・組織の広がり・「過去の大切な人に化けて引き留める」擬態・
# 遅れている奪還作業の4点に絞る。キャラにセリフは言わせない。
#
# 4コマ構成: 1=平壌の柳京ホテルに収容、建物構造で中央尖塔に封じ込め(起)、
# 2=7,500kg超の不定形生物がダクトを通じ全105階に広がる(承)、
# 3=胞子果が過去の大切な人の姿に化け、留まるよう説得する(転)、
# 4=火炎放射器と薬剤で奪還作業中だが予定を大幅に下回る(結)。

