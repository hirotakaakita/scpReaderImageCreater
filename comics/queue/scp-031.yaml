object_class: Safe

local_characters:
  scp-031:
    name: SCP-031
    description: >
      An amorphous mass of pale grayish-pink tissue (color RGB
      200,175,165), vaguely humanoid in outline but without discernible
      face or limbs, its surface glistening with a thin oily sheen,
      leaving a faint trail of oil wherever it moves.

characters: [scp-031, attending-researcher-m, d-class, attending-researcher-f]

panels:
  - scene: >
      Medium shot, filling most of the frame, on the glistening pale
      mass of scp-031 slowly inching across a bare floor, a faint trail
      of oil glistening behind it. attending-researcher-m watches from
      behind a reinforced window, notepad in hand, expression clinical.
    characters: [scp-031, attending-researcher-m]
    caption:
      ja: "SCP-031は質量75キログラムの不定形の生物である。移動時には油の跡を残す。検査の結果、SCP-031は少なくとも部分的に人間の筋肉組織と表皮組織から構成されていることが判明しており、あらゆる音程・音色で人間の声を再現することができる。"
      en: "SCP-031 is an amorphous organism with a mass of 75 kilograms. It leaves a trail of oil when it moves. Testing has shown that SCP-031 is at least partially composed of human muscle and epidermal tissue, and it is capable of reproducing human speech in any pitch or tone."
      cs: "SCP-031 je beztvarý organismus o hmotnosti 75 kilogramů. Při pohybu zanechává stopu oleje. Testy prokázaly, že SCP-031 je alespoň částečně tvořeno lidskou svalovou a epidermální tkání a je schopno reprodukovat lidskou řeč v jakékoli výšce či tónu."
      de: "SCP-031 ist ein amorpher Organismus mit einer Masse von 75 Kilogramm. Bei Bewegung hinterlässt es eine Ölspur. Tests haben gezeigt, dass SCP-031 zumindest teilweise aus menschlichem Muskel- und Epidermalgewebe besteht und in der Lage ist, menschliche Sprache in jeder Tonhöhe oder Klangfarbe zu reproduzieren."
      es: "SCP-031 es un organismo amorfo con una masa de 75 kilogramos. Deja un rastro de aceite al moverse. Las pruebas han demostrado que SCP-031 está al menos parcialmente compuesto de músculo humano y tejido epidérmico, y es capaz de reproducir el habla humana en cualquier tono o timbre."
      fr: "Le SCP-031 est un organisme amorphe d'une masse de 75 kilogrammes. Il laisse une traînée d'huile lorsqu'il se déplace. Les tests ont montré que le SCP-031 est au moins partiellement composé de muscle humain et de tissu épidermique, et qu'il est capable de reproduire la parole humaine dans n'importe quelle hauteur ou timbre."
      it: "SCP-031 è un organismo amorfo con una massa di 75 chilogrammi. Lascia una scia d'olio quando si muove. I test hanno dimostrato che SCP-031 è almeno parzialmente composto da muscolo umano e tessuto epidermico, ed è in grado di riprodurre il linguaggio umano in qualsiasi tono o timbro."
      ko: "SCP-031은 질량 75킬로그램의 무정형 유기체이다. 이동할 때 기름 자국을 남긴다. 검사 결과 SCP-031은 적어도 부분적으로 인간의 근육과 표피 조직으로 구성되어 있으며, 어떤 음높이나 음색으로도 인간의 말을 재현할 수 있다."
      pl: "SCP-031 to bezkształtny organizm o masie 75 kilogramów. Podczas poruszania się zostawia ślad oleju. Testy wykazały, że SCP-031 jest przynajmniej częściowo zbudowane z ludzkiej tkanki mięśniowej i naskórka, i jest w stanie odtwarzać ludzką mowę w dowolnej wysokości czy barwie."
      pt: "O SCP-031 é um organismo amorfo com massa de 75 quilogramas. Deixa um rastro de óleo ao se mover. Os testes mostraram que o SCP-031 é ao menos parcialmente composto de músculo humano e tecido epidérmico, e é capaz de reproduzir a fala humana em qualquer tom ou timbre."
      th: "SCP-031 คือสิ่งมีชีวิตไร้รูปทรงที่มีมวล 75 กิโลกรัม มันทิ้งรอยน้ำมันไว้เมื่อเคลื่อนที่ การทดสอบแสดงให้เห็นว่า SCP-031 ประกอบด้วยกล้ามเนื้อและเนื้อเยื่อผิวหนังของมนุษย์อย่างน้อยบางส่วน และสามารถเลียนเสียงพูดของมนุษย์ได้ทุกระดับเสียงและน้ำเสียง"
      uk: "SCP-031 — це аморфний організм масою 75 кілограмів. Під час руху він залишає слід оливи. Випробування показали, що SCP-031 щонайменше частково складається з людської м'язової та епідермальної тканини і здатний відтворювати людське мовлення будь-якого тону чи тембру."
      vi: "SCP-031 là một sinh vật vô định hình có khối lượng 75 kg. Nó để lại vệt dầu khi di chuyển. Thử nghiệm cho thấy SCP-031 ít nhất một phần được cấu tạo từ cơ và mô biểu bì của con người, và có khả năng tái tạo giọng nói con người ở bất kỳ cao độ hoặc âm sắc nào."
      zh: "SCP-031是一种质量为75公斤的无定形生物。移动时会留下油迹。检测显示，SCP-031至少部分由人类肌肉和表皮组织构成，并能以任何音高或音色复制人类语言。"
      zh_Hant: "SCP-031是一種質量為75公斤的無定形生物。移動時會留下油跡。檢測顯示，SCP-031至少部分由人類肌肉和表皮組織構成，並能以任何音高或音色複製人類語言。"

  - scene: >
      Medium shot, waist-up, eye level, a modest hotel room lit warmly,
      a different framing from the clinical shot before. On the left
      side of the frame, d-class kneels with both hands reaching toward
      scp-031, his face full of longing and warmth as if greeting
      someone dearly missed. On the right side of the frame,
      scp-031's glistening amorphous form rests on the carpet, a small
      trail of oil behind it.
    characters: [d-class, scp-031]
    caption:
      ja: "SCP-031を直接知覚した被験者は、それを過去に自分が知っていて恋愛感情を抱いたことのある人物として見ることになる。SCP-031はその人物を名乗り、何らかの出来事によって困窮しているのだと主張し、被験者を説得して自分を長期間泊めさせようとする。"
      en: "Subjects directly perceiving SCP-031 will see it as an individual they knew and had a romantic attraction to in the past. SCP-031 will claim to be this person, left destitute by some event, and attempt to persuade the subject to let it stay with them."
      cs: "Subjekti, kteří SCP-031 přímo vnímají, jej uvidí jako osobu, kterou znali a k níž v minulosti chovali romantickou náklonnost. SCP-031 se za tuto osobu vydává a tvrdí, že se kvůli nějaké události ocitla bez prostředků, a pokusí se subjekt přesvědčit, aby ho nechal u sebe bydlet."
      de: "Subjekte, die SCP-031 direkt wahrnehmen, sehen es als eine Person, die sie kannten und zu der sie in der Vergangenheit romantische Zuneigung empfanden. SCP-031 wird behaupten, diese Person zu sein, die durch irgendein Ereignis mittellos geworden sei, und versuchen, das Subjekt zu überreden, es bei sich wohnen zu lassen."
      es: "Los sujetos que perciben directamente a SCP-031 lo verán como a alguien que conocieron y por quien sintieron atracción romántica en el pasado. SCP-031 afirmará ser esa persona, dejada en la indigencia por algún acontecimiento, e intentará persuadir al sujeto de que le permita quedarse con él."
      fr: "Les sujets percevant directement le SCP-031 le verront comme une personne qu'ils ont connue et pour laquelle ils ont eu une attirance romantique par le passé. Le SCP-031 prétendra être cette personne, laissée démunie par un événement, et tentera de persuader le sujet de le laisser rester avec lui."
      it: "I soggetti che percepiscono direttamente SCP-031 lo vedranno come una persona che hanno conosciuto e verso cui hanno provato attrazione romantica in passato. SCP-031 affermerà di essere questa persona, rimasta indigente a causa di qualche evento, e tenterà di convincere il soggetto a lasciarlo restare con sé."
      ko: "SCP-031을 직접 지각한 대상은 그것을 과거에 자신이 알고 있었고 연애 감정을 가졌던 사람으로 보게 된다. SCP-031은 그 사람을 자처하며, 어떤 사건으로 인해 궁핍해졌다고 주장하고, 대상을 설득하여 자신을 함께 머물게 하려 한다."
      pl: "Osobnicy bezpośrednio postrzegający SCP-031 zobaczą je jako osobę, którą znali i do której czuli w przeszłości romantyczny pociąg. SCP-031 będzie twierdzić, że jest tą osobą, pozbawioną środków do życia w wyniku jakiegoś zdarzenia, i spróbuje przekonać osobnika, by pozwolił mu z nim zamieszkać."
      pt: "Os sujeitos que percebem diretamente o SCP-031 o verão como alguém que conheceram e por quem tiveram atração romântica no passado. O SCP-031 alegará ser essa pessoa, deixada na miséria por algum evento, e tentará persuadir o sujeito a deixá-lo ficar com ele."
      th: "ผู้ถูกทดสอบที่รับรู้ SCP-031 โดยตรงจะเห็นมันเป็นบุคคลที่พวกเขารู้จักและเคยมีความรู้สึกรักในอดีต SCP-031 จะอ้างว่าเป็นบุคคลนั้น ตกอยู่ในสภาพยากไร้จากเหตุการณ์บางอย่าง และพยายามโน้มน้าวให้ผู้ถูกทดสอบยอมให้มันอยู่ด้วย"
      uk: "Суб'єкти, які безпосередньо сприймають SCP-031, побачать його як людину, яку вони знали і до якої мали романтичну прихильність у минулому. SCP-031 стверджуватиме, що є цією людиною, яка через якусь подію залишилася без засобів до існування, і намагатиметься переконати суб'єкта дозволити йому залишитися з ним."
      vi: "Các đối tượng trực tiếp nhận thức SCP-031 sẽ thấy nó như một người mà họ từng quen biết và từng có tình cảm lãng mạn trong quá khứ. SCP-031 sẽ tự nhận là người đó, bị bần cùng hóa bởi một sự kiện nào đó, và cố gắng thuyết phục đối tượng cho phép nó ở lại với họ."
      zh: "直接感知到SCP-031的对象会将其视为自己过去认识并曾产生爱慕之情的人。SCP-031会自称是这个人，因某种事件而穷困潦倒，并试图说服对象让自己与其同住。"
      zh_Hant: "直接感知到SCP-031的對象會將其視為自己過去認識並曾產生愛慕之情的人。SCP-031會自稱是這個人，因某種事件而窮困潦倒，並試圖說服對象讓自己與其同住。"

  - scene: >
      Wide shot, full body, eye level, pulled back to show the whole
      containment chamber, a very different framing from the tight
      romantic shot before. On the left side of the frame,
      attending-researcher-m mops the floor near scp-031's resting form,
      wearing large opaque goggles that fully block his eyes. On the
      right side of the frame, attending-researcher-f stands at an
      intercom panel just outside the chamber, speaking into a
      microphone, deliberately turned away from the viewing window.
    characters: [attending-researcher-m, scp-031, attending-researcher-f]
    caption:
      ja: "SCP-031と接する職員は、それを直接見てはならず、インターホンシステムを通じてやり取りすること。収容室の清掃は、SCP-031の効果を軽減するために不透明なゴーグルを着用した清掃職員が行う。"
      en: "Personnel interacting with SCP-031 are not to view it directly, and communicate through an intercom system. The containment chamber is to be cleaned by custodial staff wearing opaque goggles to mitigate SCP-031's effect."
      cs: "Personál interagující se SCP-031 nesmí na něj přímo hledět a musí komunikovat pomocí interkomu. Kontejnmentová komora musí být čištěna úklidovým personálem nosícím neprůhledné brýle, aby se zmírnil účinek SCP-031."
      de: "Personal, das mit SCP-031 interagiert, darf es nicht direkt betrachten und muss über eine Gegensprechanlage kommunizieren. Die Containment-Kammer ist von Reinigungspersonal zu säubern, das undurchsichtige Schutzbrillen trägt, um die Wirkung von SCP-031 abzuschwächen."
      es: "El personal que interactúe con SCP-031 no debe verlo directamente, y debe comunicarse a través de un sistema de intercomunicación. La cámara de contención debe ser limpiada por personal de mantenimiento que use gafas opacas para mitigar el efecto de SCP-031."
      fr: "Le personnel interagissant avec le SCP-031 ne doit pas le regarder directement et doit communiquer via un système d'interphone. La chambre de confinement doit être nettoyée par le personnel d'entretien portant des lunettes opaques afin d'atténuer l'effet du SCP-031."
      it: "Il personale che interagisce con SCP-031 non deve osservarlo direttamente e deve comunicare tramite un sistema di interfono. La camera di contenimento deve essere pulita dal personale di custodia che indossa occhiali opachi per mitigare l'effetto di SCP-031."
      ko: "SCP-031과 상호작용하는 직원은 그것을 직접 봐서는 안 되며, 인터콤 시스템을 통해 소통해야 한다. 수용실 청소는 SCP-031의 효과를 완화하기 위해 불투명 고글을 착용한 관리 직원이 담당한다."
      pl: "Personel wchodzący w interakcję z SCP-031 nie może patrzeć na nie bezpośrednio i musi komunikować się przez system interkomu. Komora kontenerowa musi być sprzątana przez personel sprzątający noszący nieprzezroczyste gogle w celu złagodzenia efektu SCP-031."
      pt: "O pessoal que interage com o SCP-031 não deve vê-lo diretamente, e deve se comunicar por meio de um sistema de intercomunicação. A câmara de contenção deve ser limpa por funcionários de zeladoria usando óculos opacos para mitigar o efeito do SCP-031."
      th: "เจ้าหน้าที่ที่ติดต่อกับ SCP-031 ห้ามมองมันโดยตรง และต้องสื่อสารผ่านระบบอินเตอร์คอม ห้องกักกันต้องได้รับการทำความสะอาดโดยเจ้าหน้าที่ดูแลที่สวมแว่นตาทึบแสงเพื่อลดผลกระทบของ SCP-031"
      uk: "Персонал, що взаємодіє з SCP-031, не повинен дивитися на нього безпосередньо і має спілкуватися через систему внутрішнього зв'язку. Камеру утримання мають прибирати прибиральники в непрозорих окулярах, щоб пом'якшити ефект SCP-031."
      vi: "Nhân viên tương tác với SCP-031 không được nhìn trực tiếp vào nó, và phải giao tiếp qua hệ thống liên lạc nội bộ. Buồng chứa phải được vệ sinh bởi nhân viên tạp vụ đeo kính mờ để giảm thiểu hiệu ứng của SCP-031."
      zh: "与SCP-031互动的人员不得直接注视它，须通过对讲系统进行沟通。收容室须由佩戴不透明护目镜的清洁人员打扫，以减轻SCP-031的效应。"
      zh_Hant: "與SCP-031互動的人員不得直接注視牠，須透過對講系統進行溝通。收容室須由佩戴不透明護目鏡的清潔人員打掃，以減輕SCP-031的效應。"

  - scene: >
      Medium shot, waist-up, eye level, a very different framing from
      the wide shot before, showing attending-researcher-f standing at
      the same viewing window, calmly looking directly at scp-031
      without any romantic reaction, her expression neutral and
      slightly puzzled. Through the glass, scp-031 appears as a small
      plump humanoid silhouette, its edges wreathed in curling dark
      smoke that obscures any specific features.
    characters: [attending-researcher-f, scp-031]
    caption:
      ja: "研究の結果、アロマンティックな対象者はSCP-031の影響を受けないことが判明している。こうした対象者は代わりに、SCP-031を小柄で丸みを帯びた人型の姿として報告し、その特徴は周囲に立ちのぼる暗い煙によって覆い隠されている。"
      en: "Research has determined that aromantic subjects are not affected by SCP-031. These subjects instead report SCP-031 as a small, plump humanoid figure, its features obscured by dark smoke."
      cs: "Výzkum zjistil, že aromantičtí subjekti nejsou SCP-031 ovlivněni. Tito subjekti místo toho popisují SCP-031 jako malou, baculatou humanoidní postavu, jejíž rysy jsou zahaleny tmavým kouřem."
      de: "Untersuchungen haben ergeben, dass aromantische Subjekte von SCP-031 nicht beeinflusst werden. Diese Subjekte beschreiben SCP-031 stattdessen als kleine, rundliche humanoide Gestalt, deren Züge von dunklem Rauch verdeckt sind."
      es: "La investigación ha determinado que los sujetos arrománticos no se ven afectados por SCP-031. Estos sujetos, en cambio, describen a SCP-031 como una pequeña y rechoncha figura humanoide, con sus rasgos ocultos por humo oscuro."
      fr: "La recherche a déterminé que les sujets aromantiques ne sont pas affectés par le SCP-031. Ces sujets décrivent plutôt le SCP-031 comme une petite silhouette humanoïde replète, dont les traits sont obscurcis par une fumée sombre."
      it: "La ricerca ha determinato che i soggetti aromantici non sono influenzati da SCP-031. Questi soggetti descrivono invece SCP-031 come una figura umanoide piccola e paffuta, i cui tratti sono oscurati da un fumo scuro."
      ko: "연구 결과 무로맨틱 성향의 대상은 SCP-031의 영향을 받지 않는 것으로 확인되었다. 이러한 대상들은 대신 SCP-031을 작고 통통한 인간형 형체로, 그 특징이 어두운 연기에 가려져 있다고 보고한다."
      pl: "Badania wykazały, że osoby aromantyczne nie są dotknięte SCP-031. Osoby te zamiast tego opisują SCP-031 jako małą, pulchną humanoidalną postać, której rysy są zasłonięte ciemnym dymem."
      pt: "A pesquisa determinou que sujeitos arromânticos não são afetados pelo SCP-031. Esses sujeitos, em vez disso, relatam o SCP-031 como uma figura humanoide pequena e rechonchuda, com seus traços obscurecidos por fumaça escura."
      th: "การวิจัยพบว่าผู้ถูกทดสอบที่เป็นอะโรแมนติกจะไม่ได้รับผลกระทบจาก SCP-031 ผู้ถูกทดสอบเหล่านี้กลับรายงานว่า SCP-031 มีรูปร่างคล้ายมนุษย์ตัวเล็กอ้วนกลม โดยลักษณะเฉพาะถูกบดบังด้วยควันสีเข้ม"
      uk: "Дослідження встановили, що аромантичні суб'єкти не піддаються впливу SCP-031. Натомість ці суб'єкти повідомляють, що SCP-031 виглядає як маленька пухка гуманоїдна постать, риси якої приховані темним димом."
      vi: "Nghiên cứu đã xác định rằng các đối tượng vô ái tính (aromantic) không bị ảnh hưởng bởi SCP-031. Thay vào đó, những đối tượng này mô tả SCP-031 là một hình dạng giống người nhỏ, mập mạp, với các đặc điểm bị che khuất bởi làn khói đen."
      zh: "研究确定，无浪漫倾向的对象不受SCP-031的影响。这些对象反而将SCP-031描述为一个矮胖的人形，其特征被黑烟遮蔽。"
      zh_Hant: "研究確定，無浪漫傾向的對象不受SCP-031的影響。這些對象反而將SCP-031描述為一個矮胖的人形，其特徵被黑煙遮蔽。"
