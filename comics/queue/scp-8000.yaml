local_characters:
  scp-8000:
    name: "SCP-8000"
    appearance: >
      A gigantic serpentine entity resembling a harbor seal, with a seal-like head,
      long unseen tail, smooth gray body, and intelligent friendly expression.
    default_look: >
      Playful, sapient, impossibly large, capable of flying and phasing through solid matter.
panels:
  - scene: >
      Wide Site-322 interior view: a gigantic seal-like serpentine body curves through corridors, too long to see completely. No text.
    characters: [scp-8000]
    source:
      section: Description
      quote: "SCP-8000 is a gigantic, serpentine entity resembling a harbor seal residing within Site-322. The exact length of SCP-8000 is unknown, as its tail has never been located; however, estimates range upwards to 150 meters."
      url: "https://scp-wiki.wikidot.com/scp-8000"
      fetched_at: "2026-09-21T00:00:00Z"
    caption:
      ja: "SCP-8000はSite-322内にいる、ゼニガタアザラシに似た巨大な蛇状実体で、全長は150メートル以上と推定されています。"
      en: &p1 "SCP-8000 is a gigantic serpentine entity resembling a harbor seal, and its length is estimated upward of 150 meters."
