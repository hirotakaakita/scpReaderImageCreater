panels:
  - scene: >
      Wide shot, full body, eye level, showing a heavy cement
      containment door standing slightly ajar, deep shadow inside
      masking whatever lies beyond. attending-researcher-m stands at the
      threshold, notebook and pen ready, peering in with a curious but
      oddly unfocused expression.
    characters: [attending-researcher-m]
    caption:
      ja: "SCP-055は「自己秘匿型の秘密」あるいは「アンチミーム」である。SCP-055の外見、性質、行動、由来に関する情報は、自己分類的に消失していく。"
      en: "SCP-055 is a 'self-keeping secret' or 'anti-meme.' Information about SCP-055's physical appearance as well as its nature, behavior, and origins is self-classifying."
      cs: "SCP-055 je 'samostatně se utajující tajemství' neboli 'antimém'. Informace o fyzickém vzhledu SCP-055, stejně jako o jeho povaze, chování a původu, se samovolně utajují."
      de: "SCP-055 ist ein 'sich selbst bewahrendes Geheimnis' oder 'Anti-Mem'. Informationen über SCP-055s physisches Erscheinungsbild sowie seine Natur, sein Verhalten und seine Herkunft klassifizieren sich selbst."
      es: "SCP-055 es un 'secreto que se guarda a sí mismo' o 'antimeme'. La información sobre la apariencia física de SCP-055, así como su naturaleza, comportamiento y origen, se autoclasifica."
      fr: "Le SCP-055 est un « secret qui se garde lui-même » ou « anti-mème ». Les informations sur l'apparence physique du SCP-055, ainsi que sur sa nature, son comportement et ses origines, s'autoclassifient."
      it: "SCP-055 è un 'segreto che si custodisce da solo' o 'antimeme'. Le informazioni sull'aspetto fisico di SCP-055, così come la sua natura, il suo comportamento e le sue origini, si autoclassificano."
      ko: "SCP-055는 '스스로를 지키는 비밀' 또는 '안티밈'이다. SCP-055의 외형뿐만 아니라 그 본질, 행동, 기원에 관한 정보는 스스로 기밀화된다."
      pl: "SCP-055 to 'sekret samoutrzymujący się' lub 'antymem'. Informacje o fizycznym wyglądzie SCP-055, a także o jego naturze, zachowaniu i pochodzeniu, samoklasyfikują się."
      pt: "O SCP-055 é um 'segredo autoprotegido' ou 'antimeme'. Informações sobre a aparência física do SCP-055, bem como sua natureza, comportamento e origens, se autoclassificam."
      th: "SCP-055 คือ 'ความลับที่รักษาตัวเอง' หรือ 'แอนตี้มีม' ข้อมูลเกี่ยวกับรูปลักษณ์ทางกายภาพของ SCP-055 รวมถึงธรรมชาติ พฤติกรรม และที่มาของมัน จะจัดประเภทตัวเองโดยอัตโนมัติ"
      uk: "SCP-055 — це 'таємниця, що зберігає сама себе', або 'антимем'. Інформація про фізичний вигляд SCP-055, а також про його природу, поведінку та походження, самокласифікується."
      vi: "SCP-055 là một 'bí mật tự bảo vệ' hay 'phản-meme'. Thông tin về ngoại hình vật lý của SCP-055, cũng như bản chất, hành vi và nguồn gốc của nó, tự động được phân loại."
      zh: "SCP-055是一种「自我保密的秘密」，或称「反模因」。有关SCP-055外观、性质、行为和起源的信息会自动被列为机密而消失。"
      zh_Hant: "SCP-055是一種「自我保密的秘密」，或稱「反迷因」。有關SCP-055外觀、性質、行為和起源的資訊會自動被列為機密而消失。"

  - scene: >
      Medium shot, waist-up, eye level, a different framing from the
      wide shot before. attending-researcher-f sits at a small desk,
      pencil hovering motionless over a blank sketchpad, staring off
      into space with a vacant, distracted expression, a photograph
      lying face-down on the table beside her.
    characters: [attending-researcher-f]
    caption:
      ja: "SCP-055について説明するよう命じられた者は、後になると意識がさまよい始め、その作業への関心を失う。SCP-055の写真を模写するよう命じられた者は、その写真がどのようなものだったかを思い出せなくなる。"
      en: "Individuals tasked with describing SCP-055 afterward find their minds wandering and lose interest in the task; those tasked with sketching a copy of a photograph of SCP-055 are unable to remember what the photograph looks like."
      cs: "Jedinci pověření následným popsáním SCP-055 zjišťují, že se jejich mysl toulá a ztrácejí zájem o tento úkol; ti, kteří mají za úkol nakreslit kopii fotografie SCP-055, si nedokážou vzpomenout, jak fotografie vypadala."
      de: "Personen, die anschließend SCP-055 beschreiben sollen, stellen fest, dass ihre Gedanken abschweifen und sie das Interesse an der Aufgabe verlieren; Personen, die eine Kopie eines Fotos von SCP-055 anfertigen sollen, können sich nicht daran erinnern, wie das Foto aussah."
      es: "Las personas encargadas de describir posteriormente a SCP-055 encuentran que su mente divaga y pierden interés en la tarea; aquellas encargadas de dibujar una copia de una fotografía de SCP-055 no pueden recordar cómo era la fotografía."
      fr: "Les personnes chargées de décrire ensuite le SCP-055 constatent que leur esprit divague et qu'elles perdent tout intérêt pour la tâche ; celles chargées de reproduire une copie d'une photographie du SCP-055 sont incapables de se rappeler à quoi ressemblait la photographie."
      it: "Gli individui incaricati di descrivere successivamente SCP-055 scoprono che la loro mente vaga e perdono interesse nel compito; quelli incaricati di ricopiare una fotografia di SCP-055 non riescono a ricordare che aspetto avesse la fotografia."
      ko: "이후 SCP-055를 설명하도록 지시받은 사람들은 정신이 산만해지며 그 작업에 대한 흥미를 잃는다; SCP-055 사진의 사본을 스케치하도록 지시받은 사람들은 그 사진이 어떤 모습이었는지 기억하지 못한다."
      pl: "Osoby, które mają następnie opisać SCP-055, stwierdzają, że ich myśli błądzą i tracą zainteresowanie zadaniem; osoby, które mają narysować kopię fotografii SCP-055, nie są w stanie zapamiętać, jak wyglądała ta fotografia."
      pt: "Indivíduos encarregados de descrever posteriormente o SCP-055 percebem que suas mentes divagam e perdem o interesse na tarefa; os encarregados de esboçar uma cópia de uma fotografia do SCP-055 são incapazes de lembrar como era a fotografia."
      th: "บุคคลที่ได้รับมอบหมายให้บรรยาย SCP-055 ภายหลังจะพบว่าจิตใจของตนล่องลอยและหมดความสนใจในงาน ผู้ที่ได้รับมอบหมายให้วาดสำเนาภาพถ่ายของ SCP-055 ไม่สามารถจำได้ว่าภาพถ่ายนั้นมีลักษณะอย่างไร"
      uk: "Особи, яким доручають згодом описати SCP-055, помічають, що їхні думки блукають, і втрачають інтерес до завдання; ті, кому доручено намалювати копію фотографії SCP-055, не можуть пригадати, як виглядала фотографія."
      vi: "Những người được giao nhiệm vụ mô tả SCP-055 sau đó thấy tâm trí mình lang thang và mất hứng thú với nhiệm vụ; những người được giao vẽ lại một bản sao ảnh chụp SCP-055 không thể nhớ được bức ảnh trông như thế nào."
      zh: "被指派事后描述SCP-055的人员会发现自己思绪游离，对该任务失去兴趣；被指派临摹SCP-055照片的人员则无法记起那张照片是什么样子。"
      zh_Hant: "被指派事後描述SCP-055的人員會發現自己思緒游離，對該任務失去興趣；被指派臨摹SCP-055照片的人員則無法記起那張照片是什麼樣子。"

  - scene: >
      Wide shot, full body, eye level, pulled back to show a plain
      institutional hallway, a very different framing from the tight
      desk shot before. An unremarkable containment door stands at the
      end of the corridor with a conspicuously empty guard chair beside
      it. attending-researcher-m walks briskly along the far wall,
      giving the door a wide, deliberate berth.
    characters: [attending-researcher-m]
    caption:
      ja: "SCP-055の部屋の外に警備員を配置してはならない。付近で他のSCP物品の維持または研究に当たる職員は、可能な限り、その部屋の幾何学的中心から少なくとも50メートルの距離を保つよう努めること。"
      en: "Security guards are NOT to be posted outside SCP-055's room. Personnel maintaining or studying other SCP objects in the vicinity should try to maintain a distance of at least fifty meters from the geometric center of the room."
      cs: "Před místností SCP-055 NESMÍ být rozmístěni bezpečnostní strážní. Personál udržující nebo studující jiné SCP objekty v blízkosti by se měl pokusit udržovat vzdálenost alespoň padesáti metrů od geometrického středu místnosti."
      de: "Vor dem Raum von SCP-055 dürfen KEINE Sicherheitswachen postiert werden. Personal, das andere SCP-Objekte in der Nähe wartet oder untersucht, sollte versuchen, einen Abstand von mindestens fünfzig Metern zum geometrischen Mittelpunkt des Raumes einzuhalten."
      es: "NO se deben apostar guardias de seguridad fuera de la habitación de SCP-055. El personal que mantenga o estudie otros objetos SCP en las cercanías debe intentar mantener una distancia de al menos cincuenta metros del centro geométrico de la habitación."
      fr: "Aucun garde de sécurité ne doit être posté à l'extérieur de la salle du SCP-055. Le personnel entretenant ou étudiant d'autres objets SCP à proximité devrait essayer de maintenir une distance d'au moins cinquante mètres du centre géométrique de la salle."
      it: "Le guardie di sicurezza NON devono essere appostate fuori dalla stanza di SCP-055. Il personale che mantiene o studia altri oggetti SCP nelle vicinanze dovrebbe cercare di mantenere una distanza di almeno cinquanta metri dal centro geometrico della stanza."
      ko: "SCP-055 방 밖에는 경비원을 배치해서는 안 된다. 인근에서 다른 SCP 물품을 관리하거나 연구하는 직원은 가급적 그 방의 기하학적 중심으로부터 최소 50미터의 거리를 유지하도록 노력해야 한다."
      pl: "Strażnicy NIE mogą być rozstawiani na zewnątrz pomieszczenia SCP-055. Personel utrzymujący lub badający inne obiekty SCP w pobliżu powinien starać się zachować odległość co najmniej pięćdziesięciu metrów od geometrycznego środka pomieszczenia."
      pt: "Guardas de segurança NÃO devem ser posicionados do lado de fora da sala do SCP-055. O pessoal que mantém ou estuda outros objetos SCP nas proximidades deve tentar manter uma distância de pelo menos cinquenta metros do centro geométrico da sala."
      th: "ห้ามจัดเจ้าหน้าที่รักษาความปลอดภัยไว้นอกห้องของ SCP-055 เจ้าหน้าที่ที่ดูแลหรือศึกษาวัตถุ SCP อื่นๆ ในบริเวณใกล้เคียงควรพยายามรักษาระยะห่างอย่างน้อยห้าสิบเมตรจากจุดศูนย์กลางทางเรขาคณิตของห้อง"
      uk: "Охоронців НЕ можна розміщувати біля кімнати SCP-055. Персонал, який обслуговує чи досліджує інші об'єкти SCP поблизу, повинен намагатися триматися на відстані щонайменше п'ятдесяти метрів від геометричного центру кімнати."
      vi: "KHÔNG được bố trí nhân viên bảo vệ bên ngoài phòng của SCP-055. Nhân viên bảo trì hoặc nghiên cứu các vật thể SCP khác trong khu vực lân cận nên cố gắng duy trì khoảng cách tối thiểu năm mươi mét từ tâm hình học của căn phòng."
      zh: "SCP-055的房间外禁止部署保安人员。附近维护或研究其他SCP物品的人员应尽量与该房间的几何中心保持至少五十米的距离。"
      zh_Hant: "SCP-055的房間外禁止部署保安人員。附近維護或研究其他SCP物品的人員應盡量與該房間的幾何中心保持至少五十公尺的距離。"

  - scene: >
      Medium shot, waist-up, eye level, an office setting, a different
      framing from the hallway shot before. On the left side of the
      frame, attending-researcher-m sits bolt upright at his desk,
      papers clutched in both hands, eyes wide with sudden alarm. On the
      right side of the frame, attending-researcher-f walks past in the
      background, completely calm and unconcerned, already glancing
      away.
    characters: [attending-researcher-m, attending-researcher-f]
    caption:
      ja: "これらの事実はすべて、通常この文書を偶然読んだ者によって定期的に再発見され、大いなる動揺を引き起こす。しかし、その懸念状態はせいぜい数分しか続かず、その後は単に忘れ去られてしまう。"
      en: "All of these facts are periodically rediscovered, usually by chance readers of this file, causing a great deal of alarm. This state of concern lasts minutes at most, before the matter is simply forgotten about."
      cs: "Všechna tato fakta jsou pravidelně znovuobjevována, obvykle náhodnými čtenáři tohoto souboru, což vyvolává značný poplach. Tento stav znepokojení trvá nanejvýš několik minut, než je záležitost jednoduše zapomenuta."
      de: "All diese Tatsachen werden regelmäßig wiederentdeckt, gewöhnlich von zufälligen Lesern dieser Akte, was erhebliche Beunruhigung auslöst. Dieser Zustand der Besorgnis dauert höchstens ein paar Minuten, bevor die Angelegenheit einfach vergessen wird."
      es: "Todos estos hechos se redescubren periódicamente, generalmente por lectores ocasionales de este archivo, causando una gran alarma. Este estado de preocupación dura, como mucho, unos minutos, antes de que el asunto simplemente se olvide."
      fr: "Tous ces faits sont périodiquement redécouverts, généralement par des lecteurs occasionnels de ce dossier, provoquant une grande inquiétude. Cet état d'alarme dure au maximum quelques minutes, avant que l'affaire ne soit simplement oubliée."
      it: "Tutti questi fatti vengono periodicamente riscoperti, di solito da lettori occasionali di questo file, causando un notevole allarme. Questo stato di preoccupazione dura al massimo pochi minuti, prima che la questione venga semplicemente dimenticata."
      ko: "이 모든 사실들은 보통 이 문서를 우연히 읽게 된 사람들에 의해 주기적으로 재발견되며, 상당한 동요를 일으킨다. 그러나 이 우려 상태는 길어야 몇 분간 지속될 뿐, 이후에는 그저 잊혀지고 만다."
      pl: "Wszystkie te fakty są okresowo odkrywane na nowo, zazwyczaj przez przypadkowych czytelników tego pliku, co powoduje znaczny niepokój. Ten stan zaniepokojenia trwa najwyżej kilka minut, po czym sprawa zostaje po prostu zapomniana."
      pt: "Todos esses fatos são redescobertos periodicamente, geralmente por leitores casuais deste arquivo, causando grande alarme. Esse estado de preocupação dura, no máximo, alguns minutos, antes que o assunto seja simplesmente esquecido."
      th: "ข้อเท็จจริงทั้งหมดนี้ถูกค้นพบซ้ำเป็นระยะๆ โดยปกติจากผู้ที่บังเอิญอ่านเอกสารนี้ ก่อให้เกิดความตื่นตระหนกอย่างมาก แต่สภาวะความกังวลนี้จะคงอยู่ไม่เกินไม่กี่นาที ก่อนที่เรื่องราวจะถูกลืมไปเฉยๆ"
      uk: "Усі ці факти періодично відкриваються заново, зазвичай випадковими читачами цього файлу, викликаючи значне занепокоєння. Цей стан тривоги триває щонайбільше кілька хвилин, перш ніж справа просто забувається."
      vi: "Tất cả những sự thật này thường xuyên được khám phá lại, thường là bởi những người tình cờ đọc được tài liệu này, gây ra sự lo lắng đáng kể. Trạng thái lo âu này chỉ kéo dài tối đa vài phút, trước khi vấn đề đơn giản là bị lãng quên."
      zh: "所有这些事实都会被定期重新发现，通常是被偶然阅读这份档案的人发现，从而引发极大的恐慌。但这种担忧状态最多只持续几分钟，之后此事便被彻底遗忘。"
      zh_Hant: "所有這些事實都會被定期重新發現，通常是被偶然閱讀這份檔案的人發現，從而引發極大的恐慌。但這種擔憂狀態最多只持續幾分鐘，之後此事便被徹底遺忘。"
