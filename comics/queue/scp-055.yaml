# SCP-055 4コマ台本
# captionはSpecial Containment Procedures / Description本文からの引用。
# SCP-055は「その外見自体が不明」という設定のSCPのため、対象自体を絵に
# 描かず、常に画面外・影の中に置き、職員の反応のみで演出した（Document
# 055-1/2の面接記録・第三者陰謀説は本編に混ぜない）。キャラにセリフは
# 言わせない。JP公式訳が直接取得できなかったため、検証済みの英語本文からの
# 翻訳（ja含む）。

