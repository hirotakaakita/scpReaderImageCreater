# SCP-055 4コマ台本
# captionは記事本文（Description）からの引用。キャラにセリフは言わせない。
# SCP-055は「自己秘匿・アンチミーム」のため、その外見自体は絵に描かない
# （記事の性質上、外見の描写自体が存在しない）。

