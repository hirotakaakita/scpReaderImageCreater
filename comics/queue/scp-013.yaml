# SCP-013 4コマ台本
# captionはSpecial Containment Procedures / Description本文からの引用。
# Ian Milesの自殺という発見経緯（グロ・自傷を含む）とAddendumの遺書は本編に
# 混ぜない。効果は「知覚のみが変わり身体は変化しない」という記述に基づき、
# 対象が変化を喜ぶが周囲には何も変わって見えないという不条理コメディとして
# 演出した。キャラにセリフは言わせない。JP公式訳が直接取得できなかったため、
# 検証済みの英語本文からの翻訳（ja含む）。

id: scp-013

title:
  en: "SCP-013"
  ja: "SCP-013"
  cs: "SCP-013"
  de: "SCP-013"
  es: "SCP-013"
  fr: "SCP-013"
  it: "SCP-013"
  ko: "SCP-013"
  pl: "SCP-013"
  pt: "SCP-013"
  th: "SCP-013"
  uk: "SCP-013"
  vi: "SCP-013"
  zh: "SCP-013"
  zh_Hant: "SCP-013"

attribution:
  article: "SCP-013"
  source_url: "http://scp-wiki.wikidot.com/scp-013"
  license: "CC BY-SA 3.0"

object_class: Safe

characters: [attending-researcher-f, attending-researcher-m, d-class]

panels:
  - scene: >
      Wide shot, full body, eye level, showing a secure storage vault
      shelf lined with small labeled boxes. One open box in the
      foreground holds a neat row of cigarettes, each with faint
      indistinct blue ink markings near the filter. attending-researcher-f
      stands at the shelf, clipboard in hand, counting them one by one.
    characters: [attending-researcher-f]
    caption:
      ja: "SCP-013は、類似した異常性を示す242本の煙草の総称である。各個体に共通して見られる最も一般的な外見上の特徴は、青インクによる手書きの文字である。"
      en: "SCP-013 is the collective designation of 242 cigarettes which display similar anomalies. The most common external detail between instances is handwriting in blue ink on each cigarette."
      cs: "SCP-013 je souhrnné označení pro 242 cigaret vykazujících podobné anomálie. Nejčastějším vnějším rysem společným všem instancím je rukou psaný text modrým inkoustem na každé cigaretě."
      de: "SCP-013 ist die Sammelbezeichnung für 242 Zigaretten, die ähnliche Anomalien aufweisen. Das häufigste äußere Merkmal zwischen den Instanzen ist eine handschriftliche Notiz in blauer Tinte auf jeder Zigarette."
      es: "SCP-013 es la designación colectiva de 242 cigarrillos que presentan anomalías similares. El detalle externo más común entre las instancias es una inscripción manuscrita en tinta azul en cada cigarrillo."
      fr: "Le SCP-013 est la désignation collective de 242 cigarettes présentant des anomalies similaires. Le détail externe le plus courant entre les instances est une inscription manuscrite à l'encre bleue sur chaque cigarette."
      it: "SCP-013 è la designazione collettiva di 242 sigarette che presentano anomalie simili. Il dettaglio esterno più comune tra le istanze è una scritta a mano in inchiostro blu su ciascuna sigaretta."
      ko: "SCP-013는 유사한 이상 현상을 보이는 242개비의 담배를 통칭하는 명칭이다. 개체 간 가장 흔한 외형적 특징은 각 담배에 파란 잉크로 손글씨가 쓰여 있다는 점이다."
      pl: "SCP-013 to zbiorcze oznaczenie 242 papierosów wykazujących podobne anomalie. Najczęstszym zewnętrznym szczegółem wspólnym dla egzemplarzy jest odręczny napis niebieskim atramentem na każdym papierosie."
      pt: "O SCP-013 é a designação coletiva de 242 cigarros que exibem anomalias semelhantes. O detalhe externo mais comum entre as instâncias é uma inscrição manuscrita em tinta azul em cada cigarro."
      th: "SCP-013 คือชื่อเรียกรวมของบุหรี่ 242 มวนที่แสดงความผิดปกติคล้ายกัน รายละเอียดภายนอกที่พบบ่อยที่สุดในแต่ละตัวอย่างคือลายมือเขียนด้วยหมึกสีน้ำเงินบนบุหรี่แต่ละมวน"
      uk: "SCP-013 — це збірна назва для 242 сигарет, які демонструють подібні аномалії. Найпоширенішою зовнішньою деталлю серед екземплярів є рукописний напис синім чорнилом на кожній сигареті."
      vi: "SCP-013 là tên gọi chung cho 242 điếu thuốc lá có các dị thường tương tự nhau. Chi tiết bên ngoài phổ biến nhất giữa các thực thể là dòng chữ viết tay bằng mực xanh trên mỗi điếu thuốc."
      zh: "SCP-013是242支表现出相似异常性的香烟的统称。各个体之间最常见的外部特征是每支香烟上都有蓝色墨水手写的字迹。"
      zh_Hant: "SCP-013是242支表現出相似異常性的香菸的統稱。各個體之間最常見的外部特徵是每支香菸上都有藍色墨水手寫的字跡。"

  - scene: >
      Close-up, filling most of the frame, on a pencil sketch pinned to
      a corkboard: a woman's face with cropped dark hair, striking blue
      eyes, and bright blue lipstick. At the edge of the frame,
      attending-researcher-m taps the sketch with a pen, comparing it to
      notes on his clipboard.
    characters: [attending-researcher-m]
    caption:
      ja: "被験者たちはこの女性について、25歳から35歳くらいで、短く刈り込んだ黒髪、青い瞳、そして鮮やかな青い口紅をしていたと証言している。"
      en: "Subjects have described the woman to be aged between 25 and 35 years old, with cropped dark hair, blue eyes, and bright blue lipstick."
      cs: "Subjekti popisují ženu jako osobu ve věku 25 až 35 let, s krátce ostříhanými tmavými vlasy, modrýma očima a jasně modrou rtěnkou."
      de: "Die Subjekte beschrieben die Frau als etwa 25 bis 35 Jahre alt, mit kurz geschnittenem dunklem Haar, blauen Augen und leuchtend blauem Lippenstift."
      es: "Los sujetos han descrito a la mujer como de entre 25 y 35 años, con cabello oscuro corto, ojos azules y labial azul brillante."
      fr: "Les sujets ont décrit la femme comme étant âgée de 25 à 35 ans, avec des cheveux foncés courts, des yeux bleus et un rouge à lèvres bleu vif."
      it: "I soggetti hanno descritto la donna come di età compresa tra i 25 e i 35 anni, con capelli scuri corti, occhi azzurri e rossetto blu acceso."
      ko: "피험자들은 이 여성을 25세에서 35세 사이로, 짧게 자른 어두운 머리카락, 파란 눈, 그리고 밝은 파란색 립스틱을 하고 있다고 묘사했다."
      pl: "Osobnicy opisywali kobietę jako osobę w wieku od 25 do 35 lat, z krótko obciętymi ciemnymi włosami, niebieskimi oczami i jaskrawoniebieską szminką."
      pt: "Os sujeitos descreveram a mulher como tendo entre 25 e 35 anos, cabelo escuro curto, olhos azuis e batom azul vibrante."
      th: "ผู้ถูกทดสอบบรรยายว่าผู้หญิงคนนี้มีอายุระหว่าง 25 ถึง 35 ปี ผมสีเข้มตัดสั้น ดวงตาสีฟ้า และลิปสติกสีฟ้าสดใส"
      uk: "Суб'єкти описували жінку як особу віком від 25 до 35 років, з коротким темним волоссям, блакитними очима та яскраво-синьою помадою."
      vi: "Các đối tượng mô tả người phụ nữ trong độ tuổi từ 25 đến 35, với mái tóc sẫm màu cắt ngắn, đôi mắt xanh, và son môi xanh dương tươi sáng."
      zh: "被试者形容这名女性年龄在25至35岁之间，留着短而深色的头发，蓝色的眼睛，涂着鲜艳的蓝色口红。"
      zh_Hant: "受試者形容這名女性年齡在25至35歲之間，留著短而深色的頭髮，藍色的眼睛，塗著鮮豔的藍色口紅。"

  - scene: >
      Medium shot, waist-up, low angle, a different framing from the
      close-up before. d-class sits on a stool in a bare observation
      room, a lit cigarette between his fingers, exhaling a slow curl of
      smoke, his expression turning subtly distant and unfocused.
    characters: [d-class]
    caption:
      ja: "SCP-013の内容物を吸入によって摂取した被験者は、特定の身元不明の女性として自分自身を知覚し始める。"
      en: "Subjects who consume the contents of SCP-013 through inhalation will begin to perceive themselves as a specific unidentified woman."
      cs: "Subjekti, kteří vdechnou obsah SCP-013, si začnou sami sebe vnímat jako konkrétní neidentifikovanou ženu."
      de: "Subjekte, die den Inhalt von SCP-013 durch Inhalation konsumieren, beginnen, sich selbst als eine bestimmte, nicht identifizierte Frau wahrzunehmen."
      es: "Los sujetos que consumen el contenido de SCP-013 mediante inhalación comenzarán a percibirse a sí mismos como una mujer específica no identificada."
      fr: "Les sujets qui consomment le contenu du SCP-013 par inhalation commencent à se percevoir comme une femme spécifique non identifiée."
      it: "I soggetti che consumano il contenuto di SCP-013 per inalazione inizieranno a percepire se stessi come una specifica donna non identificata."
      ko: "SCP-013의 내용물을 흡입으로 섭취한 피험자는 특정한 신원 불명의 여성으로 자신을 인식하기 시작한다."
      pl: "Osobnicy, którzy spożyją zawartość SCP-013 poprzez wdychanie, zaczną postrzegać samych siebie jako konkretną, niezidentyfikowaną kobietę."
      pt: "Os sujeitos que consomem o conteúdo do SCP-013 por inalação começarão a se perceber como uma mulher específica não identificada."
      th: "ผู้ถูกทดสอบที่บริโภคเนื้อหาของ SCP-013 ผ่านการสูดดมจะเริ่มรับรู้ตนเองว่าเป็นผู้หญิงนิรนามคนหนึ่งโดยเฉพาะ"
      uk: "Суб'єкти, які вживають вміст SCP-013 шляхом вдихання, починають сприймати себе як конкретну неідентифіковану жінку."
      vi: "Các đối tượng hít phải chất bên trong SCP-013 sẽ bắt đầu nhận thức bản thân mình như một người phụ nữ cụ thể chưa xác định danh tính."
      zh: "通过吸入方式摄取SCP-013内容物的被试者，会开始将自己感知为一名特定的身份不明女性。"
      zh_Hant: "透過吸入方式攝取SCP-013內容物的受試者，會開始將自己感知為一名特定的身份不明女性。"

  - scene: >
      Wide shot, full body, eye level, pulled back to show the whole
      observation room, a very different framing from the tight medium
      shot before. On the left side of the frame, d-class stands before
      a tall mirror, admiring his own unchanged reflection with a
      delighted, love-struck expression, one hand touching his cheek. On
      the right side of the frame, attending-researcher-f and
      attending-researcher-m exchange a bemused, confused glance,
      clipboards in hand.
    characters: [d-class, attending-researcher-f, attending-researcher-m]
    caption:
      ja: "被験者は、自分自身の鏡像がその女性の特徴を帯びていくものとして徐々に知覚するようになる。この変化はすべて精神的なものであり、被験者の身体が外見上変化するわけではなく、自己に対する知覚だけが変化する。この変化は永続的である。"
      en: "Subjects will gradually perceive reflections of themselves as having the features of the woman. All changes are entirely mental; the subject's body does not change outwardly, only their perception of themselves. These alterations are permanent."
      cs: "Subjekti si postupně začnou uvědomovat svůj odraz jako nesoucí rysy oné ženy. Veškeré změny jsou čistě mentální povahy; tělo subjektu se navenek nemění, mění se pouze jeho vnímání sebe sama. Tyto změny jsou trvalé."
      de: "Die Subjekte nehmen ihr Spiegelbild allmählich mit den Zügen der Frau wahr. Alle Veränderungen sind rein mental; der Körper des Subjekts verändert sich äußerlich nicht, nur die Selbstwahrnehmung. Diese Veränderungen sind dauerhaft."
      es: "Los sujetos comenzarán gradualmente a percibir sus reflejos como si tuvieran los rasgos de la mujer. Todos los cambios son completamente mentales; el cuerpo del sujeto no cambia exteriormente, solo su percepción de sí mismo. Estas alteraciones son permanentes."
      fr: "Les sujets percevront progressivement leur reflet comme portant les traits de la femme. Tous les changements sont purement mentaux ; le corps du sujet ne change pas extérieurement, seule sa perception de lui-même change. Ces altérations sont permanentes."
      it: "I soggetti percepiranno gradualmente i propri riflessi come dotati dei tratti della donna. Tutti i cambiamenti sono puramente mentali; il corpo del soggetto non cambia esteriormente, solo la sua percezione di sé. Queste alterazioni sono permanenti."
      ko: "피험자는 점차 자신의 거울상이 그 여성의 특징을 지닌 것으로 인식하게 된다. 모든 변화는 전적으로 정신적인 것이며, 피험자의 신체는 외형적으로 변하지 않고 오직 자기 자신에 대한 인식만이 변화한다. 이 변화는 영구적이다."
      pl: "Osobnicy stopniowo zaczną postrzegać swoje odbicia jako posiadające rysy tej kobiety. Wszystkie zmiany mają charakter czysto mentalny; ciało osobnika nie zmienia się zewnętrznie, zmienia się jedynie jego postrzeganie samego siebie. Zmiany te są trwałe."
      pt: "Os sujeitos passarão a perceber gradualmente seus reflexos como tendo as feições da mulher. Todas as mudanças são inteiramente mentais; o corpo do sujeito não muda externamente, apenas sua percepção de si mesmo. Essas alterações são permanentes."
      th: "ผู้ถูกทดสอบจะค่อยๆ รับรู้ภาพสะท้อนของตนเองว่ามีลักษณะของผู้หญิงคนนั้น การเปลี่ยนแปลงทั้งหมดเป็นเรื่องทางจิตใจล้วนๆ ร่างกายของผู้ถูกทดสอบไม่เปลี่ยนแปลงภายนอก มีเพียงการรับรู้ตนเองเท่านั้นที่เปลี่ยนไป การเปลี่ยนแปลงนี้เป็นแบบถาวร"
      uk: "Суб'єкти поступово починають сприймати своє відображення як таке, що має риси цієї жінки. Усі зміни є суто ментальними; тіло суб'єкта зовні не змінюється, змінюється лише його сприйняття себе. Ці зміни є незворотними."
      vi: "Các đối tượng sẽ dần dần nhận thức hình ảnh phản chiếu của mình mang các đặc điểm của người phụ nữ đó. Mọi thay đổi hoàn toàn mang tính tinh thần; cơ thể đối tượng không thay đổi ra bên ngoài, chỉ có nhận thức về bản thân họ thay đổi. Những thay đổi này là vĩnh viễn."
      zh: "被试者会逐渐将自己的镜中倒影感知为具有那名女性的特征。所有变化完全是精神层面的；被试者的身体外表并未发生变化，改变的只是他们对自身的感知。这些改变是永久性的。"
      zh_Hant: "受試者會逐漸將自己的鏡中倒影感知為具有那名女性的特徵。所有變化完全是精神層面的；受試者的身體外表並未發生變化，改變的只是他們對自身的感知。這些改變是永久性的。"
