# SCP-033 4コマ台本
# captionはSpecial Containment Procedures / Description本文からの引用。
# Document 033-A（Hutchinson教授の解説）とDocument 033-Q（実験ログ）は
# 本編に混ぜない。キャラにセリフは言わせない。JP公式訳が直接取得できなかった
# ため、検証済みの英語本文からの翻訳（ja含む）。

id: scp-033

title:
  en: "SCP-033"
  ja: "SCP-033"
  cs: "SCP-033"
