  scp-5000:
    name: "SCP-5000"
    appearance: >
      A damaged non-functional mechanical suit called the Absolute Exclusion Harness,
      armored, sealed, human-sized, with internal archival storage.
    default_look: >
      Deactivated and stored under Foundation examination.
panels:
  - scene: >
      A damaged human-sized mechanical suit lies deactivated in a secure Site-22 storage unit, illuminated by cold laboratory lights. No text.
    characters: [scp-5000]
    source: {section: Description, quote: "SCP-5000 is a non-functional mechanical suit identified within its internal schematics as an 'Absolute Exclusion Harness' designed by the SCP Foundation.", url: "https://scp-wiki.wikidot.com/scp-5000", fetched_at: "2026-09-21T00:00:00Z"}
    caption: &c1
      ja: "SCP-5000は、財団が設計した『Absolute Exclusion Harness』と識別される、機能停止した機械式スーツです。"
      en: "SCP-5000 is a non-functional mechanical suit identified as the Foundation-designed Absolute Exclusion Harness."
