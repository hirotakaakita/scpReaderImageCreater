  - scene: >
      Close-up cutaway of the damaged suit showing sealed armor, broken internal systems, and a surviving memory archive module. No readable interface text.
    characters: [scp-5000]
    source: {section: Description, quote: "Although SCP-5000 is believed to have once possessed a number of anomalous functions intended to protect and benefit its occupant, damage inflicted to it in the past means that it is currently only capable of basic file storage.", url: "https://scp-wiki.wikidot.com/scp-5000", fetched_at: "2026-09-21T00:00:00Z"}
    caption: &c2
      ja: "かつて装着者を守る複数の異常機能を持っていたと考えられますが、現在は損傷により基本的なファイル保存しかできません。"
      en: "It likely once had anomalous protective functions, but damage now leaves it capable only of basic file storage."
