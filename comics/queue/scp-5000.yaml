    characters: [scp-5000]
    source: {section: Description, quote: "SCP-5000 first appeared in a flash of light within SCP-579's containment chamber at Site-62C on 12/04/2020, containing a corpse genetically identical to Foundation employee Pietro Wilson.", url: "https://scp-wiki.wikidot.com/scp-5000", fetched_at: "2026-09-21T00:00:00Z"}
    caption: &c3
      ja: "SCP-5000は2020年12月4日、SCP-579の収容室に閃光と共に出現し、内部にはPietro Wilsonと遺伝的に同一の死体がありました。"
      en: "SCP-5000 appeared in a flash of light inside SCP-579’s chamber, containing a corpse genetically identical to Pietro Wilson."
