# SCP-999「くすぐりオバケ」4コマ台本
# captionは記事本文（Special Containment Procedures / Description）からの引用。
# キャラにセリフは言わせない。

id: scp-999

title:
  en: "SCP-999: The Tickle Monster"
  ja: "SCP-999：くすぐりオバケ"
  cs: "SCP-999: Lechtací příšera"
  de: "SCP-999: Das Kitzelmonster"
  es: "SCP-999: El monstruo de las cosquillas"
  fr: "SCP-999 : Le monstre chatouilleur"
  it: "SCP-999: Il mostro del solletico"
  ko: "SCP-999: 간지럼 괴물"
  pl: "SCP-999: Łaskoczący potwór"
  pt: "SCP-999: O Monstro das Cócegas"
  th: "SCP-999: อสูรกายจั๊กจี้"
  uk: "SCP-999: Лоскотливе чудовисько"
  vi: "SCP-999: Quái vật cù lét"
  zh: "SCP-999：挠痒怪"
  zh_Hant: "SCP-999：搔癢怪"

attribution:
  article: "SCP-999"
  author: "ProfSnider"
  source_url: "http://scp-wiki.wikidot.com/scp-999"
  license: "CC BY-SA 3.0"

object_class: Safe

local_characters:
  scp-999:
    name: SCP-999
    description: >
      SCP-999, a large, amorphous, gelatinous mass of translucent orange
      slime (color RGB 235,140,45) with a soft, glossy surface. At rest it
      forms a rounded, flattened dome shape roughly 2 meters wide and 1
      meter tall; when active it extends multiple rounded, tentacle-like
      pseudopods from its body. It has no eyes, face, or other features —
      just the smooth slime mass and its pseudopods.

characters: [scp-999, attending-researcher-m]

panels:
  - scene: >
      Wide shot, full body, eye level, showing the whole holding pen. In
      the center of the clean pen, SCP-999 rests as a rounded, flattened
      dome of translucent orange slime about 2 meters wide. On the right
      side of the frame, Attending Researcher (M) stands just outside the
      pen, looking in through an observation window with a clipboard in
      hand.
    characters: [scp-999, attending-researcher-m]
    caption:
      ja: "SCP-999は半透明のオレンジ色をした粘液の、無定形で膠状の巨大な塊であり、体重は約54kg（120ポンド）、粘度はピーナッツバターに似ている。静止時、SCP-999は丸みを帯びた扁平なドーム状になり、幅約2メートル、高さ約1メートルとなる。"
      en: "SCP-999 appears to be a large, amorphous, gelatinous mass of translucent orange slime, weighing about 54 kg (120 lbs) with a consistency similar to that of peanut butter. When at rest, SCP-999 becomes a rounded, oblate dome roughly 2 meters wide and 1 meter in height."
      cs: "SCP-999 je velká, beztvará, rosolovitá hmota průsvitného oranžového slizu o hmotnosti přibližně 54 kg (120 liber), s konzistencí podobnou arašídovému máslu. V klidu se SCP-999 stává zaobleným, zploštělým kupolovitým útvarem širokým zhruba 2 metry a vysokým 1 metr."
      de: "SCP-999 erscheint als große, amorphe, gallertartige Masse aus durchscheinendem orangefarbenem Schleim mit einem Gewicht von etwa 54 kg (120 lbs) und einer Konsistenz ähnlich der von Erdnussbutter. Im Ruhezustand nimmt SCP-999 die Form einer abgerundeten, ovalen Kuppel von etwa 2 Metern Breite und 1 Meter Höhe an."
      es: "SCP-999 parece ser una masa grande, amorfa y gelatinosa de baba anaranjada translúcida, con un peso de unos 54 kg (120 lbs) y una consistencia similar a la de la mantequilla de maní. En reposo, SCP-999 adopta la forma de una cúpula redondeada y achatada de aproximadamente 2 metros de ancho y 1 metro de altura."
      fr: "SCP-999 se présente comme une grande masse amorphe et gélatineuse de bave orange translucide, pesant environ 54 kg (120 lbs), avec une consistance semblable à celle du beurre de cacahuète. Au repos, SCP-999 prend la forme d'un dôme arrondi et aplati d'environ 2 mètres de large et 1 mètre de haut."
      it: "SCP-999 appare come una grande massa amorfa e gelatinosa di melma arancione traslucida, del peso di circa 54 kg (120 libbre), con una consistenza simile a quella del burro di arachidi. A riposo, SCP-999 assume la forma di una cupola arrotondata e appiattita, larga circa 2 metri e alta 1 metro."
      ko: "SCP-999는 반투명한 주황색 점액질로 이루어진 크고 무정형의 젤라틴 같은 덩어리로, 무게는 약 54kg(120파운드)이며 땅콩버터와 비슷한 점도를 가진다. 정지 상태일 때 SCP-999는 폭 약 2미터, 높이 약 1미터의 둥글고 납작한 돔 형태가 된다."
      pl: "SCP-999 wygląda jak duża, bezkształtna, galaretowata masa półprzezroczystego pomarańczowego śluzu, ważąca około 54 kg (120 funtów), o konsystencji przypominającej masło orzechowe. W spoczynku SCP-999 przyjmuje formę zaokrąglonej, spłaszczonej kopuły o szerokości około 2 metrów i wysokości 1 metra."
      pt: "SCP-999 aparenta ser uma grande massa amorfa e gelatinosa de gosma laranja translúcida, pesando cerca de 54 kg (120 lbs), com consistência semelhante à manteiga de amendoim. Em repouso, SCP-999 assume a forma de uma cúpula arredondada e achatada, com cerca de 2 metros de largura e 1 metro de altura."
      th: "SCP-999 มีลักษณะเป็นก้อนเมือกสีส้มโปร่งแสงขนาดใหญ่ ไร้รูปทรงแน่นอนคล้ายวุ้น มีน้ำหนักประมาณ 54 กก. (120 ปอนด์) และมีความข้นหนืดคล้ายเนยถั่ว เมื่ออยู่นิ่ง SCP-999 จะมีรูปร่างเป็นโดมกลมแบนกว้างประมาณ 2 เมตร สูงประมาณ 1 เมตร"
      uk: "SCP-999 являє собою велику безформну желеподібну масу напівпрозорого помаранчевого слизу вагою близько 54 кг (120 фунтів), консистенцією схожу на арахісове масло. У стані спокою SCP-999 набуває форми округлого сплюснутого купола шириною близько 2 метрів і висотою 1 метр."
      vi: "SCP-999 là một khối chất nhầy màu cam trong suốt, vô định hình và giống thạch, nặng khoảng 54 kg (120 lbs), có độ đặc tương tự bơ đậu phộng. Khi ở trạng thái nghỉ, SCP-999 có hình dạng vòm tròn dẹt, rộng khoảng 2 mét và cao 1 mét."
      zh: "SCP-999似乎是一大团无固定形态、半透明橙色黏液构成的胶状物质，重约54千克（120磅），质地类似花生酱。静止时，SCP-999呈圆形扁平穹顶状，宽约2米，高约1米。"
      zh_Hant: "SCP-999似乎是一大團無固定形態、半透明橙色黏液構成的膠狀物質，重約54公斤（120磅），質地類似花生醬。靜止時，SCP-999呈圓形扁平穹頂狀，寬約2公尺，高約1公尺。"

  - scene: >
      Medium shot, waist-up, slightly low angle. On the left side of the
      frame, Attending Researcher (M) has just stepped through the pen
      door, arms flung up in startled surprise. On the right side of the
      frame, SCP-999 is airborne mid-leap toward him, two pseudopods
      already wrapping around his shoulders in a hug and a third pseudopod
      reaching for his face.
    characters: [attending-researcher-m, scp-999]
    caption:
      ja: "対象の気質は「遊び好きで犬のよう」と表現するのが最も適切である。近づかれるとSCP-999はしばしば強い喜びを示し、最寄りの人物のもとへ這い寄って飛びつき、一対の仮足で相手を「抱きしめ」ながら、3本目の仮足で顔をすり寄せる。"
      en: "Subject's temperament is best described as playful and dog-like: when approached, SCP-999 will often react with overwhelming elation, slithering over to the nearest person and leaping upon them, 'hugging' them with a pair of pseudopods while nuzzling the person's face with a third pseudopod."
      cs: "Temperament subjektu lze nejlépe popsat jako hravý a psí povahy: když se k němu někdo přiblíží, SCP-999 často reaguje s ohromující radostí, připlazí se k nejbližší osobě a skočí na ni, 'obejme' ji dvojicí panožek a zároveň se třetí panožkou otírá o obličej dané osoby."
      de: "Das Temperament des Subjekts lässt sich am besten als verspielt und hundeähnlich beschreiben: Bei Annäherung reagiert SCP-999 oft mit überwältigender Freude, gleitet zur nächststehenden Person und springt sie an, wobei es sie mit einem Paar Pseudopodien 'umarmt' und mit einem dritten Pseudopodium ihr Gesicht beschmust."
      es: "El temperamento del sujeto se describe mejor como juguetón y parecido al de un perro: al ser abordado, SCP-999 suele reaccionar con una euforia abrumadora, deslizándose hacia la persona más cercana y saltando sobre ella, 'abrazándola' con un par de pseudópodos mientras le acaricia el rostro con un tercer pseudópodo."
      fr: "Le tempérament du sujet peut être décrit comme joueur et semblable à celui d'un chien : lorsqu'on l'approche, SCP-999 réagit souvent avec une euphorie débordante, glissant vers la personne la plus proche et bondissant sur elle, la « serrant dans ses bras » à l'aide d'une paire de pseudopodes tout en lui caressant le visage avec un troisième."
      it: "Il temperamento del soggetto è meglio descritto come giocoso e simile a quello di un cane: quando viene avvicinato, SCP-999 reagisce spesso con un'euforia travolgente, scivolando verso la persona più vicina e saltandole addosso, 'abbracciandola' con un paio di pseudopodi mentre le strofina il viso con un terzo pseudopodo."
      ko: "대상의 기질은 '장난기 많고 개와 같다'고 표현하는 것이 가장 적절하다. 다가가면 SCP-999는 종종 압도적인 환희로 반응하며, 가장 가까이 있는 사람에게 미끄러져 다가가 뛰어올라 한 쌍의 위족으로 그 사람을 '껴안고' 세 번째 위족으로 얼굴을 비빈다."
      pl: "Temperament osobnika najlepiej opisać jako zabawowy i przypominający psa: gdy ktoś się zbliży, SCP-999 często reaguje z przytłaczającą radością, przesuwając się do najbliższej osoby i skacząc na nią, 'przytulając' ją parą pseudonóżek, jednocześnie ocierając się trzecią pseudonóżką o twarz tej osoby."
      pt: "O temperamento do sujeito é melhor descrito como brincalhão e semelhante ao de um cão: ao ser abordado, SCP-999 costuma reagir com euforia avassaladora, deslizando até a pessoa mais próxima e saltando sobre ela, 'abraçando-a' com um par de pseudópodes enquanto acaricia o rosto da pessoa com um terceiro pseudópode."
      th: "อุปนิสัยของตัวอย่างอาจอธิบายได้ดีที่สุดว่าขี้เล่นและคล้ายสุนัข เมื่อมีผู้เข้าใกล้ SCP-999 มักตอบสนองด้วยความปีติล้นเหลือ เลื้อยเข้าหาผู้ที่อยู่ใกล้ที่สุดแล้วกระโดดเข้าใส่ 'กอด' บุคคลนั้นด้วยขาเทียมคู่หนึ่ง พร้อมทั้งใช้ขาเทียมที่สามถูใบหน้าของบุคคลนั้น"
      uk: "Темперамент об'єкта найкраще описати як грайливий і схожий на собачий: коли хтось наближається, SCP-999 часто реагує з надмірним захватом, підповзаючи до найближчої людини та стрибаючи на неї, 'обіймаючи' її парою псевдоніжок і водночас треться об обличчя людини третьою псевдоніжкою."
      vi: "Tính khí của đối tượng được mô tả chính xác nhất là tinh nghịch và giống loài chó: khi có người đến gần, SCP-999 thường phản ứng với sự phấn khích tột độ, trườn đến người gần nhất và nhảy chồm lên họ, 'ôm' họ bằng một cặp chân giả trong khi cọ mặt người đó bằng chân giả thứ ba."
      zh: "对象的性情最恰当的描述是顽皮、如犬类一般：当有人靠近时，SCP-999常表现出难以抑制的狂喜，滑向离它最近的人并扑上去，用一对伪足「拥抱」对方，同时用第三条伪足蹭对方的脸。"
      zh_Hant: "對象的性情最恰當的描述是頑皮、如犬類一般：當有人靠近時，SCP-999常表現出難以抑制的狂喜，滑向離牠最近的人並撲上去，用一對偽足「擁抱」對方，同時用第三條偽足蹭對方的臉。"

  - scene: >
      Close-up shot on his face, filling most of the frame, cropped at the
      shoulders. Attending Researcher (M)'s head pokes out from a mass of
      translucent orange slime that has completely enveloped him from the
      neck down; his eyes are squeezed shut and his mouth is wide open in
      helpless laughter, tears of joy at the corners of his eyes.
    characters: [attending-researcher-m, scp-999]
    caption:
      ja: "SCP-999の表面に触れるだけで、即座に軽い多幸感が生じ、接触時間が長くなるほどその効果は強まる。対象が最も好む活動は「くすぐりレスリング」であり、しばしば人物を首から下まで完全に包み込み、やめるよう頼まれるまでくすぐり続ける（ただし、頼んだからといって必ずしもすぐには応じない）。"
      en: "Simply touching SCP-999's surface causes an immediate mild euphoria, which intensifies the longer one is exposed to SCP-999. Subject's favorite activity is 'tickle-wrestling', often by completely enveloping a person from the neck down and tickling them until asked to stop (though it does not always immediately comply with this request)."
      cs: "Pouhý dotyk povrchu SCP-999 vyvolá okamžitou mírnou euforii, která se prohlubuje čím déle je subjektu vystaven. Oblíbenou činností subjektu je 'lechtací zápas', při němž osobu často zcela obalí od krku dolů a lechtá ji, dokud není požádán, aby přestal (ačkoli tomuto požadavku ne vždy okamžitě vyhoví)."
      de: "Bereits die Berührung der Oberfläche von SCP-999 verursacht eine sofortige, leichte Euphorie, die sich verstärkt, je länger man SCP-999 ausgesetzt ist. Die Lieblingsbeschäftigung des Subjekts ist das 'Kitzelringen', bei dem es eine Person oft vollständig vom Hals abwärts einhüllt und sie kitzelt, bis es gebeten wird aufzuhören (wobei es dieser Bitte nicht immer sofort nachkommt)."
      es: "El simple hecho de tocar la superficie de SCP-999 provoca una euforia leve e inmediata, que se intensifica cuanto más tiempo se está expuesto a SCP-999. La actividad favorita del sujeto es la 'lucha de cosquillas', que a menudo consiste en envolver por completo a una persona desde el cuello hacia abajo y hacerle cosquillas hasta que se le pide que pare (aunque no siempre obedece esa petición de inmediato)."
      fr: "Le simple fait de toucher la surface de SCP-999 provoque une légère euphorie immédiate, qui s'intensifie plus longtemps on y est exposé. L'activité préférée du sujet est la « lutte chatouilleuse », qui consiste souvent à envelopper entièrement une personne du cou jusqu'aux pieds et à la chatouiller jusqu'à ce qu'on lui demande d'arrêter (bien qu'il ne se conforme pas toujours immédiatement à cette demande)."
      it: "Il semplice contatto con la superficie di SCP-999 provoca un'euforia lieve e immediata, che si intensifica quanto più a lungo si è esposti a SCP-999. L'attività preferita del soggetto è la 'lotta del solletico', che spesso consiste nell'avvolgere completamente una persona dal collo in giù e farle il solletico finché non le viene chiesto di smettere (sebbene non sempre obbedisca subito a questa richiesta)."
      ko: "SCP-999의 표면에 닿기만 해도 즉시 가벼운 도취감이 발생하며, 노출 시간이 길어질수록 그 효과는 강해진다. 대상이 가장 좋아하는 활동은 '간지럼 레슬링'으로, 종종 사람을 목 아래로 완전히 감싼 뒤 멈춰 달라는 요청이 있을 때까지 간지럽힌다(다만 그 요청에 항상 즉시 응하지는 않는다)."
      pl: "Samo dotknięcie powierzchni SCP-999 wywołuje natychmiastową łagodną euforię, która nasila się wraz z czasem ekspozycji na SCP-999. Ulubioną czynnością osobnika jest 'łaskotliwa walka', podczas której często całkowicie otacza osobę od szyi w dół i łaskocze ją, dopóki nie zostanie poproszony o przerwanie (choć nie zawsze natychmiast spełnia tę prośbę)."
      pt: "O simples toque na superfície de SCP-999 provoca uma euforia leve e imediata, que se intensifica quanto mais tempo a pessoa fica exposta a SCP-999. A atividade favorita do sujeito é a 'luta de cócegas', envolvendo frequentemente a pessoa por completo, do pescoço para baixo, fazendo cócegas até que lhe peçam para parar (embora nem sempre obedeça de imediato a esse pedido)."
      th: "เพียงแค่สัมผัสพื้นผิวของ SCP-999 ก็จะทำให้เกิดความรู้สึกเคลิบเคลิ้มเล็กน้อยในทันที ซึ่งจะยิ่งรุนแรงขึ้นเมื่อสัมผัสนานขึ้น กิจกรรมโปรดของตัวอย่างคือ 'มวยปล้ำจั๊กจี้' โดยมักจะห่อหุ้มบุคคลตั้งแต่คอลงไปจนมิด แล้วจั๊กจี้จนกว่าจะถูกขอให้หยุด (แม้ว่าจะไม่ยอมทำตามคำขอนั้นทันทีเสมอไป)"
      uk: "Просто торкнувшись поверхні SCP-999, людина одразу відчуває легку ейфорію, яка посилюється що довше триває контакт із SCP-999. Улюблене заняття об'єкта — 'лоскотлива боротьба': він часто повністю огортає людину від шиї донизу і лоскоче її, доки його не попросять зупинитися (хоча він не завжди виконує це прохання одразу)."
      vi: "Chỉ cần chạm vào bề mặt của SCP-999 sẽ ngay lập tức gây ra cảm giác hưng phấn nhẹ, và cảm giác này càng tăng khi tiếp xúc càng lâu. Hoạt động yêu thích của đối tượng là 'vật lộn cù lét', thường bằng cách bao trùm hoàn toàn một người từ cổ trở xuống và cù người đó cho đến khi được yêu cầu dừng lại (mặc dù nó không phải lúc nào cũng tuân theo yêu cầu này ngay lập tức)."
      zh: "只需触碰SCP-999的表面，就会立即产生轻度的欣快感，且接触时间越长，这种效果越强烈。对象最喜欢的活动是「挠痒摔跤」，常常将人从脖子以下完全包裹住，不断挠痒直到对方要求停止为止（尽管它并不总是立刻服从这一要求）。"
      zh_Hant: "只需觸碰SCP-999的表面，就會立即產生輕度的欣快感，且接觸時間越長，這種效果越強烈。對象最喜歡的活動是「搔癢摔跤」，常常將人從脖子以下完全包裹住，不斷搔癢直到對方要求停止為止（儘管牠並不總是立刻服從這項要求）。"

  - scene: >
      Wide shot, full body, eye level, pulled back to show the whole pen
      again. On the left side of the frame, Attending Researcher (M) sits
      on the floor, one hand rubbing a bumped elbow, still smiling despite
      the wince. On the right side of the frame, SCP-999 has drawn back
      into a small quivering mound of orange slime, held low and hesitant.
    characters: [attending-researcher-m, scp-999]
    caption:
      ja: "負傷が生じることはあるものの、SCP-999が故意に他者を傷つけようとした事例はこれまで確認されていない。誤って誰かを傷つけると、SCP-999は即座に後ずさりして身を震える塊状に縮こまらせ、犬がクンクン鳴くような声を上げる。それはまるで「謝罪」しているかのようである。"
      en: "Though injuries may occur, SCP-999 has never been found to purposefully attempt to harm others, and will immediately back away and contract its body into a quivering mound while gurgling in a manner similar to a whimpering dog, seemingly 'apologizing' for hurting someone on accident."
      cs: "Ačkoli může dojít ke zraněním, nikdy nebylo zjištěno, že by se SCP-999 úmyslně pokoušel někomu ublížit. Namísto toho okamžitě ucouvne a stáhne se do chvějícího se chumlu, přičemž vydává klokotavé zvuky podobné kňučení psa, jako by se 'omlouval' za to, že někoho nešťastnou náhodou zranil."
      de: "Obwohl es zu Verletzungen kommen kann, wurde nie festgestellt, dass SCP-999 absichtlich versucht, andere zu verletzen. Es weicht sofort zurück und zieht seinen Körper zu einem zitternden Haufen zusammen, wobei es gluckernde Laute von sich gibt, ähnlich einem winselnden Hund, als würde es sich dafür 'entschuldigen', jemanden versehentlich verletzt zu haben."
      es: "Aunque pueden producirse lesiones, nunca se ha comprobado que SCP-999 intente hacer daño a otros de forma deliberada; de inmediato retrocede y contrae su cuerpo en un montículo tembloroso mientras emite un gorgoteo similar al gemido de un perro, como si se 'disculpara' por haber lastimado a alguien por accidente."
      fr: "Bien que des blessures puissent survenir, il n'a jamais été établi que SCP-999 cherche délibérément à blesser autrui ; il recule alors immédiatement et contracte son corps en un monticule tremblant tout en émettant des gargouillis semblables aux gémissements d'un chien, semblant ainsi « s'excuser » d'avoir blessé quelqu'un par accident."
      it: "Sebbene possano verificarsi lesioni, non è mai stato accertato che SCP-999 tenti deliberatamente di ferire gli altri: in tal caso arretra immediatamente e contrae il proprio corpo in un cumulo tremante, emettendo gorgoglii simili al guaito di un cane, come se si stesse 'scusando' per aver ferito qualcuno per errore."
      ko: "부상이 발생할 수는 있지만, SCP-999가 고의로 타인에게 해를 끼치려 한 사례는 확인된 바 없다. 사고로 누군가를 다치게 하면 즉시 뒤로 물러나 몸을 떨리는 덩어리 모양으로 움츠리며, 낑낑대는 개와 비슷한 꾸르륵거리는 소리를 낸다. 이는 마치 '사과'하는 것처럼 보인다."
      pl: "Choć mogą wystąpić obrażenia, nigdy nie stwierdzono, by SCP-999 celowo próbował skrzywdzić innych; natychmiast się wtedy cofa i kurczy swoje ciało w drżącą bryłę, wydając bulgoczące dźwięki przypominające skowyt psa, jakby 'przepraszał' za przypadkowe zranienie kogoś."
      pt: "Embora possam ocorrer ferimentos, nunca se constatou que SCP-999 tentasse deliberadamente machucar outras pessoas, recuando imediatamente e contraindo o corpo em um monte trêmulo, emitindo sons borbulhantes semelhantes ao lamento de um cão, como se estivesse 'pedindo desculpas' por ter machucado alguém sem querer."
      th: "แม้อาจเกิดการบาดเจ็บขึ้นได้ แต่ไม่เคยพบว่า SCP-999 จงใจพยายามทำร้ายผู้อื่น โดยมันจะถอยออกทันทีและหดตัวเป็นก้อนสั่นเทา พร้อมส่งเสียงพึมพำคล้ายเสียงสุนัขครวญคราง ราวกับกำลัง 'ขอโทษ' ที่ทำให้ใครบางคนบาดเจ็บโดยไม่ได้ตั้งใจ"
      uk: "Хоча травми можуть траплятися, ніколи не було зафіксовано, щоб SCP-999 навмисно намагався завдати шкоди іншим: він одразу відступає і стягує своє тіло в тремтячу купу, видаючи булькотливі звуки, схожі на скавуління собаки, ніби 'перепрошуючи' за те, що випадково когось поранив."
      vi: "Mặc dù có thể xảy ra thương tích, chưa từng phát hiện SCP-999 cố ý làm hại người khác; nó sẽ ngay lập tức lùi lại và co rúm cơ thể thành một đống run rẩy trong khi phát ra tiếng ục ục giống tiếng rên rỉ của một con chó, dường như đang 'xin lỗi' vì đã vô tình làm ai đó bị thương."
      zh: "尽管可能造成伤害，但从未发现SCP-999故意试图伤害他人；一旦意外伤到某人，它会立刻后退，将身体蜷缩成颤抖的一团，发出类似狗呜咽的咕噜声，仿佛在「道歉」。"
      zh_Hant: "儘管可能造成傷害，但從未發現SCP-999故意試圖傷害他人；一旦意外傷到某人，牠會立刻後退，將身體蜷縮成顫抖的一團，發出類似狗嗚咽的咕嚕聲，彷彿在「道歉」。"

addendum:
  ja: "補遺：SCP-999にカフェイン入りの清涼飲料水を与えてはならない。"
  en: "Addendum: SCP-999 is not to be given caffeinated soft drinks of any kind."
  cs: "Dodatek: SCP-999 nesmí být podávány žádné kofeinové nealkoholické nápoje."
  de: "Anhang: SCP-999 dürfen keinerlei koffeinhaltige Erfrischungsgetränke verabreicht werden."
  es: "Adenda: No se debe dar a SCP-999 ningún tipo de refresco con cafeína."
  fr: "Addendum : SCP-999 ne doit recevoir aucune boisson gazeuse contenant de la caféine."
  it: "Addendum: A SCP-999 non deve essere somministrata alcuna bevanda gassata contenente caffeina."
  ko: "부록: SCP-999에게는 어떠한 카페인이 함유된 청량음료도 주어서는 안 된다."
  pl: "Aneks: SCP-999 nie wolno podawać żadnych napojów gazowanych zawierających kofeinę."
  pt: "Adendo: SCP-999 não deve receber nenhum tipo de refrigerante com cafeína."
  th: "ภาคผนวก: ห้ามให้เครื่องดื่มอัดลมที่มีคาเฟอีนทุกชนิดแก่ SCP-999"
  uk: "Додаток: SCP-999 не можна давати жодних кофеїновмісних газованих напоїв."
  vi: "Phụ lục: Không được cho SCP-999 uống bất kỳ loại nước ngọt có chứa caffeine nào."
  zh: "补遗：不得给予SCP-999任何含咖啡因的碳酸饮料。"
  zh_Hant: "補遺：不得給予SCP-999任何含咖啡因的碳酸飲料。"
