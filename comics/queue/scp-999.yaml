# SCP-999「くすぐりオバケ」4コマ台本
# 絵柄はconfig/style.yaml、キャラの見た目はconfig/characters.yamlで定義される。
# キャラにセリフは言わせない。各コマの絵は、そのコマのcaption（記事原文に近い引用）を
# 視覚化する背景として機能させる。captionを4コマに分割して記事の流れを追う。

id: scp-999

title:
  en: "SCP-999: The Tickle Monster"
  ja: "SCP-999：くすぐりオバケ"
  cs: "SCP-999: Lechtací monstrum"
  de: "SCP-999: Das Kitzelmonster"
  es: "SCP-999: El monstruo de las cosquillas"
  fr: "SCP-999 : Le monstre chatouilleur"
  it: "SCP-999: Il mostro del solletico"
  ko: "SCP-999: 간지럼 괴물"
  pl: "SCP-999: Potwór łaskotek"
  pt: "SCP-999: O monstro das cócegas"
  th: "SCP-999: สัตว์ประหลาดจั๊กจี้"
  uk: "SCP-999: Монстр-лоскотун"
  vi: "SCP-999: Quái vật thọc lét"
  zh: "SCP-999：挠痒怪"
  zh_Hant: "SCP-999：搔癢怪"

attribution:
  article: "SCP-999"
  author: "ProfSnider"
  source_url: "http://scp-wiki.wikidot.com/scp-999"
  license: "CC BY-SA 3.0"

object_class: Safe

characters: [researcher-hana]

panels:
  - scene: >
      Wide shot, full body, eye level. A quiet holding pen area at night.
      SCP-999, a translucent orange gelatinous slime creature about the
      size of a large dog with two simple dot eyes, rests quietly in a
      corner. Dr. Hana stands at a clipboard nearby, glancing at it while
      writing notes, computer monitor glow in the background.
    characters: [researcher-hana]
    caption:
      ja: "SCP-999は半透明のオレンジ色の粘液から成る、体重約54kgの移動可能な塊である。"
      en: "SCP-999 is a mobile mass of translucent orange, gelatinous slime weighing approximately 54 kilograms."
      cs: "SCP-999 je pohyblivá hmota průsvitného oranžového rosolovitého slizu o hmotnosti přibližně 54 kilogramů."
      de: "SCP-999 ist eine bewegliche Masse aus durchscheinendem orangefarbenem, gallertartigem Schleim mit einem Gewicht von etwa 54 Kilogramm."
      es: "SCP-999 es una masa móvil de baba gelatinosa translúcida de color naranja que pesa aproximadamente 54 kilogramos."
      fr: "SCP-999 est une masse mobile de gel translucide orange, gélatineuse, pesant environ 54 kilogrammes."
      it: "SCP-999 è una massa mobile di melma gelatinosa traslucida arancione del peso di circa 54 chilogrammi."
      ko: "SCP-999는 반투명한 주황색 젤라틴 형태의 점액으로 이루어진, 약 54kg의 이동 가능한 덩어리이다."
      pl: "SCP-999 to ruchoma masa półprzezroczystego, pomarańczowego, galaretowatego śluzu ważąca około 54 kilogramów."
      pt: "SCP-999 é uma massa móvel de gosma gelatinosa translúcida e alaranjada, pesando cerca de 54 quilogramas."
      th: "SCP-999 คือก้อนเมือกเจลาตินสีส้มโปร่งแสงที่เคลื่อนที่ได้ มีน้ำหนักประมาณ 54 กิโลกรัม"
      uk: "SCP-999 — рухома маса напівпрозорого помаранчевого драглистого слизу вагою приблизно 54 кілограми."
      vi: "SCP-999 là một khối chất nhầy dạng keo màu cam trong suốt có thể di chuyển được, nặng khoảng 54 kg."
      zh: "SCP-999是一团可移动的半透明橙色胶状黏液，体重约54千克。"
      zh_Hant: "SCP-999是一團可移動的半透明橙色膠狀黏液，體重約54公斤。"

  - scene: >
      Medium shot, waist-up, low angle from the corridor floor. SCP-999
      wobbles happily down a facility corridor of its own accord, leaving
      a faint shiny trail. Dr. Hana leans out from an office doorway
      further down the hall, glancing over in mild surprise but not
      alarmed.
    characters: [researcher-hana]
    caption:
      ja: "SCP-999は、望めば施設内を自由に歩き回ることが許可されている。"
      en: "SCP-999 is allowed to freely roam the facility should it desire to."
      cs: "SCP-999 smí volně procházet zařízením, pokud si to přeje."
      de: "SCP-999 darf sich frei in der Einrichtung bewegen, sofern es dies wünscht."
      es: "SCP-999 tiene permitido deambular libremente por las instalaciones si así lo desea."
      fr: "SCP-999 est autorisé à se déplacer librement dans l'installation s'il le souhaite."
      it: "A SCP-999 è consentito muoversi liberamente nella struttura se lo desidera."
      ko: "SCP-999는 원할 경우 시설 내를 자유롭게 돌아다니는 것이 허용된다."
      pl: "SCP-999 może swobodnie poruszać się po placówce, jeśli tego zechce."
      pt: "SCP-999 tem permissão para vagar livremente pelas instalações caso deseje."
      th: "SCP-999 ได้รับอนุญาตให้เดินเตร่ไปทั่วสถานที่ได้อย่างอิสระหากต้องการ"
      uk: "SCP-999 дозволено вільно пересуватися об'єктом, якщо воно того забажає."
      vi: "SCP-999 được phép tự do đi lại khắp cơ sở nếu nó muốn."
      zh: "如果SCP-999愿意，允许其在设施内自由走动。"
      zh_Hant: "如果SCP-999願意，允許其在設施內自由走動。"

  - scene: >
      Close-up shot centered on Dr. Hana's face and shoulders, filling most
      of the frame. The orange slime has pounced onto her; she bursts out
      laughing with tears in her eyes, glasses askew, papers flying
      everywhere. Dynamic comedic action.
    characters: [researcher-hana]
    caption:
      ja: "SCP-999との接触は、対象に即座に強い多幸感をもたらすことが確認されている。"
      en: "The touch of SCP-999 has proven capable of inducing an immediate state of euphoria in a subject."
      cs: "Bylo prokázáno, že dotek SCP-999 dokáže u subjektu vyvolat okamžitý stav euforie."
      de: "Es wurde nachgewiesen, dass die Berührung von SCP-999 bei einem Subjekt einen sofortigen Zustand der Euphorie auslösen kann."
      es: "Se ha comprobado que el contacto con SCP-999 puede inducir un estado inmediato de euforia en el sujeto."
      fr: "Il a été démontré que le contact avec SCP-999 peut provoquer un état immédiat d'euphorie chez le sujet."
      it: "È stato dimostrato che il contatto con SCP-999 può indurre nel soggetto uno stato immediato di euforia."
      ko: "SCP-999와의 접촉은 대상에게 즉각적인 행복감을 유발할 수 있는 것으로 확인되었다."
      pl: "Udowodniono, że dotyk SCP-999 potrafi wywołać u obiektu natychmiastowy stan euforii."
      pt: "Comprovou-se que o toque de SCP-999 é capaz de induzir um estado imediato de euforia no sujeito."
      th: "พิสูจน์แล้วว่าการสัมผัส SCP-999 สามารถกระตุ้นให้เกิดความรู้สึกเคลิบเคลิ้มขึ้นทันทีในตัวบุคคล"
      uk: "Доведено, що дотик SCP-999 здатен викликати у суб'єкта миттєвий стан ейфорії."
      vi: "Đã chứng minh rằng việc chạm vào SCP-999 có thể gây ra trạng thái hưng phấn tức thì ở đối tượng."
      zh: "已证实与SCP-999的接触能够立即引发对象产生欣快状态。"
      zh_Hant: "已證實與SCP-999的接觸能夠立即引發對象產生欣快狀態。"

  - scene: >
      Wide shot, full body, eye level, pulled back to show the whole office.
      Dr. Hana sits alone on the floor, completely relaxed and smiling
      peacefully, wiping a happy tear. The orange slime has already
      wandered a short distance away toward the door, glancing back at her.
      The scattered papers lie forgotten around her.
    characters: [researcher-hana]
    caption:
      ja: "この多幸感は、SCP-999との接触が終わった後も、しばらく持続することが確認されている。"
      en: "This euphoric effect has been shown to persist for a period of time after contact with SCP-999 has ceased."
      cs: "Bylo prokázáno, že tento euforický efekt přetrvává i po ukončení kontaktu se SCP-999."
      de: "Es wurde gezeigt, dass dieser euphorische Effekt auch nach Beendigung des Kontakts mit SCP-999 noch eine Zeit lang anhält."
      es: "Se ha demostrado que este efecto eufórico persiste durante un tiempo después de que cesa el contacto con SCP-999."
      fr: "Il a été démontré que cet effet euphorique persiste un certain temps après la fin du contact avec SCP-999."
      it: "È stato dimostrato che questo effetto euforico persiste per un periodo di tempo dopo la cessazione del contatto con SCP-999."
      ko: "이 행복감 효과는 SCP-999와의 접촉이 끝난 후에도 한동안 지속되는 것으로 나타났다."
      pl: "Wykazano, że ten euforyczny efekt utrzymuje się przez pewien czas po zakończeniu kontaktu z SCP-999."
      pt: "Demonstrou-se que esse efeito eufórico persiste por um período após o fim do contato com SCP-999."
      th: "แสดงให้เห็นว่าความรู้สึกเคลิบเคลิ้มนี้ยังคงอยู่ต่อไปช่วงหนึ่งหลังจากการสัมผัส SCP-999 สิ้นสุดลง"
      uk: "Показано, що цей ейфоричний ефект зберігається деякий час після завершення контакту з SCP-999."
      vi: "Đã cho thấy hiệu ứng hưng phấn này còn kéo dài một thời gian sau khi việc tiếp xúc với SCP-999 kết thúc."
      zh: "已证实这种欣快效应在与SCP-999的接触结束后仍会持续一段时间。"
      zh_Hant: "已證實這種欣快效應在與SCP-999的接觸結束後仍會持續一段時間。"

# 最後のコマの下に置く補遺（省略可）
addendum:
  ja: "補遺999-J：当該研究員の報告書は粘液により判読不能となり、再提出が命じられた。"
  en: "Addendum 999-J: The researcher's report was rendered illegible by residual slime and resubmission was ordered."
  cs: "Dodatek 999-J: Hlášení výzkumníka bylo slizem znečitelněno; bylo nařízeno opětovné podání."
  de: "Anhang 999-J: Der Bericht des Forschers wurde durch Schleimrückstände unleserlich; eine erneute Einreichung wurde angeordnet."
  es: "Adenda 999-J: El informe del investigador quedó ilegible por residuos de la sustancia; se ordenó su reenvío."
  fr: "Addendum 999-J : Le rapport du chercheur a été rendu illisible par des résidus de gel ; un nouvel envoi a été ordonné."
  it: "Addendum 999-J: Il rapporto del ricercatore è stato reso illeggibile dal residuo gelatinoso; ne è stata ordinata la nuova presentazione."
  ko: "부록 999-J: 해당 연구원의 보고서는 잔여 점액으로 인해 판독 불가능해져 재제출이 명령되었다."
  pl: "Aneks 999-J: Raport badacza stał się nieczytelny z powodu pozostałości śluzu; nakazano ponowne złożenie."
  pt: "Adendo 999-J: O relatório do pesquisador ficou ilegível devido a resíduos de gosma; foi ordenada a reapresentação."
  th: "ภาคผนวก 999-J: รายงานของนักวิจัยอ่านไม่ออกเนื่องจากคราบเมือกตกค้าง จึงมีคำสั่งให้ส่งใหม่"
  uk: "Додаток 999-J: Звіт дослідника став нечитабельним через залишки слизу; наказано подати повторно."
  vi: "Phụ lục 999-J: Báo cáo của nhà nghiên cứu bị nhòe không đọc được do chất nhầy còn sót lại; đã ra lệnh nộp lại."
  zh: "补遗999-J：该研究员的报告因残留黏液而无法辨认，已被要求重新提交。"
  zh_Hant: "補遺999-J：該研究員的報告因殘留黏液而無法辨認，已被要求重新提交。"
