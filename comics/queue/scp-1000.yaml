  - scene: >
      Close anatomical study: SCP-1000's head and shoulders show large eyes, pronounced brow ridge,
      sagittal crest and heavy fur. Keep the image documentary, no labels or text.
    characters: [scp-1000]
    source:
      section: Description
      quote: "They have grey, brown, black, red, and occasionally white fur. They possess large eyes with good vision, a pronounced brow ridge, and a sagittal crest on the forehead similar to that of the gorilla"
      url: "https://scp-wiki.wikidot.com/scp-1000"
      fetched_at: "2026-09-21T00:00:00Z"
    caption:
      ja: "体毛は灰色、茶色、黒、赤、ときに白で、大きな目、発達した眉弓、ゴリラに似た矢状稜を持ちます。"
      en: "They have varied fur colors, large eyes, a pronounced brow ridge, and a gorilla-like sagittal crest."
