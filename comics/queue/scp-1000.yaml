  - scene: >
      Modern forest observation scene: a researcher watches a distant SCP-1000 through a camera monitor rather than directly,
      with tense caution and blank medical readouts. No readable text.
    characters: [scp-1000, attending-researcher-m]
    source:
      section: Description
      quote: "Any hominid that directly or indirectly observes any instance of SCP-1000 has a minimum 2% chance of being instantly killed through anomalous means via permanent cessation of brain function."
      url: "https://scp-wiki.wikidot.com/scp-1000"
      fetched_at: "2026-09-21T00:00:00Z"
    caption:
      ja: "SCP-1000を直接または間接的に観察したヒト科生物には、脳機能の永久停止により即死する最低2%の危険があります。"
      en: "Any hominid observing SCP-1000, even indirectly, has at least a 2 percent chance of instant death by permanent brain-function cessation."
