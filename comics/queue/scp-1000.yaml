  - scene: >
      Ancient-earth explanatory scene: a small band of SCP-1000 moves through a Pleistocene landscape
      while distant early humans remain separate in the background. No text, no labels.
    characters: [scp-1000]
    source:
      section: Description
      quote: "SCP-1000 evolved alongside Homo sapiens, existing contemporaneously with proto-humans and humans in large numbers until 10,000-15,000 years ago, when an extinction event eliminated all but 1-5% of their population."
      url: "https://scp-wiki.wikidot.com/scp-1000"
      fetched_at: "2026-09-21T00:00:00Z"
    caption:
      ja: "SCP-1000は人類と並行して進化し、1万〜1万5000年前の絶滅事象で個体数の大半を失いました。"
      en: "SCP-1000 evolved alongside humans until an extinction event 10,000 to 15,000 years ago left only 1 to 5 percent of them."
