local_characters:
  scp-1000:
    name: "SCP-1000"
    appearance: >
      A nocturnal omnivorous ape in the Hominini branch, adult size 1.5 to 3 meters tall,
      heavy body, large eyes, strong brow ridge, sagittal crest, and dark fur.
    default_look: >
      Alert, wary, partly hidden in a forest at night.
panels:
  - scene: >
      Night forest establishing shot: a tall ape-like SCP-1000 stands half-hidden among trees,
      much larger than a human silhouette, with dense dark fur and reflective large eyes. No text.
    characters: [scp-1000]
    source:
      section: Description
      quote: "SCP-1000 is a nocturnal, omnivorous ape, classified in the Hominini branch along with genera Pan and Homo. Adults range in size from 1.5 to 3 m in height, and weigh between 90 and 270 kg."
      url: "https://scp-wiki.wikidot.com/scp-1000"
      fetched_at: "2026-09-21T00:00:00Z"
    caption:
      ja: "SCP-1000は夜行性の雑食性類人猿で、成体は身長1.5〜3メートル、体重90〜270キログラムに達します。"
      en: "SCP-1000 is a nocturnal omnivorous ape; adults stand 1.5 to 3 meters tall and weigh 90 to 270 kilograms."
