# SCP-1233「月の勇者」4コマ台本
# キャラにセリフは言わせない。captionは記事本文からの引用。

id: scp-1233

title:
  en: "SCP-1233: The Moon Champion"
  ja: "SCP-1233：月の勇者"
  cs: "SCP-1233: Měsíční šampion"
  de: "SCP-1233: Der Mondchampion"
  es: "SCP-1233: El Campeón de la Luna"
  fr: "SCP-1233 : Le Champion de la Lune"
  it: "SCP-1233: Il Campione della Luna"
  ko: "SCP-1233: 달의 챔피언"
  pl: "SCP-1233: Mistrz Księżyca"
  pt: "SCP-1233: O Campeão da Lua"
  th: "SCP-1233: จอมทัพแห่งดวงจันทร์"
  uk: "SCP-1233: Місячний Чемпіон"
  vi: "SCP-1233: Nhà Vô Địch Mặt Trăng"
  zh: "SCP-1233：月之勇者"
  zh_Hant: "SCP-1233：月之勇者"

attribution:
  article: "SCP-1233"
  author: "CadaverCommander"
  source_url: "http://scp-wiki.wikidot.com/scp-1233"
  license: "CC BY-SA 3.0"

object_class: Keter

characters: [researcher-hana]

panels:
  - scene: >
      Wide shot, full body, low angle looking up so the figure looms
      large, filling most of the long facility hallway. A figure in a
      bulky vintage EMU-style spacesuit with an opaque visor and a
      jetpack marches in mid-stride, one fist raised triumphantly in the
      air. Dr. Hana is small in the corner of the frame with a clipboard,
      watching with a deadpan, unimpressed expression.
    characters: [researcher-hana]
    caption:
      ja: "SCP-1233は、不透明なバイザーと推進用ジェットパックを備えた与圧服型の装備をまとった人型実体である。"
      en: "SCP-1233 is a humanoid entity resembling an individual wearing an EMU-type spacesuit with an opaque visor and jetpack."
      cs: "SCP-1233 je humanoidní entita připomínající osobu v přetlakovém skafandru typu EMU s neprůhledným hledím a tryskovým batohem."
      de: "SCP-1233 ist eine humanoide Entität, die einer Person in einem druckanzugähnlichen EMU-Raumanzug mit undurchsichtigem Visier und Rückstoß-Rucksack ähnelt."
      es: "SCP-1233 es una entidad humanoide que se asemeja a una persona con un traje espacial tipo EMU, visor opaco y mochila propulsora."
      fr: "SCP-1233 est une entité humanoïde ressemblant à une personne portant une combinaison spatiale de type EMU avec visière opaque et propulseur dorsal."
      it: "SCP-1233 è un'entità umanoide che assomiglia a una persona che indossa una tuta spaziale di tipo EMU con visiera opaca e zaino propulsore."
      ko: "SCP-1233는 불투명한 바이저와 추진용 제트팩을 장착한 EMU형 우주복을 입은 사람처럼 보이는 인간형 실체이다."
      pl: "SCP-1233 to humanoidalna istota przypominająca osobę w skafandrze kosmicznym typu EMU z nieprzezroczystą szybą i plecakiem odrzutowym."
      pt: "SCP-1233 é uma entidade humanoide que se assemelha a uma pessoa usando um traje espacial tipo EMU com viseira opaca e mochila propulsora."
      th: "SCP-1233 คือสิ่งมีชีวิตรูปร่างคล้ายมนุษย์ที่ดูเหมือนสวมชุดอวกาศแบบ EMU พร้อมกระจกบังหน้าทึบแสงและเจ็ตแพ็คขับเคลื่อน"
      uk: "SCP-1233 — гуманоїдна сутність, схожа на людину в скафандрі типу EMU з непрозорим щитком і реактивним ранцем."
      vi: "SCP-1233 là một thực thể hình người trông giống một cá nhân mặc bộ đồ vũ trụ kiểu EMU với tấm che mặt mờ đục và ba lô phản lực."
      zh: "SCP-1233是一个外观酷似身穿EMU型加压宇航服、佩戴不透明面罩与喷气背包的人形实体。"
      zh_Hant: "SCP-1233是一個外觀酷似身穿EMU型加壓太空衣、佩戴不透明面罩與噴氣背包的人形實體。"

  - scene: >
      Medium shot, waist-up, side-on composition with the vending machine
      on one side and the spacesuited figure on the other. The figure
      snaps a crisp, formal salute directly at the humming vending
      machine, standing at rigid attention as if greeting a fellow
      soldier. Dr. Hana facepalms quietly in the background.
    characters: [researcher-hana]
    caption:
      ja: "SCP-1233は自らを『月の勇者、宇宙正義の守護者、悪の滅ぼす者』と称している。"
      en: "SCP-1233 claims to be \"champion of the Moon, defender of space justice and destroyer of evil.\""
      cs: "SCP-1233 se prohlašuje za „šampiona Měsíce, obránce vesmírné spravedlnosti a ničitele zla“."
      de: "SCP-1233 gibt sich als „Champion des Mondes, Verteidiger der Weltraumgerechtigkeit und Vernichter des Bösen“ aus."
      es: "SCP-1233 afirma ser el «campeón de la Luna, defensor de la justicia espacial y destructor del mal»."
      fr: "SCP-1233 prétend être le « champion de la Lune, défenseur de la justice spatiale et destructeur du mal »."
      it: "SCP-1233 afferma di essere il \"campione della Luna, difensore della giustizia spaziale e distruttore del male\"."
      ko: "SCP-1233는 스스로를 '달의 챔피언, 우주 정의의 수호자, 악의 파괴자'라고 주장한다."
      pl: "SCP-1233 twierdzi, że jest „mistrzem Księżyca, obrońcą kosmicznej sprawiedliwości i niszczycielem zła”."
      pt: "SCP-1233 afirma ser o \"campeão da Lua, defensor da justiça espacial e destruidor do mal\"."
      th: "SCP-1233 อ้างว่าตนคือ 'จอมทัพแห่งดวงจันทร์ ผู้พิทักษ์ความยุติธรรมแห่งอวกาศ และผู้ทำลายล้างความชั่วร้าย'"
      uk: "SCP-1233 стверджує, що є «чемпіоном Місяця, захисником космічної справедливості та знищувачем зла»."
      vi: "SCP-1233 tự nhận là \"nhà vô địch Mặt Trăng, người bảo vệ công lý vũ trụ và kẻ hủy diệt cái ác\"."
      zh: "SCP-1233自称是『月之勇者、宇宙正义的守护者、邪恶的毁灭者』。"
      zh_Hant: "SCP-1233自稱是『月之勇者、宇宙正義的守護者、邪惡的毀滅者』。"

  - scene: >
      Low angle close-up shot, camera near the potted plant looking up at
      the figure towering above. In the break room, the spacesuited
      figure plants an ordinary pen upright into the potted plant like a
      flag, striking a heroic pose with one boot on a chair. Dr. Hana is
      small in the background doorway, arms crossed, watching with tired
      amusement.
    characters: [researcher-hana]
    caption:
      ja: "SCP-1233は、人類の文化についてより深く学ぶために地球へ来たと述べている。"
      en: "SCP-1233 states it has come to Earth to learn more of human culture."
      cs: "SCP-1233 uvádí, že přišel na Zemi, aby se dozvěděl více o lidské kultuře."
      de: "SCP-1233 gibt an, zur Erde gekommen zu sein, um mehr über die menschliche Kultur zu erfahren."
      es: "SCP-1233 afirma haber venido a la Tierra para aprender más sobre la cultura humana."
      fr: "SCP-1233 déclare être venu sur Terre pour en apprendre davantage sur la culture humaine."
      it: "SCP-1233 dichiara di essere venuto sulla Terra per conoscere meglio la cultura umana."
      ko: "SCP-1233는 인간 문화를 더 배우기 위해 지구에 왔다고 말한다."
      pl: "SCP-1233 twierdzi, że przybył na Ziemię, aby lepiej poznać ludzką kulturę."
      pt: "SCP-1233 declara ter vindo à Terra para aprender mais sobre a cultura humana."
      th: "SCP-1233 กล่าวว่าตนมายังโลกเพื่อเรียนรู้เกี่ยวกับวัฒนธรรมมนุษย์เพิ่มเติม"
      uk: "SCP-1233 стверджує, що прибув на Землю, щоб більше дізнатися про людську культуру."
      vi: "SCP-1233 tuyên bố rằng nó đến Trái Đất để tìm hiểu thêm về văn hóa con người."
      zh: "SCP-1233表示自己来到地球是为了更多地了解人类文化。"
      zh_Hant: "SCP-1233表示自己來到地球是為了更多地了解人類文化。"

  - scene: >
      Wide shot, full body, eye level, pulled back to show the whole
      break room. Dr. Hana stands in the doorway with arms still crossed
      and a small resigned smile, watching the spacesuited figure proudly
      posing beside the pen-flagged plant across the room.
    characters: [researcher-hana]
    caption:
      ja: "その装備は標準的な宇宙服をはるかに超える耐久性を示しており、小火器・地雷・溶岩への完全な水没にも損傷は確認されていない。"
      en: "The suit has shown durability far exceeding that of a standard spacesuit, withstanding small-arms fire, landmines, and even total submersion in magma without damage."
      cs: "Skafandr vykazuje odolnost daleko přesahující běžný skafandr, vydržel palbu ze zbraní, miny i úplné ponoření do magmatu bez poškození."
      de: "Der Anzug zeigt eine Widerstandsfähigkeit, die weit über die eines gewöhnlichen Raumanzugs hinausgeht, und übersteht Beschuss aus Handfeuerwaffen, Landminen und sogar vollständiges Eintauchen in Magma ohne Schaden."
      es: "El traje ha demostrado una durabilidad que supera con creces la de un traje espacial estándar, resistiendo disparos de armas ligeras, minas terrestres e incluso la inmersión total en magma sin daños."
      fr: "La combinaison a démontré une résistance bien supérieure à celle d'une combinaison spatiale standard, résistant aux tirs d'armes légères, aux mines terrestres et même à une immersion totale dans du magma sans dommage."
      it: "La tuta ha dimostrato una resistenza di gran lunga superiore a quella di una normale tuta spaziale, resistendo a colpi di armi leggere, mine terrestri e persino alla totale immersione nel magma senza danni."
      ko: "이 장비는 일반 우주복을 훨씬 능가하는 내구성을 보이며, 소화기 사격, 지뢰, 심지어 용암에 완전히 잠긴 상태에서도 손상 없이 버텨냈다."
      pl: "Skafander wykazał wytrzymałość znacznie przewyższającą standardowy skafander kosmiczny, wytrzymując ostrzał z broni strzeleckiej, miny lądowe, a nawet całkowite zanurzenie w magmie bez uszkodzeń."
      pt: "O traje demonstrou durabilidade muito superior à de um traje espacial padrão, resistindo a tiros de armas leves, minas terrestres e até imersão total em magma sem danos."
      th: "ชุดนี้แสดงความทนทานเหนือกว่าชุดอวกาศมาตรฐานอย่างมาก ทนทั้งกระสุนปืนเล็ก ทุ่นระเบิด และแม้แต่การจมอยู่ในลาวาทั้งตัวโดยไม่เสียหาย"
      uk: "Костюм продемонстрував міцність, що значно перевищує стандартний космічний скафандр, витримавши обстріл зі стрілецької зброї, наземні міни й навіть повне занурення в магму без пошкоджень."
      vi: "Bộ đồ đã cho thấy độ bền vượt xa một bộ đồ vũ trụ tiêu chuẩn, chịu được hỏa lực vũ khí nhỏ, mìn, và thậm chí ngâm hoàn toàn trong dung nham mà không hư hại."
      zh: "该装备展现出远超标准宇航服的耐久性，能承受轻武器射击、地雷，甚至完全浸入岩浆而不受损伤。"
      zh_Hant: "該裝備展現出遠超標準太空衣的耐久性，能承受輕武器射擊、地雷，甚至完全浸入岩漿而不受損傷。"

addendum:
  ja: "補遺1233-1：本オブジェクトへの積極的な攻撃は、これまでのところ有効な収容手段として確認されていない。"
  en: "Addendum 1233-1: Active hostile engagement with the object has not proven to be an effective containment method to date."
  cs: "Dodatek 1233-1: Aktivní nepřátelský zásah proti objektu se dosud neprokázal jako účinná metoda zadržení."
  de: "Anhang 1233-1: Aktive feindselige Konfrontation mit dem Objekt hat sich bislang nicht als wirksame Sicherungsmethode erwiesen."
  es: "Adenda 1233-1: El enfrentamiento hostil activo con el objeto no ha demostrado ser un método de contención eficaz hasta la fecha."
  fr: "Addendum 1233-1 : Un engagement hostile actif contre l'objet ne s'est pas révélé, à ce jour, être une méthode de confinement efficace."
  it: "Addendum 1233-1: Un confronto ostile attivo con l'oggetto non si è finora dimostrato un metodo di contenimento efficace."
  ko: "부록 1233-1: 본 오브젝트에 대한 적극적인 적대적 대응은 현재까지 유효한 수용 수단으로 확인되지 않았다."
  pl: "Aneks 1233-1: Aktywne wrogie starcie z obiektem jak dotąd nie okazało się skuteczną metodą przetrzymywania."
  pt: "Adendo 1233-1: O confronto hostil ativo com o objeto ainda não se mostrou um método de contenção eficaz até o momento."
  th: "ภาคผนวก 1233-1: การเข้าปะทะอย่างรุนแรงกับวัตถุนี้ยังไม่พิสูจน์ว่าเป็นวิธีกักกันที่ได้ผลจนถึงปัจจุบัน"
  uk: "Додаток 1233-1: Активна ворожа взаємодія з об'єктом досі не довела свою ефективність як метод утримання."
  vi: "Phụ lục 1233-1: Việc chủ động đối đầu với vật thể này cho đến nay chưa được chứng minh là một phương pháp giam giữ hiệu quả."
  zh: "补遗1233-1：截至目前，对该对象采取主动敌对行动尚未被证实为有效的收容手段。"
  zh_Hant: "補遺1233-1：截至目前，對該對象採取主動敵對行動尚未被證實為有效的收容手段。"
