  - scene: >
      Food offering scene: a tray of prepared food descends into the dark lift shaft as tremor cracks spread through the church floor when communication displeases the unseen entities. No text.
    characters: [scp-8999]
    source:
      section: Description
      quote: "SCP-8999 possesses a degree of control over seismic activity in the surrounding area... These events exclusively occur as a result of dissatisfaction with communication between SCP-8999 and the Foundation. SCP-8999 are largely disinterested in communication that does not involve or center around food."
      url: "https://scp-wiki.wikidot.com/scp-8999"
      fetched_at: "2026-09-21T00:00:00Z"
    caption:
      ja: "SCP-8999は周辺の地震活動をある程度制御し、不満な通信で揺れを起こします。食べ物に関係しない会話にはほとんど関心を示しません。"
      en: &p4 "SCP-8999 can influence local seismic activity when dissatisfied, and they are largely interested only in communication centered on food."
