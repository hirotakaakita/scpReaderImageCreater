local_characters:
  scp-8999:
    name: "SCP-8999"
    appearance: >
      Unseen subterranean sapient entities below Åby Parish, represented through a deep cavern, dumbwaiter lift,
      pictographs, food offerings and tremors rather than visible bodies.
    default_look: >
      Hidden below ground, intelligent, hungry, unseen by cameras.
panels:
  - scene: >
      Exterior and cutaway of Åby Parish in Sweden, showing a vast dark cavern system 35 meters below the church. No text or labels.
    characters: [scp-8999]
    source:
      section: Description
      quote: "SCP-8999 refers to entities, unknown in number, presumably located in a vast, subterranean cavern system 35 meters below the Åby Parish, an Evangelical Lutheran church in Kalmar, Sweden."
      url: "https://scp-wiki.wikidot.com/scp-8999"
      fetched_at: "2026-09-21T00:00:00Z"
    caption:
      ja: "SCP-8999は、スウェーデン・カルマルのÅby Parish地下35メートルにある広大な洞窟系にいる、数不明の実体を指します。"
      en: &p1 "SCP-8999 refers to an unknown number of entities in a vast cavern system 35 meters beneath Åby Parish in Kalmar, Sweden."
