  - scene: >
      Camera and drone equipment descend on the dumbwaiter, but the cavern below remains unseen and the monitor shows only blank darkness. No text.
    characters: [scp-8999]
    source:
      section: Description
      quote: "Attempts to record footage of SCP-8999 by attaching a camera or surveillance drone to the lift have been unsuccessful... they possess a desire to remain unseen, and are aware of the presence of cameras."
      url: "https://scp-wiki.wikidot.com/scp-8999"
      fetched_at: "2026-09-21T00:00:00Z"
    caption:
      ja: "カメラや監視ドローンをリフトに取り付けても記録は成功せず、SCP-8999は見られることを望まず、カメラの存在も認識しています。"
      en: &p3 "Camera and drone attempts have failed; SCP-8999 appear to want to remain unseen and are aware of cameras."
