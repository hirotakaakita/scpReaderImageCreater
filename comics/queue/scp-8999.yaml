  - scene: >
      Foundation researchers receive simple pictographs and symbols on paper through a small modified dumbwaiter lift descending into darkness. No readable text.
    characters: [scp-8999, attending-researcher-m]
    source:
      section: Description
      quote: "SCP-8999 are sapient and capable of articulating themselves through symbols and pictographs. This communication has occurred exclusively through a modified dumbwaiter lift system constructed in the parish basement."
      url: "https://scp-wiki.wikidot.com/scp-8999"
      fetched_at: "2026-09-21T00:00:00Z"
    caption:
      ja: "SCP-8999は知性を持ち、地下室の改造小型リフトを通じて、記号や絵文字でのみ意思を伝えています。"
      en: &p2 "SCP-8999 are sapient and communicate through symbols and pictographs using a modified dumbwaiter lift in the parish basement."
