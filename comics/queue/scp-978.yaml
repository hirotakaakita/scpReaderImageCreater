# SCP-978「欲望カメラ」4コマ台本
# captionは記事本文（Special Containment Procedures / Description）からの引用。
# キャラにセリフは言わせない。試験記録（Testing Log）は本編に使わない。

id: scp-978

title:
  en: "SCP-978: The Desire Camera"
  ja: "SCP-978：欲望カメラ"
  cs: "SCP-978: Kamera touhy"
  de: "SCP-978: Die Kamera der Wünsche"
  es: "SCP-978: La cámara del deseo"
  fr: "SCP-978 : L'appareil photo du désir"
  it: "SCP-978: La fotocamera del desiderio"
  ko: "SCP-978: 욕망의 카메라"
  pl: "SCP-978: Aparat pragnień"
  pt: "SCP-978: A Câmera do Desejo"
  th: "SCP-978: กล้องแห่งความปรารถนา"
  uk: "SCP-978: Камера бажань"
  vi: "SCP-978: Máy ảnh khát vọng"
  zh: "SCP-978：欲望相机"
  zh_Hant: "SCP-978：慾望相機"

attribution:
  article: "SCP-978"
  author: "agatharights"
  source_url: "http://scp-wiki.wikidot.com/scp-978"
  license: "CC BY-SA 3.0"

object_class: Safe

local_characters:
  scp-978:
    name: SCP-978
    description: >
      SCP-978, a standard red-and-black Polaroid Supercolor 645 CL instant
      camera (body colors: matte black RGB 30,30,30 with red accent
      panels RGB 170,30,30), a compact folding design with no distinctive
      identifying marks or damage — otherwise entirely ordinary in
      appearance.

characters: [attending-researcher-m, scp-978]

panels:
  - scene: >
      Wide shot, full body, eye level, in a plain storage room lined with
      security lockers. Attending Researcher (M) stands in front of an
      open locker, lifting SCP-978 out with both hands; his ID badge is
      clipped to his coat.
    characters: [attending-researcher-m, scp-978]
    caption:
      ja: "SCP-978はサイト17のセキュリティロッカーH-J-12に保管され、レベル2以上のセキュリティクリアランスを持つ職員のみが取り出し・取り扱いを許可される。試験班は随時、追加のフィルムと印画紙を要求できる。"
      en: "SCP-978 is to be kept in security locker H-J-12 at Site 17, and only to be removed or handled by personnel with Level-2 security clearance or higher. Testing parties may request extra film and printing paper at their leisure."
      cs: "SCP-978 je uchováváno v bezpečnostní skříňce H-J-12 na Site 17 a smí jej vyjmout nebo s ním manipulovat pouze personál s bezpečnostní prověrkou Úrovně 2 nebo vyšší. Testovací týmy si mohou dle libosti vyžádat další film a fotografický papír."
      de: "SCP-978 ist in Sicherheitsschließfach H-J-12 an Standort 17 aufzubewahren und darf nur von Personal mit Sicherheitsfreigabe Level 2 oder höher entnommen oder gehandhabt werden. Testparteien können nach Belieben zusätzlichen Film und Fotopapier anfordern."
      es: "SCP-978 debe mantenerse en la taquilla de seguridad H-J-12 del Sitio 17, y solo puede ser retirado o manipulado por personal con autorización de seguridad de Nivel 2 o superior. Los equipos de prueba pueden solicitar película y papel de impresión adicionales cuando lo deseen."
      fr: "SCP-978 doit être conservé dans le casier de sécurité H-J-12 du Site 17, et ne peut être retiré ou manipulé que par du personnel disposant d'une habilitation de sécurité de Niveau 2 ou supérieur. Les équipes de test peuvent demander de la pellicule et du papier photo supplémentaires à leur convenance."
      it: "SCP-978 deve essere conservato nell'armadietto di sicurezza H-J-12 presso il Sito 17, e può essere rimosso o maneggiato solo da personale con autorizzazione di sicurezza di Livello 2 o superiore. I gruppi di test possono richiedere pellicola e carta fotografica extra a loro discrezione."
      ko: "SCP-978은 사이트-17의 보안 사물함 H-J-12에 보관되며, 레벨-2 이상의 보안 허가를 가진 인원만이 이를 꺼내거나 취급할 수 있다. 시험반은 필요에 따라 추가 필름과 인화지를 요청할 수 있다."
      pl: "SCP-978 ma być przechowywany w szafce bezpieczeństwa H-J-12 na Placówce 17 i może być wyjmowany lub obsługiwany wyłącznie przez personel z poziomem dostępu 2 lub wyższym. Zespoły testujące mogą w dowolnym momencie zażądać dodatkowego filmu i papieru fotograficznego."
      pt: "SCP-978 deve ser mantido no armário de segurança H-J-12 no Sítio 17, e só pode ser retirado ou manuseado por pessoal com autorização de segurança de Nível 2 ou superior. As equipes de teste podem solicitar filme e papel de impressão extras à vontade."
      th: "SCP-978 จะถูกเก็บไว้ในตู้ล็อกเกอร์รักษาความปลอดภัย H-J-12 ที่ไซต์ 17 และอนุญาตให้เฉพาะเจ้าหน้าที่ที่มีระดับการรักษาความปลอดภัยระดับ 2 ขึ้นไปเท่านั้นที่จะนำออกมาหรือจับต้องได้ ทีมทดสอบสามารถขอฟิล์มและกระดาษอัดรูปเพิ่มเติมได้ตามต้องการ"
      uk: "SCP-978 має зберігатися в охоронній шафці H-J-12 на Об'єкті 17, і лише персонал з рівнем допуску 2 або вищим може діставати його чи працювати з ним. Тестові групи можуть у будь-який час запросити додаткову плівку та фотопапір."
      vi: "SCP-978 phải được cất giữ trong tủ khóa an ninh H-J-12 tại Site 17, và chỉ được lấy ra hoặc xử lý bởi nhân viên có quyền truy cập an ninh Cấp độ 2 trở lên. Các nhóm thử nghiệm có thể yêu cầu thêm phim và giấy in tùy ý."
      zh: "SCP-978应保存于17号站点的安全储物柜H-J-12中，只有拥有2级或以上安全权限的人员才能取出或操作。测试小组可随时申请额外的胶卷和相纸。"
      zh_Hant: "SCP-978應保存於17號站點的安全儲物櫃H-J-12中，只有擁有2級或以上安全權限的人員才能取出或操作。測試小組可隨時申請額外的膠捲和相紙。"

  - scene: >
      Medium shot, waist-up. On the left side of the frame, Attending
      Researcher (M) holds SCP-978 up at arm's length toward his own
      face, grinning, about to snap a personal photo of himself. On the
      right side of the frame, Attending Researcher (F) stands with arms
      crossed, catching him in the act, giving him a stern look.
    characters: [attending-researcher-m, attending-researcher-f, scp-978]
    caption:
      ja: "SCP-978は、恐喝・娯楽・個人的な目的のために使用してはならない。――お前のことだぞ。 ～O5-██"
      en: "SCP-978 is not to be used for blackmail, entertainment, or personal reasons. This means you. ~ O5-██"
      cs: "SCP-978 se nesmí používat k vydírání, zábavě nebo osobním účelům. Tím myslím tebe. ~ O5-██"
      de: "SCP-978 darf nicht für Erpressung, Unterhaltung oder persönliche Zwecke verwendet werden. Das gilt auch für dich. ~ O5-██"
      es: "SCP-978 no debe utilizarse para chantaje, entretenimiento o fines personales. Esto va por ti. ~ O5-██"
      fr: "SCP-978 ne doit pas être utilisé à des fins de chantage, de divertissement ou personnelles. Ceci vous concerne. ~ O5-██"
      it: "SCP-978 non deve essere utilizzato per ricatti, intrattenimento o motivi personali. Questo vale anche per te. ~ O5-██"
      ko: "SCP-978은 협박, 오락, 또는 개인적인 목적으로 사용해서는 안 된다. 너 말이다. ~ O5-██"
      pl: "SCP-978 nie wolno wykorzystywać do szantażu, rozrywki ani celów osobistych. To dotyczy właśnie ciebie. ~ O5-██"
      pt: "SCP-978 não deve ser usado para chantagem, entretenimento ou motivos pessoais. Isso inclui você. ~ O5-██"
      th: "ห้ามใช้ SCP-978 เพื่อการแบล็กเมล์ ความบันเทิง หรือเหตุผลส่วนตัว หมายถึงคุณนั่นแหละ ~ O5-██"
      uk: "SCP-978 не можна використовувати для шантажу, розваг чи особистих цілей. Це стосується і тебе. ~ O5-██"
      vi: "SCP-978 không được sử dụng để tống tiền, giải trí, hoặc vì lý do cá nhân. Ý tôi là bạn đấy. ~ O5-██"
      zh: "SCP-978不得用于勒索、娱乐或个人目的。说的就是你。～O5-██"
      zh_Hant: "SCP-978不得用於勒索、娛樂或個人目的。說的就是你。～O5-██"

  - scene: >
      Close-up shot on D-Class Subject's face and shoulders, filling most
      of the frame, posed in a stiff neutral smile for the camera. In the
      foreground at the edge of the frame, Attending Researcher (F)'s
      hands hold up SCP-978, aimed at him; a freshly ejected polaroid
      print hangs from the camera's slot, showing a small glimpse of a
      completely different, relaxed scene.
    characters: [d-class, attending-researcher-f, scp-978]
    caption:
      ja: "SCP-978は、識別可能な特徴や損傷のない、標準的な赤と黒のポラロイド・スーパーカラー645CLインスタントカメラのように見える。SCP-978で対象を撮影すると、現像される写真には撮影時に対象が実際に行っていたことではなく、対象が本当はしたいと望んでいたことが写し出される。"
      en: "SCP-978 appears to be a standard red-and-black Polaroid Supercolor 645 CL instant camera, with no distinctive identifying marks or damage. When a subject is pictured with SCP-978, the photograph that develops shows not what the subject was doing at the time of the photo, but rather what the subject wanted to be doing."
      cs: "SCP-978 se jeví jako standardní červeno-černý instantní fotoaparát Polaroid Supercolor 645 CL bez výrazných rozpoznávacích znaků či poškození. Když je subjekt vyfotografován pomocí SCP-978, na vyvolané fotografii se neobjeví to, co subjekt v danou chvíli dělal, nýbrž to, co dělat chtěl."
      de: "SCP-978 erscheint als eine gewöhnliche rot-schwarze Polaroid Supercolor 645 CL Sofortbildkamera ohne markante Erkennungsmerkmale oder Beschädigungen. Wird ein Subjekt mit SCP-978 fotografiert, zeigt das entwickelte Foto nicht, was das Subjekt zum Zeitpunkt der Aufnahme tat, sondern was es gerne getan hätte."
      es: "SCP-978 parece ser una cámara instantánea Polaroid Supercolor 645 CL estándar de color rojo y negro, sin marcas identificativas distintivas ni daños. Cuando se fotografía a un sujeto con SCP-978, la fotografía revelada no muestra lo que el sujeto estaba haciendo en ese momento, sino lo que el sujeto deseaba estar haciendo."
      fr: "SCP-978 semble être un appareil photo instantané Polaroid Supercolor 645 CL standard, rouge et noir, sans marques distinctives ni dommages. Lorsqu'un sujet est photographié avec SCP-978, la photo qui se développe ne montre pas ce que le sujet faisait au moment de la photo, mais plutôt ce qu'il souhaitait faire."
      it: "SCP-978 appare come una normale macchina fotografica istantanea Polaroid Supercolor 645 CL rossa e nera, priva di segni distintivi o danni. Quando un soggetto viene fotografato con SCP-978, la foto sviluppata non mostra ciò che il soggetto stava facendo al momento dello scatto, bensì ciò che il soggetto desiderava fare."
      ko: "SCP-978은 특별한 식별 표시나 손상이 없는 표준적인 빨강과 검정색의 폴라로이드 슈퍼컬러 645 CL 즉석카메라처럼 보인다. SCP-978로 대상을 촬영하면, 현상되는 사진에는 촬영 당시 대상이 실제로 하고 있던 행동이 아니라 대상이 하고 싶어 했던 행동이 나타난다."
      pl: "SCP-978 wygląda jak standardowy, czerwono-czarny aparat natychmiastowy Polaroid Supercolor 645 CL, bez wyróżniających się oznaczeń czy uszkodzeń. Gdy osobnik zostanie sfotografowany za pomocą SCP-978, wywołane zdjęcie nie pokazuje tego, co osobnik robił w chwili zdjęcia, lecz to, co chciałby robić."
      pt: "SCP-978 aparenta ser uma câmera instantânea Polaroid Supercolor 645 CL padrão, vermelha e preta, sem marcas identificativas distintas ou danos. Quando um sujeito é fotografado com SCP-978, a fotografia revelada não mostra o que o sujeito estava fazendo no momento da foto, mas sim o que o sujeito desejava estar fazendo."
      th: "SCP-978 มีลักษณะเป็นกล้องโพลารอยด์ Supercolor 645 CL แบบมาตรฐานสีแดงดำ ไม่มีเครื่องหมายบ่งชี้หรือความเสียหายที่โดดเด่น เมื่อถ่ายภาพเป้าหมายด้วย SCP-978 ภาพที่ล้างออกมาจะไม่แสดงสิ่งที่เป้าหมายกำลังทำอยู่ในขณะนั้น แต่จะแสดงสิ่งที่เป้าหมายต้องการจะทำแทน"
      uk: "SCP-978 виглядає як стандартний червоно-чорний миттєвий фотоапарат Polaroid Supercolor 645 CL без помітних розпізнавальних знаків чи пошкоджень. Коли об'єкт фотографують за допомогою SCP-978, на проявленому знімку показано не те, чим об'єкт займався в момент зйомки, а те, чим він хотів би займатися."
      vi: "SCP-978 trông giống như một chiếc máy ảnh lấy liền Polaroid Supercolor 645 CL màu đỏ đen tiêu chuẩn, không có dấu hiệu nhận dạng hay hư hỏng đặc biệt nào. Khi một đối tượng được chụp bằng SCP-978, bức ảnh tráng ra không cho thấy điều đối tượng đang làm vào thời điểm chụp, mà là điều đối tượng muốn làm."
      zh: "SCP-978看起来是一台标准的红黑相间宝丽来Supercolor 645 CL拍立得相机，没有明显的识别标记或损伤。用SCP-978为对象拍照时，冲洗出的照片显示的并非对象拍摄当下正在做的事，而是对象内心想做的事。"
      zh_Hant: "SCP-978看起來是一台標準的紅黑相間寶麗來Supercolor 645 CL拍立得相機，沒有明顯的識別標記或損傷。用SCP-978為對象拍照時，沖洗出的照片顯示的並非對象拍攝當下正在做的事，而是對象內心想做的事。"

  - scene: >
      Wide shot, full body, slightly low angle, pulled back to show the
      whole testing room. On the left side of the frame, one D-Class
      Subject stands posing stiffly. On the right side of the frame, a
      second D-Class Subject stands posing stiffly beside them. In the
      foreground, a developing polaroid print is held up between them,
      showing their two contrasting desires blended into one surreal
      combined scene.
    characters: [d-class, scp-978]
    caption:
      ja: "この効果はおおむね無作為であり、時には劇的な変化や深く抑圧された欲求を映し出すこともあれば、対象やその周囲環境への単純な変化・改変にとどまることもある。相反する欲求を持つ2人の対象が一緒に撮影された場合、両者の欲求は「混ざり合う」ように見える。"
      en: "This effect appears to be, for the most part, random, sometimes showing drastic changes and deeply suppressed desires, or simple changes and alterations to the subject or their surroundings. Should two subjects with contrasting desires both be photographed together, the subjects' desires appear to 'mix'."
      cs: "Tento efekt se zdá být z větší části náhodný, přičemž někdy ukazuje drastické změny a hluboce potlačovaná přání, jindy jen jednoduché změny a úpravy subjektu nebo jeho okolí. Pokud jsou spolu vyfotografováni dva subjekty s protichůdnými přáními, jejich přání se zdají 'smísit'."
      de: "Dieser Effekt scheint größtenteils zufällig zu sein und zeigt manchmal drastische Veränderungen und tief unterdrückte Wünsche, manchmal nur einfache Veränderungen am Subjekt oder seiner Umgebung. Werden zwei Subjekte mit gegensätzlichen Wünschen zusammen fotografiert, scheinen sich ihre Wünsche zu 'vermischen'."
      es: "Este efecto parece ser, en su mayor parte, aleatorio, mostrando a veces cambios drásticos y deseos profundamente reprimidos, o simples cambios y alteraciones en el sujeto o su entorno. Si se fotografía juntos a dos sujetos con deseos contrapuestos, sus deseos parecen 'mezclarse'."
      fr: "Cet effet semble être, pour la plupart, aléatoire, montrant parfois des changements radicaux et des désirs profondément refoulés, ou de simples changements et altérations du sujet ou de son environnement. Si deux sujets aux désirs contrastés sont photographiés ensemble, leurs désirs semblent se « mélanger »."
      it: "Questo effetto sembra essere per lo più casuale, mostrando a volte cambiamenti drastici e desideri profondamente repressi, oppure semplici cambiamenti e alterazioni del soggetto o del suo ambiente circostante. Se due soggetti con desideri contrastanti vengono fotografati insieme, i loro desideri sembrano 'mescolarsi'."
      ko: "이 효과는 대체로 무작위적으로 나타나며, 때로는 극적인 변화와 깊이 억눌린 욕구를 보여주기도 하고, 때로는 대상이나 그 주변 환경에 대한 단순한 변화와 수정에 그치기도 한다. 상반된 욕구를 지닌 두 대상이 함께 촬영될 경우, 두 사람의 욕구는 서로 '섞이는' 것처럼 보인다."
      pl: "Efekt ten wydaje się w większości przypadkowy, czasem ukazując drastyczne zmiany i głęboko stłumione pragnienia, a czasem jedynie proste zmiany i modyfikacje osobnika lub jego otoczenia. Jeśli dwoje osobników o sprzecznych pragnieniach zostanie sfotografowanych razem, ich pragnienia zdają się 'mieszać'."
      pt: "Esse efeito parece ser, em sua maioria, aleatório, às vezes mostrando mudanças drásticas e desejos profundamente reprimidos, ou simples alterações no sujeito ou em seus arredores. Caso dois sujeitos com desejos contrastantes sejam fotografados juntos, os desejos dos sujeitos parecem 'se misturar'."
      th: "ผลลัพธ์นี้ดูเหมือนจะเกิดขึ้นแบบสุ่มเป็นส่วนใหญ่ บางครั้งแสดงการเปลี่ยนแปลงอย่างรุนแรงและความปรารถนาที่ถูกกดทับลึกๆ หรือเพียงการเปลี่ยนแปลงและดัดแปลงเล็กน้อยต่อเป้าหมายหรือสภาพแวดล้อมรอบตัว หากเป้าหมายสองคนที่มีความปรารถนาขัดแย้งกันถูกถ่ายภาพร่วมกัน ความปรารถนาของทั้งสองดูเหมือนจะ 'ผสมปนเป' กัน"
      uk: "Цей ефект здебільшого виглядає випадковим, іноді показуючи різкі зміни та глибоко приховані бажання, а іноді — прості зміни й видозміни об'єкта чи його оточення. Якщо двох об'єктів із суперечливими бажаннями сфотографувати разом, їхні бажання, здається, 'змішуються'."
      vi: "Hiệu ứng này phần lớn có vẻ ngẫu nhiên, đôi khi thể hiện những thay đổi mạnh mẽ và những ham muốn bị kìm nén sâu sắc, hoặc chỉ là những thay đổi và biến đổi đơn giản đối với đối tượng hoặc môi trường xung quanh họ. Nếu hai đối tượng có mong muốn trái ngược nhau cùng được chụp ảnh chung, mong muốn của họ dường như sẽ 'hòa trộn' vào nhau."
      zh: "这种效果大体上似乎是随机的，有时会显现出剧烈的变化和深藏的欲望，有时则只是对对象或其周围环境的简单改变。若两名欲望相反的对象同时被拍摄在一起，两人的欲望似乎会「混合」在一起。"
      zh_Hant: "這種效果大體上似乎是隨機的，有時會顯現出劇烈的變化和深藏的慾望，有時則只是對對象或其周圍環境的簡單改變。若兩名慾望相反的對象同時被拍攝在一起，兩人的慾望似乎會「混合」在一起。"
