# SCP-978「願望のカメラ」4コマ台本
# キャラにセリフは言わせない。captionは記事本文からの引用。

id: scp-978

title:
  en: "SCP-978: The Desire Camera"
  ja: "SCP-978：願望のカメラ"
  cs: "SCP-978: Fotoaparát touhy"
  de: "SCP-978: Die Wunschkamera"
  es: "SCP-978: La Cámara del Deseo"
  fr: "SCP-978 : L'Appareil à Désirs"
  it: "SCP-978: La Fotocamera del Desiderio"
  ko: "SCP-978: 욕망의 카메라"
  pl: "SCP-978: Aparat Pragnień"
  pt: "SCP-978: A Câmera do Desejo"
  th: "SCP-978: กล้องแห่งความปรารถนา"
  uk: "SCP-978: Камера Бажань"
  vi: "SCP-978: Máy Ảnh Khát Vọng"
  zh: "SCP-978：欲望相机"
  zh_Hant: "SCP-978：慾望相機"

attribution:
  article: "SCP-978"
  source_url: "http://scp-wiki.wikidot.com/scp-978"
  license: "CC BY-SA 3.0"

object_class: Safe

characters: [researcher-hana]

panels:
  - scene: >
      Wide shot, full body, high angle looking down over the cramped
      office buried in stacks of paperwork. Dr. Hana sits hunched at her
      desk looking exhausted, while a cheerful coworker leans in from the
      side holding up an old red-and-black Polaroid camera, aiming it
      playfully at her.
    characters: [researcher-hana]
    caption:
      ja: "SCP-978は赤と黒の標準的なポラロイドカメラであり、外見上目立った特徴や損傷は見られない。"
      en: "SCP-978 appears to be a standard red-and-black Polaroid camera, with no distinctive identifying marks."
      cs: "SCP-978 vypadá jako běžný červeno-černý polaroidový fotoaparát, bez výrazných identifikačních znaků."
      de: "SCP-978 erscheint als eine gewöhnliche rot-schwarze Polaroidkamera ohne markante Erkennungsmerkmale."
      es: "SCP-978 parece una cámara Polaroid estándar de color rojo y negro, sin marcas distintivas."
      fr: "SCP-978 ressemble à un appareil Polaroid standard rouge et noir, sans marque distinctive."
      it: "SCP-978 sembra una normale fotocamera Polaroid rossa e nera, priva di segni distintivi."
      ko: "SCP-978은 겉보기에 특별한 식별 표시가 없는 표준적인 빨간색과 검은색의 폴라로이드 카메라이다."
      pl: "SCP-978 wygląda jak standardowy czerwono-czarny aparat Polaroid, bez charakterystycznych znaków."
      pt: "SCP-978 parece uma câmera Polaroid padrão vermelha e preta, sem marcas distintivas."
      th: "SCP-978 มีลักษณะเป็นกล้องโพลารอยด์สีแดงและดำแบบมาตรฐาน ไม่มีเครื่องหมายที่บ่งชี้ความแตกต่างใดๆ"
      uk: "SCP-978 виглядає як звичайна червоно-чорна фотокамера Polaroid без жодних характерних позначок."
      vi: "SCP-978 trông giống một chiếc máy ảnh Polaroid tiêu chuẩn màu đỏ và đen, không có dấu hiệu nhận dạng đặc biệt nào."
      zh: "SCP-978外观上是一台标准的红黑相间宝丽来相机，没有明显的识别特征。"
      zh_Hant: "SCP-978外觀上是一台標準的紅黑相間寶麗來相機，沒有明顯的識別特徵。"

  - scene: >
      Close-up shot centered on Dr. Hana's face, filling most of the
      frame, lit starkly white by a bright camera flash from off-frame.
      She squints and flinches with one hand half-raised against the
      light.
    characters: [researcher-hana]
    caption:
      ja: "SCP-978はセキュリティロッカーに保管され、レベル2以上の権限を持つ職員のみが取り扱うことを許される。"
      en: "SCP-978 is to be kept in a security locker, and may only be handled by personnel with Level-2 clearance or higher."
      cs: "SCP-978 má být uchováván v bezpečnostní skříňce a smí s ním manipulovat pouze personál s prověrkou úrovně 2 nebo vyšší."
      de: "SCP-978 ist in einem Sicherheitsschließfach aufzubewahren und darf nur von Personal mit Freigabestufe 2 oder höher gehandhabt werden."
      es: "SCP-978 debe mantenerse en una taquilla de seguridad y solo puede ser manipulado por personal con autorización de Nivel 2 o superior."
      fr: "SCP-978 doit être conservé dans un casier de sécurité et ne peut être manipulé que par du personnel disposant d'une habilitation de Niveau 2 ou supérieur."
      it: "SCP-978 deve essere conservato in un armadietto di sicurezza e può essere maneggiato solo da personale con autorizzazione di Livello 2 o superiore."
      ko: "SCP-978은 보안 사물함에 보관되며, 레벨 2 이상의 권한을 가진 직원만이 취급할 수 있다."
      pl: "SCP-978 należy przechowywać w szafce bezpieczeństwa i może być obsługiwany wyłącznie przez personel z uprawnieniami poziomu 2 lub wyższego."
      pt: "SCP-978 deve ser mantido em um armário de segurança e só pode ser manuseado por pessoal com autorização de Nível 2 ou superior."
      th: "SCP-978 ต้องเก็บไว้ในตู้ล็อกเกอร์รักษาความปลอดภัย และให้เฉพาะเจ้าหน้าที่ที่มีระดับการเข้าถึงชั้น 2 ขึ้นไปเท่านั้นที่สามารถจับต้องได้"
      uk: "SCP-978 має зберігатися в охоронній шафці, і поводитися з ним можуть лише співробітники з допуском рівня 2 або вище."
      vi: "SCP-978 phải được cất giữ trong tủ khóa an ninh, và chỉ những nhân viên có quyền hạn cấp độ 2 trở lên mới được phép xử lý."
      zh: "SCP-978须存放于安全储物柜中，只有拥有二级及以上权限的人员方可操作。"
      zh_Hant: "SCP-978須存放於安全儲物櫃中，只有擁有二級及以上權限的人員方可操作。"

  - scene: >
      Extreme close-up shot on the small Polaroid photo itself, filling
      almost the entire frame, held between two blurred pairs of fingers.
      The photo clearly shows Dr. Hana lounging in a beach chair under a
      palm tree, sipping a drink with a tiny umbrella, completely at
      ease.
    characters: [researcher-hana]
    caption:
      ja: "SCP-978で撮影された写真には、被写体が撮影時に行っていたことではなく、被写体が行いたいと望んでいたことが写る。"
      en: "A photograph taken with SCP-978 shows not what the subject was doing at the time, but what the subject wanted to be doing."
      cs: "Fotografie pořízená pomocí SCP-978 nezachycuje, co subjekt v danou chvíli dělal, ale co si přál dělat."
      de: "Ein mit SCP-978 aufgenommenes Foto zeigt nicht, was das Subjekt zu diesem Zeitpunkt tat, sondern was es zu tun wünschte."
      es: "Una fotografía tomada con SCP-978 no muestra lo que el sujeto estaba haciendo en ese momento, sino lo que deseaba estar haciendo."
      fr: "Une photographie prise avec SCP-978 ne montre pas ce que le sujet faisait à ce moment-là, mais ce qu'il désirait faire."
      it: "Una fotografia scattata con SCP-978 non mostra ciò che il soggetto stava facendo in quel momento, ma ciò che desiderava fare."
      ko: "SCP-978으로 촬영한 사진은 대상이 그 순간 하고 있던 행동이 아니라, 대상이 하고 싶어 했던 것을 보여준다."
      pl: "Zdjęcie zrobione aparatem SCP-978 nie przedstawia tego, co obiekt robił w danej chwili, lecz to, co pragnął robić."
      pt: "Uma fotografia tirada com SCP-978 não mostra o que o sujeito estava fazendo naquele momento, mas sim o que ele desejava estar fazendo."
      th: "ภาพถ่ายที่ถ่ายด้วย SCP-978 ไม่ได้แสดงสิ่งที่ผู้ถูกถ่ายกำลังทำอยู่ในขณะนั้น แต่แสดงสิ่งที่ผู้ถูกถ่ายปรารถนาจะทำ"
      uk: "Фотографія, зроблена SCP-978, показує не те, що суб'єкт робив у той момент, а те, що він бажав робити."
      vi: "Một bức ảnh chụp bằng SCP-978 không cho thấy điều đối tượng đang làm lúc đó, mà là điều đối tượng mong muốn được làm."
      zh: "用SCP-978拍摄的照片，呈现的并非被摄者当时正在做的事，而是被摄者渴望去做的事。"
      zh_Hant: "用SCP-978拍攝的照片，呈現的並非被攝者當時正在做的事，而是被攝者渴望去做的事。"

  - scene: >
      Wide shot, full body, low angle from across the desk, showing the
      whole cramped office again. Dr. Hana pins the beach photo to the
      edge of her monitor and slumps back over her keyboard, staring
      wistfully at it while towering stacks of paperwork surround her.
    characters: [researcher-hana]
    caption:
      ja: "SCP-978は、脅迫・娯楽・私的な目的のために使用してはならない。"
      en: "SCP-978 is not to be used for blackmail, entertainment, or personal reasons."
      cs: "SCP-978 se nesmí používat k vydírání, zábavě ani k osobním účelům."
      de: "SCP-978 darf nicht für Erpressung, Unterhaltung oder persönliche Zwecke verwendet werden."
      es: "SCP-978 no debe utilizarse para chantaje, entretenimiento ni fines personales."
      fr: "SCP-978 ne doit pas être utilisé à des fins de chantage, de divertissement ou personnelles."
      it: "SCP-978 non deve essere utilizzato per ricatti, intrattenimento o scopi personali."
      ko: "SCP-978은 협박, 오락, 개인적인 목적으로 사용해서는 안 된다."
      pl: "SCP-978 nie może być wykorzystywany do szantażu, rozrywki ani celów osobistych."
      pt: "SCP-978 não deve ser usado para chantagem, entretenimento ou fins pessoais."
      th: "ห้ามใช้ SCP-978 เพื่อการแบล็กเมล์ ความบันเทิง หรือเหตุผลส่วนตัว"
      uk: "SCP-978 не можна використовувати для шантажу, розваг чи особистих цілей."
      vi: "SCP-978 không được sử dụng cho mục đích tống tiền, giải trí hoặc mục đích cá nhân."
      zh: "SCP-978不得用于勒索、娱乐或私人用途。"
      zh_Hant: "SCP-978不得用於勒索、娛樂或私人用途。"

addendum:
  ja: "補遺978-1：本オブジェクトは人間以外の生物、および非生物のSCPに対しても効果を示す。"
  en: "Addendum 978-1: The object has also proven effective on non-human organisms and non-living SCP objects."
  cs: "Dodatek 978-1: Objekt se ukázal být účinný i na nelidských organismech a neživých SCP objektech."
  de: "Anhang 978-1: Das Objekt hat sich auch bei nichtmenschlichen Organismen und nichtlebenden SCP-Objekten als wirksam erwiesen."
  es: "Adenda 978-1: El objeto también ha demostrado ser eficaz en organismos no humanos y objetos SCP no vivos."
  fr: "Addendum 978-1 : L'objet s'est également révélé efficace sur des organismes non humains et des objets SCP non vivants."
  it: "Addendum 978-1: L'oggetto si è dimostrato efficace anche su organismi non umani e oggetti SCP non viventi."
  ko: "부록 978-1: 본 오브젝트는 인간 외의 생물체 및 비생물 SCP 오브젝트에도 효과가 있는 것으로 확인되었다."
  pl: "Aneks 978-1: Obiekt okazał się skuteczny również wobec organizmów innych niż ludzie oraz nieożywionych obiektów SCP."
  pt: "Adendo 978-1: O objeto também se mostrou eficaz em organismos não humanos e objetos SCP não vivos."
  th: "ภาคผนวก 978-1: วัตถุนี้ยังพิสูจน์แล้วว่าได้ผลกับสิ่งมีชีวิตที่ไม่ใช่มนุษย์ และวัตถุ SCP ที่ไม่มีชีวิตด้วย"
  uk: "Додаток 978-1: Об'єкт також виявився ефективним щодо нелюдських організмів та неживих об'єктів SCP."
  vi: "Phụ lục 978-1: Vật thể này cũng được chứng minh có hiệu quả với các sinh vật không phải người và các đối tượng SCP vô tri."
  zh: "补遗978-1：该对象对非人类生物及非生命体SCP对象同样有效。"
  zh_Hant: "補遺978-1：該對象對非人類生物及非生命體SCP對象同樣有效。"
