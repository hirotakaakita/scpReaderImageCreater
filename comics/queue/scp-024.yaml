# SCP-024 4コマ台本
# captionは記事本文（Special Containment Procedures / Description）からの引用。
# キャラにセリフは言わせない。
#
# 4コマの構成意図: 1コマ目=収容施設の外観・レプリカによる偽装（導入）、
# 2コマ目=D級職員が入場しアナウンサーに出迎えられる（展開）、3コマ目=障害物
# コースの様子（転・危険の高まり）、4コマ目=誰もカメラを見ていないはずなのに
# 録画テープが郵便受けに届く、というオチ（結・不気味な余韻）。補遺は使用しない
# （本編4コマの範囲外の内容のため）。

