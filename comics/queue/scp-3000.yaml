  - scene: >
      Feeding aftermath without gore: dark gray viscous substance Y-909 seeps from SCP-3000's skin into sampling equipment beside divers. No text.
    characters: [scp-3000]
    source:
      section: Description
      quote: "While SCP-3000 excretes a thin layer of a viscous, dark grey substance classified as Y-909 through its skin as it consumes prey"
      url: "https://scp-wiki.wikidot.com/scp-3000"
      fetched_at: "2026-09-21T00:00:00Z"
    caption: &c3
