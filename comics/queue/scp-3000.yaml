local_characters:
  scp-3000:
    name: "SCP-3000"
    appearance: >
      A colossal aquatic serpentine entity resembling a giant moray eel, with a 2.5 meter head,
      immense body sections and dark deep-sea scale texture.
    default_look: >
      Mostly motionless in abyssal water, impossibly long, partially hidden by darkness.
panels:
  - scene: >
      Abyssal ocean scale view: a Foundation submarine light reveals only the head and a short visible length of an enormous eel-like serpent fading into darkness. No text.
    characters: [scp-3000]
    source:
      section: Description
      quote: "SCP-3000 is a massive, aquatic, serpentine entity strongly resembling a giant moray eel. The full length of SCP-3000 is impossible to determine, but is hypothesized to be between 600 and 900 kilometers."
      url: "https://scp-wiki.wikidot.com/scp-3000"
      fetched_at: "2026-09-21T00:00:00Z"
    caption: &c1
