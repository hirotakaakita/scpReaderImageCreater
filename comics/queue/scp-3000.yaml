  - scene: >
      Diver observation scene: a Foundation diver looks toward the immense serpent and clutches their helmet as memory-distortion panic begins, with another diver nearby in murky water. No text.
    characters: [scp-3000]
    source:
      section: Description
      quote: "direct observation of SCP-3000 may cause severe mental alterations in viewers... inexplicable head pain, paranoia, general fear and panic, and memory loss or alteration."
      url: "https://scp-wiki.wikidot.com/scp-3000"
      fetched_at: "2026-09-21T00:00:00Z"
    caption: &c4
      ja: "SCP-3000を直接観察すると、頭痛、偏執、不安、恐慌、記憶の喪失や改変などの深刻な精神変化が生じます。"
