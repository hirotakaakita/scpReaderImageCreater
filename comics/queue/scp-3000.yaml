  - scene: >
      Close deep-sea view of SCP-3000's huge head and body diameter, nearly motionless on the seafloor near the Ganges Fan. No text.
    characters: [scp-3000]
    source:
      section: Description
      quote: "SCP-3000 is typically a sedentary creature, only moving its head in response to certain stimuli or during feeding. The majority of its body is located in and around the Ganges Fan"
      url: "https://scp-wiki.wikidot.com/scp-3000"
      fetched_at: "2026-09-21T00:00:00Z"
    caption: &c2
      ja: "SCP-3000は通常ほとんど動かず、刺激や摂食時に頭部だけを動かし、身体の大半はガンジス扇状地周辺にあります。"
      en: "SCP-3000 is usually sedentary, moving its head mainly in response to stimuli or feeding while most of its body lies around the Ganges Fan."
