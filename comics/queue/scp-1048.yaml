# SCP-1048「ビルダーベア」4コマ台本
# キャラにセリフは言わせない。captionは記事本文からの引用。

id: scp-1048

title:
  en: "SCP-1048: Builder Bear"
  ja: "SCP-1048：ビルダーベア"
  cs: "SCP-1048: Medvídek Stavitel"
  de: "SCP-1048: Baumeister-Bär"
  es: "SCP-1048: El Osito Constructor"
  fr: "SCP-1048 : L'Ours Bâtisseur"
  it: "SCP-1048: L'Orsetto Costruttore"
  ko: "SCP-1048: 빌더 베어"
  pl: "SCP-1048: Miś Budowniczy"
  pt: "SCP-1048: Urso Construtor"
  th: "SCP-1048: หมีช่างก่อสร้าง"
  uk: "SCP-1048: Ведмедик-Будівельник"
  vi: "SCP-1048: Gấu Thợ Xây"
  zh: "SCP-1048：建造熊"
  zh_Hant: "SCP-1048：建造熊"

attribution:
  article: "SCP-1048"
  author: "Andrew E."
  source_url: "http://scp-wiki.wikidot.com/scp-1048"
  license: "CC BY-SA 3.0"

object_class: Keter

characters: [researcher-hana]

panels:
  - scene: >
      Wide establishing shot, full body, long quiet concrete facility
      corridor stretching into the distance. Dr. Hana walks along mid-
      stride carrying a stack of folders, glancing down in surprise
      toward a small worn teddy bear about knee-height peeking out from
      around the corner ahead of her.
    characters: [researcher-hana]
    caption:
      ja: "SCP-1048は体長約33cmの小さなテディベアであり、自らの意志で移動することができる。"
      en: "SCP-1048 is a small teddy bear, approximately 33 centimeters in height, capable of moving of its own accord."
      cs: "SCP-1048 je malý medvídek, vysoký přibližně 33 centimetrů, schopný pohybovat se z vlastní vůle."
      de: "SCP-1048 ist ein kleiner Teddybär von etwa 33 Zentimetern Höhe, der sich aus eigenem Antrieb bewegen kann."
      es: "SCP-1048 es un osito de peluche de unos 33 centímetros de altura, capaz de moverse por voluntad propia."
      fr: "SCP-1048 est un petit ours en peluche d'environ 33 centimètres de haut, capable de se déplacer de son propre gré."
      it: "SCP-1048 è un piccolo orsacchiotto alto circa 33 centimetri, capace di muoversi di propria volontà."
      ko: "SCP-1048은 높이 약 33cm의 작은 곰인형으로, 스스로의 의지로 이동할 수 있다."
      pl: "SCP-1048 to mały miś pluszowy o wysokości około 33 centymetrów, zdolny poruszać się z własnej woli."
      pt: "SCP-1048 é um ursinho de pelúcia de cerca de 33 centímetros de altura, capaz de se mover por vontade própria."
      th: "SCP-1048 คือหมีตุ๊กตาขนาดเล็กสูงประมาณ 33 เซนติเมตร ที่สามารถเคลื่อนที่ได้ด้วยตัวเอง"
      uk: "SCP-1048 — маленький плюшевий ведмедик заввишки близько 33 сантиметрів, здатний рухатися за власною волею."
      vi: "SCP-1048 là một chú gấu bông nhỏ cao khoảng 33 cm, có khả năng tự di chuyển theo ý muốn của mình."
      zh: "SCP-1048是一只体长约33厘米的小型泰迪熊，能够凭自身意志移动。"
      zh_Hant: "SCP-1048是一隻體長約33公分的小型泰迪熊，能夠憑自身意志移動。"

  - scene: >
      Low angle close-up shot, camera near floor level looking up. The
      small teddy bear rushes forward and wraps both stubby arms tightly
      around Dr. Hana's leg in an affectionate hug, filling the lower
      frame. Her folders spill slightly as she looks down from above with
      a surprised, softening smile.
    characters: [researcher-hana]
    caption:
      ja: "本個体は、多くの者が愛らしいと感じる形で、人々に対して繰り返し愛情表現を示す。"
      en: "The subject regularly shows affection to individuals in ways found endearing by most people."
      cs: "Subjekt pravidelně projevuje lidem náklonnost způsobem, který většina lidí považuje za roztomilý."
      de: "Das Subjekt zeigt Personen regelmäßig Zuneigung auf eine Weise, die von den meisten Menschen als bezaubernd empfunden wird."
      es: "El sujeto muestra afecto regularmente a las personas de formas que la mayoría considera entrañables."
      fr: "Le sujet manifeste régulièrement de l'affection envers les individus, d'une manière jugée attachante par la plupart des gens."
      it: "Il soggetto mostra regolarmente affetto verso le persone in modi che la maggior parte trova adorabili."
      ko: "본 개체는 대부분의 사람들이 사랑스럽다고 느끼는 방식으로, 사람들에게 반복적으로 애정을 표현한다."
      pl: "Obiekt regularnie okazuje ludziom przywiązanie w sposób, który większość osób uważa za uroczy."
      pt: "O sujeito demonstra afeto regularmente às pessoas de maneiras consideradas encantadoras pela maioria."
      th: "วัตถุนี้แสดงความรักใคร่ต่อผู้คนเป็นประจำในแบบที่คนส่วนใหญ่รู้สึกว่าน่ารัก"
      uk: "Об'єкт регулярно виявляє прихильність до людей у спосіб, який більшість вважає милим."
      vi: "Đối tượng thường xuyên thể hiện tình cảm với mọi người theo cách mà hầu hết mọi người thấy đáng yêu."
      zh: "该个体经常以大多数人认为可爱的方式，向人们表达情感。"
      zh_Hant: "該個體經常以大多數人認為可愛的方式，向人們表達情感。"

  - scene: >
      Medium shot, waist-up, both subjects at the same eye level since
      Dr. Hana has crouched down. The teddy bear proudly holds up a
      crumpled crayon drawing with both paws, offering it to her. Dr. Hana
      reaches out, taking the drawing gently with both hands, visibly
      touched.
    characters: [researcher-hana]
    caption:
      ja: "本個体は、限られた身振りを通じてコミュニケーションを取ることができる。"
      en: "The subject is capable of communicating through a small range of gestures."
      cs: "Subjekt je schopen komunikovat pomocí omezené škály gest."
      de: "Das Subjekt ist in der Lage, über eine begrenzte Anzahl an Gesten zu kommunizieren."
      es: "El sujeto es capaz de comunicarse mediante un pequeño repertorio de gestos."
      fr: "Le sujet est capable de communiquer au moyen d'un petit répertoire de gestes."
      it: "Il soggetto è in grado di comunicare attraverso una gamma limitata di gesti."
      ko: "본 개체는 제한된 범위의 몸짓을 통해 의사소통이 가능하다."
      pl: "Obiekt potrafi komunikować się za pomocą niewielkiego zestawu gestów."
      pt: "O sujeito é capaz de se comunicar por meio de um pequeno repertório de gestos."
      th: "วัตถุนี้สามารถสื่อสารผ่านท่าทางที่จำกัดได้จำนวนหนึ่ง"
      uk: "Об'єкт здатен спілкуватися за допомогою невеликого набору жестів."
      vi: "Đối tượng có khả năng giao tiếp thông qua một số cử chỉ hạn chế."
      zh: "该个体能够通过有限的一些手势进行交流。"
      zh_Hant: "該個體能夠透過有限的一些手勢進行交流。"

  - scene: >
      Wide shot, full body, showing the whole office from behind Dr. Hana
      at an angle. She sits at her desk in the foreground, turned around
      in her chair to glance back over her shoulder at the corkboard on
      the far wall, now decorated with the crayon drawing pinned proudly
      at the center among official Foundation memos.
    characters: [researcher-hana]
    caption:
      ja: "本個体が作り出したものは、さらなる証拠がより穏当な対応を正当化しない限り、発見次第破壊するものとする。"
      en: "Any creation of SCP-1048's is to be destroyed on sight, unless further evidence warrants less extreme action."
      cs: "Jakýkoli výtvor SCP-1048 má být zničen na místě, pokud další důkazy neodůvodní mírnější postup."
      de: "Jede Kreation von SCP-1048 ist auf Sicht zu zerstören, sofern nicht weitere Beweise ein weniger drastisches Vorgehen rechtfertigen."
      es: "Cualquier creación de SCP-1048 debe destruirse en cuanto se detecte, a menos que nuevas pruebas justifiquen una medida menos extrema."
      fr: "Toute création de SCP-1048 doit être détruite à vue, sauf si des preuves supplémentaires justifient une mesure moins radicale."
      it: "Qualsiasi creazione di SCP-1048 deve essere distrutta a vista, a meno che ulteriori prove non giustifichino un'azione meno estrema."
      ko: "SCP-1048이 만든 창작물은, 추가 증거가 온건한 조치를 정당화하지 않는 한, 발견 즉시 파괴한다."
      pl: "Każdy twór SCP-1048 należy zniszczyć natychmiast po zauważeniu, chyba że dalsze dowody uzasadnią łagodniejsze działanie."
      pt: "Qualquer criação de SCP-1048 deve ser destruída à vista, a menos que novas evidências justifiquem uma ação menos extrema."
      th: "สิ่งใดก็ตามที่ SCP-1048 สร้างขึ้นจะต้องถูกทำลายทันทีที่พบเห็น เว้นแต่จะมีหลักฐานเพิ่มเติมที่สนับสนุนมาตรการที่รุนแรงน้อยกว่า"
      uk: "Будь-який витвір SCP-1048 підлягає знищенню на місці, якщо додаткові докази не виправдовують менш радикальних дій."
      vi: "Bất kỳ sản phẩm nào do SCP-1048 tạo ra phải bị tiêu hủy ngay khi phát hiện, trừ khi có thêm bằng chứng cho thấy nên áp dụng biện pháp ít cực đoan hơn."
      zh: "SCP-1048制造的任何物品，一经发现即应销毁，除非有进一步证据表明可采取较温和的处置方式。"
      zh_Hant: "SCP-1048製造的任何物品，一經發現即應銷毀，除非有進一步證據表明可採取較溫和的處置方式。"

addendum:
  ja: "補遺1048-1：職員の士気向上効果が確認されているため、発見時の破壊は最終手段とされている。"
  en: "Addendum 1048-1: Due to its documented effect on staff morale, destruction on sight remains a last resort."
  cs: "Dodatek 1048-1: Vzhledem k jeho zdokumentovanému vlivu na morálku personálu zůstává zničení na místě až posledním řešením."
  de: "Anhang 1048-1: Aufgrund der dokumentierten Wirkung auf die Personalmoral bleibt die sofortige Zerstörung nur letztes Mittel."
  es: "Adenda 1048-1: Debido a su efecto documentado en la moral del personal, la destrucción al ser detectado sigue siendo el último recurso."
  fr: "Addendum 1048-1 : En raison de son effet documenté sur le moral du personnel, la destruction à vue reste un dernier recours."
  it: "Addendum 1048-1: Vista la documentata influenza sul morale del personale, la distruzione a vista resta l'ultima risorsa."
  ko: "부록 1048-1: 직원 사기에 미치는 효과가 확인되었으므로, 발견 즉시 파괴는 최후의 수단으로 남겨둔다."
  pl: "Aneks 1048-1: Ze względu na udokumentowany wpływ na morale personelu, natychmiastowe zniszczenie pozostaje ostatecznością."
  pt: "Adendo 1048-1: Devido ao efeito documentado sobre o moral da equipe, a destruição à vista continua sendo o último recurso."
  th: "ภาคผนวก 1048-1: เนื่องจากมีผลบวกต่อขวัญกำลังใจของเจ้าหน้าที่ที่ได้รับการบันทึกไว้ การทำลายทันทีที่พบเห็นจึงถือเป็นทางเลือกสุดท้าย"
  uk: "Додаток 1048-1: Через задокументований вплив на моральний дух персоналу знищення на місці залишається крайнім заходом."
  vi: "Phụ lục 1048-1: Do tác động tích cực đã được ghi nhận đối với tinh thần nhân viên, việc tiêu hủy ngay khi phát hiện chỉ là biện pháp cuối cùng."
  zh: "补遗1048-1：鉴于其对员工士气有据可查的正面影响，发现即销毁仅作为最后手段。"
  zh_Hant: "補遺1048-1：鑑於其對員工士氣有據可查的正面影響，發現即銷毀僅作為最後手段。"
