# SCP-914「からくり精製機」4コマ台本
# キャラにセリフは言わせない。各コマの絵は、そのコマのcaption（記事原文に近い引用）を
# 視覚化する背景として機能させる。

id: scp-914

title:
  en: "SCP-914: The Clockworks"
  ja: "SCP-914：からくり精製機"
  cs: "SCP-914: Hodinový stroj"
  de: "SCP-914: Das Uhrwerk"
  es: "SCP-914: El Relojero"
  fr: "SCP-914 : L'Horlogerie"
  it: "SCP-914: L'Orologeria"
  ko: "SCP-914: 시계태엽 장치"
  pl: "SCP-914: Zegarowy Mechanizm"
  pt: "SCP-914: A Relojoaria"
  th: "SCP-914: เครื่องจักรนาฬิกา"
  uk: "SCP-914: Годинниковий механізм"
  vi: "SCP-914: Cỗ Máy Đồng Hồ"
  zh: "SCP-914：钟表装置"
  zh_Hant: "SCP-914：鐘錶裝置"

attribution:
  article: "SCP-914"
  author: "Dr Gears"
  source_url: "http://scp-wiki.wikidot.com/scp-914"
  license: "CC BY-SA 3.0"

object_class: Safe

characters: [researcher-hana]

panels:
  - scene: >
      Wide establishing shot, full body, seen from a low angle so the
      enormous intricate clockwork machine towers over the frame, filling
      most of the room with countless brass gears, pulleys, and pipes.
      Dr. Hana is small in the lower corner of the frame at its Intake
      booth, holding a small chipped ceramic mug.
    characters: [researcher-hana]
    caption:
      ja: "SCP-914は、時計仕掛けの機構で構成された大型の機械であり、単一のダイヤルを持つ制御盤に接続されている。"
      en: "SCP-914 is a large machine constructed of clockwork mechanisms, connected to a control panel with a single input dial."
      cs: "SCP-914 je velký stroj sestavený z hodinových mechanismů, napojený na ovládací panel s jedním vstupním ciferníkem."
      de: "SCP-914 ist eine große Maschine aus Uhrwerkmechanismen, verbunden mit einem Bedienfeld mit einem einzigen Eingabewahlrad."
      es: "SCP-914 es una gran máquina construida con mecanismos de relojería, conectada a un panel de control con un único dial de entrada."
      fr: "SCP-914 est une grande machine constituée de mécanismes d'horlogerie, reliée à un panneau de contrôle doté d'un unique cadran d'entrée."
      it: "SCP-914 è una grande macchina costruita con meccanismi a orologeria, collegata a un pannello di controllo con un'unica manopola di ingresso."
      ko: "SCP-914는 시계태엽 기구로 구성된 대형 기계로, 단일 입력 다이얼이 달린 제어판에 연결되어 있다."
      pl: "SCP-914 to duża maszyna zbudowana z mechanizmów zegarowych, połączona z panelem sterowania z pojedynczym pokrętłem wejściowym."
      pt: "SCP-914 é uma grande máquina construída com mecanismos de relojoaria, conectada a um painel de controle com um único mostrador de entrada."
      th: "SCP-914 คือเครื่องจักรขนาดใหญ่ที่สร้างจากกลไกนาฬิกา เชื่อมต่อกับแผงควบคุมที่มีปุ่มหมุนเพียงปุ่มเดียว"
      uk: "SCP-914 — великий механізм, побудований із годинникових механізмів, з'єднаний із панеллю керування з єдиним вхідним диском."
      vi: "SCP-914 là một cỗ máy lớn được cấu tạo từ các cơ chế đồng hồ, kết nối với bảng điều khiển có một núm vặn đầu vào duy nhất."
      zh: "SCP-914是一台由钟表机构构成的大型机械，连接着一个只有一个输入旋钮的控制面板。"
      zh_Hant: "SCP-914是一台由鐘錶機構構成的大型機械，連接著一個只有一個輸入旋鈕的控制面板。"

  - scene: >
      Close-up shot on the control panel itself, filling most of the frame.
      Dr. Hana's hand grips a large brass dial mid-turn, surrounded by
      dozens of small gauges and exposed gears. Her face is a small sliver
      at the frame's edge, focused in concentration.
    characters: [researcher-hana]
    caption:
      ja: "ダイヤルはRough、Coarse、1:1、Fine、Very Fineの5段階のいずれかに設定できる。"
      en: "The dial can be turned to one of five settings: Rough, Coarse, 1:1, Fine, or Very Fine."
      cs: "Ciferník lze nastavit na jednu z pěti poloh: Hrubé, Nahrubo, 1:1, Jemné nebo Velmi jemné."
      de: "Das Wahlrad lässt sich auf eine von fünf Stufen einstellen: Grob, Rau, 1:1, Fein oder Sehr fein."
      es: "El dial puede ajustarse a uno de cinco niveles: Basto, Tosco, 1:1, Fino o Muy fino."
      fr: "Le cadran peut être réglé sur l'un des cinq niveaux : Grossier, Brut, 1:1, Fin ou Très fin."
      it: "La manopola può essere impostata su uno dei cinque livelli: Grezzo, Ruvido, 1:1, Fine o Molto fine."
      ko: "다이얼은 거침, 조악함, 1:1, 정밀, 매우 정밀의 다섯 단계 중 하나로 설정할 수 있다."
      pl: "Pokrętło można ustawić na jeden z pięciu poziomów: Zgrubny, Chropowaty, 1:1, Dokładny lub Bardzo dokładny."
      pt: "O mostrador pode ser ajustado para um dos cinco níveis: Bruto, Grosseiro, 1:1, Fino ou Muito fino."
      th: "ปุ่มหมุนสามารถตั้งค่าได้ 5 ระดับ ได้แก่ หยาบมาก หยาบ 1:1 ละเอียด หรือละเอียดมาก"
      uk: "Диск можна встановити на одне з п'яти положень: Грубе, Черенове, 1:1, Тонке або Дуже тонке."
      vi: "Núm vặn có thể xoay đến một trong năm mức: Thô nặng, Thô, 1:1, Tinh, hoặc Rất tinh."
      zh: "旋钮可调至五档之一：粗糙、粗、1:1、精细或极精细。"
      zh_Hant: "旋鈕可調至五檔之一：粗糙、粗、1:1、精細或極精細。"

  - scene: >
      Medium shot, dynamic diagonal composition. The Output booth door
      hisses open in a burst of steam. Inside sits an absurdly
      over-engineered teacup covered in extra tiny gears, needless spouts,
      and ornate handles. Dr. Hana's stunned, deadpan face peeks in from
      the frame's edge.
    characters: [researcher-hana]
    caption:
      ja: "精製処理の結果は設定によって異なり、必ずしも予測可能ではない。"
      en: "The outcome of the refining process differs depending on the setting used, and is not entirely predictable."
      cs: "Výsledek procesu zjemňování se liší podle použitého nastavení a není zcela předvídatelný."
      de: "Das Ergebnis des Verfeinerungsprozesses variiert je nach verwendeter Einstellung und ist nicht vollständig vorhersehbar."
      es: "El resultado del proceso de refinado varía según el ajuste utilizado y no es totalmente predecible."
      fr: "Le résultat du processus de raffinage varie selon le réglage utilisé et n'est pas entièrement prévisible."
      it: "L'esito del processo di raffinazione varia a seconda dell'impostazione utilizzata e non è del tutto prevedibile."
      ko: "정제 과정의 결과는 사용된 설정에 따라 달라지며, 완전히 예측 가능하지는 않다."
      pl: "Wynik procesu rafinacji różni się w zależności od zastosowanego ustawienia i nie jest w pełni przewidywalny."
      pt: "O resultado do processo de refino varia conforme o ajuste utilizado e não é totalmente previsível."
      th: "ผลลัพธ์ของกระบวนการกลั่นกรองจะแตกต่างกันไปตามการตั้งค่าที่ใช้ และไม่สามารถคาดเดาได้ทั้งหมด"
      uk: "Результат процесу рафінування залежить від використаного налаштування і не є повністю передбачуваним."
      vi: "Kết quả của quá trình tinh chế thay đổi tùy theo mức cài đặt được sử dụng và không hoàn toàn có thể đoán trước."
      zh: "精炼过程的结果因所用档位而异，并非完全可以预测。"
      zh_Hant: "精煉過程的結果因所用檔位而異，並非完全可以預測。"

  - scene: >
      Wide shot, full body, eye level, showing Dr. Hana's whole office desk
      and chair from a slight side angle. She leans back in her chair
      holding the ridiculous over-engineered teacup up to the light at
      arm's length, examining its many tiny gears with a tired but
      faintly amused half-smile.
    characters: [researcher-hana]
    caption:
      ja: "SCP-914の操作は、正式な申請書を提出しサイト司令部の承認を得た職員のみに許可されている。"
      en: "Only personnel who submit a formal request and receive approval from site command may operate SCP-914."
      cs: "Obsluhovat SCP-914 smí pouze personál, který podá formální žádost a obdrží schválení od velitelství areálu."
      de: "Nur Personal, das einen formellen Antrag stellt und die Genehmigung der Standortleitung erhält, darf SCP-914 bedienen."
      es: "Solo el personal que presente una solicitud formal y reciba la aprobación del comando del sitio puede operar SCP-914."
      fr: "Seul le personnel ayant soumis une demande formelle et reçu l'approbation du commandement du site peut faire fonctionner SCP-914."
      it: "Solo il personale che presenta una richiesta formale e riceve l'approvazione del comando del sito può azionare SCP-914."
      ko: "정식 신청서를 제출하고 사이트 사령부의 승인을 받은 직원만이 SCP-914를 조작할 수 있다."
      pl: "Obsługiwać SCP-914 może wyłącznie personel, który złoży formalny wniosek i otrzyma zgodę dowództwa placówki."
      pt: "Somente pessoal que apresente uma solicitação formal e receba aprovação do comando do local pode operar SCP-914."
      th: "มีเพียงเจ้าหน้าที่ที่ยื่นคำร้องอย่างเป็นทางการและได้รับอนุมัติจากหน่วยบัญชาการไซต์เท่านั้นที่สามารถควบคุม SCP-914 ได้"
      uk: "Керувати SCP-914 дозволено лише персоналу, який подав офіційний запит і отримав схвалення командування об'єкта."
      vi: "Chỉ những nhân viên nộp đơn yêu cầu chính thức và được sự chấp thuận của ban chỉ huy cơ sở mới được phép vận hành SCP-914."
      zh: "只有提交正式申请并获得站点指挥部批准的人员，才能操作SCP-914。"
      zh_Hant: "只有提交正式申請並獲得站點指揮部批准的人員，才能操作SCP-914。"

addendum:
  ja: "補遺914-1：Very Fine設定での精製結果に、明確な法則性は確認されていない。"
  en: "Addendum 914-1: No consistent pattern has been identified in refinement outcomes at the Very Fine setting."
  cs: "Dodatek 914-1: U nastavení Velmi jemné nebyl zjištěn žádný konzistentní vzorec výsledků zjemnění."
  de: "Anhang 914-1: Bei der Einstellung Sehr fein wurde kein einheitliches Muster der Verfeinerungsergebnisse festgestellt."
  es: "Adenda 914-1: No se ha identificado un patrón consistente en los resultados del refinado con el ajuste Muy fino."
  fr: "Addendum 914-1 : Aucun schéma cohérent n'a été identifié dans les résultats du raffinage au réglage Très fin."
  it: "Addendum 914-1: Non è stato individuato alcuno schema coerente nei risultati della raffinazione con l'impostazione Molto fine."
  ko: "부록 914-1: 매우 정밀 설정에서의 정제 결과에는 일관된 규칙성이 확인되지 않았다."
  pl: "Aneks 914-1: Nie zidentyfikowano spójnego wzorca wyników rafinacji przy ustawieniu Bardzo dokładne."
  pt: "Adendo 914-1: Nenhum padrão consistente foi identificado nos resultados do refino no ajuste Muito fino."
  th: "ภาคผนวก 914-1: ยังไม่พบรูปแบบที่แน่นอนของผลลัพธ์การกลั่นกรองในการตั้งค่าละเอียดมาก"
  uk: "Додаток 914-1: На налаштуванні Дуже тонке не виявлено жодної послідовної закономірності результатів рафінування."
  vi: "Phụ lục 914-1: Chưa xác định được quy luật nhất quán nào trong kết quả tinh chế ở mức Rất tinh."
  zh: "补遗914-1：在『极精细』档位下，精炼结果尚未发现明确规律。"
  zh_Hant: "補遺914-1：在『極精細』檔位下，精煉結果尚未發現明確規律。"
