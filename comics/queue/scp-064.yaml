panels:
  - scene: >
      Wide shot, full body, showing the whole scene, a remote flat
      expanse of soft desert earth. attending-researcher-m kneels and
      carefully sets down a light brown earthenware brick on the bare
      ground, clipboard tucked under one arm.
    characters: [attending-researcher-m]
    caption:
      ja: "SCP-064は、主に酸化ケイ素と若干の有機物からなる薄茶色の陶製レンガである。重さは1.6kg、寸法はおよそ10cm×6cm×20cmで、外見は建築用の一般的な煉瓦とほぼ変わらない。"
      en: "SCP-064 is a light brown earthenware brick composed primarily of silicon oxides and some organic matter. The object weighs 1.6 kg and measures some 10 cm x 6 cm x 20 cm, and is visually similar to most solid bricks used in construction."
      cs: "SCP-064 je světle hnědá keramická cihla složená především z oxidů křemíku a určitého množství organické hmoty. Předmět váží 1,6 kg a měří přibližně 10 cm x 6 cm x 20 cm, přičemž vizuálně připomíná většinu plných cihel používaných ve stavebnictví."
      de: "SCP-064 ist ein hellbrauner Tonziegel, der hauptsächlich aus Siliziumoxiden und etwas organischer Materie besteht. Das Objekt wiegt 1,6 kg und misst etwa 10 cm x 6 cm x 20 cm; optisch ähnelt es den meisten massiven Ziegeln, wie sie im Bauwesen verwendet werden."
      es: "SCP-064 es un ladrillo de cerámica de color marrón claro, compuesto principalmente de óxidos de silicio y algo de materia orgánica. El objeto pesa 1,6 kg y mide unos 10 cm x 6 cm x 20 cm, y visualmente es similar a la mayoría de los ladrillos macizos usados en la construcción."
      fr: "Le SCP-064 est une brique de terre cuite brun clair, composée principalement d'oxydes de silicium et d'un peu de matière organique. L'objet pèse 1,6 kg et mesure environ 10 cm x 6 cm x 20 cm, et ressemble visuellement à la plupart des briques pleines utilisées en construction."
      it: "SCP-064 è un mattone di terracotta marrone chiaro, composto principalmente da ossidi di silicio e un po' di materia organica. L'oggetto pesa 1,6 kg e misura circa 10 cm x 6 cm x 20 cm, ed è visivamente simile alla maggior parte dei mattoni pieni usati nell'edilizia."
      ko: "SCP-064는 주로 규소 산화물과 약간의 유기물로 이루어진 옅은 갈색 토기 벽돌이다. 무게는 1.6kg이며 크기는 약 10cm x 6cm x 20cm로, 외관상 건축에 쓰이는 일반적인 벽돌과 매우 흡사하다."
      pl: "SCP-064 to jasnobrązowa cegła ceramiczna, złożona głównie z tlenków krzemu i pewnej ilości materii organicznej. Obiekt waży 1,6 kg i mierzy około 10 cm x 6 cm x 20 cm, a wizualnie przypomina większość pełnych cegieł stosowanych w budownictwie."
      pt: "O SCP-064 é um tijolo de cerâmica marrom-claro, composto principalmente por óxidos de silício e alguma matéria orgânica. O objeto pesa 1,6 kg e mede cerca de 10 cm x 6 cm x 20 cm, sendo visualmente semelhante à maioria dos tijolos maciços usados na construção."
      th: "SCP-064 คืออิฐดินเผาสีน้ำตาลอ่อนที่ประกอบด้วยซิลิกอนออกไซด์เป็นหลักและสารอินทรีย์บางส่วน วัตถุนี้มีน้ำหนัก 1.6 กิโลกรัม และมีขนาดประมาณ 10 ซม. x 6 ซม. x 20 ซม. มีลักษณะคล้ายกับอิฐตันทั่วไปที่ใช้ในงานก่อสร้าง"
      uk: "SCP-064 — це світло-коричнева керамічна цегла, що складається переважно з оксидів кремнію та невеликої кількості органічної речовини. Об'єкт важить 1,6 кг і має розміри приблизно 10 см x 6 см x 20 см, візуально нагадуючи більшість суцільних цеглин, що використовуються в будівництві."
      vi: "SCP-064 là một viên gạch đất nung màu nâu nhạt, chủ yếu được cấu tạo từ các oxit silic và một số chất hữu cơ. Vật thể nặng 1,6 kg và có kích thước khoảng 10 cm x 6 cm x 20 cm, về mặt hình thức tương tự như hầu hết các viên gạch đặc dùng trong xây dựng."
      zh: "SCP-064是一块浅棕色陶土砖，主要由氧化硅和少量有机物组成。该物体重1.6公斤，尺寸约为10厘米×6厘米×20厘米，外观上与建筑用的普通实心砖十分相似。"
      zh_Hant: "SCP-064是一塊淺棕色陶土磚，主要由氧化矽和少量有機物組成。該物體重1.6公斤，尺寸約為10公分×6公分×20公分，外觀上與建築用的普通實心磚十分相似。"

  - scene: >
      Medium shot, waist-up, a different framing from the wide shot
      before. attending-researcher-f kneels close to the ground with a
      magnifying glass, examining a faint fibrous lattice next to the
      original brick, where a second brick is partly formed and still
      solidifying out of the soil.
    characters: [attending-researcher-f]
    caption:
      ja: "柔らかい土の平地に放置すると、SCP-064は未知の機構によって増殖を始める。まず元の物体と同じ形をした不規則なケイ素繊維の格子構造が現れ、そこに土壌由来の混合物が充填・固化して、やがて適切な質量に達する。"
      en: "When left lying on a flat expanse of soft earth, SCP-064 will begin to multiply through an unknown mechanism. An irregular lattice of silicon fibers appears in the shape of the original object, which then fills and solidifies with a soil-based mixture until it attains the proper mass."
      cs: "Je-li ponecháno na rovné ploše měkké půdy, SCP-064 se začne neznámým mechanismem množit. Objeví se nepravidelná mřížka křemíkových vláken ve tvaru původního předmětu, která se poté vyplní a ztuhne směsí na bázi půdy, dokud nedosáhne správné hmotnosti."
      de: "Wenn SCP-064 auf einer flachen Fläche aus weicher Erde liegen gelassen wird, beginnt es sich durch einen unbekannten Mechanismus zu vermehren. Ein unregelmäßiges Gitter aus Siliziumfasern erscheint in der Form des ursprünglichen Objekts, das sich anschließend mit einer erdbasierten Mischung füllt und verfestigt, bis es die richtige Masse erreicht."
      es: "Cuando se deja sobre una extensión plana de tierra blanda, el SCP-064 comienza a multiplicarse mediante un mecanismo desconocido. Aparece una red irregular de fibras de silicio con la forma del objeto original, que luego se rellena y solidifica con una mezcla a base de tierra hasta alcanzar la masa adecuada."
      fr: "Lorsqu'il est laissé sur une étendue plate de terre meuble, le SCP-064 commence à se multiplier par un mécanisme inconnu. Un réseau irrégulier de fibres de silicium apparaît sous la forme de l'objet original, qui se remplit ensuite et se solidifie avec un mélange à base de terre jusqu'à atteindre la masse appropriée."
      it: "Se lasciato su una distesa piana di terra soffice, SCP-064 inizia a moltiplicarsi tramite un meccanismo sconosciuto. Appare un reticolo irregolare di fibre di silicio nella forma dell'oggetto originale, che poi si riempie e si solidifica con una miscela a base di terra fino a raggiungere la massa corretta."
      ko: "부드러운 흙의 평평한 지대에 놓아두면 SCP-064는 알 수 없는 메커니즘으로 증식을 시작한다. 원래 물체와 같은 형태의 불규칙한 규소 섬유 격자가 나타나며, 이후 흙 기반 혼합물이 채워지고 굳어져 적정 질량에 도달한다."
      pl: "Pozostawiona na płaskim obszarze miękkiej ziemi, SCP-064 zaczyna się mnożyć poprzez nieznany mechanizm. Pojawia się nieregularna siatka włókien krzemowych w kształcie oryginalnego obiektu, która następnie wypełnia się i twardnieje mieszaniną na bazie gleby, aż osiągnie odpowiednią masę."
      pt: "Quando deixado sobre uma extensão plana de terra macia, o SCP-064 começa a se multiplicar por um mecanismo desconhecido. Uma treliça irregular de fibras de silício aparece na forma do objeto original, que então se preenche e solidifica com uma mistura à base de solo até atingir a massa adequada."
      th: "เมื่อวางทิ้งไว้บนพื้นที่ราบของดินอ่อน SCP-064 จะเริ่มเพิ่มจำนวนผ่านกลไกที่ไม่ทราบสาเหตุ โครงตาข่ายเส้นใยซิลิกอนที่ไม่สม่ำเสมอจะปรากฏขึ้นในรูปทรงของวัตถุดั้งเดิม จากนั้นจะเติมและแข็งตัวด้วยส่วนผสมจากดินจนกระทั่งมีมวลที่เหมาะสม"
      uk: "Якщо залишити на рівній ділянці м'якого ґрунту, SCP-064 починає розмножуватися за допомогою невідомого механізму. З'являється нерегулярна решітка з кремнієвих волокон у формі оригінального об'єкта, яка потім заповнюється й твердне сумішшю на основі ґрунту, доки не досягне належної маси."
      vi: "Khi được để trên một khoảng đất mềm bằng phẳng, SCP-064 sẽ bắt đầu nhân lên qua một cơ chế không xác định. Một mạng lưới sợi silic không đều xuất hiện theo hình dạng của vật thể gốc, sau đó được lấp đầy và đông cứng bằng hỗn hợp có nguồn gốc từ đất cho đến khi đạt được khối lượng thích hợp."
      zh: "若放置在松软的平坦土地上，SCP-064会通过未知机制开始增殖。会出现与原物体形状相同的不规则硅纤维网格，随后其中填充并凝固为土壤基混合物，直至达到适当质量。"
      zh_Hant: "若放置在鬆軟的平坦土地上，SCP-064會透過未知機制開始增殖。會出現與原物體形狀相同的不規則矽纖維網格，隨後其中填充並凝固為土壤基混合物，直至達到適當質量。"

  - scene: >
      Wide aerial shot, pulled back far, showing a sprawling and highly
      complex freestanding brick structure with visible floors and
      ceilings taking the shape of a twelve-pointed star across the
      desert plain. attending-researcher-m and attending-researcher-f
      stand tiny at the edge of the frame, dwarfed by the scale of the
      structure.
    characters: [attending-researcher-m, attending-researcher-f]
    caption:
      ja: "十分に広い土地を与えられると、SCP-064は床や天井を含む、極めて複雑ながら理論上は安定した自立式の煉瓦構造物を作り出す。過去の観測では、その構造物は直径10km超に及ぶ十二芒星の形状に達し得ることが示されている。"
      en: "Given a large expanse of earth to work with, SCP-064 produces a highly complex but theoretically stable freestanding brick structure, including floors and ceilings. Past observations indicate that the structure could attain the shape of a twelve-pointed star, over 10km in diameter."
      cs: "Pokud má k dispozici rozsáhlou plochu půdy, SCP-064 vytváří vysoce komplexní, ale teoreticky stabilní samostatně stojící cihlovou stavbu, včetně podlah a stropů. Dřívější pozorování naznačují, že stavba by mohla nabýt tvaru dvanáctihroté hvězdy o průměru přesahujícím 10 km."
      de: "Bei ausreichend großer Bodenfläche erzeugt SCP-064 eine hochkomplexe, aber theoretisch stabile freistehende Ziegelstruktur, einschließlich Böden und Decken. Frühere Beobachtungen deuten darauf hin, dass die Struktur die Form eines zwölfzackigen Sterns mit über 10 km Durchmesser annehmen könnte."
      es: "Con una gran extensión de tierra disponible, el SCP-064 produce una estructura de ladrillo independiente altamente compleja, pero teóricamente estable, que incluye pisos y techos. Observaciones anteriores indican que la estructura podría alcanzar la forma de una estrella de doce puntas, de más de 10 km de diámetro."
      fr: "Avec une vaste étendue de terre à disposition, le SCP-064 produit une structure de briques autoportante extrêmement complexe mais théoriquement stable, comprenant des sols et des plafonds. Des observations passées indiquent que la structure pourrait prendre la forme d'une étoile à douze branches de plus de 10 km de diamètre."
      it: "Data una vasta distesa di terra su cui operare, SCP-064 produce una struttura in mattoni autoportante altamente complessa ma teoricamente stabile, compresi pavimenti e soffitti. Osservazioni passate indicano che la struttura potrebbe assumere la forma di una stella a dodici punte, di oltre 10 km di diametro."
      ko: "충분히 넓은 땅이 주어지면 SCP-064는 바닥과 천장을 포함한, 매우 복잡하지만 이론적으로는 안정적인 자립형 벽돌 구조물을 만들어낸다. 과거의 관측에 따르면 이 구조물은 직경 10km가 넘는 12각 별 모양에 이를 수 있는 것으로 나타났다."
      pl: "Mając do dyspozycji rozległy obszar ziemi, SCP-064 tworzy wysoce złożoną, choć teoretycznie stabilną, samodzielną konstrukcję z cegły, obejmującą podłogi i sufity. Wcześniejsze obserwacje wskazują, że konstrukcja może przybrać kształt dwunastoramiennej gwiazdy o średnicy przekraczającej 10 km."
      pt: "Dada uma grande extensão de terra para trabalhar, o SCP-064 produz uma estrutura de tijolos autônoma altamente complexa, mas teoricamente estável, incluindo pisos e tetos. Observações anteriores indicam que a estrutura poderia atingir a forma de uma estrela de doze pontas, com mais de 10 km de diâmetro."
      th: "เมื่อมีพื้นที่ดินกว้างขวางให้ทำงาน SCP-064 จะสร้างโครงสร้างอิฐแบบตั้งอิสระที่ซับซ้อนสูงแต่ในทางทฤษฎีมีความมั่นคง รวมถึงพื้นและเพดาน การสังเกตในอดีตชี้ว่าโครงสร้างอาจมีรูปทรงเป็นดาวสิบสองแฉก มีเส้นผ่านศูนย์กลางกว่า 10 กิโลเมตร"
      uk: "Маючи у своєму розпорядженні великі площі ґрунту, SCP-064 створює надзвичайно складну, але теоретично стабільну окремо розташовану цегляну структуру, що включає підлоги та стелі. Попередні спостереження вказують, що структура може набути форми дванадцятипроменевої зірки діаметром понад 10 км."
      vi: "Khi có một vùng đất rộng lớn để hoạt động, SCP-064 tạo ra một cấu trúc gạch độc lập cực kỳ phức tạp nhưng về lý thuyết là ổn định, bao gồm cả sàn và trần. Các quan sát trước đây cho thấy cấu trúc này có thể đạt tới hình dạng một ngôi sao mười hai cánh, đường kính hơn 10km."
      zh: "在拥有足够广阔的土地时，SCP-064会构筑出一座高度复杂但理论上稳定的独立砖造结构，包括楼层与天花板。以往的观测显示，该结构可能形成直径超过10公里的十二角星形状。"
      zh_Hant: "在擁有足夠廣闊的土地時，SCP-064會構築出一座高度複雜但理論上穩定的獨立磚造結構，包括樓層與天花板。以往的觀測顯示，該結構可能形成直徑超過10公里的十二角星形狀。"

  - scene: >
      Close-up on attending-researcher-m's hands and face, urgent
      expression, a different framing from the aerial shot before,
      hurriedly pressing the original brick back into a gap at the base
      of the crumbling structure. Fine dust drifts off nearby secondary
      bricks that have begun to decay, and a wristwatch shows the time
      ticking close to twenty minutes.
    characters: [attending-researcher-m]
    caption:
      ja: "SCP-064が取り除かれると、構造物は崩壊を始め、すべての副次的な煉瓦は塵となって崩れていく。20分以内に物体を元の位置に戻せばこの崩壊は止まり、成長も再開できるが、その時間を過ぎると崩壊は不可逆となる。"
      en: "Once SCP-064 is removed, the structure begins to decay, and all secondary bricks crumble to dust. Replacing the object within twenty minutes halts this decay and allows growth to continue; past this threshold, the process is irreversible."
      cs: "Jakmile je SCP-064 odstraněno, stavba se začne rozpadat a všechny sekundární cihly se rozpadnou v prach. Vrácení předmětu na místo do dvaceti minut tento rozpad zastaví a umožní pokračování růstu; po uplynutí této doby je proces nevratný."
      de: "Sobald SCP-064 entfernt wird, beginnt die Struktur zu verfallen, und alle sekundären Ziegel zerfallen zu Staub. Wird das Objekt innerhalb von zwanzig Minuten zurückgelegt, stoppt dieser Verfall und das Wachstum kann fortgesetzt werden; nach Ablauf dieser Frist ist der Vorgang irreversibel."
      es: "Una vez que se retira el SCP-064, la estructura comienza a deteriorarse y todos los ladrillos secundarios se desmoronan hasta convertirse en polvo. Reemplazar el objeto dentro de veinte minutos detiene este deterioro y permite que el crecimiento continúe; pasado ese umbral, el proceso es irreversible."
      fr: "Une fois le SCP-064 retiré, la structure commence à se dégrader et toutes les briques secondaires s'effritent en poussière. Remettre l'objet en place dans les vingt minutes stoppe cette dégradation et permet à la croissance de continuer ; passé ce délai, le processus est irréversible."
      it: "Una volta rimosso SCP-064, la struttura inizia a decadere e tutti i mattoni secondari si sgretolano in polvere. Riposizionare l'oggetto entro venti minuti arresta questo decadimento e consente alla crescita di continuare; superata questa soglia, il processo è irreversibile."
      ko: "SCP-064가 제거되면 구조물은 붕괴하기 시작하며, 모든 이차 벽돌은 먼지로 부스러진다. 20분 이내에 물체를 원위치에 되돌려 놓으면 이 붕괴는 멈추고 성장이 재개될 수 있지만, 그 시간을 넘기면 과정은 되돌릴 수 없다."
      pl: "Gdy SCP-064 zostanie usunięte, struktura zaczyna się rozpadać, a wszystkie wtórne cegły kruszą się w pył. Zwrócenie obiektu na miejsce w ciągu dwudziestu minut zatrzymuje ten rozkład i pozwala kontynuować wzrost; po przekroczeniu tego progu proces jest nieodwracalny."
      pt: "Uma vez removido o SCP-064, a estrutura começa a se decompor e todos os tijolos secundários desmoronam em pó. Recolocar o objeto no lugar em até vinte minutos interrompe essa decomposição e permite que o crescimento continue; após esse limite, o processo é irreversível."
      th: "เมื่อ SCP-064 ถูกนำออก โครงสร้างจะเริ่มสลายตัว และอิฐรองทั้งหมดจะสลายกลายเป็นผง การนำวัตถุกลับไปวางคืนภายในยี่สิบนาทีจะหยุดการสลายตัวนี้และทำให้การเติบโตดำเนินต่อไปได้ แต่หากเกินเวลานี้ กระบวนการจะไม่สามารถย้อนกลับได้"
      uk: "Щойно SCP-064 видаляють, структура починає розпадатися, а всі вторинні цеглини перетворюються на пил. Повернення об'єкта на місце протягом двадцяти хвилин зупиняє цей розпад і дозволяє росту продовжитися; після завершення цього періоду процес незворотний."
      vi: "Sau khi SCP-064 bị lấy đi, cấu trúc bắt đầu suy tàn, và tất cả các viên gạch thứ cấp vỡ vụn thành bụi. Đặt vật thể trở lại trong vòng hai mươi phút sẽ ngăn chặn sự suy tàn này và cho phép quá trình phát triển tiếp tục; quá ngưỡng này, quá trình là không thể đảo ngược."
      zh: "一旦SCP-064被移除，该结构便开始崩解，所有次生砖块都会化为尘土。若在二十分钟内将该物体放回原位，则可阻止这一崩解并使生长得以继续；超过此时限，该过程将不可逆转。"
      zh_Hant: "一旦SCP-064被移除，該結構便開始崩解，所有次生磚塊都會化為塵土。若在二十分鐘內將該物體放回原位，則可阻止這一崩解並使生長得以繼續；超過此時限，該過程將不可逆轉。"
