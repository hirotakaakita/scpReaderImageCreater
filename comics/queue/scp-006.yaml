object_class: Safe

characters: [attending-researcher-m, attending-researcher-f]

panels:
  - scene: >
      Wide shot, eye level, showing a nondescript industrial complex
      disguised as a chemical factory in a remote rural area, tall
      fences and smokestacks in the background. Through an inner gate, a
      tiny, calm natural spring is barely visible, bubbling quietly in a
      fenced-off courtyard. On the right, Attending Researcher (Male)
      checks the gate lock, dwarfed by the industrial scenery around him.
    characters: [attending-researcher-m]
    caption:
      ja: "SCP-006はアストラハンの西60kmに位置する、非常に小さな泉である。"
      en: "SCP-006 is a very small spring located 60 km west of Astrakhan."
      cs: "SCP-006 je velmi malý pramen nacházející se 60 km západně od Astrachaně."
      de: "SCP-006 ist eine sehr kleine Quelle, die sich 60 km westlich von Astrachan befindet."
      es: "SCP-006 es un manantial muy pequeño ubicado a 60 km al oeste de Astracán."
      fr: "SCP-006 est une très petite source située à 60 km à l'ouest d'Astrakhan."
      it: "SCP-006 è una sorgente molto piccola situata a 60 km a ovest di Astrachan'."
      ko: "SCP-006는 아스트라한에서 서쪽으로 60km 떨어진 곳에 위치한 아주 작은 샘이다."
      pl: "SCP-006 to bardzo małe źródło znajdujące się 60 km na zachód od Astrachania."
      pt: "SCP-006 é uma fonte muito pequena localizada 60 km a oeste de Astracã."
      th: "SCP-006 คือน้ำพุขนาดเล็กมาก ตั้งอยู่ห่างจากอัสตราคานไปทางตะวันตก 60 กิโลเมตร"
      uk: "SCP-006 — це дуже маленьке джерело, розташоване за 60 км на захід від Астрахані."
      vi: "SCP-006 là một con suối rất nhỏ, nằm cách Astrakhan 60 km về phía tây."
      zh: "SCP-006是一处非常小的泉水，位于阿斯特拉罕以西60公里处。"
      zh_Hant: "SCP-006是一處非常小的泉水，位於阿斯特拉罕以西60公里處。"

  - scene: >
      Medium shot, waist-up, front-on, at the edge of the small spring.
      On the left, Attending Researcher (Male) wears a bulky, complete
      full-body positive-pressure suit with a sealed helmet, no bare skin
      visible, cautiously extending a sample vial on a long pole toward
      the water. On the right, Attending Researcher (Female), suited the
      same way, watches a handheld meter, with visible security cameras
      mounted on poles around them.
    characters: [attending-researcher-m, attending-researcher-f]
    caption:
      ja: "SCP-006に物理的な形で接触する職員は全員、改造されたクラスVI型BNCスーツの着用を義務付けられる。"
      en: "All personnel interacting with SCP-006 in any physical way are required to wear modified Class VI BNC suits."
      cs: "Veškerý personál, který jakýmkoli fyzickým způsobem přichází do styku s SCP-006, je povinen nosit upravené obleky třídy VI BNC."
      de: "Sämtliches Personal, das in irgendeiner physischen Weise mit SCP-006 interagiert, muss modifizierte BNC-Anzüge der Klasse VI tragen."
      es: "Todo el personal que interactúe físicamente con SCP-006 debe usar trajes BNC de Clase VI modificados."
      fr: "Tout le personnel entrant en contact physique avec SCP-006, de quelque manière que ce soit, doit porter des combinaisons BNC de classe VI modifiées."
      it: "Tutto il personale che interagisce fisicamente con SCP-006 in qualsiasi modo deve indossare tute BNC di Classe VI modificate."
      ko: "SCP-006와 어떤 형태로든 물리적으로 접촉하는 모든 직원은 개조된 6등급 BNC 방호복을 착용해야 한다."
      pl: "Cały personel mający jakikolwiek fizyczny kontakt z SCP-006 jest zobowiązany do noszenia zmodyfikowanych skafandrów klasy VI BNC."
      pt: "Todo o pessoal que interagir fisicamente com SCP-006 de qualquer forma deve usar trajes BNC de Classe VI modificados."
      th: "เจ้าหน้าที่ทุกคนที่มีปฏิสัมพันธ์ทางกายภาพกับ SCP-006 ไม่ว่าในรูปแบบใด ต้องสวมชุด BNC ระดับ VI ที่ดัดแปลง"
      uk: "Увесь персонал, який будь-яким фізичним чином контактує з SCP-006, зобов'язаний носити модифіковані костюми BNC класу VI."
      vi: "Tất cả nhân viên tiếp xúc vật lý với SCP-006 dưới bất kỳ hình thức nào đều phải mặc bộ đồ BNC Cấp VI đã được cải tiến."
      zh: "所有以任何物理方式接触SCP-006的人员，均须穿戴经改装的六级BNC防护服。"
      zh_Hant: "所有以任何物理方式接觸SCP-006的人員，均須穿戴經改裝的六級BNC防護服。"

  - scene: >
      Close-up shot, centered on Attending Researcher (Female)'s
      gloved hands gently lowering a small, visibly sickly lab rat, thin
      with patchy fur, into a shallow dish of clear water drawn from the
      spring. Her helmeted face is bent close, watching intently through
      her visor.
    characters: [attending-researcher-f]
    caption:
      ja: "泉から湧き出る液体は、1902年に単純なミネラルウォーターであると化学的に特定されたが、「健康」という異例の性質を有している。"
      en: "The liquid emitted from the spring has been chemically identified as simple mineral water in 1902, but has the unusual property of 'health.'"
      cs: "Kapalina vytékající z pramene byla v roce 1902 chemicky identifikována jako obyčejná minerální voda, avšak vykazuje neobvyklou vlastnost 'zdraví'."
      de: "Die aus der Quelle austretende Flüssigkeit wurde 1902 chemisch als einfaches Mineralwasser identifiziert, weist jedoch die ungewöhnliche Eigenschaft der 'Gesundheit' auf."
      es: "El líquido que emana del manantial fue identificado químicamente en 1902 como simple agua mineral, pero posee la inusual propiedad de la 'salud'."
      fr: "Le liquide émis par la source a été identifié chimiquement en 1902 comme une simple eau minérale, mais possède l'inhabituelle propriété de la « santé »."
      it: "Il liquido emesso dalla sorgente è stato identificato chimicamente nel 1902 come semplice acqua minerale, ma possiede l'insolita proprietà della 'salute'."
      ko: "샘에서 나오는 액체는 1902년 화학적으로 단순한 미네랄워터로 판명되었지만, '건강'이라는 이례적인 특성을 지니고 있다."
      pl: "Ciecz wydzielana ze źródła została chemicznie zidentyfikowana w 1902 roku jako zwykła woda mineralna, lecz posiada niezwykłą właściwość 'zdrowia'."
      pt: "O líquido emitido pela fonte foi identificado quimicamente em 1902 como simples água mineral, mas possui a incomum propriedade da 'saúde'."
      th: "ของเหลวที่ไหลออกจากน้ำพุถูกระบุทางเคมีในปี 1902 ว่าเป็นเพียงน้ำแร่ธรรมดา แต่กลับมีคุณสมบัติผิดปกติที่เรียกว่า 'สุขภาพ'"
      uk: "Рідину, що витікає з джерела, у 1902 році хімічно ідентифікували як звичайну мінеральну воду, проте вона має незвичайну властивість 'здоров'я'."
      vi: "Chất lỏng chảy ra từ con suối đã được xác định về mặt hóa học vào năm 1902 là nước khoáng thông thường, nhưng lại có đặc tính bất thường là 'sức khỏe'."
      zh: "泉水中涌出的液体，在1902年经化学鉴定为普通矿泉水，但却具有名为「健康」的异常特性。"
      zh_Hant: "泉水中湧出的液體，在1902年經化學鑑定為普通礦泉水，但卻具有名為「健康」的異常特性。"

  - scene: >
      Wide shot, full body, eye level, pulled back to show the whole
      testing area. The lab rat, now plump and glossy-furred, bounds
      energetically around the dish. On the left, Attending Researcher
      (Female) and on the right, Attending Researcher (Male), both still
      fully suited, lean in close together and stare through their
      visors in stunned disbelief.
    characters: [attending-researcher-f, attending-researcher-m]
    caption:
      ja: "動物対象に対する試験では、有害な細菌およびウイルス性病原体が即座に死滅した。"
      en: "Upon testing the liquid on animal subjects, hostile bacteria and viral agents were destroyed immediately."
      cs: "Při testování kapaliny na zvířecích subjektech byly škodlivé bakterie a virové agens okamžitě zničeny."
      de: "Bei Tests der Flüssigkeit an Tieren wurden schädliche Bakterien und Virenerreger sofort zerstört."
      es: "Al probar el líquido en sujetos animales, los agentes bacterianos y virales hostiles fueron destruidos de inmediato."
      fr: "Lors des tests du liquide sur des sujets animaux, les agents bactériens et viraux hostiles ont été détruits instantanément."
      it: "Testando il liquido su soggetti animali, gli agenti batterici e virali ostili sono stati distrutti immediatamente."
      ko: "동물 실험 대상에게 이 액체를 시험한 결과, 유해한 세균과 바이러스성 병원체가 즉시 파괴되었다."
      pl: "Podczas testowania cieczy na zwierzętach, wrogie bakterie i czynniki wirusowe zostały natychmiast zniszczone."
      pt: "Ao testar o líquido em sujeitos animais, agentes bacterianos e virais hostis foram destruídos imediatamente."
      th: "เมื่อทดสอบของเหลวกับสัตว์ทดลอง แบคทีเรียและเชื้อไวรัสที่เป็นอันตรายถูกทำลายลงทันที"
      uk: "Під час тестування рідини на тваринах ворожі бактерії та вірусні агенти були негайно знищені."
      vi: "Khi thử nghiệm chất lỏng trên động vật, các vi khuẩn và tác nhân virus gây hại đã bị tiêu diệt ngay lập tức."
      zh: "在对动物受试者进行测试时，有害细菌和病毒性病原体被立即消灭。"
      zh_Hant: "在對動物受試者進行測試時，有害細菌和病毒性病原體被立即消滅。"
