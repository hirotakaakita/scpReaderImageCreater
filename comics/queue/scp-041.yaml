# SCP-041 4コマ台本
# captionはSpecial Containment Procedures / Description本文からの引用。
# 「付き添い」の好みのうちグロ・スナッフ映画への言及は避け、児童向け番組の
# 側面のみ描写した。Addendum・Document-01（少女の歌声等の不穏な逸話）は
# 本編に混ぜない。キャラにセリフは言わせない。JP公式訳が直接取得できなかった
# ため、検証済みの英語本文からの翻訳（ja含む）。

id: scp-041

title:
  en: "SCP-041"
  ja: "SCP-041"
  cs: "SCP-041"
  de: "SCP-041"
  es: "SCP-041"
  fr: "SCP-041"
  it: "SCP-041"
  ko: "SCP-041"
  pl: "SCP-041"
  pt: "SCP-041"
  th: "SCP-041"
  uk: "SCP-041"
  vi: "SCP-041"
  zh: "SCP-041"
  zh_Hant: "SCP-041"

attribution:
  article: "SCP-041"
  source_url: "http://scp-wiki.wikidot.com/scp-041"
