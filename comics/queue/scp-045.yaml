# SCP-045 4コマ台本
# captionはSpecial Containment Procedures / Description本文からの引用。
# 発見時の潜水艦事故（乗組員12名喪失）とAddendum（アミノ酸生成実験）は
# グロ・被害描写のため本編から外した。キャラにセリフは言わせない。JP公式訳が
# 直接取得できなかったため、検証済みの英語本文からの翻訳（ja含む）。

