characters: [attending-researcher-f, attending-researcher-m]

panels:
  - scene: >
      Wide shot, full body, eye level, showing a hemispherical
      observation chamber filled with pale glowing neon gas. At its
      center, a large geometric icosahedron of glassy, fractured ice is
      suspended and bolted to a platform, faint internal cracks
      catching the light. attending-researcher-f observes through a
      thick viewport from the habitable section of the station.
    characters: [attending-researcher-f]
    caption:
      ja: "SCP-045は氷XIIでできた二十面体である。SCP-045は摂氏0.074ケルビンから500ケルビン、圧力0.4パスカルから3ギガパスカルの範囲で安定した状態を保つ。"
      en: "SCP-045 is an icosahedron composed of ice XII. SCP-045 remains in a stable state at temperatures ranging from 0.074 to 500 kelvin and pressures ranging from 0.4 pascals to 3 gigapascals."
      cs: "SCP-045 je dvacetistěn složený z ledu XII. SCP-045 zůstává ve stabilním stavu při teplotách od 0,074 do 500 kelvinů a tlacích od 0,4 pascalu do 3 gigapascalů."
      de: "SCP-045 ist ein Ikosaeder aus Eis XII. SCP-045 bleibt bei Temperaturen von 0,074 bis 500 Kelvin und Drücken von 0,4 Pascal bis 3 Gigapascal in einem stabilen Zustand."
      es: "SCP-045 es un icosaedro compuesto de hielo XII. SCP-045 permanece en un estado estable a temperaturas que van de 0,074 a 500 kelvin y presiones que van de 0,4 pascales a 3 gigapascales."
      fr: "Le SCP-045 est un icosaèdre composé de glace XII. Le SCP-045 reste dans un état stable à des températures allant de 0,074 à 500 kelvins et des pressions allant de 0,4 pascal à 3 gigapascals."
      it: "SCP-045 è un icosaedro composto da ghiaccio XII. SCP-045 rimane in uno stato stabile a temperature comprese tra 0,074 e 500 kelvin e pressioni comprese tra 0,4 pascal e 3 gigapascal."
      ko: "SCP-045는 얼음 XII로 구성된 정이십면체이다. SCP-045는 0.074에서 500켈빈, 압력 0.4파스칼에서 3기가파스칼 범위에서 안정된 상태를 유지한다."
      pl: "SCP-045 to dwudziestościan zbudowany z lodu XII. SCP-045 pozostaje w stanie stabilnym w temperaturach od 0,074 do 500 kelwinów oraz ciśnieniach od 0,4 paskala do 3 gigapaskali."
      pt: "O SCP-045 é um icosaedro composto de gelo XII. O SCP-045 permanece em estado estável em temperaturas que variam de 0,074 a 500 kelvin e pressões de 0,4 pascal a 3 gigapascal."
      th: "SCP-045 คือทรงยี่สิบหน้าที่ประกอบด้วยน้ำแข็งชนิด XII SCP-045 คงสภาพเสถียรที่อุณหภูมิระหว่าง 0.074 ถึง 500 เคลวิน และความดันระหว่าง 0.4 ปาสกาลถึง 3 กิกะปาสกาล"
      uk: "SCP-045 — це ікосаедр, складений з льоду XII. SCP-045 залишається в стабільному стані за температур від 0,074 до 500 кельвінів і тисків від 0,4 паскаля до 3 гігапаскалів."
      vi: "SCP-045 là một khối hai mươi mặt được cấu tạo từ băng XII. SCP-045 duy trì trạng thái ổn định ở nhiệt độ từ 0,074 đến 500 kelvin và áp suất từ 0,4 pascal đến 3 gigapascal."
      zh: "SCP-045是一个由XII型冰构成的二十面体。SCP-045在0.074至500开尔文的温度范围及0.4帕斯卡至3吉帕的压力范围内保持稳定状态。"
      zh_Hant: "SCP-045是一個由XII型冰構成的二十面體。SCP-045在0.074至500克耳文的溫度範圍及0.4帕斯卡至3吉帕的壓力範圍內保持穩定狀態。"

  - scene: >
      Close-up, filling most of the frame, a different framing from the
      wide establishing shot, on the icosahedron's faceted surface, its
      planar fracture patterns forming an impossibly complex geometric
      lattice that seems to shift subtly the longer one looks at it. At
      the edge of the frame, attending-researcher-m holds up a tablet
      showing a simple 3D wireframe diagram, comparing it thoughtfully
      to the object.
    characters: [attending-researcher-m]
    caption:
      ja: "現在のところ、SCP-045は超二十面体——四次元空間に存在する正多胞体——の三次元投影であると考えられている。"
      en: "It is currently believed that SCP-045 is a three-dimensional projection of a hypericosahedron — a regular polyhedron that exists in four spatial dimensions."
      cs: "V současnosti se předpokládá, že SCP-045 je trojrozměrnou projekcí hyperikosahedronu – pravidelného mnohostěnu, který existuje ve čtyřech prostorových dimenzích."
      de: "Man geht derzeit davon aus, dass SCP-045 eine dreidimensionale Projektion eines Hyperikosaeders ist – eines regelmäßigen Polyeders, das in vier räumlichen Dimensionen existiert."
      es: "Actualmente se cree que SCP-045 es una proyección tridimensional de un hipericosaedro, un poliedro regular que existe en cuatro dimensiones espaciales."
      fr: "On pense actuellement que le SCP-045 est une projection tridimensionnelle d'un hyper-icosaèdre — un polyèdre régulier existant dans quatre dimensions spatiales."
      it: "Attualmente si ritiene che SCP-045 sia una proiezione tridimensionale di un ipericosaedro — un poliedro regolare che esiste in quattro dimensioni spaziali."
      ko: "현재 SCP-045는 초이십면체——4차원 공간에 존재하는 정다포체——의 3차원 투영으로 여겨지고 있다."
      pl: "Obecnie uważa się, że SCP-045 jest trójwymiarową projekcją hiperikosaedronu — regularnego wielościanu istniejącego w czterech wymiarach przestrzennych."
      pt: "Atualmente acredita-se que o SCP-045 seja uma projeção tridimensional de um hipericosaedro — um poliedro regular que existe em quatro dimensões espaciais."
      th: "ปัจจุบันเชื่อกันว่า SCP-045 คือภาพฉายสามมิติของไฮเปอร์ไอโคซาฮีดรอน ซึ่งเป็นรูปทรงหลายเหลี่ยมสม่ำเสมอที่มีอยู่ในสี่มิติเชิงพื้นที่"
      uk: "Наразі вважається, що SCP-045 є тривимірною проєкцією гіперікосаедра — правильного багатогранника, що існує в чотирьох просторових вимірах."
      vi: "Hiện nay người ta tin rằng SCP-045 là hình chiếu ba chiều của một siêu-khối hai mươi mặt — một khối đa diện đều tồn tại trong bốn chiều không gian."
      zh: "目前认为，SCP-045是超二十面体——一种存在于四维空间中的正多胞体——的三维投影。"
      zh_Hant: "目前認為，SCP-045是超二十面體——一種存在於四維空間中的正多胞體——的三維投影。"

  - scene: >
      Wide shot, full body, eye level, pulled back to show the whole
      hemispherical chamber, a very different framing from the tight
      close-up before. The icosahedron is caught mid-rotation, spinning
      rapidly around multiple axes at once in a blur, faint tremors
      visibly rippling through the neon gas and the chamber walls.
      attending-researcher-f grips a railing outside the viewport as
      the whole station shudders.
    characters: [attending-researcher-f]
    caption:
      ja: "予測不能な間隔で、SCP-045は複数の軸を同時に中心として自発的に回転し、最長73秒間続く。この間、その周辺地域では一連の小規模な地震活動が発生する。"
      en: "At unpredictable intervals, SCP-045 will spontaneously rotate around multiple axes simultaneously for up to 73 seconds. During this period, a series of small seismic events will occur in the immediate area."
      cs: "V nepředvídatelných intervalech se SCP-045 spontánně otáčí kolem několika os současně, a to až po dobu 73 sekund. Během této doby dochází v bezprostředním okolí k sérii malých seismických jevů."
      de: "In unvorhersehbaren Abständen rotiert SCP-045 spontan gleichzeitig um mehrere Achsen für bis zu 73 Sekunden. Während dieser Zeit kommt es im unmittelbaren Umfeld zu einer Reihe kleiner seismischer Ereignisse."
      es: "A intervalos impredecibles, SCP-045 rotará espontáneamente alrededor de múltiples ejes simultáneamente durante hasta 73 segundos. Durante este período, se producirá una serie de pequeños eventos sísmicos en la zona inmediata."
      fr: "À des intervalles imprévisibles, le SCP-045 se met spontanément à tourner simultanément autour de plusieurs axes pendant jusqu'à 73 secondes. Pendant cette période, une série de petits événements sismiques se produit dans la zone immédiate."
      it: "A intervalli imprevedibili, SCP-045 ruoterà spontaneamente attorno a più assi simultaneamente per un massimo di 73 secondi. Durante questo periodo, si verificherà una serie di piccoli eventi sismici nell'area immediata."
      ko: "예측할 수 없는 간격으로 SCP-045는 여러 축을 동시에 중심으로 자발적으로 최대 73초간 회전한다. 이 기간 동안 인근 지역에서 일련의 작은 지진 사건이 발생한다."
      pl: "W nieprzewidywalnych odstępach czasu SCP-045 samoistnie obraca się jednocześnie wokół wielu osi przez maksymalnie 73 sekundy. W tym czasie w najbliższej okolicy dochodzi do serii niewielkich wstrząsów sejsmicznych."
      pt: "Em intervalos imprevisíveis, o SCP-045 girará espontaneamente ao redor de múltiplos eixos simultaneamente por até 73 segundos. Durante esse período, ocorrerá uma série de pequenos eventos sísmicos na área imediata."
      th: "ในช่วงเวลาที่คาดเดาไม่ได้ SCP-045 จะหมุนรอบแกนหลายแกนพร้อมกันเองนานสูงสุด 73 วินาที ในช่วงเวลานี้จะเกิดเหตุการณ์แผ่นดินไหวขนาดเล็กชุดหนึ่งขึ้นในบริเวณใกล้เคียง"
      uk: "У непередбачувані інтервали SCP-045 спонтанно обертається одночасно навколо кількох осей протягом до 73 секунд. У цей період у безпосередній близькості відбувається серія невеликих сейсмічних подій."
      vi: "Ở những khoảng thời gian không thể dự đoán trước, SCP-045 sẽ tự động quay quanh nhiều trục cùng lúc trong tối đa 73 giây. Trong khoảng thời gian này, một loạt các sự kiện địa chấn nhỏ sẽ xảy ra ở khu vực lân cận."
      zh: "在不可预测的间隔期，SCP-045会自发地同时绕多个轴旋转，持续最长73秒。在此期间，其周边地区会发生一系列小规模地震活动。"
      zh_Hant: "在不可預測的間隔期，SCP-045會自發地同時繞多個軸旋轉，持續最長73秒。在此期間，其周邊地區會發生一系列小規模地震活動。"

  - scene: >
      Medium shot, waist-up, eye level, a different framing from the
      wide rotation shot before. attending-researcher-m holds up a
      small sealed canister releasing a thin stream of gas near a
      section of the icosahedron behind reinforced glass; on contact,
      the gas visibly condenses into droplets of water and scattering
      white crystals in mid-air.
    characters: [attending-researcher-m]
    caption:
      ja: "気体の窒素またはアルゴンがSCP-045のいずれかの部分から3.7メートル以内に入ると、それらは別の化合物に置き換わる——窒素は液体の水に、アルゴンは結晶状の食塩に変わる。"
      en: "When gaseous nitrogen or argon come within 3.7 meters of any portion of SCP-045, they are replaced by different compounds — nitrogen becomes liquid water, and argon becomes crystalline table salt."
      cs: "Když se plynný dusík nebo argon dostanou do vzdálenosti 3,7 metru od jakékoli části SCP-045, jsou nahrazeny jinými sloučeninami – dusík se mění na kapalnou vodu a argon na krystalickou kuchyňskou sůl."
      de: "Wenn gasförmiger Stickstoff oder Argon in einen Abstand von 3,7 Metern zu einem beliebigen Teil von SCP-045 gelangen, werden sie durch andere Verbindungen ersetzt – Stickstoff wird zu flüssigem Wasser und Argon zu kristallinem Speisesalz."
      es: "Cuando el nitrógeno o el argón gaseosos se acercan a menos de 3,7 metros de cualquier parte de SCP-045, son reemplazados por otros compuestos: el nitrógeno se convierte en agua líquida y el argón en sal de mesa cristalina."
      fr: "Lorsque l'azote ou l'argon gazeux se trouvent à moins de 3,7 mètres de toute partie du SCP-045, ils sont remplacés par d'autres composés — l'azote devient de l'eau liquide et l'argon devient du sel de table cristallin."
      it: "Quando l'azoto o l'argon gassosi si trovano entro 3,7 metri da qualsiasi parte di SCP-045, vengono sostituiti da composti diversi: l'azoto diventa acqua liquida e l'argon diventa sale da cucina cristallino."
      ko: "기체 상태의 질소 또는 아르곤이 SCP-045의 어느 부분에서든 3.7미터 이내로 들어오면, 다른 화합물로 치환된다 — 질소는 액체 물로, 아르곤은 결정형 식염으로 변한다."
      pl: "Gdy gazowy azot lub argon znajdą się w promieniu 3,7 metra od jakiejkolwiek części SCP-045, zostają zastąpione innymi związkami — azot zamienia się w ciekłą wodę, a argon w krystaliczną sól kuchenną."
      pt: "Quando o nitrogênio ou argônio gasosos chegam a até 3,7 metros de qualquer parte do SCP-045, eles são substituídos por compostos diferentes — o nitrogênio se transforma em água líquida, e o argônio em sal de cozinha cristalino."
      th: "เมื่อก๊าซไนโตรเจนหรืออาร์กอนเข้ามาภายในระยะ 3.7 เมตรจากส่วนใดส่วนหนึ่งของ SCP-045 มันจะถูกแทนที่ด้วยสารประกอบอื่น — ไนโตรเจนกลายเป็นน้ำเหลว และอาร์กอนกลายเป็นเกลือแกงที่เป็นผลึก"
      uk: "Коли газоподібний азот або аргон опиняються в межах 3,7 метра від будь-якої частини SCP-045, вони замінюються іншими сполуками — азот перетворюється на рідку воду, а аргон — на кристалічну кухонну сіль."
      vi: "Khi khí nitơ hoặc argon đến trong phạm vi 3,7 mét từ bất kỳ phần nào của SCP-045, chúng sẽ bị thay thế bởi các hợp chất khác — nitơ trở thành nước lỏng, và argon trở thành muối ăn dạng tinh thể."
      zh: "当气态氮气或氩气靠近SCP-045任何部分3.7米以内时，会被转变为不同的化合物——氮气变成液态水，氩气则变成结晶食盐。"
      zh_Hant: "當氣態氮氣或氬氣靠近SCP-045任何部分3.7公尺以內時，會被轉變為不同的化合物——氮氣變成液態水，氬氣則變成結晶食鹽。"
