# SCP-027 4コマ台本
# captionはSpecial Containment Procedures / Description本文からの引用。
# Appendix(旧宿主027-01の記録)は本編には使わない。キャラにセリフは言わせない。
# 害虫はモノクロ画風の薄いもや・点描として描き、不快なクローズアップは避ける。
#
# 4コマ構成: 1=吸引システム付きの格子床の収容室(起)、2=居場所に群がる
# 害虫に絶えず囲まれる宿主(承)、3=行く先々で2〜3分でハエ・ブヨの雲が
# 形成される(転)、4=レベル4以上の職員は200m以内に近づいてはならない
# =偉い人が遠くから見ているだけ(結・脱力オチ)。

id: scp-027

title:
  en: "SCP-027"
  ja: "SCP-027"
  cs: "SCP-027"
  de: "SCP-027"
  es: "SCP-027"
  fr: "SCP-027"
  it: "SCP-027"
  ko: "SCP-027"
  pl: "SCP-027"
  pt: "SCP-027"
  th: "SCP-027"
  uk: "SCP-027"
  vi: "SCP-027"
  zh: "SCP-027"
  zh_Hant: "SCP-027"

