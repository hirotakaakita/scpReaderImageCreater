local_characters:
  subject-027:
    name: Subject 027-02
    description: >
      A weary-looking man in his 30s, plain gray coverall (color RGB
      110,110,110), disheveled short brown hair, constantly surrounded
      by a haze of small flying insects and a scattering of crawling
      vermin near his feet, exhausted and uncomfortable expression.

characters: [subject-027, attending-researcher-m, attending-researcher-f]

panels:
  - scene: >
      Wide shot, full body, eye level, showing subject-027 standing
      alone in the middle of a bare room, a visible haze of insects
      swirling around him and a scattering of rats and roaches gathered
      near his feet, his posture slumped and weary.
    characters: [subject-027]
    caption:
      ja: "SCP-027は、彼のもとへと引き寄せられる害虫の群れに常に囲まれている。対象はこれらの生物を制御する術を持たないようであり、実際に凶暴化した個体からの攻撃を時折受けている。"
      en: "SCP-027 is constantly surrounded by swarming vermin that are drawn to his location. The subject does not appear able to assert control over these creatures in any way, and is in fact prone to occasional attacks from feral specimens."
      cs: "SCP-027 je neustále obklopeno rojícím se havětí, které je přitahováno k jeho poloze. Subjekt zjevně nedokáže tato stvoření nijak ovládat, a dokonce příležitostně čelí útokům zdivočelých jedinců."
      de: "SCP-027 ist ständig von schwärmendem Ungeziefer umgeben, das von seinem Standort angezogen wird. Das Subjekt scheint keinerlei Kontrolle über diese Kreaturen ausüben zu können und wird sogar gelegentlich von verwilderten Exemplaren angegriffen."
      es: "SCP-027 está constantemente rodeado de alimañas en enjambre atraídas hacia su ubicación. El sujeto no parece poder ejercer control alguno sobre estas criaturas, y de hecho es propenso a sufrir ataques ocasionales de especímenes salvajes."
      fr: "Le SCP-027 est constamment entouré d'une nuée de vermine attirée vers sa position. Le sujet ne semble avoir aucun contrôle sur ces créatures, et est même sujet à des attaques occasionnelles de spécimens féraux."
      it: "SCP-027 è costantemente circondato da uno sciame di parassiti attratti verso la sua posizione. Il soggetto non sembra essere in grado di esercitare alcun controllo su queste creature, ed è anzi soggetto a occasionali attacchi da parte di esemplari inselvatichiti."
      ko: "SCP-027은 그의 위치로 끌려오는 해충 무리에 항상 둘러싸여 있다. 대상은 이 생물들을 통제할 수 있는 능력이 전혀 없어 보이며, 실제로 야생화된 개체로부터 이따금 공격을 받는다."
      pl: "SCP-027 jest nieustannie otoczone rojącym się robactwem, przyciąganym do jego lokalizacji. Osobnik najwyraźniej nie potrafi w żaden sposób kontrolować tych stworzeń, a wręcz bywa atakowany przez zdziczałe okazy."
      pt: "O SCP-027 está constantemente cercado por uma praga de pragas enxameando ao seu redor. O sujeito não parece ser capaz de exercer nenhum controle sobre essas criaturas, sendo inclusive propenso a ataques ocasionais de espécimes ferais."
      th: "SCP-027 ถูกล้อมรอบด้วยฝูงสัตว์รบกวนที่ถูกดึงดูดมายังตำแหน่งของเขาตลอดเวลา ผู้ถูกทดสอบดูเหมือนจะไม่สามารถควบคุมสิ่งมีชีวิตเหล่านี้ได้เลย และยังมีแนวโน้มที่จะถูกโจมตีโดยตัวอย่างที่ดุร้ายเป็นครั้งคราว"
      uk: "SCP-027 постійно оточений роями шкідників, яких приваблює його місцезнаходження. Суб'єкт, схоже, не здатен якимось чином контролювати цих істот, і навіть періодично зазнає нападів здичавілих особин."
      vi: "SCP-027 luôn bị bao vây bởi bầy sâu bọ bị thu hút đến vị trí của anh ta. Đối tượng dường như không thể kiểm soát những sinh vật này theo bất kỳ cách nào, và thực tế còn dễ bị tấn công bởi các cá thể hoang dã đôi khi."
      zh: "SCP-027始终被受其位置吸引而聚集的害虫群包围。该对象似乎无法以任何方式控制这些生物，实际上还经常受到凶猛个体的攻击。"
      zh_Hant: "SCP-027始終被受其位置吸引而聚集的害蟲群包圍。該對象似乎無法以任何方式控制這些生物，實際上還經常受到兇猛個體的攻擊。"

  - scene: >
      Medium shot, waist-up, low angle, a different framing from the
      wide establishing shot. subject-027 walks down a corridor, a cloud
      of gnats and flies trailing just behind his head, while more
      crawling creatures emerge from cracks in the walls and floor
      further back along his path.
    characters: [subject-027]
    caption:
      ja: "対象がどこへ行こうとも、通常2〜3分以内に飛行昆虫の群れが彼の周りに雲のように形成され始める。その後まもなく、這う生物たちも出現し始める——対象がその場所に留まる時間が長いほど、集まる害虫の数は増えていく。"
      en: "Wherever the subject goes, an initial swarm of flying insects will start to form a cloud around him, usually within two to three minutes. Shortly thereafter, crawling animals will begin to appear — the longer the subject remains in a location, the more vermin will gather."
      cs: "Ať už se subjekt vydá kamkoli, obvykle do dvou až tří minut se kolem něj začne tvořit počáteční roj létajícího hmyzu. Krátce poté se začnou objevovat lezoucí zvířata – čím déle subjekt na daném místě zůstává, tím více havěti se shromažďuje."
      de: "Wohin sich das Subjekt auch begibt, meist innerhalb von zwei bis drei Minuten beginnt sich ein anfänglicher Schwarm fliegender Insekten wolkenartig um es zu bilden. Kurz darauf beginnen kriechende Tiere zu erscheinen – je länger sich das Subjekt an einem Ort aufhält, desto mehr Ungeziefer versammelt sich dort."
      es: "Dondequiera que vaya el sujeto, un enjambre inicial de insectos voladores comenzará a formar una nube a su alrededor, generalmente en un plazo de dos a tres minutos. Poco después, comenzarán a aparecer animales rastreros: cuanto más tiempo permanezca el sujeto en un lugar, más alimañas se reunirán."
      fr: "Où que le sujet se rende, un essaim initial d'insectes volants commence à former un nuage autour de lui, généralement en deux à trois minutes. Peu après, des animaux rampants commencent à apparaître — plus le sujet reste longtemps dans un lieu, plus la vermine s'y rassemble."
      it: "Ovunque vada il soggetto, uno sciame iniziale di insetti volanti inizierà a formare una nuvola intorno a lui, di solito entro due o tre minuti. Poco dopo, cominceranno ad apparire animali striscianti — più a lungo il soggetto rimane in un luogo, più parassiti si radunano."
      ko: "대상이 어디로 가든, 보통 2~3분 이내에 비행 곤충의 초기 무리가 그의 주위에 구름처럼 형성되기 시작한다. 그 직후 기어다니는 동물들이 나타나기 시작한다 — 대상이 한 장소에 오래 머물수록, 더 많은 해충이 모여든다."
      pl: "Dokądkolwiek osobnik się uda, zwykle w ciągu dwóch do trzech minut zacznie się wokół niego formować początkowy rój latających owadów tworzący chmurę. Wkrótce potem zaczną pojawiać się pełzające zwierzęta — im dłużej osobnik pozostaje w danym miejscu, tym więcej robactwa się gromadzi."
      pt: "Onde quer que o sujeito vá, um enxame inicial de insetos voadores começará a formar uma nuvem ao seu redor, geralmente dentro de dois a três minutos. Logo depois, animais rastejantes começarão a aparecer — quanto mais tempo o sujeito permanece em um local, mais pragas se reúnem."
      th: "ไม่ว่าผู้ถูกทดสอบจะไปที่ใด ฝูงแมลงบินเริ่มต้นจะเริ่มก่อตัวเป็นกลุ่มเมฆรอบตัวเขา โดยปกติภายในสองถึงสามนาที ไม่นานหลังจากนั้น สัตว์คลานจะเริ่มปรากฏขึ้น — ยิ่งผู้ถูกทดสอบอยู่ในสถานที่ใดนานเท่าไร ก็ยิ่งมีสัตว์รบกวนมารวมตัวกันมากขึ้นเท่านั้น"
      uk: "Куди б суб'єкт не пішов, зазвичай протягом двох-трьох хвилин навколо нього починає формуватися хмара літаючих комах. Невдовзі після цього з'являються повзучі тварини — що довше суб'єкт залишається на місці, то більше шкідників там збирається."
      vi: "Dù đối tượng đi đến đâu, một bầy côn trùng bay ban đầu sẽ bắt đầu hình thành một đám mây quanh anh ta, thường trong vòng hai đến ba phút. Ngay sau đó, các loài động vật bò sẽ bắt đầu xuất hiện — đối tượng càng ở lâu tại một địa điểm, càng nhiều sâu bọ tụ tập."
      zh: "无论对象走到哪里，通常在两到三分钟内，最初一群飞虫就会开始在他周围聚成一团云雾。此后不久，爬行动物也开始出现——对象在某地停留的时间越长，聚集的害虫就越多。"
      zh_Hant: "無論對象走到哪裡，通常在兩到三分鐘內，最初一群飛蟲就會開始在他周圍聚成一團雲霧。此後不久，爬行動物也開始出現——對象在某地停留的時間越長，聚集的害蟲就越多。"

  - scene: >
      Wide shot, full body, eye level, pulled back to show the whole
      containment cell with its raised grated floor, a very different
      framing from the corridor shot before. subject-027 stands at the
      center as a strong vacuum draft pulls loose insects and small
      creatures down through the grate. On one side, attending-researcher-m
      and attending-researcher-f stand behind reinforced glass,
      tranquilizer guns holstered, watching closely.
    characters: [subject-027, attending-researcher-m, attending-researcher-f]
    caption:
      ja: "SCP-027の宿主は、強力な真空システムに接続された格子状の高床を備えた収容室に入れておくこと。警備職員は麻酔銃で武装し、必要な場合には対象を鎮圧するという常時命令を受ける。"
      en: "The host of SCP-027 is to be kept in a containment cell with a grated, raised floor connected to a strong vacuum system. Security personnel must be armed with tranquilizer guns, with standing orders to subdue the subject if the need arises."
      cs: "Hostitel SCP-027 musí být uchováván v kontejnmentové cele s mřížovou, zvýšenou podlahou napojenou na silný vakuový systém. Bezpečnostní personál musí být vyzbrojen uspávacími zbraněmi se stálým rozkazem subjekt v případě potřeby zpacifikovat."
      de: "Der Wirt von SCP-027 ist in einer Containment-Zelle mit gerastertem, erhöhtem Boden unterzubringen, der an ein starkes Vakuumsystem angeschlossen ist. Sicherheitspersonal muss mit Betäubungswaffen ausgerüstet sein, mit dem ständigen Befehl, das Subjekt bei Bedarf zu bezwingen."
      es: "El huésped de SCP-027 debe mantenerse en una celda de contención con un suelo elevado y enrejado conectado a un potente sistema de vacío. El personal de seguridad debe estar armado con pistolas tranquilizantes, con órdenes permanentes de someter al sujeto si fuera necesario."
      fr: "L'hôte du SCP-027 doit être maintenu dans une cellule de confinement dotée d'un plancher surélevé et grillagé relié à un puissant système d'aspiration. Le personnel de sécurité doit être armé de fusils tranquillisants, avec pour consigne permanente de maîtriser le sujet en cas de besoin."
      it: "L'ospite di SCP-027 deve essere tenuto in una cella di contenimento con pavimento grigliato e sopraelevato collegato a un potente sistema di aspirazione. Il personale di sicurezza deve essere armato con pistole tranquillanti, con ordini permanenti di sottomettere il soggetto in caso di necessità."
      ko: "SCP-027의 숙주는 강력한 진공 시스템에 연결된 격자형 상승 바닥이 있는 수용실에 두어야 한다. 보안 요원은 마취총으로 무장해야 하며, 필요시 대상을 제압하라는 상시 명령을 받는다."
      pl: "Nosiciela SCP-027 należy trzymać w celi kontenerowej z kratkowaną, podniesioną podłogą podłączoną do silnego systemu odsysania. Personel ochrony musi być uzbrojony w broń usypiającą, z stałym rozkazem obezwładnienia osobnika w razie potrzeby."
      pt: "O hospedeiro do SCP-027 deve ser mantido em uma cela de contenção com piso elevado e gradeado conectado a um forte sistema de vácuo. O pessoal de segurança deve estar armado com armas tranquilizantes, com ordens permanentes de conter o sujeito, caso necessário."
      th: "โฮสต์ของ SCP-027 ต้องถูกกักกันในห้องขังที่มีพื้นยกสูงแบบตะแกรงเชื่อมต่อกับระบบสุญญากาศแรงดันสูง เจ้าหน้าที่รักษาความปลอดภัยต้องพกปืนยิงยาสลบ พร้อมคำสั่งประจำให้ปราบปรามผู้ถูกทดสอบหากจำเป็น"
      uk: "Носія SCP-027 слід тримати в камері утримання з ґратчастою піднятою підлогою, з'єднаною з потужною вакуумною системою. Персонал безпеки повинен бути озброєний транквілізаторними рушницями з постійним наказом знешкодити суб'єкта в разі потреби."
      vi: "Vật chủ của SCP-027 phải được giam giữ trong một buồng chứa có sàn nâng dạng lưới kết nối với hệ thống hút chân không mạnh. Nhân viên an ninh phải được trang bị súng gây mê, với lệnh thường trực khống chế đối tượng nếu cần thiết."
      zh: "SCP-027的宿主须收容于带有连接强力真空系统的格栅式高架地板的收容室内。安保人员必须配备麻醉枪，并有常设命令在必要时制服对象。"
      zh_Hant: "SCP-027的宿主須收容於帶有連接強力真空系統的格柵式高架地板的收容室內。安保人員必須配備麻醉槍，並有常設命令在必要時制服對象。"

  - scene: >
      Wide shot, full body, eye level, pulled back further to show a
      long observation corridor with a marked line on the floor, a very
      different framing from the containment cell shot before. In the
      far distance, tiny in the frame, subject-027 stands alone in his
      cell. In the foreground, attending-researcher-m peers through a
      large pair of binoculars from well outside the marked line,
      clearly unwilling to get any closer.
    characters: [attending-researcher-m]
    caption:
      ja: "SCP-027についての理解が深まるまで、レベル4以上の権限を持つ職員は対象から200メートル以内に近づいてはならない。"
      en: "Until SCP-027 is better understood, no personnel of Level 4 Clearance or higher should approach within 200 meters of the Subject."
      cs: "Dokud nebude SCP-027 lépe pochopeno, žádný personál s prověrkou úrovně 4 nebo vyšší se nesmí přiblížit k subjektu na méně než 200 metrů."
      de: "Bis SCP-027 besser verstanden ist, sollte sich kein Personal mit Freigabestufe 4 oder höher dem Subjekt auf weniger als 200 Meter nähern."
      es: "Hasta que se comprenda mejor SCP-027, ningún personal con Autorización de Nivel 4 o superior debe acercarse a menos de 200 metros del Sujeto."
      fr: "Tant que le SCP-027 n'est pas mieux compris, aucun personnel disposant d'une habilitation de niveau 4 ou supérieure ne doit s'approcher à moins de 200 mètres du sujet."
      it: "Finché SCP-027 non sarà meglio compreso, nessun membro del personale con autorizzazione di Livello 4 o superiore dovrebbe avvicinarsi a meno di 200 metri dal Soggetto."
      ko: "SCP-027에 대한 이해가 더 깊어질 때까지, 레벨 4 이상의 권한을 가진 직원은 대상으로부터 200미터 이내로 접근해서는 안 된다."
      pl: "Dopóki SCP-027 nie zostanie lepiej poznane, żaden personel z uprawnieniami poziomu 4 lub wyższymi nie powinien zbliżać się do Osobnika na odległość mniejszą niż 200 metrów."
      pt: "Até que o SCP-027 seja melhor compreendido, nenhum funcionário com Autorização de Nível 4 ou superior deve se aproximar a menos de 200 metros do Sujeito."
      th: "จนกว่าจะเข้าใจ SCP-027 ได้ดีขึ้น เจ้าหน้าที่ที่มีระดับการเข้าถึงระดับ 4 ขึ้นไปไม่ควรเข้าใกล้ผู้ถูกทดสอบในระยะ 200 เมตร"
      uk: "Поки SCP-027 не буде краще вивчено, жоден персонал з допуском рівня 4 або вищим не повинен наближатися до Суб'єкта ближче ніж на 200 метрів."
      vi: "Cho đến khi SCP-027 được hiểu rõ hơn, không nhân viên nào có Cấp Độ Bảo Mật 4 trở lên được phép đến gần Đối Tượng trong phạm vi 200 mét."
      zh: "在对SCP-027有更充分了解之前，任何4级或以上权限的人员均不得靠近该对象200米以内。"
      zh_Hant: "在對SCP-027有更充分了解之前，任何4級或以上權限的人員均不得靠近該對象200公尺以內。"
