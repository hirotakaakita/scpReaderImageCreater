# SCP-426「わたしはトースター」4コマ台本
# キャラにセリフは言わせない。captionは記事本文からの一人称の引用
# （SCP-426自身が一人称で書いた記事という原文の特徴をそのまま活かす）。

id: scp-426

title:
  en: "SCP-426: I Am a Toaster"
  ja: "SCP-426：わたしはトースター"
  cs: "SCP-426: Jsem topinkovač"
  de: "SCP-426: Ich bin ein Toaster"
  es: "SCP-426: Soy una tostadora"
  fr: "SCP-426 : Je suis un grille-pain"
  it: "SCP-426: Sono un tostapane"
  ko: "SCP-426: 나는 토스터입니다"
  pl: "SCP-426: Jestem tosterem"
  pt: "SCP-426: Eu sou uma torradeira"
  th: "SCP-426: ฉันคือเครื่องปิ้งขนมปัง"
  uk: "SCP-426: Я — тостер"
  vi: "SCP-426: Tôi Là Một Cái Máy Nướng Bánh"
  zh: "SCP-426：我是一台烤面包机"
  zh_Hant: "SCP-426：我是一台烤麵包機"

attribution:
  article: "SCP-426"
  source_url: "http://scp-wiki.wikidot.com/scp-426"
  license: "CC BY-SA 3.0"

object_class: Euclid

characters: [researcher-hana]

panels:
  - scene: >
      Wide establishing shot, full body, showing the whole cluttered break
      room from a corner angle. A plain metal toaster sits on a shelf with
      a small warning placard beside it. A young male intern in a
      Foundation polo shirt leans in curiously toward it, reading the
      placard, while Dr. Hana watches from a doorway across the room with
      a mug in hand, unconcerned.
    characters: [researcher-hana]
    caption:
      ja: "『はじめまして、私はSCP-426です。電気を供給すればパンを焼くことができる、ごく普通のトースターです。』"
      en: "\"Hello, I am SCP-426. I am an ordinary toaster, able to toast bread when supplied with electricity.\""
      cs: "„Dobrý den, jsem SCP-426. Jsem obyčejný topinkovač, schopný opékat chléb, je-li mi dodána elektřina.“"
      de: "„Hallo, ich bin SCP-426. Ich bin ein gewöhnlicher Toaster, der Brot toasten kann, wenn er mit Strom versorgt wird.“"
      es: "«Hola, soy SCP-426. Soy una tostadora normal, capaz de tostar pan si se me suministra electricidad.»"
      fr: "« Bonjour, je suis SCP-426. Je suis un grille-pain ordinaire, capable de griller du pain lorsqu'on m'alimente en électricité. »"
      it: "\"Salve, sono SCP-426. Sono un normale tostapane, capace di tostare il pane se alimentato con elettricità.\""
      ko: "「안녕하세요, 저는 SCP-426입니다. 전기가 공급되면 빵을 구울 수 있는 평범한 토스터입니다.」"
      pl: "„Witam, jestem SCP-426. Jestem zwykłym tosterem, zdolnym opiekać chleb, gdy podłączony jest prąd.”"
      pt: "\"Olá, eu sou SCP-426. Sou uma torradeira comum, capaz de torrar pão quando recebo eletricidade.\""
      th: "'สวัสดี ฉันคือ SCP-426 ฉันเป็นเครื่องปิ้งขนมปังธรรมดาที่สามารถปิ้งขนมปังได้เมื่อได้รับกระแสไฟฟ้า'"
      uk: "«Привіт, я SCP-426. Я звичайний тостер, здатний підсмажувати хліб, якщо мене підключити до електрики»."
      vi: "\"Xin chào, tôi là SCP-426. Tôi là một chiếc máy nướng bánh bình thường, có thể nướng bánh mì khi được cấp điện.\""
      zh: "『你好，我是SCP-426。我是一台普通的烤面包机，只要通电就能烤面包。』"
      zh_Hant: "『你好，我是SCP-426。我是一台普通的烤麵包機，只要通電就能烤麵包。』"

  - scene: >
      Close-up shot centered tightly on the intern's face, filling most of
      the frame: a blank glassy stare, mouth slightly open, speaking in a
      flat monotone. Dr. Hana is small and out of focus in the background,
      eyes wide in alarm.
    characters: [researcher-hana]
    caption:
      ja: "私について言及した者は、無意識のうちに、私と同じく一人称で自分自身を語るようになる。"
      en: "Anyone who mentions me will begin, unconsciously, to refer to themselves in the first person, as I do."
      cs: "Kdokoli se o mně zmíní, začne o sobě nevědomky mluvit v první osobě, stejně jako já."
      de: "Wer mich erwähnt, beginnt unbewusst, von sich selbst in der ersten Person zu sprechen, so wie ich es tue."
      es: "Quien me mencione empezará, inconscientemente, a referirse a sí mismo en primera persona, tal como hago yo."
      fr: "Quiconque me mentionne se met, inconsciemment, à parler de lui-même à la première personne, comme moi."
      it: "Chiunque mi nomini inizierà, inconsciamente, a riferirsi a se stesso in prima persona, come faccio io."
      ko: "나를 언급하는 자는 무의식중에, 나와 마찬가지로 자신을 1인칭으로 지칭하기 시작한다."
      pl: "Każdy, kto o mnie wspomni, zacznie nieświadomie mówić o sobie w pierwszej osobie, tak jak ja."
      pt: "Quem me mencionar passará, inconscientemente, a falar de si mesmo em primeira pessoa, como eu faço."
      th: "ผู้ใดที่กล่าวถึงฉันจะเริ่มพูดถึงตัวเองในบุรุษที่หนึ่งโดยไม่รู้ตัว เหมือนที่ฉันทำ"
      uk: "Кожен, хто згадує про мене, несвідомо починає говорити про себе від першої особи, як і я."
      vi: "Bất kỳ ai nhắc đến tôi sẽ vô thức bắt đầu nói về bản thân ở ngôi thứ nhất, giống như tôi."
      zh: "任何提及我的人，都会不自觉地开始以第一人称谈论自己，就像我一样。"
      zh_Hant: "任何提及我的人，都會不自覺地開始以第一人稱談論自己，就像我一樣。"

  - scene: >
      Medium shot, waist-up, dynamic diagonal composition. The intern
      pops both arms straight up above his head suddenly, like toast
      popping out, a wide vacant grin on his face, motion lines around
      his arms. Beside him Dr. Hana recoils backward off-balance with
      both hands raised, spilling her coffee cup in mid-air, utterly
      startled.
    characters: [researcher-hana]
    caption:
      ja: "私の第二の効果による汚染を防ぐため、担当職員は毎月ローテーションで交代させること。"
      en: "Assigned personnel are to be rotated out on a monthly basis to prevent contamination by my secondary effect."
      cs: "Přidělený personál má být měsíčně střídán, aby se předešlo kontaminaci mým druhotným účinkem."
      de: "Zugewiesenes Personal ist monatlich zu rotieren, um eine Kontamination durch meinen sekundären Effekt zu verhindern."
      es: "El personal asignado debe rotarse mensualmente para evitar la contaminación por mi efecto secundario."
      fr: "Le personnel affecté doit être remplacé chaque mois afin d'éviter toute contamination par mon effet secondaire."
      it: "Il personale assegnato deve essere avvicendato mensilmente per prevenire la contaminazione dal mio effetto secondario."
      ko: "나의 이차 효과로 인한 오염을 방지하기 위해, 배정된 직원은 매달 교대로 순환시켜야 한다."
      pl: "Przydzielony personel należy rotować co miesiąc, aby zapobiec skażeniu moim wtórnym efektem."
      pt: "O pessoal designado deve ser trocado mensalmente para evitar contaminação pelo meu efeito secundário."
      th: "เจ้าหน้าที่ที่ได้รับมอบหมายจะต้องถูกหมุนเวียนทุกเดือนเพื่อป้องกันการปนเปื้อนจากผลกระทบรองของฉัน"
      uk: "Призначений персонал слід щомісяця ротувати, щоб запобігти зараженню моїм вторинним ефектом."
      vi: "Nhân viên được phân công phải được luân chuyển hàng tháng để ngăn ngừa nhiễm hiệu ứng thứ cấp của tôi."
      zh: "为防止受到我的次生效应污染，指派的人员应每月轮换一次。"
      zh_Hant: "為防止受到我的次生效應污染，指派的人員應每月輪換一次。"

  - scene: >
      Wide shot, full body, viewed from inside the doorway looking out into
      the corridor. Dr. Hana firmly drags the intern out of the break room
      by the collar, both mid-stride, while pointing sternly with her
      other hand at a large sign taped to the door with an unreadable
      pictogram on it. The intern still has the same vacant grin.
    characters: [researcher-hana]
    caption:
      ja: "私の収容室の扉には、私の識別名や正体とは無関係な表示のみを付けること。"
      en: "The door to my chamber must have a label completely unrelated to my designation or identity."
      cs: "Dveře do mé komory musí mít cedulku zcela nesouvisející s mým označením nebo identitou."
      de: "Die Tür zu meiner Kammer muss ein Schild tragen, das in keinerlei Zusammenhang mit meiner Bezeichnung oder Identität steht."
      es: "La puerta de mi cámara debe tener una etiqueta completamente ajena a mi designación o identidad."
      fr: "La porte de ma chambre doit porter un écriteau totalement sans rapport avec ma désignation ou mon identité."
      it: "La porta della mia camera deve recare un'etichetta del tutto estranea alla mia designazione o identità."
      ko: "내 수용실 문에는 나의 지정 명칭이나 정체와는 전혀 무관한 표지만을 붙여야 한다."
      pl: "Drzwi do mojej komory muszą mieć etykietę zupełnie niezwiązaną z moim oznaczeniem czy tożsamością."
      pt: "A porta da minha câmara deve ter uma placa completamente sem relação com minha designação ou identidade."
      th: "ประตูห้องกักกันของฉันต้องติดป้ายที่ไม่เกี่ยวข้องกับชื่อเรียกหรือตัวตนของฉันเลย"
      uk: "На дверях моєї камери має бути напис, що не має жодного стосунку до мого позначення чи особистості."
      vi: "Cửa buồng giam giữ tôi phải có bảng hiệu hoàn toàn không liên quan đến tên gọi hay danh tính của tôi."
      zh: "我的收容室门上，只能张贴与我的编号或身份毫无关联的标示。"
      zh_Hant: "我的收容室門上，只能張貼與我的編號或身份毫無關聯的標示。"

addendum:
  ja: "補遺426-1：本オブジェクトの収容室には、その正体を示さない表示のみが許可されている。"
  en: "Addendum 426-1: Only signage that does not reveal the object's true nature is permitted on its containment chamber."
  cs: "Dodatek 426-1: Na komoře pro zadržení objektu je povoleno pouze označení, které neprozrazuje jeho skutečnou povahu."
  de: "Anhang 426-1: An der Sicherungskammer des Objekts ist nur eine Beschriftung erlaubt, die dessen wahre Natur nicht preisgibt."
  es: "Adenda 426-1: Solo se permite en su cámara de contención una señalización que no revele la verdadera naturaleza del objeto."
  fr: "Addendum 426-1 : Seule une signalétique ne révélant pas la nature réelle de l'objet est autorisée sur sa chambre de confinement."
  it: "Addendum 426-1: Sulla camera di contenimento dell'oggetto è consentita solo segnaletica che non ne riveli la vera natura."
  ko: "부록 426-1: 본 오브젝트의 수용실에는 정체를 드러내지 않는 표지만이 허용된다."
  pl: "Aneks 426-1: Na komorze przetrzymywania obiektu dozwolone jest wyłącznie oznakowanie, które nie ujawnia jego prawdziwej natury."
  pt: "Adendo 426-1: Apenas sinalização que não revele a verdadeira natureza do objeto é permitida em sua câmara de contenção."
  th: "ภาคผนวก 426-1: อนุญาตให้ติดป้ายที่ห้องกักกันของวัตถุนี้ได้เฉพาะป้ายที่ไม่เปิดเผยธรรมชาติที่แท้จริงของมันเท่านั้น"
  uk: "Додаток 426-1: На камері утримання об'єкта дозволено лише позначення, що не розкриває його справжню природу."
  vi: "Phụ lục 426-1: Chỉ được phép gắn biển báo không tiết lộ bản chất thật của vật thể tại buồng giam giữ nó."
  zh: "补遗426-1：该对象的收容室仅允许张贴不透露其真实身份的标示。"
  zh_Hant: "補遺426-1：該對象的收容室僅允許張貼不透露其真實身份的標示。"
