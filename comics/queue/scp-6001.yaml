local_characters:
  scp-6001:
    name: "SCP-6001"
    appearance: >
      A microscopic cross-dimensional singularity linking Tokyo in baseline reality to a parallel Tokyo in A6K.
    default_look: >
      Invisible to the naked eye, represented by instruments, aperture light, and contrasting realities.
  primrose:
    name: "Primrose"
    appearance: >
      A sapient calico cat wearing a violet blazer, glossy white bow, small gold spectacles, and a composed academic expression.
    default_look: >
      Polite, intelligent, welcoming, and slightly amused.
panels:
  - scene: >
      Laboratory rooftop or observation space in Tokyo: instruments focus on an empty point in the air representing a tiny micro-singularity. No readable displays.
    characters: [scp-6001]
    source: {section: Description, quote: "Phenom #6001 is an .0083917743 µm micro-singularity located in Tokyo, Japan and in another Tokyo, Japan. This singularity connects to a parallel universe hereafter known as A6K.", url: "https://scp-wiki.wikidot.com/scp-6001", fetched_at: "2026-09-21T00:00:00Z"}
    caption:
      ja: "SCP-6001は東京ともう一つの東京に存在する、A6Kと呼ばれる並行宇宙へ通じる0.0083917743マイクロメートルの微小特異点です。"
      en: &p1 "SCP-6001 is a 0.0083917743 micrometer micro-singularity in Tokyo and another Tokyo, connecting to a parallel universe called A6K."
