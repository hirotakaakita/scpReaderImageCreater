object_class: Euclid

local_characters:
  scp-056:
    name: SCP-056
    description: >
      A shapeshifting being that constantly alters its size, gender, and
      appearance to match what impresses or is desired by nearby
      observers. Its exact current form is described individually in
      each scene.

characters: [scp-056, attending-researcher-m, attending-researcher-f]

panels:
  - scene: >
      Wide shot, full body, eye level, showing a well-appointed private
      room chosen and furnished by the occupant. A handsome man in his
      mid-20s stands at its center, wearing a sharp, high-quality
      uniform resembling the guards' outfits, poised with quiet
      confidence. attending-researcher-m stands near the doorway,
      tranquilizer pistol holstered, watching closely.
    characters: [scp-056, attending-researcher-m]
    caption:
      ja: "SCP-056は大きさ、性別、外見が可変の存在であり、周囲の環境に応じて変化する。最も一般的な姿は、自身を警護する職員の制服に似た、しかしより高級な衣装をまとった、20代半ばのハンサムな男性である。"
      en: "SCP-056 is a being of variable size, gender, and appearance, which changes in response to the environment around it. Its most common form is of a handsome man dressed in a garb similar to that of the personnel guarding it, but of higher quality."
      cs: "SCP-056 je bytost proměnlivé velikosti, pohlaví a vzhledu, která se mění v reakci na okolní prostředí. Jeho nejběžnější podobou je pohledný muž oblečený do róby podobné té, kterou nosí personál střežící ho, avšak vyšší kvality."
      de: "SCP-056 ist ein Wesen mit veränderlicher Größe, Geschlecht und Erscheinung, das sich je nach Umgebung verändert. Seine häufigste Form ist die eines gutaussehenden Mannes, gekleidet in ein Gewand, das dem des ihn bewachenden Personals ähnelt, jedoch von höherer Qualität."
      es: "SCP-056 es un ser de tamaño, género y apariencia variables, que cambia en respuesta al entorno que lo rodea. Su forma más común es la de un hombre apuesto vestido con un atuendo similar al del personal que lo custodia, pero de mayor calidad."
      fr: "Le SCP-056 est un être de taille, de genre et d'apparence variables, qui change en fonction de l'environnement qui l'entoure. Sa forme la plus courante est celle d'un bel homme vêtu d'une tenue semblable à celle du personnel qui le garde, mais de meilleure qualité."
      it: "SCP-056 è un essere di dimensioni, genere e aspetto variabili, che cambia in risposta all'ambiente circostante. La sua forma più comune è quella di un uomo affascinante vestito con un abito simile a quello del personale che lo sorveglia, ma di qualità superiore."
      ko: "SCP-056은 크기, 성별, 외모가 가변적인 존재로, 주변 환경에 따라 변화한다. 가장 흔한 형태는 자신을 감시하는 직원들의 복장과 유사하지만 더 고급스러운 옷을 입은 잘생긴 20대 중반 남성이다."
      pl: "SCP-056 to istota o zmiennym rozmiarze, płci i wyglądzie, która zmienia się w reakcji na otaczające ją środowisko. Jej najczęstszą formą jest przystojny mężczyzna ubrany w strój podobny do munduru pilnującego go personelu, lecz wyższej jakości."
      pt: "O SCP-056 é um ser de tamanho, gênero e aparência variáveis, que muda em resposta ao ambiente ao seu redor. Sua forma mais comum é a de um homem bonito vestido com uma roupa semelhante à do pessoal que o vigia, mas de qualidade superior."
      th: "SCP-056 คือสิ่งมีชีวิตที่มีขนาด เพศ และรูปลักษณ์แปรผัน ซึ่งเปลี่ยนแปลงตามสภาพแวดล้อมโดยรอบ รูปแบบที่พบบ่อยที่สุดคือชายรูปงามวัยกลางยี่สิบ สวมชุดคล้ายกับเจ้าหน้าที่ที่เฝ้าดูแลมัน แต่มีคุณภาพสูงกว่า"
      uk: "SCP-056 — це істота зі змінним розміром, статтю та зовнішністю, яка змінюється залежно від навколишнього середовища. Його найпоширеніша форма — привабливий чоловік, одягнений у вбрання, схоже на форму персоналу, що його охороняє, але вищої якості."
      vi: "SCP-056 là một thực thể có kích thước, giới tính và ngoại hình thay đổi, biến đổi theo môi trường xung quanh. Hình dạng phổ biến nhất của nó là một người đàn ông đẹp trai mặc trang phục tương tự nhân viên canh gác nó, nhưng chất lượng cao hơn."
      zh: "SCP-056是一种大小、性别、外貌均可变的存在，会随着周围环境而变化。它最常见的形态是一名英俊男子，穿着与守卫其人员相似但品质更高的服装。"
      zh_Hant: "SCP-056是一種大小、性別、外貌均可變的存在，會隨著周圍環境而變化。牠最常見的形態是一名英俊男子，穿著與守衛其人員相似但品質更高的服裝。"

  - scene: >
      Wide shot, full body, eye level, a very different framing from the
      quiet room shot before, showing scp-056 mid-transformation in a
      hallway — one side of its body still a large well-groomed
      Labrador Retriever, the other side shifting into a glamorous
      actress-like woman, a shimmering blur between the two forms.
      attending-researcher-f stands nearby, mid-blink, caught in the
      exact moment of losing focus.
    characters: [scp-056, attending-researcher-f]
    caption:
      ja: "以下のような姿をとったことが記録されている：大柄で毛並みの整ったラブラドール・レトリバー、有名女優に似た女性、知能検査で最高得点の研究員より30ポイント高い得点を出した女性医師、そして最強の警備員よりも重い重量を持ち上げたボディビルダー。"
      en: "It has been recorded taking these forms: a large, well-groomed Labrador Retriever; a woman resembling a famous actress; a female doctor who scored thirty points higher on an IQ test than the top researcher; and a bodybuilder who out-lifted the strongest guard."
      cs: "Bylo zaznamenáno, že nabylo těchto podob: velký, upravený labradorský retrívr; žena podobná slavné herečce; doktorka, která v IQ testu dosáhla o třicet bodů více než nejlepší dostupný výzkumník; a kulturista, který zvedl více než nejsilnější strážný."
      de: "Es wurde beobachtet, dass es folgende Formen annahm: ein großer, gepflegter Labrador Retriever; eine Frau, die einer berühmten Schauspielerin ähnelt; eine Ärztin, die bei einem IQ-Test dreißig Punkte höher abschnitt als der beste Forscher; und ein Bodybuilder, der mehr stemmen konnte als der stärkste Wachmann."
      es: "Se ha registrado que adopta estas formas: un gran labrador retriever bien cuidado; una mujer que se asemeja a una actriz famosa; una doctora que obtuvo treinta puntos más que el mejor investigador en una prueba de coeficiente intelectual; y un culturista que levantó más peso que el guardia más fuerte."
      fr: "Il a été enregistré prenant ces formes : un grand Labrador Retriever bien entretenu ; une femme ressemblant à une actrice célèbre ; une femme médecin ayant obtenu trente points de plus que le meilleur chercheur à un test de QI ; et un bodybuilder ayant soulevé plus de poids que le garde le plus fort."
      it: "È stato registrato assumere queste forme: un grande Labrador Retriever ben curato; una donna che assomiglia a una famosa attrice; una dottoressa che ha ottenuto trenta punti in più rispetto al miglior ricercatore in un test del QI; e un bodybuilder che ha sollevato più peso della guardia più forte."
      ko: "다음과 같은 형태를 취한 것으로 기록되었다: 크고 잘 손질된 래브라도 리트리버, 유명 여배우를 닮은 여성, IQ 테스트에서 최고 점수 연구원보다 30점 높은 점수를 받은 여성 의사, 그리고 가장 힘센 경비원보다 더 무거운 무게를 들어 올린 보디빌더."
      pl: "Zarejestrowano, że przybierało te formy: dużego, zadbanego labradora retrievera; kobietę przypominającą słynną aktorkę; lekarkę, która w teście IQ uzyskała o trzydzieści punktów więcej niż najlepszy badacz; oraz kulturystę, który podniósł więcej niż najsilniejszy strażnik."
      pt: "Foi registrado assumindo estas formas: um grande labrador retriever bem cuidado; uma mulher parecida com uma atriz famosa; uma médica que pontuou trinta pontos a mais que o melhor pesquisador em um teste de QI; e um fisiculturista que levantou mais peso que o guarda mais forte."
      th: "มีการบันทึกว่ามันเคยแปลงร่างเป็น: ลาบราดอร์รีทรีฟเวอร์ตัวใหญ่ขนสวยงาม ผู้หญิงที่มีหน้าตาคล้ายนักแสดงชื่อดัง แพทย์หญิงที่ทำคะแนนแบบทดสอบไอคิวได้สูงกว่านักวิจัยที่เก่งที่สุดถึงสามสิบคะแนน และนักเพาะกายที่ยกน้ำหนักได้มากกว่ายามที่แข็งแรงที่สุด"
      uk: "Зафіксовано, що воно набувало таких форм: великого доглянутого лабрадора-ретривера; жінки, схожої на відому акторку; лікарки, яка набрала на тридцять балів більше за найкращого дослідника в тесті на IQ; та культуриста, який підняв більшу вагу, ніж найсильніший охоронець."
      vi: "Nó đã được ghi nhận mang các hình dạng sau: một chú chó Labrador Retriever to lớn, được chải chuốt kỹ càng; một người phụ nữ giống một nữ diễn viên nổi tiếng; một nữ bác sĩ đạt điểm IQ cao hơn ba mươi điểm so với nhà nghiên cứu giỏi nhất; và một vận động viên thể hình nâng được tạ nặng hơn cả người bảo vệ khỏe nhất."
      zh: "据记录，它曾变化为以下形态：一只毛发梳理整齐的大型拉布拉多犬；一名酷似知名女演员的女子；一名智商测试得分比最高分研究员还高出三十分的女医生；以及一名举重量超过最强壮警卫的健美运动员。"
      zh_Hant: "據記錄，牠曾變化為以下形態：一隻毛髮梳理整齊的大型拉布拉多犬；一名酷似知名女演員的女子；一名智商測試得分比最高分研究員還高出三十分的女醫生；以及一名舉重量超過最強壯警衛的健美運動員。"

  - scene: >
      Close-up, filling most of the frame, a very different framing from
      the wide hallway shot before, on a bare concrete cell interior
      seen through a security monitor: an ordinary security camera
      mounted on the wall, except this one appears to be gazing intently
      back at the real camera filming it, an uncanny stillness.
    characters: [scp-056]
    caption:
      ja: "これらの変化は概ね、その場にいる全員が対象への注意を失った瞬間に起こる。空の独房で監視カメラによる観察下に一人で置かれた際には、より高性能なカメラの姿をとり、自分を監視しているカメラを逆に監視しているように見えた。"
      en: "These changes generally occur the moment all people in the area lose focus on the subject. When left alone in an empty cell under video surveillance, it took the form of a higher-quality camera and appeared to monitor the camera watching it."
      cs: "K těmto změnám obvykle dochází ve chvíli, kdy všichni lidé v okolí ztratí zaměření na subjekt. Když bylo ponecháno samotné v prázdné cele pod video dohledem, nabylo podoby kvalitnější kamery a zdálo se, že sleduje kameru, která ho sleduje."
      de: "Diese Veränderungen treten im Allgemeinen in dem Moment auf, in dem alle Menschen in der Umgebung den Fokus auf das Subjekt verlieren. Als es allein in einer leeren Zelle unter Videoüberwachung zurückgelassen wurde, nahm es die Form einer hochwertigeren Kamera an und schien die Kamera zu überwachen, die es beobachtete."
      es: "Estos cambios generalmente ocurren en el momento en que todas las personas del área pierden el enfoque sobre el sujeto. Cuando se lo dejó solo en una celda vacía bajo vigilancia por video, tomó la forma de una cámara de mayor calidad y pareció vigilar a la cámara que lo observaba."
      fr: "Ces changements se produisent généralement dès l'instant où toutes les personnes présentes perdent leur attention sur le sujet. Laissé seul dans une cellule vide sous surveillance vidéo, il a pris la forme d'une caméra de meilleure qualité et a semblé surveiller la caméra qui l'observait."
      it: "Questi cambiamenti si verificano generalmente nel momento in cui tutte le persone presenti nell'area perdono la concentrazione sul soggetto. Lasciato solo in una cella vuota sotto sorveglianza video, ha assunto la forma di una telecamera di qualità superiore e sembrava monitorare la telecamera che lo osservava."
      ko: "이러한 변화는 대체로 주변의 모든 사람이 대상에 대한 주의를 잃는 순간 일어난다. 텅 빈 독방에서 영상 감시 하에 홀로 남겨졌을 때, 대상은 더 고성능의 카메라 형태를 취했고, 자신을 감시하는 카메라를 역으로 감시하는 것처럼 보였다."
      pl: "Zmiany te zazwyczaj zachodzą w chwili, gdy wszyscy obecni w danym miejscu tracą skupienie na osobniku. Pozostawiony sam w pustej celi pod nadzorem wideo, przybrał postać kamery wyższej jakości i wydawał się obserwować kamerę, która go obserwowała."
      pt: "Essas mudanças geralmente ocorrem no momento em que todas as pessoas na área perdem o foco sobre o sujeito. Quando deixado sozinho em uma cela vazia sob vigilância por vídeo, assumiu a forma de uma câmera de qualidade superior e pareceu monitorar a câmera que o observava."
      th: "การเปลี่ยนแปลงเหล่านี้มักเกิดขึ้นในช่วงเวลาที่ทุกคนในพื้นที่หยุดให้ความสนใจกับผู้ถูกทดสอบ เมื่อถูกทิ้งไว้ตามลำพังในห้องขังเปล่าภายใต้การเฝ้าระวังด้วยกล้อง มันแปลงร่างเป็นกล้องคุณภาพสูงกว่าและดูเหมือนจะเฝ้าจับตากล้องที่กำลังเฝ้าดูมันอยู่"
      uk: "Ці зміни зазвичай відбуваються в момент, коли всі люди в приміщенні втрачають фокус на суб'єкті. Коли його залишили самого в порожній камері під відеоспостереженням, він набув форми якіснішої камери й, здавалося, стежив за камерою, що спостерігала за ним."
      vi: "Những thay đổi này thường xảy ra ngay khi tất cả mọi người trong khu vực không còn tập trung vào đối tượng. Khi bị bỏ lại một mình trong một phòng giam trống dưới sự giám sát bằng video, nó biến thành hình dạng của một camera chất lượng cao hơn và dường như đang theo dõi chính camera đang quan sát nó."
      zh: "这些变化通常发生在该区域所有人对对象失去注意力的瞬间。当它被单独留在受视频监控的空牢房中时，它变成了一台更高级的摄像机，似乎在反过来监视那台正在监视它的摄像机。"
      zh_Hant: "這些變化通常發生在該區域所有人對對象失去注意力的瞬間。當牠被單獨留在受視訊監控的空牢房中時，牠變成了一台更高級的攝影機，似乎在反過來監視那台正在監視牠的攝影機。"

  - scene: >
      Medium shot, waist-up, eye level, an office setting, a very
      different framing from the tight camera close-up before. On the
      left side of the frame, scp-056 appears as a strikingly beautiful
      woman in a tailored suit, sitting with legs crossed, speaking with
      an air of bored superiority. On the right side of the frame,
      attending-researcher-m sits across from her, gritting his teeth in
      visible frustration, yet leaning forward as if unable to look
      away.
    characters: [scp-056, attending-researcher-m]
    caption:
      ja: "対象は自身を取り巻く職員をしばしば見下すように扱うが、要求が謙虚な形でなされる限り、概ね言われた通りのことをする用意がある。職員はSCP-056と長く会話した後、大抵は苛立ちを覚えるが、可能であれば再び話しかけようとする。"
      en: "It frequently treats the staff around it with disdain, though is generally willing to do whatever is asked, so long as the inquiry is made submissively. Personnel generally become frustrated with SCP-056 after speaking with it at length, though they try to speak with it again if possible."
      cs: "Subjekt často zachází s personálem kolem sebe s opovržením, přesto je obecně ochoten udělat cokoli, oč je požádán, pokud je dotaz vznesen submisivně. Personál se po delší konverzaci se SCP-056 obvykle rozčílí, přesto se s ním, pokud je to možné, znovu pokusí promluvit."
      de: "Es behandelt das umgebende Personal häufig mit Verachtung, ist jedoch im Allgemeinen bereit, alles zu tun, worum gebeten wird, sofern die Bitte unterwürfig vorgebracht wird. Personal wird nach längeren Gesprächen mit SCP-056 im Allgemeinen frustriert, versucht aber, wenn möglich, erneut mit ihm zu sprechen."
      es: "A menudo trata al personal que lo rodea con desdén, aunque generalmente está dispuesto a hacer lo que se le pida, siempre que la solicitud se haga de manera sumisa. El personal generalmente se frustra con SCP-056 después de hablar con él durante mucho tiempo, aunque intenta volver a hablar con él si es posible."
      fr: "Il traite fréquemment le personnel qui l'entoure avec dédain, bien qu'il soit généralement disposé à faire tout ce qu'on lui demande, tant que la requête est formulée de manière soumise. Le personnel devient généralement frustré après avoir parlé longuement avec le SCP-056, mais tente néanmoins de lui reparler si possible."
      it: "Tratta spesso il personale che lo circonda con disdegno, sebbene sia generalmente disposto a fare qualsiasi cosa gli venga chiesta, purché la richiesta venga fatta in modo sottomesso. Il personale generalmente si sente frustrato dopo aver parlato a lungo con SCP-056, sebbene cerchi di parlargli di nuovo se possibile."
      ko: "대상은 주변 직원을 자주 경멸적으로 대하지만, 요청이 순종적인 방식으로 이루어지는 한 대체로 무엇이든 기꺼이 해준다. 직원들은 대개 SCP-056과 오래 대화한 후 좌절감을 느끼지만, 가능하다면 다시 대화하려 한다."
      pl: "Często traktuje otaczający go personel z pogardą, choć zazwyczaj chętnie robi wszystko, o co go poproszą, o ile prośba zostanie wyrażona w sposób uległy. Personel zazwyczaj denerwuje się po dłuższej rozmowie z SCP-056, mimo to stara się z nim ponownie porozmawiać, jeśli to możliwe."
      pt: "Frequentemente trata o pessoal ao seu redor com desdém, embora geralmente esteja disposto a fazer o que lhe for pedido, desde que o pedido seja feito de forma submissa. O pessoal geralmente fica frustrado com o SCP-056 após conversar com ele por muito tempo, embora tente falar com ele novamente se possível."
      th: "มันมักปฏิบัติต่อเจ้าหน้าที่รอบตัวด้วยความดูหมิ่น แม้ว่าโดยทั่วไปแล้วจะเต็มใจทำตามคำขอ ตราบใดที่การขอนั้นทำอย่างนอบน้อม เจ้าหน้าที่มักจะรู้สึกหงุดหงิดหลังจากพูดคุยกับ SCP-056 เป็นเวลานาน แม้จะพยายามพูดคุยกับมันอีกครั้งหากเป็นไปได้"
      uk: "Він часто ставиться до персоналу навколо себе зневажливо, хоча загалом готовий виконати будь-яке прохання, якщо воно висловлене покірливо. Персонал зазвичай стає роздратованим після тривалої розмови з SCP-056, але намагається знову з ним заговорити, якщо це можливо."
      vi: "Nó thường xuyên đối xử với nhân viên xung quanh bằng thái độ khinh miệt, mặc dù nhìn chung sẵn lòng làm bất cứ điều gì được yêu cầu, miễn là lời thỉnh cầu được đưa ra một cách phục tùng. Nhân viên thường trở nên bực bội với SCP-056 sau khi nói chuyện dài với nó, dù họ vẫn cố gắng nói chuyện với nó lần nữa nếu có thể."
      zh: "它经常以轻蔑的态度对待周围的工作人员，但只要请求是以顺从的方式提出，它通常愿意做任何被要求的事。人员在与SCP-056长谈之后通常会感到沮丧，但如果可能的话，他们还是会尝试再次与它交谈。"
      zh_Hant: "牠經常以輕蔑的態度對待周圍的工作人員，但只要請求是以順從的方式提出，牠通常願意做任何被要求的事。人員在與SCP-056長談之後通常會感到沮喪，但如果可能的話，他們還是會嘗試再次與牠交談。"
