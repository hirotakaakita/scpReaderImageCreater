# SCP-056 4コマ台本
# captionはSpecial Containment Procedures / Description本文からの引用。
# Additional（服飾企業での大量殺人）とAddendum 1/2-a/2-b（銃撃・D級職員殺害
# の実験結果）はグロ・被害描写のため本編に含めない。キャラにセリフは
# 言わせない。JP公式訳が直接取得できなかったため、検証済みの英語本文からの
# 翻訳（ja含む）。

