local_characters:
  scp-085:
    name: "SCP-085"
    description: >
      A young woman rendered entirely as a clean-lined black-and-white
      ink drawing, not a real three-dimensional person — flat animated
      line art with a ponytail, wearing a simple summer dress, purely
      monochrome (black linework color RGB 20,20,20 on white paper
      color RGB 255,255,255), visibly flat and two-dimensional even as
      she moves and gestures.

characters: [scp-085, attending-researcher-m, attending-researcher-f]

panels:
  - scene: >
      Wide shot, full body, showing the whole lab table. A drawing pad
      lies open, and the pencil sketch of a young woman labeled
      "Cassandra" glows faintly as it transforms into crisp animated
      black-and-white line art before attending-researcher-m's eyes,
      who watches in amazement.
    characters: [scp-085, attending-researcher-m]
    caption:
      ja: "SCP-085は、SCP-067とSCP-914を組み合わせた実験の結果生まれたものである。被験体1101Fは、SCP-067を用いて夏服を着た一人の女性の姿を描き、その下に「キャサンドラ」と名前を書き添えた。SCP-914の【精密】設定を用いることで、そのスケッチは現在の姿——知性を持つ白黒のアニメーション化された若い女性——へと変換された。"
      en: "SCP-085 is the result of an experiment conducted between SCP-067 and SCP-914. Using SCP-067, Test Subject-1101F drew a single female figure in a summer dress, with the name 'Cassandra' written underneath. Using SCP-914's [Fine] setting, the sketch was transmuted into her present form: a sentient black-and-white animated young woman."
      cs: "SCP-085 je výsledkem experimentu provedeného mezi SCP-067 a SCP-914. Pomocí SCP-067 testovací subjekt 1101F nakreslil postavu ženy v letních šatech, pod niž napsal jméno „Cassandra“. Pomocí nastavení [Jemné] u SCP-914 byla skica přeměněna do své současné podoby: vnímavé, černobílé animované mladé ženy."
      de: "SCP-085 ist das Ergebnis eines Experiments zwischen SCP-067 und SCP-914. Mithilfe von SCP-067 zeichnete Testperson 1101F eine weibliche Figur in einem Sommerkleid, mit dem darunter geschriebenen Namen „Cassandra“. Mithilfe der Einstellung [Fein] von SCP-914 wurde die Skizze in ihre jetzige Form verwandelt: eine empfindungsfähige, schwarz-weiße, animierte junge Frau."
      es: "SCP-085 es el resultado de un experimento realizado entre el SCP-067 y el SCP-914. Usando el SCP-067, el Sujeto de Prueba 1101F dibujó una figura femenina con un vestido de verano, con el nombre 'Cassandra' escrito debajo. Usando el ajuste [Fino] del SCP-914, el boceto se transmutó en su forma actual: una joven sensible, animada, en blanco y negro."
      fr: "Le SCP-085 est le résultat d'une expérience menée entre le SCP-067 et le SCP-914. À l'aide du SCP-067, le Sujet de Test 1101F a dessiné une figure féminine en robe d'été, avec le nom « Cassandra » écrit en dessous. En utilisant le réglage [Fin] du SCP-914, le croquis a été transmué en sa forme actuelle : une jeune femme sensible, animée, en noir et blanc."
      it: "SCP-085 è il risultato di un esperimento condotto tra SCP-067 e SCP-914. Utilizzando SCP-067, il Soggetto di Test 1101F disegnò una figura femminile in abito estivo, con il nome 'Cassandra' scritto sotto. Utilizzando l'impostazione [Fine] di SCP-914, lo schizzo fu trasmutato nella sua forma attuale: una giovane donna senziente, animata, in bianco e nero."
      ko: "SCP-085는 SCP-067과 SCP-914 사이에서 이루어진 실험의 결과물이다. 실험 대상 1101F는 SCP-067을 이용해 여름 원피스를 입은 여성의 모습을 그리고, 그 아래에 '캐산드라'라는 이름을 적었다. SCP-914의 [정밀] 설정을 이용하여 그 스케치는 현재의 모습—지각력을 지닌 흑백의 애니메이션화된 젊은 여성—으로 변환되었다."
      pl: "SCP-085 jest wynikiem eksperymentu przeprowadzonego między SCP-067 a SCP-914. Za pomocą SCP-067 Badany 1101F narysował postać kobiecą w letniej sukience, z podpisanym poniżej imieniem „Cassandra”. Za pomocą ustawienia [Precyzyjne] SCP-914, szkic został przekształcony w swoją obecną formę: świadomą, czarno-białą, animowaną młodą kobietę."
      pt: "O SCP-085 é o resultado de um experimento conduzido entre o SCP-067 e o SCP-914. Usando o SCP-067, o Sujeito de Teste 1101F desenhou uma figura feminina em um vestido de verão, com o nome 'Cassandra' escrito embaixo. Usando a configuração [Fina] do SCP-914, o esboço foi transmutado em sua forma atual: uma jovem senciente, animada, em preto e branco."
      th: "SCP-085 คือผลลัพธ์จากการทดลองระหว่าง SCP-067 และ SCP-914 โดยใช้ SCP-067 ผู้ทดลอง 1101F วาดรูปผู้หญิงคนหนึ่งสวมชุดฤดูร้อน พร้อมเขียนชื่อ 'แคสแซนดรา' ไว้ด้านล่าง เมื่อใช้การตั้งค่า [ละเอียด] ของ SCP-914 ภาพร่างนั้นถูกแปรสภาพเป็นรูปลักษณ์ปัจจุบันของเธอ: หญิงสาวขาวดำที่มีความรู้สึกนึกคิดและเคลื่อนไหวได้"
      uk: "SCP-085 є результатом експерименту, проведеного між SCP-067 і SCP-914. За допомогою SCP-067 Тестовий суб'єкт 1101F намалював жіночу постать у літній сукні з підписом «Кассандра» під нею. За допомогою налаштування [Точне] SCP-914 ескіз перетворився на свою теперішню форму: свідому чорно-білу анімовану молоду жінку."
      vi: "SCP-085 là kết quả của một thí nghiệm được tiến hành giữa SCP-067 và SCP-914. Sử dụng SCP-067, Đối tượng Thử nghiệm 1101F đã vẽ một hình phụ nữ mặc váy mùa hè, với tên 'Cassandra' được viết bên dưới. Sử dụng chế độ cài đặt [Tinh xảo] của SCP-914, bản phác thảo đã được biến đổi thành hình dạng hiện tại: một phụ nữ trẻ có tri giác, hoạt hình, đen trắng."
      zh: "SCP-085是SCP-067与SCP-914之间一次实验的产物。测试对象1101F使用SCP-067画出一名身穿夏装的女性形象，并在下方写上「卡珊德拉」的名字。透过SCP-914的【精细】设定，该素描被转化为其现在的形态：一位拥有感知能力、黑白动画风格的年轻女子。"
      zh_Hant: "SCP-085是SCP-067與SCP-914之間一次實驗的產物。測試對象1101F使用SCP-067畫出一名身穿夏裝的女性形象，並在下方寫上「卡珊德拉」的名字。透過SCP-914的【精細】設定，該素描被轉化為其現在的形態：一位擁有感知能力、黑白動畫風格的年輕女子。"

  - scene: >
      Medium shot, waist-up, a different framing from the wide shot
      before, inside the drawing pad's page. SCP-085 signs with her
      hands toward attending-researcher-f, who holds a notepad,
      writing back. The mood is warm and friendly.
    characters: [scp-085, attending-researcher-f]
    caption:
      ja: "SCP-085は「キャシー」と呼ばれることを好む。彼女は完全な知性と自我を持つ存在である。声は聞こえないが、手話と筆談によって職員とコミュニケーションを取る術を身につけている。職員の報告によれば、彼女は友好的で意欲的だが、どこか孤独を感じているという。"
      en: "SCP-085 prefers to be called 'Cassy.' She is completely sentient. Although her voice is inaudible, she has learned to communicate with personnel through sign language and writing. Personnel report that she is amicable and motivated, albeit lonely."
      cs: "SCP-085 dává přednost oslovení „Cassy“. Je zcela vnímavá. Ačkoli je její hlas neslyšitelný, naučila se s personálem komunikovat pomocí znakového jazyka a písma. Personál uvádí, že je přátelská a motivovaná, byť osamělá."
      de: "SCP-085 wird lieber „Cassy“ genannt. Sie ist vollständig empfindungsfähig. Obwohl ihre Stimme unhörbar ist, hat sie gelernt, mit dem Personal durch Gebärdensprache und Schrift zu kommunizieren. Das Personal berichtet, dass sie freundlich und motiviert, wenn auch einsam ist."
      es: "SCP-085 prefiere que la llamen 'Cassy'. Es completamente consciente de sí misma. Aunque su voz es inaudible, ha aprendido a comunicarse con el personal mediante el lenguaje de signos y la escritura. El personal informa que es amable y motivada, aunque solitaria."
      fr: "Le SCP-085 préfère être appelée « Cassy ». Elle est totalement consciente. Bien que sa voix soit inaudible, elle a appris à communiquer avec le personnel par la langue des signes et l'écriture. Le personnel rapporte qu'elle est amicale et motivée, bien que solitaire."
      it: "SCP-085 preferisce essere chiamata 'Cassy'. È completamente senziente. Sebbene la sua voce sia inudibile, ha imparato a comunicare con il personale attraverso il linguaggio dei segni e la scrittura. Il personale riferisce che è amichevole e motivata, sebbene sola."
      ko: "SCP-085는 '캐시'라고 불리기를 선호한다. 그녀는 완전한 지각을 지닌 존재이다. 목소리는 들리지 않지만, 수화와 필담을 통해 직원들과 소통하는 법을 익혔다. 직원들의 보고에 따르면 그녀는 친근하고 의욕적이지만 외로워한다고 한다."
      pl: "SCP-085 woli, by nazywano ją „Cassy”. Jest w pełni świadoma. Choć jej głos jest niesłyszalny, nauczyła się komunikować z personelem za pomocą języka migowego i pisma. Personel donosi, że jest przyjazna i zmotywowana, choć samotna."
      pt: "O SCP-085 prefere ser chamada de 'Cassy'. Ela é completamente senciente. Embora sua voz seja inaudível, ela aprendeu a se comunicar com o pessoal por meio de linguagem de sinais e escrita. O pessoal relata que ela é amigável e motivada, embora solitária."
      th: "SCP-085 ชอบให้เรียกว่า 'แคสซี่' เธอมีความรู้สึกนึกคิดอย่างสมบูรณ์ แม้ว่าเสียงของเธอจะไม่มีใครได้ยิน แต่เธอได้เรียนรู้ที่จะสื่อสารกับเจ้าหน้าที่ผ่านภาษามือและการเขียน เจ้าหน้าที่รายงานว่าเธอเป็นมิตรและมีแรงจูงใจ แม้จะรู้สึกเหงาก็ตาม"
      uk: "SCP-085 віддає перевагу тому, щоб її називали «Кессі». Вона повністю свідома. Хоча її голос нечутний, вона навчилася спілкуватися з персоналом за допомогою мови жестів і письма. Персонал повідомляє, що вона дружелюбна й мотивована, хоча й самотня."
      vi: "SCP-085 thích được gọi là 'Cassy'. Cô hoàn toàn có tri giác. Mặc dù giọng nói của cô không thể nghe được, cô đã học cách giao tiếp với nhân viên thông qua ngôn ngữ ký hiệu và chữ viết. Nhân viên báo cáo rằng cô thân thiện và có động lực, dù cô đơn."
      zh: "SCP-085更喜欢被称为「凯西」。她拥有完全的自我意识。尽管她的声音无法被听见，但她已学会透过手语和书写与职员沟通。据职员报告，她为人友善、积极向上，只是有些孤独。"
      zh_Hant: "SCP-085更喜歡被稱為「凱西」。她擁有完全的自我意識。儘管她的聲音無法被聽見，但她已學會透過手語和書寫與職員溝通。據職員報告，她為人友善、積極向上，只是有些孤獨。"

  - scene: >
      Wide shot, full body, a different framing from the medium shot
      before, on SCP-085's page. She stands wearing a sketched summer
      coat she has just put on from a nearby drawn hanger, next to a
      simple sketched car she appears to be about to get into, with a
      partially drawn painted drink glass beside her.
    characters: [scp-085]
    caption:
      ja: "SCP-085は、同じページに描かれたあらゆる物体と、それが実在するかのように相互作用することができる。彼女は描かれた衣服を身につけたり、スケッチされた車を運転したり、絵の具で描かれた飲み物を飲んだりすることができる。"
      en: "SCP-085 can interact with any drawn object on the same page as if it were real. She is able to wear drawn clothing, drive sketched cars, and drink painted beverages."
      cs: "SCP-085 dokáže interagovat s jakýmkoli nakresleným předmětem na téže stránce, jako by byl skutečný. Je schopna oblékat si nakreslené oblečení, řídit skicované vozy a pít malované nápoje."
      de: "SCP-085 kann mit jedem gezeichneten Objekt auf derselben Seite interagieren, als wäre es real. Sie kann gezeichnete Kleidung tragen, skizzierte Autos fahren und gemalte Getränke trinken."
      es: "SCP-085 puede interactuar con cualquier objeto dibujado en la misma página como si fuera real. Es capaz de vestir ropa dibujada, conducir coches esbozados y beber bebidas pintadas."
      fr: "Le SCP-085 peut interagir avec tout objet dessiné présent sur la même page comme s'il était réel. Elle est capable de porter des vêtements dessinés, de conduire des voitures esquissées et de boire des boissons peintes."
      it: "SCP-085 può interagire con qualsiasi oggetto disegnato sulla stessa pagina come se fosse reale. È in grado di indossare vestiti disegnati, guidare auto abbozzate e bere bevande dipinte."
      ko: "SCP-085는 같은 페이지에 그려진 어떤 사물과도 마치 그것이 실재하는 것처럼 상호작용할 수 있다. 그녀는 그려진 옷을 입고, 스케치된 자동차를 운전하고, 그림으로 그려진 음료를 마실 수 있다."
      pl: "SCP-085 może wchodzić w interakcje z dowolnym narysowanym przedmiotem na tej samej stronie, tak jakby był prawdziwy. Potrafi nosić narysowane ubrania, prowadzić naszkicowane samochody i pić malowane napoje."
      pt: "O SCP-085 pode interagir com qualquer objeto desenhado na mesma página como se fosse real. Ela é capaz de vestir roupas desenhadas, dirigir carros esboçados e beber bebidas pintadas."
      th: "SCP-085 สามารถโต้ตอบกับวัตถุที่ถูกวาดใดๆ บนหน้ากระดาษเดียวกันราวกับว่ามันเป็นของจริง เธอสามารถสวมเสื้อผ้าที่วาดขึ้น ขับรถที่ร่างไว้ และดื่มเครื่องดื่มที่ระบายสีได้"
      uk: "SCP-085 може взаємодіяти з будь-яким намальованим об'єктом на тій самій сторінці, наче він справжній. Вона здатна носити намальований одяг, керувати накресленими автомобілями та пити мальовані напої."
      vi: "SCP-085 có thể tương tác với bất kỳ vật thể được vẽ nào trên cùng trang giấy như thể đó là vật thật. Cô có thể mặc quần áo được vẽ, lái những chiếc xe được phác họa, và uống những thức uống được tô màu."
      zh: "SCP-085能够与同一页面上任何被描绘出的物体互动，仿佛那些是真实存在的一般。她能够穿上画出的衣物、驾驶素描的汽车，并喝下彩绘的饮品。"
      zh_Hant: "SCP-085能夠與同一頁面上任何被描繪出的物體互動，彷彿那些是真實存在的一般。她能夠穿上畫出的衣物、駕駛素描的汽車，並喝下彩繪的飲品。"

  - scene: >
      Close-up on the edge where two sheets of paper are pressed
      together — one plain pencil-sketch page, one canvas-textured
      oil-painting sheet — a different framing from the wide shot
      before. SCP-085 is shown mid-transfer: her form shifting from
      clean black-and-white line art on the left sheet into a more
      painterly, textured version of herself as she crosses onto the
      right sheet.
    characters: [scp-085]
    caption:
      ja: "SCP-085は、二枚の紙や画像が接触している限り、片方からもう片方へと移動する能力も示している。他の美術作品に入り込む際、SCP-085はその新たな環境の画風を取り入れる。"
      en: "SCP-085 has also demonstrated the ability to transfer from one sheet or image to another, as long as the two are flush. When entering other pieces of art, SCP-085 takes on the artistic style of her new environment."
      cs: "SCP-085 také prokázala schopnost přenášet se z jednoho listu nebo obrázku na druhý, pokud jsou oba v přímém kontaktu. Při vstupu do jiných uměleckých děl přejímá SCP-085 umělecký styl svého nového prostředí."
      de: "SCP-085 hat außerdem die Fähigkeit gezeigt, von einem Blatt oder Bild auf ein anderes überzuwechseln, solange beide bündig aneinanderliegen. Beim Betreten anderer Kunstwerke nimmt SCP-085 den künstlerischen Stil ihrer neuen Umgebung an."
      es: "El SCP-085 también ha demostrado la capacidad de transferirse de una hoja o imagen a otra, siempre que ambas estén en contacto directo. Al entrar en otras obras de arte, el SCP-085 adopta el estilo artístico de su nuevo entorno."
      fr: "Le SCP-085 a également démontré la capacité de se transférer d'une feuille ou d'une image à une autre, à condition que les deux soient en contact direct. En entrant dans d'autres œuvres d'art, le SCP-085 adopte le style artistique de son nouvel environnement."
      it: "SCP-085 ha anche dimostrato la capacità di trasferirsi da un foglio o un'immagine a un'altra, purché i due siano a contatto diretto. Quando entra in altre opere d'arte, SCP-085 assume lo stile artistico del suo nuovo ambiente."
      ko: "SCP-085는 또한 두 장의 종이나 이미지가 맞닿아 있는 한, 한쪽에서 다른 쪽으로 옮겨가는 능력도 보여주었다. 다른 미술 작품에 들어갈 때, SCP-085는 새로운 환경의 화풍을 그대로 취한다."
      pl: "SCP-085 wykazało również zdolność przenoszenia się z jednej kartki lub obrazu na drugi, o ile oba stykają się bezpośrednio. Wchodząc w inne dzieła sztuki, SCP-085 przyjmuje styl artystyczny swojego nowego otoczenia."
      pt: "O SCP-085 também demonstrou a capacidade de se transferir de uma folha ou imagem para outra, desde que as duas estejam em contato direto. Ao entrar em outras obras de arte, o SCP-085 assume o estilo artístico de seu novo ambiente."
      th: "SCP-085 ยังแสดงความสามารถในการย้ายจากแผ่นกระดาษหรือภาพหนึ่งไปยังอีกภาพหนึ่งได้ ตราบใดที่ทั้งสองสัมผัสกันสนิท เมื่อเข้าสู่งานศิลปะชิ้นอื่น SCP-085 จะรับเอารูปแบบทางศิลปะของสภาพแวดล้อมใหม่นั้นมาใช้"
      uk: "SCP-085 також продемонструвала здатність переходити з одного аркуша чи зображення на інший, якщо вони щільно прилягають одне до одного. Потрапляючи в інші твори мистецтва, SCP-085 набуває художнього стилю свого нового середовища."
      vi: "SCP-085 cũng đã thể hiện khả năng chuyển từ tờ giấy hoặc hình ảnh này sang tờ giấy hoặc hình ảnh khác, miễn là hai bên tiếp xúc khít nhau. Khi bước vào các tác phẩm nghệ thuật khác, SCP-085 mang phong cách nghệ thuật của môi trường mới của mình."
      zh: "SCP-085还展现出从一张纸或一幅图像转移到另一张/幅的能力，只要两者紧密贴合即可。当她进入其他艺术作品时，SCP-085会采用其新环境的艺术风格。"
      zh_Hant: "SCP-085還展現出從一張紙或一幅圖像轉移到另一張/幅的能力，只要兩者緊密貼合即可。當她進入其他藝術作品時，SCP-085會採用其新環境的藝術風格。"

addendum:
  ja: "補遺：M・C・エッシャーの『上昇と下降』を見せられたSCP-085は、その不可能な階段のループを何度も歩いてみせ、「いい運動用トラックになりそう」とだけ感想を述べた——そこに何ら矛盾を見出さなかったのである。"
  en: "Addendum: When shown M.C. Escher's 'Ascending and Descending,' SCP-085 walked its impossible staircase loop several times and remarked only that it would make a neat exercise track — seeing nothing paradoxical about it at all."
  cs: "Dodatek: Když byla SCP-085 ukázána Escherova litografie „Vzestup a sestup“, několikrát obešla její nemožnou smyčku schodiště a poznamenala jen, že by z toho byla pěkná trasa na cvičení – žádný paradox v tom neviděla."
  de: "Anhang: Als SCP-085 M.C. Eschers „Aufsteigend und absteigend“ gezeigt wurde, ging sie die unmögliche Treppenschleife mehrfach ab und bemerkte lediglich, dass sie eine nette Laufstrecke abgeben würde – sie sah darin nichts Paradoxes."
  es: "Adenda: Al mostrarle 'Subiendo y bajando' de M. C. Escher, el SCP-085 recorrió varias veces su bucle imposible de escaleras y solo comentó que sería una pista de ejercicio estupenda, sin percibir nada paradójico en ella."
  fr: "Addendum : Lorsqu'on lui montra « Montée et descente » de M. C. Escher, le SCP-085 parcourut plusieurs fois sa boucle d'escalier impossible et fit simplement remarquer qu'elle ferait une jolie piste d'exercice — n'y voyant absolument rien de paradoxal."
  it: "Addendum: Quando le fu mostrata 'Salita e discesa' di M. C. Escher, SCP-085 percorse più volte l'impossibile anello di scale e osservò solo che avrebbe fatto una bella pista per fare esercizio, senza scorgervi alcun paradosso."
  ko: "부록: M. C. 에셔의 '오르내리기'를 보여주자 SCP-085는 그 불가능한 계단 루프를 여러 번 걸어보고는, 딱 하나 '운동 코스로 딱 좋겠다'는 소감만을 남겼다 — 거기서 어떤 모순도 발견하지 못한 채였다."
  pl: "Aneks: Gdy pokazano SCP-085 litografię M.C. Eschera „Wstępowanie i schodzenie”, kilkakrotnie przeszła całą pętlę niemożliwych schodów i zauważyła jedynie, że stanowiłaby fajną trasę do ćwiczeń — nie dostrzegając w niej niczego paradoksalnego."
  pt: "Adendo: Ao ser mostrada a obra 'Subindo e Descendo' de M. C. Escher, o SCP-085 percorreu o loop impossível de escadas várias vezes e comentou apenas que faria uma bela pista de exercícios — sem perceber nada paradoxal nela."
  th: "ภาคผนวก: เมื่อได้เห็นภาพ 'Ascending and Descending' ของเอ็ม. ซี. เอเชอร์ SCP-085 เดินวนบันไดที่เป็นไปไม่ได้นั้นหลายรอบ และแสดงความเห็นเพียงว่ามันน่าจะเป็นเส้นทางออกกำลังกายที่ดี — โดยไม่เห็นความขัดแย้งใดๆ ในภาพนั้นเลย"
  uk: "Додаток: Коли SCP-085 показали літографію М. К. Ешера «Підйом і спуск», вона кілька разів пройшла неможливою петлею сходів і зауважила лише, що з цього вийшла б чудова доріжка для вправ — не побачивши в цьому жодного парадоксу."
  vi: "Phụ lục: Khi được xem tác phẩm 'Ascending and Descending' của M. C. Escher, SCP-085 đã đi quanh vòng cầu thang bất khả thi đó nhiều lần và chỉ nhận xét rằng nó sẽ là một đường chạy thể dục tuyệt vời — không hề nhận ra điều gì nghịch lý trong đó cả."
  zh: "补遗：在被展示M.C.埃舍尔的《上升与下降》时，SCP-085沿着那不可能存在的楼梯回路走了好几圈，只评价说这会是个不错的运动跑道——她完全没有察觉其中的悖论。"
  zh_Hant: "補遺：在被展示M.C.埃舍爾的《上升與下降》時，SCP-085沿著那不可能存在的樓梯迴路走了好幾圈，只評價說這會是個不錯的運動跑道——她完全沒有察覺其中的悖論。"
