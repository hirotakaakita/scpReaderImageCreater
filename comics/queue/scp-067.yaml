panels:
  - scene: >
      Extreme close-up on an open felt-lined wooden box, a pale green
      fountain pen with a single red line down its side resting inside,
      its nib catching a sharp glint of light. attending-researcher-f
      examines it closely with gloved hands, not yet touching it.
    characters: [attending-researcher-f]
    caption:
      ja: "SCP-067は、第一次世界大戦と第二次世界大戦の間のどこかの時期に、ドイツの文具会社ペリカン社によって製造された万年筆である。淡い緑色で、側面には赤い線が一本まっすぐ入っている。軸はオーク材で、ペン先は非常に鋭く、軽く押し当てただけでも人間の皮膚を貫通しうる。"
      en: "SCP-067 is a fountain pen made by a German supply company called Pelikan at some point between World War I and II. It is pale green in color, with a single red line going straight down along the side. The shell is oak and the nib is extremely sharp, capable of piercing human skin if pressed even lightly."
      cs: "SCP-067 je plnicí pero vyrobené německou zásobovací společností Pelikan někdy mezi první a druhou světovou válkou. Má bledě zelenou barvu s jedním červeným pruhem táhnoucím se svisle po boku. Tělo je z dubu a hrot je extrémně ostrý, schopný proniknout lidskou kůží i při lehkém přitlačení."
      de: "SCP-067 ist ein Füllfederhalter, der irgendwann zwischen dem Ersten und Zweiten Weltkrieg von der deutschen Firma Pelikan hergestellt wurde. Er ist blassgrün gefärbt, mit einem einzelnen roten Streifen, der gerade an der Seite entlangläuft. Das Gehäuse besteht aus Eiche, und die Feder ist extrem scharf und kann bei leichtem Druck die menschliche Haut durchdringen."
      es: "SCP-067 es una pluma estilográfica fabricada por una empresa alemana llamada Pelikan en algún momento entre la Primera y la Segunda Guerra Mundial. Es de color verde pálido, con una única línea roja que baja recta por el costado. El cuerpo es de roble y el plumín es extremadamente afilado, capaz de perforar la piel humana incluso con una ligera presión."
      fr: "Le SCP-067 est un stylo-plume fabriqué par une entreprise allemande nommée Pelikan à un moment donné entre la Première et la Seconde Guerre mondiale. Il est de couleur vert pâle, avec une seule ligne rouge descendant tout droit le long du côté. Le corps est en chêne et la plume est extrêmement affûtée, capable de percer la peau humaine même sous une légère pression."
      it: "SCP-067 è una penna stilografica prodotta da un'azienda tedesca chiamata Pelikan tra la Prima e la Seconda Guerra Mondiale. È di colore verde pallido, con un'unica linea rossa che scende dritta lungo il lato. Il corpo è in quercia e il pennino è estremamente affilato, capace di perforare la pelle umana anche con una leggera pressione."
      ko: "SCP-067은 제1차 세계대전과 제2차 세계대전 사이 어느 시점에 독일의 문구 회사 펠리칸이 제작한 만년필이다. 연한 녹색을 띠며, 측면에 붉은 선이 하나 곧게 내려와 있다. 축은 오크 재질이며, 펜촉은 극도로 날카로워 가볍게만 눌러도 사람의 피부를 뚫을 수 있다."
      pl: "SCP-067 to wieczne pióro wyprodukowane przez niemiecką firmę Pelikan gdzieś między pierwszą a drugą wojną światową. Ma bladozielony kolor z pojedynczą czerwoną linią biegnącą prosto wzdłuż boku. Obudowa jest dębowa, a stalówka jest niezwykle ostra, zdolna przebić ludzką skórę nawet przy lekkim nacisku."
      pt: "O SCP-067 é uma caneta-tinteiro fabricada por uma empresa alemã chamada Pelikan em algum momento entre a Primeira e a Segunda Guerra Mundial. É de cor verde-clara, com uma única linha vermelha descendo reta ao longo da lateral. O corpo é de carvalho e a pena é extremamente afiada, capaz de perfurar a pele humana mesmo com uma leve pressão."
      th: "SCP-067 คือปากกาหมึกซึมที่ผลิตโดยบริษัทเครื่องเขียนสัญชาติเยอรมันชื่อเพลิแกน ในช่วงเวลาใดเวลาหนึ่งระหว่างสงครามโลกครั้งที่หนึ่งและครั้งที่สอง มีสีเขียวอ่อน มีเส้นสีแดงเส้นเดียวพาดตรงลงมาตามด้านข้าง ตัวปากกาทำจากไม้โอ๊ก และปลายปากกาคมมากจนสามารถแทงทะลุผิวหนังมนุษย์ได้แม้กดเพียงเบาๆ"
      uk: "SCP-067 — це авторучка, виготовлена німецькою компанією Pelikan десь між Першою та Другою світовими війнами. Вона блідо-зеленого кольору з однією червоною лінією, що йде прямо вздовж боку. Корпус дубовий, а перо надзвичайно гостре, здатне проколоти людську шкіру навіть при легкому натисканні."
      vi: "SCP-067 là một cây bút máy được sản xuất bởi một công ty văn phòng phẩm Đức tên là Pelikan vào khoảng thời gian nào đó giữa Thế chiến thứ nhất và thứ hai. Nó có màu xanh lục nhạt, với một đường kẻ đỏ duy nhất chạy thẳng dọc theo thân bút. Vỏ bút bằng gỗ sồi và ngòi bút cực kỳ sắc, có thể xuyên thủng da người chỉ với một lực ấn nhẹ."
      zh: "SCP-067是一支钢笔，由德国文具公司百利金在一战与二战之间的某个时期制造。笔身呈淡绿色，侧面有一条笔直的红线。笔杆为橡木材质，笔尖极为锋利，即使轻轻按压也能刺穿人的皮肤。"
      zh_Hant: "SCP-067是一支鋼筆，由德國文具公司百利金在一戰與二戰之間的某個時期製造。筆身呈淡綠色，側面有一條筆直的紅線。筆桿為橡木材質，筆尖極為鋒利，即使輕輕按壓也能刺穿人的皮膚。"

  - scene: >
      Medium shot, waist-up, a different framing from the close-up
      before. attending-researcher-m sits at a plain table, SCP-067 in
      his right hand moving rapidly across a sheet of paper on its own,
      his face showing wide-eyed surprise and detachment while his other
      hand rests motionless on the table.
    characters: [attending-researcher-m]
    caption:
      ja: "研究により、SCP-067を握った者は、それを握った手と腕の自律性を完全に失うことが推測されている。感覚は完全に保たれているが、肘から先の腕は正体不明の力によって制御される。「制御された」手はペンを使い、それを握っている人物についての詳細な伝記を書き始める。"
      en: "Research has surmised that any subject holding SCP-067 loses all autonomy of the hand and arm that grasps it. Full sensation is intact, but the arm below the elbow is controlled by unknown forces. The 'controlled' hand will start to use the pen to write a detailed biography of the individual holding it."
      cs: "Výzkum usoudil, že jakýkoli subjekt držící SCP-067 ztrácí veškerou autonomii ruky a paže, která jej svírá. Plný smysl je zachován, ale paže pod loktem je ovládána neznámými silami. „Ovládaná“ ruka pak začne pomocí pera psát podrobnou biografii osoby, která jej drží."
      de: "Untersuchungen deuten darauf hin, dass jede Person, die SCP-067 hält, die vollständige Autonomie über Hand und Arm verliert, mit denen sie es greift. Das volle Gefühl bleibt erhalten, aber der Arm unterhalb des Ellbogens wird von unbekannten Kräften gesteuert. Die 'kontrollierte' Hand beginnt, mit dem Stift eine detaillierte Biografie der haltenden Person zu schreiben."
      es: "Las investigaciones han deducido que cualquier sujeto que sostenga el SCP-067 pierde toda autonomía de la mano y el brazo que lo sujetan. La sensación se mantiene intacta, pero el brazo por debajo del codo es controlado por fuerzas desconocidas. La mano 'controlada' comenzará a usar la pluma para escribir una biografía detallada de la persona que la sostiene."
      fr: "Les recherches ont laissé supposer que tout sujet tenant le SCP-067 perd toute autonomie de la main et du bras qui le saisissent. La sensation reste pleinement intacte, mais le bras en dessous du coude est contrôlé par des forces inconnues. La main « contrôlée » se met alors à utiliser le stylo pour rédiger une biographie détaillée de la personne qui le tient."
      it: "La ricerca ha ipotizzato che qualsiasi soggetto che tenga in mano SCP-067 perda completamente l'autonomia della mano e del braccio che lo afferrano. La sensazione rimane intatta, ma il braccio sotto il gomito è controllato da forze sconosciute. La mano 'controllata' inizierà a usare la penna per scrivere una biografia dettagliata della persona che la tiene."
      ko: "연구에 따르면 SCP-067을 쥔 피험자는 그것을 잡은 손과 팔의 자율성을 완전히 상실하는 것으로 추정된다. 감각은 온전히 남아 있지만, 팔꿈치 아래 부분은 정체불명의 힘에 의해 조종된다. '조종된' 손은 펜을 사용해 그것을 쥔 사람에 대한 상세한 전기를 써 내려가기 시작한다."
      pl: "Badania sugerują, że każdy badany trzymający SCP-067 traci całkowitą autonomię dłoni i ramienia, którym je trzyma. Pełne czucie pozostaje nienaruszone, ale ramię poniżej łokcia jest kontrolowane przez nieznane siły. „Kontrolowana” dłoń zaczyna posługiwać się piórem, by spisać szczegółową biografię osoby, która je trzyma."
      pt: "Pesquisas sugerem que qualquer sujeito que segure o SCP-067 perde toda a autonomia da mão e do braço que o seguram. A sensação permanece intacta, mas o braço abaixo do cotovelo é controlado por forças desconhecidas. A mão 'controlada' passa a usar a caneta para escrever uma biografia detalhada da pessoa que a segura."
      th: "การวิจัยสันนิษฐานว่าผู้ทดลองที่ถือ SCP-067 จะสูญเสียความเป็นอิสระของมือและแขนที่จับมันโดยสิ้นเชิง ความรู้สึกยังคงสมบูรณ์ แต่แขนตั้งแต่ข้อศอกลงไปถูกควบคุมโดยพลังที่ไม่ทราบแหล่งที่มา มือที่ 'ถูกควบคุม' จะเริ่มใช้ปากกาเขียนชีวประวัติโดยละเอียดของบุคคลที่ถือมันอยู่"
      uk: "Дослідження припускають, що будь-який суб'єкт, який тримає SCP-067, повністю втрачає автономію руки та передпліччя, якими його тримає. Повна чутливість зберігається, але рука нижче ліктя контролюється невідомими силами. «Контрольована» рука починає використовувати ручку, щоб написати детальну біографію особи, яка її тримає."
      vi: "Nghiên cứu suy đoán rằng bất kỳ đối tượng nào cầm SCP-067 sẽ mất hoàn toàn quyền tự chủ đối với bàn tay và cánh tay đang nắm giữ nó. Cảm giác vẫn còn nguyên vẹn, nhưng cánh tay dưới khuỷu tay bị điều khiển bởi những thế lực không xác định. Bàn tay 'bị điều khiển' sẽ bắt đầu dùng bút để viết một bản tiểu sử chi tiết về người đang cầm nó."
      zh: "研究推测，任何握持SCP-067的对象都会完全失去握笔的手与手臂的自主控制权。触感完全保留，但肘部以下的手臂由未知力量控制。这只「被控制」的手会开始用笔写下持笔者本人的详细传记。"
      zh_Hant: "研究推測，任何握持SCP-067的對象都會完全失去握筆的手與手臂的自主控制權。觸感完全保留，但肘部以下的手臂由未知力量控制。這隻「被控制」的手會開始用筆寫下持筆者本人的詳細傳記。"

  - scene: >
      Wide shot, full body, pulled back to show the whole room, a
      different framing from the medium shot before.
      attending-researcher-f sits at a table surrounded by scattered
      sheets of intricate finished drawings, her controlled hand still
      sketching an elaborate abstract pattern while her face shows
      bewildered astonishment at her own handiwork.
    characters: [attending-researcher-f]
    caption:
      ja: "SCP-067を握った被験者は、正式な美術教育を受けたことも、絵を描く習慣もないにもかかわらず、精緻な芸術作品を作り出すことも確認されている。"
      en: "Subjects holding SCP-067 have also been known to create intricate works of art, despite the subject lacking any formal art training or previous tendencies toward drawing."
      cs: "Bylo také zjištěno, že subjekty držící SCP-067 vytvářejí spletitá umělecká díla, přestože jim chybí jakékoli formální umělecké vzdělání nebo dřívější sklony ke kreslení."
      de: "Es wurde auch beobachtet, dass Testpersonen, die SCP-067 halten, kunstvolle Werke schaffen, obwohl ihnen jegliche formale künstlerische Ausbildung oder frühere Neigung zum Zeichnen fehlt."
      es: "También se ha observado que los sujetos que sostienen el SCP-067 crean obras de arte intrincadas, a pesar de carecer de formación artística formal o de una tendencia previa a dibujar."
      fr: "Il a également été observé que les sujets tenant le SCP-067 créaient des œuvres d'art complexes, bien qu'ils n'aient reçu aucune formation artistique formelle ni montré de disposition antérieure pour le dessin."
      it: "È stato anche osservato che i soggetti che tengono SCP-067 creano opere d'arte intricate, nonostante manchino di qualsiasi formazione artistica formale o di precedenti inclinazioni al disegno."
      ko: "SCP-067을 쥔 피험자들은 정식 미술 교육을 받은 적도, 이전에 그림을 그리던 경향도 없음에도 불구하고 정교한 예술 작품을 만들어내는 것으로도 확인되었다."
      pl: "Zaobserwowano również, że badani trzymający SCP-067 tworzą misternie wykonane dzieła sztuki, mimo braku jakiegokolwiek formalnego wykształcenia artystycznego czy wcześniejszych skłonności do rysowania."
      pt: "Também foi observado que sujeitos que seguram o SCP-067 criam obras de arte intrincadas, apesar de não terem qualquer formação artística formal ou tendência anterior para o desenho."
      th: "ยังพบด้วยว่าผู้ทดลองที่ถือ SCP-067 สามารถสร้างสรรค์งานศิลปะที่ประณีตซับซ้อนได้ แม้ว่าผู้ทดลองจะไม่เคยได้รับการฝึกฝนศิลปะอย่างเป็นทางการหรือมีแนวโน้มในการวาดภาพมาก่อนก็ตาม"
      uk: "Також відомо, що суб'єкти, які тримають SCP-067, створюють вишукані мистецькі твори, попри відсутність будь-якої формальної художньої освіти чи попередньої схильності до малювання."
      vi: "Các đối tượng cầm SCP-067 cũng được biết là đã tạo ra những tác phẩm nghệ thuật tinh xảo, mặc dù họ không được đào tạo mỹ thuật chính quy hay có xu hướng vẽ vời trước đó."
      zh: "还发现，握持SCP-067的对象即便完全没有受过正规美术训练、此前也从未表现出绘画倾向，也能创作出精细复杂的艺术作品。"
      zh_Hant: "還發現，握持SCP-067的對象即便完全沒有受過正規美術訓練、此前也從未表現出繪畫傾向，也能創作出精細複雜的藝術作品。"

  - scene: >
      Close-up on attending-researcher-m's face, a different framing
      from the wide shot before, bewildered and quietly unsettled,
      looking down at his own hand now still and normal again, dense
      pages of handwriting fanned out on the table beside him.
    characters: [attending-researcher-m]
    caption:
      ja: "「ペンを手に取った瞬間、自分の手がもう自分のものではなくなったように感じました……不意に手が止まり、また自分の手を完全に取り戻せたことに気づいて、ペンを置きました。ペンの方が、もう終わりだと決めたのだと思います」——供述記録01より"
      en: "'When I picked up the pen, it seemed as if my hand wasn't my own anymore... Suddenly, my hand stopped and I realized I had complete control over my hand again, and I put the pen back down. I guess the pen decided it was done, and was finished with me.' — Quoted Response-01"
      cs: "„Když jsem pero zvedl, zdálo se, jako by moje ruka už nebyla moje... Najednou se ruka zastavila a uvědomil jsem si, že mám opět úplnou kontrolu nad rukou, a pero jsem odložil. Myslím, že pero rozhodlo, že je hotovo, a se mnou skončilo.“ — Citovaná odpověď 01"
      de: "„Als ich den Stift aufhob, fühlte es sich an, als gehörte meine Hand nicht mehr mir... Plötzlich hielt meine Hand inne und ich merkte, dass ich wieder die volle Kontrolle über sie hatte, und ich legte den Stift zurück. Ich denke, der Stift hat entschieden, dass er fertig war, und mit mir abgeschlossen hat.“ — Zitierte Aussage 01"
      es: "«Cuando cogí la pluma, parecía como si mi mano ya no fuera mía... De repente mi mano se detuvo y me di cuenta de que había recuperado el control total sobre ella, así que volví a dejar la pluma. Supongo que la pluma decidió que había terminado, y que había acabado conmigo.» — Respuesta citada 01"
      fr: "« Quand j'ai pris le stylo, c'était comme si ma main ne m'appartenait plus... Soudain, ma main s'est arrêtée et j'ai réalisé que j'avais de nouveau le plein contrôle de ma main, alors j'ai reposé le stylo. Je suppose que le stylo a décidé qu'il avait terminé, et qu'il en avait fini avec moi. » — Réponse citée 01"
      it: "«Quando ho preso la penna, sembrava che la mia mano non fosse più mia... All'improvviso la mia mano si è fermata e ho capito di avere di nuovo il pieno controllo su di essa, così ho riposto la penna. Credo che la penna abbia deciso di aver finito, e che avesse finito con me.» — Risposta citata 01"
      ko: "\"펜을 집어 든 순간, 제 손이 더 이상 제 것이 아닌 것처럼 느껴졌어요... 갑자기 손이 멈췄고, 제가 다시 손을 완전히 제어할 수 있게 되었다는 걸 깨닫고서 펜을 내려놓았습니다. 펜이 다 됐다고 판단해서 저와의 일을 끝낸 것 같아요.\" — 인용 응답 01"
      pl: "„Kiedy podniosłem pióro, wydawało się, jakby moja dłoń już do mnie nie należała... Nagle moja dłoń się zatrzymała i zdałem sobie sprawę, że znów mam nad nią pełną kontrolę, więc odłożyłem pióro. Chyba pióro uznało, że skończyło, i że skończyło ze mną”. — Cytowana odpowiedź 01"
      pt: "\"Quando peguei a caneta, parecia que minha mão já não era mais minha... De repente minha mão parou e percebi que tinha o controle total dela de volta, então recoloquei a caneta. Acho que a caneta decidiu que havia terminado, e que tinha terminado comigo.\" — Resposta Citada 01"
      th: "\"เมื่อฉันหยิบปากกาขึ้นมา รู้สึกเหมือนมือของฉันไม่ใช่ของฉันอีกต่อไป... จู่ๆ มือของฉันก็หยุด และฉันก็ตระหนักว่าฉันควบคุมมือของตัวเองได้อย่างสมบูรณ์อีกครั้ง ฉันจึงวางปากกาลง ฉันคิดว่าปากกาตัดสินใจว่ามันเสร็จแล้ว และเสร็จสิ้นภารกิจกับฉันแล้ว\" — คำให้การอ้างอิงที่ 01"
      uk: "«Коли я взяв ручку, здалося, ніби моя рука вже не моя... Раптом моя рука зупинилася, і я усвідомив, що знову повністю контролюю її, тож я поклав ручку назад. Гадаю, ручка вирішила, що закінчила, і що зі мною покінчено». — Цитована відповідь 01"
      vi: "\"Khi tôi cầm cây bút lên, cảm giác như bàn tay tôi không còn là của mình nữa... Đột nhiên bàn tay tôi dừng lại và tôi nhận ra mình đã hoàn toàn kiểm soát được nó trở lại, thế là tôi đặt bút xuống. Tôi đoán cây bút đã quyết định rằng nó xong việc, và đã xong với tôi.\" — Lời khai được trích dẫn 01"
      zh: "「当我拿起那支笔时，感觉自己的手好像已经不再属于我了……突然间我的手停了下来，我意识到自己重新完全掌控了这只手，于是我把笔放下了。我想是这支笔自己判定完成了，也就和我了结了。」——引述回应01"
      zh_Hant: "「當我拿起那支筆時，感覺自己的手好像已經不再屬於我了……突然間我的手停了下來，我意識到自己重新完全掌控了這隻手，於是我把筆放下了。我想是這支筆自己判定完成了，也就和我了結了。」——引述回應01"
