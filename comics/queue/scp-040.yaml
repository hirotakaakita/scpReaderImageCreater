object_class: Euclid

local_characters:
  scp-040:
    name: SCP-040
    description: >
      A Caucasian girl of about eight years old, one meter tall, bright
      pink hair (color RGB 235,105,180) that looks slightly brittle and
      thin, striking heterochromia — one eye green-yellow, the other
      eye entirely black sclera. Pale, delicate-looking skin. Wears
      simple soft clothing suited for a child.
  scp-040-1a:
    name: SCP-040-1a
    description: >
      A small polymorphic creature resembling a soft, fuzzy
      housecat-like jacket worn draped over the shoulders, its fur
      shifting slightly in color and texture, calm and affectionate in
      posture.
  scp-040-1c:
    name: SCP-040-1c
    description: >
      A small spherical creature with a rubbery balloon-like body,
      eleven thin limbs ending in tiny opposable digits, floating
      gently in the air.
  scp-040-1j:
    name: SCP-040-1j
    description: >
      A small quadrupedal creature covered in thick pink-and-blue
      patched fur, no visible eyes, a broad friendly mouth with blunt
      teeth, sturdy limbs suited for climbing.

characters: [scp-040, scp-040-1a, scp-040-1c, scp-040-1j, attending-researcher-f]

panels:
  - scene: >
      Wide shot, full body, eye level, showing a softly lit humanoid
      containment chamber furnished with toys, drawings taped to the
      wall, and simple furniture suited for a child. scp-040 sits
      cross-legged on the floor, gently coloring in a book, pink hair
      catching the light, her mismatched eyes visible.
    characters: [scp-040]
    caption:
      ja: "SCP-040は白人女性で、およそ8歳、身長1メートルである。対象の髪は鮮やかなピンク色をしている。対象は緑と黄色の虹彩異色症を示しており、左目の強膜は黒色をしている。"
      en: "SCP-040 is a Caucasian female of approximately eight years of age, standing one meter in height. The subject's hair is a bright pink in coloration. The subject displays green/yellow heterochromia, with the sclera of the left eye black in coloration."
      cs: "SCP-040 je bělošská dívka, přibližně osm let stará, vysoká jeden metr. Vlasy subjektu mají jasně růžovou barvu. Subjekt vykazuje zeleno-žlutou heterochromii, přičemž skléra levého oka je černá."
      de: "SCP-040 ist ein weißes Mädchen im Alter von etwa acht Jahren, ein Meter groß. Das Haar des Subjekts ist leuchtend pink gefärbt. Das Subjekt weist eine grün-gelbe Heterochromie auf, wobei die Sklera des linken Auges schwarz gefärbt ist."
      es: "SCP-040 es una niña caucásica de aproximadamente ocho años de edad, con una estatura de un metro. El cabello del sujeto es de un color rosa brillante. El sujeto presenta heterocromía verde/amarilla, con la esclerótica del ojo izquierdo de color negro."
      fr: "Le SCP-040 est une fillette caucasienne d'environ huit ans, mesurant un mètre. Les cheveux du sujet sont d'une couleur rose vif. Le sujet présente une hétérochromie vert/jaune, la sclère de l'œil gauche étant de couleur noire."
      it: "SCP-040 è una bambina caucasica di circa otto anni, alta un metro. I capelli del soggetto sono di un colore rosa brillante. Il soggetto presenta eterocromia verde/gialla, con la sclera dell'occhio sinistro di colore nero."
      ko: "SCP-040은 백인 여아로, 약 8세이며 신장은 1미터이다. 대상의 머리카락은 밝은 분홍색이다. 대상은 초록/노랑 홍채이색증을 나타내며, 왼쪽 눈의 공막은 검은색이다."
      pl: "SCP-040 to biała dziewczynka w wieku około ośmiu lat, o wzroście jednego metra. Włosy osobnika są jaskraworóżowe. Osobnik wykazuje zielono-żółtą heterochromię, przy czym twardówka lewego oka jest czarna."
      pt: "O SCP-040 é uma menina caucasiana de aproximadamente oito anos de idade, com um metro de altura. O cabelo do sujeito é de cor rosa vibrante. O sujeito apresenta heterocromia verde/amarela, com a esclera do olho esquerdo de cor preta."
      th: "SCP-040 คือเด็กหญิงผิวขาวอายุประมาณแปดขวบ สูงหนึ่งเมตร ผมของผู้ถูกทดสอบมีสีชมพูสดใส ผู้ถูกทดสอบมีภาวะตาสองสีเขียว/เหลือง โดยตาขาวของตาซ้ายมีสีดำ"
      uk: "SCP-040 — це біла дівчинка приблизно восьми років, зростом один метр. Волосся суб'єкта яскраво-рожевого кольору. У суб'єкта спостерігається зелено-жовта гетерохромія, склера лівого ока чорного кольору."
      vi: "SCP-040 là một bé gái da trắng khoảng tám tuổi, cao một mét. Tóc của đối tượng có màu hồng tươi. Đối tượng có chứng dị sắc mống mắt xanh lá/vàng, với lòng trắng của mắt trái có màu đen."
      zh: "SCP-040是一名约8岁的白人女孩，身高1米。对象的头发呈鲜艳的粉色。对象表现出绿/黄色异色症，左眼巩膜呈黑色。"
      zh_Hant: "SCP-040是一名約8歲的白人女孩，身高1公尺。對象的頭髮呈鮮豔的粉色。對象表現出綠/黃色異色症，左眼鞏膜呈黑色。"

  - scene: >
      Medium shot, waist-up, low angle, a different framing from the
      wide establishing shot. scp-040 kneels beside a small patch of
      ordinary earth, both hands hovering just above a small mouse
      resting there, her expression full of quiet concentration as the
      mouse's fur begins to shimmer and shift.
    characters: [scp-040]
    caption:
      ja: "SCP-040は生体物質を操作する能力を持ち、既存の生物を変異・改変することで新しい生物——総称してSCP-040-1と呼ばれる——を作り出すことができる。この効果は任意で発動できるが、実行には多大な集中力と時間を要する。"
      en: "SCP-040 is capable of manipulating living matter, mutating and modifying existing organisms in order to create new ones, collectively referred to as SCP-040-1. This effect is at will, but requires significant focus and time to enact."
      cs: "SCP-040 je schopno manipulovat s živou hmotou, mutovat a upravovat existující organismy za účelem vytvoření nových, souhrnně označovaných jako SCP-040-1. Tento efekt je volitelný, ale jeho vyvolání vyžaduje značné soustředění a čas."
      de: "SCP-040 ist in der Lage, lebende Materie zu manipulieren, vorhandene Organismen zu mutieren und zu verändern, um neue zu erschaffen, die kollektiv als SCP-040-1 bezeichnet werden. Dieser Effekt ist willentlich, erfordert jedoch erhebliche Konzentration und Zeit zur Ausführung."
      es: "SCP-040 es capaz de manipular materia viva, mutando y modificando organismos existentes para crear otros nuevos, denominados colectivamente SCP-040-1. Este efecto es voluntario, pero requiere una concentración y un tiempo considerables para llevarlo a cabo."
      fr: "Le SCP-040 est capable de manipuler la matière vivante, en mutant et en modifiant des organismes existants afin d'en créer de nouveaux, collectivement désignés sous le nom de SCP-040-1. Cet effet est volontaire, mais nécessite une concentration et un temps considérables pour être réalisé."
      it: "SCP-040 è in grado di manipolare la materia vivente, mutando e modificando organismi esistenti per crearne di nuovi, collettivamente denominati SCP-040-1. Questo effetto è volontario, ma richiede notevole concentrazione e tempo per essere attuato."
      ko: "SCP-040은 생체 물질을 조작할 수 있는 능력을 지니고 있어, 기존 생물을 변이·개조하여 새로운 생물——총칭하여 SCP-040-1로 불리는——을 만들어낼 수 있다. 이 효과는 임의로 발동할 수 있지만, 실행에는 상당한 집중과 시간이 필요하다."
      pl: "SCP-040 jest w stanie manipulować żywą materią, mutując i modyfikując istniejące organizmy w celu stworzenia nowych, zbiorczo określanych jako SCP-040-1. Efekt ten jest wywoływany dowolnie, lecz wymaga znacznego skupienia i czasu, by go zrealizować."
      pt: "O SCP-040 é capaz de manipular matéria viva, mutando e modificando organismos existentes para criar novos, coletivamente chamados de SCP-040-1. Esse efeito é voluntário, mas requer concentração e tempo significativos para ser realizado."
      th: "SCP-040 มีความสามารถในการควบคุมสสารมีชีวิต กลายพันธุ์และดัดแปลงสิ่งมีชีวิตที่มีอยู่เพื่อสร้างสิ่งมีชีวิตใหม่ ซึ่งเรียกรวมกันว่า SCP-040-1 ผลกระทบนี้เกิดขึ้นได้ตามใจปรารถนา แต่ต้องใช้สมาธิและเวลาอย่างมากในการดำเนินการ"
      uk: "SCP-040 здатне маніпулювати живою матерією, мутуючи та модифікуючи існуючі організми, щоб створювати нові, які колективно називають SCP-040-1. Цей ефект відбувається за бажанням, але потребує значної зосередженості та часу для реалізації."
      vi: "SCP-040 có khả năng thao túng vật chất sống, đột biến và biến đổi các sinh vật hiện có để tạo ra những sinh vật mới, gọi chung là SCP-040-1. Hiệu ứng này có thể được kích hoạt theo ý muốn, nhưng đòi hỏi sự tập trung và thời gian đáng kể để thực hiện."
      zh: "SCP-040能够操纵生命物质，通过使现有生物发生突变和改造来创造新生物，统称为SCP-040-1。这种能力可随意发动，但实施需要相当的专注力和时间。"
      zh_Hant: "SCP-040能夠操縱生命物質，透過使現有生物發生突變和改造來創造新生物，統稱為SCP-040-1。這種能力可隨意發動，但實施需要相當的專注力和時間。"

  - scene: >
      Wide shot, full body, eye level, pulled back to show the whole
      chamber, a very different framing from the tight close focus
      before. scp-040 sits in the middle of the room with all three
      companions around her — scp-040-1a draped over her shoulders like
      a jacket, scp-040-1c floating just above her head, and scp-040-1j
      curled contentedly at her feet.
    characters: [scp-040, scp-040-1a, scp-040-1c, scp-040-1j]
    caption:
      ja: "SCP-040-1a、SCP-040-1c、SCP-040-1jは、対象の精神的な健康を目的として、SCP-040とともに収容室内に留まることが承認されている。"
      en: "SCP-040-1a, SCP-040-1c, and SCP-040-1j have been approved to remain in the containment chamber with SCP-040, for purposes of the subject's mental well-being."
      cs: "SCP-040-1a, SCP-040-1c a SCP-040-1j byly schváleny k tomu, aby zůstaly v kontejnmentové komoře se SCP-040 za účelem duševní pohody subjektu."
      de: "SCP-040-1a, SCP-040-1c und SCP-040-1j wurden genehmigt, zum Wohle des seelischen Wohlbefindens des Subjekts bei SCP-040 in der Containment-Kammer zu verbleiben."
      es: "Se ha aprobado que SCP-040-1a, SCP-040-1c y SCP-040-1j permanezcan en la cámara de contención junto con SCP-040, para el bienestar mental del sujeto."
      fr: "Les SCP-040-1a, SCP-040-1c et SCP-040-1j ont été autorisés à rester dans la chambre de confinement avec le SCP-040, dans un but de bien-être mental du sujet."
      it: "SCP-040-1a, SCP-040-1c e SCP-040-1j sono stati autorizzati a rimanere nella camera di contenimento con SCP-040, ai fini del benessere mentale del soggetto."
      ko: "SCP-040-1a, SCP-040-1c, SCP-040-1j는 대상의 정신적 안녕을 위해 SCP-040과 함께 수용실에 머무는 것이 승인되었다."
      pl: "SCP-040-1a, SCP-040-1c i SCP-040-1j otrzymały zgodę na pozostanie w komorze kontenerowej razem z SCP-040, dla dobra psychicznego samopoczucia osobnika."
      pt: "O SCP-040-1a, o SCP-040-1c e o SCP-040-1j foram aprovados para permanecer na câmara de contenção com o SCP-040, para fins de bem-estar mental do sujeito."
      th: "SCP-040-1a, SCP-040-1c และ SCP-040-1j ได้รับการอนุมัติให้อยู่ในห้องกักกันร่วมกับ SCP-040 เพื่อประโยชน์ด้านสุขภาพจิตของผู้ถูกทดสอบ"
      uk: "SCP-040-1a, SCP-040-1c та SCP-040-1j отримали дозвіл залишатися в камері утримання разом із SCP-040 задля психічного благополуччя суб'єкта."
      vi: "SCP-040-1a, SCP-040-1c, và SCP-040-1j đã được chấp thuận ở lại buồng chứa cùng với SCP-040, vì lợi ích sức khỏe tâm lý của đối tượng."
      zh: "SCP-040-1a、SCP-040-1c和SCP-040-1j已获批准留在收容室内陪伴SCP-040，以维护该对象的心理健康。"
      zh_Hant: "SCP-040-1a、SCP-040-1c和SCP-040-1j已獲批准留在收容室內陪伴SCP-040，以維護該對象的心理健康。"

  - scene: >
      Medium shot, waist-up, eye level, a simple classroom-like setup
      within the chamber, a different framing from the wide group shot
      before. attending-researcher-f sits across a small table from
      scp-040, pointing to an open book between them, scp-040 listening
      attentively with a small, cooperative smile.
    characters: [attending-researcher-f, scp-040]
    caption:
      ja: "SCP-040は毎日の授業と、隔週の心理検査を受けること。対象の知能はその年齢層としてはやや平均以上であり、示す行動は概ね協力的である。"
      en: "SCP-040 is to undergo daily school lessons and bi-weekly psychological review. Subject's intelligence is slightly above-average for its age group, and displayed behavior is generally cooperative."
      cs: "SCP-040 musí absolvovat denní školní lekce a dvoutýdenní psychologické hodnocení. Inteligence subjektu je mírně nadprůměrná pro jeho věkovou skupinu a projevované chování je obecně kooperativní."
      de: "SCP-040 hat täglichen Schulunterricht und eine zweiwöchentliche psychologische Untersuchung zu absolvieren. Die Intelligenz des Subjekts liegt leicht über dem Durchschnitt für seine Altersgruppe, und das gezeigte Verhalten ist im Allgemeinen kooperativ."
      es: "SCP-040 debe recibir clases escolares diarias y una revisión psicológica quincenal. La inteligencia del sujeto está ligeramente por encima del promedio para su grupo de edad, y el comportamiento mostrado es generalmente cooperativo."
      fr: "Le SCP-040 doit suivre des cours quotidiens et un examen psychologique bihebdomadaire. L'intelligence du sujet est légèrement supérieure à la moyenne pour son groupe d'âge, et son comportement est généralement coopératif."
      it: "SCP-040 deve seguire lezioni scolastiche quotidiane e una revisione psicologica bisettimanale. L'intelligenza del soggetto è leggermente superiore alla media per la sua fascia d'età, e il comportamento mostrato è generalmente cooperativo."
      ko: "SCP-040은 매일 학교 수업을 받고 격주로 심리 검토를 받아야 한다. 대상의 지능은 해당 연령대 기준으로 약간 평균 이상이며, 보이는 행동은 대체로 협조적이다."
      pl: "SCP-040 musi codziennie uczestniczyć w lekcjach szkolnych oraz przechodzić dwutygodniowy przegląd psychologiczny. Inteligencja osobnika jest nieco powyżej średniej dla jego grupy wiekowej, a wykazywane zachowanie jest ogólnie współpracujące."
      pt: "O SCP-040 deve receber aulas escolares diárias e revisão psicológica quinzenal. A inteligência do sujeito está ligeiramente acima da média para sua faixa etária, e o comportamento exibido é geralmente cooperativo."
      th: "SCP-040 ต้องเข้าเรียนบทเรียนโรงเรียนทุกวันและรับการทบทวนทางจิตวิทยาทุกสองสัปดาห์ สติปัญญาของผู้ถูกทดสอบสูงกว่าค่าเฉลี่ยเล็กน้อยสำหรับกลุ่มอายุของตน และพฤติกรรมที่แสดงออกโดยทั่วไปให้ความร่วมมือ"
      uk: "SCP-040 повинен щодня проходити шкільні заняття та проходити психологічний огляд раз на два тижні. Інтелект суб'єкта дещо вищий за середній для його вікової групи, а поведінка, яку він демонструє, здебільшого сумлінна."
      vi: "SCP-040 phải trải qua các buổi học hàng ngày và đánh giá tâm lý hai tuần một lần. Trí thông minh của đối tượng cao hơn một chút so với mức trung bình của nhóm tuổi, và hành vi thể hiện nhìn chung là hợp tác."
      zh: "SCP-040须接受每日学业课程及每两周一次的心理评估。该对象的智力略高于同龄人平均水平，表现出的行为总体上是配合的。"
      zh_Hant: "SCP-040須接受每日學業課程及每兩週一次的心理評估。該對象的智力略高於同齡人平均水平，表現出的行為總體上是配合的。"
