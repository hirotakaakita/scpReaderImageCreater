# SCP-040 4コマ台本
# captionはSpecial Containment Procedures / Description本文からの引用。
# Recovery Log（人身売買を示唆する記述）とAddendum-02（辛い生い立ちを示唆する
# 面接記録）・Addendum-03（死体再生実験）は本編に混ぜない。パネル3の
# 3体の仲間の見た目はAddendum-01の記述に基づき描写したが、captionは
# Special Containment Proceduresの一節をそのまま使用した。キャラにセリフは
# 言わせない。JP公式訳が直接取得できなかったため、検証済みの英語本文からの
# 翻訳（ja含む）。

id: scp-040

title:
  en: "SCP-040"
  ja: "SCP-040"
  cs: "SCP-040"
