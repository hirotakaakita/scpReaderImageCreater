# SCP-035 4コマ台本
# captionはSpecial Containment Procedures / Description本文からの引用。
# グロ回避のため、憑依・宿主のミイラ化・自殺教唆といった描写は本編で扱わず、
# 収容・外見(喜劇/悲劇の切替と記録の書き換え)・腐食性の液・魅力的だが操作的な
# 人格の4点に絞る。キャラにセリフは言わせない。液体は様式化して描く。
#
# 4コマ構成: 1=厚いガラスケース＋鋼鉄・鉄・鉛で遮蔽した部屋に保管(起)、
# 2=白磁の喜劇の仮面だが時に悲劇へ変わり、既存の視覚記録もすべて自動で
# 書き換わる(承)、3=目と口の穴から強い腐食性の粘液が絶えず滲み、ガラスが
# 最も遅く反応するため容器に選ばれた(転)、4=極めて知的で愛想がよいが、
# 心理分析では極めて操作的な性質と判明(結)。

