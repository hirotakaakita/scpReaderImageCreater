panels:
  - scene: >
      Close-up, on a steel pedestal inside a reinforced chamber, the
      top half of a human skull etched with faintly glowing runes
      filled with black resin. A boom mic hangs nearby.
      attending-researcher-f peers in through a small reinforced
      window in the hatch-door.
    characters: [attending-researcher-f]
    caption:
      ja: "SCP-077は、ルーン文字が刻まれた人間の頭蓋骨の上半分のように見える。各ルーンには、正体不明の黒い樹脂が詰められている。"
      en: "SCP-077 appears to be the top half of a human skull engraved with runes, each filled with an unidentified black resin."
      cs: "SCP-077 vypadá jako horní polovina lidské lebky pokrytá runami, z nichž každá je vyplněna neidentifikovanou černou pryskyřicí."
      de: "SCP-077 erscheint als obere Hälfte eines menschlichen Schädels, der mit Runen graviert ist, von denen jede mit einem nicht identifizierten schwarzen Harz gefüllt ist."
      es: "SCP-077 parece ser la mitad superior de un cráneo humano grabado con runas, cada una rellena de una resina negra no identificada."
      fr: "Le SCP-077 semble être la moitié supérieure d'un crâne humain gravé de runes, chacune remplie d'une résine noire non identifiée."
      it: "SCP-077 sembra essere la metà superiore di un cranio umano inciso con rune, ciascuna riempita con una resina nera non identificata."
      ko: "SCP-077는 룬 문자가 새겨진 인간 두개골의 윗부분처럼 보이며, 각 룬에는 정체불명의 검은 수지가 채워져 있다."
      pl: "SCP-077 wygląda jak górna połowa ludzkiej czaszki pokryta runami, z których każda wypełniona jest niezidentyfikowaną czarną żywicą."
      pt: "O SCP-077 parece ser a metade superior de um crânio humano gravado com runas, cada uma preenchida com uma resina negra não identificada."
      th: "SCP-077 มีลักษณะเป็นครึ่งบนของกะโหลกศีรษะมนุษย์ที่สลักด้วยอักษรรูน แต่ละตัวเติมด้วยยางไม้สีดำที่ไม่ทราบชนิด"
      uk: "SCP-077 виглядає як верхня половина людського черепа, вкрита рунами, кожна з яких заповнена невідомою чорною смолою."
      vi: "SCP-077 trông giống như nửa trên của một hộp sọ người được khắc các ký tự rune, mỗi ký tự được lấp đầy bằng một loại nhựa đen không xác định."
      zh: "SCP-077外观是一个刻有符文的人类头骨上半部，每个符文中都填充着一种未知的黑色树脂。"
      zh_Hant: "SCP-077外觀是一個刻有符文的人類頭骨上半部，每個符文中都填充著一種未知的黑色樹脂。"

  - scene: >
      Wide shot, full body, showing the whole chamber, a different
      framing from the close-up before. d-class personnel stand close
      to the skull, mouths open, reciting the runes together in unison
      with visible effort. attending-researcher-m watches from the
      doorway with monitoring headphones and a clipboard.
    characters: [d-class, attending-researcher-m]
    caption:
      ja: "8時間ごとに、訓練を受けたD級職員が収容区画に入り、SCP-077に刻まれたルーンを大きく明瞭な声で一斉に読み上げなければならない。"
      en: "Every eight (8) hours, trained D-Class personnel are to enter the containment area and — in a loud, clear voice — read the runes etched onto SCP-077 in unison."
      cs: "Každých osm (8) hodin musí vyškolený personál třídy D vstoupit do kontejnmentu a hlasitě a jasně společně přečíst runy vyryté na SCP-077."
      de: "Alle acht (8) Stunden müssen geschulte D-Klasse-Mitarbeiter den Containment-Bereich betreten und mit lauter, deutlicher Stimme gemeinsam die in SCP-077 eingravierten Runen vorlesen."
      es: "Cada ocho (8) horas, personal de Clase D capacitado debe ingresar al área de contención y, con voz alta y clara, leer al unísono las runas grabadas en el SCP-077."
      fr: "Toutes les huit (8) heures, du personnel de Classe D formé doit entrer dans la zone de confinement et, d'une voix forte et claire, lire à l'unisson les runes gravées sur le SCP-077."
      it: "Ogni otto (8) ore, personale di Classe D addestrato deve entrare nell'area di contenimento e, con voce forte e chiara, leggere all'unisono le rune incise su SCP-077."
      ko: "8시간마다 훈련된 D계급 요원들이 수용구역에 들어가 크고 또렷한 목소리로 SCP-077에 새겨진 룬을 한목소리로 읽어야 한다."
      pl: "Co osiem (8) godzin przeszkolony personel klasy D musi wejść do strefy kontenmentu i głośnym, wyraźnym głosem odczytać chórem runy wyryte na SCP-077."
      pt: "A cada oito (8) horas, pessoal de Classe D treinado deve entrar na área de contenção e, em voz alta e clara, ler em uníssono as runas gravadas no SCP-077."
      th: "ทุกแปด (8) ชั่วโมง เจ้าหน้าที่ระดับ D ที่ผ่านการฝึกอบรมต้องเข้าไปในพื้นที่กักกันและอ่านอักษรรูนที่สลักบน SCP-077 พร้อมกันด้วยเสียงที่ดังและชัดเจน"
      uk: "Кожні вісім (8) годин навчений персонал класу D повинен заходити в зону утримання і гучним, чітким голосом хором читати руни, вирізьблені на SCP-077."
      vi: "Cứ mỗi tám (8) giờ, nhân viên Cấp D đã qua đào tạo phải vào khu vực kiểm soát và đọc to, rõ ràng, đồng thanh các ký tự rune khắc trên SCP-077."
      zh: "每隔八（8）小时，经过训练的D级人员必须进入收容区域，齐声、大声而清晰地朗读刻在SCP-077上的符文。"
      zh_Hant: "每隔八（8）小時，經過訓練的D級人員必須進入收容區域，齊聲、大聲而清晰地朗讀刻在SCP-077上的符文。"

  - scene: >
      Medium shot, waist-up, a different framing from the wide shot
      before. The skull's eye sockets glow and emit luminescent green
      vapor drifting toward a potted plant on a side table; the plant
      instantly collapses into a puddle of dark, viscous ooze.
      attending-researcher-f recoils, checking her wristwatch anxiously.
    characters: [attending-researcher-f]
    caption:
      ja: "この刻印が24時間以内に一度も読み上げられなかった場合、SCP-077は発光する緑色の蒸気を放出する。これに触れた生体物質はすべて即座に粘性のある悪臭を放つ軟泥へと変化する——それはジャガイモ疫病に感染し腐敗したジャガイモの塊茎であると同定されている。"
      en: "If these engravings are not read aloud at least once within a 24-hour period, SCP-077 will emit a luminescent green vapor. All biological material which comes into contact with it is instantly transformed into a viscous, malodorous ooze — identified as rotted potato tubers infected with blight."
      cs: "Pokud tyto rytiny nejsou přečteny nahlas alespoň jednou během 24 hodin, SCP-077 vyzáří světélkující zelenou páru. Veškerý biologický materiál, který s ní přijde do styku, se okamžitě přemění na vazkou, páchnoucí břečku — identifikovanou jako shnilé bramborové hlízy nakažené plísní bramborovou."
      de: "Werden diese Gravuren nicht innerhalb von 24 Stunden mindestens einmal laut vorgelesen, sondert SCP-077 einen leuchtend grünen Dampf ab. Jegliches biologisches Material, das damit in Kontakt kommt, wird sofort in eine zähflüssige, übelriechende Masse verwandelt — identifiziert als verfaulte Kartoffelknollen, befallen von der Kartoffelfäule."
      es: "Si estas inscripciones no se leen en voz alta al menos una vez dentro de un período de 24 horas, el SCP-077 emitirá un vapor verde luminiscente. Todo material biológico que entre en contacto con él se transforma instantáneamente en una sustancia viscosa y maloliente, identificada como tubérculos de patata podridos infectados con tizón."
      fr: "Si ces gravures ne sont pas lues à voix haute au moins une fois dans un délai de 24 heures, le SCP-077 émettra une vapeur verte luminescente. Toute matière biologique entrant en contact avec elle se transforme instantanément en une substance visqueuse et malodorante, identifiée comme des tubercules de pomme de terre pourris infectés par le mildiou."
      it: "Se queste incisioni non vengono lette ad alta voce almeno una volta entro 24 ore, SCP-077 emetterà un vapore verde luminescente. Qualsiasi materiale biologico che entri in contatto con esso viene istantaneamente trasformato in una melma viscosa e maleodorante, identificata come tuberi di patata marci infetti dalla peronospora."
      ko: "이 각인이 24시간 이내에 한 번도 소리 내어 읽히지 않으면, SCP-077은 발광하는 녹색 증기를 방출한다. 이와 접촉한 모든 생체 물질은 즉시 점성의 악취 나는 슬러지로 변하는데, 이는 역병에 감염되어 썩은 감자 덩이줄기로 확인되었다."
      pl: "Jeśli te ryciny nie zostaną odczytane na głos przynajmniej raz w ciągu 24 godzin, SCP-077 wyemituje świecącą zieloną parę. Cały materiał biologiczny mający z nią kontakt natychmiast zamienia się w lepką, cuchnącą maź — zidentyfikowaną jako zgniłe bulwy ziemniaka zarażone zarazą ziemniaczaną."
      pt: "Se essas gravações não forem lidas em voz alta pelo menos uma vez em um período de 24 horas, o SCP-077 emitirá um vapor verde luminescente. Todo material biológico que entra em contato com ele é instantaneamente transformado em uma gosma viscosa e malcheirosa — identificada como tubérculos de batata podres infectados com requeima."
      th: "หากจารึกเหล่านี้ไม่ได้ถูกอ่านออกเสียงอย่างน้อยหนึ่งครั้งภายในยี่สิบสี่ชั่วโมง SCP-077 จะปล่อยไอระเหยสีเขียวเรืองแสงออกมา สสารชีวภาพใดๆ ที่สัมผัสกับไอนี้จะเปลี่ยนเป็นเมือกข้นเหนียวมีกลิ่นเหม็นในทันที ซึ่งระบุว่าเป็นหัวมันฝรั่งเน่าที่ติดเชื้อราใบไหม้"
      uk: "Якщо ці різьблення не читають вголос принаймні раз протягом 24 годин, SCP-077 виділяє світний зелений пар. Будь-який біологічний матеріал, що з ним контактує, миттєво перетворюється на в'язку смердючу слизь — ідентифіковану як гнилі бульби картоплі, уражені фітофторозом."
      vi: "Nếu những khắc chữ này không được đọc to ít nhất một lần trong khoảng thời gian 24 giờ, SCP-077 sẽ phát ra hơi khí xanh phát quang. Mọi vật chất sinh học tiếp xúc với nó sẽ ngay lập tức biến thành một chất nhầy nhớt, có mùi hôi — được xác định là củ khoai tây thối rữa bị nhiễm bệnh mốc sương."
      zh: "若这些刻文在24小时内没有被大声朗读至少一次，SCP-077便会释放出发光的绿色蒸气。任何接触到该蒸气的生物物质都会瞬间转变为一种粘稠、恶臭的黏液——经鉴定为感染晚疫病而腐烂的马铃薯块茎。"
      zh_Hant: "若這些刻文在24小時內沒有被大聲朗讀至少一次，SCP-077便會釋放出發光的綠色蒸氣。任何接觸到該蒸氣的生物物質都會瞬間轉變為一種黏稠、惡臭的黏液——經鑑定為感染晚疫病而腐爛的馬鈴薯塊莖。"

  - scene: >
      Wide shot, low angle, a different framing from the medium shot
      before, at the Research Sector-861 cafeteria serving line. A
      large hand-painted sign reading "NO POTATOES" hangs above the
      counter. d-class personnel wait in line looking miserable, one
      scratching a faint rash on their arm.
    characters: [d-class]
    caption:
      ja: "SCP-077の刻印を読むことは、読み上げた者の健康に目に見える影響を及ぼし、吐き気・痙攣・発疹などを引き起こす。読み手はジャガイモアレルギーを発症する確率が60％ある。研究セクター861の食堂メニューには、ジャガイモおよびジャガイモを原料とする食材を一切含めてはならない。"
      en: "Reading SCP-077's engravings has noticeable effects on readers' health, including nausea, cramps, and skin rashes; readers have a 60% chance of developing an allergy to potatoes. The cafeteria menu for Research Sector-861 must not include any potatoes or potato-based ingredients."
      cs: "Čtení rytin SCP-077 má znatelné účinky na zdraví čtenářů, včetně nevolnosti, křečí a kožních vyrážek; čtenáři mají 60% šanci na vznik alergie na brambory. Jídelníček jídelny výzkumného sektoru 861 nesmí obsahovat brambory ani bramborové přísady."
      de: "Das Vorlesen der Gravuren von SCP-077 hat spürbare Auswirkungen auf die Gesundheit der Vorleser, darunter Übelkeit, Krämpfe und Hautausschläge; Vorleser haben eine 60%ige Wahrscheinlichkeit, eine Kartoffelallergie zu entwickeln. Der Kantinenspeiseplan von Forschungssektor 861 darf keine Kartoffeln oder Kartoffelprodukte enthalten."
      es: "Leer las inscripciones del SCP-077 tiene efectos notables en la salud de los lectores, incluyendo náuseas, calambres y erupciones cutáneas; los lectores tienen un 60% de probabilidad de desarrollar alergia a las patatas. El menú del comedor del Sector de Investigación 861 no debe incluir patatas ni ingredientes derivados de la patata."
      fr: "La lecture des gravures du SCP-077 a des effets notables sur la santé des lecteurs, notamment des nausées, des crampes et des éruptions cutanées ; les lecteurs ont 60 % de chances de développer une allergie aux pommes de terre. Le menu de la cantine du Secteur de Recherche 861 ne doit inclure aucune pomme de terre ni ingrédient à base de pomme de terre."
      it: "La lettura delle incisioni di SCP-077 ha effetti evidenti sulla salute dei lettori, tra cui nausea, crampi ed eruzioni cutanee; i lettori hanno il 60% di probabilità di sviluppare un'allergia alle patate. Il menu della mensa del Settore di Ricerca 861 non deve includere patate o ingredienti a base di patate."
      ko: "SCP-077의 각인을 읽는 행위는 낭독자의 건강에 눈에 띄는 영향을 미치며, 구역질, 경련, 피부 발진 등을 포함한다. 낭독자는 60%의 확률로 감자 알레르기가 생긴다. 연구구역 861의 식당 메뉴에는 감자나 감자를 원료로 한 재료를 일절 포함해서는 안 된다."
      pl: "Czytanie rycin SCP-077 wywiera zauważalny wpływ na zdrowie czytających, w tym nudności, skurcze i wysypki skórne; czytający mają 60% szans na rozwinięcie alergii na ziemniaki. Menu stołówki Sektora Badawczego 861 nie może zawierać ziemniaków ani składników na bazie ziemniaków."
      pt: "A leitura das gravações do SCP-077 tem efeitos perceptíveis na saúde dos leitores, incluindo náusea, cãibras e erupções cutâneas; os leitores têm 60% de chance de desenvolver alergia a batatas. O cardápio do refeitório do Setor de Pesquisa 861 não deve incluir batatas ou ingredientes à base de batata."
      th: "การอ่านจารึกของ SCP-077 ส่งผลกระทบที่สังเกตได้ต่อสุขภาพของผู้อ่าน รวมถึงอาการคลื่นไส้ ตะคริว และผื่นผิวหนัง ผู้อ่านมีโอกาส 60% ที่จะเกิดอาการแพ้มันฝรั่ง เมนูอาหารของโรงอาหารในเขตวิจัย 861 ต้องไม่มีมันฝรั่งหรือส่วนผสมที่ทำจากมันฝรั่ง"
      uk: "Читання гравіювань SCP-077 має помітний вплив на здоров'я читачів, включно з нудотою, судомами та шкірними висипаннями; читачі мають 60% шанс розвинути алергію на картоплю. Меню їдальні дослідницького сектора 861 не повинно містити картоплю чи інгредієнти на основі картоплі."
      vi: "Việc đọc các khắc chữ của SCP-077 gây ra những ảnh hưởng đáng chú ý đến sức khỏe của người đọc, bao gồm buồn nôn, chuột rút và phát ban da; người đọc có 60% khả năng phát triển dị ứng với khoai tây. Thực đơn căng-tin của Khu Nghiên cứu 861 không được có khoai tây hoặc thành phần từ khoai tây."
      zh: "朗读SCP-077上的刻文会对朗读者的健康产生明显影响，包括恶心、抽搐和皮疹；朗读者有60%的概率会对马铃薯产生过敏。研究第861区食堂的菜单中不得包含任何马铃薯或马铃薯制成的食材。"
      zh_Hant: "朗讀SCP-077上的刻文會對朗讀者的健康產生明顯影響，包括噁心、抽搐和皮疹；朗讀者有60%的機率會對馬鈴薯產生過敏。研究第861區食堂的菜單中不得包含任何馬鈴薯或馬鈴薯製成的食材。"
