characters: [attending-researcher-f, attending-researcher-m]

panels:
  - scene: >
      Wide shot, full body, eye level, showing a weathered, gnarled
      apple tree standing alone in an overgrown, abandoned farm field,
      warm autumn light. attending-researcher-f approaches cautiously,
      clipboard in hand, examining a branch that is oddly sprouting
      something that is clearly not an apple.
    characters: [attending-researcher-f]
    caption:
      ja: "SCP-038はニューヨーク州の放棄された農場で発見された。当初はごく普通のリンゴの木だと思われていた。しかし、詳しく調べると、SCP-038がリンゴ以外のものも育てていることが明らかになった。"
      en: "SCP-038 was found on an abandoned farm in New York. It was at first thought to be a common apple tree. However, upon closer inspection, it became apparent that SCP-038 was growing things other than apples."
      cs: "SCP-038 bylo nalezeno na opuštěné farmě ve státě New York. Zpočátku se předpokládalo, že jde o obyčejnou jabloň. Po bližším zkoumání však vyšlo najevo, že SCP-038 pěstuje i jiné věci než jablka."
      de: "SCP-038 wurde auf einer verlassenen Farm in New York gefunden. Zunächst wurde angenommen, es handle sich um einen gewöhnlichen Apfelbaum. Bei näherer Untersuchung wurde jedoch deutlich, dass SCP-038 auch andere Dinge als Äpfel wachsen ließ."
      es: "SCP-038 fue encontrado en una granja abandonada en Nueva York. Al principio se pensó que era un manzano común. Sin embargo, tras una inspección más detallada, resultó evidente que SCP-038 estaba haciendo crecer cosas distintas a manzanas."
      fr: "Le SCP-038 a été découvert dans une ferme abandonnée à New York. On a d'abord pensé qu'il s'agissait d'un simple pommier. Cependant, après un examen plus approfondi, il est apparu que le SCP-038 faisait pousser autre chose que des pommes."
      it: "SCP-038 fu trovato in una fattoria abbandonata a New York. Inizialmente si pensava fosse un comune melo. Tuttavia, dopo un'ispezione più attenta, divenne evidente che SCP-038 stava facendo crescere altre cose oltre alle mele."
      ko: "SCP-038는 뉴욕의 버려진 농장에서 발견되었다. 처음에는 평범한 사과나무로 여겨졌다. 그러나 자세히 조사한 결과, SCP-038이 사과 외의 다른 것들도 자라게 하고 있다는 사실이 드러났다."
      pl: "SCP-038 znaleziono na opuszczonej farmie w stanie Nowy Jork. Początkowo sądzono, że jest to zwykła jabłoń. Jednak przy bliższym oglądzie okazało się, że SCP-038 wyhodowuje rzeczy inne niż jabłka."
      pt: "O SCP-038 foi encontrado em uma fazenda abandonada em Nova York. Inicialmente pensou-se que fosse uma macieira comum. No entanto, após uma inspeção mais detalhada, ficou evidente que o SCP-038 estava cultivando coisas além de maçãs."
      th: "SCP-038 ถูกพบในฟาร์มร้างแห่งหนึ่งในนิวยอร์ก ในตอนแรกเข้าใจว่าเป็นต้นแอปเปิลธรรมดา แต่เมื่อตรวจสอบอย่างใกล้ชิด กลับพบว่า SCP-038 กำลังปลูกสิ่งอื่นที่ไม่ใช่แอปเปิล"
      uk: "SCP-038 знайшли на покинутій фермі в штаті Нью-Йорк. Спочатку вважали, що це звичайна яблуня. Однак при уважнішому огляді стало очевидно, що SCP-038 вирощує не лише яблука."
      vi: "SCP-038 được tìm thấy tại một nông trại bỏ hoang ở New York. Ban đầu người ta nghĩ đây chỉ là một cây táo bình thường. Tuy nhiên, sau khi xem xét kỹ hơn, rõ ràng SCP-038 đang mọc ra những thứ khác ngoài táo."
      zh: "SCP-038是在纽约州一处废弃农场被发现的。起初人们以为它只是一棵普通的苹果树。然而经过仔细检查后发现，SCP-038长出的东西并不只是苹果。"
      zh_Hant: "SCP-038是在紐約州一處廢棄農場被發現的。起初人們以為它只是一棵普通的蘋果樹。然而經過仔細檢查後發現，SCP-038長出的東西並不只是蘋果。"

  - scene: >
      Close-up, filling most of the frame, a very different framing from
      the wide establishing shot, on a single spot on the tree's bark
      where a burst of rapid growth is visibly forming — a small object
      mid-formation, still translucent and soft like new bark, rapidly
      taking shape. attending-researcher-m watches from just behind,
      eyes wide, stopwatch in hand timing it.
    characters: [attending-researcher-m]
    caption:
      ja: "SCP-038は、その樹皮に触れたあらゆる物体を複製する能力を持つ。物体はほぼ即座に成長を始め、数分のうちに成熟する。"
      en: "SCP-038 has the ability to clone any object that touches its bark. Objects begin growing almost instantaneously and reach maturity within a matter of minutes."
      cs: "SCP-038 má schopnost klonovat jakýkoli předmět, který se dotkne jeho kůry. Předměty začnou růst téměř okamžitě a dosáhnou zralosti během několika minut."
      de: "SCP-038 besitzt die Fähigkeit, jedes Objekt zu klonen, das seine Rinde berührt. Objekte beginnen fast augenblicklich zu wachsen und erreichen innerhalb weniger Minuten ihre Reife."
      es: "SCP-038 tiene la capacidad de clonar cualquier objeto que toque su corteza. Los objetos comienzan a crecer casi instantáneamente y alcanzan la madurez en cuestión de minutos."
      fr: "Le SCP-038 a la capacité de cloner tout objet qui touche son écorce. Les objets commencent à pousser presque instantanément et atteignent leur maturité en quelques minutes."
      it: "SCP-038 ha la capacità di clonare qualsiasi oggetto che tocchi la sua corteccia. Gli oggetti iniziano a crescere quasi istantaneamente e raggiungono la maturità in pochi minuti."
      ko: "SCP-038은 자신의 나무껍질에 닿은 모든 물체를 복제하는 능력을 가지고 있다. 물체는 거의 즉시 자라기 시작하여 몇 분 안에 성숙에 이른다."
      pl: "SCP-038 ma zdolność klonowania każdego przedmiotu, który dotknie jego kory. Przedmioty zaczynają rosnąć niemal natychmiast i osiągają dojrzałość w ciągu kilku minut."
      pt: "O SCP-038 tem a capacidade de clonar qualquer objeto que toque em sua casca. Os objetos começam a crescer quase instantaneamente e atingem a maturidade em questão de minutos."
      th: "SCP-038 มีความสามารถในการโคลนวัตถุใดๆ ที่สัมผัสกับเปลือกของมัน วัตถุจะเริ่มเติบโตเกือบจะทันทีและเจริญเติบโตเต็มที่ภายในไม่กี่นาที"
      uk: "SCP-038 має здатність клонувати будь-який предмет, що торкається його кори. Предмети починають рости майже миттєво і досягають зрілості протягом кількох хвилин."
      vi: "SCP-038 có khả năng nhân bản bất kỳ vật thể nào chạm vào vỏ cây của nó. Các vật thể bắt đầu phát triển gần như ngay lập tức và đạt đến độ trưởng thành chỉ trong vài phút."
      zh: "SCP-038具有复制任何触碰其树皮的物体的能力。物体几乎会立即开始生长，并在数分钟内发育成熟。"
      zh_Hant: "SCP-038具有複製任何觸碰其樹皮的物體的能力。物體幾乎會立即開始生長，並在數分鐘內發育成熟。"

  - scene: >
      Wide shot, full body, eye level, pulled back to show the whole
      tree draped with an absurd assortment of cloned objects hanging
      from its branches like fruit — a toaster, a laptop, bunches of
      candy bars, a stack of DVDs, a wine bottle, alongside actual
      apples and watermelons. attending-researcher-f and
      attending-researcher-m stand beneath it, staring up in bemused
      disbelief.
    characters: [attending-researcher-f, attending-researcher-m]
    caption:
      ja: "SCP-038がこれまでに複製した物体には、リンゴ、オレンジ、スイカ、ナス、チョコレートバー、テレビ、トースター、ノートパソコン、椅子、ワイン、DVD、CDなどが含まれる。"
      en: "Objects that SCP-038 has cloned include apples, oranges, watermelons, eggplants, candy bars, televisions, toasters, laptops, chairs, wine, DVDs, and CDs."
      cs: "Mezi předměty, které SCP-038 naklonovalo, patří jablka, pomeranče, melouny, lilky, čokoládové tyčinky, televizory, topinkovače, notebooky, židle, víno, DVD a CD."
      de: "Zu den von SCP-038 geklonten Objekten zählen Äpfel, Orangen, Wassermelonen, Auberginen, Schokoriegel, Fernseher, Toaster, Laptops, Stühle, Wein, DVDs und CDs."
      es: "Entre los objetos que SCP-038 ha clonado se incluyen manzanas, naranjas, sandías, berenjenas, barras de chocolate, televisores, tostadoras, portátiles, sillas, vino, DVD y CD."
      fr: "Parmi les objets que le SCP-038 a clonés figurent des pommes, des oranges, des pastèques, des aubergines, des barres chocolatées, des téléviseurs, des grille-pain, des ordinateurs portables, des chaises, du vin, des DVD et des CD."
      it: "Tra gli oggetti che SCP-038 ha clonato figurano mele, arance, angurie, melanzane, barrette di cioccolato, televisori, tostapane, laptop, sedie, vino, DVD e CD."
      ko: "SCP-038이 복제한 물체에는 사과, 오렌지, 수박, 가지, 초콜릿바, 텔레비전, 토스터, 노트북, 의자, 와인, DVD, CD 등이 포함된다."
      pl: "Wśród przedmiotów, które sklonowało SCP-038, znajdują się jabłka, pomarańcze, arbuzy, bakłażany, batoniki, telewizory, tostery, laptopy, krzesła, wino, płyty DVD i CD."
      pt: "Entre os objetos que o SCP-038 clonou estão maçãs, laranjas, melancias, berinjelas, barras de chocolate, televisores, torradeiras, laptops, cadeiras, vinho, DVDs e CDs."
      th: "วัตถุที่ SCP-038 เคยโคลนไปแล้วมีทั้งแอปเปิล ส้ม แตงโม มะเขือม่วง ช็อกโกแลตบาร์ โทรทัศน์ เครื่องปิ้งขนมปัง แล็ปท็อป เก้าอี้ ไวน์ ดีวีดี และซีดี"
      uk: "Серед предметів, які клонував SCP-038, — яблука, апельсини, кавуни, баклажани, шоколадні батончики, телевізори, тостери, ноутбуки, стільці, вино, DVD та CD."
      vi: "Các vật thể mà SCP-038 đã nhân bản bao gồm táo, cam, dưa hấu, cà tím, thanh kẹo, tivi, máy nướng bánh mì, laptop, ghế, rượu vang, đĩa DVD và CD."
      zh: "SCP-038曾复制过的物品包括苹果、橙子、西瓜、茄子、巧克力棒、电视机、烤面包机、笔记本电脑、椅子、葡萄酒、DVD和CD。"
      zh_Hant: "SCP-038曾複製過的物品包括蘋果、橙子、西瓜、茄子、巧克力棒、電視機、烤麵包機、筆記型電腦、椅子、葡萄酒、DVD和CD。"

  - scene: >
      Medium shot, waist-up, low angle, a different framing from the
      wide shot before. attending-researcher-m, fully suited in a bulky
      hazmat suit, carefully adjusts an overhead misting nozzle above
      the tree with a long extension tool, keeping his whole body well
      clear of the trunk.
    characters: [attending-researcher-m]
    caption:
      ja: "SCP-038は、頭上のミスト散布装置により1日2回散水すること。手作業で散水を行う担当者、および整備を行う職員は、不慮の複製を防ぐため防護服を着用すること。"
      en: "SCP-038 is to be watered twice per day via overhead mister. Attendants watering it by hand and maintenance personnel should wear hazmat suits to prevent accidental cloning."
      cs: "SCP-038 musí být zaléváno dvakrát denně pomocí zavěšeného zvlhčovače. Pracovníci zalévající je ručně a údržbáři by měli nosit ochranné obleky, aby se zabránilo náhodnému klonování."
      de: "SCP-038 ist zweimal täglich über einen Sprühnebel von oben zu bewässern. Personal, das es von Hand bewässert, sowie Wartungspersonal sollten Schutzanzüge tragen, um versehentliches Klonen zu verhindern."
      es: "SCP-038 debe regarse dos veces al día mediante un nebulizador superior. El personal que lo riegue a mano y el personal de mantenimiento deben usar trajes de materiales peligrosos para evitar una clonación accidental."
      fr: "Le SCP-038 doit être arrosé deux fois par jour à l'aide d'un brumisateur suspendu. Le personnel qui l'arrose à la main et le personnel de maintenance doivent porter des combinaisons de protection pour éviter tout clonage accidentel."
      it: "SCP-038 deve essere annaffiato due volte al giorno tramite un nebulizzatore sospeso. Il personale che lo annaffia manualmente e il personale addetto alla manutenzione devono indossare tute protettive per evitare clonazioni accidentali."
      ko: "SCP-038은 상부 미스트 분무 장치를 통해 하루 두 번 물을 주어야 한다. 손으로 물을 주는 담당자와 정비 직원은 우발적인 복제를 방지하기 위해 방호복을 착용해야 한다."
      pl: "SCP-038 należy podlewać dwa razy dziennie za pomocą zamgławiacza sufitowego. Personel podlewający je ręcznie oraz pracownicy konserwacji powinni nosić kombinezony ochronne, aby zapobiec przypadkowemu klonowaniu."
      pt: "O SCP-038 deve ser regado duas vezes ao dia por meio de um nebulizador suspenso. Os funcionários que o regarem manualmente e o pessoal de manutenção devem usar trajes de proteção para evitar clonagem acidental."
      th: "SCP-038 ต้องได้รับการรดน้ำวันละสองครั้งผ่านเครื่องพ่นละอองน้ำเหนือศีรษะ เจ้าหน้าที่ที่รดน้ำด้วยมือและเจ้าหน้าที่ซ่อมบำรุงควรสวมชุดป้องกันสารเคมีเพื่อป้องกันการโคลนโดยไม่ตั้งใจ"
      uk: "SCP-038 слід поливати двічі на день за допомогою верхнього зволожувача. Персонал, що поливає його вручну, і обслуговуючий персонал повинні носити захисні костюми, щоб запобігти випадковому клонуванню."
      vi: "SCP-038 phải được tưới nước hai lần mỗi ngày qua hệ thống phun sương trên cao. Nhân viên tưới nước bằng tay và nhân viên bảo trì nên mặc đồ bảo hộ để tránh nhân bản ngoài ý muốn."
      zh: "SCP-038须每天透过头顶喷雾装置浇水两次。以手动浇水的人员及维护人员应穿戴防护服，以避免意外复制。"
      zh_Hant: "SCP-038須每天透過頭頂噴霧裝置澆水兩次。以手動澆水的人員及維護人員應穿戴防護服，以避免意外複製。"

addendum:
  ja: "メモ：全職員に改めて申し上げる。SCP-038はおもちゃでは——繰り返す、おもちゃではない。車の鍵、映画、音楽、自動販売機の商品の複製に使用しないこと。——クライン博士"
  en: "Memo: I would like to remind all personnel that SCP-038 is not, I repeat, NOT a toy. It should not be used for cloning car keys, movies, music, or items from the vending machines. — Dr. Klein"
  cs: "Poznámka: Chtěl bych všem pracovníkům připomenout, že SCP-038 není, opakuji, NENÍ hračka. Nemělo by se používat ke klonování klíčů od auta, filmů, hudby nebo věcí z prodejních automatů. — Dr. Klein"
  de: "Notiz: Ich möchte das gesamte Personal daran erinnern, dass SCP-038 kein, ich wiederhole, KEIN Spielzeug ist. Es sollte nicht zum Klonen von Autoschlüsseln, Filmen, Musik oder Artikeln aus Verkaufsautomaten verwendet werden. — Dr. Klein"
  es: "Memorándum: Quisiera recordar a todo el personal que SCP-038 no es, repito, NO es un juguete. No debe usarse para clonar llaves de auto, películas, música o artículos de las máquinas expendedoras. — Dr. Klein"
  fr: "Note : Je tiens à rappeler à tout le personnel que le SCP-038 n'est pas, je répète, N'EST PAS un jouet. Il ne doit pas être utilisé pour cloner des clés de voiture, des films, de la musique ou des articles des distributeurs automatiques. — Dr Klein"
  it: "Nota: Vorrei ricordare a tutto il personale che SCP-038 non è, ripeto, NON è un giocattolo. Non deve essere utilizzato per clonare chiavi d'auto, film, musica o articoli dei distributori automatici. — Dott. Klein"
  ko: "메모: 전 직원에게 다시 한번 상기시키고자 한다. SCP-038은 장난감이 아니다, 다시 말한다, 장난감이 아니다. 자동차 열쇠, 영화, 음악, 자판기 물품을 복제하는 데 사용해서는 안 된다. — 클라인 박사"
  pl: "Notatka: Chciałbym przypomnieć wszystkim pracownikom, że SCP-038 nie jest, powtarzam, NIE JEST zabawką. Nie należy go używać do klonowania kluczyków samochodowych, filmów, muzyki ani przedmiotów z automatów sprzedających. — Dr Klein"
  pt: "Memorando: Gostaria de lembrar a todo o pessoal que o SCP-038 não é, repito, NÃO é um brinquedo. Não deve ser usado para clonar chaves de carro, filmes, música ou itens de máquinas de venda automática. — Dr. Klein"
  th: "บันทึก: ผมขอเตือนเจ้าหน้าที่ทุกคนว่า SCP-038 ไม่ใช่ ขอย้ำ ไม่ใช่ ของเล่น ห้ามใช้มันเพื่อโคลนกุญแจรถ ภาพยนตร์ เพลง หรือสิ่งของจากเครื่องขายอัตโนมัติ — ดร.ไคลน์"
  uk: "Записка: Хочу нагадати всьому персоналу, що SCP-038 не є, повторюю, НЕ Є іграшкою. Його не слід використовувати для клонування автомобільних ключів, фільмів, музики чи товарів з торгових автоматів. — Д-р Клейн"
  vi: "Ghi chú: Tôi muốn nhắc nhở toàn thể nhân viên rằng SCP-038 không phải, tôi nhắc lại, KHÔNG PHẢI là đồ chơi. Không được sử dụng nó để nhân bản chìa khóa xe, phim, nhạc, hoặc đồ vật từ máy bán hàng tự động. — Tiến sĩ Klein"
  zh: "备忘录：我想提醒全体人员，SCP-038不是——我再说一遍——不是玩具。不得用它来复制车钥匙、电影、音乐或自动售货机中的物品。——克莱因博士"
  zh_Hant: "備忘錄：我想提醒全體人員，SCP-038不是——我再說一遍——不是玩具。不得用它來複製車鑰匙、電影、音樂或自動販賣機中的物品。——克萊因博士"
