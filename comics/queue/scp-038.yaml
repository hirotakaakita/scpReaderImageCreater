# SCP-038 4コマ台本
# captionはSpecial Containment Procedures / Description本文からの引用。
# 人間・動物の複製とその急速な老化・発酵死という記述はグロ回避のため
# 本編に含めず、無生物の複製という愉快な側面のみを題材にした。
# Addendumのクライン博士のメモのみaddendumの一言として使用。
# キャラにセリフは言わせない。JP公式訳が直接取得できなかったため、検証済みの
# 英語本文からの翻訳（ja含む）。

