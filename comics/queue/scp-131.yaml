# SCP-131「アイポッド」4コマ台本
# キャラにセリフは言わせない。captionは記事本文からの引用。

id: scp-131

title:
  en: "SCP-131: The Eye Pods"
  ja: "SCP-131：アイポッド"
  cs: "SCP-131: Oční kapsle"
  de: "SCP-131: Die Augenkapseln"
  es: "SCP-131: Las Vainas de Ojos"
  fr: "SCP-131 : Les Œilcosses"
  it: "SCP-131: I Baccelli Oculari"
  ko: "SCP-131: 아이 포드"
  pl: "SCP-131: Kapsuły Oczne"
  pt: "SCP-131: As Cápsulas Oculares"
  th: "SCP-131: ฝักลูกตา"
  uk: "SCP-131: Оковані Стручки"
  vi: "SCP-131: Những Quả Mắt Nhỏ"
  zh: "SCP-131：眼球荚"
  zh_Hant: "SCP-131：眼球莢"

attribution:
  article: "SCP-131"
  author: "Lt Masipag"
  source_url: "http://scp-wiki.wikidot.com/scp-131"
  license: "CC BY-SA 3.0"

object_class: Safe

characters: [researcher-hana]

panels:
  - scene: >
      Low angle close-up shot, camera near floor level looking up toward
      the desk. Dr. Hana works quietly at her desk in the background when
      two small teardrop-shaped creatures roll into frame on tiny wheels
      at their base, filling the foreground, each with one large
      unblinking eye in the center of its body, one burnt orange and one
      mustard yellow.
    characters: [researcher-hana]
    caption:
      ja: "SCP-131-Aと131-Bは体高約30cmの涙滴状の個体で、中央に一つの目を持ち、基部の車輪機構で移動する。"
      en: "SCP-131-A and SCP-131-B are a pair of teardrop-shaped creatures roughly 30 cm in height, with a single eye in the middle of their bodies, moving via a wheel mechanism at their base."
      cs: "SCP-131-A a SCP-131-B jsou dvojice tvorů ve tvaru slzy vysokých zhruba 30 cm, s jedním okem uprostřed těla, pohybujících se pomocí kolového mechanismu na základně."
      de: "SCP-131-A und SCP-131-B sind ein Paar tropfenförmiger Wesen von etwa 30 cm Höhe, mit einem einzelnen Auge in der Körpermitte, die sich mittels eines Radmechanismus an ihrer Basis fortbewegen."
      es: "SCP-131-A y SCP-131-B son un par de criaturas con forma de lágrima de aproximadamente 30 cm de altura, con un único ojo en el centro de su cuerpo, que se desplazan mediante un mecanismo de rueda en su base."
      fr: "SCP-131-A et SCP-131-B forment une paire de créatures en forme de larme d'environ 30 cm de haut, dotées d'un œil unique au centre de leur corps, se déplaçant grâce à un mécanisme à roue à leur base."
      it: "SCP-131-A e SCP-131-B sono una coppia di creature a forma di lacrima alte circa 30 cm, con un unico occhio al centro del corpo, che si muovono tramite un meccanismo a ruota alla base."
      ko: "SCP-131-A와 SCP-131-B는 높이 약 30cm의 눈물방울 형태 개체 한 쌍으로, 몸 중앙에 하나의 눈이 있으며 기저부의 바퀴 기구로 이동한다."
      pl: "SCP-131-A i SCP-131-B to para stworzeń w kształcie łzy o wysokości około 30 cm, z pojedynczym okiem pośrodku ciała, poruszających się za pomocą mechanizmu kołowego u podstawy."
      pt: "SCP-131-A e SCP-131-B são um par de criaturas em forma de lágrima com cerca de 30 cm de altura, com um único olho no centro do corpo, movendo-se por meio de um mecanismo de roda na base."
      th: "SCP-131-A และ SCP-131-B คือคู่สิ่งมีชีวิตรูปทรงหยดน้ำสูงประมาณ 30 ซม. มีตาเดียวอยู่ตรงกลางลำตัว เคลื่อนที่ด้วยกลไกคล้ายล้อที่ฐาน"
      uk: "SCP-131-A та SCP-131-B — пара краплеподібних істот заввишки близько 30 см з одним оком у центрі тіла, що пересуваються за допомогою колісного механізму в основі."
      vi: "SCP-131-A và SCP-131-B là một cặp sinh vật hình giọt nước cao khoảng 30 cm, có một con mắt duy nhất ở giữa cơ thể, di chuyển bằng cơ chế bánh xe ở đáy."
      zh: "SCP-131-A与SCP-131-B是一对高约30厘米的泪滴状生物，身体中央有一只眼睛，靠基部的车轮机构移动。"
      zh_Hant: "SCP-131-A與SCP-131-B是一對高約30公分的淚滴狀生物，身體中央有一隻眼睛，靠基部的車輪機構移動。"

  - scene: >
      Wide shot, full body, high angle looking down over the whole
      office, dynamic diagonal composition with motion lines. The two
      eye-pod creatures zoom across the office at high speed on their
      wheels, weaving between desk legs and knocking a stack of papers
      flying into the air. Dr. Hana throws her hands up in surprise as
      papers scatter around her.
    characters: [researcher-hana]
    caption:
      ja: "SCP-131の知能はイエネコと同程度である。"
      en: "SCP-131 has the same intelligence as a house cat."
      cs: "SCP-131 má inteligenci srovnatelnou s domácí kočkou."
      de: "SCP-131 besitzt die gleiche Intelligenz wie eine Hauskatze."
      es: "SCP-131 tiene la misma inteligencia que un gato doméstico."
      fr: "SCP-131 possède la même intelligence qu'un chat domestique."
      it: "SCP-131 ha la stessa intelligenza di un gatto domestico."
      ko: "SCP-131의 지능은 집고양이와 동등한 수준이다."
      pl: "SCP-131 ma taką samą inteligencję jak kot domowy."
      pt: "SCP-131 tem a mesma inteligência de um gato doméstico."
      th: "SCP-131 มีสติปัญญาเทียบเท่ากับแมวบ้าน"
      uk: "SCP-131 має такий самий інтелект, як домашній кіт."
      vi: "SCP-131 có trí thông minh tương đương với một con mèo nhà."
      zh: "SCP-131的智力与家猫相当。"
      zh_Hant: "SCP-131的智力與家貓相當。"

  - scene: >
      Close-up shot centered tightly on the low ventilation grate,
      filling most of the frame, the two eye-pod creatures' round eyes
      vanishing one after another into the dark opening. Dr. Hana's
      reaching hand and kneeling shoulder are visible at the frame's
      edge, papers still scattered on the floor behind her.
    characters: [researcher-hana]
    caption:
      ja: "両個体は、制限区域への侵入や施設からの脱出を試みない限り、自由に移動することが許可されている。"
      en: "SCP-131-A and SCP-131-B are free to travel about the site, so long as they do not attempt to enter any restricted areas or leave the facility."
      cs: "SCP-131-A a SCP-131-B se mohou volně pohybovat po areálu, pokud se nepokoušejí vstoupit do jakýchkoli vyhrazených oblastí nebo opustit zařízení."
      de: "SCP-131-A und SCP-131-B dürfen sich frei auf dem Gelände bewegen, solange sie nicht versuchen, Sperrbereiche zu betreten oder die Einrichtung zu verlassen."
      es: "SCP-131-A y SCP-131-B tienen libertad para desplazarse por el sitio, siempre que no intenten entrar en zonas restringidas ni abandonar las instalaciones."
      fr: "SCP-131-A et SCP-131-B sont libres de circuler dans le site, tant qu'ils ne tentent pas d'entrer dans des zones à accès restreint ou de quitter l'installation."
      it: "SCP-131-A e SCP-131-B sono liberi di muoversi nel sito, purché non tentino di entrare in aree riservate o di lasciare la struttura."
      ko: "SCP-131-A와 SCP-131-B는 제한 구역에 진입하거나 시설을 벗어나려 하지 않는 한, 부지 내를 자유롭게 이동할 수 있다."
      pl: "SCP-131-A i SCP-131-B mogą swobodnie poruszać się po terenie placówki, o ile nie próbują wejść do stref zastrzeżonych ani jej opuścić."
      pt: "SCP-131-A e SCP-131-B têm liberdade para circular pelo local, desde que não tentem entrar em áreas restritas nem deixar as instalações."
      th: "SCP-131-A และ SCP-131-B มีอิสระในการเดินทางไปทั่วไซต์ ตราบใดที่ไม่พยายามเข้าพื้นที่หวงห้ามหรือออกจากสถานที่"
      uk: "SCP-131-A та SCP-131-B можуть вільно пересуватися об'єктом, доки не намагаються потрапити в зони обмеженого доступу чи залишити об'єкт."
      vi: "SCP-131-A và SCP-131-B được tự do di chuyển trong khu vực, miễn là chúng không cố gắng vào các khu vực hạn chế hoặc rời khỏi cơ sở."
      zh: "只要不试图进入限制区域或离开设施，SCP-131-A与SCP-131-B可自由在场所内活动。"
      zh_Hant: "只要不試圖進入限制區域或離開設施，SCP-131-A與SCP-131-B可自由在場所內活動。"

  - scene: >
      Wide shot, full body, eye level, pulled back to show the whole
      office floor. Dr. Hana sits slumped amid scattered papers in front
      of the empty ventilation grate, holding an empty coffee mug upside
      down with a tired, exasperated expression.
    characters: [researcher-hana]
    caption:
      ja: "両個体の所在は1時間ごとに確認されるものとし、この確認が取れない場合はレベル1封鎖態勢が発令される。"
      en: "Hourly tabs are to be kept on the subjects at all times; failure to account for their presence constitutes a level one lockdown situation."
      cs: "O subjektech musí být vedeny hodinové záznamy; nedostatečné doložení jejich přítomnosti představuje situaci s uzamčením úrovně jedna."
      de: "Über die Subjekte sind stündlich Aufzeichnungen zu führen; kann ihre Anwesenheit nicht nachgewiesen werden, gilt dies als Lockdown-Situation Stufe eins."
      es: "Se deben mantener registros horarios de los sujetos en todo momento; no dar cuenta de su presencia constituye una situación de bloqueo de nivel uno."
      fr: "Un pointage horaire des sujets doit être maintenu en permanence ; l'impossibilité de rendre compte de leur présence constitue une situation de confinement de niveau un."
      it: "I soggetti devono essere monitorati ogni ora in ogni momento; la mancata verifica della loro presenza costituisce una situazione di blocco di livello uno."
      ko: "대상들의 소재는 항상 매시간 확인되어야 하며, 소재를 확인하지 못할 경우 레벨 1 봉쇄 상황으로 간주된다."
      pl: "Obecność obiektów musi być sprawdzana co godzinę; brak potwierdzenia ich obecności oznacza sytuację blokady poziomu pierwszego."
      pt: "Registros horários dos sujeitos devem ser mantidos o tempo todo; a falha em confirmar sua presença constitui uma situação de bloqueio de nível um."
      th: "ต้องมีการตรวจสอบตำแหน่งของวัตถุทุกชั่วโมงตลอดเวลา หากไม่สามารถยืนยันการมีอยู่ได้ ถือเป็นสถานการณ์ล็อกดาวน์ระดับหนึ่ง"
      uk: "Місцезнаходження суб'єктів має перевірятися щогодини; неможливість підтвердити їхню присутність означає ситуацію блокування рівня один."
      vi: "Phải theo dõi vị trí của các đối tượng theo từng giờ; việc không xác định được sự hiện diện của chúng đồng nghĩa với tình trạng phong tỏa cấp một."
      zh: "须每小时对两个个体的位置进行核实；若无法确认其所在，即构成一级封锁状态。"
      zh_Hant: "須每小時對兩個個體的位置進行核實；若無法確認其所在，即構成一級封鎖狀態。"

addendum:
  ja: "補遺131-1：本個体は職員に対し愛着を形成する傾向があるため、過度な接触は推奨されない。"
  en: "Addendum 131-1: The subjects have shown a tendency to form attachments to personnel, and excessive contact is discouraged."
  cs: "Dodatek 131-1: Subjekty vykazují tendenci vytvářet si vazby k personálu, a nadměrný kontakt se proto nedoporučuje."
  de: "Anhang 131-1: Die Subjekte zeigen die Tendenz, Bindungen zum Personal aufzubauen; übermäßiger Kontakt wird daher nicht empfohlen."
  es: "Adenda 131-1: Los sujetos han mostrado tendencia a formar vínculos con el personal, por lo que se desaconseja el contacto excesivo."
  fr: "Addendum 131-1 : Les sujets ont montré une tendance à s'attacher au personnel, un contact excessif est donc déconseillé."
  it: "Addendum 131-1: I soggetti hanno mostrato la tendenza a legarsi al personale, pertanto un contatto eccessivo è sconsigliato."
  ko: "부록 131-1: 개체들은 직원에게 애착을 형성하는 경향을 보였으므로, 과도한 접촉은 권장되지 않는다."
  pl: "Aneks 131-1: Obiekty wykazują tendencję do przywiązywania się do personelu, dlatego nadmierny kontakt jest odradzany."
  pt: "Adendo 131-1: Os sujeitos demonstraram tendência a criar vínculos com a equipe, portanto o contato excessivo não é recomendado."
  th: "ภาคผนวก 131-1: วัตถุมีแนวโน้มที่จะผูกพันกับเจ้าหน้าที่ จึงไม่แนะนำให้มีการสัมผัสมากเกินไป"
  uk: "Додаток 131-1: Суб'єкти виявляють схильність прив'язуватися до персоналу, тому надмірний контакт не рекомендований."
  vi: "Phụ lục 131-1: Các đối tượng có xu hướng gắn bó với nhân viên, do đó không khuyến khích tiếp xúc quá mức."
  zh: "补遗131-1：该个体表现出对工作人员产生依恋的倾向，因此不建议过度接触。"
  zh_Hant: "補遺131-1：該個體表現出對工作人員產生依戀的傾向，因此不建議過度接觸。"
