# SCP-093「紅海の円盤」4コマ台本
# captionは記事本文（Special Containment Procedures / Description）からの引用。
# 「オリジナル文書」やSCP-093-T1/T2等の実験記録・付随文書は本編に混ぜない。
# キャラにセリフは言わせない。

id: scp-093

title:
  en: "SCP-093: Red Sea Object"
  ja: "SCP-093：紅海の円盤"
  cs: "SCP-093: Objekt z Rudého moře"
  de: "SCP-093: Objekt aus dem Roten Meer"
  es: "SCP-093: Objeto del Mar Rojo"
  fr: "SCP-093 : Objet de la mer Rouge"
  it: "SCP-093: Oggetto del Mar Rosso"
  ko: "SCP-093: 홍해의 물체"
  pl: "SCP-093: Obiekt z Morza Czerwonego"
  pt: "SCP-093: Objeto do Mar Vermelho"
  th: "SCP-093: วัตถุแห่งทะเลแดง"
  uk: "SCP-093: Об'єкт з Червоного моря"
  vi: "SCP-093: Vật Thể Biển Đỏ"
  zh: "SCP-093：红海物体"
  zh_Hant: "SCP-093：紅海物體"

attribution:
  article: "SCP-093"
  source_url: "http://scp-wiki.wikidot.com/scp-093"
  license: "CC BY-SA 3.0"

object_class: Euclid

local_characters:
  scp-093:
    name: SCP-093
    description: >
      SCP-093, a small red disc (color RGB 150,35,30) carved from a stone
      composite resembling cinnabar, 7.62 cm in diameter, with fine
      circular engravings and unfamiliar symbols carved into its surface at
      shallow depth, smooth and rounded enough to fit comfortably in a
      palm.

characters: [attending-researcher-f, scp-093]

panels:
  - scene: >
      Wide shot, full body, eye level, showing a whole plain containment
      room. At the center of the frame, SCP-093 rests flat on a mirror set
      into a low pedestal. A video camera is mounted in the corner of the
      room. On the right side of the frame, the attending researcher
      watches through a viewing window, clipboard in hand.
    characters: [scp-093, attending-researcher-f]
    caption:
      ja: "SCP-093は常に鏡の上に置かれ、映像監視下に置かれなければならない。SCP-093の収容区域への立ち入りは、適切な映像記録および対象回収の手順が整った場合にのみ許可される。"
      en: "SCP-093 must remain on a mirror at all times and under video surveillance. Admittance into the area of SCP-093's containment must be authorized only with proper video recording and subject retrieval procedures in place."
      cs: "SCP-093 musí neustále zůstávat na zrcadle a pod video dohledem. Vstup do oblasti zadržení SCP-093 smí být povolen pouze při zajištění řádného video záznamu a postupů pro navrácení subjektu."
      de: "SCP-093 muss sich jederzeit auf einem Spiegel befinden und unter Videoüberwachung stehen. Der Zutritt zum Containment-Bereich von SCP-093 darf nur autorisiert werden, wenn ordnungsgemäße Videoaufzeichnung und Verfahren zur Bergung von Testpersonen vorhanden sind."
      es: "SCP-093 debe permanecer sobre un espejo en todo momento y bajo vigilancia por vídeo. El acceso al área de contención de SCP-093 solo debe autorizarse con los procedimientos adecuados de grabación de vídeo y recuperación del sujeto en vigor."
      fr: "SCP-093 doit rester en permanence sur un miroir et sous surveillance vidéo. L'accès à la zone de confinement de SCP-093 ne doit être autorisé qu'avec un enregistrement vidéo adéquat et des procédures de récupération du sujet en place."
      it: "SCP-093 deve rimanere sempre su uno specchio e sotto sorveglianza video. L'ammissione nell'area di contenimento di SCP-093 deve essere autorizzata solo con adeguate procedure di registrazione video e recupero del soggetto in atto."
      ko: "SCP-093은 항상 거울 위에 있어야 하며 영상 감시 하에 두어야 한다. SCP-093 수용 구역에 대한 출입은 적절한 영상 기록 및 대상 회수 절차가 마련된 경우에만 승인되어야 한다."
      pl: "SCP-093 musi zawsze pozostawać na lustrze i pod nadzorem wideo. Dostęp do strefy przetrzymywania SCP-093 może zostać autoryzowany wyłącznie po wdrożeniu odpowiednich procedur nagrywania wideo i odzyskiwania osobnika."
      pt: "O SCP-093 deve permanecer sobre um espelho o tempo todo e sob vigilância por vídeo. O acesso à área de contenção do SCP-093 só deve ser autorizado com procedimentos adequados de gravação em vídeo e recuperação do sujeito em vigor."
      th: "SCP-093 ต้องอยู่บนกระจกตลอดเวลาและอยู่ภายใต้การเฝ้าระวังด้วยวิดีโอ การเข้าไปในพื้นที่กักกันของ SCP-093 ต้องได้รับอนุญาตเฉพาะเมื่อมีขั้นตอนการบันทึกวิดีโอและการนำตัวผู้เข้าทดสอบกลับคืนที่เหมาะสมเท่านั้น"
      uk: "SCP-093 повинен постійно перебувати на дзеркалі та під відеоспостереженням. Доступ до зони утримання SCP-093 має бути дозволений лише за наявності належного відеозапису та процедур повернення суб'єкта."
      vi: "SCP-093 phải luôn được đặt trên gương và dưới sự giám sát bằng video. Việc ra vào khu vực chứa SCP-093 chỉ được phép khi có quy trình ghi hình và thu hồi đối tượng phù hợp."
      zh: "SCP-093必须始终放置在镜子上，并处于视频监控之下。只有在具备适当的视频记录与对象回收程序的情况下，才可授权进入SCP-093的收容区域。"
      zh_Hant: "SCP-093必須始終放置在鏡子上，並處於視訊監控之下。只有在具備適當的視訊記錄與對象回收程序的情況下，才可授權進入SCP-093的收容區域。"

  - scene: >
      Medium shot, close on the hands, eye level. On the right side of the
      frame, the attending researcher's gloved hand holds SCP-093 up
      before her, a faint colored glow beginning to bleed across its
      carved surface. On the left side of the frame, her other hand hovers
      near a notepad, ready to record the change.
    characters: [attending-researcher-f, scp-093]
    caption:
      ja: "SCP-093は円形の刻印と未知の記号が全体に彫り込まれた、辰砂に似た石材から削り出された赤みを帯びた円盤である。生きた人間が保持すると色相が変化する。この変化は保持者が抱える後悔と関連していると考えられている。"
      en: "SCP-093 is a primarily red disc carved from a stone composite resembling cinnabar, with circular engravings and unknown symbols carved around the entire object. SCP-093 will change hue when held by a living individual. Current belief holds that the changes depend upon regrets carried by the holder."
      cs: "SCP-093 je primárně červený disk vyřezaný z kamenného kompozitu připomínajícího rumělku, po celém povrchu předmětu jsou vyryty kruhové rytiny a neznámé symboly. SCP-093 mění odstín, když ho drží živá osoba. Současný předpoklad je, že tyto změny závisí na lítostech, které nositel v sobě nese."
      de: "SCP-093 ist eine überwiegend rote Scheibe, geschnitzt aus einem an Zinnober erinnernden Steinkomposit, mit kreisförmigen Gravuren und unbekannten Symbolen, die über das gesamte Objekt eingeschnitzt sind. SCP-093 ändert seine Farbe, wenn es von einer lebenden Person gehalten wird. Man geht derzeit davon aus, dass die Veränderungen von den Bedauern abhängen, die der Halter in sich trägt."
      es: "SCP-093 es un disco principalmente rojo tallado en un compuesto pétreo que se asemeja al cinabrio, con grabados circulares y símbolos desconocidos tallados alrededor de todo el objeto. SCP-093 cambia de tono cuando lo sostiene un individuo vivo. Se cree actualmente que los cambios dependen de los remordimientos que carga quien lo sostiene."
      fr: "SCP-093 est un disque principalement rouge sculpté dans un composite rocheux ressemblant au cinabre, avec des gravures circulaires et des symboles inconnus gravés sur tout l'objet. SCP-093 change de teinte lorsqu'il est tenu par un individu vivant. On pense actuellement que ces changements dépendent des regrets portés par la personne qui le tient."
      it: "SCP-093 è un disco prevalentemente rosso intagliato da un composito roccioso simile al cinabro, con incisioni circolari e simboli sconosciuti intagliati su tutto l'oggetto. SCP-093 cambia tonalità quando viene tenuto in mano da un individuo vivente. Si ritiene attualmente che i cambiamenti dipendano dai rimpianti portati da chi lo tiene."
      ko: "SCP-093은 주사(진사)와 유사한 돌 복합재로 조각된 주로 붉은색 원반으로, 물체 전체에 원형 문양과 알 수 없는 기호가 새겨져 있다. SCP-093은 살아있는 개체가 손에 쥐면 색조가 변한다. 현재는 이 변화가 소지자가 지닌 후회와 관련 있다고 여겨진다."
      pl: "SCP-093 to głównie czerwony dysk wyrzeźbiony z kompozytu skalnego przypominającego cynober, z okrągłymi grawerunkami i nieznanymi symbolami wyrytymi na całym obiekcie. SCP-093 zmienia barwę, gdy trzyma go żywa osoba. Obecnie przypuszcza się, że zmiany zależą od żalów noszonych przez trzymającego."
      pt: "O SCP-093 é um disco predominantemente vermelho, esculpido em um composto rochoso semelhante ao cinábrio, com gravuras circulares e símbolos desconhecidos entalhados por todo o objeto. O SCP-093 muda de tonalidade quando segurado por um indivíduo vivo. Acredita-se atualmente que as mudanças dependem dos arrependimentos carregados por quem o segura."
      th: "SCP-093 เป็นแผ่นจานสีแดงเป็นหลัก แกะสลักจากวัสดุหินคล้ายชาด มีลวดลายวงกลมและสัญลักษณ์ที่ไม่ทราบความหมายแกะสลักอยู่รอบวัตถุทั้งหมด SCP-093 จะเปลี่ยนเฉดสีเมื่อถูกถือโดยสิ่งมีชีวิต ความเชื่อในปัจจุบันคือการเปลี่ยนแปลงนี้ขึ้นอยู่กับความเสียใจที่ผู้ถือแบกรับอยู่"
      uk: "SCP-093 — це переважно червоний диск, вирізьблений з кам'яного композиту, схожого на кіновар, із круговими гравіюваннями та невідомими символами, вирізьбленими по всій поверхні об'єкта. SCP-093 змінює відтінок, коли його тримає жива особа. Наразі вважається, що зміни залежать від жалю, який носить у собі власник."
      vi: "SCP-093 là một đĩa chủ yếu màu đỏ được chạm khắc từ hợp chất đá giống chu sa, với các hoa văn hình tròn và các ký hiệu không rõ được khắc quanh toàn bộ vật thể. SCP-093 sẽ đổi màu khi được một cá nhân còn sống cầm giữ. Hiện có giả thuyết cho rằng sự thay đổi này phụ thuộc vào những hối tiếc mà người cầm giữ mang trong lòng."
      zh: "SCP-093是一个主要呈红色的圆盘，由类似朱砂的石质复合材料雕刻而成，整个物体周围刻有圆形纹路和未知符号。当被活人握持时，SCP-093会改变色调。目前认为这种变化取决于持有者心中所背负的悔恨。"
      zh_Hant: "SCP-093是一個主要呈紅色的圓盤，由類似朱砂的石質複合材料雕刻而成，整個物體周圍刻有圓形紋路和未知符號。當被活人握持時，SCP-093會改變色調。目前認為這種變化取決於持有者心中所背負的悔恨。"

  - scene: >
      Close-up shot, dynamic and low angle. SCP-093, having just slipped
      free of the researcher's open hand a split second ago, is already a
      blurred red streak spinning across the floor, tracing the largest
      possible circle at tremendous speed. On the right side of the
      frame, it is caught mid-impact punching straight through a wooden
      crate, splinters exploding outward, as the attending researcher
      recoils on the left side of the frame, her hand still open where it
      just was, arm raised to shield her face.
    characters: [scp-093, attending-researcher-f]
    caption:
      ja: "鏡から取り除かれ、誰にも持たれていない場合、SCP-093は最も近い鏡状の表面を探し求める。可能な限り最大の円を描いて転がりながら驚異的な速度を得る。障害物がある場合は、その勢いのまま突き破って進路を進む。"
      en: "If SCP-093 is removed from a mirror and not held by a person, it will seek out the nearest mirror-like surface, traveling in the largest possible circle while rolling and building up phenomenal speed. If an obstacle is between SCP-093 and the nearest mirror-like surface, it will use this momentum to punch through the obstacle."
      cs: "Pokud je SCP-093 odstraněno ze zrcadla a nikdo je nedrží, vyhledá nejbližší zrcadlový povrch, přičemž se pohybuje po co největším možném kruhu, kutálí se a nabírá ohromující rychlost. Nachází-li se mezi SCP-093 a nejbližším zrcadlovým povrchem překážka, využije této hybnosti k jejímu proražení."
      de: "Wird SCP-093 von einem Spiegel entfernt und von niemandem gehalten, sucht es die nächstgelegene spiegelähnliche Oberfläche auf, wobei es sich auf dem größtmöglichen Kreis bewegt, rollt und dabei phänomenale Geschwindigkeit aufbaut. Befindet sich ein Hindernis zwischen SCP-093 und der nächstgelegenen spiegelähnlichen Oberfläche, nutzt es diesen Schwung, um das Hindernis zu durchschlagen."
      es: "Si SCP-093 se retira de un espejo y nadie lo sostiene, buscará la superficie similar a un espejo más cercana, recorriendo el círculo más grande posible mientras rueda y alcanza una velocidad fenomenal. Si hay un obstáculo entre SCP-093 y la superficie especular más cercana, usará ese impulso para atravesarlo."
      fr: "Si SCP-093 est retiré d'un miroir et n'est tenu par personne, il recherchera la surface réfléchissante la plus proche, en parcourant le plus grand cercle possible tout en roulant et en atteignant une vitesse phénoménale. Si un obstacle se trouve entre SCP-093 et la surface réfléchissante la plus proche, il utilisera cet élan pour le traverser."
      it: "Se SCP-093 viene rimosso da uno specchio e non viene tenuto da nessuno, cercherà la superficie speculare più vicina, percorrendo il cerchio più ampio possibile mentre rotola e accumula una velocità fenomenale. Se un ostacolo si trova tra SCP-093 e la superficie speculare più vicina, userà questo slancio per attraversarlo."
      ko: "SCP-093이 거울에서 제거되고 아무도 붙잡지 않으면, 가장 가까운 거울과 같은 표면을 찾아 나선다. 구를 수 있는 한 가장 큰 원을 그리며 경이로운 속도를 낸다. SCP-093과 가장 가까운 거울면 사이에 장애물이 있으면, 이 운동량을 이용해 장애물을 뚫고 나아간다."
      pl: "Jeśli SCP-093 zostanie zabrane z lustra i nie jest trzymane przez nikogo, będzie poszukiwać najbliższej powierzchni przypominającej lustro, poruszając się po możliwie największym okręgu podczas toczenia i nabierając niesamowitej prędkości. Jeśli między SCP-093 a najbliższą powierzchnią lustrzaną znajduje się przeszkoda, wykorzysta ten pęd, aby ją przebić."
      pt: "Se o SCP-093 for removido de um espelho e não estiver sendo segurado por ninguém, ele buscará a superfície semelhante a um espelho mais próxima, percorrendo o maior círculo possível enquanto rola e ganha velocidade fenomenal. Se houver um obstáculo entre o SCP-093 e a superfície espelhada mais próxima, ele usará esse impulso para atravessá-lo."
      th: "หาก SCP-093 ถูกนำออกจากกระจกและไม่มีใครถือมันไว้ มันจะค้นหาพื้นผิวคล้ายกระจกที่ใกล้ที่สุด โดยเคลื่อนที่เป็นวงกลมที่ใหญ่ที่สุดเท่าที่จะเป็นไปได้ พร้อมกลิ้งและสะสมความเร็วอย่างมหาศาล หากมีสิ่งกีดขวางอยู่ระหว่าง SCP-093 กับพื้นผิวคล้ายกระจกที่ใกล้ที่สุด มันจะใช้แรงส่งนี้พุ่งทะลุสิ่งกีดขวางนั้น"
      uk: "Якщо SCP-093 забрати з дзеркала і ніхто його не тримає, він шукатиме найближчу дзеркалоподібну поверхню, рухаючись по найбільшому можливому колу, котячись і набираючи феноменальну швидкість. Якщо між SCP-093 і найближчою дзеркальною поверхнею є перешкода, він використає цей імпульс, щоб пробити її."
      vi: "Nếu SCP-093 bị lấy ra khỏi gương và không ai cầm giữ, nó sẽ tìm kiếm bề mặt giống gương gần nhất, di chuyển theo vòng tròn lớn nhất có thể trong khi lăn và đạt tốc độ kinh ngạc. Nếu có chướng ngại vật giữa SCP-093 và bề mặt giống gương gần nhất, nó sẽ dùng đà này để xuyên thủng chướng ngại vật."
      zh: "如果SCP-093被从镜子上移开且无人握持，它会寻找最近的镜面状表面，滚动着画出尽可能大的圆圈，并积累惊人的速度。若SCP-093与最近的镜面状表面之间存在障碍物，它会利用这股冲力将障碍物撞穿。"
      zh_Hant: "如果SCP-093被從鏡子上移開且無人握持，它會尋找最近的鏡面狀表面，滾動著畫出盡可能大的圓圈，並積累驚人的速度。若SCP-093與最近的鏡面狀表面之間存在障礙物，它會利用這股衝力將障礙物撞穿。"

  - scene: >
      Wide shot, full body, eye level, pulled back to show the whole room
      — the same pedestal mirror from the first panel visible at the
      center of the frame. Splintered wreckage of the crate lies scattered
      across the floor leading up to it. SCP-093 sits perfectly still and
      unmarked on the pedestal mirror's surface, exactly where it stopped.
      On the right side of the frame, the attending researcher crouches
      beside it, running a finger along its undamaged edge, brow furrowed
      in disbelief.
    characters: [scp-093, attending-researcher-f]
    caption:
      ja: "凄まじい衝撃速度にもかかわらず、SCP-093にも鏡にも損傷は一切生じない。対象は鏡状の表面に接触すると停止する。"
      en: "Despite tremendous impact velocities, no damage will be dealt to SCP-093 or the mirror. It will only stop when a mirror-like surface is contacted."
      cs: "Navzdory obrovským nárazovým rychlostem nedojde k žádnému poškození SCP-093 ani zrcadla. Zastaví se pouze při kontaktu se zrcadlovým povrchem."
      de: "Trotz enormer Aufprallgeschwindigkeiten wird weder SCP-093 noch der Spiegel beschädigt. Es kommt erst zum Stillstand, wenn es eine spiegelähnliche Oberfläche berührt."
      es: "A pesar de las velocidades de impacto tremendas, no se produce ningún daño en SCP-093 ni en el espejo. Solo se detendrá al entrar en contacto con una superficie similar a un espejo."
      fr: "Malgré des vitesses d'impact considérables, aucun dommage n'est infligé à SCP-093 ni au miroir. Il ne s'arrêtera qu'au contact d'une surface réfléchissante."
      it: "Nonostante le velocità d'impatto tremende, non viene arrecato alcun danno né a SCP-093 né allo specchio. Si fermerà solo al contatto con una superficie speculare."
      ko: "엄청난 충돌 속도에도 불구하고 SCP-093이나 거울에는 어떠한 손상도 발생하지 않는다. 대상은 거울과 같은 표면에 닿아야만 멈춘다."
      pl: "Pomimo ogromnych prędkości uderzenia, SCP-093 ani lustro nie doznają żadnych uszkodzeń. Zatrzyma się dopiero po zetknięciu z powierzchnią przypominającą lustro."
      pt: "Apesar das velocidades de impacto tremendas, nenhum dano é causado ao SCP-093 ou ao espelho. Ele só para ao entrar em contato com uma superfície espelhada."
      th: "แม้จะมีความเร็วในการปะทะที่รุนแรงมหาศาล แต่ SCP-093 หรือกระจกจะไม่ได้รับความเสียหายใดๆ เลย มันจะหยุดก็ต่อเมื่อสัมผัสกับพื้นผิวคล้ายกระจกเท่านั้น"
      uk: "Попри величезні швидкості удару, ні SCP-093, ні дзеркало не зазнають жодних пошкоджень. Він зупиниться лише при контакті з дзеркальною поверхнею."
      vi: "Bất chấp tốc độ va chạm khủng khiếp, không có bất kỳ hư hại nào xảy ra với SCP-093 hoặc tấm gương. Nó chỉ dừng lại khi chạm vào một bề mặt giống gương."
      zh: "尽管撞击速度极高，SCP-093和镜子都不会受到任何损伤。它只有在接触到镜面状表面时才会停下。"
      zh_Hant: "儘管撞擊速度極高，SCP-093和鏡子都不會受到任何損傷。它只有在接觸到鏡面狀表面時才會停下。"
