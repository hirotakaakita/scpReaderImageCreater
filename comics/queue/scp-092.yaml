panels:
  - scene: >
      Wide shot, full body, showing the whole soundproof testing room.
      A CD sits in a player on a table; d-class sits alone in a chair
      nearby, headphones on, a wall clock visible. attending-researcher-m
      watches through a reinforced observation window outside.
    characters: [d-class, attending-researcher-m]
    caption:
      ja: "SCP-092は、3125枚の音楽CDからなる一式である。各個体は再生されると、可聴範囲内にいる全員に対して固有の異常効果をもたらし、それは74分間続く。その間、聴取者は可聴範囲から出ることも、CDの再生を中断することもできない。現象が終わると、生存している聴取者全員が声を揃えて「わあ、超クールだった」というフレーズを発する。"
      en: "SCP-092 is a set of 3125 audio CDs. Each instance, when played, produces a distinct anomalous effect upon everyone within hearing range, lasting 74 minutes, during which listeners are unable to leave hearing range or interrupt the CD. When the phenomenon ends, all surviving listeners engage in synchronized vocalization of the phrase 'Wow, that was real cool.'"
      cs: "SCP-092 je sada 3125 hudebních CD. Každá instance při přehrání vyvolá u všech osob v doslechu odlišný anomální efekt trvající 74 minut, během nichž posluchači nemohou opustit doslech ani přerušit přehrávání CD. Po skončení jevu všichni přeživší posluchači synchronně pronesou frázi „Wow, to bylo fakt super“."
      de: "SCP-092 ist ein Satz von 3125 Audio-CDs. Jede Instanz erzeugt beim Abspielen einen eigenständigen anomalen Effekt bei allen Personen in Hörweite, der 74 Minuten andauert; währenddessen können Zuhörer die Hörweite nicht verlassen oder die CD unterbrechen. Wenn das Phänomen endet, sprechen alle überlebenden Zuhörer synchron den Satz „Wow, das war echt cool“."
      es: "SCP-092 es un conjunto de 3125 CD de audio. Cada instancia, al reproducirse, produce un efecto anómalo distinto en todos los que están al alcance del oído, con una duración de 74 minutos, durante los cuales los oyentes no pueden alejarse del alcance auditivo ni interrumpir el CD. Cuando el fenómeno termina, todos los oyentes supervivientes pronuncian de forma sincronizada la frase 'Vaya, eso fue genial'."
      fr: "Le SCP-092 est un ensemble de 3125 CD audio. Chaque instance, lorsqu'elle est jouée, produit un effet anomal distinct sur toute personne à portée d'écoute, durant 74 minutes, pendant lesquelles les auditeurs sont incapables de quitter la portée d'écoute ou d'interrompre le CD. Lorsque le phénomène se termine, tous les auditeurs survivants prononcent de façon synchronisée la phrase « Waouh, c'était vraiment cool »."
      it: "SCP-092 è un insieme di 3125 CD audio. Ogni istanza, se riprodotta, produce un distinto effetto anomalo su chiunque sia a portata d'ascolto, della durata di 74 minuti, durante i quali gli ascoltatori non possono allontanarsi né interrompere il CD. Quando il fenomeno termina, tutti gli ascoltatori sopravvissuti pronunciano in modo sincronizzato la frase 'Wow, è stato davvero fico'."
      ko: "SCP-092는 3125장의 오디오 CD 세트이다. 각 개체는 재생되면 청취 범위 내의 모든 사람에게 74분간 지속되는 고유한 이상 현상을 일으키며, 그동안 청취자는 청취 범위를 벗어나거나 CD를 멈출 수 없다. 현상이 끝나면 생존한 청취자 전원이 일제히 '와, 진짜 멋졌어'라는 문구를 발성한다."
      pl: "SCP-092 to zestaw 3125 płyt CD audio. Każdy egzemplarz, gdy jest odtwarzany, wywołuje odrębny anomalny efekt u wszystkich w zasięgu słuchu, trwający 74 minuty, podczas których słuchacze nie mogą opuścić zasięgu słuchu ani przerwać odtwarzania płyty. Gdy zjawisko się kończy, wszyscy ocaleni słuchacze wypowiadają zsynchronizowanie frazę „Wow, to było naprawdę super”."
      pt: "O SCP-092 é um conjunto de 3125 CDs de áudio. Cada instância, quando reproduzida, produz um efeito anômalo distinto em todos que estejam ao alcance da audição, durando 74 minutos, durante os quais os ouvintes são incapazes de sair do alcance da audição ou interromper o CD. Quando o fenômeno termina, todos os ouvintes sobreviventes pronunciam de forma sincronizada a frase 'Uau, isso foi muito legal'."
      th: "SCP-092 คือชุดซีดีเพลง 3,125 แผ่น แต่ละแผ่นเมื่อถูกเล่นจะก่อให้เกิดผลกระทบผิดปกติที่แตกต่างกันแก่ทุกคนที่อยู่ในระยะได้ยิน โดยกินเวลานาน 74 นาที ในระหว่างนั้นผู้ฟังจะไม่สามารถออกจากระยะได้ยินหรือขัดจังหวะซีดีได้ เมื่อปรากฏการณ์สิ้นสุดลง ผู้ฟังที่รอดชีวิตทั้งหมดจะเปล่งวลี 'ว้าว มันเจ๋งมากจริงๆ' พร้อมกัน"
      uk: "SCP-092 — це набір із 3125 аудіодисків. Кожен екземпляр під час відтворення викликає окремий аномальний ефект у всіх, хто перебуває в зоні чутності, тривалістю 74 хвилини, протягом яких слухачі не можуть покинути зону чутності або перервати відтворення диска. Коли явище завершується, усі слухачі, що вижили, синхронно вимовляють фразу «Вау, це було справді круто»."
      vi: "SCP-092 là một bộ gồm 3125 đĩa CD nhạc. Mỗi phiên bản, khi được phát, sẽ tạo ra một hiệu ứng dị thường riêng biệt lên tất cả mọi người trong tầm nghe, kéo dài 74 phút, trong thời gian đó người nghe không thể rời khỏi tầm nghe hoặc dừng đĩa CD. Khi hiện tượng kết thúc, tất cả người nghe còn sống sẽ đồng thanh phát ra câu 'Chà, thật là ngầu'."
      zh: "SCP-092是一套共3125张音乐CD。每张唱片播放时都会对听觉范围内的所有人产生独特的异常效应，持续74分钟——在此期间，听者无法离开可听范围，也无法中断CD播放。异常现象结束后，所有幸存的听者会同步齐声说出「哇，真的太酷了」这句话。"
      zh_Hant: "SCP-092是一套共3125張音樂CD。每張唱片播放時都會對聽覺範圍內的所有人產生獨特的異常效應，持續74分鐘——在此期間，聽者無法離開可聽範圍，也無法中斷CD播放。異常現象結束後，所有倖存的聽者會同步齊聲說出「哇，真的太酷了」這句話。"

  - scene: >
      Close-up on d-class's face, a different framing from the wide
      shot before, eyes wide as they perceive five overlapping ghostly
      copies of a bouncing ball tossed by attending-researcher-f nearby,
      a comic multiple-exposure visual effect around the moving object.
    characters: [d-class]
    caption:
      ja: "SCP-092-028——聴取者は、動く物体すべてに対して五重視を経験する。"
      en: "SCP-092-028: Listeners experience quintuple vision for all moving objects."
      cs: "SCP-092-028: Posluchači zažívají pětinásobné vidění všech pohybujících se objektů."
      de: "SCP-092-028: Zuhörer erleben ein fünffaches Sehen aller sich bewegenden Objekte."
      es: "SCP-092-028: Los oyentes experimentan visión quíntuple de todos los objetos en movimiento."
      fr: "SCP-092-028 : Les auditeurs font l'expérience d'une vision quintuple pour tous les objets en mouvement."
      it: "SCP-092-028: Gli ascoltatori sperimentano una visione quintupla per tutti gli oggetti in movimento."
      ko: "SCP-092-028: 청취자는 움직이는 모든 물체에 대해 5중 시야를 경험한다."
      pl: "SCP-092-028: Słuchacze doświadczają pięciokrotnego widzenia wszystkich poruszających się obiektów."
      pt: "SCP-092-028: Os ouvintes experimentam visão quíntupla de todos os objetos em movimento."
      th: "SCP-092-028: ผู้ฟังจะเห็นภาพซ้อนห้าชั้นของวัตถุที่เคลื่อนไหวทุกชิ้น"
      uk: "SCP-092-028: Слухачі відчувають п'ятикратне бачення всіх рухомих об'єктів."
      vi: "SCP-092-028: Người nghe trải qua hiện tượng nhìn thấy năm hình ảnh chồng lên nhau đối với mọi vật thể đang chuyển động."
      zh: "SCP-092-028：听者会对所有移动的物体产生五重视觉。"
      zh_Hant: "SCP-092-028：聽者會對所有移動的物體產生五重視覺。"

  - scene: >
      Medium shot, waist-up, a different framing from the close-up
      before. d-class has become a small child, sitting in the same
      oversized chair with baggy adult clothes pooling around them, a
      puzzled small expression. attending-researcher-f crouches down to
      check on them with a clipboard.
    characters: [d-class, attending-researcher-f]
    caption:
      ja: "SCP-092-079——聴取者は生理的に5歳児となる。"
      en: "SCP-092-079: Listeners become physiologically five years old."
      cs: "SCP-092-079: Posluchači se fyziologicky stávají pětiletými."
      de: "SCP-092-079: Zuhörer werden physiologisch zu Fünfjährigen."
      es: "SCP-092-079: Los oyentes se vuelven fisiológicamente niños de cinco años."
      fr: "SCP-092-079 : Les auditeurs deviennent physiologiquement des enfants de cinq ans."
      it: "SCP-092-079: Gli ascoltatori diventano fisiologicamente bambini di cinque anni."
      ko: "SCP-092-079: 청취자는 생리학적으로 5세 어린이가 된다."
      pl: "SCP-092-079: Słuchacze stają się fizjologicznie pięciolatkami."
      pt: "SCP-092-079: Os ouvintes se tornam fisiologicamente crianças de cinco anos."
      th: "SCP-092-079: ผู้ฟังจะกลายเป็นเด็กอายุห้าขวบในทางสรีรวิทยา"
      uk: "SCP-092-079: Слухачі фізіологічно стають п'ятирічними дітьми."
      vi: "SCP-092-079: Người nghe trở thành đứa trẻ năm tuổi về mặt sinh lý."
      zh: "SCP-092-079：听者的生理年龄会变成五岁儿童。"
      zh_Hant: "SCP-092-079：聽者的生理年齡會變成五歲兒童。"

  - scene: >
      Wide shot, full body, a different framing from the medium shot
      before, showing a different d-class instance now transformed
      into a stylish 1966-era pop singer in a sharp period outfit,
      standing confidently mid-pose as if on stage. attending-researcher-m
      and attending-researcher-f stare in astonishment from the doorway.
    characters: [d-class, attending-researcher-m, attending-researcher-f]
    caption:
      ja: "SCP-092-466——聴取者は、1966年のグループ結成当時のオリジナルメンバーの姿へと、身体的に変貌させられる。"
      en: "SCP-092-466: Listeners are physically transformed into members of the original lineup of The 5th Dimension, as they were at the time of the group's establishment in 1966."
      cs: "SCP-092-466: Posluchači jsou fyzicky proměněni na členy původní sestavy skupiny The 5th Dimension, přesně takové, jací byli v době založení skupiny v roce 1966."
      de: "SCP-092-466: Zuhörer werden physisch in Mitglieder der ursprünglichen Besetzung von The 5th Dimension verwandelt, so wie sie zum Zeitpunkt der Gründung der Gruppe im Jahr 1966 waren."
      es: "SCP-092-466: Los oyentes son transformados físicamente en miembros de la formación original de The 5th Dimension, tal como eran en el momento de la fundación del grupo en 1966."
      fr: "SCP-092-466 : Les auditeurs sont physiquement transformés en membres de la formation originelle de The 5th Dimension, tels qu'ils étaient au moment de la création du groupe en 1966."
      it: "SCP-092-466: Gli ascoltatori vengono fisicamente trasformati nei membri della formazione originale dei The 5th Dimension, come erano al momento della fondazione del gruppo nel 1966."
      ko: "SCP-092-466: 청취자는 1966년 그룹 결성 당시의 원년 멤버 모습으로 신체적으로 변신하게 된다."
      pl: "SCP-092-466: Słuchacze zostają fizycznie przekształceni w członków oryginalnego składu The 5th Dimension, takich, jakimi byli w momencie założenia grupy w 1966 roku."
      pt: "SCP-092-466: Os ouvintes são fisicamente transformados em membros da formação original do The 5th Dimension, como eram na época da fundação do grupo em 1966."
      th: "SCP-092-466: ผู้ฟังจะถูกเปลี่ยนแปลงทางกายภาพให้กลายเป็นสมาชิกวง The 5th Dimension ชุดดั้งเดิม ตามที่พวกเขาเคยเป็นในช่วงเวลาที่วงก่อตั้งขึ้นในปี 1966"
      uk: "SCP-092-466: Слухачів фізично перетворює на учасників оригінального складу гурту The 5th Dimension, такими, якими вони були на момент заснування гурту в 1966 році."
      vi: "SCP-092-466: Người nghe bị biến đổi vật lý thành các thành viên đội hình gốc của nhóm The 5th Dimension, đúng như họ vào thời điểm nhóm được thành lập năm 1966."
      zh: "SCP-092-466：听者会在生理上被转变为「第五维度」乐团1966年创团时的原始成员模样。"
      zh_Hant: "SCP-092-466：聽者會在生理上被轉變為「第五維度」樂團1966年創團時的原始成員模樣。"
