# SCP-092 4コマ台本
# captionはDescription本文と、掲載されている大量の効果一覧の中から
# 無害な3件（五重視・5歳児化・原初メンバー変身）のみを選んで引用する。
# 致死性の高い効果（セシウム火傷・五分割・出血死等）とAcquisition Log
# （創作者の自殺）は一切使用しない。キャラにセリフは言わせない。

