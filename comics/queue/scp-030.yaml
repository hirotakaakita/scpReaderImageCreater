# SCP-030 4コマ台本
# captionはSpecial Containment Procedures / Description本文からの引用。
# キャラにセリフは言わせない（4コマ目のアリエルの決まり文句はcaptionの引用として
# 扱い、吹き出しにはしない）。
#
# 4コマ構成: 1=体格に合わせて縮小したサイト17の人型収容室(起)、
# 2=無毛・無性別・灰色、身長71cm、サファイア様の青い目(承)、
# 3=15ルーメン以上の光がないと不活性化し意識を失ったように見える(転)、
# 4=自らを「アリエル」と呼び、出自の質問には決まり文句で答える(結)。

id: scp-030

title:
  en: "SCP-030"
  ja: "SCP-030"
  cs: "SCP-030"
  de: "SCP-030"
  es: "SCP-030"
  fr: "SCP-030"
