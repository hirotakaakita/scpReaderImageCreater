# SCP-023 4コマ台本
# captionはSpecial Containment Procedures / Description本文からの引用。
# 補遺(Addendum 023-001..004)・インシデント報告は本編には使わない。
# キャラにセリフは言わせない。グロ回避のため流血・遺体は描かない。
#
# 4コマ構成: 1=偽の交差路に収容(起)、2=日没後に硬質ゴムの眼球挿入物を1つずつ
# 交換(承)、3=目を合わせると1年後に本人か近親者が死ぬ(転)、
# 4=交差路がないと壁をすり抜けて最寄りの交差点へ向かう(結・脱力オチ)。

id: scp-023

title:
  en: "SCP-023"
  ja: "SCP-023"
  cs: "SCP-023"
  de: "SCP-023"
  es: "SCP-023"
  fr: "SCP-023"
  it: "SCP-023"
  ko: "SCP-023"
  pl: "SCP-023"
  pt: "SCP-023"
  th: "SCP-023"
  uk: "SCP-023"
  vi: "SCP-023"
  zh: "SCP-023"
  zh_Hant: "SCP-023"

