panels:
  - scene: >
      Wide shot, full body, eye level, showing the whole exterior. An
      old, weathered wooden barn door stands alone in the middle of a
      fenced-off industrial lot, with no walls or building around it,
      just open ground. On the left side of the frame,
      attending-researcher-m stands beside a small guarded lockbox
      mounted on a post, holding a ring of twelve rusted keys up to the
      light, clipboard tucked under one arm.
    characters: [attending-researcher-m]
    caption:
      ja: "SCP-004は古い木製の納屋の扉（SCP-004-1）と、十二本の錆びた鋼鉄の鍵（SCP-004-2からSCP-004-13）から構成される。扉自体は、放棄された工場の入口である。"
      en: "SCP-004 consists of an old wooden barn door (SCP-004-1) and a set of twelve rusted steel keys (SCP-004-2 through SCP-004-13). The door itself is the entrance to an abandoned factory."
      cs: "SCP-004 se skládá ze starých dřevěných vrat stodoly (SCP-004-1) a sady dvanácti zrezivělých ocelových klíčů (SCP-004-2 až SCP-004-13). Samotná vrata jsou vchodem do opuštěné továrny."
      de: "SCP-004 besteht aus einer alten hölzernen Scheunentür (SCP-004-1) und einem Satz von zwölf verrosteten Stahlschlüsseln (SCP-004-2 bis SCP-004-13). Die Tür selbst ist der Eingang zu einer verlassenen Fabrik."
      es: "SCP-004 consiste en una vieja puerta de granero de madera (SCP-004-1) y un juego de doce llaves de acero oxidadas (SCP-004-2 a SCP-004-13). La puerta en sí es la entrada a una fábrica abandonada."
      fr: "Le SCP-004 se compose d'une vieille porte de grange en bois (SCP-004-1) et d'un jeu de douze clés en acier rouillé (SCP-004-2 à SCP-004-13). La porte elle-même est l'entrée d'une usine abandonnée."
      it: "SCP-004 è composto da una vecchia porta di legno da fienile (SCP-004-1) e da un set di dodici chiavi in acciaio arrugginite (da SCP-004-2 a SCP-004-13). La porta stessa è l'ingresso di una fabbrica abbandonata."
      ko: "SCP-004는 오래된 목재 헛간 문(SCP-004-1)과 열두 개의 녹슨 강철 열쇠(SCP-004-2부터 SCP-004-13까지)로 구성된다. 문 자체는 버려진 공장의 입구이다."
      pl: "SCP-004 składa się ze starych drewnianych drzwi stodoły (SCP-004-1) oraz zestawu dwunastu zardzewiałych stalowych kluczy (SCP-004-2 do SCP-004-13). Same drzwi stanowią wejście do opuszczonej fabryki."
      pt: "O SCP-004 consiste em uma velha porta de celeiro de madeira (SCP-004-1) e um conjunto de doze chaves de aço enferrujadas (SCP-004-2 a SCP-004-13). A porta em si é a entrada de uma fábrica abandonada."
      th: "SCP-004 ประกอบด้วยประตูโรงนาไม้เก่า (SCP-004-1) และชุดกุญแจเหล็กขึ้นสนิมสิบสองดอก (SCP-004-2 ถึง SCP-004-13) ตัวประตูเองคือทางเข้าโรงงานร้าง"
      uk: "SCP-004 складається зі старих дерев'яних воріт сараю (SCP-004-1) та набору з дванадцяти іржавих сталевих ключів (SCP-004-2 – SCP-004-13). Самі ворота є входом до покинутої фабрики."
      vi: "SCP-004 bao gồm một cánh cửa kho thóc bằng gỗ cũ (SCP-004-1) và một bộ mười hai chiếc chìa khóa thép gỉ (SCP-004-2 đến SCP-004-13). Bản thân cánh cửa là lối vào một nhà máy bỏ hoang."
      zh: "SCP-004由一扇老旧的木制谷仓门（SCP-004-1）和一套十二把生锈的钢制钥匙（SCP-004-2至SCP-004-13）组成。这扇门本身是一座废弃工厂的入口。"
      zh_Hant: "SCP-004由一扇老舊的木製穀倉門（SCP-004-1）和一套十二把生鏽的鋼製鑰匙（SCP-004-2至SCP-004-13）組成。這扇門本身是一座廢棄工廠的入口。"

  - scene: >
      Medium shot, waist-up, low angle, a different framing from the
      wide establishing shot. On the left side of the frame,
      attending-researcher-f grips a single rusted key tightly with both
      hands, expression tense. On the right side of the frame,
      attending-researcher-m stands close beside her, arms crossed,
      staring intently at the key itself rather than at her, clearly on
      guard duty.
    characters: [attending-researcher-f, attending-researcher-m]
    caption:
      ja: "これらの物品はレベル4のセキュリティ職員2名の同行なしに施設外へ移動させることを禁じる。試験区域からの鍵の無許可持ち出しは、即時処分の対象となる。"
      en: "The items are not permitted to be moved off-site unless accompanied by two Level 4 security personnel. Unauthorized removal of keys from the testing area is grounds for immediate termination."
      cs: "Tyto předměty nesmí být přemístěny mimo areál, pokud je nedoprovázejí dva pracovníci bezpečnostní ochrany úrovně 4. Neoprávněné odnesení klíčů z testovací oblasti je důvodem k okamžitému vyřazení pracovníka ze služby."
      de: "Die Gegenstände dürfen das Gelände nur in Begleitung von zwei Sicherheitskräften der Stufe 4 verlassen. Die unbefugte Entnahme von Schlüsseln aus dem Testbereich führt zur sofortigen Terminierung."
      es: "Los objetos no pueden ser trasladados fuera del sitio a menos que vayan acompañados de dos miembros del personal de seguridad de Nivel 4. La extracción no autorizada de las llaves del área de pruebas es motivo de terminación inmediata."
      fr: "Les objets ne peuvent être déplacés hors du site qu'accompagnés de deux membres du personnel de sécurité de Niveau 4. Le retrait non autorisé des clés de la zone de test entraîne la neutralisation immédiate du personnel responsable."
      it: "Gli oggetti non possono essere spostati fuori sede se non accompagnati da due membri del personale di sicurezza di Livello 4. La rimozione non autorizzata delle chiavi dall'area di test comporta la terminazione immediata."
      ko: "해당 물품은 4등급 보안 요원 2명이 동행하지 않는 한 시설 밖으로 이동할 수 없다. 시험 구역에서 열쇠를 무단으로 반출하는 행위는 즉시 처분 대상이 된다."
      pl: "Przedmioty nie mogą być przewożone poza teren placówki, chyba że w towarzystwie dwóch pracowników ochrony poziomu 4. Nieautoryzowane wyniesienie kluczy z obszaru testowego skutkuje natychmiastowym usunięciem ze służby."
      pt: "Os itens não podem ser transportados para fora do local a menos que acompanhados por dois membros da segurança de Nível 4. A remoção não autorizada das chaves da área de testes é motivo para terminação imediata."
      th: "ห้ามเคลื่อนย้ายสิ่งของออกนอกสถานที่ เว้นแต่มีเจ้าหน้าที่รักษาความปลอดภัยระดับ 4 จำนวนสองคนไปด้วย การนำกุญแจออกจากพื้นที่ทดสอบโดยไม่ได้รับอนุญาตถือเป็นเหตุให้ถูกกำจัดทันที"
      uk: "Ці предмети заборонено вивозити за межі об'єкта без супроводу двох співробітників служби безпеки рівня 4. Несанкціоноване вилучення ключів з тестової зони є підставою для негайної ліквідації."
      vi: "Các vật phẩm không được phép di chuyển ra khỏi cơ sở trừ khi có hai nhân viên an ninh Cấp 4 hộ tống. Việc lấy chìa khóa ra khỏi khu vực thử nghiệm mà không được phép sẽ dẫn đến việc xử lý ngay lập tức."
      zh: "这些物品未经两名4级安保人员陪同，不得移出场外。未经授权将钥匙带离测试区域，将被立即处决。"
      zh_Hant: "這些物品未經兩名4級安保人員陪同，不得移出場外。未經授權將鑰匙帶離測試區域，將被立即處決。"

  - scene: >
      Wide shot, from behind, deep one-point-perspective composition, a
      very different framing from the medium shot before.
      attending-researcher-f stands at the now-open barn door frame,
      small at the bottom of the frame, staring into a vast, dim, empty
      space that extends far beyond where the small attached building
      could physically contain it, only the door frame and her own
      silhouette clearly lit.
    characters: [attending-researcher-f]
    caption:
      ja: "試験により、SCP-004-2からSCP-004-13までの全ての鍵が、その大きなかんぬき付きの扉のただ一つの鍵穴に適合することが判明した。SCP-004-7を使用した被験者は、付属する建物の大きさからは考えられないほど巨大な部屋に入ったと証言した。"
      en: "Tests show that SCP-004-2 through SCP-004-13 all fit into a single lock on the large barred door. The subject using SCP-004-7 said that he had entered a large room, impossibly big for the size of the attached building."
      cs: "Testy ukázaly, že SCP-004-2 až SCP-004-13 pasují do jediného zámku na velkých zamřížovaných vratech. Subjekt, který použil SCP-004-7, uvedl, že vstoupil do velké místnosti, nemožně velké vzhledem k velikosti přilehlé budovy."
      de: "Tests zeigen, dass SCP-004-2 bis SCP-004-13 alle in ein einziges Schloss an der großen, verriegelten Tür passen. Das Subjekt, das SCP-004-7 benutzte, gab an, einen großen Raum betreten zu haben, der für die Größe des angeschlossenen Gebäudes unmöglich groß war."
      es: "Las pruebas muestran que SCP-004-2 a SCP-004-13 encajan todas en una sola cerradura de la gran puerta con barrotes. El sujeto que usó SCP-004-7 dijo haber entrado en una habitación enorme, imposiblemente grande para el tamaño del edificio adjunto."
      fr: "Les tests montrent que les SCP-004-2 à SCP-004-13 s'insèrent tous dans une seule serrure sur la grande porte barrée. Le sujet ayant utilisé le SCP-004-7 a déclaré être entré dans une vaste pièce, d'une taille impossible par rapport au bâtiment auquel elle était rattachée."
      it: "I test dimostrano che da SCP-004-2 a SCP-004-13 si adattano tutti a un'unica serratura sulla grande porta sbarrata. Il soggetto che ha usato SCP-004-7 ha detto di essere entrato in una grande stanza, di dimensioni impossibili rispetto all'edificio a cui era annessa."
      ko: "실험 결과 SCP-004-2부터 SCP-004-13까지 모두 그 큰 빗장문에 있는 단일한 자물쇠에 맞는 것으로 나타났다. SCP-004-7을 사용한 피험자는 부속 건물의 크기로는 불가능할 정도로 거대한 방에 들어갔다고 진술했다."
      pl: "Testy wykazały, że klucze od SCP-004-2 do SCP-004-13 pasują do jednego zamka w dużych zaryglowanych drzwiach. Osobnik, który użył SCP-004-7, stwierdził, że wszedł do dużego pomieszczenia, niemożliwie wielkiego jak na rozmiar przylegającego budynku."
      pt: "Os testes mostram que SCP-004-2 a SCP-004-13 se encaixam todos em uma única fechadura na grande porta trancada. O sujeito que usou SCP-004-7 disse ter entrado em um grande cômodo, impossivelmente grande para o tamanho do edifício anexo."
      th: "การทดสอบแสดงให้เห็นว่า SCP-004-2 ถึง SCP-004-13 ทั้งหมดสามารถใช้กับกุญแจเดียวบนประตูบานใหญ่ที่มีสลักได้ ผู้เข้าร่วมทดสอบที่ใช้ SCP-004-7 กล่าวว่าเขาได้เข้าไปในห้องขนาดใหญ่ที่ใหญ่โตเกินกว่าที่จะเป็นไปได้เมื่อเทียบกับขนาดอาคารที่ติดอยู่"
      uk: "Тести показують, що SCP-004-2 – SCP-004-13 усі підходять до одного замка на великих засувних воротах. Суб'єкт, який використав SCP-004-7, повідомив, що потрапив у велику кімнату, неможливо велику для розмірів прилеглої будівлі."
      vi: "Các thử nghiệm cho thấy SCP-004-2 đến SCP-004-13 đều vừa với một ổ khóa duy nhất trên cánh cửa lớn có chốt. Đối tượng sử dụng SCP-004-7 cho biết anh ta đã bước vào một căn phòng rộng lớn, lớn đến mức không thể xảy ra so với kích thước của tòa nhà gắn liền."
      zh: "测试显示，SCP-004-2至SCP-004-13全部都能匹配那扇带闩大门上的同一把锁。使用SCP-004-7的对象表示，他进入了一个大房间，其大小与相连建筑物的尺寸完全不成比例。"
      zh_Hant: "測試顯示，SCP-004-2至SCP-004-13全部都能匹配那扇帶閂大門上的同一把鎖。使用SCP-004-7的對象表示，他進入了一個大房間，其大小與相連建築物的尺寸完全不成比例。"

  - scene: >
      Wide shot, full body, eye level, pulled back to reveal a small lit
      cluster of modern bunker buildings and corridors floating in the
      surrounding darkness beyond the door frame, a very different
      framing from the deep-perspective shot before. On the left side of
      the frame, attending-researcher-f stands just inside the door
      frame. On the right side of the frame, attending-researcher-m
      gestures with open hands at the incongruous facility beyond,
      deadpan and unimpressed, as if this were a perfectly normal
      Tuesday.
    characters: [attending-researcher-f, attending-researcher-m]
    caption:
      ja: "SCP-004-1の内部に施設の建設が開始された。この施設は現在サイト-62と呼ばれている。部屋の大きさを測定することは不可能であり、ドア枠とその中にいる人物のみが、触れることも照らすこともできる部分である。"
      en: "Construction has begun on a site inside SCP-004-1. The facility is now referred to as Site-62. The size of the room is impossible to measure, and the door frame and the individuals within it are the only part that can be felt or illuminated."
      cs: "Uvnitř SCP-004-1 začala výstavba zařízení. Toto zařízení je nyní označováno jako Site-62. Velikost místnosti nelze změřit a rám dveří spolu s osobami uvnitř jsou jedinou částí, kterou lze nahmatat nebo osvětlit."
      de: "Im Inneren von SCP-004-1 hat der Bau einer Einrichtung begonnen. Die Anlage wird nun als Standort-62 bezeichnet. Die Größe des Raumes lässt sich unmöglich messen, und der Türrahmen sowie die darin befindlichen Personen sind der einzige Teil, der berührt oder beleuchtet werden kann."
      es: "Ha comenzado la construcción de unas instalaciones dentro de SCP-004-1. Las instalaciones ahora se conocen como Sitio-62. El tamaño de la habitación es imposible de medir, y el marco de la puerta y las personas que están dentro son la única parte que puede sentirse o iluminarse."
      fr: "La construction d'un site a commencé à l'intérieur du SCP-004-1. L'installation est désormais désignée sous le nom de Site-62. La taille de la pièce est impossible à mesurer, et l'encadrement de la porte ainsi que les personnes qui s'y trouvent sont la seule partie que l'on peut sentir ou éclairer."
      it: "È iniziata la costruzione di un sito all'interno di SCP-004-1. La struttura è ora denominata Sito-62. Le dimensioni della stanza sono impossibili da misurare, e il telaio della porta e le persone al suo interno sono l'unica parte che può essere percepita o illuminata."
      ko: "SCP-004-1 내부에 시설 건설이 시작되었다. 이 시설은 이제 사이트-62로 불린다. 방의 크기는 측정이 불가능하며, 문틀과 그 안에 있는 사람들만이 느끼거나 비출 수 있는 유일한 부분이다."
      pl: "Wewnątrz SCP-004-1 rozpoczęto budowę placówki. Obiekt ten jest teraz określany jako Placówka-62. Rozmiar pomieszczenia jest niemożliwy do zmierzenia, a framuga drzwi wraz z osobami w niej znajdującymi się to jedyna część, którą można wyczuć lub oświetlić."
      pt: "A construção de uma instalação começou dentro do SCP-004-1. A instalação agora é chamada de Local-62. O tamanho do cômodo é impossível de medir, e o batente da porta e as pessoas dentro dele são a única parte que pode ser sentida ou iluminada."
      th: "การก่อสร้างสถานที่ภายใน SCP-004-1 ได้เริ่มขึ้นแล้ว สถานที่แห่งนี้ปัจจุบันเรียกว่าไซต์-62 ขนาดของห้องไม่สามารถวัดได้ และกรอบประตูพร้อมกับบุคคลที่อยู่ภายในเป็นส่วนเดียวที่สามารถสัมผัสหรือส่องแสงได้"
      uk: "Усередині SCP-004-1 розпочалося будівництво об'єкта. Тепер цей заклад називають Об'єкт-62. Розмір кімнати неможливо виміряти, і дверна рама та люди в ній є єдиною частиною, яку можна відчути на дотик або освітити."
      vi: "Việc xây dựng một cơ sở bên trong SCP-004-1 đã bắt đầu. Cơ sở này hiện được gọi là Địa Điểm-62. Kích thước của căn phòng không thể đo được, và khung cửa cùng những người bên trong nó là phần duy nhất có thể cảm nhận được hoặc chiếu sáng được."
      zh: "SCP-004-1内部已开始建设一处设施。该设施现称为62站点。房间的大小无法测量，门框以及门框内的人员是唯一能够被触摸或照亮的部分。"
      zh_Hant: "SCP-004-1內部已開始建設一處設施。該設施現稱為62站點。房間的大小無法測量，門框以及門框內的人員是唯一能夠被觸摸或照亮的部分。"
