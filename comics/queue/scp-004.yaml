# SCP-004 4コマ台本
# captionはSpecial Containment Procedures / Description本文からの引用。
# Chronological History中の身体切断描写はグロ回避のため意図的に避け、扉・鍵・
# 巨大な部屋・内部に建設されたSite-62という「不気味だがコミカルな官僚制」の
# 側面のみを題材にした。付録（Appendix A/B）は本編に混ぜない。
# キャラにセリフは言わせない。JP公式訳が直接取得できなかったため、検証済みの
# 英語本文からの翻訳（ja含む）。

