# SCP-060 4コマ台本
# captionはSpecial Containment Procedures / Description本文からの引用。
# 「職員への組みつき・絞殺による襲撃」の記述と、発見時の失踪者に関する
# 不穏な背景（Additional Information）はグロ・被害描写のため本編から外し、
# 消火・鎮圧という対処面のみを題材にした。キャラにセリフは言わせない。
# JP公式訳が直接取得できなかったため、検証済みの英語本文からの翻訳（ja含む）。

id: scp-060

