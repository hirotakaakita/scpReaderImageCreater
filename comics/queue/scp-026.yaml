# SCP-026 4コマ台本
# captionはSpecial Containment Procedures / Description本文からの引用。
# Note 026-A..C・インシデント報告は本編には使わない。
# キャラにセリフは言わせない。急速な脱水・腐敗などのグロ描写は避け、
# 眠っている対象は穏やかに眠っているだけの様子として描く。
#
# 4コマ構成: 1=板で封鎖されアラームが設置された廃校の外観(起)、
# 2=外観より広い内部・長さの変わる廊下と段数の変わる階段(承)、
# 3=消えては現れる黒板の書き込みと「子供たちはかつて歌っていた」(転)、
# 4=館内で発見される、旧い服装で眠ったままの生徒(結・不気味な余韻)。

id: scp-026

title:
  en: "SCP-026"
  ja: "SCP-026"
  cs: "SCP-026"
  de: "SCP-026"
