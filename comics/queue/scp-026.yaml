# SCP-026 4コマ台本
# captionはSpecial Containment Procedures / Description本文からの引用。
# 「建物外に運び出すと急速に脱水死・腐敗が進む」というグロ描写と
# Note/Incident Report等の詳細は本編から外し、リミナルスペース的な不気味さ
# （伸縮する廊下、消えては現れる落書き、眠り続ける生徒）のみを題材にした。
# キャラにセリフは言わせない。JP公式訳が直接取得できなかったため、検証済みの
# 英語本文からの翻訳（ja含む）。

