# SCP-106「オールドマン」4コマ台本
# captionはSpecial Containment Procedures / Descriptionの実際の文章からの引用。
# キャラにセリフは言わせない。腐敗描写は最小限に留め、直接的なグロ表現は避ける。

id: scp-106

title:
  en: "SCP-106: The Old Man"
  ja: "SCP-106：オールドマン"
  cs: "SCP-106: Starý muž"
  de: "SCP-106: Der Alte Mann"
  es: "SCP-106: El Viejo"
  fr: "SCP-106 : Le Vieil Homme"
  it: "SCP-106: Il Vecchio"
  ko: "SCP-106: 노인"
  pl: "SCP-106: Stary Człowiek"
  pt: "SCP-106: O Velho"
  th: "SCP-106: ชายชรา"
  uk: "SCP-106: Старий"
  vi: "SCP-106: Ông Già"
  zh: "SCP-106：老人"
  zh_Hant: "SCP-106：老人"

attribution:
  article: "SCP-106"
  author: "Dr Gears"
  source_url: "http://scp-wiki.wikidot.com/scp-106"
  license: "CC BY-SA 3.0"

object_class: Keter

local_characters:
  scp-106:
    name: SCP-106
    description: >
      SCP-106, an emaciated elderly humanoid with a gaunt frame and a
      general appearance of advanced decomposition. Skin is dull,
      mottled grayish-brown (color RGB 90,80,65), dry and cracked in
      texture, with a thick, dark, tar-like corrosive liquid (color RGB
      20,18,15) constantly seeping from its body and dripping to the
      ground. Its face stays turned down or shadowed, never shown in
      clear detail. Wears the ragged, tattered remnants of old dark
      clothing (color RGB 40,35,30).

characters: [attending-researcher-m, scp-106]

panels:
  - scene: >
      Wide shot, full body, eye level, showing the whole containment
      chamber. In the center of the frame, a heavy lead-lined steel
      container hangs suspended in midair, held motionless above the
      floor by a ring of humming electromagnetic supports, thick cables
      running to the walls. Far to one side, well back from the
      container, attending-researcher-m stands behind a yellow safety
      line painted on the floor, watching a bank of dials and readouts
      from a safe distance.
    characters: [attending-researcher-m]
    caption:
      ja: "SCP-106は鉛張りの鋼鉄製密閉容器に収容される。容器は電磁支持装置ELO-IIDにより、いかなる面からも60cm以上離した状態で常時浮遊させておくこと。職員は常時、収容室から少なくとも60m離れていること。"
      en: "SCP-106 is to be contained in a sealed container, comprised of lead-lined steel, suspended no less than 60cm from any surface by ELO-IID electromagnetic supports. All staff are to remain at least sixty meters away from the containment cell at all times."
      cs: "SCP-106 musí být uchováván v uzavřené nádobě z olovem obloženého oceli, zavěšené elektromagnetickými podpěrami ELO-IID nejméně 60 cm od jakéhokoli povrchu. Veškerý personál se musí od kontejnmentové cely neustále zdržovat ve vzdálenosti alespoň šedesáti metrů."
      de: "SCP-106 ist in einem versiegelten Behälter aus bleiverkleidetem Stahl unterzubringen, der durch ELO-IID-Elektromagnetstützen mindestens 60 cm über jeder Oberfläche schwebend gehalten wird. Sämtliches Personal hat sich jederzeit mindestens sechzig Meter von der Containment-Zelle fernzuhalten."
      es: "SCP-106 debe mantenerse en un contenedor sellado de acero revestido de plomo, suspendido a no menos de 60 cm de cualquier superficie mediante soportes electromagnéticos ELO-IID. Todo el personal debe permanecer en todo momento a al menos sesenta metros de la celda de contención."
      fr: "SCP-106 doit être contenu dans un conteneur scellé en acier doublé de plomb, maintenu en suspension à au moins 60 cm de toute surface par des supports électromagnétiques ELO-IID. L'ensemble du personnel doit rester en permanence à au moins soixante mètres de la cellule de confinement."
      it: "SCP-106 deve essere contenuto in un contenitore sigillato in acciaio rivestito di piombo, sospeso ad almeno 60 cm da qualsiasi superficie tramite supporti elettromagnetici ELO-IID. Tutto il personale deve rimanere in ogni momento ad almeno sessanta metri dalla cella di contenimento."
      ko: "SCP-106는 납이 내장된 강철로 만든 밀폐 용기에 수용되며, ELO-IID 전자기 지지장치에 의해 어떠한 표면으로부터도 60cm 이상 띄운 상태로 항상 공중에 매달아 둔다. 모든 직원은 항상 수용실로부터 최소 60m 이상 떨어져 있어야 한다."
      pl: "SCP-106 musi być przechowywany w szczelnym pojemniku z ołowianej stali, zawieszonym co najmniej 60 cm od dowolnej powierzchni za pomocą elektromagnetycznych podpór ELO-IID. Cały personel musi przez cały czas pozostawać w odległości co najmniej sześćdziesięciu metrów od celi kontenerowej."
      pt: "SCP-106 deve ser mantido em um recipiente selado, feito de aço revestido de chumbo, suspenso a não menos de 60 cm de qualquer superfície por suportes eletromagnéticos ELO-IID. Toda a equipe deve permanecer, a todo momento, a pelo menos sessenta metros da cela de contenção."
      th: "SCP-106 ต้องถูกกักกันในภาชนะปิดผนึกที่ทำจากเหล็กบุตะกั่ว แขวนลอยห่างจากพื้นผิวใดๆ ไม่น้อยกว่า 60 ซม. ด้วยตัวรองรับแม่เหล็กไฟฟ้า ELO-IID เจ้าหน้าที่ทุกคนต้องอยู่ห่างจากห้องกักกันอย่างน้อยหกสิบเมตรตลอดเวลา"
      uk: "SCP-106 повинен утримуватися в герметичному контейнері з обшитої свинцем сталі, підвішеному не менш ніж на 60 см від будь-якої поверхні за допомогою електромагнітних опор ELO-IID. Весь персонал має постійно перебувати на відстані щонайменше шістдесяти метрів від камери утримання."
      vi: "SCP-106 phải được giam giữ trong một thùng chứa kín làm bằng thép bọc chì, được treo lơ lửng cách mọi bề mặt không dưới 60cm nhờ các giá đỡ điện từ ELO-IID. Toàn bộ nhân viên phải luôn cách buồng giam ít nhất sáu mươi mét."
      zh: "SCP-106须收容于铅衬钢制密封容器中，由ELO-IID电磁支撑装置悬空固定，距任何表面不得少于60厘米。全体人员须始终与收容室保持至少六十米的距离。"
      zh_Hant: "SCP-106須收容於鉛襯鋼製密封容器中，由ELO-IID電磁支撐裝置懸空固定，距任何表面不得少於60公分。全體人員須始終與收容室保持至少六十公尺的距離。"

  - scene: >
      Medium shot, waist-up, straight-on eye level, framed differently
      from the wide establishing shot. On a bank of remote monitors,
      attending-researcher-m watches a live camera feed showing part of
      SCP-106's body visibly melding into the steel wall of the
      container, its shoulder and arm sinking into the solid metal as
      though it were soft clay. He stands well back from the monitors at
      a safe observation desk, watching intently with a wary, uneasy
      expression, nowhere near the containment chamber itself.
    characters: [attending-researcher-m, scp-106]
    caption:
      ja: "SCP-106は固体物質の中へ「消失」することができ、これは一種の「ポケット次元」であると推定される場所へ入り込むものと考えられている。"
      en: "SCP-106 is able to 'vanish' inside solid matter, entering what is assumed to be a form of 'pocket dimension'."
      cs: "SCP-106 dokáže 'zmizet' uvnitř pevné hmoty a vstoupit do toho, co je považováno za jistou formu 'kapesní dimenze'."
      de: "SCP-106 kann im Inneren fester Materie 'verschwinden' und tritt dabei in etwas ein, das als eine Form von 'Taschendimension' angenommen wird."
      es: "SCP-106 puede 'desvanecerse' dentro de la materia sólida, entrando en lo que se presume es una forma de 'dimensión de bolsillo'."
      fr: "SCP-106 est capable de 'disparaître' à l'intérieur de la matière solide, entrant dans ce qui est présumé être une forme de 'dimension de poche'."
      it: "SCP-106 è in grado di 'svanire' all'interno della materia solida, entrando in quella che si presume essere una forma di 'dimensione tascabile'."
      ko: "SCP-106는 고체 물질 속으로 '사라질' 수 있으며, 이는 일종의 '포켓 차원'으로 추정되는 곳으로 들어가는 것으로 여겨진다."
      pl: "SCP-106 potrafi 'zniknąć' wewnątrz materii stałej, wchodząc w to, co uznaje się za formę 'kieszonkowego wymiaru'."
      pt: "SCP-106 é capaz de 'desaparecer' dentro de matéria sólida, entrando no que se presume ser uma forma de 'dimensão de bolso'."
      th: "SCP-106 สามารถ 'หายวับไป' เข้าไปในสสารแข็งได้ โดยเข้าสู่สิ่งที่สันนิษฐานว่าเป็นรูปแบบหนึ่งของ 'มิติกระเป๋า'"
      uk: "SCP-106 здатний 'зникати' всередині твердої матерії, потрапляючи в те, що вважається своєрідним 'кишеньковим виміром'."
      vi: "SCP-106 có thể 'biến mất' vào bên trong vật chất rắn, đi vào nơi được cho là một dạng 'không gian túi'."
      zh: "SCP-106能够「消失」于固体物质之中，进入一种被推测为「口袋维度」的场所。"
      zh_Hant: "SCP-106能夠「消失」於固體物質之中，進入一種被推測為「口袋維度」的場所。"

  - scene: >
      Close-up, dynamic diagonal composition, low angle, a sudden and
      urgent framing very different from the calm previous panel. A dark,
      wet patch of corrosive residue has appeared on the steel wall of
      the chamber, metal visibly pitting and bubbling around the edges of
      the stain, as one long decayed arm emerges partway out of the solid
      wall itself. Alarm lights flash red across the room. In the
      background, attending-researcher-m jerks upright from the console,
      eyes wide, one hand slamming down on an alarm switch.
    characters: [scp-106, attending-researcher-m]
    caption:
      ja: "SCP-106は固体物質を通過することができ、その痕跡として大量の腐食性粘液を残す。腐食は接触から6時間持続し、その後は効果が「燃え尽きる」ように収まる。"
      en: "SCP-106 is capable of passing through solid matter, leaving behind a large patch of its corrosive mucus. Corrosion continues for six hours after contact, after which the effect appears to 'burn out'."
      cs: "SCP-106 dokáže procházet pevnou hmotou a zanechává za sebou rozsáhlou skvrnu svého žíravého hlenu. Koroze pokračuje šest hodin po kontaktu, poté účinek zjevně 'vyhasne'."
      de: "SCP-106 ist in der Lage, feste Materie zu durchdringen, wobei es einen großen Fleck seines ätzenden Schleims hinterlässt. Die Korrosion hält sechs Stunden nach dem Kontakt an, danach scheint der Effekt zu 'erlöschen'."
      es: "SCP-106 es capaz de atravesar materia sólida, dejando tras de sí una amplia mancha de su mucosidad corrosiva. La corrosión continúa durante seis horas después del contacto, tras lo cual el efecto parece 'agotarse'."
      fr: "SCP-106 est capable de traverser la matière solide, laissant derrière lui une large trace de son mucus corrosif. La corrosion se poursuit pendant six heures après le contact, après quoi l'effet semble 's'éteindre'."
      it: "SCP-106 è in grado di attraversare la materia solida, lasciando dietro di sé una vasta chiazza del suo muco corrosivo. La corrosione prosegue per sei ore dopo il contatto, dopodiché l'effetto sembra 'esaurirsi'."
      ko: "SCP-106는 고체 물질을 통과할 수 있으며, 그 흔적으로 부식성 점액의 넓은 자국을 남긴다. 부식은 접촉 후 여섯 시간 동안 지속되며, 그 후 효과가 '연소되어' 사라지는 것으로 보인다."
      pl: "SCP-106 potrafi przenikać przez materię stałą, pozostawiając po sobie duży ślad swojego żrącego śluzu. Korozja utrzymuje się przez sześć godzin po kontakcie, po czym efekt zdaje się 'wypalać'."
      pt: "SCP-106 é capaz de atravessar matéria sólida, deixando para trás uma grande mancha de sua mucosidade corrosiva. A corrosão continua por seis horas após o contato, após o que o efeito parece 'se esgotar'."
      th: "SCP-106 สามารถทะลุผ่านสสารแข็งได้ โดยทิ้งคราบเมือกกัดกร่อนขนาดใหญ่ไว้เบื้องหลัง การกัดกร่อนจะดำเนินต่อไปเป็นเวลาหกชั่วโมงหลังการสัมผัส หลังจากนั้นผลกระทบดูเหมือนจะ 'มอดไหม้หมดไป'"
      uk: "SCP-106 здатний проходити крізь тверду матерію, залишаючи по собі велику пляму свого їдкого слизу. Корозія триває шість годин після контакту, після чого ефект, схоже, 'вигорає'."
      vi: "SCP-106 có khả năng xuyên qua vật chất rắn, để lại một vệt lớn chất nhầy ăn mòn phía sau. Sự ăn mòn tiếp diễn trong sáu giờ sau khi tiếp xúc, sau đó hiệu ứng dường như 'cháy hết'."
      zh: "SCP-106能够穿透固体物质，并在穿过之处留下大片腐蚀性黏液。腐蚀效果在接触后持续六小时，此后效果似乎会「燃尽」而消失。"
      zh_Hant: "SCP-106能夠穿透固體物質，並在穿過之處留下大片腐蝕性黏液。腐蝕效果在接觸後持續六小時，此後效果似乎會「燒盡」而消失。"

  - scene: >
      Wide shot, full body, eye level, pulled back to show a long
      corridor, a calmer resolution framing distinct from the previous
      close-up. On the left side of the frame, attending-researcher-m
      walks briskly but without panic down the corridor, glancing back
      once over his shoulder. On the right side of the frame, far behind
      him at the other end of the corridor, SCP-106's silhouette stands
      completely motionless and upright, having already stopped moving
      entirely, simply watching him go without pursuing any further.
    characters: [attending-researcher-m, scp-106]
    caption:
      ja: "SCP-106は特に敏捷というわけではなく、獲物を待って数日間動かずにいることがある。"
      en: "SCP-106 is not exceptionally agile, and will remain motionless for days at a time, waiting for prey."
      cs: "SCP-106 není výjimečně obratný a dokáže zůstat celé dny nehybný, přičemž čeká na kořist."
      de: "SCP-106 ist nicht außergewöhnlich beweglich und verharrt tagelang bewegungslos, während es auf Beute wartet."
      es: "SCP-106 no es excepcionalmente ágil, y puede permanecer inmóvil durante varios días seguidos, a la espera de una presa."
      fr: "SCP-106 n'est pas exceptionnellement agile et peut rester immobile pendant plusieurs jours d'affilée, attendant une proie."
      it: "SCP-106 non è particolarmente agile e può rimanere immobile per giorni interi, in attesa di una preda."
      ko: "SCP-106는 특별히 민첩하지는 않으며, 며칠 동안 움직이지 않고 먹잇감을 기다리기도 한다."
      pl: "SCP-106 nie jest szczególnie zwinny i potrafi pozostawać nieruchomy przez wiele dni, czekając na ofiarę."
      pt: "SCP-106 não é excepcionalmente ágil e pode permanecer imóvel por vários dias seguidos, à espera de uma presa."
      th: "SCP-106 ไม่ได้คล่องแคล่วเป็นพิเศษ และสามารถอยู่นิ่งได้นานหลายวันเพื่อรอเหยื่อ"
      uk: "SCP-106 не є надзвичайно спритним і може залишатися нерухомим по кілька днів поспіль, очікуючи на здобич."
      vi: "SCP-106 không đặc biệt nhanh nhẹn, và có thể đứng yên bất động trong nhiều ngày liền để chờ con mồi."
      zh: "SCP-106并非特别敏捷，能够一动不动地等待猎物长达数日之久。"
      zh_Hant: "SCP-106並非特別敏捷，能夠一動不動地等待獵物長達數日之久。"
