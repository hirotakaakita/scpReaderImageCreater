local_characters:
  scp-019-2:
    name: SCP-019-2 (specimen)
    description: >
      A small creature roughly the size of a house cat, vaguely
      humanoid in posture but with patchy, animal-like features — small
      pointed ears, a short snout, matted grayish-tan fur (color RGB
      140,120,95), sharp visible teeth and claws, hunched and feral in
      stance.

characters: [attending-researcher-f, attending-researcher-m, scp-019-2]

panels:
  - scene: >
      Wide shot, full body, eye level, showing the whole containment
      room: a massive ancient ceramic vase, nearly 2.4m tall, standing
      upright on a wide metal grate at the center of a bare reinforced
      concrete room, its surface etched with faded classical Greek
      figures. attending-researcher-f observes from behind a thick
      plate-glass window on one side, clipboard in hand.
    characters: [attending-researcher-f]
    caption:
      ja: "SCP-019は非常に大きな陶製の壺のような外見をしており、口部の直径1.8m、高さ2.4mである。様式と装飾から古典期ギリシャで作られたものと考えられるが、表面がいかなる既知の手段によっても壊れないため、確定的な年代測定は不可能である。"
      en: "SCP-019 appears to be a very large ceramic vase, 1.8 m in diameter at the mouth and 2.4 m high. Style and decoration indicate it was created in Classical Greece, although conclusive dating is impossible, as the surface is entirely unbreakable."
      cs: "SCP-019 vypadá jako velmi velká keramická váza o průměru ústí 1,8 m a výšce 2,4 m. Styl a zdobení naznačují, že byla vytvořena v klasickém Řecku, avšak jednoznačné datování je nemožné, jelikož povrch je zcela nezničitelný jakýmikoli známými prostředky."
      de: "SCP-019 erscheint als eine sehr große Keramikvase mit einem Mündungsdurchmesser von 1,8 m und einer Höhe von 2,4 m. Stil und Verzierung deuten auf eine Entstehung im klassischen Griechenland hin, eine schlüssige Datierung ist jedoch unmöglich, da die Oberfläche mit keinem bekannten Mittel zerstörbar ist."
      es: "SCP-019 parece ser un vaso de cerámica muy grande, de 1,8 m de diámetro en la boca y 2,4 m de altura. El estilo y la decoración indican que fue creado en la Grecia Clásica, aunque una datación concluyente es imposible, ya que la superficie es completamente irrompible."
      fr: "Le SCP-019 se présente comme un très grand vase en céramique, de 1,8 m de diamètre à l'embouchure et de 2,4 m de hauteur. Le style et la décoration indiquent qu'il a été créé dans la Grèce classique, bien qu'une datation concluante soit impossible, la surface étant totalement incassable."
      it: "SCP-019 appare come un vaso di ceramica molto grande, di 1,8 m di diametro alla bocca e 2,4 m di altezza. Lo stile e la decorazione indicano che fu creato nella Grecia classica, sebbene una datazione conclusiva sia impossibile, poiché la superficie è totalmente infrangibile."
      ko: "SCP-019은 매우 큰 도자기 항아리처럼 보이며, 입구 지름이 1.8m, 높이가 2.4m이다. 양식과 장식으로 볼 때 고전기 그리스에서 제작된 것으로 추정되지만, 표면이 알려진 어떤 수단으로도 파괴되지 않기 때문에 확정적인 연대 측정은 불가능하다."
      pl: "SCP-019 wygląda jak bardzo duży ceramiczny wazon o średnicy wylotu 1,8 m i wysokości 2,4 m. Styl i zdobienia wskazują, że powstał w klasycznej Grecji, jednak jednoznaczne datowanie jest niemożliwe, ponieważ powierzchnia jest całkowicie niezniszczalna."
      pt: "O SCP-019 parece ser um vaso de cerâmica muito grande, com 1,8 m de diâmetro na boca e 2,4 m de altura. O estilo e a decoração indicam que foi criado na Grécia Clássica, embora uma datação conclusiva seja impossível, já que a superfície é totalmente inquebrável."
      th: "SCP-019 มีลักษณะเหมือนแจกันเซรามิกขนาดใหญ่มาก มีเส้นผ่านศูนย์กลางปากแจกัน 1.8 เมตร และสูง 2.4 เมตร รูปแบบและลวดลายบ่งชี้ว่าสร้างขึ้นในยุคกรีกคลาสสิก แม้ว่าการระบุอายุที่แน่ชัดจะเป็นไปไม่ได้ เนื่องจากพื้นผิวไม่สามารถแตกหักได้"
      uk: "SCP-019 має вигляд дуже великої керамічної вази діаметром горловини 1,8 м і висотою 2,4 м. Стиль і оздоблення вказують на те, що вона була створена в класичній Греції, хоча остаточне датування неможливе, оскільки поверхня абсолютно незламна."
      vi: "SCP-019 trông giống như một chiếc bình gốm rất lớn, đường kính miệng bình 1,8 m và cao 2,4 m. Phong cách và hoa văn trang trí cho thấy nó được tạo ra vào thời Hy Lạp Cổ điển, mặc dù việc xác định niên đại chính xác là không thể, vì bề mặt hoàn toàn không thể phá vỡ."
      zh: "SCP-019外观是一个非常大的陶制花瓶，瓶口直径1.8米，高2.4米。其风格与装饰表明它出自古典希腊时期，但由于其表面无法被任何已知手段破坏，因此无法进行确切的年代测定。"
      zh_Hant: "SCP-019外觀是一個非常大的陶製花瓶，瓶口直徑1.8公尺，高2.4公尺。其風格與裝飾表明它出自古典希臘時期，但由於其表面無法被任何已知手段破壞，因此無法進行確切的年代測定。"

  - scene: >
      Close-up, low angle, filling most of the frame, a very different
      framing from the wide establishing shot. A single scp-019-2
      creature perches at the vase's rim, baring its teeth and claws,
      mid-snarl, one leg still draped over the vase's edge.
    characters: [scp-019-2]
    caption:
      ja: "定期的に、SCP-019からSCP-019-2と総称される存在が出現する。それらは小柄で、なんとなく人型をしており、極めて凶暴で、しばしば牙や爪で攻撃する。かなり脆弱ではあるが、驚くほど燃えやすい。"
      en: "Periodically, entities emerge from SCP-019, collectively known as SCP-019-2. They tend to be small, vaguely humanoid, and extremely hostile, often attacking with teeth or claws. Although fairly delicate, they are surprisingly flammable."
      cs: "Pravidelně se ze SCP-019 vynořují entity, souhrnně označované jako SCP-019-2. Mají tendenci být malé, nejasně humanoidní a extrémně nepřátelské, často útočí zuby nebo drápy. Ačkoli jsou poměrně křehké, jsou překvapivě hořlavé."
      de: "In regelmäßigen Abständen tauchen aus SCP-019 Wesen auf, die gemeinsam als SCP-019-2 bezeichnet werden. Sie sind meist klein, vage humanoid und extrem feindselig, greifen häufig mit Zähnen oder Krallen an. Obwohl sie recht zerbrechlich sind, sind sie überraschend brennbar."
      es: "Periódicamente, del SCP-019 emergen entidades, conocidas colectivamente como SCP-019-2. Tienden a ser pequeñas, vagamente humanoides y extremadamente hostiles, y a menudo atacan con dientes o garras. Aunque son bastante frágiles, son sorprendentemente inflamables."
      fr: "Périodiquement, des entités émergent du SCP-019, collectivement désignées sous le nom de SCP-019-2. Elles ont tendance à être petites, vaguement humanoïdes, et extrêmement hostiles, attaquant souvent avec les dents ou les griffes. Bien que plutôt fragiles, elles sont étonnamment inflammables."
      it: "Periodicamente, dal SCP-019 emergono entità, note collettivamente come SCP-019-2. Tendono ad essere piccole, vagamente umanoidi ed estremamente ostili, attaccando spesso con denti o artigli. Sebbene piuttosto delicate, sono sorprendentemente infiammabili."
      ko: "주기적으로 SCP-019에서 개체들이 출현하며, 이들은 총칭하여 SCP-019-2로 불린다. 이들은 대체로 작고, 어렴풋이 인간형이며, 극도로 적대적이어서 종종 이빨이나 발톱으로 공격한다. 상당히 연약하지만 놀랍도록 잘 타오른다."
      pl: "Okresowo z SCP-019 wyłaniają się istoty, zbiorczo nazywane SCP-019-2. Zazwyczaj są małe, niewyraźnie humanoidalne i wyjątkowo wrogie, często atakując zębami lub pazurami. Choć są dość delikatne, są zaskakująco łatwopalne."
      pt: "Periodicamente, entidades emergem do SCP-019, coletivamente conhecidas como SCP-019-2. Costumam ser pequenas, vagamente humanoides e extremamente hostis, frequentemente atacando com dentes ou garras. Embora bastante delicadas, são surpreendentemente inflamáveis."
      th: "เป็นระยะ ๆ สิ่งมีชีวิตจะปรากฏขึ้นจาก SCP-019 ซึ่งเรียกรวมกันว่า SCP-019-2 พวกมันมักจะมีขนาดเล็ก มีรูปร่างคล้ายมนุษย์อย่างคลุมเครือ และก้าวร้าวอย่างมาก มักโจมตีด้วยฟันหรือกรงเล็บ แม้จะค่อนข้างบอบบาง แต่ก็ติดไฟได้ง่ายอย่างน่าประหลาดใจ"
      uk: "Періодично із SCP-019 з'являються істоти, які в сукупності називають SCP-019-2. Вони, як правило, невеликі, дещо гуманоїдні та вкрай ворожі, часто атакують зубами чи кігтями. Хоча вони досить крихкі, вони на диво легкозаймисті."
      vi: "Định kỳ, các thực thể xuất hiện từ SCP-019, được gọi chung là SCP-019-2. Chúng thường nhỏ bé, có hình dáng hơi giống người và cực kỳ hung dữ, thường tấn công bằng răng hoặc móng vuốt. Mặc dù khá mỏng manh, chúng lại dễ bắt lửa một cách đáng ngạc nhiên."
      zh: "SCP-019会周期性地涌现出一些实体，统称为SCP-019-2。它们通常体型较小，隐约呈人形，极具攻击性，常以牙齿或爪子攻击。尽管相当脆弱，却出人意料地易燃。"
      zh_Hant: "SCP-019會週期性地湧現出一些實體，統稱為SCP-019-2。牠們通常體型較小，隱約呈人形，極具攻擊性，常以牙齒或爪子攻擊。儘管相當脆弱，卻出人意料地易燃。"

  - scene: >
      Medium shot, waist-up, eye level, a different framing from the
      close-up before. On the left side of the frame,
      attending-researcher-m sits at a control panel behind the glass,
      hand resting on a large incinerator activation switch, eyes fixed
      on the vase. On the right side of the frame, through the glass,
      several scp-019-2 creatures skitter across the grate below.
    characters: [attending-researcher-m, scp-019-2]
    caption:
      ja: "SCP-019は焼却炉を設置した鉄筋コンクリート製の部屋内で、幅広の格子床の上に置き、常時観測下に置くこと。SCP-019-2の個体が確認された場合、焼却炉を作動させること。"
      en: "SCP-019 is to be kept on a wide grate in a reinforced concrete room installed with an incinerator, under constant observation. If specimens of SCP-019-2 are observed, the incinerator is to be activated."
      cs: "SCP-019 musí být uchováváno na široké mříži v místnosti ze železobetonu vybavené spalovací pecí, pod neustálým dohledem. Pokud jsou pozorovány exempláře SCP-019-2, musí být spalovací pec aktivována."
      de: "SCP-019 ist auf einem breiten Gitterrost in einem Raum aus Stahlbeton unterzubringen, der mit einem Verbrennungsofen ausgestattet ist, unter ständiger Beobachtung. Werden Exemplare von SCP-019-2 beobachtet, ist der Verbrennungsofen zu aktivieren."
      es: "SCP-019 debe mantenerse sobre una rejilla ancha en una sala de hormigón reforzado equipada con un incinerador, bajo observación constante. Si se observan especímenes de SCP-019-2, se debe activar el incinerador."
      fr: "Le SCP-019 doit être maintenu sur une large grille dans une pièce en béton armé équipée d'un incinérateur, sous observation constante. Si des spécimens de SCP-019-2 sont observés, l'incinérateur doit être activé."
      it: "SCP-019 deve essere tenuto su una grande grata in una stanza di cemento armato dotata di un inceneritore, sotto osservazione costante. Se vengono osservati esemplari di SCP-019-2, l'inceneritore deve essere attivato."
      ko: "SCP-019은 소각로가 설치된 철근 콘크리트 방 안의 넓은 격자 위에 두고 지속적으로 관찰해야 한다. SCP-019-2 개체가 관측되면 소각로를 가동해야 한다."
      pl: "SCP-019 należy przechowywać na szerokiej kracie w pomieszczeniu z żelbetonu wyposażonym w spalarnię, pod stałą obserwacją. Jeśli zaobserwowane zostaną egzemplarze SCP-019-2, spalarnię należy uruchomić."
      pt: "O SCP-019 deve ser mantido sobre uma grelha larga em uma sala de concreto reforçado equipada com um incinerador, sob observação constante. Se espécimes de SCP-019-2 forem observados, o incinerador deve ser ativado."
      th: "SCP-019 ต้องเก็บไว้บนตะแกรงกว้างในห้องคอนกรีตเสริมเหล็กที่ติดตั้งเตาเผา ภายใต้การสังเกตอย่างต่อเนื่อง หากพบตัวอย่างของ SCP-019-2 ต้องเปิดใช้งานเตาเผาทันที"
      uk: "SCP-019 слід тримати на широких ґратах у приміщенні з залізобетону, обладнаному спалювальною піччю, під постійним наглядом. Якщо помічено екземпляри SCP-019-2, спалювальну піч слід активувати."
      vi: "SCP-019 phải được đặt trên một tấm lưới rộng trong một căn phòng bê tông cốt thép có lắp lò thiêu, dưới sự giám sát liên tục. Nếu quan sát thấy các cá thể SCP-019-2, lò thiêu phải được kích hoạt."
      zh: "SCP-019须置于装有焚化炉的钢筋混凝土房间内的宽大格栅上，并须持续受到观测。若观测到SCP-019-2个体，须立即启动焚化炉。"
      zh_Hant: "SCP-019須置於裝有焚化爐的鋼筋混凝土房間內的寬大格柵上，並須持續受到觀測。若觀測到SCP-019-2個體，須立即啟動焚化爐。"

  - scene: >
      Wide shot, full body, eye level, pulled back to show the whole
      room ablaze with the incinerator, a very different framing from
      the tight medium shot before. On the left side of the frame,
      attending-researcher-f and attending-researcher-m stand shoulder
      to shoulder wielding flamethrowers, twin jets of flame sweeping
      across the grate. On the right side of the frame, a small swarm of
      scp-019-2 creatures scatters in every direction amid the flames.
    characters: [attending-researcher-f, attending-researcher-m, scp-019-2]
    caption:
      ja: "SCP-019-2のアウトブレイクが発生した場合、個体単位であれば通常の火器で処分に成功するが、群れレベルのアウトブレイクの場合は火炎放射器の方が効果的である可能性がある。"
      en: "In the event of an outbreak of SCP-019-2, ordinary firearms are successful in terminating individual specimens, although in the case of a swarm-level outbreak, flamethrowers may be more effective."
      cs: "V případě propuknutí SCP-019-2 jsou k likvidaci jednotlivých exemplářů úspěšné běžné střelné zbraně, avšak v případě rojového výskytu mohou být účinnější plamenomety."
      de: "Im Falle eines Ausbruchs von SCP-019-2 sind gewöhnliche Schusswaffen zur Terminierung einzelner Exemplare erfolgreich, bei einem schwarmartigen Ausbruch können jedoch Flammenwerfer wirksamer sein."
      es: "En caso de un brote de SCP-019-2, las armas de fuego ordinarias son eficaces para eliminar especímenes individuales, aunque en el caso de un brote a nivel de enjambre, los lanzallamas pueden ser más eficaces."
      fr: "En cas d'épidémie de SCP-019-2, les armes à feu ordinaires permettent d'éliminer efficacement les spécimens individuels, bien qu'en cas d'épidémie de niveau essaim, les lance-flammes puissent être plus efficaces."
      it: "In caso di focolaio di SCP-019-2, le armi da fuoco ordinarie sono efficaci nell'eliminare gli esemplari individuali, sebbene in caso di focolaio a livello di sciame i lanciafiamme possano essere più efficaci."
      ko: "SCP-019-2의 발생 상황에서는 개별 개체 처분에 일반 화기가 효과적이지만, 무리 수준의 발생일 경우 화염방사기가 더 효과적일 수 있다."
      pl: "W przypadku wybuchu SCP-019-2 zwykła broń palna skutecznie eliminuje pojedyncze egzemplarze, jednak w przypadku wybuchu na poziomie roju skuteczniejsze mogą być miotacze ognia."
      pt: "No caso de um surto de SCP-019-2, armas de fogo comuns são eficazes para eliminar espécimes individuais, embora em caso de surto em nível de enxame, lança-chamas possam ser mais eficazes."
      th: "ในกรณีที่เกิดการระบาดของ SCP-019-2 อาวุธปืนธรรมดาสามารถกำจัดตัวอย่างเดี่ยวได้สำเร็จ แต่ในกรณีการระบาดระดับฝูง เครื่องพ่นไฟอาจมีประสิทธิภาพมากกว่า"
      uk: "У разі спалаху SCP-019-2 звичайна вогнепальна зброя успішно ліквідує окремі екземпляри, проте у разі спалаху рівня рою вогнемети можуть бути ефективнішими."
      vi: "Trong trường hợp bùng phát SCP-019-2, vũ khí thông thường có hiệu quả trong việc tiêu diệt các cá thể riêng lẻ, nhưng trong trường hợp bùng phát ở quy mô bầy đàn, súng phun lửa có thể hiệu quả hơn."
      zh: "若发生SCP-019-2的爆发，普通火器足以处决单个个体，但若是群体级别的爆发，火焰喷射器可能更为有效。"
      zh_Hant: "若發生SCP-019-2的爆發，普通火器足以處決單一個體，但若是群體級別的爆發，火焰噴射器可能更為有效。"
