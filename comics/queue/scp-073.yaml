local_characters:
  scp-073:
    name: "SCP-073"
    description: >
      A heavily tanned man in his early thirties (skin tone color RGB
      150,110,80), about 185cm tall, of Arabic/Middle Eastern descent,
      with black hair (color RGB 20,15,10) and blue eyes (color RGB
      60,110,170), wearing plain gray inmate-style clothing (color RGB
      130,130,130). Faint seams of dull artificial metal (color RGB
      100,100,105) are barely visible at his joints. A small angular
      symbol of Sumerian cuneiform origin is engraved on his forehead.

characters: [scp-073, attending-researcher-f, attending-researcher-m]

panels:
  - scene: >
      Wide shot, full body, showing the whole observation room. SCP-073
      stands calmly, hands folded in front of him, the faint metallic
      seams at his joints and the small engraved symbol on his forehead
      visible. attending-researcher-f stands nearby taking notes on a
      clipboard.
    characters: [scp-073, attending-researcher-f]
    caption:
      ja: "SCP-073は、30代前半のアラブ系または中東系とみられる、日焼けした男性の姿をしている。被験体の腕・脚・脊髄・肩甲骨は、正体不明の金属でできた人工物に置き換えられているように見える。被験体の額にはシュメール起源とみられる記号が刻まれている。"
      en: "SCP-073 appears to be a heavily-tanned male of Arabic or Middle Eastern descent in his early thirties. Arms, legs, spinal cord, and shoulder blades of the subject appear to have been replaced with artificial versions of unknown make and metal. There is a symbol engraved into the forehead of the subject, which appears to be of Sumerian origin."
      cs: "SCP-073 vypadá jako silně opálený muž arabského nebo blízkovýchodního původu, na počátku třicátých let. Paže, nohy, páteř a lopatky subjektu byly zjevně nahrazeny umělými verzemi z neznámého kovu neznámého původu. Na čele subjektu je vyryt symbol, který se zdá být sumerského původu."
      de: "SCP-073 erscheint als stark gebräunter Mann arabischer oder nahöstlicher Abstammung, Anfang dreißig. Arme, Beine, Wirbelsäule und Schulterblätter des Subjekts scheinen durch künstliche Versionen aus unbekanntem Metall unbekannter Herkunft ersetzt worden zu sein. Auf der Stirn des Subjekts ist ein Symbol eingraviert, das sumerischen Ursprungs zu sein scheint."
      es: "SCP-073 parece ser un hombre muy bronceado de ascendencia árabe o de Oriente Medio, de treinta y pocos años. Los brazos, piernas, columna vertebral y omóplatos del sujeto parecen haber sido reemplazados por versiones artificiales de fabricación y metal desconocidos. Hay un símbolo grabado en la frente del sujeto, que parece ser de origen sumerio."
      fr: "Le SCP-073 semble être un homme très bronzé d'origine arabe ou moyen-orientale, âgé d'une trentaine d'années. Les bras, les jambes, la colonne vertébrale et les omoplates du sujet semblent avoir été remplacés par des versions artificielles faites d'un métal et d'une fabrication inconnus. Un symbole est gravé sur le front du sujet, qui semble être d'origine sumérienne."
      it: "SCP-073 sembra essere un uomo dalla pelle molto abbronzata, di origine araba o mediorientale, sui trent'anni. Le braccia, le gambe, la colonna vertebrale e le scapole del soggetto sembrano essere state sostituite con versioni artificiali di fabbricazione e metallo sconosciuti. Sulla fronte del soggetto è inciso un simbolo che sembra essere di origine sumera."
      ko: "SCP-073는 짙게 그을린 피부를 가진 30대 초반의 아랍계 혹은 중동계 남성으로 보인다. 피험체의 팔, 다리, 척추, 견갑골은 정체불명의 제조 방식과 금속으로 이루어진 인공물로 대체된 것으로 보인다. 피험체의 이마에는 수메르 기원으로 보이는 문양이 새겨져 있다."
      pl: "SCP-073 wygląda jak mocno opalony mężczyzna pochodzenia arabskiego lub bliskowschodniego, po trzydziestce. Ramiona, nogi, kręgosłup i łopatki badanego wydają się zostały zastąpione sztucznymi wersjami z nieznanego metalu o nieznanym pochodzeniu. Na czole badanego wyryty jest symbol, który wydaje się mieć pochodzenie sumeryjskie."
      pt: "O SCP-073 parece ser um homem de pele muito bronzeada, de ascendência árabe ou do Oriente Médio, no início dos trinta anos. Os braços, pernas, coluna vertebral e omoplatas do sujeito parecem ter sido substituídos por versões artificiais de fabricação e metal desconhecidos. Há um símbolo gravado na testa do sujeito, que parece ser de origem suméria."
      th: "SCP-073 มีลักษณะเป็นชายผิวแทนเข้ม เชื้อสายอาหรับหรือตะวันออกกลาง อายุประมาณต้นสามสิบ แขน ขา ไขสันหลัง และกระดูกสะบักของผู้ทดลองดูเหมือนจะถูกแทนที่ด้วยชิ้นส่วนเทียมที่ทำจากโลหะที่ไม่ทราบแหล่งผลิต มีสัญลักษณ์สลักอยู่บนหน้าผากของผู้ทดลอง ซึ่งดูเหมือนจะมีต้นกำเนิดจากภาษาสุเมเรียน"
      uk: "SCP-073 виглядає як сильно засмаглий чоловік арабського чи близькосхідного походження, років трохи за тридцять. Руки, ноги, хребет і лопатки суб'єкта, здається, замінені штучними версіями з невідомого металу невідомого виробництва. На лобі суб'єкта викарбувано символ, який, здається, має шумерське походження."
      vi: "SCP-073 trông giống một người đàn ông da rám nắng đậm, gốc Ả Rập hoặc Trung Đông, ngoài ba mươi tuổi. Cánh tay, chân, cột sống và xương bả vai của đối tượng dường như đã được thay thế bằng các phiên bản nhân tạo làm từ kim loại không rõ nguồn gốc. Có một biểu tượng được khắc trên trán đối tượng, dường như có nguồn gốc từ người Sumer."
      zh: "SCP-073外表看起来是一名皮肤黝黑的男性，阿拉伯或中东裔，年约三十出头。该个体的双臂、双腿、脊柱和肩胛骨似乎已被替换为不明金属制成的人工版本。其额头上刻有一个符号，看似源自苏美尔文明。"
      zh_Hant: "SCP-073外表看起來是一名皮膚黝黑的男性，阿拉伯或中東裔，年約三十出頭。該個體的雙臂、雙腿、脊柱和肩胛骨似乎已被替換為不明金屬製成的人工版本。其額頭上刻有一個符號，看似源自蘇美文明。"

  - scene: >
      Medium shot, waist-up, a different framing from the wide shot
      before. SCP-073 speaks politely and gestures helpfully.
      attending-researcher-m stands beside him holding an open, thick
      dictionary, astonished, with a stopwatch on the table beside them
      showing about ninety seconds elapsed.
    characters: [scp-073, attending-researcher-m]
    caption:
      ja: "自らを「カイン」と呼ぶSCP-073は、話しかけてくる相手には概して礼儀正しく愛想が良い。写真的記憶力を持つと自称しており、1分半でざっと目を通しただけの800ページの辞書の全文を一字一句記憶していたという。"
      en: "SCP-073, who refers to itself as 'Cain', is generally polite and genial to all who speak to it. It has professed to having a photographic memory, remembering word-for-word all text in an eight-hundred-page dictionary that was flicked through in a minute and a half."
      cs: "SCP-073, které o sobě prohlašuje, že je „Kain“, je obecně zdvořilé a přívětivé ke všem, kdo s ním hovoří. Přiznává, že má fotografickou paměť, a zapamatovalo si doslovně veškerý text osmi set stránkového slovníku, který jen prolistovalo za minutu a půl."
      de: "SCP-073, das sich selbst „Kain“ nennt, ist im Allgemeinen höflich und freundlich zu allen, die mit ihm sprechen. Es hat behauptet, ein fotografisches Gedächtnis zu besitzen, und erinnerte sich Wort für Wort an den gesamten Text eines achthundertseitigen Wörterbuchs, das in anderthalb Minuten durchgeblättert wurde."
      es: "El SCP-073, que se hace llamar 'Caín', es generalmente cortés y afable con todos los que le hablan. Ha afirmado tener memoria fotográfica, recordando palabra por palabra todo el texto de un diccionario de ochocientas páginas que hojeó en un minuto y medio."
      fr: "Le SCP-073, qui se fait appeler « Caïn », est généralement poli et cordial envers tous ceux qui lui parlent. Il a affirmé posséder une mémoire photographique, se souvenant mot pour mot de tout le texte d'un dictionnaire de huit cents pages feuilleté en une minute et demie."
      it: "SCP-073, che si fa chiamare 'Caino', è generalmente educato e cordiale con chiunque gli parli. Ha dichiarato di possedere una memoria fotografica, ricordando parola per parola tutto il testo di un dizionario di ottocento pagine sfogliato in un minuto e mezzo."
      ko: "스스로를 '카인'이라 칭하는 SCP-073은 자신에게 말을 거는 모든 이에게 대체로 예의 바르고 상냥하다. 사진 기억력을 지녔다고 자칭하며, 1분 30초 만에 대충 훑어본 800페이지짜리 사전의 전체 내용을 한 글자도 틀리지 않고 기억했다고 한다."
      pl: "SCP-073, które nazywa siebie „Kainem”, jest zazwyczaj uprzejme i sympatyczne wobec wszystkich, którzy z nim rozmawiają. Twierdzi, że ma pamięć fotograficzną, i zapamiętało dosłownie cały tekst ośmiuset stronicowego słownika, który przekartkowało w półtorej minuty."
      pt: "O SCP-073, que se autodenomina 'Caim', é geralmente educado e afável com todos que falam com ele. Afirmou ter memória fotográfica, lembrando-se palavra por palavra de todo o texto de um dicionário de oitocentas páginas folheado em um minuto e meio."
      th: "SCP-073 ซึ่งเรียกตัวเองว่า 'เคน' มักสุภาพและเป็นมิตรกับทุกคนที่พูดคุยด้วย มันอ้างว่ามีความจำแบบภาพถ่าย โดยสามารถจดจำข้อความทั้งหมดในพจนานุกรมแปดร้อยหน้าได้คำต่อคำ หลังจากเปิดผ่านอย่างรวดเร็วเพียงหนึ่งนาทีครึ่ง"
      uk: "SCP-073, який називає себе «Каїном», зазвичай ввічливий і привітний з усіма, хто з ним розмовляє. Він стверджує, що має фотографічну пам'ять, дослівно запам'ятавши весь текст восьмисотсторінкового словника, який погортав за півтори хвилини."
      vi: "SCP-073, tự xưng là 'Cain', thường lịch sự và thân thiện với tất cả những ai nói chuyện với nó. Nó tự nhận có trí nhớ siêu phàm, nhớ nguyên văn toàn bộ nội dung của một cuốn từ điển tám trăm trang mà nó chỉ lướt qua trong một phút rưỡi."
      zh: "自称「该隐」的SCP-073对与之交谈的人普遍彬彬有礼、和蔼可亲。它自称拥有过目不忘的记忆力，仅用一分半钟翻阅过一本八百页的词典，便能一字不差地记住其中全部内容。"
      zh_Hant: "自稱「該隱」的SCP-073對與之交談的人普遍彬彬有禮、和藹可親。它自稱擁有過目不忘的記憶力，僅用一分半鐘翻閱過一本八百頁的詞典，便能一字不差地記住其中全部內容。"

  - scene: >
      Wide shot, pulled back, a low aerial-style angle over a grassy
      courtyard, a different framing from the medium shot before.
      SCP-073 walks calmly across the grass, leaving a visible trail of
      dead, barren brown earth radiating outward from his footsteps.
      attending-researcher-f and attending-researcher-m watch from a
      safe distance near a wall.
    characters: [scp-073, attending-researcher-f, attending-researcher-m]
    caption:
      ja: "SCP-073の存在は、土壌に根ざしたあらゆる生命にとって有害であり、半径20メートル以内のそうした生命を死滅させる。木材や紙など、土壌由来の生命から作られたものは、SCP-073が触れると即座に腐敗・崩壊する。"
      en: "SCP-073's presence is inimical to any and all life grown in soil, causing death to any such life within a twenty (20) meter radius. Anything derived from soil-grown life, such as wood and paper, immediately rots and disintegrates upon touch of SCP-073."
      cs: "Přítomnost SCP-073 je nepřátelská vůči veškerému životu rostoucímu v půdě, což způsobuje smrt jakéhokoli takového života v okruhu dvaceti (20) metrů. Cokoli odvozené z života rostoucího v půdě, jako je dřevo a papír, se při dotyku SCP-073 okamžitě rozkládá a rozpadá."
      de: "Die Anwesenheit von SCP-073 ist jeglichem im Boden wachsenden Leben feindlich gesinnt und verursacht den Tod solchen Lebens im Umkreis von zwanzig (20) Metern. Alles, was von im Boden gewachsenem Leben stammt, wie Holz und Papier, verrottet und zerfällt sofort bei Berührung durch SCP-073."
      es: "La presencia del SCP-073 es hostil a toda vida que crezca en el suelo, causando la muerte de dicha vida dentro de un radio de veinte (20) metros. Todo lo derivado de la vida que crece en el suelo, como la madera y el papel, se pudre y se desintegra inmediatamente al contacto con el SCP-073."
      fr: "La présence du SCP-073 est néfaste pour toute vie poussant dans le sol, provoquant la mort de toute vie de ce type dans un rayon de vingt (20) mètres. Tout ce qui dérive d'une vie poussant dans le sol, comme le bois et le papier, pourrit et se désintègre immédiatement au contact du SCP-073."
      it: "La presenza di SCP-073 è ostile a qualsiasi forma di vita che cresce nel suolo, causando la morte di tale vita entro un raggio di venti (20) metri. Qualsiasi cosa derivata da forme di vita cresciute nel suolo, come legno e carta, marcisce e si disintegra immediatamente al contatto con SCP-073."
      ko: "SCP-073의 존재는 흙에서 자라는 모든 생명체에 해로우며, 반경 20미터 이내의 그러한 생명체를 죽인다. 나무나 종이처럼 흙에서 자란 생명체에서 유래한 것은 SCP-073이 닿는 즉시 부패하고 붕괴한다."
      pl: "Obecność SCP-073 jest wroga wobec wszelkiego życia rosnącego w glebie, powodując śmierć takiego życia w promieniu dwudziestu (20) metrów. Wszystko, co pochodzi z życia rosnącego w glebie, jak drewno czy papier, natychmiast gnije i rozpada się po dotknięciu przez SCP-073."
      pt: "A presença do SCP-073 é hostil a toda vida que cresce no solo, causando a morte de tal vida num raio de vinte (20) metros. Qualquer coisa derivada de vida que cresce no solo, como madeira e papel, apodrece e se desintegra imediatamente ao toque do SCP-073."
      th: "การมีอยู่ของ SCP-073 เป็นอันตรายต่อสิ่งมีชีวิตใดๆ ที่เติบโตในดิน ทำให้สิ่งมีชีวิตดังกล่าวตายภายในรัศมียี่สิบ (20) เมตร สิ่งใดก็ตามที่ได้มาจากสิ่งมีชีวิตที่เติบโตในดิน เช่น ไม้และกระดาษ จะเน่าเปื่อยและสลายตัวทันทีเมื่อสัมผัสกับ SCP-073"
      uk: "Присутність SCP-073 є ворожою для будь-якого життя, що росте в ґрунті, спричиняючи загибель такого життя в радіусі двадцяти (20) метрів. Усе, що походить із життя, вирощеного в ґрунті, наприклад, дерево та папір, миттєво гниє й розпадається при дотику SCP-073."
      vi: "Sự hiện diện của SCP-073 gây hại cho bất kỳ sự sống nào mọc trong đất, gây chết cho sự sống như vậy trong bán kính hai mươi (20) mét. Bất cứ thứ gì có nguồn gốc từ sự sống mọc trong đất, chẳng hạn như gỗ và giấy, sẽ lập tức mục nát và phân rã khi chạm vào SCP-073."
      zh: "SCP-073的存在对一切生长于土壤中的生命都具有敌意，会导致半径二十（20）米范围内的此类生命死亡。任何源自土壤生长生命的物品，例如木材和纸张，一经SCP-073触碰便会立即腐烂崩解。"
      zh_Hant: "SCP-073的存在對一切生長於土壤中的生命都具有敵意，會導致半徑二十（20）公尺範圍內的此類生命死亡。任何源自土壤生長生命的物品，例如木材和紙張，一經SCP-073觸碰便會立即腐爛崩解。"

  - scene: >
      Medium shot, waist-up, a different framing from the wide shot
      before. attending-researcher-m raises a padded training baton
      toward SCP-073, who stands calmly with hands folded, unfazed. At
      the moment of contact, attending-researcher-m instead recoils and
      winces as if struck himself, cradling his own arm in surprise,
      while SCP-073 remains completely composed.
    characters: [attending-researcher-m, scp-073]
    caption:
      ja: "SCP-073に向けられた暴力は、それに与えられるはずだった損傷をそのまま攻撃者本人へと跳ね返す。ただしSCP-073自身は見た目上は無傷のままである。本人は、それでも行為の痛みは感じていると述べており、研究員に対し過度に有害な行為を控えるよう丁重に求めている。"
      en: "Violence directed towards SCP-073 reflects any damage inflicted on it directly back onto the attacker, although SCP-073 visibly remains unharmed. It has stated that it still feels the pain of the action, and has politely asked researchers to abstain from overly harmful actions to its person."
      cs: "Násilí namířené proti SCP-073 se odráží zpět a veškeré poškození, které by mělo zasáhnout SCP-073, dopadá přímo na útočníka, přestože SCP-073 zůstává navenek nezraněné. Prohlásilo, že přesto bolest takového jednání cítí, a zdvořile požádalo výzkumníky, aby se zdrželi příliš škodlivých činů vůči jeho osobě."
      de: "Gewalt gegen SCP-073 spiegelt jeden zugefügten Schaden direkt auf den Angreifer zurück, obwohl SCP-073 sichtbar unverletzt bleibt. Es hat erklärt, den Schmerz der Handlung trotzdem zu spüren, und die Forscher höflich gebeten, von übermäßig schädlichen Handlungen gegen seine Person abzusehen."
      es: "La violencia dirigida hacia el SCP-073 refleja cualquier daño infligido directamente de vuelta al atacante, aunque el SCP-073 permanece visiblemente ileso. Ha declarado que sigue sintiendo el dolor de la acción, y ha pedido cortésmente a los investigadores que se abstengan de realizar acciones excesivamente dañinas contra su persona."
      fr: "La violence dirigée contre le SCP-073 renvoie directement tout dommage infligé vers l'agresseur, bien que le SCP-073 reste visiblement indemne. Il a déclaré qu'il ressentait tout de même la douleur de l'acte, et a poliment demandé aux chercheurs de s'abstenir d'actions excessivement nuisibles envers sa personne."
      it: "La violenza diretta contro SCP-073 riflette qualsiasi danno inflitto direttamente sull'aggressore, sebbene SCP-073 rimanga visibilmente illeso. Ha dichiarato di provare comunque il dolore dell'azione, e ha chiesto educatamente ai ricercatori di astenersi da azioni eccessivamente dannose nei suoi confronti."
      ko: "SCP-073에게 가해지는 폭력은 그것에 입혔을 손상을 그대로 공격자 본인에게 되돌려 보내는데, SCP-073 자신은 겉보기에 아무런 해도 입지 않는다. 그것은 그럼에도 그 행위의 고통을 느낀다고 밝혔으며, 연구원들에게 자신에게 지나치게 해로운 행위를 삼가 달라고 정중히 요청했다."
      pl: "Przemoc skierowana przeciwko SCP-073 odbija wszelkie uszkodzenia zadane bezpośrednio z powrotem na napastnika, choć samo SCP-073 pozostaje widocznie nietknięte. Stwierdziło, że mimo to nadal odczuwa ból tego działania, i uprzejmie poprosiło badaczy o powstrzymanie się od nadmiernie szkodliwych działań wobec jego osoby."
      pt: "A violência dirigida contra o SCP-073 reflete de volta diretamente para o agressor qualquer dano infligido, embora o SCP-073 permaneça visivelmente ileso. Ele afirmou que ainda sente a dor da ação, e pediu educadamente aos pesquisadores que se abstenham de ações excessivamente prejudiciais à sua pessoa."
      th: "ความรุนแรงที่มุ่งเป้าไปที่ SCP-073 จะสะท้อนความเสียหายใดๆ ที่เกิดขึ้นกลับไปยังผู้โจมตีโดยตรง แม้ว่า SCP-073 จะยังคงไม่ได้รับบาดเจ็บให้เห็นก็ตาม มันระบุว่ายังคงรู้สึกเจ็บปวดจากการกระทำนั้นอยู่ดี และได้ขอร้องอย่างสุภาพให้นักวิจัยงดเว้นการกระทำที่เป็นอันตรายเกินควรต่อตัวมัน"
      uk: "Насильство, спрямоване проти SCP-073, безпосередньо повертає будь-яку завдану шкоду нападнику, хоча сам SCP-073 залишається видимо неушкодженим. Він заявив, що все одно відчуває біль від такої дії, і ввічливо попросив дослідників утриматися від надмірно шкідливих дій щодо його особи."
      vi: "Bạo lực nhắm vào SCP-073 sẽ phản chiếu bất kỳ tổn hại nào gây ra trực tiếp trở lại kẻ tấn công, mặc dù SCP-073 vẫn không hề hấn gì có thể thấy được. Nó cho biết vẫn cảm nhận được cơn đau của hành động đó, và đã lịch sự yêu cầu các nhà nghiên cứu kiềm chế các hành động gây hại quá mức đối với bản thân nó."
      zh: "针对SCP-073的暴力行为，会将造成的伤害直接反弹到攻击者本人身上，而SCP-073本身则明显毫发无损。它表示自己仍能感受到该行为带来的痛楚，并礼貌地请求研究人员克制，不要对它做出过度伤害性的举动。"
      zh_Hant: "針對SCP-073的暴力行為，會將造成的傷害直接反彈到攻擊者本人身上，而SCP-073本身則明顯毫髮無損。它表示自己仍能感受到該行為帶來的痛楚，並禮貌地請求研究人員克制，不要對它做出過度傷害性的舉動。"
