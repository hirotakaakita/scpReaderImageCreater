id: scp-020
title:
  ja: "SCP-020 — 見えないカビ"
  en: "SCP-020 — Unseen Mold"
  cs: "SCP-020 — Neviditelná plíseň"
  de: "SCP-020 — Ungesehener Schimmel"
  es: "SCP-020 — Moho invisible"
  fr: "SCP-020 — Moisissure invisible"
  it: "SCP-020 — Muffa invisibile"
  ko: "SCP-020 — 보이지 않는 곰팡이"
  pl: "SCP-020 — Niewidzialna pleśń"
  pt: "SCP-020 — Mofo invisível"
  th: "SCP-020 — ราที่มองไม่เห็น"
  uk: "SCP-020 — Невидима пліснява"
  vi: "SCP-020 — Mốc vô hình"
  zh: "SCP-020 — 看不见的霉菌"
  zh_Hant: "SCP-020 — 看不見的黴菌"
object_class: Keter
attribution:
  article: "SCP-020 — Unseen Mold"
  source_url: "https://scp-wiki.wikidot.com/scp-020"
  author: "Unknown Author / SCP Foundation"
local_characters:
  scp-020:
    name: "SCP-020"
    appearance: "A fast-spreading fungal organism effectively invisible to direct human observation, visible only through photographic or video surveillance."
    default_look: "Show as hidden mold revealed on camera screens or photos, not as visible mold to naked eyes."
panels:
  - scene: >
      A living room appears clean to the naked eye, while a surveillance monitor beside it shows dark fungal growths covering walls and furniture.
      The real room view remains visually empty. No readable text.
    characters: [scp-020]
    source:
      section: Description
      quote: "Samples of SCP-020 exhibit an unknown effect that renders them effectively invisible to direct observation... only visible... through photographic or video surveillance."
      url: "https://scp-wiki.wikidot.com/scp-020"
      fetched_at: "2026-09-21T00:00:00Z"
    caption:
      ja: "SCP-020は直接観察では事実上見えず、写真や映像監視を通した場合にのみ人間に見えます。"
      en: "SCP-020 is effectively invisible to direct observation and becomes visible to humans only through photo or video surveillance."
      cs: "SCP-020 je při přímém pozorování prakticky neviditelné a lidem se ukáže jen na fotografii nebo videu."
      de: "SCP-020 ist bei direkter Beobachtung praktisch unsichtbar und für Menschen nur über Foto- oder Videoüberwachung sichtbar."
      es: "SCP-020 es prácticamente invisible a la observación directa y solo se hace visible mediante fotografía o video."
      fr: "SCP-020 est pratiquement invisible à l’observation directe et n’est visible qu’en photo ou vidéo."
      it: "SCP-020 è praticamente invisibile all’osservazione diretta e diventa visibile solo tramite foto o video."
      ko: "SCP-020은 직접 관찰로는 사실상 보이지 않으며 사진이나 영상 감시를 통해서만 사람에게 보입니다."
      pl: "SCP-020 jest praktycznie niewidoczny przy bezpośredniej obserwacji i widoczny dla ludzi tylko na zdjęciu lub wideo."
      pt: "SCP-020 é praticamente invisível à observação direta e só se torna visível por foto ou vídeo."
      th: "SCP-020 แทบมองไม่เห็นด้วยการสังเกตโดยตรง และมนุษย์จะเห็นได้ผ่านภาพถ่ายหรือวิดีโอเท่านั้น"
      uk: "SCP-020 фактично невидимий при прямому спостереженні й стає видимим для людей лише через фото або відео."
      vi: "SCP-020 gần như vô hình khi quan sát trực tiếp và chỉ hiện ra với con người qua ảnh hoặc video."
      zh: "SCP-020在直接观察下几乎不可见，只有通过照片或视频监控才会被人类看到。"
      zh_Hant: "SCP-020在直接觀察下幾乎不可見，只有透過照片或影片監控才會被人類看到。"
  - scene: >
      A warm, humid home interior: a resident turns up heat and humidifiers while inviting guests inside, unaware invisible mold is spreading.
      Show social warmth and hidden danger, no text.
    characters: [scp-020]
    source:
      section: Description
      quote: "Affected subjects will increase the heat and humidity within their homes... Affected subjects also become more sociable... invite acquaintances to their homes"
      url: "https://scp-wiki.wikidot.com/scp-020"
      fetched_at: "2026-09-21T00:00:00Z"
    caption:
      ja: "SCP-020の胞子は周囲の人間に、家の温度と湿度を上げ、知人を招いて拡散を助ける行動を取らせます。"
      en: "Its spores make nearby humans raise heat and humidity at home and become more sociable, inviting others inside."
      cs: "Jeho spory nutí lidi v okolí zvyšovat doma teplo a vlhkost a být společnější, takže zvou další dovnitř."
      de: "Seine Sporen veranlassen Menschen in der Nähe, Wärme und Feuchtigkeit im Haus zu erhöhen und geselliger zu werden."
      es: "Sus esporas hacen que las personas cercanas aumenten el calor y la humedad del hogar y se vuelvan más sociables."
      fr: "Ses spores poussent les humains proches à augmenter chaleur et humidité chez eux et à devenir plus sociables."
      it: "Le sue spore inducono gli umani vicini ad aumentare calore e umidità in casa e a diventare più socievoli."
      ko: "그 포자는 주변 사람들이 집의 열과 습도를 높이고 더 사교적으로 되어 다른 사람을 초대하게 만듭니다."
      pl: "Jego zarodniki skłaniają ludzi w pobliżu do podnoszenia temperatury i wilgotności w domu oraz do większej towarzyskości."
      pt: "Seus esporos fazem humanos próximos aumentarem o calor e a umidade em casa e se tornarem mais sociáveis."
      th: "สปอร์ของมันทำให้คนใกล้เคียงเพิ่มความร้อนและความชื้นในบ้าน และเข้าสังคมมากขึ้นจนชวนคนอื่นเข้ามา"
      uk: "Його спори змушують людей поруч підвищувати тепло й вологість удома та ставати більш товариськими."
      vi: "Bào tử của nó khiến người xung quanh tăng nhiệt và độ ẩm trong nhà, đồng thời trở nên hòa đồng hơn."
      zh: "其孢子会让附近人类提高家中温度和湿度，并变得更善交际、邀请他人进入。"
      zh_Hant: "其孢子會讓附近人類提高家中溫度和濕度，並變得更善交際、邀請他人進入。"
  - scene: >
      Camera-view contrast: on a video monitor, mold colonies grow directly on a person's clothing and skin, while the person looking down sees nothing.
      No gore, no text.
    characters: [scp-020]
    source:
      section: Description
      quote: "As the spores and mold colonies are invisible to affected subjects, the mold may sometimes grow directly on living subjects."
      url: "https://scp-wiki.wikidot.com/scp-020"
      fetched_at: "2026-09-21T00:00:00Z"
    caption:
      ja: "胞子やカビの群落は感染者には見えないため、SCP-020は生きた対象の上に直接成長することもあります。"
      en: "Because affected subjects cannot see the spores or colonies, SCP-020 can grow directly on living subjects."
      cs: "Protože zasažení nevidí spory ani kolonie, může SCP-020 růst přímo na živých subjektech."
      de: "Da Betroffene Sporen und Kolonien nicht sehen können, kann SCP-020 direkt auf lebenden Subjekten wachsen."
      es: "Como los afectados no ven las esporas ni colonias, SCP-020 puede crecer directamente sobre sujetos vivos."
      fr: "Comme les sujets affectés ne voient pas les spores ni les colonies, SCP-020 peut pousser directement sur des êtres vivants."
      it: "Poiché i soggetti colpiti non vedono spore o colonie, SCP-020 può crescere direttamente su esseri viventi."
      ko: "영향받은 대상은 포자와 군체를 볼 수 없기 때문에 SCP-020은 살아 있는 대상 위에서 직접 자랄 수 있습니다."
      pl: "Ponieważ dotknięte osoby nie widzą spor ani kolonii, SCP-020 może rosnąć bezpośrednio na żywych podmiotach."
      pt: "Como os afetados não veem esporos ou colônias, SCP-020 pode crescer diretamente em sujeitos vivos."
      th: "เพราะผู้ได้รับผลกระทบมองไม่เห็นสปอร์หรือกลุ่มรา SCP-020 จึงอาจเติบโตบนสิ่งมีชีวิตโดยตรง"
      uk: "Оскільки уражені не бачать спор і колоній, SCP-020 може рости безпосередньо на живих суб’єктах."
      vi: "Vì người bị ảnh hưởng không thấy bào tử hay khuẩn lạc, SCP-020 có thể mọc trực tiếp trên cơ thể sống."
      zh: "由于受影响对象看不见孢子和菌落，SCP-020有时会直接在活体对象身上生长。"
      zh_Hant: "由於受影響對象看不見孢子和菌落，SCP-020有時會直接在活體對象身上生長。"
  - scene: >
      Final outbreak scene: emergency responders and health workers approach a house under camera surveillance, while invisible mold threatens to spread through bodies and transport.
      No gore, no readable text.
    characters: [scp-020, mtf-agent]
    source:
      section: Description
      quote: "As the spores and colonies within a home approach critical concentration, the health of affected human subjects will rapidly deteriorate, resulting in death. Further spread... may occur as the bodies... are encountered by emergency responders and health care agents"
      url: "https://scp-wiki.wikidot.com/scp-020"
      fetched_at: "2026-09-21T00:00:00Z"
    caption:
      ja: "家屋内の胞子と群落が臨界濃度に近づくと、感染者の健康は急速に悪化し、遺体を扱う救急・医療関係者によって拡散が続く可能性があります。"
      en: "At critical concentration, affected humans rapidly deteriorate and die, and responders or medical agents can carry the mold farther."
      cs: "Při kritické koncentraci se stav zasažených lidí rychle zhorší a zemřou; záchranáři či zdravotníci mohou plíseň šířit dál."
      de: "Bei kritischer Konzentration verschlechtert sich der Zustand Betroffener rasch bis zum Tod, und Einsatz- oder medizinisches Personal kann den Schimmel weitertragen."
      es: "A concentración crítica, los humanos afectados se deterioran rápidamente y mueren, y socorristas o sanitarios pueden propagar más el moho."
      fr: "À concentration critique, les humains affectés se détériorent rapidement et meurent, puis les secours ou soignants peuvent propager la moisissure."
      it: "A concentrazione critica, gli umani colpiti peggiorano rapidamente e muoiono; soccorritori o sanitari possono diffondere la muffa."
      ko: "임계 농도에 가까워지면 감염자의 건강은 급속히 악화되어 사망하고, 구조대나 의료진이 곰팡이를 더 퍼뜨릴 수 있습니다."
      pl: "Przy krytycznym stężeniu stan ludzi szybko się pogarsza aż do śmierci, a ratownicy lub medycy mogą przenieść pleśń dalej."
      pt: "Em concentração crítica, humanos afetados deterioram rapidamente e morrem, e socorristas ou agentes de saúde podem espalhar o mofo."
      th: "เมื่อความเข้มข้นถึงระดับวิกฤต สุขภาพของผู้ได้รับผลกระทบจะทรุดลงอย่างรวดเร็วจนเสียชีวิต และเจ้าหน้าที่กู้ภัยหรือแพทย์อาจพาราแพร่ต่อไป"
      uk: "За критичної концентрації стан уражених людей швидко погіршується до смерті, а рятувальники чи медики можуть рознести плісняву далі."
      vi: "Khi đạt nồng độ tới hạn, người bị ảnh hưởng suy sụp nhanh và chết; nhân viên cứu hộ hoặc y tế có thể mang mốc đi xa hơn."
      zh: "当室内孢子和菌落接近临界浓度时，受影响者健康会迅速恶化死亡，急救和医疗人员可能继续传播霉菌。"
      zh_Hant: "當室內孢子和菌落接近臨界濃度時，受影響者健康會迅速惡化死亡，急救和醫療人員可能繼續傳播黴菌。"}