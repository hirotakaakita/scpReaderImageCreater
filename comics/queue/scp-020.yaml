# SCP-020 4コマ台本
# captionはSpecial Containment Procedures / Description本文からの引用。
# 「町の住民を処分し森林火災を装って焼却した」という記述とAddendum 020-01
# （銃撃戦の音声記録）はグロ・大量殺人描写のため本編から意図的に外した。
# キャラにセリフは言わせない。JP公式訳が直接取得できなかったため、検証済みの
# 英語本文からの翻訳（ja含む）。

