# SCP-070 4コマ台本
# captionはSpecial Containment Procedures / Description本文からの引用。
# 負傷時の苦痛描写・攻撃的行動の描写は使用しない。addendumはIncident 070-1
# （夢遊病で食堂を襲撃した無害な逸話）のみ1行で使用。キャラにセリフは言わせない。

