# SCP-682「不死身の爬虫類」4コマ台本
# captionは記事本文（Special Containment Procedures / Description）からの引用のみ。
# 「全生命への憎悪」「戦闘・破壊描写」等のグロテスクになりやすい部分は避け、
# 収容手順の皮肉な滑稽さ（収容用の酸そのものを栄養にして再生する、話しかける
# ことすら禁止、交戦には最低7人必要という官僚的な物々しさ）を軸にした軽い
# コメディにしている。補遺（インタビュー記録・収容違反記録等）は使わない。
# キャラにセリフは言わせない。

id: scp-682

title:
  en: "SCP-682: The Undying Reptile"
  ja: "SCP-682：不死身の爬虫類"
  cs: "SCP-682: Nesmrtelný plaz"
  de: "SCP-682: Das Unsterbliche Reptil"
  es: "SCP-682: El Reptil Indestructible"
  fr: "SCP-682 : Le Reptile Indestructible"
  it: "SCP-682: Il Rettile Indistruttibile"
  ko: "SCP-682: 불사의 파충류"
  pl: "SCP-682: Nieśmiertelny Gad"
  pt: "SCP-682: O Réptil Imortal"
  th: "SCP-682: สัตว์เลื้อยคลานอมตะ"
  uk: "SCP-682: Невмирущий Плазун"
  vi: "SCP-682: Loài Bò Sát Bất Tử"
  zh: "SCP-682：不死爬行动物"
  zh_Hant: "SCP-682：不死爬蟲動物"

attribution:
  article: "SCP-682"
  author: "Dr Gears and Epic Phail Spy"
  source_url: "http://scp-wiki.wikidot.com/scp-682"
  license: "CC BY-SA 3.0"

object_class: Keter

local_characters:
  scp-682:
    name: SCP-682
    description: >
      SCP-682, a large, vaguely reptile-like creature of considerable
      size, with thick armored scales in a mottled dark green (color RGB
      45,70,40) fading to charred, uneven patches of black (color RGB
      25,25,25) where the acid has eaten into its hide. Its body shape is
      irregular and asymmetrical, with limbs of mismatched proportions and
      rows of blunt spines along its back. Its eyes are a pale sickly
      yellow (color RGB 210,200,90), watching everything with unsettling
      intelligence.

characters: [scp-682, attending-researcher-m, attending-researcher-f]

panels:
  - scene: >
      Wide shot, full chamber, eye level, showing a stark reinforced
      containment chamber with heavy steel plating on every surface, its
      floor filled with a churning pool of hydrochloric acid. Submerged
      chest-deep in the acid, SCP-682 stands motionless in the center of
      the frame, its reptilian form only partly visible above the
      surface.
    characters: [scp-682]
    caption:
      ja: "SCP-682は内側の表面全てを25cmの耐酸性の強化鋼板で補強した5m×5m×5mの収容室に収容してください。収容室はSCP-682が完全に浸かり無力化するほどの塩酸で満たしてください。"
      en: "SCP-682 should be contained within a 5 m x 5 m x 5 m chamber with 25 cm reinforced acid-resistant steel plate lining all inside surfaces. The containment chamber should be filled with hydrochloric acid until SCP-682 is submerged and incapacitated."
      cs: "SCP-682 by mělo být umístěno v komoře o rozměrech 5 m x 5 m x 5 m, jejíž veškeré vnitřní povrchy jsou vyztuženy 25 cm silnou, kyselinovzdornou ocelovou deskou. Zadržovací komora by měla být naplněna kyselinou chlorovodíkovou, dokud není SCP-682 zcela ponořeno a znehybněno."
      de: "SCP-682 sollte in einer 5 m x 5 m x 5 m großen Kammer untergebracht werden, deren gesamte Innenflächen mit 25 cm dickem, säurebeständigem Panzerstahl verkleidet sind. Die Eindämmungskammer sollte mit Salzsäure gefüllt werden, bis SCP-682 vollständig untergetaucht und handlungsunfähig ist."
      es: "SCP-682 debe estar contenido dentro de una cámara de 5 m x 5 m x 5 m con placas de acero reforzado resistente a ácidos de 25 cm revistiendo todas las superficies interiores. La cámara de contención debe llenarse con ácido clorhídrico hasta que SCP-682 quede sumergido e incapacitado."
      fr: "SCP-682 doit être confiné dans une chambre de 5 m x 5 m x 5 m dont toutes les surfaces intérieures sont doublées d'une plaque d'acier renforcée résistante aux acides de 25 cm. La chambre de confinement doit être remplie d'acide chlorhydrique jusqu'à ce que SCP-682 soit submergé et immobilisé."
      it: "SCP-682 dovrebbe essere contenuto in una camera di 5 m x 5 m x 5 m con lastre d'acciaio rinforzato resistente agli acidi spesse 25 cm che rivestono tutte le superfici interne. La camera di contenimento dovrebbe essere riempita di acido cloridrico finché SCP-682 non risulta sommerso e incapacitato."
      ko: "SCP-682는 내부 표면 전체가 25cm 두께의 내산성 강화 강판으로 덧대어진 5m x 5m x 5m 크기의 방에 수용해야 한다. 수용실은 SCP-682가 완전히 잠겨 무력화될 때까지 염산으로 채워야 한다."
      pl: "SCP-682 powinno być przetrzymywane w komorze o wymiarach 5 m x 5 m x 5 m, której wszystkie wewnętrzne powierzchnie wyłożone są 25-centymetrową, wzmocnioną, odporną na kwasy blachą stalową. Komora powinna być wypełniona kwasem solnym, dopóki SCP-682 nie zostanie całkowicie zanurzone i unieszkodliwione."
      pt: "O SCP-682 deve ser contido dentro de uma câmara de 5 m x 5 m x 5 m com placas de aço reforçado resistente a ácido de 25 cm revestindo todas as superfícies internas. A câmara de contenção deve ser preenchida com ácido clorídrico até que o SCP-682 esteja submerso e incapacitado."
      th: "SCP-682 ควรถูกกักกันไว้ในห้องขนาด 5 x 5 x 5 เมตร โดยบุผนังภายในทุกด้านด้วยแผ่นเหล็กเสริมแรงทนกรดหนา 25 เซนติเมตร ห้องกักกันควรเติมด้วยกรดไฮโดรคลอริกจนกระทั่ง SCP-682 จมอยู่ใต้น้ำและถูกทำให้ไร้ความสามารถ"
      uk: "SCP-682 слід утримувати в камері розміром 5 x 5 x 5 м, усі внутрішні поверхні якої обшиті посиленою кислотостійкою сталевою плитою товщиною 25 см. Камеру утримання слід заповнити соляною кислотою, доки SCP-682 не буде повністю занурений і знешкоджений."
      vi: "SCP-682 nên được giam giữ trong một buồng kích thước 5 m x 5 m x 5 m với tấm thép gia cố chống axit dày 25 cm lót toàn bộ bề mặt bên trong. Buồng giam giữ nên được đổ đầy axit clohydric cho đến khi SCP-682 chìm hoàn toàn và mất khả năng hoạt động."
      zh: "SCP-682应被收容于一个5米x5米x5米的密室中，内壁全部以25厘米厚的耐酸强化钢板衬里。收容室应注满盐酸，直至SCP-682完全浸没并失去行动能力。"
      zh_Hant: "SCP-682應被收容於一個5公尺x5公尺x5公尺的密室中，內壁全部以25公分厚的耐酸強化鋼板襯裡。收容室應注滿鹽酸，直至SCP-682完全浸沒並失去行動能力。"

  - scene: >
      Medium shot, waist-up, through a thick observation window. On the
      left side of the frame, attending-researcher-f holds up a growth
      chart, comparing it uneasily to what she sees beyond the glass. On
      the right side of the frame, SCP-682 floats visibly larger and
      glossier than before, gill-like slits along its nostrils flaring as
      it draws in the surrounding acid.
    characters: [attending-researcher-f, scp-682]
    caption:
      ja: "消化はSCP-682の鼻孔内部にある濾過を行なうエラに助けられているようです。そのエラはあらゆる溶液から使用可能な物質を取り除くことができ、収容コンテナの酸から常にSCP-682が再生することを可能にしています。"
      en: "Digestion seems to be aided by a set of filtering gills inside of SCP-682's nostrils, which are able to remove usable matter from any liquid solution, enabling it to constantly regenerate from the acid it is contained in."
      cs: "Zdá se, že trávení napomáhá soustava filtračních žáber uvnitř nozder SCP-682, které dokáží z jakéhokoli kapalného roztoku odebírat využitelnou hmotu, což mu umožňuje neustále se regenerovat z kyseliny, ve které je uchováváno."
      de: "Die Verdauung scheint durch ein Set filternder Kiemen in den Nasenlöchern von SCP-682 unterstützt zu werden, die aus jeder flüssigen Lösung verwertbare Materie entfernen können, wodurch es sich ständig aus der Säure regenerieren kann, in der es gehalten wird."
      es: "La digestión parece verse favorecida por un conjunto de branquias filtrantes dentro de las fosas nasales de SCP-682, capaces de extraer materia utilizable de cualquier solución líquida, lo que le permite regenerarse constantemente a partir del ácido en el que está contenido."
      fr: "La digestion semble facilitée par un ensemble de branchies filtrantes situées à l'intérieur des narines de SCP-682, capables d'extraire de la matière utilisable de toute solution liquide, lui permettant de se régénérer en permanence grâce à l'acide dans lequel il est confiné."
      it: "La digestione sembra essere favorita da una serie di branchie filtranti all'interno delle narici di SCP-682, in grado di estrarre materia utilizzabile da qualsiasi soluzione liquida, permettendogli di rigenerarsi costantemente a partire dall'acido in cui è contenuto."
      ko: "소화는 SCP-682의 콧구멍 안에 있는 여과 아가미 조직의 도움을 받는 것으로 보이며, 이는 어떤 액체 용액에서도 사용 가능한 물질을 추출할 수 있어 자신이 수용된 산으로부터 끊임없이 재생할 수 있게 한다."
      pl: "Trawieniu wydaje się pomagać zestaw filtrujących skrzeli wewnątrz nozdrzy SCP-682, które są w stanie usuwać przydatną materię z dowolnego roztworu ciekłego, umożliwiając mu nieustanną regenerację z kwasu, w którym jest przetrzymywane."
      pt: "A digestão parece ser auxiliada por um conjunto de guelras filtrantes dentro das narinas do SCP-682, capazes de remover matéria utilizável de qualquer solução líquida, permitindo-lhe regenerar-se constantemente a partir do ácido em que está contido."
      th: "การย่อยอาหารดูเหมือนจะได้รับความช่วยเหลือจากชุดเหงือกกรองภายในรูจมูกของ SCP-682 ซึ่งสามารถสกัดสารที่ใช้ได้จากสารละลายของเหลวใดๆ ทำให้มันสามารถงอกใหม่ได้อย่างต่อเนื่องจากกรดที่มันถูกกักกันอยู่"
      uk: "Здається, травленню сприяє набір фільтрувальних зябер усередині ніздрів SCP-682, здатних вилучати придатну речовину з будь-якого рідкого розчину, що дає йому змогу постійно регенерувати за рахунок кислоти, в якій він утримується."
      vi: "Có vẻ như quá trình tiêu hóa được hỗ trợ bởi một bộ mang lọc bên trong lỗ mũi của SCP-682, có khả năng chiết xuất vật chất hữu dụng từ bất kỳ dung dịch lỏng nào, cho phép nó liên tục tái sinh từ chính axit đang giam giữ nó."
      zh: "其消化似乎由位于SCP-682鼻孔内的一组过滤鳃辅助，这些鳃能够从任何液态溶液中提取可用物质，使其能够不断从收容自己的酸液中再生。"
      zh_Hant: "其消化似乎由位於SCP-682鼻孔內的一組過濾鰓輔助，這些鰓能夠從任何液態溶液中提取可用物質，使其能夠不斷從收容自己的酸液中再生。"

  - scene: >
      Close-up shot on two faces pressed near the observation glass. On
      the left side of the frame, attending-researcher-m opens his mouth
      as if about to call out to SCP-682 beyond the glass. On the right
      side of the frame, attending-researcher-f claps a hand firmly over
      his mouth, eyes wide with alarm.
    characters: [attending-researcher-m, attending-researcher-f]
    caption:
      ja: "刺激すると激怒する可能性があるため、職員がSCP-682と話すことは禁じられています。許可されていない職員がSCP-682と接触しようとした場合は武力をもって拘束し、追い出します。"
      en: "Personnel are forbidden to speak to SCP-682, for fear of provoking a rage-state. All unauthorized personnel attempting to communicate to SCP-682 will be restrained and removed by force."
      cs: "Personálu je zakázáno mluvit se SCP-682 ze strachu z vyprovokování stavu vzteku. Veškerý neoprávněný personál, který se pokusí komunikovat se SCP-682, bude zadržen a násilně odveden."
      de: "Personal ist es untersagt, mit SCP-682 zu sprechen, aus Angst, einen Wutzustand auszulösen. Jegliches unbefugte Personal, das versucht, mit SCP-682 zu kommunizieren, wird festgehalten und mit Gewalt entfernt."
      es: "Se prohíbe al personal hablar con SCP-682, por temor a provocar un estado de furia. Todo el personal no autorizado que intente comunicarse con SCP-682 será restringido y retirado por la fuerza."
      fr: "Il est interdit au personnel de parler à SCP-682, de peur de provoquer un état de rage. Tout personnel non autorisé tentant de communiquer avec SCP-682 sera maîtrisé et évacué par la force."
      it: "Al personale è vietato parlare con SCP-682, per timore di provocare uno stato di furia. Tutto il personale non autorizzato che tenti di comunicare con SCP-682 verrà immobilizzato e allontanato con la forza."
      ko: "격노 상태를 유발할 우려가 있으므로 직원은 SCP-682에게 말을 거는 것이 금지된다. SCP-682와 소통을 시도하는 모든 비인가 직원은 제압되어 강제로 퇴거된다."
      pl: "Personelowi zabrania się rozmawiać z SCP-682 w obawie przed wywołaniem stanu wściekłości. Cały nieupoważniony personel próbujący porozumiewać się z SCP-682 zostanie obezwładniony i usunięty siłą."
      pt: "É proibido ao pessoal falar com o SCP-682, por medo de provocar um estado de fúria. Todo o pessoal não autorizado que tentar se comunicar com o SCP-682 será contido e removido à força."
      th: "ห้ามเจ้าหน้าที่พูดคุยกับ SCP-682 เนื่องจากเกรงว่าจะกระตุ้นให้เกิดสภาวะคลุ้มคลั่ง เจ้าหน้าที่ที่ไม่ได้รับอนุญาตซึ่งพยายามสื่อสารกับ SCP-682 จะถูกควบคุมตัวและนำตัวออกไปด้วยกำลัง"
      uk: "Персоналу заборонено розмовляти з SCP-682, побоюючись спровокувати стан люті. Будь-який неавторизований персонал, який намагається спілкуватися з SCP-682, буде затриманий і видалений силою."
      vi: "Nhân viên bị cấm nói chuyện với SCP-682 vì sợ kích động trạng thái giận dữ. Bất kỳ nhân viên trái phép nào cố gắng giao tiếp với SCP-682 sẽ bị khống chế và đưa ra ngoài bằng vũ lực."
      zh: "禁止人员与SCP-682交谈，以免激起其暴怒状态。任何试图与SCP-682交流的未授权人员都将被强制制服并带离。"
      zh_Hant: "禁止人員與SCP-682交談，以免激起其暴怒狀態。任何試圖與SCP-682交流的未授權人員都將被強制制服並帶離。"

  - scene: >
      Medium shot, low angle, briefing room. On the left side of the
      frame, attending-researcher-m holds up a clipboard listing
      emergency containment-breach protocol, tapping a line partway down
      the page. On the right side of the frame, attending-researcher-f
      stares at the clipboard, mouth slightly open, visibly daunted by
      what it demands.
    characters: [attending-researcher-m, attending-researcher-f]
    caption:
      ja: "収容違反が発生した場合、出動可能な全ての機動部隊によってSCP-682の追跡、再捕獲が行われます。この際、メンバーが7名未満のチームがSCP-682と交戦することは認められません。"
      en: "In case of containment breach, SCP-682 is to be tracked and re-captured by all available Mobile Task Forces, and no teams with fewer than seven (7) members are cleared to engage it."
      cs: "V případě narušení zadržení má být SCP-682 sledováno a znovu zajato všemi dostupnými mobilními zásahovými jednotkami, přičemž žádný tým s méně než sedmi (7) členy není oprávněn se s ním střetnout."
      de: "Im Falle eines Eindämmungsdurchbruchs ist SCP-682 von allen verfügbaren mobilen Einsatzkommandos aufzuspüren und wieder einzufangen, wobei kein Team mit weniger als sieben (7) Mitgliedern zum Einsatz freigegeben ist."
      es: "En caso de fuga de contención, SCP-682 debe ser rastreado y recapturado por todas las Fuerzas de Tarea Móviles disponibles, y ningún equipo con menos de siete (7) miembros está autorizado a enfrentarlo."
      fr: "En cas de violation du confinement, SCP-682 doit être traqué et recapturé par toutes les Forces d'Intervention Mobiles disponibles, et aucune équipe de moins de sept (7) membres n'est autorisée à l'affronter."
      it: "In caso di violazione del contenimento, SCP-682 deve essere tracciato e ricatturato da tutte le Task Force Mobili disponibili, e nessuna squadra con meno di sette (7) membri è autorizzata a ingaggiarlo."
      ko: "봉쇄가 뚫렸을 경우, 가용한 모든 기동특무부대가 SCP-682를 추적하여 재포획해야 하며, 7명 미만으로 구성된 팀은 교전이 허가되지 않는다."
      pl: "W przypadku naruszenia powstrzymania SCP-682 ma być wyśledzone i ponownie schwytane przez wszystkie dostępne Mobilne Grupy Zadaniowe, a żaden zespół liczący mniej niż siedem (7) osób nie jest upoważniony do starcia z nim."
      pt: "Em caso de violação da contenção, o SCP-682 deve ser rastreado e recapturado por todas as Forças-Tarefa Móveis disponíveis, e nenhuma equipe com menos de sete (7) membros está autorizada a enfrentá-lo."
      th: "ในกรณีที่เกิดการฝ่าฝืนการกักกัน SCP-682 จะต้องถูกติดตามและจับกุมกลับคืนโดยหน่วยเฉพาะกิจเคลื่อนที่ทั้งหมดที่มีอยู่ และไม่มีทีมที่มีสมาชิกน้อยกว่าเจ็ด (7) คนได้รับอนุญาตให้เข้าปะทะกับมัน"
      uk: "У разі порушення утримання SCP-682 повинен відстежуватися та бути повторно захопленим усіма доступними мобільними оперативними групами, причому жодна команда чисельністю менше семи (7) осіб не допускається до зіткнення з ним."
      vi: "Trong trường hợp vi phạm giam giữ, SCP-682 phải được truy tìm và bắt giữ lại bởi tất cả các Lực lượng Đặc nhiệm Cơ động sẵn có, và không đội nào có ít hơn bảy (7) thành viên được phép giao chiến với nó."
      zh: "若发生收容失效，须由所有可用的机动特遣队追踪并重新捕获SCP-682，任何人数少于七(7)人的小队均不得与其交战。"
      zh_Hant: "若發生收容失效，須由所有可用的機動特遣隊追蹤並重新捕獲SCP-682，任何人數少於七(7)人的小隊均不得與其交戰。"
