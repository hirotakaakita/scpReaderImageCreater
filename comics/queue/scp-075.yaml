# SCP-075 4コマ台本
# captionはSpecial Containment Procedures / Description本文からの引用。
# 「捕食者として獲物に襲いかかる」描写は、人物への直接攻撃としては描かず、
# 警報・回避のシーンとして視覚化する。キャラにセリフは言わせない。

