object_class: Euclid

local_characters:
  scp-100-1:
    name: "SCP-100-1"
    description: >
      A humanoid figure built entirely from scrap: mostly copper piping
      and uninsulated copper wiring (warm orange-brown, color RGB
      180,110,60) with an aluminum-can torso and limbs (dull silver,
      color RGB 190,190,195), roughly human-sized and proportioned, its
      "face" a simple welded arrangement suggesting eyes and a mouth.
  scp-100-2:
    name: "SCP-100-2 (Raymone and Beatrice)"
    description: >
      Two knee-height insect-like scrap constructs, each with a
      segmented body of welded scrap metal (rusty brown-orange, color
      RGB 150,90,50) and several jointed wire legs, a name — "Raymone"
      or "Beatrice" — crudely welded into each of their backs.

characters: [attending-researcher-m, attending-researcher-f, scp-100-1, scp-100-2]

panels:
  - scene: >
      Wide shot, full body, showing the whole scrapyard exterior — a
      sagging storefront sign, two warehouses, a small residential
      building, rows of crushed cars and scrap piles behind a tall
      fence. attending-researcher-m stands at the fence gate with a
      clipboard, surveying the site.
    characters: [attending-researcher-m]
    caption:
      ja: "SCP-100は「ジャマイカン・ジョーのジャンクヤード・ジュビリー」として知られる、廃棄されたスクラップ置き場である。この置き場は約5,000平方メートルの柵で囲まれた土地からなり、2棟の倉庫、店舗、そして小さな住居用建物が存在する。SCP-100内には約1,500台の車両と、約1,400キログラムの別置きスクラップが保管されている。"
      en: "SCP-100 is an abandoned scrapyard known as 'Jamaican Joe's Junkyard Jubilee.' The scrapyard covers roughly five thousand square meters of fenced-off land, consisting of two warehouses, a storefront, and a small residential building. SCP-100 holds roughly fifteen hundred vehicles, as well as roughly fourteen hundred kilograms of separate scrap."
      cs: "SCP-100 je opuštěné sběrné dvorové skladiště známé jako „Jamajský Joeho vraku-jubileum“. Skladiště zabírá přibližně pět tisíc čtverečních metrů oploceného pozemku, sestávajícího ze dvou skladů, prodejny a malé obytné budovy. SCP-100 obsahuje přibližně patnáct set vozidel a rovněž zhruba čtrnáct set kilogramů odděleného šrotu."
      de: "SCP-100 ist ein verlassener Schrottplatz, bekannt als „Jamaican Joe's Junkyard Jubilee“. Der Schrottplatz umfasst etwa fünftausend Quadratmeter eingezäuntes Gelände, bestehend aus zwei Lagerhallen, einem Ladengeschäft und einem kleinen Wohngebäude. SCP-100 beherbergt etwa fünfzehnhundert Fahrzeuge sowie ungefähr vierzehnhundert Kilogramm separaten Schrott."
      es: "SCP-100 es un depósito de chatarra abandonado conocido como 'Jamaican Joe's Junkyard Jubilee'. El depósito cubre aproximadamente cinco mil metros cuadrados de terreno vallado, formado por dos almacenes, un local comercial y un pequeño edificio residencial. El SCP-100 alberga aproximadamente mil quinientos vehículos, así como unos mil cuatrocientos kilogramos de chatarra separada."
      fr: "Le SCP-100 est une casse automobile abandonnée connue sous le nom de « Jamaican Joe's Junkyard Jubilee ». La casse couvre environ cinq mille mètres carrés de terrain clôturé, comprenant deux entrepôts, une boutique et un petit bâtiment résidentiel. Le SCP-100 contient environ mille cinq cents véhicules, ainsi qu'environ quatorze cents kilogrammes de ferraille séparée."
      it: "SCP-100 è uno sfasciacarrozze abbandonato noto come 'Jamaican Joe's Junkyard Jubilee'. Lo sfasciacarrozze copre circa cinquemila metri quadrati di terreno recintato, comprendente due magazzini, un negozio e un piccolo edificio residenziale. SCP-100 contiene circa millecinquecento veicoli, oltre a circa millequattrocento chilogrammi di rottami separati."
      ko: "SCP-100은 '자메이칸 조의 정크야드 주빌리'로 알려진 버려진 고물상이다. 이 부지는 약 5,000제곱미터의 울타리로 둘러싸인 땅으로, 두 개의 창고, 상점, 그리고 작은 주거용 건물로 구성되어 있다. SCP-100 안에는 약 1,500대의 차량과 약 1,400킬로그램의 별도로 분류된 고철이 보관되어 있다."
      pl: "SCP-100 to opuszczony złom znany jako „Jamaican Joe's Junkyard Jubilee”. Złomowisko zajmuje około pięciu tysięcy metrów kwadratowych ogrodzonego terenu, obejmującego dwa magazyny, sklep i mały budynek mieszkalny. SCP-100 zawiera około tysiąca pięciuset pojazdów, a także około tysiąca czterystu kilogramów oddzielnego złomu."
      pt: "O SCP-100 é um ferro-velho abandonado conhecido como 'Jamaican Joe's Junkyard Jubilee'. O ferro-velho cobre aproximadamente cinco mil metros quadrados de terreno cercado, composto por dois galpões, uma loja e um pequeno prédio residencial. O SCP-100 abriga aproximadamente mil e quinhentos veículos, além de cerca de mil e quatrocentos quilogramas de sucata separada."
      th: "SCP-100 คือลานเก็บเศษเหล็กที่ถูกทิ้งร้าง รู้จักกันในชื่อ 'Jamaican Joe's Junkyard Jubilee' ลานแห่งนี้ครอบคลุมพื้นที่รั้วรอบขอบชิดประมาณห้าพันตารางเมตร ประกอบด้วยโกดังสองหลัง หน้าร้านหนึ่งแห่ง และอาคารที่พักอาศัยขนาดเล็ก SCP-100 มียานพาหนะประมาณหนึ่งพันห้าร้อยคัน รวมถึงเศษโลหะแยกต่างหากอีกประมาณหนึ่งพันสี่ร้อยกิโลกรัม"
      uk: "SCP-100 — це покинутий металобрухт, відомий як «Jamaican Joe's Junkyard Jubilee». Металобрухт займає приблизно п'ять тисяч квадратних метрів обгородженої землі, що складається з двох складів, магазину та невеликої житлової будівлі. SCP-100 містить приблизно півтори тисячі транспортних засобів, а також близько тисячі чотирьохсот кілограмів окремого брухту."
      vi: "SCP-100 là một bãi phế liệu bỏ hoang được biết đến với tên gọi 'Jamaican Joe's Junkyard Jubilee'. Bãi phế liệu này chiếm khoảng năm nghìn mét vuông đất có rào chắn, bao gồm hai nhà kho, một cửa hàng, và một tòa nhà dân cư nhỏ. SCP-100 chứa khoảng một nghìn năm trăm phương tiện, cũng như khoảng một nghìn bốn trăm kilôgam phế liệu riêng biệt."
      zh: "SCP-100是一处被称为「牙买加乔的废品乐园」的废弃废品场。该废品场占地约五千平方米的围栏土地，由两座仓库、一间店面和一栋小型住宅建筑组成。SCP-100内约存有一千五百辆车辆，以及约一千四百公斤的散装废料。"
      zh_Hant: "SCP-100是一處被稱為「牙買加喬的廢品樂園」的廢棄廢品場。該廢品場佔地約五千平方公尺的圍欄土地，由兩座倉庫、一間店面和一棟小型住宅建築組成。SCP-100內約存有一千五百輛車輛，以及約一千四百公斤的散裝廢料。"

  - scene: >
      Medium shot, waist-up, a different framing from the wide shot
      before, inside a warehouse. SCP-100-1 stands beside a workbench
      operating a handheld arc welder with sparks flying, gesturing
      with its other hand toward attending-researcher-f in simple sign
      language.
    characters: [scp-100-1, attending-researcher-f]
    caption:
      ja: "SCP-100-1は、主に銅管・被覆のない銅線・アルミ缶からなる、自律的で知性を持つ人型構造物である。初歩的な手話を用いてコミュニケーションを取る能力があり、アーク溶接機・ドリル・電動のこぎりといった工具や、重機を操作する技術も備えているようである。"
      en: "SCP-100-1 is an autonomous, sapient, humanoid construct consisting mostly of copper piping, uninsulated copper wiring, and aluminum cans. It possesses the ability to communicate using rudimentary sign language, and appears to possess skill in craftsmanship, demonstrating the ability to operate tools such as arc welders, drills, and power saws, as well as heavy machinery."
      cs: "SCP-100-1 je autonomní, vnímavý humanoidní konstrukt, tvořený převážně měděným potrubím, neizolovaným měděným drátem a hliníkovými plechovkami. Dokáže komunikovat pomocí základního znakového jazyka a zdá se, že disponuje řemeslnou zručností, jak dokazuje ovládání nástrojů jako obloukové svářečky, vrtačky a motorové pily, stejně jako těžké techniky."
      de: "SCP-100-1 ist ein autonomes, empfindungsfähiges, humanoides Konstrukt, das hauptsächlich aus Kupferrohren, unisolierten Kupferdrähten und Aluminiumdosen besteht. Es besitzt die Fähigkeit, mittels rudimentärer Gebärdensprache zu kommunizieren, und scheint handwerkliches Geschick zu besitzen, wie die Bedienung von Werkzeugen wie Lichtbogenschweißgeräten, Bohrern und Kreissägen sowie schweren Maschinen zeigt."
      es: "El SCP-100-1 es un constructo humanoide autónomo y consciente, compuesto principalmente por tuberías de cobre, cableado de cobre sin aislar y latas de aluminio. Posee la capacidad de comunicarse mediante un lenguaje de signos rudimentario, y parece poseer habilidad artesanal, demostrando la capacidad de operar herramientas como soldadoras de arco, taladros y sierras eléctricas, así como maquinaria pesada."
      fr: "Le SCP-100-1 est un être humanoïde autonome et conscient, composé principalement de tuyaux de cuivre, de fils de cuivre non isolés et de canettes en aluminium. Il possède la capacité de communiquer à l'aide d'un langage des signes rudimentaire, et semble posséder une habileté artisanale, démontrant la capacité d'utiliser des outils tels que des postes à souder à l'arc, des perceuses et des scies électriques, ainsi que des engins lourds."
      it: "SCP-100-1 è un costrutto umanoide autonomo e senziente, composto principalmente da tubature di rame, fili di rame non isolati e lattine di alluminio. Possiede la capacità di comunicare usando un linguaggio dei segni rudimentale, e sembra possedere abilità artigianali, dimostrando la capacità di utilizzare attrezzi come saldatrici ad arco, trapani e seghe elettriche, oltre a macchinari pesanti."
      ko: "SCP-100-1은 주로 구리 배관, 절연되지 않은 구리 전선, 알루미늄 캔으로 이루어진 자율적이고 지각을 지닌 인간형 구조물이다. 초보적인 수화를 사용해 소통할 수 있으며, 아크 용접기, 드릴, 전동톱 같은 도구와 중장비를 다루는 데서 드러나듯 손재주가 있는 것으로 보인다."
      pl: "SCP-100-1 to autonomiczny, świadomy, humanoidalny konstrukt złożony głównie z miedzianych rur, nieizolowanego drutu miedzianego i puszek aluminiowych. Potrafi komunikować się za pomocą prostego języka migowego i wydaje się posiadać umiejętności rzemieślnicze, co potwierdza obsługa narzędzi takich jak spawarki łukowe, wiertarki i piły elektryczne, a także ciężkiego sprzętu."
      pt: "O SCP-100-1 é um constructo humanoide autônomo e senciente, composto principalmente por tubos de cobre, fios de cobre não isolados e latas de alumínio. Possui a capacidade de se comunicar usando uma linguagem de sinais rudimentar, e parece ter habilidade artesanal, demonstrando a capacidade de operar ferramentas como soldadores a arco, furadeiras e serras elétricas, bem como maquinário pesado."
      th: "SCP-100-1 คือสิ่งประกอบสร้างรูปมนุษย์ที่มีความรู้สึกนึกคิดและเคลื่อนไหวได้อย่างอิสระ ประกอบขึ้นส่วนใหญ่จากท่อทองแดง สายไฟทองแดงที่ไม่มีฉนวนหุ้ม และกระป๋องอลูมิเนียม มันมีความสามารถในการสื่อสารด้วยภาษามือขั้นพื้นฐาน และดูเหมือนจะมีทักษะงานฝีมือ โดยแสดงให้เห็นความสามารถในการใช้เครื่องมือ เช่น เครื่องเชื่อมอาร์ก สว่าน และเลื่อยไฟฟ้า รวมถึงเครื่องจักรหนัก"
      uk: "SCP-100-1 — це автономна, розумна, гуманоїдна конструкція, що складається переважно з мідних труб, неізольованого мідного дроту та алюмінієвих банок. Вона здатна спілкуватися за допомогою примітивної мови жестів і, вочевидь, володіє майстерністю ремісника, демонструючи здатність працювати з інструментами, такими як зварювальні апарати, дрилі та електропили, а також з важкою технікою."
      vi: "SCP-100-1 là một cấu trúc hình người tự chủ, có tri giác, chủ yếu được cấu tạo từ ống đồng, dây đồng không bọc cách điện, và lon nhôm. Nó có khả năng giao tiếp bằng ngôn ngữ ký hiệu sơ khai, và dường như có kỹ năng thủ công, thể hiện khả năng vận hành các công cụ như máy hàn hồ quang, máy khoan và cưa máy, cũng như máy móc hạng nặng."
      zh: "SCP-100-1是一个自主、有感知能力的人形构造体，主要由铜管、无绝缘铜线和铝罐构成。它能够使用基础手语进行交流，并似乎具备一定的手工技艺，能够操作电弧焊机、电钻、电锯等工具，以及重型机械。"
      zh_Hant: "SCP-100-1是一個自主、有感知能力的人形構造體，主要由銅管、無絕緣銅線和鋁罐構成。它能夠使用基礎手語進行交流，並似乎具備一定的手工技藝，能夠操作電弧焊機、電鑽、電鋸等工具，以及重型機械。"

  - scene: >
      Wide shot, full body, a different framing from the medium shot
      before, in the scrapyard. SCP-100-1 stands surrounded by several
      small scrap animal constructs it has built — an iguana, a
      flamingo, a turtle — with the two insect-like companions
      scp-100-2 trotting alongside it.
    characters: [scp-100-1, scp-100-2]
    caption:
      ja: "SCP-100-1は自身と同様の自律的構造物を作り出す能力を持ち、イグアナ・ワニ・カメ・フラミンゴという4種の動物を特によく制作する傾向がある。SCP-100-1には「レイモン」と「ビアトリス」と名付けられた2体を手元に置くことが許されており、それらは仲間であると同時に警備役としても機能しているように見える。"
      en: "SCP-100-1 possesses the ability to create autonomous constructs similar to itself, and tends to create four specific animals - iguanas, crocodiles, turtles, and flamingos. SCP-100-1 has been allowed to keep two objects, named 'Raymone' and 'Beatrice,' which appear to operate as both companions and guards."
      cs: "SCP-100-1 disponuje schopností vytvářet autonomní konstrukty podobné sobě samému a mívá sklon vytvářet čtyři konkrétní zvířata – leguány, krokodýly, želvy a plameňáky. SCP-100-1 bylo dovoleno ponechat si dva objekty, pojmenované „Raymone“ a „Beatrice“, které zjevně fungují jak jako společníci, tak jako strážci."
      de: "SCP-100-1 besitzt die Fähigkeit, autonome Konstrukte ähnlich sich selbst zu erschaffen, und neigt dazu, vier bestimmte Tiere zu erschaffen – Leguane, Krokodile, Schildkröten und Flamingos. SCP-100-1 durfte zwei Objekte behalten, benannt „Raymone“ und „Beatrice“, die anscheinend sowohl als Gefährten als auch als Wächter fungieren."
      es: "El SCP-100-1 posee la capacidad de crear constructos autónomos similares a sí mismo, y tiende a crear cuatro animales específicos: iguanas, cocodrilos, tortugas y flamencos. Se le ha permitido al SCP-100-1 conservar dos objetos, llamados 'Raymone' y 'Beatrice', que parecen funcionar tanto como compañeros como guardianes."
      fr: "Le SCP-100-1 possède la capacité de créer des constructs autonomes semblables à lui-même, et tend à créer quatre animaux spécifiques : des iguanes, des crocodiles, des tortues et des flamants roses. Le SCP-100-1 a été autorisé à conserver deux objets, nommés « Raymone » et « Beatrice », qui semblent fonctionner à la fois comme compagnons et comme gardes."
      it: "SCP-100-1 possiede la capacità di creare costrutti autonomi simili a se stesso, e tende a creare quattro animali specifici: iguana, coccodrilli, tartarughe e fenicotteri. A SCP-100-1 è stato permesso di tenere due oggetti, chiamati 'Raymone' e 'Beatrice', che sembrano fungere sia da compagni che da guardie."
      ko: "SCP-100-1은 자신과 유사한 자율 구조물을 만들어내는 능력을 지니고 있으며, 이구아나, 악어, 거북이, 플라밍고라는 네 가지 특정 동물을 즐겨 만드는 경향이 있다. SCP-100-1은 '레이몬'과 '비어트리스'라는 이름이 붙은 두 개체를 곁에 두는 것이 허용되었으며, 이들은 동반자이자 경비원 역할을 겸하는 것으로 보인다."
      pl: "SCP-100-1 posiada zdolność tworzenia autonomicznych konstruktów podobnych do siebie i ma tendencję do tworzenia czterech konkretnych zwierząt - iguan, krokodyli, żółwi i flamingów. SCP-100-1 pozwolono zatrzymać dwa obiekty, nazwane „Raymone” i „Beatrice”, które wydają się pełnić funkcję zarówno towarzyszy, jak i strażników."
      pt: "O SCP-100-1 possui a capacidade de criar constructos autônomos semelhantes a si mesmo, e tende a criar quatro animais específicos - iguanas, crocodilos, tartarugas e flamingos. Foi permitido ao SCP-100-1 manter dois objetos, chamados 'Raymone' e 'Beatrice', que parecem funcionar tanto como companheiros quanto como guardas."
      th: "SCP-100-1 มีความสามารถในการสร้างสิ่งประกอบสร้างที่เคลื่อนไหวได้อย่างอิสระคล้ายกับตัวมันเอง และมักจะสร้างสัตว์สี่ชนิดโดยเฉพาะ ได้แก่ อีกัวน่า จระเข้ เต่า และฟลามิงโก SCP-100-1 ได้รับอนุญาตให้เก็บวัตถุสองชิ้นไว้ ชื่อว่า 'เรย์โมน' และ 'เบียทริซ' ซึ่งดูเหมือนจะทำหน้าที่เป็นทั้งเพื่อนและยาม"
      uk: "SCP-100-1 має здатність створювати автономні конструкції, подібні до себе, і схильний створювати чотирьох конкретних тварин — ігуан, крокодилів, черепах і фламінго. SCP-100-1 дозволено залишити собі два об'єкти, названі «Реймон» і «Беатріс», які, здається, виконують роль як компаньйонів, так і охоронців."
      vi: "SCP-100-1 có khả năng tạo ra các cấu trúc tự chủ giống với chính nó, và có xu hướng tạo ra bốn loài động vật cụ thể - kỳ nhông, cá sấu, rùa, và hồng hạc. SCP-100-1 được phép giữ lại hai vật thể, được đặt tên là 'Raymone' và 'Beatrice', dường như hoạt động vừa là bạn đồng hành vừa là người canh gác."
      zh: "SCP-100-1具有创造与自己相似的自主构造体的能力，倾向于制作四种特定动物——鬣蜥、鳄鱼、乌龟和火烈鸟。SCP-100-1被允许保留两个个体，分别命名为「雷蒙」和「比阿特丽斯」，它们似乎既是伙伴，也是守卫。"
      zh_Hant: "SCP-100-1具有創造與自己相似的自主構造體的能力，傾向於製作四種特定動物——鬣蜥、鱷魚、烏龜和火烈鳥。SCP-100-1被允許保留兩個個體，分別命名為「雷蒙」和「比阿特麗絲」，牠們似乎既是夥伴，也是守衛。"

  - scene: >
      Close-up on the storefront counter, a different framing from the
      wide shot before. SCP-100-1 sits behind it, gesturing a bargaining
      offer toward attending-researcher-m, a crooked handwritten sign
      on the wall behind reading "NO REFUNDS, MON!"
    characters: [scp-100-1, attending-researcher-m]
    caption:
      ja: "SCP-100-1がカウンターの奥に座っている間に人間が店内に入ると、それは相手と値段交渉を試みる。SCP-100-1による取引は、たいてい何らかの不公正さを伴う。この点についてSCP-100-1を問い詰めようとしても、壁に貼られた「返金なし、モーン！」という張り紙を指し示されるだけである。"
      en: "When a human enters the storefront while SCP-100-1 is seated behind the counter, it will attempt to bargain with them. Sales made by SCP-100-1 are typically met with some degree of unfairness. Efforts to confront it about this are met with referral to a sign posted on the wall reading 'No refunds, mon!'"
      cs: "Když člověk vstoupí do prodejny, zatímco SCP-100-1 sedí za pultem, pokusí se s ním smlouvat. Obchody uzavírané SCP-100-1 bývají obvykle poznamenány jistou mírou nekorektnosti. Pokusy konfrontovat jej s tím jsou setkávány s odkazem na ceduli visící na zdi s nápisem „Žádné vrácení peněz, mon!“"
      de: "Betritt ein Mensch das Ladengeschäft, während SCP-100-1 hinter der Theke sitzt, wird es versuchen, mit ihm zu feilschen. Verkäufe von SCP-100-1 sind in der Regel mit einer gewissen Unfairness verbunden. Versuche, es damit zu konfrontieren, führen lediglich zu einem Verweis auf ein Schild an der Wand mit der Aufschrift „No refunds, mon!“"
      es: "Cuando un humano entra en el local mientras el SCP-100-1 está sentado detrás del mostrador, intentará regatear con él. Las ventas realizadas por el SCP-100-1 suelen ir acompañadas de cierto grado de injusticia. Los intentos de confrontarlo al respecto son recibidos con una referencia a un cartel en la pared que dice '¡No refunds, mon!'"
      fr: "Lorsqu'un humain entre dans la boutique alors que le SCP-100-1 est assis derrière le comptoir, il tentera de marchander avec lui. Les ventes effectuées par le SCP-100-1 s'accompagnent généralement d'un certain degré d'injustice. Les tentatives de le confronter à ce sujet se heurtent à un renvoi vers un panneau affiché sur le mur indiquant « No refunds, mon! »"
      it: "Quando un essere umano entra nel negozio mentre SCP-100-1 è seduto dietro il bancone, cercherà di contrattare con lui. Le vendite effettuate da SCP-100-1 sono solitamente segnate da un certo grado di ingiustizia. I tentativi di confrontarlo su questo vengono accolti con un rimando a un cartello appeso al muro che recita 'No refunds, mon!'"
      ko: "SCP-100-1이 카운터 뒤에 앉아 있는 동안 사람이 상점에 들어오면, 그것은 그 사람과 흥정을 시도한다. SCP-100-1이 성사시키는 거래는 대개 어느 정도 불공정함을 동반한다. 이에 대해 따지려는 시도는, 벽에 붙은 '환불 없음, 몬!'이라는 팻말을 가리키는 것으로 응답받을 뿐이다."
      pl: "Gdy człowiek wchodzi do sklepu, podczas gdy SCP-100-1 siedzi za ladą, próbuje z nim negocjować. Transakcje zawierane przez SCP-100-1 zazwyczaj wiążą się z pewną nieuczciwością. Próby skonfrontowania go z tym spotykają się z odesłaniem do tabliczki wiszącej na ścianie z napisem „No refunds, mon!”"
      pt: "Quando um humano entra na loja enquanto o SCP-100-1 está sentado atrás do balcão, ele tentará negociar com essa pessoa. As vendas feitas pelo SCP-100-1 geralmente envolvem algum grau de injustiça. Tentativas de confrontá-lo sobre isso são recebidas com uma referência a uma placa na parede que diz 'No refunds, mon!'"
      th: "เมื่อมนุษย์เข้ามาในหน้าร้านขณะที่ SCP-100-1 นั่งอยู่หลังเคาน์เตอร์ มันจะพยายามต่อรองราคากับพวกเขา การขายของ SCP-100-1 มักมาพร้อมกับความไม่เป็นธรรมในระดับหนึ่ง ความพยายามที่จะเผชิญหน้ากับมันเกี่ยวกับเรื่องนี้มักได้รับการตอบกลับด้วยการชี้ไปที่ป้ายบนผนังที่เขียนว่า 'No refunds, mon!'"
      uk: "Коли людина заходить у магазин, поки SCP-100-1 сидить за прилавком, він намагається торгуватися з нею. Продажі, здійснені SCP-100-1, зазвичай супроводжуються певною несправедливістю. Спроби протистояти йому з цього приводу зустрічають лише вказівку на табличку на стіні з написом «No refunds, mon!»"
      vi: "Khi một con người bước vào cửa hàng trong lúc SCP-100-1 đang ngồi sau quầy, nó sẽ cố gắng mặc cả với người đó. Các giao dịch mua bán của SCP-100-1 thường đi kèm với một mức độ bất công nhất định. Những nỗ lực chất vấn nó về điều này chỉ nhận được sự chỉ dẫn đến tấm biển treo trên tường ghi 'No refunds, mon!'"
      zh: "当有人在SCP-100-1坐在柜台后面时进入店铺，它便会试图与对方讨价还价。SCP-100-1达成的交易通常带有一定程度的不公平。试图就此与其理论的尝试，往往只会被指向墙上一块写着「概不退款，老兄！」的牌子。"
      zh_Hant: "當有人在SCP-100-1坐在櫃檯後面時進入店鋪，它便會試圖與對方討價還價。SCP-100-1達成的交易通常帶有一定程度的不公平。試圖就此與其理論的嘗試，往往只會被指向牆上一塊寫著「概不退款，老兄！」的牌子。"
