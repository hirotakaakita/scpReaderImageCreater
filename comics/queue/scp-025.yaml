# SCP-025 4コマ台本
# captionは記事本文（Special Containment Procedures / Description）からの引用。
# キャラにセリフは言わせない。
#
# 4コマの構成意図: 1コマ目=ワードローブと収納物の紹介（導入）、2コマ目=衣類を
# 着用すると24時間以内に死傷するという法則の提示（展開）、3コマ目=指先の
# 欠けた手袋を着けたD級職員が台所で危険な瞬間を迎える具体例（転）、4コマ目=
# 別の欠陥（袖の無いポンチョ）でも同じ法則が繰り返される、というオチ（結・
# 「事故」として片付けられ続けるループの不気味さ）。実際の負傷・グロ描写は
# 避け、事故の直前で止める。補遺は使用しない。

