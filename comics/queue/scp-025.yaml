# SCP-025 4コマ台本
# captionはSpecial Containment Procedures / Description本文からの引用。
# Test Logの詳細（銃撃・刺殺・食人病等の陰惨な事故描写）は本編に含めず、
# パネル3では事故の瞬間そのものを描かず「衝撃の直前で止め、結果は見せない」
# 演出にしてグロを回避した。キャラにセリフは言わせない。JP公式訳が直接
# 取得できなかったため、検証済みの英語本文からの翻訳（ja含む）。

id: scp-025

title:
  en: "SCP-025"
  ja: "SCP-025"
  cs: "SCP-025"
