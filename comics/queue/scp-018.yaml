panels:
  - scene: >
      Close-up, filling most of the frame, on a small glossy red rubber
      ball sitting innocuously on a dusty concrete warehouse floor among
      old crates, a shaft of light catching its surface.
      attending-researcher-f crouches at the edge of the frame, reaching
      toward it with a gloved hand, unaware of any danger.
    characters: [attending-researcher-f]
    caption:
      ja: "SCP-018は1969年にウォーモ社が製造したスーパーボールの外見をしている。直径6センチメートル、色は赤である。"
      en: "SCP-018 has the appearance of a Super Ball made by the Wham-O company in 1969. It is six (6) centimeters in diameter and coloured red."
      cs: "SCP-018 má vzhled Super Ball vyrobeného společností Wham-O v roce 1969. Má průměr šest (6) centimetrů a červenou barvu."
      de: "SCP-018 hat das Aussehen eines Super Balls, hergestellt von der Firma Wham-O im Jahr 1969. Er hat einen Durchmesser von sechs (6) Zentimetern und ist rot gefärbt."
      es: "SCP-018 tiene la apariencia de una Super Ball fabricada por la compañía Wham-O en 1969. Mide seis (6) centímetros de diámetro y es de color rojo."
      fr: "Le SCP-018 a l'apparence d'une Super Ball fabriquée par la société Wham-O en 1969. Il mesure six (6) centimètres de diamètre et est de couleur rouge."
      it: "SCP-018 ha l'aspetto di una Super Ball prodotta dall'azienda Wham-O nel 1969. Ha un diametro di sei (6) centimetri ed è di colore rosso."
      ko: "SCP-018은 1969년 웜오(Wham-O)사가 제작한 슈퍼볼의 외형을 하고 있다. 지름은 6센티미터이며 색상은 빨간색이다."
      pl: "SCP-018 wygląda jak Super Ball wyprodukowana przez firmę Wham-O w 1969 roku. Ma sześć (6) centymetrów średnicy i czerwony kolor."
      pt: "O SCP-018 tem a aparência de uma Super Ball fabricada pela empresa Wham-O em 1969. Tem seis (6) centímetros de diâmetro e é de cor vermelha."
      th: "SCP-018 มีลักษณะเหมือนลูกบอลซูเปอร์บอลที่ผลิตโดยบริษัทวอมโอในปี 1969 มีเส้นผ่านศูนย์กลางหก (6) เซนติเมตร และมีสีแดง"
      uk: "SCP-018 має вигляд суперм'яча, виготовленого компанією Wham-O у 1969 році. Його діаметр становить шість (6) сантиметрів, колір — червоний."
      vi: "SCP-018 có hình dạng giống một quả bóng Super Ball do công ty Wham-O sản xuất năm 1969. Nó có đường kính sáu (6) cm và màu đỏ."
      zh: "SCP-018的外观类似于1969年Wham-O公司生产的超级弹力球。直径为六(6)厘米，颜色为红色。"
      zh_Hant: "SCP-018的外觀類似於1969年Wham-O公司生產的超級彈力球。直徑為六(6)公分，顏色為紅色。"

  - scene: >
      Dynamic vertical composition, low angle looking straight up, a
      very different framing from the tight close-up before. A blurred
      motion-trail of a red ball bounces between the floor and the tall
      ceiling of the warehouse, each bounce visibly higher than the
      last, cracked plaster spreading where it struck the ceiling.
      attending-researcher-m ducks for cover below, arms thrown over his
      head.
    characters: [attending-researcher-m]
    caption:
      ja: "SCP-018は200パーセントを超える効率で跳ね返ることができる。1メートルの高さから落とすと、2メートル、次に4メートル、8メートル、16メートルと跳ね上がっていく。"
      en: "SCP-018 was able to bounce with over two hundred percent (200%) efficiency: if dropped one (1) meter, it would bounce two (2), then four (4), then eight (8), then sixteen (16)."
      cs: "SCP-018 dokázalo odrážet se s účinností přesahující dvě stě procent (200 %): pokud bylo puštěno z výšky jednoho (1) metru, odrazilo se do dvou (2) metrů, poté čtyř (4), osmi (8), a šestnácti (16)."
      de: "SCP-018 konnte mit einer Effizienz von über zweihundert Prozent (200 %) abprallen: Fiel es aus einem (1) Meter Höhe, sprang es auf zwei (2), dann vier (4), dann acht (8), dann sechzehn (16) Meter."
      es: "SCP-018 podía rebotar con una eficiencia superior al doscientos por ciento (200%): si se dejaba caer desde un (1) metro, rebotaba dos (2), luego cuatro (4), luego ocho (8), luego dieciséis (16)."
      fr: "Le SCP-018 était capable de rebondir avec une efficacité de plus de deux cents pour cent (200 %) : lâché d'un (1) mètre, il rebondissait à deux (2), puis quatre (4), puis huit (8), puis seize (16)."
      it: "SCP-018 era in grado di rimbalzare con un'efficienza superiore al duecento per cento (200%): se fatto cadere da un (1) metro, rimbalzava a due (2), poi quattro (4), poi otto (8), poi sedici (16)."
      ko: "SCP-018은 200퍼센트가 넘는 효율로 튀어 오를 수 있었다: 1미터 높이에서 떨어뜨리면 2미터, 그다음 4미터, 8미터, 16미터로 튀어 올랐다."
      pl: "SCP-018 potrafiła odbijać się z wydajnością przekraczającą dwieście procent (200%): upuszczona z wysokości jednego (1) metra, odbijała się na dwa (2), potem cztery (4), potem osiem (8), potem szesnaście (16) metrów."
      pt: "O SCP-018 conseguia quicar com eficiência superior a duzentos por cento (200%): se derrubado de um (1) metro, quicava dois (2), depois quatro (4), depois oito (8), depois dezesseis (16)."
      th: "SCP-018 สามารถกระเด้งด้วยประสิทธิภาพมากกว่าสองร้อยเปอร์เซ็นต์ (200%) หากปล่อยจากความสูงหนึ่ง (1) เมตร มันจะกระเด้งขึ้นไปสอง (2) เมตร จากนั้นสี่ (4) แปด (8) สิบหก (16) เมตร"
      uk: "SCP-018 міг відскакувати з ефективністю понад двісті відсотків (200%): якщо його скидали з висоти одного (1) метра, він підстрибував на два (2), потім чотири (4), вісім (8), шістнадцять (16)."
      vi: "SCP-018 có thể nảy với hiệu suất hơn hai trăm phần trăm (200%): nếu thả rơi từ độ cao một (1) mét, nó sẽ nảy lên hai (2), rồi bốn (4), tám (8), rồi mười sáu (16) mét."
      zh: "SCP-018的弹跳效率超过百分之二百(200%)：从一(1)米高度落下后，它会弹到二(2)米，接着四(4)米、八(8)米、十六(16)米。"
      zh_Hant: "SCP-018的彈跳效率超過百分之二百(200%)：從一(1)公尺高度落下後，它會彈到二(2)公尺，接著四(4)公尺、八(8)公尺、十六(16)公尺。"

  - scene: >
      Wide shot, full body, eye level, showing a chaotic city street: a
      parked car with a fist-sized dent punched through its roof, a
      shattered shop window, and bystanders standing frozen, staring up
      at the sky in baffled disbelief. attending-researcher-f stands
      amid them in plain civilian clothes, clipboard in hand, surveying
      the damage with detached professionalism.
    characters: [attending-researcher-f]
    caption:
      ja: "このボールはやがて危険な飛翔体と化し、推定時速100kmを超える速度に達して、器物を破損させ5名を負傷させた。物体の速度と被害者たちが完全に不意を突かれていたことから、隠蔽工作は不要となり、実施もされなかった。"
      en: "The ball soon became a dangerous projectile, reaching speeds estimated at over 100 km/h, damaging property and injuring five (5). Due to the speed of the object and the total surprise of its victims, no cover-up story was required or initiated."
      cs: "Míč se brzy stal nebezpečným projektilem, dosahujícím odhadovaných rychlostí přes 100 km/h, poškozujícím majetek a zranivším pět (5) osob. Vzhledem k rychlosti objektu a naprostému překvapení obětí nebylo třeba žádné krycí historky, a proto žádná nebyla zahájena."
      de: "Der Ball wurde bald zu einem gefährlichen Geschoss, das geschätzte Geschwindigkeiten von über 100 km/h erreichte, Sachschäden verursachte und fünf (5) Personen verletzte. Aufgrund der Geschwindigkeit des Objekts und der völligen Überraschung der Opfer war keine Vertuschungsgeschichte erforderlich oder wurde eingeleitet."
      es: "La pelota pronto se convirtió en un proyectil peligroso, alcanzando velocidades estimadas de más de 100 km/h, dañando propiedades y lesionando a cinco (5) personas. Debido a la velocidad del objeto y a la total sorpresa de sus víctimas, no se requirió ni se inició ninguna historia de encubrimiento."
      fr: "La balle est rapidement devenue un projectile dangereux, atteignant des vitesses estimées à plus de 100 km/h, endommageant des biens et blessant cinq (5) personnes. En raison de la vitesse de l'objet et de la surprise totale de ses victimes, aucune histoire de dissimulation n'a été nécessaire ni initiée."
      it: "La palla divenne presto un proiettile pericoloso, raggiungendo velocità stimate oltre i 100 km/h, danneggiando proprietà e ferendo cinque (5) persone. A causa della velocità dell'oggetto e della totale sorpresa delle vittime, non è stata necessaria né avviata alcuna storia di copertura."
      ko: "이 공은 곧 위험한 발사체가 되어 추정 시속 100km를 넘는 속도로 재산 피해를 입히고 다섯(5) 명에게 부상을 입혔다. 물체의 속도와 피해자들이 완전히 허를 찔렸다는 점 때문에, 은폐 공작은 필요하지도 실행되지도 않았다."
      pl: "Piłka wkrótce stała się niebezpiecznym pociskiem, osiągającym prędkości szacowane na ponad 100 km/h, niszcząc mienie i raniąc pięć (5) osób. Ze względu na prędkość obiektu i całkowite zaskoczenie ofiar, żadna historia maskująca nie była potrzebna ani nie została zainicjowana."
      pt: "A bola logo se tornou um projétil perigoso, atingindo velocidades estimadas em mais de 100 km/h, danificando propriedades e ferindo cinco (5) pessoas. Devido à velocidade do objeto e à total surpresa de suas vítimas, nenhuma história de encobrimento foi necessária ou iniciada."
      th: "ลูกบอลลูกนี้กลายเป็นวัตถุพุ่งชนที่อันตรายในไม่ช้า โดยมีความเร็วประมาณกว่า 100 กม./ชม. สร้างความเสียหายต่อทรัพย์สินและทำให้มีผู้บาดเจ็บห้า (5) คน เนื่องจากความเร็วของวัตถุและความประหลาดใจอย่างสิ้นเชิงของเหยื่อ จึงไม่จำเป็นต้องมีเรื่องปกปิดใดๆ และไม่มีการดำเนินการใดๆ"
      uk: "М'яч незабаром перетворився на небезпечний снаряд, досягаючи швидкості, оціненої понад 100 км/год, завдаючи шкоди майну та поранивши п'ятьох (5) осіб. Через швидкість об'єкта та цілковиту несподіванку для постраждалих, жодна історія прикриття не була потрібна чи розпочата."
      vi: "Quả bóng nhanh chóng trở thành một vật thể phóng nguy hiểm, đạt tốc độ ước tính hơn 100 km/h, gây hư hại tài sản và làm bị thương năm (5) người. Do tốc độ của vật thể và sự bất ngờ hoàn toàn của các nạn nhân, không cần thiết phải có hay tiến hành bất kỳ câu chuyện che đậy nào."
      zh: "这颗球很快变成了危险的抛射物，估计速度超过每小时100公里，造成财产损失并致五(5)人受伤。由于该物体速度极快，受害者完全猝不及防，因此无需也未曾启动任何掩盖说辞。"
      zh_Hant: "這顆球很快變成了危險的拋射物，估計速度超過每小時100公里，造成財產損失並致五(5)人受傷。由於該物體速度極快，受害者完全措手不及，因此無需也未曾啟動任何掩蓋說辭。"

  - scene: >
      Wide shot, full body, eye level, pulled back to show an enormous
      cube-shaped tank chamber, a very different framing from the street
      scene before. attending-researcher-m and attending-researcher-f,
      both fully suited in heavy plated armor with breathing apparatus,
      are lowered by cables into a massive tank of thick pale goo, at
      whose very center floats a small padded box no larger than a
      shoebox.
    characters: [attending-researcher-m, attending-researcher-f]
    caption:
      ja: "SCP-018は専用の金属拘束具に入れ、厚い緩衝材を内張りした密閉ボックスの中に収容し、10m×10m×10mのポリエチレン製保持タンクの中央に沈めること。区画に入る職員は専用の装甲板と呼吸装置を着用しなければならない。"
      en: "SCP-018 is to be contained in its specialty metal restraint inside a sealed box lined with heavy padding, then submerged in the center of a 10m by 10m by 10m polyethylene holding tank. Personnel entering the chamber must wear specialized plating and a breathing apparatus."
      cs: "SCP-018 musí být uchováváno ve svém speciálním kovovém pouzdru uvnitř uzavřené krabice vyložené silným polstrováním, poté ponořené do středu polyetylenové nádrže o rozměrech 10 x 10 x 10 m. Personál vstupující do komory musí nosit specializované pancéřování a dýchací přístroj."
      de: "SCP-018 ist in seiner speziellen Metallhalterung in einer verschlossenen, dick gepolsterten Kiste zu verwahren, die dann im Zentrum eines 10 m mal 10 m mal 10 m großen Polyethylen-Haltetanks versenkt wird. Personal, das die Kammer betritt, muss spezielle Panzerung und ein Atemgerät tragen."
      es: "SCP-018 debe mantenerse en su restricción metálica especial dentro de una caja sellada forrada con acolchado pesado, luego sumergida en el centro de un tanque de contención de polietileno de 10 x 10 x 10 metros. El personal que ingrese a la cámara debe usar blindaje especializado y aparato respiratorio."
      fr: "Le SCP-018 doit être maintenu dans son dispositif de contention métallique spécial à l'intérieur d'une boîte scellée doublée d'un rembourrage épais, puis immergé au centre d'un réservoir de rétention en polyéthylène de 10 m sur 10 m sur 10 m. Le personnel entrant dans la chambre doit porter un blindage spécialisé et un appareil respiratoire."
      it: "SCP-018 deve essere contenuto nel suo speciale dispositivo di ritenzione metallico all'interno di una scatola sigillata rivestita di imbottitura pesante, quindi immersa al centro di una vasca di contenimento in polietilene di 10 m per 10 m per 10 m. Il personale che entra nella camera deve indossare corazza specializzata e un apparato respiratorio."
      ko: "SCP-018은 전용 금속 구속구에 넣어 두꺼운 패딩으로 안감을 댄 밀폐 상자에 수용하고, 10m×10m×10m 폴리에틸렌 보관 탱크의 중앙에 잠기게 해야 한다. 구역에 들어가는 직원은 전용 장갑판과 호흡 장치를 착용해야 한다."
      pl: "SCP-018 musi być przechowywana w specjalnym metalowym unieruchomieniu wewnątrz zamkniętego pudła wyłożonego grubym wyściółką, następnie zanurzonego w środku zbiornika polietylenowego o wymiarach 10 x 10 x 10 m. Personel wchodzący do komory musi nosić specjalny pancerz i aparat oddechowy."
      pt: "O SCP-018 deve ser contido em sua restrição metálica especial dentro de uma caixa selada forrada com acolchoamento pesado, e então submersa no centro de um tanque de contenção de polietileno de 10 m por 10 m por 10 m. O pessoal que entra na câmara deve usar blindagem especializada e um aparelho respiratório."
      th: "SCP-018 ต้องถูกกักกันในเครื่องพันธนาการโลหะพิเศษภายในกล่องปิดผนึกที่บุด้วยวัสดุกันกระแทกหนา จากนั้นจมลงตรงกลางของถังกักเก็บโพลิเอทิลีนขนาด 10x10x10 เมตร เจ้าหน้าที่ที่เข้าไปในห้องต้องสวมเกราะพิเศษและอุปกรณ์ช่วยหายใจ"
      uk: "SCP-018 слід утримувати в спеціальному металевому фіксаторі всередині запечатаної коробки, обшитої товстою підкладкою, а потім занурювати в центр поліетиленового резервуара розміром 10 на 10 на 10 метрів. Персонал, що заходить у камеру, повинен носити спеціальну броню та дихальний апарат."
      vi: "SCP-018 phải được giam giữ trong thiết bị hạn chế kim loại chuyên dụng bên trong một hộp kín được lót đệm dày, sau đó được nhấn chìm ở trung tâm của bể chứa polyethylene kích thước 10x10x10 mét. Nhân viên vào buồng phải mặc áo giáp chuyên dụng và thiết bị hỗ trợ hô hấp."
      zh: "SCP-018须固定在专用金属约束装置中，置于内衬厚重软垫的密封箱内，再沉入一个10米×10米×10米的聚乙烯收容槽正中央。进入该舱室的人员必须穿戴专用护甲及呼吸装置。"
      zh_Hant: "SCP-018須固定在專用金屬約束裝置中，置於內襯厚重軟墊的密封箱內，再沉入一個10公尺×10公尺×10公尺的聚乙烯收容槽正中央。進入該艙室的人員必須穿戴專用護甲及呼吸裝置。"
