local_characters:
  dr-wettle:
    name: "Dr. William Wallace Wettle"
    appearance: >
      A tired middle-aged male Foundation researcher of average build, unlucky and disheveled,
      wearing a lab coat and looking resigned to disaster.
    default_look: >
      Rumpled white lab coat, tired expression, awkward posture.
panels:
  - scene: >
      World-scale montage of absurd probability failures: dice, weather, machinery and everyday events all behaving unpredictably around the globe. No text or symbols.
    characters: []
    source:
      section: Description
      quote: "SCP-7000 is a progressive randomization of probability factors and anomalous fortuity on the planet Earth, and potentially beyond."
      url: "https://scp-wiki.wikidot.com/scp-7000"
      fetched_at: "2026-09-21T00:00:00Z"
    caption:
      ja: "SCP-7000は、地球上、場合によってはその外側にまで及ぶ確率要因と異常な幸運の進行的なランダム化です。"
      en: &p1 "SCP-7000 is a progressive randomization of probability factors and anomalous fortune on Earth, and potentially beyond."
      cs: *p1
