      Containment briefing scene: Dr. Wettle sits reluctantly at a table while Foundation staff keep distance, as bad-luck events harmlessly cluster around him. No text.
    characters: [dr-wettle, attending-researcher-m]
    source:
      section: Description
      quote: "SCP-7000 is responsible for its own containment. No experimentation involving this anomaly is authorized without the explicit consent of the Emergent Threat Tactical Response Authority or SCP-7000 itself."
      url: "https://scp-wiki.wikidot.com/scp-7000"
