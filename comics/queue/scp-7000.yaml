  - scene: >
      Foundation operations room in chaos: maps, broken equipment, and analysts watching formerly predictable actions produce nonsensical outcomes. No readable text.
    characters: [attending-researcher-m]
    source:
      section: Description
      quote: "Each factor is randomized to a different extent, for a different length of time, and often with a different geographical radius of effect, corresponding to no obvious logical pattern."
      url: "https://scp-wiki.wikidot.com/scp-7000"
      fetched_at: "2026-09-21T00:00:00Z"
    caption:
      ja: "各要因は異なる程度、異なる期間、異なる地理的範囲でランダム化され、明確な論理的パターンはありません。"
      en: &p2 "Each factor is randomized to a different extent, duration, and geographic radius, with no obvious logical pattern."
