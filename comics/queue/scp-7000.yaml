  - scene: >
      Dr. Wettle stands under a small personal rain cloud while nearby people remain dry and improbable mishaps curve toward him. No text.
    characters: [dr-wettle]
    source:
      section: Description
      quote: "SCP-7000 is a probability sink concentrating local misfortune on its own person — Dr. William Wallace Wettle"
      url: "https://scp-wiki.wikidot.com/scp-7000"
      fetched_at: "2026-09-21T00:00:00Z"
    caption:
      ja: "SCP-7000は、局所的な不運を自身、すなわちDr. William Wallace Wettleに集中させる確率の沈み込みです。"
      en: &p3 "SCP-7000 is a probability sink that concentrates local misfortune on Dr. William Wallace Wettle himself."
