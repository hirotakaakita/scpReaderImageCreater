panels:
  - scene: >
      Wide shot, full body, eye level, showing a locked storage vault
      lined with numbered steel boxes on shelving. One open box in the
      foreground reveals a cast iron collar with a numbered metal tag
      inside. attending-researcher-f stands at the shelf with a
      clipboard, checking numbers against a checklist.
    characters: [attending-researcher-f]
    caption:
      ja: "SCP-010は、番号付きの金属タグが付いた、一見同一に見える六(6)個の鋳鉄製の首輪と、一(1)個のリモコンから構成される。首輪には精巧な電子部品が内蔵されており、小型の充電式電池で駆動する。"
      en: "SCP-010 consists of a series of six (6) apparently identical cast iron collars with numbered metal tags and one (1) remote control. The collars contain intricate electronic components and are powered by small rechargeable batteries."
      cs: "SCP-010 se skládá ze šesti (6) zdánlivě identických litinových obojků s očíslovanými kovovými štítky a jednoho (1) dálkového ovladače. Obojky obsahují propracované elektronické součástky a jsou napájeny malými dobíjecími bateriemi."
      de: "SCP-010 besteht aus sechs (6) scheinbar identischen gusseisernen Halsbändern mit nummerierten Metallanhängern und einer (1) Fernbedienung. Die Halsbänder enthalten komplexe elektronische Komponenten und werden von kleinen wiederaufladbaren Batterien gespeist."
      es: "SCP-010 consiste en una serie de seis (6) collares de hierro fundido aparentemente idénticos con etiquetas metálicas numeradas y un (1) control remoto. Los collares contienen intrincados componentes electrónicos y son alimentados por pequeñas baterías recargables."
      fr: "Le SCP-010 se compose de six (6) colliers en fonte apparemment identiques munis d'étiquettes métalliques numérotées et d'une (1) télécommande. Les colliers contiennent des composants électroniques complexes et sont alimentés par de petites piles rechargeables."
      it: "SCP-010 è composto da sei (6) collari in ghisa apparentemente identici con targhette metalliche numerate e un (1) telecomando. I collari contengono intricati componenti elettronici e sono alimentati da piccole batterie ricaricabili."
      ko: "SCP-010은 번호가 매겨진 금속 태그가 달린 겉보기에 동일한 여섯(6) 개의 주철 목걸이와 하나(1)의 리모컨으로 구성된다. 목걸이에는 정교한 전자 부품이 내장되어 있으며 소형 충전식 배터리로 구동된다."
      pl: "SCP-010 składa się z sześciu (6) pozornie identycznych żeliwnych obroży z ponumerowanymi metalowymi tabliczkami oraz jednego (1) pilota. Obroże zawierają skomplikowane komponenty elektroniczne i są zasilane małymi akumulatorami."
      pt: "O SCP-010 consiste em uma série de seis (6) coleiras de ferro fundido aparentemente idênticas com etiquetas metálicas numeradas e um (1) controle remoto. As coleiras contêm componentes eletrônicos intrincados e são alimentadas por pequenas baterias recarregáveis."
      th: "SCP-010 ประกอบด้วยปลอกคอเหล็กหล่อที่ดูเหมือนเหมือนกันหกอัน (6) พร้อมป้ายโลหะมีหมายเลข และรีโมทคอนโทรลหนึ่งอัน (1) ปลอกคอมีส่วนประกอบอิเล็กทรอนิกส์ที่ซับซ้อนและขับเคลื่อนด้วยแบตเตอรี่ชาร์จไฟได้ขนาดเล็ก"
      uk: "SCP-010 складається з шести (6) на вигляд ідентичних чавунних нашийників з пронумерованими металевими бирками та одного (1) пульта дистанційного керування. Нашийники містять складні електронні компоненти і живляться від малих акумуляторних батарей."
      vi: "SCP-010 bao gồm sáu (6) chiếc vòng cổ bằng gang có vẻ giống hệt nhau với thẻ kim loại đánh số và một (1) bộ điều khiển từ xa. Các vòng cổ chứa các linh kiện điện tử phức tạp và được cấp nguồn bằng pin sạc nhỏ."
      zh: "SCP-010由六(6)个外观相同、带有编号金属标签的铸铁项圈，以及一(1)个遥控器组成。项圈内含精密的电子元件，由小型可充电电池供电。"
      zh_Hant: "SCP-010由六(6)個外觀相同、帶有編號金屬標籤的鑄鐵項圈，以及一(1)個遙控器組成。項圈內含精密的電子元件，由小型可充電電池供電。"

  - scene: >
      Close-up, low angle, filling most of the frame with a heavy black
      remote control resembling an old-style handheld radio transmitter,
      its primitive blue-white cathode ray screen glowing faintly and a
      dense grid of over a hundred unlabeled buttons covering its
      surface. attending-researcher-m holds it up at the edge of the
      frame, squinting at the buttons in bewilderment.
    characters: [attending-researcher-m]
    caption:
      ja: "リモコンは旧式の携帯無線送受信機に似た重い黒い箱で、原始的な青白のブラウン管画面と100個以上の無表示ボタンが並んでいる。金属には労働者がピラミッドを建設する様子を描いたロゴとともに、ロシア語の表示が刻印されている。"
      en: "The remote is a heavy black box resembling an old-style hand-held radio transmitter, with a primitive blue/white cathode ray screen and a series of more than 100 unlabeled buttons. A label in Russian is stamped into the metal along with a logo of workers building a pyramid."
      cs: "Dálkový ovladač je těžká černá krabice připomínající staromódní ruční radiový vysílač/přijímač s primitivní modrobílou obrazovkou katodové trubice a řadou více než 100 neoznačených tlačítek. Do kovu je vyraženo ruské označení spolu s logem znázorňujícím dělníky stavějící pyramidu."
      de: "Die Fernbedienung ist eine schwere schwarze Box, die einem altmodischen tragbaren Funksender/-empfänger ähnelt, mit einem primitiven blau-weißen Kathodenstrahlbildschirm und einer Reihe von mehr als 100 unbeschrifteten Tasten. In das Metall ist eine russische Aufschrift zusammen mit einem Logo eingeprägt, das Arbeiter beim Bau einer Pyramide zeigt."
      es: "El control remoto es una pesada caja negra que se asemeja a un transmisor de radio portátil de estilo antiguo, con una primitiva pantalla de tubo de rayos catódicos azul y blanco y una serie de más de 100 botones sin etiquetar. En el metal está estampada una etiqueta en ruso junto con un logotipo de trabajadores construyendo una pirámide."
      fr: "La télécommande est une lourde boîte noire ressemblant à un émetteur-récepteur radio portatif à l'ancienne, avec un écran cathodique bleu/blanc rudimentaire et une série de plus de 100 boutons non étiquetés. Une inscription en russe est estampée dans le métal, accompagnée d'un logo représentant des ouvriers construisant une pyramide."
      it: "Il telecomando è una pesante scatola nera simile a un vecchio ricetrasmettitore radio portatile, con un rudimentale schermo a tubo catodico blu/bianco e una serie di oltre 100 pulsanti senza etichetta. Nel metallo è impressa un'etichetta in russo insieme a un logo raffigurante operai che costruiscono una piramide."
      ko: "리모컨은 구식 휴대용 무전기와 비슷한 무거운 검은 상자로, 원시적인 청백색 브라운관 화면과 100개 이상의 표시 없는 버튼이 나열되어 있다. 금속에는 피라미드를 건설하는 노동자들을 묘사한 로고와 함께 러시아어 표기가 새겨져 있다."
      pl: "Pilot to ciężkie czarne pudełko przypominające staromodny ręczny nadajnik/odbiornik radiowy, z prymitywnym niebiesko-białym ekranem lampy kineskopowej i szeregiem ponad 100 nieoznaczonych przycisków. W metalu wytłoczono rosyjski napis wraz z logo przedstawiającym robotników budujących piramidę."
      pt: "O controle remoto é uma pesada caixa preta que lembra um transmissor de rádio portátil antigo, com uma primitiva tela de tubo de raios catódicos azul/branca e uma série de mais de 100 botões sem etiqueta. Um rótulo em russo está estampado no metal junto com um logotipo de trabalhadores construindo uma pirâmide."
      th: "รีโมทคอนโทรลเป็นกล่องสีดำหนักที่มีลักษณะคล้ายเครื่องรับส่งวิทยุมือถือแบบเก่า มีหน้าจอหลอดรังสีแคโทดสีน้ำเงิน/ขาวแบบดั้งเดิม และปุ่มที่ไม่มีป้ายกำกับมากกว่า 100 ปุ่ม มีป้ายภาษารัสเซียปั๊มลงบนโลหะพร้อมกับโลโก้รูปคนงานกำลังสร้างพีระมิด"
      uk: "Пульт — це важка чорна коробка, схожа на старомодний портативний радіопередавач/приймач, з примітивним синьо-білим екраном на електронно-променевій трубці та рядом з понад 100 непозначених кнопок. У метал вибито напис російською разом із логотипом, що зображує робітників, які будують піраміду."
      vi: "Bộ điều khiển là một chiếc hộp đen nặng nề trông giống như máy bộ đàm cầm tay kiểu cũ, với màn hình ống tia âm cực xanh/trắng thô sơ và hàng loạt hơn 100 nút bấm không có nhãn. Một nhãn tiếng Nga được dập vào kim loại cùng với biểu tượng những người công nhân đang xây kim tự tháp."
      zh: "遥控器是一个笨重的黑色盒子，外形类似老式手持无线电收发机，带有原始的蓝白色阴极射线屏幕和一百多个未标记的按钮。金属上刻有俄文标签，还有一个工人建造金字塔的徽标。"
      zh_Hant: "遙控器是一個笨重的黑色盒子，外形類似舊式手持無線電收發機，帶有原始的藍白色陰極射線屏幕和一百多個未標記的按鈕。金屬上刻有俄文標籤，還有一個工人建造金字塔的徽標。"

  - scene: >
      Medium shot, waist-up, eye level, a different framing from the
      close-up before. On the left side of the frame, d-class sits
      tensely on a stool. On the right side of the frame,
      attending-researcher-f leans in, fastening the cast iron collar
      around his neck with gloved hands.
    characters: [d-class, attending-researcher-f]
    caption:
      ja: "SCP-010を構成する物品は、高セキュリティ施設内の番号付き施錠ボックスに保管する。試験対象者以外に着用させてはならず、試験のために保管庫から取り出す場合を除いては持ち出さない。"
      en: "The objects comprising SCP-010 are to be kept in numbered locked boxes in a high security facility. They are not to be worn except by test subjects, and are only to be removed from storage for testing."
      cs: "Předměty tvořící SCP-010 musí být uchovávány v očíslovaných uzamčených schránkách ve vysoce zabezpečeném zařízení. Nesmí být nošeny nikým jiným než testovanými subjekty a smí být vyjmuty ze skladu pouze za účelem testování."
      de: "Die Objekte, aus denen SCP-010 besteht, sind in nummerierten, verschlossenen Kisten in einer hochsicheren Einrichtung aufzubewahren. Sie dürfen nur von Testsubjekten getragen werden und dürfen nur zu Testzwecken aus der Lagerung entnommen werden."
      es: "Los objetos que componen SCP-010 deben mantenerse en cajas numeradas y cerradas con llave en una instalación de alta seguridad. No deben ser usados excepto por sujetos de prueba, y solo deben retirarse del almacenamiento para realizar pruebas."
      fr: "Les objets composant le SCP-010 doivent être conservés dans des boîtes numérotées et verrouillées dans une installation à haute sécurité. Ils ne doivent être portés que par des sujets de test, et ne doivent être retirés du stockage que pour les tests."
      it: "Gli oggetti che compongono SCP-010 devono essere conservati in scatole numerate e chiuse a chiave in una struttura ad alta sicurezza. Non devono essere indossati se non dai soggetti di test, e devono essere prelevati dal deposito solo per i test."
      ko: "SCP-010을 구성하는 물품은 고보안 시설 내의 번호가 매겨진 잠긴 상자에 보관되어야 한다. 시험 대상자 외에는 착용해서는 안 되며, 시험을 위해서만 보관소에서 반출되어야 한다."
      pl: "Przedmioty składające się na SCP-010 muszą być przechowywane w ponumerowanych, zamkniętych na klucz skrzynkach w placówce o wysokim poziomie zabezpieczeń. Nie wolno ich nosić nikomu poza osobnikami testowymi i można je wyjmować z magazynu wyłącznie w celu przeprowadzenia testów."
      pt: "Os objetos que compõem o SCP-010 devem ser mantidos em caixas numeradas e trancadas em uma instalação de alta segurança. Não devem ser usados exceto por sujeitos de teste, e só devem ser retirados do armazenamento para testes."
      th: "วัตถุที่ประกอบเป็น SCP-010 ต้องเก็บไว้ในกล่องล็อกที่มีหมายเลขในสถานที่ที่มีความปลอดภัยสูง ห้ามสวมใส่ยกเว้นโดยผู้เข้าร่วมทดสอบ และจะนำออกจากที่เก็บได้เฉพาะเพื่อการทดสอบเท่านั้น"
      uk: "Предмети, що складають SCP-010, повинні зберігатися в пронумерованих замкнених ящиках у високозахищеному об'єкті. Їх не можна одягати нікому, крім тестових суб'єктів, і виносити зі сховища можна лише для тестування."
      vi: "Các vật thể cấu thành SCP-010 phải được cất giữ trong các hộp khóa được đánh số tại một cơ sở an ninh cao. Chúng không được đeo trừ khi là đối tượng thử nghiệm, và chỉ được lấy ra khỏi kho để thử nghiệm."
      zh: "构成SCP-010的物品须存放在高安保设施内带编号的上锁箱子中。除测试对象外不得佩戴，且只有在测试时方可从存储处取出。"
      zh_Hant: "構成SCP-010的物品須存放在高安保設施內帶編號的上鎖箱子中。除測試對象外不得佩戴，且只有在測試時方可從存儲處取出。"

  - scene: >
      Wide shot, full body, eye level, pulled back to show the whole
      testing chamber, a very different framing from the tight medium
      shot before. On the left side of the frame, d-class's arm has been
      comically stretched and bent at an impossible rubbery angle by the
      collar, his expression more startled than pained. On the right
      side of the frame, attending-researcher-m fumbles with the
      remote's buttons in a panic while attending-researcher-f watches
      with wide eyes.
    characters: [d-class, attending-researcher-m, attending-researcher-f]
    caption:
      ja: "首輪を人の首に装着することで、リモコンを使ってその者のあらゆる動作を操作できるようになる。首輪の最も異常な特徴は、身体の形態に及ぼす効果であり、対象者の形状を作り変えることができる。"
      en: "Placing the collar around the neck of a person allows one to control their every movement with the remote. The most abnormal feature of the collars is the effect they have on body morphology, reconfiguring the shape of the victim."
      cs: "Nasazení obojku na krk osoby umožňuje pomocí dálkového ovladače ovládat každý její pohyb. Nejneobvyklejší vlastností obojků je jejich vliv na tělesnou morfologii, díky němuž lze měnit tvar oběti."
      de: "Wird das Halsband um den Hals einer Person gelegt, kann man mit der Fernbedienung jede ihrer Bewegungen steuern. Das ungewöhnlichste Merkmal der Halsbänder ist ihre Wirkung auf die Körpermorphologie, die es ermöglicht, die Form des Opfers umzugestalten."
      es: "Colocar el collar alrededor del cuello de una persona permite controlar cada uno de sus movimientos con el control remoto. La característica más anómala de los collares es su efecto sobre la morfología corporal, reconfigurando la forma de la víctima."
      fr: "Placer le collier autour du cou d'une personne permet de contrôler chacun de ses mouvements avec la télécommande. La caractéristique la plus anormale des colliers est leur effet sur la morphologie corporelle, permettant de reconfigurer la forme de la victime."
      it: "Posizionare il collare intorno al collo di una persona permette di controllarne ogni movimento tramite il telecomando. La caratteristica più anomala dei collari è l'effetto che hanno sulla morfologia corporea, riconfigurando la forma della vittima."
      ko: "목걸이를 사람의 목에 두르면 리모컨으로 그 사람의 모든 움직임을 제어할 수 있다. 목걸이의 가장 이상한 특징은 신체 형태에 미치는 영향으로, 대상의 형체를 재구성할 수 있다는 점이다."
      pl: "Założenie obroży na szyję osoby pozwala kontrolować każdy jej ruch za pomocą pilota. Najbardziej nietypową cechą obroży jest ich wpływ na morfologię ciała, umożliwiający przekształcanie kształtu ofiary."
      pt: "Colocar a coleira ao redor do pescoço de uma pessoa permite controlar cada um de seus movimentos com o controle remoto. A característica mais anormal das coleiras é o efeito que têm sobre a morfologia corporal, reconfigurando a forma da vítima."
      th: "การสวมปลอกคอรอบคอของบุคคลช่วยให้สามารถควบคุมการเคลื่อนไหวทุกอย่างของเขาได้ด้วยรีโมท คุณลักษณะที่ผิดปกติที่สุดของปลอกคอคือผลกระทบต่อสัณฐานวิทยาของร่างกาย ซึ่งสามารถปรับรูปทรงของเหยื่อได้ใหม่"
      uk: "Надягання нашийника на шию людини дозволяє керувати кожним її рухом за допомогою пульта. Найнезвичайнішою рисою нашийників є їхній вплив на морфологію тіла, що дозволяє переформовувати форму жертви."
      vi: "Việc đeo vòng cổ quanh cổ một người cho phép điều khiển mọi cử động của họ bằng bộ điều khiển từ xa. Đặc điểm bất thường nhất của vòng cổ là tác động của chúng lên hình thái cơ thể, có thể định hình lại hình dạng của nạn nhân."
      zh: "将项圈套在一个人的脖子上，就能用遥控器控制其每一个动作。项圈最异常的特性在于它对身体形态的影响，能够重新塑造受害者的形体。"
      zh_Hant: "將項圈套在一個人的脖子上，就能用遙控器控制其每一個動作。項圈最異常的特性在於它對身體形態的影響，能夠重新塑造受害者的形體。"
