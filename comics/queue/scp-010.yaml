# SCP-010 4コマ台本
# captionはSpecial Containment Procedures / Description本文からの引用。
# Addendum 010-1（発見時の遺体等の描写）と010-2（解体実験）は本編に混ぜず、
# グロ回避のため対象の身体形態変化はスラップスティック寄りに描写した。
# キャラにセリフは言わせない。JP公式訳が直接取得できなかったため、検証済みの
# 英語本文からの翻訳（ja含む）。

