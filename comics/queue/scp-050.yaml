object_class: Euclid

local_characters:
  scp-050:
    name: SCP-050
    description: >
      A small stone statue, about 30cm tall, carved in the likeness of
      a monkey sitting cross-legged and holding an open book, weathered
      gray-brown stone (color RGB 120,105,90), a mischievous carved
      expression frozen on its face.

characters: [scp-050, attending-researcher-m, attending-researcher-f]

panels:
  - scene: >
      Close-up, filling most of the frame, on scp-050 sitting on a desk
      corner, monkey posture hunched over its stone book, a faint carved
      smirk. attending-researcher-m examines it with a magnifying glass,
      puzzled expression.
    characters: [scp-050, attending-researcher-m]
    caption:
      ja: "SCP-050は、本を読む猿の像のように見え、高さはおよそ1フィートである。像の底面には「最も賢い者へ」という文言が筆記体で刻まれている。この像はあらゆる種類の損傷に対して耐性を示している。"
      en: "SCP-050 appears to be a statue of a monkey reading a book, approximately 1 foot tall. On the bottom of the statue are engraved the words 'To The Cleverest.' The statue has proven resistant to all forms of damage."
      cs: "SCP-050 vypadá jako socha opice čtoucí knihu, vysoká přibližně 30 cm (1 stopa). Na spodní straně sochy je kurzívou vyryt nápis 'Nejchytřejšímu'. Socha se ukázala být odolná vůči veškerému poškození."
      de: "SCP-050 erscheint als Statue eines Affen, der ein Buch liest, etwa 30 cm (1 Fuß) groß. Auf der Unterseite der Statue sind in Kursivschrift die Worte 'Für den Klügsten' eingraviert. Die Statue hat sich als widerstandsfähig gegen jede Art von Beschädigung erwiesen."
      es: "SCP-050 parece ser una estatua de un mono leyendo un libro, de aproximadamente 30 cm de altura. En la base de la estatua están grabadas las palabras 'Para el más ingenioso' en escritura cursiva. La estatua ha demostrado ser resistente a todo tipo de daño."
      fr: "Le SCP-050 se présente comme une statue d'un singe lisant un livre, d'environ 30 cm de haut. Sur la base de la statue sont gravés en écriture cursive les mots « Au plus astucieux ». La statue s'est révélée résistante à toute forme de dommage."
      it: "SCP-050 appare come una statua di una scimmia che legge un libro, alta circa 30 cm. Sulla base della statua sono incise in corsivo le parole 'Al più intelligente'. La statua si è dimostrata resistente a ogni forma di danno."
      ko: "SCP-050은 책을 읽는 원숭이 조각상처럼 보이며, 높이는 약 30cm(1피트)이다. 조각상 밑면에는 필기체로 '가장 영리한 자에게'라는 문구가 새겨져 있다. 이 조각상은 모든 형태의 손상에 대해 내성을 보였다."
      pl: "SCP-050 wygląda jak posąg małpy czytającej książkę, wysoki na około 30 cm (1 stopę). Na spodzie posągu wygrawerowano kursywą słowa 'Dla Najsprytniejszego'. Posąg okazał się odporny na wszelkie formy uszkodzeń."
      pt: "O SCP-050 parece ser uma estátua de um macaco lendo um livro, com aproximadamente 30 cm de altura. Na base da estátua estão gravadas as palavras 'Ao Mais Astuto' em letra cursiva. A estátua se mostrou resistente a todas as formas de dano."
      th: "SCP-050 มีลักษณะเหมือนรูปปั้นลิงกำลังอ่านหนังสือ สูงประมาณ 1 ฟุต ที่ด้านล่างของรูปปั้นมีข้อความสลักด้วยลายมือเขียนว่า 'แด่ผู้ฉลาดที่สุด' รูปปั้นนี้พิสูจน์แล้วว่าทนทานต่อความเสียหายทุกรูปแบบ"
      uk: "SCP-050 виглядає як статуя мавпи, що читає книгу, заввишки приблизно 30 см (1 фут). На нижній частині статуї курсивом викарбувано слова 'Найкмітливішому'. Статуя виявилася стійкою до будь-яких видів пошкоджень."
      vi: "SCP-050 trông giống một bức tượng con khỉ đang đọc sách, cao khoảng 30 cm (1 foot). Ở đáy bức tượng khắc dòng chữ viết tay 'Dành Cho Người Thông Minh Nhất'. Bức tượng đã chứng tỏ khả năng chống chịu mọi hình thức hư hại."
      zh: "SCP-050外观是一座正在读书的猴子雕像，高约1英尺（30厘米）。雕像底部以草书刻着「致最聪明的人」字样。这座雕像已被证实能抵御各种形式的损坏。"
      zh_Hant: "SCP-050外觀是一座正在讀書的猴子雕像，高約1英尺（30公分）。雕像底部以草書刻著「致最聰明的人」字樣。這座雕像已被證實能抵禦各種形式的損壞。"

  - scene: >
      Wide shot, full body, eye level, a different framing from the
      close-up before, showing attending-researcher-f carrying scp-050
      down a hallway toward a busy, well-used office at the end,
      glancing back nervously over her shoulder.
    characters: [attending-researcher-f, scp-050]
    caption:
      ja: "SCP-050を所持する者は、自身が日常的に使用する執務室に置いておくこと。使用されていない部屋に置こうとした結果、SCP-050は所有者の自宅までついてきたことが確認されている。"
      en: "Whoever has possession of SCP-050 is to leave it in an office they use with regularity. Attempts to leave SCP-050 in unused offices have resulted in it following its owner home."
      cs: "Kdokoli má SCP-050 v držení, musí ho ponechat v kanceláři, kterou pravidelně používá. Pokusy ponechat SCP-050 v nevyužívaných kancelářích vedly k tomu, že sledovalo svého majitele domů."
      de: "Wer immer im Besitz von SCP-050 ist, hat es in einem Büro zu belassen, das er regelmäßig nutzt. Versuche, SCP-050 in ungenutzten Büros zurückzulassen, führten dazu, dass es seinem Besitzer nach Hause folgte."
      es: "Quien esté en posesión de SCP-050 debe dejarlo en una oficina que use con regularidad. Los intentos de dejar SCP-050 en oficinas sin uso han resultado en que este siga a su propietario hasta su casa."
      fr: "Quiconque est en possession du SCP-050 doit le laisser dans un bureau qu'il utilise régulièrement. Les tentatives de laisser le SCP-050 dans des bureaux inutilisés ont entraîné le fait qu'il suive son propriétaire jusqu'à son domicile."
      it: "Chiunque sia in possesso di SCP-050 deve lasciarlo in un ufficio che utilizza regolarmente. I tentativi di lasciare SCP-050 in uffici inutilizzati hanno portato l'oggetto a seguire il proprietario fino a casa."
      ko: "SCP-050을 소유한 자는 자신이 정기적으로 사용하는 사무실에 그것을 두어야 한다. 사용하지 않는 사무실에 SCP-050을 두려는 시도는 그것이 소유자를 집까지 따라가는 결과를 낳았다."
      pl: "Osoba posiadająca SCP-050 musi zostawiać je w biurze, którego regularnie używa. Próby pozostawienia SCP-050 w nieużywanych biurach skutkowały tym, że podążało ono za swoim właścicielem do domu."
      pt: "Quem estiver na posse do SCP-050 deve deixá-lo em um escritório que use com regularidade. Tentativas de deixar o SCP-050 em escritórios não utilizados resultaram nele seguindo seu proprietário até em casa."
      th: "ผู้ใดก็ตามที่ครอบครอง SCP-050 ต้องวางไว้ในสำนักงานที่ตนใช้งานเป็นประจำ ความพยายามที่จะวาง SCP-050 ไว้ในสำนักงานที่ไม่ได้ใช้งานส่งผลให้มันติดตามเจ้าของกลับบ้าน"
      uk: "Хто б не мав у власності SCP-050, повинен залишати його в кабінеті, яким регулярно користується. Спроби залишити SCP-050 у невикористовуваних кабінетах призводили до того, що воно йшло за власником додому."
      vi: "Bất cứ ai sở hữu SCP-050 phải để nó tại văn phòng mà họ sử dụng thường xuyên. Những nỗ lực để SCP-050 tại các văn phòng không sử dụng đã dẫn đến việc nó theo chủ nhân về nhà."
      zh: "凡拥有SCP-050者，须将其留置于自己经常使用的办公室内。曾有人试图将SCP-050留在无人使用的办公室，结果它跟随主人回了家。"
      zh_Hant: "凡擁有SCP-050者，須將其留置於自己經常使用的辦公室內。曾有人試圖將SCP-050留在無人使用的辦公室，結果牠跟隨主人回了家。"

  - scene: >
      Wide shot, full body, eye level, pulled back to show a tidy,
      gleaming office, a different framing from the hallway shot before.
      attending-researcher-m stands in the doorway, stunned, looking at
      his now spotless desk — papers neatly stacked, trash bin empty,
      everything polished — with scp-050 sitting innocently in the
      corner exactly where it was left.
    characters: [attending-researcher-m, scp-050]
    caption:
      ja: "動く様子は決して目撃されないものの、SCP-050が置かれた部屋は非常に清潔になり、可能な限りぴかぴかに磨き上げられる。書類は整理され、ゴミは片付けられ、雑然としたものは取り除かれる。"
      en: "Although never seen to move, any room SCP-050 is left in becomes very clean, to a polish whenever possible. Paperwork is filed, trash is emptied, and clutter is removed."
      cs: "Ačkoli nikdy nebylo spatřeno v pohybu, jakákoli místnost, kde je SCP-050 ponecháno, se stane velmi čistou, pokud možno vyleštěnou dohladka. Papíry jsou uspořádány, koš je vyprázdněn a nepořádek je odstraněn."
      de: "Obwohl es nie in Bewegung beobachtet wurde, wird jeder Raum, in dem SCP-050 zurückgelassen wird, sehr sauber, wenn möglich sogar poliert. Papiere werden abgeheftet, Abfall entleert und Unordnung beseitigt."
      es: "Aunque nunca se le ha visto moverse, cualquier habitación en la que se deje SCP-050 se vuelve muy limpia, incluso pulida cuando es posible. Los documentos se archivan, la basura se vacía y el desorden se elimina."
      fr: "Bien qu'on ne l'ait jamais vu bouger, toute pièce où le SCP-050 est laissé devient très propre, voire polie quand cela est possible. Les papiers sont classés, les poubelles vidées, et le désordre est éliminé."
      it: "Sebbene non sia mai stato visto muoversi, qualsiasi stanza in cui viene lasciato SCP-050 diventa molto pulita, se possibile lucidata a specchio. Le carte vengono archiviate, la spazzatura svuotata e il disordine rimosso."
      ko: "움직이는 모습이 목격된 적은 전혀 없지만, SCP-050이 놓인 방은 매우 깨끗해지며 가능하다면 광이 날 정도가 된다. 서류는 정리되고, 쓰레기는 비워지며, 잡동사니는 치워진다."
      pl: "Choć nigdy nie zaobserwowano, by się poruszało, każde pomieszczenie, w którym pozostawiono SCP-050, staje się bardzo czyste, w miarę możliwości wypolerowane na błysk. Dokumenty zostają uporządkowane, kosze opróżnione, a bałagan usunięty."
      pt: "Embora nunca tenha sido visto se movendo, qualquer sala onde o SCP-050 é deixado se torna muito limpa, polida sempre que possível. Papéis são arquivados, o lixo é esvaziado e a bagunça é removida."
      th: "แม้จะไม่เคยมีใครเห็นมันเคลื่อนไหว แต่ห้องใดก็ตามที่วาง SCP-050 ไว้จะสะอาดมาก และขัดเงาทุกครั้งที่เป็นไปได้ เอกสารจะถูกจัดเก็บ ขยะจะถูกทิ้ง และความรกรุงรังจะถูกกำจัด"
      uk: "Хоча його ніколи не бачили в русі, будь-яка кімната, де залишають SCP-050, стає дуже чистою, а по можливості й відполірованою. Папери підшиваються, сміття виноситься, а безлад прибирається."
      vi: "Mặc dù chưa từng thấy nó di chuyển, bất kỳ căn phòng nào có SCP-050 đều trở nên rất sạch sẽ, bóng loáng khi có thể. Giấy tờ được sắp xếp, rác được đổ, và sự bừa bộn được dọn dẹp."
      zh: "尽管从未有人目睹它移动，但只要SCP-050被留在某个房间，那个房间就会变得非常整洁，甚至尽可能被打磨得锃亮。文件会被归档，垃圾会被清空，杂物会被清理干净。"
      zh_Hant: "儘管從未有人目睹牠移動，但只要SCP-050被留在某個房間，那個房間就會變得非常整潔，甚至盡可能被打磨得鋥亮。文件會被歸檔，垃圾會被清空，雜物會被清理乾淨。"

  - scene: >
      Medium shot, waist-up, eye level, a different framing from the
      wide tidy-office shot before. attending-researcher-f pushes her
      office door open just a crack, peering warily around the edge,
      spotting an obviously rigged bucket balanced precariously atop the
      door and a banana peel placed dead center on the floor.
    characters: [attending-researcher-f]
    caption:
      ja: "SCP-050は所有者に対して罠を仕掛ける傾向もあるため、現在の所持者は執務室に戻る際に注意深く確認することが望ましい。"
      en: "SCP-050 also has a tendency to leave traps for its owner, so current holders should carefully check their offices upon returning."
      cs: "SCP-050 má také sklon připravovat svému majiteli léčky, takže by si aktuální držitelé měli po návratu pečlivě zkontrolovat své kanceláře."
      de: "SCP-050 neigt außerdem dazu, seinem Besitzer Fallen zu stellen, weshalb aktuelle Halter ihr Büro bei der Rückkehr sorgfältig überprüfen sollten."
      es: "SCP-050 también tiende a dejar trampas para su propietario, por lo que los actuales poseedores deben revisar cuidadosamente sus oficinas al regresar."
      fr: "Le SCP-050 a également tendance à laisser des pièges pour son propriétaire, c'est pourquoi les détenteurs actuels doivent vérifier soigneusement leur bureau à leur retour."
      it: "SCP-050 tende inoltre a lasciare trappole per il proprio proprietario, quindi gli attuali detentori dovrebbero controllare attentamente i propri uffici al ritorno."
      ko: "SCP-050은 또한 소유자에게 함정을 남기는 경향이 있으므로, 현재 소지자는 사무실로 돌아올 때 신중하게 확인해야 한다."
      pl: "SCP-050 ma również tendencję do zastawiania pułapek na swojego właściciela, więc obecni posiadacze powinni dokładnie sprawdzać swoje biura po powrocie."
      pt: "O SCP-050 também tende a deixar armadilhas para seu proprietário, portanto os atuais detentores devem verificar cuidadosamente seus escritórios ao retornar."
      th: "SCP-050 ยังมีแนวโน้มที่จะวางกับดักไว้ให้เจ้าของด้วย ดังนั้นผู้ครอบครองในปัจจุบันควรตรวจสอบสำนักงานของตนอย่างละเอียดเมื่อกลับเข้ามา"
      uk: "SCP-050 також має тенденцію залишати пастки для свого власника, тому нинішні власники повинні ретельно перевіряти свої кабінети після повернення."
      vi: "SCP-050 cũng có xu hướng để lại bẫy cho chủ nhân của nó, vì vậy những người hiện đang giữ nó nên kiểm tra kỹ văn phòng của mình khi quay lại."
      zh: "SCP-050还有为主人设置陷阱的倾向，因此目前的持有者返回办公室时应仔细检查。"
      zh_Hant: "SCP-050還有為主人設置陷阱的傾向，因此目前的持有者返回辦公室時應仔細檢查。"
