# SCP-050 4コマ台本
# captionはSpecial Containment Procedures / Description本文からの引用。
# 脚注にある「致命的になっていく悪戯」という記述はグロ回避のため、罠は
# バケツやバナナの皮といった無害でコミカルなものとして描写した。キャラに
# セリフは言わせない。JP公式訳が直接取得できなかったため、検証済みの
# 英語本文からの翻訳（ja含む）。

id: scp-050

