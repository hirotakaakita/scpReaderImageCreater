# SCP-173「彫刻 - オリジナル」4コマ台本
# captionは記事本文（Special Containment Procedures / Description）からの引用。
# 公式添付画像（彫刻写真）はCCライセンスでないため模写しない。外見は記事本文
# （コンクリートと鉄筋、クリロン社製スプレー塗料の痕跡）のみを根拠に描写する。
# キャラにセリフは言わせない。

id: scp-173

title:
  en: "SCP-173: The Sculpture"
  ja: "SCP-173：彫刻 - オリジナル"
  cs: "SCP-173: Socha"
  de: "SCP-173: Die Skulptur"
  es: "SCP-173: La Escultura"
  fr: "SCP-173 : La Sculpture"
  it: "SCP-173: La Scultura"
  ko: "SCP-173: 조각상"
  pl: "SCP-173: Rzeźba"
  pt: "SCP-173: A Escultura"
  th: "SCP-173: ประติมากรรม"
  uk: "SCP-173: Скульптура"
  vi: "SCP-173: Bức Tượng"
  zh: "SCP-173：雕塑"
  zh_Hant: "SCP-173：雕塑"

attribution:
  article: "SCP-173"
  source_url: "http://scp-wiki.wikidot.com/scp-173"
  license: "CC BY-SA 3.0"

object_class: Euclid

local_characters:
  scp-173:
    name: SCP-173
    description: >
      SCP-173, a roughly human-sized, vaguely humanoid statue made of rough
      unfinished gray concrete (color RGB 130,128,122), with rusted metal
      rebar (color RGB 120,80,50) exposed and protruding at a few of its
      joints and edges, faint scattered traces of tan spray paint dashed
      across its surface, no visible facial features at all — just smooth
      blank concrete where a face would be — an ambiguous, still, silent
      silhouette.

characters: [attending-researcher-m, attending-researcher-f]

panels:
  - scene: >
      Wide shot, full body, eye level, showing the whole small containment
      chamber. On the left side of the frame, the attending researcher and
      a second colleague step through a heavy door into the chamber. On the
      right side of the frame, SCP-173 stands motionless against the far
      wall. A gloved hand is visible at the door's edge, already turning a
      large key to relock it from outside the frame.
    characters: [attending-researcher-m, attending-researcher-f, scp-173]
    caption:
      ja: "SCP-173は常に施錠された収容室内に保管される。職員がSCP-173の収容室に立ち入る際は、3名以上で入室し、ドアは入室後に再施錠すること。"
      en: "Item SCP-173 is to be kept in a locked container at all times. When personnel must enter SCP-173's container, no fewer than 3 may enter at any time and the door is to be relocked behind them."
      cs: "Předmět SCP-173 musí být neustále uchováván v uzamčeném kontejneru. Musí-li personál vstoupit do kontejneru SCP-173, smí tak vždy učinit nejméně 3 osoby a dveře musí být po jejich vstupu opět uzamčeny."
      de: "Objekt SCP-173 ist jederzeit in einem verschlossenen Behälter aufzubewahren. Muss Personal den Behälter von SCP-173 betreten, dürfen dies zu keinem Zeitpunkt weniger als 3 Personen tun, und die Tür ist nach ihnen wieder zu verschließen."
      es: "El ítem SCP-173 debe permanecer en un contenedor cerrado en todo momento. Cuando el personal deba entrar en el contenedor de SCP-173, no podrán hacerlo menos de 3 personas a la vez, y la puerta deberá volver a cerrarse tras ellos."
      fr: "L'objet SCP-173 doit être conservé en permanence dans un conteneur verrouillé. Lorsque du personnel doit pénétrer dans le conteneur de SCP-173, au moins 3 personnes doivent y entrer et la porte doit être reverrouillée derrière elles."
      it: "L'oggetto SCP-173 deve essere tenuto in un contenitore chiuso a chiave in ogni momento. Quando il personale deve entrare nel contenitore di SCP-173, non possono entrare meno di 3 persone alla volta e la porta deve essere richiusa a chiave dietro di loro."
      ko: "SCP-173은 항상 잠긴 용기 안에 보관되어야 한다. 직원이 SCP-173의 용기에 들어가야 할 경우, 최소 3명 이상이 함께 입실해야 하며 문은 들어간 후 다시 잠가야 한다."
      pl: "Przedmiot SCP-173 musi być zawsze przechowywany w zamkniętym kontenerze. Gdy personel musi wejść do kontenera SCP-173, nie może to być mniej niż 3 osoby naraz, a drzwi należy ponownie zamknąć za nimi."
      pt: "O item SCP-173 deve ser mantido em um contêiner trancado o tempo todo. Quando o pessoal precisar entrar no contêiner do SCP-173, nunca menos de 3 pessoas devem entrar, e a porta deve ser trancada novamente atrás delas."
      th: "วัตถุ SCP-173 ต้องถูกเก็บไว้ในภาชนะที่ล็อกอยู่ตลอดเวลา เมื่อเจ้าหน้าที่ต้องเข้าไปในภาชนะของ SCP-173 ต้องมีผู้เข้าไปไม่น้อยกว่า 3 คนในแต่ละครั้ง และประตูต้องถูกล็อกอีกครั้งหลังจากพวกเขาเข้าไป"
      uk: "Об'єкт SCP-173 повинен постійно зберігатися в замкненому контейнері. Коли персоналу необхідно увійти до контейнера SCP-173, туди мають заходити не менше 3 осіб одночасно, а двері слід знову замкнути за ними."
      vi: "Vật thể SCP-173 phải luôn được giữ trong một khoang chứa có khóa. Khi nhân viên cần vào bên trong khoang chứa của SCP-173, phải có ít nhất 3 người cùng vào một lúc và cửa phải được khóa lại ngay sau khi họ vào."
      zh: "物品SCP-173必须始终保存在上锁的容器中。当人员必须进入SCP-173的容器时，每次进入人数不得少于3人，且门在他们进入后必须重新上锁。"
      zh_Hant: "物品SCP-173必須始終保存在上鎖的容器中。當人員必須進入SCP-173的容器時，每次進入人數不得少於3人，且門在他們進入後必須重新上鎖。"

  - scene: >
      Medium shot, waist-up, eye level, tightly framed on the two
      researchers standing shoulder to shoulder. On the left side of the
      frame, the attending researcher stares fixedly forward, unblinking,
      eyes wide and dry. On the right side of the frame, his colleague
      leans slightly toward him, murmuring, one hand raised in a small
      "wait" gesture, clearly about to warn him before she blinks.
    characters: [attending-researcher-m, attending-researcher-f]
    caption:
      ja: "SCP-173の収容室を出て再施錠するまで、常時2名がSCP-173と直接視線を合わせ続けなければならない。収容室に入室する職員は、瞬きをする前に互いに知らせるよう指示されている。"
      en: "At all times, two persons must maintain direct eye contact with SCP-173 until all personnel have vacated and relocked the container. Personnel assigned to enter the container are instructed to alert one another before blinking."
      cs: "Po celou dobu musí dvě osoby udržovat přímý oční kontakt s SCP-173, dokud veškerý personál neopustí kontejner a znovu jej neuzamkne. Personál určený ke vstupu do kontejneru má nařízeno upozornit se navzájem před mrknutím."
      de: "Zu jedem Zeitpunkt müssen zwei Personen direkten Blickkontakt mit SCP-173 aufrechterhalten, bis das gesamte Personal den Behälter verlassen und wieder verschlossen hat. Für den Einsatz im Behälter vorgesehenes Personal ist angewiesen, sich gegenseitig vor dem Blinzeln zu warnen."
      es: "En todo momento, dos personas deben mantener contacto visual directo con SCP-173 hasta que todo el personal haya abandonado el contenedor y este haya sido cerrado nuevamente. Al personal designado para entrar en el contenedor se le indica que se avise mutuamente antes de parpadear."
      fr: "À tout moment, deux personnes doivent maintenir un contact visuel direct avec SCP-173 jusqu'à ce que tout le personnel ait évacué et reverrouillé le conteneur. Le personnel affecté à l'entrée du conteneur reçoit pour consigne de s'avertir mutuellement avant de cligner des yeux."
      it: "In ogni momento, due persone devono mantenere il contatto visivo diretto con SCP-173 finché tutto il personale non abbia evacuato e richiuso a chiave il contenitore. Al personale incaricato di entrare nel contenitore viene richiesto di avvisarsi a vicenda prima di battere le palpebre."
      ko: "모든 인원이 대피하여 용기를 다시 잠글 때까지, 항상 두 명이 SCP-173과 직접적인 시선 접촉을 유지해야 한다. 용기에 들어가도록 배정된 직원은 눈을 깜빡이기 전에 서로에게 알리도록 지시받는다."
      pl: "Przez cały czas dwie osoby muszą utrzymywać bezpośredni kontakt wzrokowy z SCP-173, dopóki cały personel nie opuści kontenera i go ponownie nie zamknie. Personel wyznaczony do wejścia do kontenera ma polecenie ostrzegania się nawzajem przed mrugnięciem."
      pt: "A todo momento, duas pessoas devem manter contato visual direto com o SCP-173 até que todo o pessoal tenha evacuado e trancado novamente o contêiner. O pessoal designado para entrar no contêiner é instruído a avisar uns aos outros antes de piscar."
      th: "ตลอดเวลา ต้องมีบุคคลสองคนสบตากับ SCP-173 โดยตรงจนกว่าเจ้าหน้าที่ทั้งหมดจะออกไปและล็อกภาชนะอีกครั้ง เจ้าหน้าที่ที่ได้รับมอบหมายให้เข้าไปในภาชนะจะได้รับคำสั่งให้แจ้งเตือนกันก่อนกะพริบตา"
      uk: "У будь-який час двоє осіб повинні підтримувати прямий зоровий контакт із SCP-173, доки весь персонал не покине контейнер і не замкне його знову. Персоналу, призначеному входити до контейнера, наказано попереджати одне одного перед тим, як кліпнути."
      vi: "Tại mọi thời điểm, hai người phải duy trì giao tiếp bằng mắt trực tiếp với SCP-173 cho đến khi toàn bộ nhân viên đã rời khỏi và khóa lại khoang chứa. Nhân viên được phân công vào khoang chứa được chỉ thị phải báo cho nhau trước khi chớp mắt."
      zh: "任何时候，必须有两人与SCP-173保持直接的目光接触，直到所有人员撤离并重新锁上容器为止。被指派进入容器的人员被要求在眨眼前互相提醒。"
      zh_Hant: "任何時候，必須有兩人與SCP-173保持直接的目光接觸，直到所有人員撤離並重新鎖上容器為止。被指派進入容器的人員被要求在眨眼前互相提醒。"

  - scene: >
      Close-up shot, tightly cropped, angled so that SCP-173 fills the left
      side of the frame, now noticeably closer than before, its rough
      concrete form looming. On the right side of the frame, a sliver of the
      attending researcher's face is visible, one eye caught mid-blink, the
      other wide with sudden alarm as she registers how near it has come.
    characters: [scp-173, attending-researcher-f]
    caption:
      ja: "対象は直接視線内にある間は動くことができない。SCP-173に対しては常に視線を途切れさせてはならない。対象は後頭部の付け根を折るか、絞殺することで攻撃すると報告されている。"
      en: "The object cannot move while within a direct line of sight. Line of sight must not be broken at any time with SCP-173. Object is reported to attack by snapping the neck at the base of the skull, or by strangulation."
      cs: "Objekt se nemůže hýbat, dokud je v přímé linii pohledu. Oční kontakt se SCP-173 nesmí být nikdy přerušen. Objekt údajně útočí zlomením vazu u báze lebky nebo uškrcením."
      de: "Das Objekt kann sich nicht bewegen, solange es sich in direkter Sichtlinie befindet. Der Blickkontakt zu SCP-173 darf zu keinem Zeitpunkt unterbrochen werden. Berichten zufolge greift das Objekt an, indem es das Genick an der Schädelbasis bricht oder durch Erwürgen."
      es: "El objeto no puede moverse mientras se encuentre dentro de una línea de visión directa. La línea de visión con SCP-173 no debe romperse en ningún momento. Se ha informado que el objeto ataca rompiendo el cuello en la base del cráneo, o por estrangulamiento."
      fr: "L'objet ne peut pas se déplacer tant qu'il se trouve dans une ligne de vue directe. Le contact visuel avec SCP-173 ne doit jamais être rompu. L'objet attaquerait en brisant la nuque à la base du crâne, ou par strangulation."
      it: "L'oggetto non può muoversi finché si trova entro una linea di vista diretta. Il contatto visivo con SCP-173 non deve mai essere interrotto. Si segnala che l'oggetto attacca spezzando il collo alla base del cranio, oppure per strangolamento."
      ko: "대상은 직접적인 시야 안에 있는 동안에는 움직일 수 없다. SCP-173과의 시선은 어떤 순간에도 끊어져서는 안 된다. 대상은 두개골 기저부에서 목을 꺾거나 교살하는 방식으로 공격한다고 보고되었다."
      pl: "Obiekt nie może się poruszać, dopóki znajduje się w bezpośrednim polu widzenia. Kontakt wzrokowy z SCP-173 nie może zostać przerwany w żadnym momencie. Obiekt podobno atakuje, łamiąc kark u podstawy czaszki, lub przez uduszenie."
      pt: "O objeto não pode se mover enquanto estiver em linha de visão direta. A linha de visão com o SCP-173 não deve ser interrompida em nenhum momento. Relata-se que o objeto ataca quebrando o pescoço na base do crânio, ou por estrangulamento."
      th: "วัตถุนี้ไม่สามารถเคลื่อนไหวได้ขณะอยู่ในแนวสายตาโดยตรง ห้ามตัดขาดสายตากับ SCP-173 ไม่ว่าเวลาใดก็ตาม มีรายงานว่าวัตถุนี้โจมตีโดยการหักคอที่โคนกะโหลกศีรษะ หรือด้วยการรัดคอ"
      uk: "Об'єкт не може рухатися, поки перебуває в прямому полі зору. Зоровий контакт із SCP-173 не можна переривати ні на мить. Повідомляється, що об'єкт атакує, ламаючи шию біля основи черепа, або шляхом удушення."
      vi: "Vật thể không thể di chuyển khi đang trong tầm nhìn trực tiếp. Không được để mất tầm nhìn với SCP-173 vào bất kỳ lúc nào. Vật thể được báo cáo là tấn công bằng cách bẻ gãy cổ ở gốc hộp sọ, hoặc bằng cách siết cổ."
      zh: "该物体在处于直接视线范围内时无法移动。与SCP-173的视线不得在任何时候中断。据报告，该物体的攻击方式是折断颈部根部或勒颈。"
      zh_Hant: "該物體在處於直接視線範圍內時無法移動。與SCP-173的視線不得在任何時候中斷。據報告，該物體的攻擊方式是折斷頸部根部或勒頸。"

  - scene: >
      Wide shot, full body, low angle, pulled back to show the whole locked
      corridor outside SCP-173's door. The attending researcher stands
      outside, ear tilted toward the heavy door, listening, a cleaning cart
      with mop and bucket parked beside him, a clipboard with a biweekly
      cleaning schedule in his other hand.
    characters: [attending-researcher-m]
    caption:
      ja: "誰もいない間、収容室内から石が擦れるような音が聞こえるとの報告がある。これは正常なものとみなされているが、この挙動に変化があれば当直のHMCL責任者へ報告すること。床の赤褐色の物質は隔週で清掃しなければならない。"
      en: "Personnel report sounds of scraping stone originating from within the container when no one is present inside. This is considered normal, and any change in this behaviour should be reported. The enclosure must be cleaned on a bi-weekly basis."
      cs: "Personál hlásí zvuky skřípání kamene vycházející zevnitř kontejneru, i když v něm nikdo není přítomen. To je považováno za normální a jakoukoli změnu v tomto chování je třeba nahlásit. Ohrada musí být čištěna jednou za dva týdny."
      de: "Personal meldet Geräusche von schleifendem Stein aus dem Inneren des Behälters, wenn sich niemand darin befindet. Dies gilt als normal, und jede Veränderung dieses Verhaltens sollte gemeldet werden. Der Behälter muss alle zwei Wochen gereinigt werden."
      es: "El personal informa de sonidos de piedra raspando que provienen del interior del contenedor cuando no hay nadie presente dentro. Esto se considera normal, y cualquier cambio en este comportamiento debe reportarse. El recinto debe limpiarse cada dos semanas."
      fr: "Le personnel signale des bruits de pierre raclée provenant de l'intérieur du conteneur alors que personne ne s'y trouve. Ceci est considéré comme normal, et tout changement de ce comportement doit être signalé. L'enceinte doit être nettoyée toutes les deux semaines."
      it: "Il personale segnala rumori di pietra che striscia provenienti dall'interno del contenitore quando non vi è nessuno presente. Ciò è considerato normale, e qualsiasi cambiamento in questo comportamento deve essere segnalato. Il recinto deve essere pulito con cadenza bisettimanale."
      ko: "아무도 안에 없을 때에도 용기 내부에서 돌이 긁히는 듯한 소리가 들린다는 보고가 있다. 이는 정상으로 간주되며, 이 행동에 변화가 있을 경우 보고해야 한다. 수용 구역은 격주로 청소해야 한다."
      pl: "Personel zgłasza dźwięki skrobania kamienia dobiegające z wnętrza kontenera, gdy nikogo w nim nie ma. Uznaje się to za normalne, a każdą zmianę tego zachowania należy zgłosić. Pomieszczenie musi być czyszczone co dwa tygodnie."
      pt: "O pessoal relata sons de raspagem de pedra vindos de dentro do contêiner quando ninguém está presente lá dentro. Isso é considerado normal, e qualquer mudança nesse comportamento deve ser relatada. O recinto deve ser limpo quinzenalmente."
      th: "เจ้าหน้าที่รายงานว่าได้ยินเสียงหินขูดจากภายในภาชนะแม้ไม่มีใครอยู่ข้างในเลย ถือว่าเป็นเรื่องปกติ และหากพฤติกรรมนี้เปลี่ยนแปลงไปควรมีการรายงาน ต้องทำความสะอาดพื้นที่กักกันทุกสองสัปดาห์"
      uk: "Персонал повідомляє про звуки скрегочучого каменю, що долинають зсередини контейнера, коли всередині нікого немає. Це вважається нормою, і про будь-яку зміну цієї поведінки слід повідомляти. Приміщення необхідно прибирати раз на два тижні."
      vi: "Nhân viên báo cáo nghe thấy tiếng đá cọ xát phát ra từ bên trong khoang chứa dù không có ai ở trong đó. Điều này được coi là bình thường, và bất kỳ thay đổi nào trong hành vi này cần được báo cáo. Khu vực chứa phải được vệ sinh hai tuần một lần."
      zh: "有人员报告称，即使容器内无人，也能听到内部传出石块摩擦的声音。这被视为正常现象，若此行为出现任何变化都应予以报告。收容区域必须每两周清洁一次。"
      zh_Hant: "有人員報告稱，即使容器內無人，也能聽到內部傳出石塊摩擦的聲音。這被視為正常現象，若此行為出現任何變化都應予以報告。收容區域必須每兩週清潔一次。"
