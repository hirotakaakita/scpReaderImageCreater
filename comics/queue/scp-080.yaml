# SCP-080 4コマ台本
# captionはSpecial Containment Procedures / Description本文からの引用。
# 「不可逆的な心理的損傷」の記述、および博士の自殺・D級職員を毎月「与える」提案を
# 含むAddendum群は本編・addendumともに一切使用しない。addendumには文末の
# 「ブギーマンと呼ぶのをやめてほしい」という無害な注記のみ使用する。
# キャラにセリフは言わせない。

