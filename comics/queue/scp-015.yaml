# SCP-015 4コマ台本
# captionはSpecial Containment Procedures / Description本文からの引用。
# 「人肉製のパイプ」「職員11名死亡・20名行方不明」等のグロ・被害描写は
# 意図的に外し、配管素材の異様さと工具厳禁ルールのシュールなコメディに
# 焦点を当てた。噴出物の内容（虫・臓物・溶けた鉄等）も具体的に描写しない。
# キャラにセリフは言わせない。JP公式訳が直接取得できなかったため、
# 検証済みの英語本文からの翻訳（ja含む）。

