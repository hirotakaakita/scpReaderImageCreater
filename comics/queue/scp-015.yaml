panels:
  - scene: >
      Wide shot, full body, eye level, showing the vast interior of a
      warehouse completely filled floor-to-ceiling with a tangled mass
      of pipes, vents, and boilers in wildly different materials and
      ages, some rusted, some pristine, no clear path visible.
      attending-researcher-f stands at the entrance threshold, a safety
      line clipped to her harness, staring into the tangle with a
      flashlight.
    characters: [attending-researcher-f]
    caption:
      ja: "SCP-015は倉庫を完全に埋め尽くす、配管・通気口・ボイラーその他様々な配管設備の集合体である。パイプは観測されていない間に成長するようで、下水道や地下配管を通じて近隣の建造物に接続しようとする。"
      en: "SCP-015 is a mass of pipes, vents, boilers and other various plumbing apparatus completely filling a warehouse. The pipes appear to grow when not under observation, attempting to connect to nearby structures via sewer systems and underground plumbing."
      cs: "SCP-015 je shluk potrubí, průduchů, kotlů a dalšího různého instalatérského vybavení, který zcela zaplňuje skladiště. Zdá se, že potrubí roste, když není pozorováno, a pokouší se napojit na blízké stavby prostřednictvím kanalizačních systémů a podzemního potrubí."
      de: "SCP-015 ist eine Masse aus Rohren, Lüftungsschächten, Kesseln und anderen verschiedenen Installationsgeräten, die ein Lagerhaus vollständig ausfüllt. Die Rohre scheinen zu wachsen, wenn sie nicht beobachtet werden, und versuchen, sich über Abwassersysteme und unterirdische Rohrleitungen mit nahegelegenen Gebäuden zu verbinden."
      es: "SCP-015 es una masa de tuberías, conductos, calderas y diversos aparatos de fontanería que llena por completo un almacén. Las tuberías parecen crecer cuando no están siendo observadas, intentando conectarse a estructuras cercanas a través de sistemas de alcantarillado y tuberías subterráneas."
      fr: "Le SCP-015 est une masse de tuyaux, de conduits, de chaudières et d'autres divers équipements de plomberie remplissant entièrement un entrepôt. Les tuyaux semblent croître lorsqu'ils ne sont pas observés, tentant de se connecter aux structures voisines via les réseaux d'égouts et les canalisations souterraines."
      it: "SCP-015 è una massa di tubi, condotti, caldaie e altri vari apparati idraulici che riempie completamente un magazzino. I tubi sembrano crescere quando non sono osservati, tentando di collegarsi a strutture vicine tramite fognature e tubature sotterranee."
      ko: "SCP-015는 창고를 완전히 채우고 있는 파이프, 통풍구, 보일러 및 기타 다양한 배관 장치의 집합체이다. 파이프는 관찰되지 않을 때 자라나는 것으로 보이며, 하수도와 지하 배관을 통해 인근 건물에 연결을 시도한다."
      pl: "SCP-015 to masa rur, przewodów wentylacyjnych, kotłów i innego sprzętu hydraulicznego, całkowicie wypełniająca magazyn. Rury wydają się rosnąć, gdy nie są obserwowane, próbując połączyć się z pobliskimi budynkami poprzez systemy kanalizacyjne i podziemne przewody."
      pt: "O SCP-015 é uma massa de tubulações, dutos, caldeiras e diversos outros aparatos de encanamento que preenche completamente um armazém. Os canos parecem crescer quando não observados, tentando se conectar a estruturas próximas por meio de sistemas de esgoto e encanamentos subterrâneos."
      th: "SCP-015 คือกลุ่มของท่อ ช่องระบายอากาศ หม้อไอน้ำ และอุปกรณ์ประปาอื่นๆ ที่เต็มไปทั่วโกดังแห่งหนึ่ง ท่อเหล่านี้ดูเหมือนจะเติบโตเมื่อไม่มีใครสังเกต โดยพยายามเชื่อมต่อกับโครงสร้างใกล้เคียงผ่านระบบท่อระบายน้ำและท่อใต้ดิน"
      uk: "SCP-015 — це маса труб, вентиляційних каналів, котлів та іншого сантехнічного обладнання, яка повністю заповнює склад. Труби, схоже, ростуть, коли за ними не спостерігають, намагаючись з'єднатися з сусідніми будівлями через каналізаційні системи та підземні труби."
      vi: "SCP-015 là một khối lượng ống, lỗ thông hơi, nồi hơi và các thiết bị ống nước khác lấp đầy hoàn toàn một nhà kho. Các ống có vẻ như lớn lên khi không bị quan sát, cố gắng kết nối với các công trình lân cận thông qua hệ thống cống rãnh và đường ống ngầm."
      zh: "SCP-015是完全填满一座仓库的管道、通风口、锅炉及各种其他管道设备的集合体。这些管道似乎在无人观察时会生长，并试图通过下水道系统和地下管道与附近建筑物相连。"
      zh_Hant: "SCP-015是完全填滿一座倉庫的管道、通風口、鍋爐及各種其他管道設備的集合體。這些管道似乎在無人觀察時會生長，並試圖透過下水道系統和地下管道與附近建築物相連。"

  - scene: >
      Medium shot, waist-up, eye level, a different framing from the
      wide establishing shot. attending-researcher-m stands just inside
      the doorway, both hands raised empty and open to show he is
      carrying no tools, an exaggeratedly careful expression on his
      face, a toolbox left conspicuously outside the door behind him.
    characters: [attending-researcher-m]
    caption:
      ja: "SCP-015内部でいかなる攻撃的行動も取ってはならない。SCP-015内部のいかなる場所にも、手動または電動の工具の持ち込みを禁じる。SCP-015のいかなる箇所に対しても、修理や整備を行ってはならない。"
      en: "No aggressive action is to be made within SCP-015. No hand or power tools are allowed anywhere inside SCP-015. No repairs or maintenance are to be made anywhere on SCP-015."
      cs: "Uvnitř SCP-015 nesmí být prováděna žádná agresivní akce. Uvnitř SCP-015 není nikde povoleno ruční ani elektrické nářadí. Na žádné části SCP-015 nesmí být prováděny žádné opravy ani údržba."
      de: "Innerhalb von SCP-015 darf keine aggressive Handlung erfolgen. Innerhalb von SCP-015 sind nirgendwo Hand- oder Elektrowerkzeuge erlaubt. An keiner Stelle von SCP-015 dürfen Reparaturen oder Wartungsarbeiten durchgeführt werden."
      es: "No se debe realizar ninguna acción agresiva dentro de SCP-015. No se permiten herramientas manuales ni eléctricas en ninguna parte del interior de SCP-015. No se deben realizar reparaciones ni mantenimiento en ninguna parte de SCP-015."
      fr: "Aucune action agressive ne doit être menée à l'intérieur du SCP-015. Aucun outil, manuel ou électrique, n'est autorisé où que ce soit à l'intérieur du SCP-015. Aucune réparation ni entretien ne doit être effectué sur quelque partie du SCP-015 que ce soit."
      it: "Non deve essere compiuta alcuna azione aggressiva all'interno di SCP-015. Non sono ammessi utensili manuali o elettrici in nessuna parte dell'interno di SCP-015. Non devono essere effettuate riparazioni o manutenzioni in nessuna parte di SCP-015."
      ko: "SCP-015 내부에서는 어떠한 공격적인 행동도 해서는 안 된다. SCP-015 내부 어느 곳에도 수동 또는 전동 공구를 반입해서는 안 된다. SCP-015의 어느 부분에도 수리나 정비를 해서는 안 된다."
      pl: "Wewnątrz SCP-015 nie wolno podejmować żadnych agresywnych działań. Wewnątrz SCP-015 nigdzie nie wolno używać narzędzi ręcznych ani elektrycznych. Na żadnej części SCP-015 nie wolno przeprowadzać napraw ani konserwacji."
      pt: "Nenhuma ação agressiva deve ser realizada dentro do SCP-015. Nenhuma ferramenta manual ou elétrica é permitida em qualquer lugar dentro do SCP-015. Nenhum reparo ou manutenção deve ser feito em qualquer parte do SCP-015."
      th: "ห้ามกระทำการใดๆ ที่ก้าวร้าวภายใน SCP-015 ห้ามนำเครื่องมือช่างหรือเครื่องมือไฟฟ้าเข้าไปในส่วนใดๆ ของ SCP-015 ห้ามซ่อมแซมหรือบำรุงรักษาส่วนใดๆ ของ SCP-015"
      uk: "Усередині SCP-015 не можна вчиняти жодних агресивних дій. Усередині SCP-015 ніде не дозволяється використовувати ручні чи електроінструменти. На жодній частині SCP-015 не можна проводити ремонт чи обслуговування."
      vi: "Không được thực hiện bất kỳ hành động hung hăng nào bên trong SCP-015. Không được mang dụng cụ cầm tay hoặc dụng cụ điện vào bất kỳ nơi nào bên trong SCP-015. Không được sửa chữa hoặc bảo trì bất kỳ phần nào của SCP-015."
      zh: "不得在SCP-015内部采取任何攻击性行动。SCP-015内部任何地方均不得携带手动或电动工具。不得对SCP-015的任何部位进行维修或保养。"
      zh_Hant: "不得在SCP-015內部採取任何攻擊性行動。SCP-015內部任何地方均不得攜帶手動或電動工具。不得對SCP-015的任何部位進行維修或保養。"

  - scene: >
      Close-up, filling most of the frame, on a cluster of pipes of
      visibly different materials fused together in an impossible
      plumbing knot — one pale bone-white, one wood-grained, one rough
      granite, one glass section. At the very edge of the frame,
      attending-researcher-f's flashlight beam and gloved fingertip
      point at the joint between them, not quite touching.
    characters: [attending-researcher-f]
    caption:
      ja: "パイプは骨、木材、鋼鉄、圧縮灰、ガラス、花崗岩でできていると報告されている。鉛、PVCプラスチック、銅など、通常パイプの製造に使われる伝統的な素材でできたパイプは、これまで一本も発見されていない。"
      en: "Pipes have been reported as being made of bone, wood, steel, pressed ash, glass, and granite. No pipes composed of lead, PVC plastic, copper, or any other traditional material for the production of pipes have been found."
      cs: "Bylo hlášeno, že potrubí je vyrobeno z kosti, dřeva, oceli, lisovaného popela, skla a žuly. Nebylo nalezeno žádné potrubí složené z olova, PVC plastu, mědi nebo jiného tradičního materiálu pro výrobu potrubí."
      de: "Es wurde berichtet, dass die Rohre aus Knochen, Holz, Stahl, gepresster Asche, Glas und Granit bestehen. Es wurden keine Rohre aus Blei, PVC-Kunststoff, Kupfer oder einem anderen traditionellen Material zur Rohrherstellung gefunden."
      es: "Se ha informado que las tuberías están hechas de hueso, madera, acero, ceniza prensada, vidrio y granito. No se ha encontrado ninguna tubería compuesta de plomo, plástico PVC, cobre, ni ningún otro material tradicional para la fabricación de tuberías."
      fr: "Les tuyaux ont été signalés comme étant faits d'os, de bois, d'acier, de cendre compressée, de verre et de granit. Aucun tuyau composé de plomb, de plastique PVC, de cuivre ou de tout autre matériau traditionnel de fabrication de tuyaux n'a été trouvé."
      it: "È stato riferito che i tubi sono fatti di osso, legno, acciaio, cenere compressa, vetro e granito. Non sono stati trovati tubi composti da piombo, plastica PVC, rame o qualsiasi altro materiale tradizionale per la produzione di tubi."
      ko: "파이프는 뼈, 나무, 강철, 압축재, 유리, 화강암으로 만들어진 것으로 보고되었다. 납, PVC 플라스틱, 구리 등 배관 제작에 흔히 쓰이는 전통적인 재료로 만들어진 파이프는 발견되지 않았다."
      pl: "Zgłaszano, że rury są wykonane z kości, drewna, stali, prasowanego popiołu, szkła i granitu. Nie znaleziono żadnych rur wykonanych z ołowiu, plastiku PVC, miedzi ani żadnego innego tradycyjnego materiału stosowanego do produkcji rur."
      pt: "Foi relatado que os canos são feitos de osso, madeira, aço, cinza prensada, vidro e granito. Não foram encontrados canos compostos de chumbo, plástico PVC, cobre ou qualquer outro material tradicional para a fabricação de canos."
      th: "มีรายงานว่าท่อทำจากกระดูก ไม้ เหล็กกล้า ขี้เถ้าอัด แก้ว และหินแกรนิต ไม่พบท่อที่ทำจากตะกั่ว พลาสติก PVC ทองแดง หรือวัสดุดั้งเดิมอื่นใดที่ใช้ผลิตท่อ"
      uk: "Повідомляється, що труби виготовлені з кістки, дерева, сталі, пресованого попелу, скла та граніту. Не було знайдено жодної труби зі свинцю, ПВХ-пластику, міді чи будь-якого іншого традиційного матеріалу для виробництва труб."
      vi: "Các ống được báo cáo là làm từ xương, gỗ, thép, tro nén, thủy tinh và đá granit. Không tìm thấy ống nào làm từ chì, nhựa PVC, đồng, hay bất kỳ vật liệu truyền thống nào khác dùng để sản xuất ống."
      zh: "据报告，这些管道由骨骼、木材、钢材、压制灰烬、玻璃和花岗岩制成。至今未发现由铅、PVC塑料、铜或任何其他传统制管材料制成的管道。"
      zh_Hant: "據報告，這些管道由骨骼、木材、鋼材、壓製灰燼、玻璃和花崗岩製成。至今未發現由鉛、PVC塑膠、銅或任何其他傳統製管材料製成的管道。"

  - scene: >
      Wide shot, full body, eye level, pulled back to show a different
      section of the pipe maze, a very different framing from the
      close-up before. attending-researcher-m, a wrench still visibly
      clipped to his belt, stumbles backward as a nearby pipe joint
      suddenly bursts, spraying a wide arc of dark liquid across the
      frame, his arms thrown up to shield his face.
    characters: [attending-researcher-m]
    caption:
      ja: "工具を携帯している職員、あるいはSCP-015をいかなる方法であれ修理しようとする職員は、反応を引き起こす——対象の近くのパイプが破裂し、数秒間噴出した後、流れが突然止まる。"
      en: "Any personnel carrying tools, or attempting to repair SCP-015 in any way, will trigger a reaction: pipes near the subject will burst, spraying for several seconds before the flow suddenly stops."
      cs: "Jakýkoli personál nesoucí nářadí nebo se pokoušející jakýmkoli způsobem opravit SCP-015 vyvolá reakci: potrubí v blízkosti subjektu praskne a bude po několik sekund stříkat, než náhle proud ustane."
      de: "Jedes Personal, das Werkzeuge trägt oder versucht, SCP-015 auf irgendeine Weise zu reparieren, löst eine Reaktion aus: In der Nähe des Subjekts befindliche Rohre platzen und spritzen mehrere Sekunden lang, bevor der Fluss plötzlich stoppt."
      es: "Cualquier personal que porte herramientas, o que intente reparar SCP-015 de alguna manera, desencadenará una reacción: las tuberías cercanas al sujeto estallarán, rociando durante varios segundos antes de que el flujo se detenga repentinamente."
      fr: "Tout membre du personnel portant des outils, ou tentant de réparer le SCP-015 de quelque manière que ce soit, déclenchera une réaction : les tuyaux proches du sujet éclateront, projetant leur contenu pendant plusieurs secondes avant que le flux ne s'arrête soudainement."
      it: "Qualsiasi membro del personale che porti utensili, o tenti di riparare SCP-015 in qualsiasi modo, innescherà una reazione: i tubi vicini al soggetto esploderanno, spruzzando per diversi secondi prima che il flusso si interrompa improvvisamente."
      ko: "공구를 소지하거나 SCP-015를 어떤 식으로든 수리하려는 직원은 반응을 유발한다: 대상 근처의 파이프가 터지며 몇 초간 분출한 뒤 흐름이 갑자기 멈춘다."
      pl: "Każdy pracownik noszący narzędzia lub próbujący w jakikolwiek sposób naprawić SCP-015 wywoła reakcję: pobliskie rury pękną, tryskając przez kilka sekund, zanim przepływ nagle ustanie."
      pt: "Qualquer funcionário portando ferramentas, ou tentando reparar o SCP-015 de qualquer forma, desencadeará uma reação: os canos próximos ao sujeito estourarão, jorrando por vários segundos antes que o fluxo pare repentinamente."
      th: "เจ้าหน้าที่ที่พกเครื่องมือ หรือพยายามซ่อมแซม SCP-015 ไม่ว่าด้วยวิธีใด จะกระตุ้นปฏิกิริยา: ท่อใกล้ตัวบุคคลนั้นจะแตกและพ่นออกมาเป็นเวลาหลายวินาทีก่อนที่การไหลจะหยุดลงทันที"
      uk: "Будь-який персонал, що несе інструменти або намагається якимось чином відремонтувати SCP-015, викличе реакцію: труби поблизу суб'єкта прорветься, розбризкуючи вміст протягом кількох секунд, перш ніж потік раптово зупиниться."
      vi: "Bất kỳ nhân viên nào mang theo dụng cụ, hoặc cố gắng sửa chữa SCP-015 bằng bất kỳ cách nào, sẽ kích hoạt phản ứng: các ống gần đối tượng sẽ vỡ ra, phun trào trong vài giây trước khi dòng chảy đột ngột dừng lại."
      zh: "任何携带工具、或试图以任何方式修理SCP-015的人员，都会触发反应：对象附近的管道会爆裂，喷射数秒后水流突然停止。"
      zh_Hant: "任何攜帶工具、或試圖以任何方式修理SCP-015的人員，都會觸發反應：對象附近的管道會爆裂，噴射數秒後水流突然停止。"
