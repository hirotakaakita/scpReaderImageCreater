# SCP-048 4コマ台本
# captionはSpecial Containment Procedures / Description本文からの引用のみ
# （記事自体が短いため、長い一文を2コマに分割している）。Addendum 2
# （コルテス博士の血みどろの事故）はグロ回避のため本編にもaddendumにも
# 含めず、Addendum 3（「ヴァンパイア・ボート」誤登録の逸話）のみを
# addendumの一言として使用。キャラにセリフは言わせない。JP公式訳が直接
# 取得できなかったため、検証済みの英語本文からの翻訳（ja含む）。

