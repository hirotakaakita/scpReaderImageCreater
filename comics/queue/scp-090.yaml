panels:
  - scene: >
      Close-up, on a solid black cube resting on a pedestal inside a
      reinforced bunker, faint white glowing lines etched across its
      surface. attending-researcher-m observes it from behind
      reinforced glass.
    characters: [attending-researcher-m]
    caption:
      ja: "SCP-090は、未知のセラミック素材でできた黒い立方体構造物（20cm×20cm×20cm）である。この物体は破壊不能に分類されている。"
      en: "SCP-090 is a black cubic structure [20 cm x 20 cm x 20 cm] made of an unknown ceramic material. The object is classified as indestructible."
      cs: "SCP-090 je černá krychlová struktura [20 cm x 20 cm x 20 cm] vyrobená z neznámého keramického materiálu. Předmět je klasifikován jako nezničitelný."
      de: "SCP-090 ist eine schwarze würfelförmige Struktur [20 cm x 20 cm x 20 cm] aus einem unbekannten keramischen Material. Das Objekt gilt als unzerstörbar."
      es: "SCP-090 es una estructura cúbica negra [20 cm x 20 cm x 20 cm] hecha de un material cerámico desconocido. El objeto está clasificado como indestructible."
      fr: "Le SCP-090 est une structure cubique noire [20 cm x 20 cm x 20 cm] faite d'un matériau céramique inconnu. L'objet est classé comme indestructible."
      it: "SCP-090 è una struttura cubica nera [20 cm x 20 cm x 20 cm] fatta di un materiale ceramico sconosciuto. L'oggetto è classificato come indistruttibile."
      ko: "SCP-090은 미지의 세라믹 재질로 만들어진 검은색 정육면체 구조물[20cm x 20cm x 20cm]이다. 이 물체는 파괴 불가능한 것으로 분류된다."
      pl: "SCP-090 to czarna sześcienna struktura [20 cm x 20 cm x 20 cm] wykonana z nieznanego materiału ceramicznego. Obiekt jest sklasyfikowany jako niezniszczalny."
      pt: "O SCP-090 é uma estrutura cúbica preta [20 cm x 20 cm x 20 cm] feita de um material cerâmico desconhecido. O objeto é classificado como indestrutível."
      th: "SCP-090 คือโครงสร้างลูกบาศก์สีดำ [20 ซม. x 20 ซม. x 20 ซม.] ทำจากวัสดุเซรามิกที่ไม่ทราบชนิด วัตถุนี้ถูกจัดว่าไม่สามารถทำลายได้"
      uk: "SCP-090 — це чорна кубічна структура [20 см x 20 см x 20 см], виготовлена з невідомого керамічного матеріалу. Об'єкт класифікується як незнищенний."
      vi: "SCP-090 là một cấu trúc hình khối màu đen [20cm x 20cm x 20cm] được làm từ một loại vật liệu gốm không xác định. Vật thể được phân loại là bất khả hủy diệt."
      zh: "SCP-090是一个黑色立方体结构（20厘米×20厘米×20厘米），由一种未知陶瓷材料制成。该物体被归类为不可摧毁。"
      zh_Hant: "SCP-090是一個黑色立方體結構（20公分×20公分×20公分），由一種未知陶瓷材料製成。該物體被歸類為不可摧毀。"

  - scene: >
      Extreme close-up on the cube's surface, a different framing from
      the wide shot before, showing thousands of tiny glowing
      white-etched squares arranged like a Rubik's cube grid, intricate
      fragments of a larger design visible. attending-researcher-f uses
      a handheld scanner device to examine a section.
    characters: [attending-researcher-f]
    caption:
      ja: "各面はルービックキューブに似た配置で、一万個の個別の正方形に分割されている。各正方形の表面には、より大きな図案の一部が刻み込まれており、その刻印は白く発光している。"
      en: "Each side is divided into ten thousand individual squares in an arrangement similar to a Rubik's cube. Each square has part of a design etched into the surface, and the etchings glow white."
      cs: "Každá strana je rozdělena na deset tisíc jednotlivých čtverců v uspořádání podobném Rubikově kostce. Na povrchu každého čtverce je vyryta část vzoru a rytiny světélkují bíle."
      de: "Jede Seite ist in zehntausend einzelne Quadrate unterteilt, ähnlich der Anordnung eines Zauberwürfels. Jedes Quadrat trägt einen Teil eines Musters, das in die Oberfläche eingraviert ist, und die Gravuren leuchten weiß."
      es: "Cada cara está dividida en diez mil cuadrados individuales en una disposición similar a la de un cubo de Rubik. Cada cuadrado tiene parte de un diseño grabado en la superficie, y los grabados brillan en blanco."
      fr: "Chaque face est divisée en dix mille carrés individuels selon un agencement similaire à celui d'un Rubik's Cube. Chaque carré porte une partie d'un motif gravé à sa surface, et les gravures luisent en blanc."
      it: "Ogni lato è diviso in diecimila quadrati individuali in una disposizione simile a un cubo di Rubik. Ogni quadrato ha parte di un disegno inciso sulla superficie, e le incisioni brillano di bianco."
      ko: "각 면은 루빅스 큐브와 유사한 배열로 만 개의 개별 정사각형으로 나뉘어 있다. 각 정사각형에는 표면에 새겨진 더 큰 도안의 일부가 있으며, 그 새김은 흰색으로 빛난다."
      pl: "Każda strona jest podzielona na dziesięć tysięcy pojedynczych kwadratów w układzie przypominającym kostkę Rubika. Każdy kwadrat ma na powierzchni wyrytą część wzoru, a ryciny świecą na biało."
      pt: "Cada lado é dividido em dez mil quadrados individuais em um arranjo semelhante a um cubo mágico. Cada quadrado tem parte de um desenho gravado na superfície, e as gravuras brilham em branco."
      th: "แต่ละด้านถูกแบ่งออกเป็นสี่เหลี่ยมจัตุรัสหนึ่งหมื่นชิ้นในลักษณะคล้ายลูกบาศก์รูบิก แต่ละช่องมีลวดลายบางส่วนสลักอยู่บนพื้นผิว และรอยสลักเหล่านั้นเรืองแสงสีขาว"
      uk: "Кожна сторона поділена на десять тисяч окремих квадратів у розташуванні, подібному до кубика Рубіка. На поверхні кожного квадрата вигравіювано частину малюнка, і гравіювання світиться білим."
      vi: "Mỗi mặt được chia thành mười nghìn ô vuông riêng lẻ theo cách sắp xếp tương tự khối Rubik. Mỗi ô vuông có một phần của một họa tiết được khắc trên bề mặt, và các nét khắc phát sáng màu trắng."
      zh: "每一面都被划分为一万个独立的方格，排列方式类似魔方。每个方格表面刻有一幅更大图案的一部分，刻痕会发出白光。"
      zh_Hant: "每一面都被劃分為一萬個獨立的方格，排列方式類似魔術方塊。每個方格表面刻有一幅更大圖案的一部分，刻痕會發出白光。"

  - scene: >
      Medium shot, waist-up, a different framing from the close-up
      before. attending-researcher-m and attending-researcher-f sit at
      a bank of monitors with high-speed cameras aimed at the cube, one
      row of tiny segments visibly mid-shift on a screen. A wall
      archive ledger nearby is labeled with old dates.
    characters: [attending-researcher-m, attending-researcher-f]
    caption:
      ja: "正体不明の内部構造により、およそ2.8秒ごとに一列または一行の再配列が起こる。この物体の配列に関する記録は西暦1242年から残されており、現代の技術によって正確な配列を画像化し研究することが可能になっている。"
      en: "An unknown internal structure causes the realignment of a single row or column roughly every 2.8 seconds. Records of the object's alignments have been kept since 1242 CE, and modern technology now allows the exact alignments to be imaged and studied."
      cs: "Neznámá vnitřní struktura způsobuje přeskupení jediné řady nebo sloupce přibližně každých 2,8 sekundy. Záznamy o uspořádáních předmětu jsou vedeny od roku 1242 n. l. a moderní technologie nyní umožňují přesná uspořádání zaznamenávat a studovat."
      de: "Eine unbekannte innere Struktur bewirkt die Neuausrichtung einer einzelnen Reihe oder Spalte alle etwa 2,8 Sekunden. Aufzeichnungen der Ausrichtungen des Objekts werden seit dem Jahr 1242 n. Chr. geführt, und moderne Technologie erlaubt es nun, die genauen Ausrichtungen abzubilden und zu untersuchen."
      es: "Una estructura interna desconocida provoca la realineación de una sola fila o columna aproximadamente cada 2,8 segundos. Se han conservado registros de las alineaciones del objeto desde el año 1242 d. C., y la tecnología moderna ahora permite captar y estudiar las alineaciones exactas."
      fr: "Une structure interne inconnue provoque le réalignement d'une seule rangée ou colonne environ toutes les 2,8 secondes. Des registres des alignements de l'objet sont conservés depuis l'an 1242 de notre ère, et la technologie moderne permet désormais d'imager et d'étudier les alignements exacts."
      it: "Una struttura interna sconosciuta provoca il riallineamento di una singola riga o colonna circa ogni 2,8 secondi. Sono stati conservati registri degli allineamenti dell'oggetto sin dal 1242 d.C., e la tecnologia moderna ora permette di fotografare e studiare gli allineamenti esatti."
      ko: "정체불명의 내부 구조로 인해 약 2.8초마다 한 줄 또는 한 열이 재배열된다. 이 물체의 배열에 관한 기록은 서기 1242년부터 남아 있으며, 현대 기술 덕분에 이제는 정확한 배열을 촬영하고 연구할 수 있다."
      pl: "Nieznana struktura wewnętrzna powoduje przegrupowanie pojedynczego rzędu lub kolumny co około 2,8 sekundy. Zapisy ułożeń obiektu są prowadzone od 1242 roku n.e., a nowoczesna technologia pozwala teraz na dokładne obrazowanie i badanie ułożeń."
      pt: "Uma estrutura interna desconhecida causa o realinhamento de uma única linha ou coluna aproximadamente a cada 2,8 segundos. Registros dos alinhamentos do objeto são mantidos desde 1242 d.C., e a tecnologia moderna agora permite que os alinhamentos exatos sejam capturados e estudados."
      th: "โครงสร้างภายในที่ไม่ทราบสาเหตุทำให้เกิดการจัดเรียงใหม่ของแถวหรือคอลัมน์เดียวประมาณทุก 2.8 วินาที มีการเก็บบันทึกการจัดเรียงของวัตถุนี้มาตั้งแต่ปี ค.ศ. 1242 และเทคโนโลยีสมัยใหม่ในปัจจุบันช่วยให้สามารถถ่ายภาพและศึกษาการจัดเรียงที่แม่นยำได้"
      uk: "Невідома внутрішня структура спричиняє перевлаштування одного ряду чи стовпця приблизно кожні 2,8 секунди. Записи розташувань об'єкта ведуться з 1242 року н.е., а сучасні технології тепер дозволяють точно фіксувати й вивчати ці розташування."
      vi: "Một cấu trúc bên trong không xác định gây ra sự sắp xếp lại của một hàng hoặc cột đơn lẻ khoảng mỗi 2,8 giây. Các ghi chép về cách sắp xếp của vật thể đã được lưu giữ từ năm 1242 sau Công nguyên, và công nghệ hiện đại giờ đây cho phép chụp ảnh và nghiên cứu chính xác các cách sắp xếp này."
      zh: "一种未知的内部结构导致大约每2.8秒就会有一行或一列重新排列。有关该物体排列方式的记录自公元1242年起便被保存下来，如今现代科技已能够精确成像并研究其排列。"
      zh_Hant: "一種未知的內部結構導致大約每2.8秒就會有一行或一列重新排列。有關該物體排列方式的記錄自公元1242年起便被保存下來，如今現代科技已能夠精確成像並研究其排列。"

  - scene: >
      Wide shot, low angle, dramatic and ominous lighting, a different
      framing from the medium shot before, showing the whole cube glowing
      with far more white-lit aligned segments than before.
      attending-researcher-f stares at it with a tense, worried
      expression, clipboard held tightly to her chest.
    characters: [attending-researcher-f]
    caption:
      ja: "各セグメントは、隣接する正方形と正しく整列していない限り、細い白線で区切られる。この物体の表面には現在22箇所の正しい整列が存在する。すべてが完成した場合、前例のない災厄が引き起こされるであろうと仮説が立てられている。"
      en: "Segments are divided by a thin white line unless they are correctly aligned with the square directly adjacent to them. There are currently 22 correct alignments on the object's surface. Full item completion has been hypothesized to cause an unparalleled disaster."
      cs: "Segmenty jsou odděleny tenkou bílou linkou, pokud nejsou správně zarovnány s přímo sousedícím čtvercem. Na povrchu předmětu se v současnosti nachází 22 správných zarovnání. Předpokládá se, že úplné dokončení předmětu by způsobilo bezprecedentní katastrofu."
      de: "Segmente sind durch eine dünne weiße Linie getrennt, sofern sie nicht korrekt mit dem direkt benachbarten Quadrat ausgerichtet sind. Derzeit gibt es 22 korrekte Ausrichtungen auf der Oberfläche des Objekts. Es wird vermutet, dass die vollständige Vervollständigung des Objekts eine beispiellose Katastrophe verursachen würde."
      es: "Los segmentos están divididos por una fina línea blanca a menos que estén correctamente alineados con el cuadrado directamente adyacente. Actualmente hay 22 alineaciones correctas en la superficie del objeto. Se ha planteado la hipótesis de que la finalización completa del objeto causaría un desastre sin precedentes."
      fr: "Les segments sont séparés par une fine ligne blanche à moins qu'ils ne soient correctement alignés avec le carré directement adjacent. Il y a actuellement 22 alignements corrects sur la surface de l'objet. On a émis l'hypothèse que l'achèvement complet de l'objet provoquerait une catastrophe sans précédent."
      it: "I segmenti sono divisi da una sottile linea bianca a meno che non siano correttamente allineati con il quadrato direttamente adiacente. Attualmente ci sono 22 allineamenti corretti sulla superficie dell'oggetto. Si ipotizza che il completamento totale dell'oggetto causerebbe un disastro senza precedenti."
      ko: "세그먼트는 바로 인접한 정사각형과 올바르게 정렬되지 않는 한 얇은 흰 선으로 나뉜다. 현재 물체 표면에는 22개의 올바른 정렬이 존재한다. 물체가 완전히 완성되면 전례 없는 재앙이 일어날 것이라는 가설이 제기되고 있다."
      pl: "Segmenty są oddzielone cienką białą linią, chyba że są prawidłowo wyrównane z bezpośrednio sąsiadującym kwadratem. Obecnie na powierzchni obiektu znajduje się 22 prawidłowych wyrównań. Wysunięto hipotezę, że pełne ukończenie obiektu spowodowałoby bezprecedensową katastrofę."
      pt: "Os segmentos são divididos por uma fina linha branca, a menos que estejam corretamente alinhados com o quadrado diretamente adjacente. Atualmente existem 22 alinhamentos corretos na superfície do objeto. Foi hipotetizado que a conclusão total do item causaria um desastre sem precedentes."
      th: "ส่วนต่างๆ จะถูกแบ่งด้วยเส้นสีขาวบางๆ เว้นแต่จะเรียงตรงกันอย่างถูกต้องกับช่องที่อยู่ติดกันโดยตรง ปัจจุบันมีการเรียงตรงที่ถูกต้อง 22 จุดบนพื้นผิวของวัตถุ มีสมมติฐานว่าหากวัตถุนี้เรียงสมบูรณ์ครบถ้วน จะก่อให้เกิดหายนะที่ไม่เคยเกิดขึ้นมาก่อน"
      uk: "Сегменти розділені тонкою білою лінією, якщо вони не вирівняні правильно з безпосередньо суміжним квадратом. Наразі на поверхні об'єкта є 22 правильні вирівнювання. Висунуто гіпотезу, що повне завершення об'єкта спричинить безпрецедентну катастрофу."
      vi: "Các phân đoạn được ngăn cách bởi một đường kẻ trắng mỏng trừ khi chúng được xếp thẳng hàng chính xác với ô vuông liền kề trực tiếp. Hiện tại có 22 lần xếp thẳng hàng chính xác trên bề mặt vật thể. Người ta giả thuyết rằng việc hoàn thành toàn bộ vật thể sẽ gây ra một thảm họa chưa từng có."
      zh: "各分段之间以细白线分隔，除非它们与直接相邻的方格正确对齐。目前该物体表面共有22处正确对齐。据推测，若该物体完全拼合完成，将引发一场空前的灾难。"
      zh_Hant: "各分段之間以細白線分隔，除非它們與直接相鄰的方格正確對齊。目前該物體表面共有22處正確對齊。據推測，若該物體完全拼合完成，將引發一場空前的災難。"
