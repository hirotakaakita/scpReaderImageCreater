# SCP-811「沼女」4コマ台本
# captionは記事本文（Special Containment Procedures）からの引用のみを使用。
# Descriptionにある吐瀉物による狩猟等のグロテスクな描写は本編では避け、
# 収容手順の滑稽な官僚的文言（丸太を「褒美」に与える、切断者向け配置転換の
# 懲戒規定など）を軸にした軽いコメディにしている。キャラにセリフは言わせない。

id: scp-811

title:
  en: "SCP-811: The Swamp Woman"
  ja: "SCP-811：沼女"
  cs: "SCP-811: Bahenní žena"
  de: "SCP-811: Die Sumpffrau"
  es: "SCP-811: La Mujer del Pantano"
  fr: "SCP-811 : La Femme des Marais"
  it: "SCP-811: La Donna della Palude"
  ko: "SCP-811: 늪지 여인"
  pl: "SCP-811: Kobieta z Bagna"
  pt: "SCP-811: A Mulher do Pântano"
  th: "SCP-811: หญิงสาวแห่งหนองน้ำ"
  uk: "SCP-811: Болотяна Жінка"
  vi: "SCP-811: Người Đàn Bà Đầm Lầy"
  zh: "SCP-811：沼泽女"
  zh_Hant: "SCP-811：沼澤女"

attribution:
  article: "SCP-811"
  author: "Pig_catapult"
  source_url: "http://scp-wiki.wikidot.com/scp-811"
  license: "CC BY-SA 3.0"

object_class: Euclid

local_characters:
  scp-811:
    name: SCP-811
    description: >
      SCP-811, shaped similarly to a human female with disproportionately
      long, thin limbs and a slightly bloated abdominal region, standing
      about 171cm tall. Its skin has a mottled green color (color RGB
      90,110,70) that blends into swamp reeds, with a faintly slick, damp
      texture. It has extremely oily, tangled black hair (color RGB
      15,15,15) that hangs limp and wet.

characters: [scp-811, attending-researcher-m, d-class]

panels:
  - scene: >
      Wide shot, full enclosure, eye level, establishing the whole
      habitat. Thick reeds and aquatic plants fill a tall glass-walled
      cylindrical enclosure built over wetland soil and stagnant water.
      On the right side of the frame, half-hidden among the reeds near
      the waterline, SCP-811 crouches low, its mottled green skin blending
      into the foliage. On the left side of the frame, outside the glass,
      the attending researcher stands with a clipboard, observing.
    characters: [scp-811, attending-researcher-m]
    caption:
      ja: "SCP-811は湿地土壌と清潔な水で満たされた、直径平均10から20メートルで、深さが2.5メートルを下回らない、気候管理された円筒状のガラスで囲うべきです。ガラスには原生の沼に生育する多様な水生植物を備え付けます。"
      en: "SCP-811 should be kept in a climate-controlled, cylindrical glass enclosure, between ten (10) and twenty (20) metres in diameter, filled to a depth of no less than two and a half (2.5) metres with wetland soil and stagnant fresh water. It is to be furnished with a variety of aquatic plants from its native swamp."
      cs: "SCP-811 by mělo být umístěno ve válcovém skleněném výběhu s regulovanou klimatizací o průměru mezi deseti (10) a dvaceti (20) metry, naplněném do hloubky nejméně dvou a půl (2,5) metru mokřadní půdou a stojatou sladkou vodou. Výběh musí být osázen řadou vodních rostlin z jeho původního mokřadu."
      de: "SCP-811 sollte in einem klimatisierten, zylindrischen Glasgehege mit einem Durchmesser zwischen zehn (10) und zwanzig (20) Metern gehalten werden, das bis zu einer Tiefe von mindestens zweieinhalb (2,5) Metern mit Feuchtgebietsboden und stehendem Süßwasser gefüllt ist. Es ist mit einer Vielzahl von Wasserpflanzen aus seinem heimischen Sumpf auszustatten."
      es: "SCP-811 debe mantenerse en un recinto cilíndrico de vidrio con control climático, de entre diez (10) y veinte (20) metros de diámetro, lleno hasta una profundidad no inferior a dos metros y medio (2,5) con suelo de humedal y agua dulce estancada. Debe estar provisto de una variedad de plantas acuáticas de su pantano natal."
      fr: "SCP-811 doit être maintenu dans une enceinte cylindrique en verre climatisée, d'un diamètre compris entre dix (10) et vingt (20) mètres, remplie sur une profondeur d'au moins deux mètres et demi (2,5) de sol marécageux et d'eau douce stagnante. Elle doit être aménagée avec diverses plantes aquatiques provenant de son marais d'origine."
      it: "SCP-811 dovrebbe essere tenuto in un recinto cilindrico di vetro climatizzato, con un diametro compreso tra dieci (10) e venti (20) metri, riempito fino a una profondità non inferiore a due metri e mezzo (2,5) con suolo paludoso e acqua dolce stagnante. Deve essere allestito con una varietà di piante acquatiche provenienti dalla sua palude natia."
      ko: "SCP-811은 지름 10(10)~20(20)미터의 온도 조절되는 원통형 유리 사육장에 보관해야 하며, 습지 토양과 고인 담수로 평균 2.5(2.5)미터 이상의 깊이까지 채워야 한다. 원서식지 늪에서 가져온 다양한 수생 식물을 갖추어야 한다."
      pl: "SCP-811 należy przetrzymywać w klimatyzowanym, cylindrycznym szklanym wybiegu o średnicy od dziesięciu (10) do dwudziestu (20) metrów, wypełnionym do głębokości co najmniej dwóch i pół (2,5) metra glebą bagienną i stojącą słodką wodą. Należy go wyposażyć w różnorodne rośliny wodne pochodzące z jego rodzimego bagna."
      pt: "SCP-811 deve ser mantido em um recinto cilíndrico de vidro com controle climático, com diâmetro entre dez (10) e vinte (20) metros, preenchido até uma profundidade não inferior a dois metros e meio (2,5) com solo de zona úmida e água doce estagnada. Deve ser equipado com uma variedade de plantas aquáticas de seu pântano nativo."
      th: "SCP-811 ควรถูกเลี้ยงไว้ในกรงแก้วทรงกระบอกที่ควบคุมอุณหภูมิ มีเส้นผ่านศูนย์กลางระหว่างสิบ (10) ถึงยี่สิบ (20) เมตร เติมด้วยดินพื้นที่ชุ่มน้ำและน้ำจืดนิ่งให้ลึกไม่น้อยกว่าสองเมตรครึ่ง (2.5) ต้องจัดให้มีพืชน้ำหลากหลายชนิดจากหนองน้ำถิ่นกำเนิดของมัน"
      uk: "SCP-811 слід утримувати в кліматично контрольованому циліндричному скляному вольєрі діаметром від десяти (10) до двадцяти (20) метрів, заповненому щонайменше на два з половиною (2,5) метри болотним ґрунтом і застояною прісною водою. Вольєр має бути обладнаний різноманітними водними рослинами з рідного болота об'єкта."
      vi: "SCP-811 nên được giữ trong một lồng kính hình trụ có kiểm soát khí hậu, đường kính từ mười (10) đến hai mươi (20) mét, được đổ đầy đất đầm lầy và nước ngọt tù đọng đến độ sâu không dưới hai mét rưỡi (2,5). Lồng phải được trang bị nhiều loại thực vật thủy sinh từ đầm lầy quê hương của nó."
      zh: "SCP-811应被安置在一个气候受控的圆柱形玻璃围栏中，直径在十(10)至二十(20)米之间，填充湿地土壤和静止淡水，深度不低于二点五(2.5)米。围栏内应配置多种取自其原生沼泽的水生植物。"
      zh_Hant: "SCP-811應被安置在一個氣候受控的圓柱形玻璃圍欄中，直徑在十(10)至二十(20)公尺之間，填充濕地土壤和靜止淡水，深度不低於二點五(2.5)公尺。圍欄內應配置多種取自其原生沼澤的水生植物。"

  - scene: >
      Medium shot, waist-up, slightly elevated angle, looking down into
      the enclosure. On the left side of the frame, a D-Class subject in a
      full-body biohazard suit lowers a large log and a bucket of soil
      through an open airlock hatch into the wetland enclosure. On the
      right side of the frame, SCP-811 reaches eagerly toward the log with
      both long thin arms, an oddly gentle, pleased expression on its
      face.
    characters: [d-class, scp-811]
    caption:
      ja: "手頃な大きさの丸太や腐植質に富む追加の土壌を、模範的な行動の報酬として提供しても構いません。水槽は、なるべくDクラス職員によって、隔週で清掃する必要があります。"
      en: "Logs of manageable size and additional humus-rich soil may be provided for good behavior. Enclosure should be cleaned biweekly, preferably by D-Class personnel."
      cs: "Klády vhodné velikosti a dodatečná půda bohatá na humus mohou být poskytnuty jako odměna za dobré chování. Výběh by měl být čištěn jednou za dva týdny, nejlépe personálem třídy D."
      de: "Als Belohnung für gutes Verhalten können Baumstämme von handlicher Größe sowie zusätzlicher humusreicher Boden bereitgestellt werden. Das Gehege sollte alle zwei Wochen gereinigt werden, vorzugsweise durch D-Klasse-Personal."
      es: "Se pueden proporcionar troncos de tamaño manejable y suelo adicional rico en humus como recompensa por buen comportamiento. El recinto debe limpiarse cada dos semanas, preferiblemente por personal de Clase D."
      fr: "Des bûches de taille maniable et un supplément de sol riche en humus peuvent être fournis en récompense de bonne conduite. L'enceinte doit être nettoyée toutes les deux semaines, de préférence par du personnel de Classe D."
      it: "Tronchi di dimensioni gestibili e terreno aggiuntivo ricco di humus possono essere forniti come ricompensa per il buon comportamento. Il recinto dovrebbe essere pulito ogni due settimane, preferibilmente da personale di Classe D."
      ko: "행동이 양호할 경우 다루기 쉬운 크기의 통나무와 부식질이 풍부한 흙을 추가로 제공할 수 있다. 사육장은 격주로, 가급적 D계급 요원이 청소해야 한다."
      pl: "Kłody o rozsądnych rozmiarach oraz dodatkowa, bogata w próchnicę gleba mogą zostać zapewnione jako nagroda za dobre zachowanie. Wybieg powinien być czyszczony co dwa tygodnie, najlepiej przez personel Klasy D."
      pt: "Toras de tamanho manejável e solo adicional rico em húmus podem ser fornecidos como recompensa por bom comportamento. O recinto deve ser limpo quinzenalmente, preferencialmente por pessoal de Classe D."
      th: "อาจมอบท่อนไม้ขนาดพอเหมาะและดินที่อุดมด้วยฮิวมัสเพิ่มเติมเป็นรางวัลสำหรับพฤติกรรมที่ดี ควรทำความสะอาดกรงทุกสองสัปดาห์ โดยเฉพาะอย่างยิ่งโดยเจ้าหน้าที่ระดับดี"
      uk: "У якості винагороди за гарну поведінку можна надавати колоди зручного розміру та додатковий ґрунт, багатий на гумус. Вольєр слід чистити раз на два тижні, бажано силами персоналу класу D."
      vi: "Các khúc gỗ có kích thước vừa phải và đất giàu mùn bổ sung có thể được cung cấp như phần thưởng cho hành vi tốt. Lồng nên được vệ sinh hai tuần một lần, tốt nhất là bởi nhân sự Cấp D."
      zh: "作为良好行为的奖励，可提供大小适中的原木和额外的富含腐殖质的土壤。围栏应每两周清洁一次，最好由D级人员执行。"
      zh_Hant: "作為良好行為的獎勵，可提供大小適中的原木和額外的富含腐植質的土壤。圍欄應每兩週清潔一次，最好由D級人員執行。"

  - scene: >
      Close-up shot on the attending researcher's face and gloved hand,
      hovering just above an airlock door handle. A wall-mounted clock
      beside the door reads well past fifteen hours since the last
      recorded feeding time on a clipboard log hanging next to it. The
      researcher's eyes are wide, hesitant, not yet opening the door.
    characters: [attending-researcher-m]
    caption:
      ja: "対象には5kg以上の生餌を、前の食事の24時間後に与えてください。もしもSCP-811が16時間以上食事をとっていなかった場合、職員は水槽に入らないことが推奨されます。"
      en: "Subject is to be given at least five (5) kg of live food 24 hours after completion of its previous meal. It is recommended that personnel not enter the enclosure if SCP-811 has not fed in over 16 hours."
      cs: "Subjekt musí dostat alespoň pět (5) kg živé potravy 24 hodin po dokončení předchozího jídla. Personálu se doporučuje nevstupovat do výběhu, pokud SCP-811 nejedlo déle než 16 hodin."
      de: "Das Subjekt ist 24 Stunden nach Beendigung seiner vorherigen Mahlzeit mit mindestens fünf (5) kg Lebendfutter zu versorgen. Es wird empfohlen, dass Personal das Gehege nicht betritt, wenn SCP-811 seit über 16 Stunden nicht gefüttert wurde."
      es: "Se debe proporcionar al sujeto al menos cinco (5) kg de alimento vivo 24 horas después de completar su comida anterior. Se recomienda que el personal no entre al recinto si SCP-811 no ha comido en más de 16 horas."
      fr: "Le sujet doit recevoir au moins cinq (5) kg de nourriture vivante 24 heures après avoir terminé son précédent repas. Il est recommandé au personnel de ne pas entrer dans l'enceinte si SCP-811 n'a pas mangé depuis plus de 16 heures."
      it: "Al soggetto devono essere somministrati almeno cinque (5) kg di cibo vivo 24 ore dopo il completamento del pasto precedente. Si raccomanda al personale di non entrare nel recinto se SCP-811 non si è nutrito da oltre 16 ore."
      ko: "대상에게는 이전 식사를 마친 지 24시간 후 최소 5(5)kg의 살아있는 먹이를 공급해야 한다. SCP-811가 16시간 이상 먹이를 먹지 못한 경우 직원은 사육장에 들어가지 않는 것이 권장된다."
      pl: "Osobnikowi należy podać co najmniej pięć (5) kg żywej karmy 24 godziny po zakończeniu poprzedniego posiłku. Zaleca się, aby personel nie wchodził do wybiegu, jeśli SCP-811 nie jadło od ponad 16 godzin."
      pt: "O sujeito deve receber pelo menos cinco (5) kg de alimento vivo 24 horas após a conclusão de sua refeição anterior. Recomenda-se que o pessoal não entre no recinto se o SCP-811 não se alimentar há mais de 16 horas."
      th: "ต้องให้อาหารสดแก่ตัวอย่างอย่างน้อยห้า (5) กิโลกรัม 24 ชั่วโมงหลังจากมื้ออาหารก่อนหน้าเสร็จสิ้น ขอแนะนำว่าเจ้าหน้าที่ไม่ควรเข้าไปในกรงหาก SCP-811 ไม่ได้กินอาหารมาเกิน 16 ชั่วโมง"
      uk: "Об'єкту слід давати щонайменше п'ять (5) кг живого корму через 24 години після завершення попереднього прийому їжі. Персоналу рекомендується не заходити до вольєра, якщо SCP-811 не годувався понад 16 годин."
      vi: "Đối tượng phải được cho ăn ít nhất năm (5) kg thức ăn sống 24 giờ sau khi hoàn thành bữa ăn trước đó. Nhân viên được khuyến cáo không vào lồng nếu SCP-811 chưa ăn trong hơn 16 giờ."
      zh: "对象应在完成上一餐24小时后获得至少五(5)公斤活饵。若SCP-811超过16小时未进食，建议人员不要进入围栏。"
      zh_Hant: "對象應在完成上一餐24小時後獲得至少五(5)公斤活餌。若SCP-811超過16小時未進食，建議人員不要進入圍欄。"

  - scene: >
      Medium shot, low angle, showing the full-body biohazard suits. On
      the right side of the frame, a D-Class subject inside the enclosure
      has just tugged one glove halfway off, wincing at an itch on his
      wrist. On the left side of the frame, outside the glass, the
      attending researcher presses a hand flat against the glass, eyes
      wide, waving frantically for him to stop.
    characters: [d-class, attending-researcher-m]
    caption:
      ja: "水槽にいる間バイオハザードスーツを部分を問わず外した者は、どんな理由があれ、肢切断者という彼らの状態によって支障が及ばないようなプロジェクトへの配置転換を含めた懲戒処分の対象になります。"
      en: "Anyone who removes any part of their biohazard suit while still in the enclosure, for any reason at all, will be subject to disciplinary action, up to and including reassignment to a project that would not be adversely affected by their status as an amputee."
      cs: "Kdokoli si sundá jakoukoli část ochranného obleku, zatímco je stále ve výběhu, z jakéhokoli důvodu, bude podroben disciplinárnímu řízení, včetně případného převelení na projekt, který by nebyl nepříznivě ovlivněn jejich statusem amputovaného."
      de: "Jeder, der sich – aus welchem Grund auch immer – noch innerhalb des Geheges einen Teil seines Schutzanzugs auszieht, wird disziplinarisch belangt, bis hin zur Versetzung in ein Projekt, das durch seinen Status als Amputierter nicht beeinträchtigt würde."
      es: "Cualquiera que se quite alguna parte de su traje de bioseguridad mientras aún esté en el recinto, por cualquier motivo, será objeto de medidas disciplinarias, incluyendo la reasignación a un proyecto que no se vea afectado negativamente por su condición de amputado."
      fr: "Quiconque retire une partie quelconque de sa combinaison de biosécurité alors qu'il se trouve encore dans l'enceinte, pour quelque raison que ce soit, fera l'objet de mesures disciplinaires, pouvant aller jusqu'à une réaffectation à un projet qui ne serait pas affecté par son statut d'amputé."
      it: "Chiunque si tolga una qualsiasi parte della tuta antibiohazard mentre si trova ancora nel recinto, per qualsiasi motivo, sarà soggetto a provvedimenti disciplinari, fino al trasferimento a un progetto che non risentirebbe negativamente del suo status di amputato."
      ko: "이유를 막론하고 사육장 안에 있는 동안 방호복의 일부라도 벗는 자는 절단 장애인이라는 신분이 지장을 주지 않는 프로젝트로의 재배치를 포함한 징계 조치의 대상이 된다."
      pl: "Każdy, kto zdejmie jakąkolwiek część kombinezonu biohazardowego, będąc wciąż w wybiegu, z jakiegokolwiek powodu, zostanie poddany działaniom dyscyplinarnym, łącznie z przeniesieniem do projektu, na który nie wpłynie negatywnie jego status osoby po amputacji."
      pt: "Qualquer pessoa que remova qualquer parte de seu traje de biossegurança enquanto ainda estiver no recinto, por qualquer motivo, estará sujeita a ação disciplinar, incluindo a realocação para um projeto que não seria adversamente afetado por sua condição de amputado."
      th: "ผู้ใดที่ถอดชุดป้องกันสารชีวภาพส่วนใดส่วนหนึ่งออกขณะยังอยู่ในกรง ไม่ว่าด้วยเหตุผลใดก็ตาม จะต้องถูกดำเนินการทางวินัย ซึ่งอาจรวมถึงการโยกย้ายไปยังโครงการที่ไม่ได้รับผลกระทบจากสถานะการเป็นผู้พิการแขนขาขาด"
      uk: "Будь-хто, хто зніме будь-яку частину захисного костюма, перебуваючи у вольєрі, з будь-якої причини, підлягатиме дисциплінарному стягненню, аж до переведення на проєкт, на який не вплине негативно його статус ампутанта."
      vi: "Bất kỳ ai cởi bỏ bất kỳ phần nào của bộ đồ bảo hộ sinh học khi vẫn còn trong lồng, vì bất kỳ lý do gì, sẽ phải chịu hình thức kỷ luật, bao gồm cả việc điều chuyển sang một dự án không bị ảnh hưởng bởi tình trạng bị cụt chi của họ."
      zh: "任何人若在仍处于围栏内时脱下防护服的任何部分，无论出于何种理由，都将面临纪律处分，包括调往不会因其截肢者身份而受到不利影响的项目。"
      zh_Hant: "任何人若在仍處於圍欄內時脫下防護服的任何部分，無論出於何種理由，都將面臨紀律處分，包括調往不會因其截肢者身分而受到不利影響的專案。"
