id: scp-2295
title:
  ja: "SCP-2295：パッチワークのハートがあるクマ"
  en: "SCP-2295: The Bear with a Heart of Patchwork"
  cs: "SCP-2295: Mědvídek se Záplatovaným Srdcem"
  de: "SCP-2295: Der Bär mit einem Herz aus Flicken"
  es: "SCP-2295: El Oso con Corazón de Parches"
  fr: "SCP-2295: L'Ours au cœur de patchwork"
  it: "SCP-2295: The Bear with a Heart of Patchwork"
  ko: "SCP-2295: 심장을 가진 누비 헝겊 곰"
  pl: "SCP-2295: Miś z naszywką z sercem"
  pt: "SCP-2295: O Urso com Coração de Retalhos"
  th: "SCP-2295: หมีน้อยหัวใจปะติด"
  uk: "SCP-2295: Ведмедик із серцем з клаптиків"
  vi: "SCP-2295: Chú Gấu với một Trái Tim Chắp Vá"
  zh: "SCP-2295：缝心的熊"
  zh_Hant: "SCP-2295：有著拼布心臟的熊"
object_class: Safe
attribution:
