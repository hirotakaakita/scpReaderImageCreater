  de: "SCP-008: Zombieseuche"
  es: "SCP-008: Plaga Zombi"
  fr: "SCP-008: Peste zombie"
  it: "SCP-008: Piaga Zombie"
  ko: "SCP-008: 좀비 전염병"
  pl: "SCP-008: Plaga zombie"
  pt: "SCP-008: Epidemia Zumbi"
  th: "SCP-008: เชื้อซอมบี้"
  uk: "SCP-008: Чума зомбі"
  vi: "SCP-008: Dịch Bệnh Thây Ma"
