panels:
- scene: "Close view inside a hollow upper turtle shell as clear water disappears into its smooth interior without visible pores. Only a gloved hand and vessel edge enter the composition. Unknown biological shell material, not an actual living turtle. One square continuous scene, no text, captions, speech bubbles, borders, grids or inset images; do not imitate article attachments. Top-down close view of hollow shell interior, gloved hand at upper left tilts small plain vessel; smooth inside absorbs small stream without pores."
  characters: ["attending-researcher-f"]
  source:
    section: Description
    quote: "completely inert until"
    url: https://scp-wiki.wikidot.com/scp-107
    fetched_at: '2026-09-20'
  caption:
    ja: "SCP-107は空洞の亀の甲羅の上半分に似た物体です。内側に液体が触れるまでは不活性ですが、触れると目に見える孔がないのに液体を素早く吸収します。"
    en: "SCP-107 resembles the hollow upper part of a turtle shell. It stays inert until liquid touches the inside, then rapidly absorbs it despite having no visible pores."
    cs: "SCP-107 připomíná dutou horní část želvího krunýře. Je neaktivní, dokud se tekutina nedotkne vnitřku; pak ji rychle vstřebá, ačkoli nemá viditelné póry."
    de: "SCP-107 ähnelt dem hohlen Oberteil eines Schildkrötenpanzers. Es bleibt inaktiv, bis Flüssigkeit die Innenseite berührt, und absorbiert sie dann rasch ohne sichtbare Poren."
    es: "SCP-107 parece la parte superior hueca de un caparazón de tortuga. Permanece inerte hasta que un líquido toca el interior; entonces lo absorbe rápidamente, sin poros visibles."
    fr: "SCP-107 ressemble à la partie supérieure creuse d’une carapace de tortue. Il reste inerte jusqu’au contact d’un liquide avec l’intérieur, puis l’absorbe vite malgré l’absence de pores visibles."
    it: "SCP-107 somiglia alla parte superiore cava di un guscio di tartaruga. Resta inerte finché un liquido tocca l’interno, poi lo assorbe rapidamente pur senza pori visibili."
    ko: "SCP-107은 속이 빈 거북 등딱지의 윗부분처럼 보입니다. 안쪽에 액체가 닿기 전에는 비활성이지만, 닿으면 보이는 구멍이 없는데도 빠르게 흡수합니다."
    pl: "SCP-107 przypomina pustą górną część skorupy żółwia. Jest nieaktywny, dopóki płyn nie dotknie wnętrza; wtedy szybko go pochłania mimo braku widocznych porów."
    pt: "SCP-107 parece a parte superior oca de um casco de tartaruga. Fica inerte até um líquido tocar o interior; então o absorve rapidamente, sem poros visíveis."
    th: "SCP-107 คล้ายกระดองเต่าส่วนบนที่กลวง มันไม่ทำงานจนของเหลวสัมผัสด้านใน จากนั้นจะดูดซับอย่างรวดเร็วแม้ไม่มีรูพรุนที่มองเห็นได้"
    uk: "SCP-107 нагадує порожню верхню частину панцира черепахи. Він неактивний, доки рідина не торкнеться внутрішньої поверхні, а тоді швидко поглинає її без видимих пор."
    vi: "SCP-107 giống phần trên rỗng của mai rùa. Nó bất hoạt cho đến khi chất lỏng chạm mặt trong, rồi nhanh chóng hút chất lỏng dù không có lỗ nhìn thấy được."
    zh: "SCP-107像龟壳中空的上半部。液体接触内侧前，它保持不活跃；接触后，便在没有可见孔隙的情况下迅速吸收液体。"
    zh_Hant: "SCP-107像龜殼中空的上半部。液體接觸內側前，它保持不活躍；接觸後，便在沒有可見孔隙的情況下迅速吸收液體。"
- scene: "The shell's red edge glows dimly on dark ground; water rain falls outside the small dry exclusion area immediately surrounding it. Show natural water rain only, no colored precipitation, map, radius diagram or invented storm vortex. One square continuous scene, no text, captions, speech bubbles, borders, grids or inset images; do not imitate article attachments. Low side view of shell on dry ground, dim red rim clearly visible, curtain of water rain beyond at least half a metre; no rainfall touching shell."
