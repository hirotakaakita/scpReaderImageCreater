id: scp-107
title:
  ja: "SCP-107：亀の甲羅"
  en: "SCP-107: The Turtle Shell"
  cs: "SCP-107: Želví krunýř"
  de: "SCP-107: Der Schildkrötenpanzer"
  es: "SCP-107: El Caparazón de Tortuga"
  fr: "SCP-107: La Carapace de tortue"
  it: "SCP-107: Il Guscio di Tartaruga"
  ko: "SCP-107: 거북이 등딱지"
  pl: "SCP-107: Żółwia skorupa"
  pt: "SCP-107: O Casco de Tartaruga"
  th: "SCP-107: กระดองเต่า"
  uk: "SCP-107: Панцир черепахи"
  vi: "SCP-107: Mai Rùa"
  zh: "SCP-107：空龟壳"
  zh_Hant: "SCP-107：龜甲"
