id: scp-681
title:
  ja: "SCP-681：敵性ヘリウム"
  en: "SCP-681: Hostile Helium"
  cs: "SCP-681: Hostile Helium"
  de: "SCP-681: Heimtückisches Helium"
  es: "SCP-681: Helio Hostil"
  fr: "SCP-681: Hélium hostile"
  it: "SCP-681: Elio Ostile"
  ko: "SCP-681: 너무 뻔한 괴물임"
  pl: "SCP-681: Wrogi Hel"
  pt: "SCP-681: Hélio Hostil"
  th: "SCP-681: Hostile Helium"
  uk: "SCP-681: Hostile Helium"
  vi: "SCP-681: Hostile Helium"
  zh: "SCP-681：杀人氦气"
  zh_Hant: "SCP-681：Hostile Helium"
object_class: Euclid
attribution:
  article: SCP-681
