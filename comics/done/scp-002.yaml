id: scp-002
title:
  ja: 'SCP-002："生きている"居間'
  en: 'SCP-002: The "Living" Room'
  cs: 'SCP-002: "Živá" místnost'
  de: 'SCP-002: Der Lebende Raum'
  es: 'SCP-002: El "Cuarto" Viviente'
  fr: 'SCP-002: La Salle a mangé'
  it: 'SCP-002: Soggiorno "Vivente"'
  ko: 'SCP-002: "살아있는" 방'
  pl: 'SCP-002: Żywy pokój'
  pt: 'SCP-002: O Quarto "Vivo"'
  th: 'SCP-002: ห้องมีชีวิต'
  uk: 'SCP-002: "Жива" кімната'
  vi: 'SCP-002: Căn Phòng "Sống"'
  zh: 'SCP-002：“生活”室'
  zh_Hant: 'SCP-002：生「活」起居室'
object_class: Euclid
attribution:
  article: SCP-002
  source_url: https://scp-wiki.wikidot.com/scp-002
