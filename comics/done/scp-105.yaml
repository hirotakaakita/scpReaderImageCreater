# SCP-105「アイリス」4コマ台本
# キャラにセリフは言わせない。captionは記事本文からの引用。

id: scp-105

title:
  en: "SCP-105: Iris"
  ja: "SCP-105：アイリス"
  cs: "SCP-105: Iris"
  de: "SCP-105: Iris"
  es: "SCP-105: Iris"
  fr: "SCP-105 : Iris"
  it: "SCP-105: Iris"
  ko: "SCP-105: 아이리스"
  pl: "SCP-105: Iris"
  pt: "SCP-105: Iris"
  th: "SCP-105: ไอริส"
  uk: "SCP-105: Айріс"
  vi: "SCP-105: Iris"
  zh: "SCP-105：爱瑞丝"
  zh_Hant: "SCP-105：愛瑞絲"

attribution:
  article: "SCP-105"
  author: "thedeadlymoose, Dantensen, DrClef"
  source_url: "http://scp-wiki.wikidot.com/scp-105"
  license: "CC BY-SA 3.0"

object_class: Euclid

characters: [researcher-hana]

panels:
  - scene: >
      Wide shot, full body, showing all of Dr. Hana's cluttered office
      from a corner angle. A colleague holds up an old-style Polaroid
      photograph showing a storage room shelf, pinning it to a corkboard
      on the wall as Dr. Hana glances over from her desk on the other
      side of the room.
    characters: [researcher-hana]
    caption:
      ja: "SCP-105（旧名アイリス・トンプソン）は白人女性であり、その生理機能は通常の人間と見分けがつかない。"
      en: "SCP-105 (formerly known as Iris Thompson) is a female human; her physiology is indistinguishable from that of a normal human being."
      cs: "SCP-105 (dříve známá jako Iris Thompsonová) je lidská žena; její fyziologie je k nerozeznání od běžného člověka."
      de: "SCP-105 (früher bekannt als Iris Thompson) ist eine menschliche Frau; ihre Physiologie ist von der eines gewöhnlichen Menschen nicht zu unterscheiden."
      es: "SCP-105 (antes conocida como Iris Thompson) es una mujer humana; su fisiología es indistinguible de la de un ser humano normal."
      fr: "SCP-105 (anciennement connue sous le nom d'Iris Thompson) est une femme humaine ; sa physiologie est indiscernable de celle d'un être humain ordinaire."
      it: "SCP-105 (in precedenza nota come Iris Thompson) è una donna umana; la sua fisiologia è indistinguibile da quella di un normale essere umano."
      ko: "SCP-105（구 명칭 아이리스 톰슨）는 인간 여성이며, 그 생리 기능은 일반적인 인간과 구별되지 않는다."
      pl: "SCP-105 (dawniej znana jako Iris Thompson) jest kobietą; jej fizjologia jest nieodróżnialna od fizjologii zwykłego człowieka."
      pt: "SCP-105 (anteriormente conhecida como Iris Thompson) é uma mulher humana; sua fisiologia é indistinguível da de um ser humano normal."
      th: "SCP-105 (เดิมชื่อไอริส ทอมป์สัน) คือมนุษย์เพศหญิง สรีรวิทยาของเธอไม่ต่างจากมนุษย์ทั่วไปแต่อย่างใด"
      uk: "SCP-105 (раніше відома як Айріс Томпсон) — жінка; її фізіологія не відрізняється від фізіології звичайної людини."
      vi: "SCP-105 (trước đây được biết đến với tên Iris Thompson) là một phụ nữ; sinh lý học của cô không thể phân biệt được với một con người bình thường."
      zh: "SCP-105（原名爱瑞丝·汤普森）是一名女性人类；她的生理机能与普通人无异。"
      zh_Hant: "SCP-105（原名愛瑞絲·湯普森）是一名女性人類；她的生理機能與普通人無異。"

  - scene: >
      Close-up shot centered on the corkboard and photograph, filling
      most of the frame: a pale disembodied female hand emerges straight
      out of the flat surface of the pinned photograph, fingers wiggling
      in the air. Dr. Hana's shocked face with huge eyes is a small
      sliver at the frame's edge.
    characters: [researcher-hana]
    caption:
      ja: "SCP-105がSCP-105-Bで撮影した写真を保持すると、その写真は静止画から撮影地点の実時間映像へと変化する。"
      en: "When SCP-105 holds a photograph taken by SCP-105-B, the image changes from a still photo to a real-time view of the location shown."
      cs: "Když SCP-105 drží fotografii pořízenou pomocí SCP-105-B, snímek se změní ze statické fotografie na obraz místa v reálném čase."
      de: "Hält SCP-105 ein mit SCP-105-B aufgenommenes Foto, wandelt sich das Bild von einem Standbild zu einer Echtzeitansicht des gezeigten Ortes."
      es: "Cuando SCP-105 sostiene una fotografía tomada con SCP-105-B, la imagen pasa de ser una foto fija a una vista en tiempo real del lugar mostrado."
      fr: "Lorsque SCP-105 tient une photo prise avec SCP-105-B, l'image passe d'une photo fixe à une vue en temps réel du lieu représenté."
      it: "Quando SCP-105 tiene in mano una foto scattata con SCP-105-B, l'immagine passa da una foto statica a una vista in tempo reale del luogo raffigurato."
      ko: "SCP-105가 SCP-105-B로 찍은 사진을 손에 들면, 그 사진은 정지된 이미지에서 촬영 장소의 실시간 영상으로 변화한다."
      pl: "Gdy SCP-105 trzyma zdjęcie zrobione aparatem SCP-105-B, obraz zmienia się z nieruchomego zdjęcia w widok danego miejsca w czasie rzeczywistym."
      pt: "Quando SCP-105 segura uma fotografia tirada com SCP-105-B, a imagem passa de uma foto estática para uma visão em tempo real do local mostrado."
      th: "เมื่อ SCP-105 ถือภาพถ่ายที่ถ่ายด้วย SCP-105-B ภาพนั้นจะเปลี่ยนจากภาพนิ่งเป็นภาพเรียลไทม์ของสถานที่ที่ปรากฏ"
      uk: "Коли SCP-105 тримає фотографію, зроблену SCP-105-B, зображення перетворюється зі статичного знімка на вигляд місця в реальному часі."
      vi: "Khi SCP-105 cầm một bức ảnh chụp bằng SCP-105-B, hình ảnh chuyển từ ảnh tĩnh sang cảnh quay trực tiếp của địa điểm được chụp."
      zh: "当SCP-105持有用SCP-105-B拍摄的照片时，画面会从静止照片转变为该地点的实时影像。"
      zh_Hant: "當SCP-105持有用SCP-105-B拍攝的照片時，畫面會從靜止照片轉變為該地點的即時影像。"

  - scene: >
      Medium shot, waist-up, dynamic diagonal composition spanning from
      the desk to the corkboard. The disembodied hand casually plucks the
      stapler off Dr. Hana's desk and pulls it smoothly back into the
      flat surface of the photograph. Dr. Hana lunges out of her chair,
      reaching too late, mouth open.
    characters: [researcher-hana]
    caption:
      ja: "SCP-105は写真を通じ、撮影地点の届く範囲にある物体を操作することができる。"
      en: "SCP-105 is able to reach through the photograph and manipulate objects within reach of the original point where it was taken."
      cs: "SCP-105 dokáže sáhnout skrze fotografii a manipulovat s předměty v dosahu původního místa, kde byla pořízena."
      de: "SCP-105 kann durch das Foto hindurchgreifen und Gegenstände in Reichweite des ursprünglichen Aufnahmeortes manipulieren."
      es: "SCP-105 es capaz de introducir la mano a través de la fotografía y manipular objetos al alcance del punto original donde fue tomada."
      fr: "SCP-105 est capable de passer la main à travers la photographie et de manipuler des objets à portée du point d'origine où elle a été prise."
      it: "SCP-105 è in grado di allungare la mano attraverso la fotografia e manipolare oggetti alla portata del punto originale in cui è stata scattata."
      ko: "SCP-105는 사진을 통해 손을 뻗어, 촬영 지점 근처에 있는 물체를 조작할 수 있다."
      pl: "SCP-105 potrafi sięgnąć przez fotografię i manipulować przedmiotami w zasięgu pierwotnego miejsca, w którym została zrobiona."
      pt: "SCP-105 é capaz de estender a mão através da fotografia e manipular objetos ao alcance do ponto original onde foi tirada."
      th: "SCP-105 สามารถยื่นมือผ่านภาพถ่ายเพื่อจัดการกับวัตถุที่อยู่ในระยะเอื้อมถึงจากจุดที่ถ่ายภาพเดิมได้"
      uk: "SCP-105 здатна простягнути руку крізь фотографію та маніпулювати об'єктами в межах досяжності від початкової точки зйомки."
      vi: "SCP-105 có thể đưa tay xuyên qua bức ảnh và điều khiển các vật thể trong tầm với của địa điểm gốc nơi bức ảnh được chụp."
      zh: "SCP-105能够将手伸入照片之中，操纵拍摄地点触手可及范围内的物体。"
      zh_Hant: "SCP-105能夠將手伸入照片之中，操縱拍攝地點觸手可及範圍內的物體。"

  - scene: >
      Wide shot, full body, eye level, pulled back to show the whole
      office again. Dr. Hana leans back in her chair staring blankly at
      the small empty space on her desk where the stapler used to be,
      arms crossed, one eyebrow raised in mild annoyance.
    characters: [researcher-hana]
    caption:
      ja: "SCP-105とSCP-105-B（あるいは他のカメラ）の接触は、現担当研究員の承認がある場合のみ許可される。"
      en: "SCP-105 and SCP-105-B are only to be allowed contact with each other with the approval of the current managing researcher."
      cs: "Kontakt mezi SCP-105 a SCP-105-B je povolen pouze se souhlasem aktuálně pověřeného výzkumníka."
      de: "Kontakt zwischen SCP-105 und SCP-105-B ist nur mit Genehmigung des aktuell zuständigen Forschers gestattet."
      es: "El contacto entre SCP-105 y SCP-105-B solo se permite con la aprobación del investigador a cargo en ese momento."
      fr: "Le contact entre SCP-105 et SCP-105-B n'est autorisé qu'avec l'approbation du chercheur responsable en poste."
      it: "Il contatto tra SCP-105 e SCP-105-B è consentito solo con l'approvazione del ricercatore responsabile in carica."
      ko: "SCP-105와 SCP-105-B의 접촉은 현재 담당 연구원의 승인이 있을 때만 허용된다."
      pl: "Kontakt między SCP-105 a SCP-105-B jest dozwolony wyłącznie za zgodą aktualnie odpowiedzialnego badacza."
      pt: "O contato entre SCP-105 e SCP-105-B só é permitido com a aprovação do pesquisador responsável atual."
      th: "การสัมผัสระหว่าง SCP-105 กับ SCP-105-B จะได้รับอนุญาตก็ต่อเมื่อได้รับการอนุมัติจากนักวิจัยผู้ดูแลในขณะนั้นเท่านั้น"
      uk: "Контакт між SCP-105 та SCP-105-B дозволяється лише за схваленням поточного відповідального дослідника."
      vi: "Sự tiếp xúc giữa SCP-105 và SCP-105-B chỉ được phép khi có sự chấp thuận của nhà nghiên cứu phụ trách hiện tại."
      zh: "SCP-105与SCP-105-B之间的接触，仅在现任负责研究员批准的情况下方可进行。"
      zh_Hant: "SCP-105與SCP-105-B之間的接觸，僅在現任負責研究員批准的情況下方可進行。"

addendum:
  ja: "補遺105-1：SCP-105-Bの単独使用は許可されておらず、常に監督者の同伴が義務付けられている。"
  en: "Addendum 105-1: Unsupervised use of SCP-105-B by SCP-105 is not permitted under any circumstances."
  cs: "Dodatek 105-1: Nedozorované použití SCP-105-B ze strany SCP-105 není za žádných okolností povoleno."
  de: "Anhang 105-1: Eine unbeaufsichtigte Nutzung von SCP-105-B durch SCP-105 ist unter keinen Umständen gestattet."
  es: "Adenda 105-1: El uso no supervisado de SCP-105-B por parte de SCP-105 no está permitido bajo ninguna circunstancia."
  fr: "Addendum 105-1 : L'utilisation non supervisée de SCP-105-B par SCP-105 n'est autorisée en aucune circonstance."
  it: "Addendum 105-1: L'uso non supervisionato di SCP-105-B da parte di SCP-105 non è consentito in nessuna circostanza."
  ko: "부록 105-1: SCP-105가 SCP-105-B를 감독자 없이 사용하는 것은 어떠한 경우에도 허용되지 않는다."
  pl: "Aneks 105-1: Użycie SCP-105-B przez SCP-105 bez nadzoru nie jest dozwolone w żadnych okolicznościach."
  pt: "Adendo 105-1: O uso não supervisionado de SCP-105-B por SCP-105 não é permitido em nenhuma circunstância."
  th: "ภาคผนวก 105-1: ห้ามมิให้ SCP-105 ใช้ SCP-105-B โดยไม่มีผู้ควบคุมดูแลไม่ว่ากรณีใดๆ"
  uk: "Додаток 105-1: Використання SCP-105-B суб'єктом SCP-105 без нагляду не дозволяється за жодних обставин."
  vi: "Phụ lục 105-1: Việc SCP-105 sử dụng SCP-105-B mà không có người giám sát không được phép trong bất kỳ trường hợp nào."
  zh: "补遗105-1：任何情况下都不允许SCP-105在无人监督的情况下单独使用SCP-105-B。"
  zh_Hant: "補遺105-1：任何情況下都不允許SCP-105在無人監督的情況下單獨使用SCP-105-B。"
