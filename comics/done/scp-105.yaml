# SCP-105「アイリス」4コマ台本
# キャラにセリフは言わせない。captionは記事本文（Description全体）からの引用。
# 2026-08-22改訂: 記事の実際の記述（外見・SCP-105-Bのカメラ・現象3種）に
# 即した内容に描き直し。旧版は記事に無いオリジナルの寸劇（ホチキス盗難）だった。

id: scp-105

title:
  en: "SCP-105: Iris"
  ja: "SCP-105：アイリス"
  cs: "SCP-105: Iris"
  de: "SCP-105: Iris"
  es: "SCP-105: Iris"
  fr: "SCP-105 : Iris"
  it: "SCP-105: Iris"
  ko: "SCP-105: 아이리스"
  pl: "SCP-105: Iris"
  pt: "SCP-105: Iris"
  th: "SCP-105: ไอริส"
  uk: "SCP-105: Айріс"
  vi: "SCP-105: Iris"
  zh: "SCP-105：爱瑞丝"
  zh_Hant: "SCP-105：愛瑞絲"

attribution:
  article: "SCP-105"
  author: "thedeadlymoose, Dantensen, DrClef"
  source_url: "http://scp-wiki.wikidot.com/scp-105"
  license: "CC BY-SA 3.0"

object_class: Safe

characters: [attending-researcher-f]

panels:
  - scene: >
      Wide shot, full body, eye level. In a plain clinical observation room,
      SCP-105 (a young blonde European woman with blue eyes, petite,
      unremarkable) stands calmly against a bare wall for an intake
      photograph, composed and cooperative. Off to the side, the attending researcher
      stands at a table, carefully examining a vintage early-1980s Polaroid
      instant camera with a magnifying loupe and taking notes on a
      clipboard.
    characters: [attending-researcher-f]
    caption:
      ja: "SCP-105(旧名アイリス・トンプソン)はブロンドで青い目の、健康なヨーロッパ系女性。SCP-105-Bは1982年製のポラロイドカメラです。"
      en: "SCP-105 (formerly Iris Thompson) is a blonde, blue-eyed European woman — otherwise normal. SCP-105-B is a 1982 Polaroid camera."
      cs: "SCP-105 (dříve Iris Thompsonová) je plavovlasá modrooká Evropanka, jinak zcela normální. SCP-105-B je fotoaparát Polaroid z roku 1982."
      de: "SCP-105 (früher Iris Thompson) ist eine blonde, blauäugige Europäerin – in jeder Hinsicht normal. SCP-105-B ist eine 1982 gebaute Polaroid-Kamera."
      es: "SCP-105 (antes Iris Thompson) es una europea rubia de ojos azules: normal en todo sentido. SCP-105-B es una cámara Polaroid de 1982."
      fr: "SCP-105 (anciennement Iris Thompson) est une Européenne blonde aux yeux bleus, normale par ailleurs. SCP-105-B est un Polaroid de 1982."
      it: "SCP-105 (in precedenza Iris Thompson) è un'europea bionda con occhi azzurri, normale per il resto. SCP-105-B è un Polaroid del 1982."
      ko: "SCP-105（구 아이리스 톰슨）는 금발에 파란 눈의 유럽계 여성으로, 모든 면에서 정상이다. SCP-105-B는 1982년제 폴라로이드 카메라다."
      pl: "SCP-105 (dawniej Iris Thompson) to blondwłosa Europejka o niebieskich oczach, poza tym zwykła. SCP-105-B to aparat Polaroid z 1982 roku."
      pt: "SCP-105 (antes Iris Thompson) é uma europeia loira de olhos azuis — normal em todos os aspectos. SCP-105-B é uma câmera Polaroid de 1982."
      th: "SCP-105 (เดิมชื่อไอริส ทอมป์สัน) เป็นหญิงยุโรปผมบลอนด์ตาสีฟ้า ปกติในทุกด้าน SCP-105-B คือกล้อง Polaroid ปี 1982"
      uk: "SCP-105 (раніше Айріс Томпсон) — білява блакитноока європейка, в іншому звичайна. SCP-105-B — фотоапарат Polaroid 1982 року."
      vi: "SCP-105 (trước đây là Iris Thompson) là phụ nữ châu Âu tóc vàng mắt xanh — bình thường về mọi mặt. SCP-105-B là máy ảnh Polaroid sản xuất năm 1982."
      zh: "SCP-105（原名爱瑞丝·汤普森）是金发碧眼的欧洲裔女性，一切正常。SCP-105-B是1982年制造的宝丽来相机。"
      zh_Hant: "SCP-105（原名愛瑞絲·湯普森）是金髮碧眼的歐洲裔女性，一切正常。SCP-105-B是1982年製造的寶麗來相機。"

  - scene: >
      Close-up shot centered on a Polaroid photograph held in the hands of
      SCP-105 (a young blonde European woman with blue eyes, petite),
      filling most of the frame: the photo does not look like a static
      picture but subtly shimmers, showing real, moving footage of the
      location it depicts instead of a still image. The attending researcher leans in
      from the side, eyes wide with fascination, watching the photograph
      closely.
    characters: [attending-researcher-f]
    caption:
      ja: "SCP-105がSCP-105-Bにより撮影された写真を所持している場合、写真は静止した画像から当該の場所のリアルタイムの映像へと変質します。"
      en: "When SCP-105 holds a photograph taken by SCP-105-B, the image changes from a still photo to a real-time view of the location shown."
      cs: "Když SCP-105 drží fotografii pořízenou pomocí SCP-105-B, snímek se změní ze statické fotografie na obraz místa v reálném čase."
      de: "Hält SCP-105 ein mit SCP-105-B aufgenommenes Foto, wandelt sich das Bild von einem Standbild zu einer Echtzeitansicht des gezeigten Ortes."
      es: "Cuando SCP-105 sostiene una fotografía tomada con SCP-105-B, la imagen pasa de ser una foto fija a una vista en tiempo real del lugar mostrado."
      fr: "Lorsque SCP-105 tient une photo prise avec SCP-105-B, l'image passe d'une photo fixe à une vue en temps réel du lieu représenté."
      it: "Quando SCP-105 tiene una foto scattata con SCP-105-B, l'immagine diventa una vista in tempo reale del luogo."
      ko: "SCP-105가 SCP-105-B로 찍은 사진을 손에 들면, 그 사진은 정지된 이미지에서 촬영 장소의 실시간 영상으로 변화한다."
      pl: "Gdy SCP-105 trzyma zdjęcie zrobione SCP-105-B, obraz zmienia się w widok danego miejsca w czasie rzeczywistym."
      pt: "Quando SCP-105 segura uma fotografia tirada com SCP-105-B, a imagem passa de uma foto estática para uma visão em tempo real do local mostrado."
      th: "เมื่อ SCP-105 ถือภาพถ่ายที่ถ่ายด้วย SCP-105-B ภาพนั้นจะเปลี่ยนจากภาพนิ่งเป็นภาพเรียลไทม์ของสถานที่ที่ปรากฏ"
      uk: "Коли SCP-105 тримає фото, зроблене SCP-105-B, воно перетворюється на вигляд місця в реальному часі."
      vi: "Khi SCP-105 cầm một bức ảnh chụp bằng SCP-105-B, hình ảnh chuyển từ ảnh tĩnh sang cảnh quay trực tiếp của địa điểm được chụp."
      zh: "当SCP-105持有用SCP-105-B拍摄的照片时，画面会从静止照片转变为该地点的实时影像。"
      zh_Hant: "當SCP-105持有用SCP-105-B拍攝的照片時，畫面會從靜止照片轉變為該地點的即時影像。"

  - scene: >
      Medium shot, dynamic diagonal composition. SCP-105 (a young blonde
      European woman with blue eyes, petite) holds a photograph out in
      front of her with both hands; a pale, disembodied female hand emerges
      straight out of the flat surface of the photo, reaching into the real
      room and closing its fingers around a small object on a nearby table.
      The attending researcher flinches back in shock, eyes huge, one hand raised
      defensively.
    characters: [attending-researcher-f]
    caption:
      ja: "SCP-105は写真を通じ、撮影地点付近の物体を操作できます。目撃者は、見えない穴から女性の手が伸びるのを報告しています。"
      en: "SCP-105 can reach through photos to manipulate nearby objects. Witnesses report a disembodied hand emerging from an invisible portal."
      cs: "SCP-105 dokáže sáhnout skrze foto a ovládat okolní předměty. Svědci hlásí netělesnou ruku z neviditelného portálu."
      de: "SCP-105 kann durch Fotos greifen und nahe Objekte bewegen. Zeugen berichten von einer körperlosen Hand aus einem Portal."
      es: "SCP-105 puede alcanzar objetos cercanos a través de fotografías. Testigos relatan una mano incorpórea que emerge de un portal invisible."
      fr: "SCP-105 peut agir sur des objets proches à travers une photo. Des témoins rapportent une main désincarnée surgissant d'un portail invisible."
      it: "SCP-105 può agire su oggetti vicini attraverso una foto. Testimoni riferiscono una mano incorporea che emerge da un portale invisibile."
      ko: "SCP-105는 사진을 통해 손을 뻗어 촬영 지점 근처의 물체를 조작할 수 있다. 목격자들은 보이지 않는 구멍에서 여성의 손이 뻗어 나와 동작을 수행하는 것을 보았다고 보고한다."
      pl: "SCP-105 potrafi sięgnąć przez zdjęcie i manipulować pobliskimi przedmiotami. Świadkowie zgłaszają bezcielesną dłoń z niewidzialnego portalu."
      pt: "SCP-105 consegue alcançar objetos próximos através de fotos. Testemunhas relatam uma mão incorpórea saindo de um portal invisível."
      th: "SCP-105 สามารถยื่นมือผ่านภาพถ่ายเพื่อจัดการวัตถุใกล้เคียงได้ ผู้พบเห็นรายงานว่าเห็นมือที่ไม่มีร่างกายยื่นออกมาจากช่องที่มองไม่เห็น"
      uk: "SCP-105 здатна сягнути крізь фото і рухати предмети поруч. Свідки бачать безтілесну руку з невидимого порталу."
      vi: "SCP-105 có thể đưa tay qua ảnh để điều khiển vật gần đó. Nhân chứng kể về một bàn tay vô hình thò ra từ cổng vô hình."
      zh: "SCP-105能够将手伸入照片，操纵拍摄地点触手可及范围内的物体。目击者报告称，看到一只脱离肉体的女性手臂从隐形洞口伸出并做出相应动作。"
      zh_Hant: "SCP-105能夠將手伸入照片，操縱拍攝地點觸手可及範圍內的物體。目擊者報告稱，看到一隻脫離肉體的女性手臂從隱形洞口伸出並做出相應動作。"

  - scene: >
      Wide shot, full body, eye level, pulled back to show the whole
      observation room. SCP-105 (a young blonde European woman with blue
      eyes, petite) sits at a table holding up two photographs side by side
      for comparison: one taken with the vintage Polaroid,
      from which a small ghostly hand emerges strongly and clearly, and one
      taken with an ordinary modern camera, from which only a faint,
      barely-visible hand weakly grasps at the air. The attending researcher sits
      across from her, comparing the two effects and writing notes, mildly
      impressed.
    characters: [attending-researcher-f]
    caption:
      ja: "SCP-105は他の写真でも物体を弱く操作できますが、精密な制御と能力向上はSCP-105-Bの写真でのみ可能です。"
      en: "SCP-105 can weakly affect objects through other photos, but fine control is only possible with SCP-105-B, which alone enhances her ability."
      cs: "SCP-105 dokáže slabě ovlivnit předměty i jinými fotografiemi, ale jemné ovládání umožňují jen snímky SCP-105-B."
      de: "SCP-105 kann Objekte auch mit anderen Fotos schwach beeinflussen, doch feine Kontrolle gelingt nur mit Fotos von SCP-105-B."
      es: "SCP-105 puede afectar débilmente objetos con otras fotos, pero el control preciso solo es posible con fotos de SCP-105-B."
      fr: "SCP-105 peut affecter faiblement des objets avec d'autres photos, mais seul SCP-105-B permet un contrôle précis."
      it: "SCP-105 può influenzare debolmente oggetti con altre foto, ma il controllo preciso è possibile solo con foto di SCP-105-B."
      ko: "SCP-105는 다른 사진으로도 물체에 약하게 영향을 줄 수 있지만, 정밀한 제어는 SCP-105-B의 사진으로만 가능하다."
      pl: "SCP-105 może słabo wpływać na przedmioty innymi zdjęciami, lecz precyzyjną kontrolę daje tylko SCP-105-B."
      pt: "SCP-105 pode afetar fracamente objetos com outras fotos, mas o controle preciso só é possível com fotos de SCP-105-B."
      th: "SCP-105 มีความสามารถจำกัดในการควบคุมวัตถุผ่านภาพถ่ายอื่น แต่จะควบคุมได้ละเอียดก็ต่อเมื่อใช้ภาพจาก SCP-105-B เท่านั้น ซึ่งเป็นภาพเดียวที่เพิ่มความสามารถของเธอได้อย่างมาก"
      uk: "SCP-105 може слабко впливати на предмети іншими фото, але точний контроль можливий лише зі SCP-105-B."
      vi: "SCP-105 có thể tác động yếu lên vật thể qua ảnh khác, nhưng kiểm soát chính xác chỉ có được với ảnh từ SCP-105-B."
      zh: "SCP-105通过其他相机拍摄的照片也能有限度地操纵物体，但只有使用SCP-105-B拍摄的照片才能实现精细控制，也只有这种照片能显著提升其能力。"
      zh_Hant: "SCP-105透過其他相機拍攝的照片也能有限度地操縱物體，但只有使用SCP-105-B拍攝的照片才能實現精細控制，也只有這種照片能顯著提升其能力。"

addendum:
  ja: "補遺105-1：SCP-105-Bの単独使用は許可されておらず、常に監督者の同伴が義務付けられている。"
  en: "Addendum 105-1: Unsupervised use of SCP-105-B by SCP-105 is not permitted under any circumstances."
  cs: "Dodatek 105-1: Nedozorované použití SCP-105-B ze strany SCP-105 není za žádných okolností povoleno."
  de: "Anhang 105-1: Eine unbeaufsichtigte Nutzung von SCP-105-B durch SCP-105 ist unter keinen Umständen gestattet."
  es: "Adenda 105-1: El uso no supervisado de SCP-105-B por parte de SCP-105 no está permitido bajo ninguna circunstancia."
  fr: "Addendum 105-1 : L'utilisation non supervisée de SCP-105-B par SCP-105 n'est autorisée en aucune circonstance."
  it: "Addendum 105-1: L'uso non supervisionato di SCP-105-B da parte di SCP-105 non è consentito in nessuna circostanza."
  ko: "부록 105-1: SCP-105가 SCP-105-B를 감독자 없이 사용하는 것은 어떠한 경우에도 허용되지 않는다."
  pl: "Aneks 105-1: Użycie SCP-105-B przez SCP-105 bez nadzoru nie jest dozwolone w żadnych okolicznościach."
  pt: "Adendo 105-1: O uso não supervisionado de SCP-105-B por SCP-105 não é permitido em nenhuma circunstância."
  th: "ภาคผนวก 105-1: ห้ามมิให้ SCP-105 ใช้ SCP-105-B โดยไม่มีผู้ควบคุมดูแลไม่ว่ากรณีใดๆ"
  uk: "Додаток 105-1: Використання SCP-105-B суб'єктом SCP-105 без нагляду не дозволяється за жодних обставин."
  vi: "Phụ lục 105-1: Việc SCP-105 sử dụng SCP-105-B mà không có người giám sát không được phép trong bất kỳ trường hợp nào."
  zh: "补遗105-1：任何情况下都不允许SCP-105在无人监督的情况下单独使用SCP-105-B。"
  zh_Hant: "補遺105-1：任何情況下都不允許SCP-105在無人監督的情況下單獨使用SCP-105-B。"
