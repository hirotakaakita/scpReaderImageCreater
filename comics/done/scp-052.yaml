id: scp-052
title:
  ja: "SCP-052：時間旅行列車"
  en: "SCP-052: Time-Traveling Train"
  cs: "SCP-052: Vlak cestující časem"
  de: "SCP-052: Zeitreisender Zug"
  es: "SCP-052: Tren que Viaja en el Tiempo"
  fr: "SCP-052: Train voyageant dans le temps"
  it: "SCP-052: Treno che Viaggia nel Tempo"
  ko: "SCP-052: 시간 여행 열차"
  pl: "SCP-052: Podróżujący w czasie pociąg"
  pt: "SCP-052: Trem Viajante do Tempo"
  th: "SCP-052: รถไฟกาลเวลา"
  uk: "SCP-052: Потяг-мандрівник у часі"
  vi: "SCP-052: Tàu Xuyên Thời Gian"
  zh: "SCP-052：时光列车"
  zh_Hant: "SCP-052：時空穿梭列車"
