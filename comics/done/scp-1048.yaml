id: scp-1048
title:
  ja: "SCP-1048：ビルダー・ベア"
  en: "SCP-1048: Builder Bear"
  cs: "SCP-1048: Stavitelský Medvídek"
  de: "SCP-1048: Baumeister-Bär"
  es: "SCP-1048: Osito Constructor"
  fr: "SCP-1048: Nounours bricoleur"
  it: "SCP-1048: Orso Costruttore"
  ko: "SCP-1048: 건축가 곰"
  pl: "SCP-1048: Budowniczy miś"
  pt: "SCP-1048: Urso Construtor"
  th: "SCP-1048: หมีนักสร้าง"
  uk: "SCP-1048: Ведмедик-будівельник"
  vi: "SCP-1048: Con Gấu Kiến Tạo"
  zh: "SCP-1048：泰迪熊建造者"
  zh_Hant: "SCP-1048：拼裝者小熊"
object_class: Keter
