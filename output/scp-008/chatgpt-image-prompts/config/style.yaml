# 絵柄の中央定義。ChatGPT Imagesへ渡す完成プロンプトは
# style_prompt + キャラクター定義 + caption(en) + scene + 構図規則 + 文字禁止規則で作る。
# 台本(comics/queue/*.yaml)側には絵柄を書かないこと。

prompt:
  style_prompt: >
    A single square Japanese manga illustration, one continuous scene
    captured in restrained hand-drawn black ink linework. Use off-white
    paper, pale gray wash shading, slightly rough sketch texture, and thin
    expressive contour lines; keep the image almost monochrome with only
    muted gray-green paper tone, never bright or saturated colors. Draw
    simple, clean anime faces and readable figures, matching the existing
    SCP comic line-art style. Capture a lightly comedic moment from an SCP
    Foundation incident report with a hint of eerie atmosphere. If the
    Scene below does not specify a setting, default to a plain containment-
    facility interior (concrete corridors, fluorescent lights,
    institutional props) — but always follow whatever setting the Scene
    actually describes instead.

  composition_rules: >
    One unified, seamless illustration filling the entire square image
    edge to edge, depicting a single continuous moment in time. Characters
    drawn at a readable size, main subject clearly visible. Consistent
    character designs must be kept exactly as described. Follow the pose
    and motion described in the Scene below exactly, including deliberate
    stillness or a static pose when the Scene specifically calls for it.
    Only when the Scene leaves the pose unspecified, default to dynamic,
    asymmetric poses and motion (mid-stride, leaning, reaching, turning)
    over static front-facing standing poses. If the Scene shows a plain
    indoor room without describing the wall/floor color, render them in a
    flat, consistent pale cream-gray paper color (color RGB 238,233,218)
    — do not render it noticeably lighter or darker than this; for any
    other setting the Scene describes, follow the Scene's colors instead.

  no_text_rules: >
    ABSOLUTE RULE, HIGHEST PRIORITY: this image contains ZERO text of any
    kind. Do not draw any letters, words, numbers, logos, signage, or
    written characters in any language, anywhere in the image, for any
    reason — not on objects, walls, screens, books, or clothing. Do not draw
    any speech bubbles, thought bubbles, dialogue boxes, or sound-effect
    lettering. Leave clean, empty, uncluttered background areas instead of
    text or bubbles.

# ChatGPT Imagesへ添付する参照画像の運用。
handoff:
  use_previous_panels_as_reference: true
  max_previous_panels: 2
