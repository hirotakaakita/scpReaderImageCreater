# ============================================================
# 漫画のレイアウト定義（コマ数・サイズ・吹き出し・フッター）
#
# コマ数は台本のpanelsの数で決まる（4コマ→8コマは台本を8panelsにするだけ）。
# 8コマを2列にしたい場合は strip.columns: 2 にする。
# コマのサイズは全漫画で統一される。
# ============================================================

panel:
  width: 720          # 最終画像上のコマの幅(px)
  height: 720         # 高さ(px)。正方形推奨（生成時のaspect_ratioと合わせる）

strip:
  columns: 1          # 列数。4コマ=1列、8コマなら1列(縦長) or 2列(4コマ×2本)
  column_order: ltr   # 2列以上のときの列の並び順: ltr(左→右) / rtl(右→左)
  gutter: 20          # コマ間の余白(px)
  margin: 28          # 外周の余白(px)
  background: "#FFFFFF"
  panel_border_width: 4
  panel_border_color: "#000000"

# タイトル帯（テキストは言語別にembed_text.pyが描く）
header:
  height: 96
  font_size: 40
  color: "#000000"
  rule_width: 3       # タイトル下の罫線

# ライセンス表記帯（compose.pyが自動で描く）
footer:
  height: 112
  font_size: 20
  color: "#333333"
  line_spacing: 8
  rule_width: 2

# 吹き出しの見た目
bubble:
  fill: "#FFFFFF"
  outline: "#000000"
  outline_width: 3
  corner_radius: 22
  padding: 16         # 吹き出し内の文字余白
  font_size: 30       # 基本サイズ。入らない場合は自動縮小
  min_font_size: 14
  line_spacing: 4
  text_color: "#000000"
  tail_length: 34     # しっぽの長さ
  tail_width: 26      # しっぽの根元の幅

# 吹き出し位置プリセット（コマ内の正規化座標 x, y, w, h）
# 台本では position: top などと書く。数値指定 {x: 0.1, y: 0.1, w: 0.5, h: 0.2} も可。
bubble_presets:
  top:          {x: 0.06, y: 0.04, w: 0.88, h: 0.26}
  top-left:     {x: 0.04, y: 0.04, w: 0.56, h: 0.28}
  top-right:    {x: 0.40, y: 0.04, w: 0.56, h: 0.28}
  bottom:       {x: 0.06, y: 0.70, w: 0.88, h: 0.26}
  bottom-left:  {x: 0.04, y: 0.68, w: 0.56, h: 0.28}
  bottom-right: {x: 0.40, y: 0.68, w: 0.56, h: 0.28}
  center:       {x: 0.15, y: 0.36, w: 0.70, h: 0.28}
