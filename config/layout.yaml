# ============================================================
# 漫画のレイアウト定義（コマ数・サイズ・吹き出し・フッター）
#
# コマ数は台本のpanelsの数で決まる（4コマ→8コマは台本を8panelsにするだけ）。
# 8コマを2列にしたい場合は strip.columns: 2 にする。
# コマのサイズは全漫画で統一される。
# ============================================================

panel:
  width: 720          # 最終画像上のコマの幅(px)
  height: 720         # 高さ(px)。正方形推奨（生成時のaspect_ratioと合わせる）

strip:
  columns: 1          # 列数。4コマ=1列、8コマなら1列(縦長) or 2列(4コマ×2本)
  column_order: ltr   # 2列以上のときの列の並び順: ltr(左→右) / rtl(右→左)
  gutter: 20          # コマ間の余白(px)。コマ同士はこの余白だけで区切る（縁取りは描かない）
  margin: 28          # 外周の余白(px)
  background: "#FFFFFF"

# タイトル帯（テキストは言語別にembed_text.pyが描く）
# object_classを台本に書くと、タイトル下にオブジェクトクラスのサブタイトルが入る
# （その分タイトル自体は上寄りに縮む）
header:
  height: 120
  font_size: 40
  subtitle_font_size: 22
  color: "#000000"
  rule_width: 3       # タイトル下の罫線

# 各コマの絵の上（内側）に重ねるSCP文書調キャプション枠（台本のpanels[].captionを描く。
# 台本にcaptionが無いコマは枠ごと省略される）。
# 吹き出しと同様、caption_presetsで確保した最大領域の中で文字量に合わせて箱が縮む
# （幅いっぱいのバナーにはならず、コマの隅に収まる小さな箱になる）。
caption:
  # コマごとの既定配置。"alternate"なら偶数コマ=top-left/奇数コマ=top-right で
  # 左寄り・右寄りが交互になる。固定したい場合はプリセット名（例: top-left）を書く。
  # 台本のpanelsで caption_position を指定すれば個別に上書き可。
  default_position: alternate
  font_size: 20
  min_font_size: 12
  line_spacing: 4
  padding: 12
  fill: "#FFFFFF"
  outline: "#000000"
  outline_width: 2
  text_color: "#000000"

# キャプションの最大領域プリセット（コマ内の正規化座標 x, y, w, h）。
# 実際の箱はこの領域内で文字量に合わせて縮み、anchor側の隅に寄せて配置される。
caption_presets:
  top-left:     {x: 0.06, y: 0.06, w: 0.60, h: 0.40}
  top-right:    {x: 0.34, y: 0.06, w: 0.60, h: 0.40}
  bottom-left:  {x: 0.06, y: 0.54, w: 0.60, h: 0.40}
  bottom-right: {x: 0.34, y: 0.54, w: 0.60, h: 0.40}

# 最後のコマの下に置く補遺ボックス（台本のaddendumを描く。無ければ省略）
addendum:
  height: 84
  gap: 16             # 最後のコマとの間隔(px)
  font_size: 20
  min_font_size: 12
  line_spacing: 4
  padding: 12
  fill: "#FFFFFF"
  outline: "#000000"
  outline_width: 2
  text_color: "#000000"

# ライセンス表記帯（compose.pyが自動で描く）
footer:
  height: 112
  font_size: 20
  color: "#333333"
  line_spacing: 8
  rule_width: 2

# 吹き出しの見た目
bubble:
  fill: "#FFFFFF"
  outline: "#000000"
  outline_width: 3
  corner_radius: 22
  padding: 16         # 吹き出し内の文字余白
  font_size: 30       # 基本サイズ。入らない場合は自動縮小
  min_font_size: 14
  line_spacing: 4
  text_color: "#000000"
  tail_length: 34     # しっぽの長さ
  tail_width: 26      # しっぽの根元の幅

# 吹き出し位置プリセット（コマ内の正規化座標 x, y, w, h）
# 台本では position: top などと書く。数値指定 {x: 0.1, y: 0.1, w: 0.5, h: 0.2} も可。
bubble_presets:
  top:          {x: 0.06, y: 0.04, w: 0.88, h: 0.26}
  top-left:     {x: 0.04, y: 0.04, w: 0.56, h: 0.28}
  top-right:    {x: 0.40, y: 0.04, w: 0.56, h: 0.28}
  bottom:       {x: 0.06, y: 0.70, w: 0.88, h: 0.26}
  bottom-left:  {x: 0.04, y: 0.68, w: 0.56, h: 0.28}
  bottom-right: {x: 0.40, y: 0.68, w: 0.56, h: 0.28}
  center:       {x: 0.15, y: 0.36, w: 0.70, h: 0.28}
