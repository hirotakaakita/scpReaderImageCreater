# ============================================================
# 絵柄・画像生成設定
# ============================================================

prompt:
  comfyui:
    style_prompt: >
      A single anime-style character illustration, one continuous scene
      capturing a lightly comedic moment from an SCP Foundation incident
      report. A hint of eerie SCP Foundation atmosphere. If the Scene below
      does not specify a setting, default to a plain containment-facility
      interior (concrete corridors, fluorescent lights, institutional props),
      but always follow the Scene when it specifies another setting.

    composition_rules: >
      One unified, seamless illustration filling the entire square image
      edge to edge, depicting a single continuous moment in time. Characters
      are drawn at a readable size and the main subject is clearly visible.
      Keep character designs exactly as described. Follow the pose and motion
      described in the Scene. If the Scene shows a plain indoor room without
      specifying wall/floor color, use pale cream-gray (RGB 238,233,218);
      otherwise follow the Scene.

    no_text_rules: >
      ABSOLUTE RULE, HIGHEST PRIORITY: this image contains ZERO text of any
      kind. Do not draw letters, words, numbers, logos, signage, written
      characters, speech bubbles, thought bubbles, dialogue boxes, or
      sound-effect lettering. Leave clean background areas instead.

generation:
  provider: comfyui
  aspect_ratio: "1:1"
  # Accepted/final panel pixels are defined by config/layout.yaml (currently
  # 720x720). Providers may render at a native square resolution; selection
  # normalizes the accepted asset to layout.panel pixels without distortion.
  use_previous_panels_as_reference: true
  max_reference_images: 6

  comfyui:
    server: "http://127.0.0.1:8188"
    workflow_path: "scripts/providers/comfyui/workflow_api_qwen_style.json"
    unet_name: "qwen_image_2512_fp8_e4m3fn.safetensors"
    clip_name: "qwen_2.5_vl_7b_fp8_scaled.safetensors"
    vae_name: "qwen_image_vae.safetensors"
    style_lora_name: "QwenImage_blackline.safetensors"
    style_lora_strength: 1.0
    # Qwen-Image native square generation. Do not make width/height unequal.
    # Accepted variants are normalized to layout.panel (720x720) by
    # scripts/select_variant.py.
    width: 1328
    height: 1328
    steps: 2
    cfg: 1
    sampler_name: euler
    scheduler: simple
    negative_prompt: "text, watermark, signature, blurry, lowres, extra limbs, bad anatomy, jpeg artifacts, duplicate character, extra person, cloned face, comic page, manga page, panel grid, four panel comic, multiple panels, comic strip, storyboard, page layout, panel borders, split screen"
    seed: -1
    max_retries: 3
    retry_wait_seconds: 10
    poll_interval_seconds: 3
    timeout_seconds: 600
