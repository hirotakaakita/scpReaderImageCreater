# ============================================================
# 絵柄の中央定義（ここを変えると全SCP漫画の画風が変わる）
#
# 各コマの生成プロンプトは以下の順で組み立てられる:
#   style_prompt + キャラクター定義 + 台本のscene + composition_rules + no_text_rules
# 台本(comics/queue/*.yaml)側には絵柄を書かないこと。
# ============================================================

style_prompt: >
  Japanese yonkoma manga panel illustration. Clean bold black ink outlines,
  flat cel-shaded colors with soft muted palette, simple uncluttered
  backgrounds, expressive cartoon characters with slightly chibi proportions,
  gentle lighting. The mood is lightly comedic with a hint of eerie SCP
  Foundation atmosphere (concrete corridors, fluorescent lights, containment
  facility props).

# 構図の共通ルール（全コマに付与）
composition_rules: >
  Single manga panel, full-bleed illustration filling the entire square image.
  Characters drawn at a readable size, main subject clearly visible.
  Consistent character designs must be kept exactly as described.

# 文字を入れないためのルール（テキストは後からPythonで埋め込む）
no_text_rules: >
  IMPORTANT: Do not draw any text, letters, numbers, logos, speech bubbles,
  captions, sound effect lettering, or written signs anywhere in the image.
  The image must be completely free of text. Leave clean empty space where
  indicated so a speech bubble can be added later.

# 生成APIの設定
generation:
  # 呼び出し先:
  #   gemini      -> Google AI Studio直接（GEMINI_API_KEY, GCPの請求先アカウント紐付けが必要）
  #   openrouter  -> OpenRouter経由（OPENROUTER_API_KEY, openrouter.aiのクレジット残高で課金）
  # どちらも同じGeminiモデルを叩く。Gemini画像生成モデルは無料枠が無い（0 quota）ため、
  # いずれかの課金設定は必須。
  provider: openrouter
  # モデルは無印（Gemini API形式）で書く。providerがopenrouterの場合はコード側で
  # "google/"を自動的に前置してOpenRouterのモデルスラッグに変換する。
  # gemini-2.5-flash-image（安価・検証向け） / gemini-3-pro-image-preview（Nano Banana Pro・高品質）
  model: gemini-2.5-flash-image
  aspect_ratio: "1:1"                 # コマは正方形で統一（layout.yamlのpanelと合わせる）
  image_size: null                    # Pro専用（"1K"/"2K"/"4K"）。flashでは null にする
  max_retries: 3
  retry_wait_seconds: 20
  # 同じ漫画の直前のコマを参照画像として渡し、コマ間のキャラ一貫性を上げる
  use_previous_panels_as_reference: true
  max_reference_images: 6
