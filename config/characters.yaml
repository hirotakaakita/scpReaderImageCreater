# ============================================================
# 登場キャラクターの中央定義
#
# 複数のSCP漫画に登場するキャラクターはここで一元管理する。
# 台本(panels[].characters)からキー名で参照すると、descriptionが
# 生成プロンプトに自動で挿入され、reference_imagesが参照画像として渡される。
#
# 【重要】ここに載せるのは実在のSCP財団正史（キャノン）に登場する職員・人物のみ。
# 各SCP記事に固有の登場人物は書かれていないことが多いので、Dr. Hanaのような
# その場しのぎの創作キャラを勝手に作って繰り返し使い回さないこと。
# 選定元: http://scp-jp.wikidot.com/personnel-and-character-dossier
# （財団職員・要注意人物の公式人物ファイル集。他のキャラを追加する場合もここから選ぶ）
#
# ある漫画1本にしか出ない、その場限りの人物・オブジェクトは無理にここへ追加せず、
# 台本のsceneに直接書く（CLAUDE.md参照）。
#
# 参照画像の運用:
#   初回生成後、気に入ったコマから該当キャラの立ち姿を切り出して
#   characters/refs/<キー名>.png として保存し、reference_imagesに登録すると
#   以後の漫画で見た目が固定される。
#
# 注意: 服装に文字・番号を入れない（画像に文字を描かせないため）。
# 色を指定する際は色名だけでなく "(color RGB R,G,B)" の形で具体的な数値も
# 併記する（例: "red hair (color RGB 180,45,40)"）。色名だけだとコマごとに
# 明るさ・色味がブレやすいことを検証で確認したため。
# ============================================================

characters:

  dr-sage-west:
    name: Dr. Sage West
    # 出典: personnel-and-character-dossier「セージ・ウェスト博士」
    # サイト-404化学部門所属。小柄で赤毛、爆竹のように強烈な人物。
    description: >
      Dr. Sage West, a female SCP Foundation researcher in the chemistry
      department. Petite and short, with vivid red hair (color RGB
      180,45,40) worn short and messy, a tousled bob falling just past her
      chin, a fiery and quick-tempered presence. Wears a plain white lab
      coat, sleeves often rolled up, over a dark turtleneck and trousers,
      with a blank white ID card clipped to the chest pocket.
    reference_images: []

  dr-johannes-sorts:
    name: Dr. Johannes Sorts
    # 出典: personnel-and-character-dossier「ヨハネス・ソーツ博士」
    # ミーム専門家・フィールド研究者。白人男性30代後半、無精髭、白髪交じりの
    # 茶髪、小太り、常に灰色の帽子をかぶっている。
    description: >
      Dr. Johannes Sorts, a male SCP Foundation researcher in his late 30s,
      a memetics specialist and field researcher. White, unshaven, with
      short graying brown hair (color RGB 110,90,70) mostly hidden under a
      gray hat, slightly overweight build. Wears a plain white lab coat,
      somewhat rumpled, over a plain shirt and khaki trousers, with a blank
      white ID card clipped to the chest pocket.
    reference_images: []

  d-class:
    # D-classは財団正史でも基本的に無名・使い捨ての被験者として描かれる役割
    # （特定の人格を持つキャノンキャラクターではない）。そのため見た目も
    # 個性を持たせすぎない、汎用的な記述にとどめる。財団職員ではないため
    # 白衣は着せない（つなぎのみ）。
    # 正史ではオレンジのつなぎだが、このプロジェクトの画風（モノクロ・
    # リソグラフ調）だとオレンジだけ浮いて見えるため、周囲と馴染む
    # 濃いグレーのつなぎに変更している（画風優先の意図的な変更）。
    name: D-Class Personnel
    description: >
      An anonymous D-class test subject, with short, plain, unremarkable
      dark hair (color RGB 30,30,30) with no particular style. Wears a
      plain jumpsuit in a solid dark gray color (RGB 90,90,90, no other
      colors on it) with no markings, and gray sneakers, no lab coat.
      Nervous expression.
    reference_images: []

  attending-researcher-m:
    # 記事本文に固有の担当者が書かれていない場合の「立ち会う財団職員」役。
    # dr-sage-west/dr-johannes-sortsのような特定の個性を持つキャノンキャラを
    # 本来不要な単なる立会人役に流用すると見た目・性格の印象がズレるため、
    # d-classと同様に無個性・汎用的な記述の職員として別途用意している。
    name: Attending Researcher (Male)
    description: >
      A male SCP Foundation researcher with short, neatly combed black hair
      (color RGB 20,20,20), unremarkable average build, neutral calm
      expression, no distinguishing features. Wears a plain white lab coat
      over a collared shirt and dark trousers, with a blank white ID card
      clipped to the chest pocket.
    reference_images: []

  attending-researcher-f:
    # 同上（女性版）。
    # モノクロ画風では髪の「色」の違いが塗りの濃淡だけでは判別しづらく、
    # メガネ等の形状特徴を追加してみたが、参照画像なしのtxt2imgでは
    # その特徴が他キャラ（SCP-105側）にも混入してしまい逆効果だったため、
    # 元の記述に戻した。この画像生成方式（キャラ参照画像なし）での
    # 見た目の完全な描き分けは既知の限界として許容する。
    name: Attending Researcher (Female)
    description: >
      A female SCP Foundation researcher with straight black hair (color
      RGB 20,20,20), shoulder-length, tied back in a low ponytail,
      unremarkable average build, neutral calm expression, no distinguishing
      features. Wears a plain white lab coat over a dark turtleneck and
      trousers, with a blank white ID card clipped to the chest pocket.
    reference_images: []
